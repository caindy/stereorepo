# The channel's verbs, once (solorepo's DR-117): which program each is a verb of, the
# shape it is typed in, what it does, and which Role holds it.
#
# A Role's reading of PR First is compiled from this, so a reading names no
# verb its Role does not hold; the programs' parsers are held to it by
# `check.py`, so a verb here that does not parse, or one that parses and is
# not here, is a gate failure. The programs themselves carry no list: a
# program's `--help` is its parser, and this is its reading. It sits beside
# the programs rather than under `assertions/`, which is walked against the
# ontology and holds its instances; this is the channel's own table, and a
# portfolio takes it with the directory.
#
# `held_by` is who uses a verb, not who may. Every Role that may speak may
# perform every one of these (solorepo's DR-116), and a reading is a Job's, not a
# Permission. `solo` and `workflow` are not Roles — the solo directs a coder
# session, and a workflow runs a verb as a Role — and name the verbs no Role's
# reading carries: they are found in the program's `--help`, when the solo
# asks for one.

discipline: PR First

programs:
  - name: post
    path: .meta/say/post
    concern: >-
      What is said on GitHub under the Trailer: a comment, a thread on the
      diff, a reply, an answer, a promotion, what landed, the reviewer's
      verdict.
    verbs:
      - name: comment
        usage: "<n> < body.md"
        does: a comment on a pull request or an Issue
        held_by: [coder, reviewer]
      - name: raise
        usage: "<pr> <path> <line> < body.md"
        does: open a thread on a line of the diff, at the pull request's head
        held_by: [reviewer]
      - name: notice
        usage: "<pr> <path> <line> < body.md"
        does: "noticed and not done: the marker and the mention supplied, held open for the solo"
        held_by: [coder]
      - name: reply
        usage: "<thread-id> < body.md"
        does: "argue: a reply that leaves the thread open"
        held_by: [reviewer]
      - name: answer
        usage: "<thread-id> < body.md"
        does: >-
          answer: reply, then resolve; refused when this Actor is the thread's
          sole author, unless the reply links an Issue, which is what a
          promotion looks like (solorepo's DR-127) — which resolves the
          thread immediately (solorepo's DR-289)
        held_by: [coder]
      - name: resolve
        usage: "<thread-id>"
        does: >-
          resolve a review thread whose answer or promotion link is already
          posted; refused for a thread only its caller's own Trailer speaks on,
          unless it carries an answering commit or a valid promotion link (solorepo's DR-289)
        held_by: [coder, reviewer, solo]
      - name: promote
        usage: "<thread-id> --title T [--difficulty D --mandate \"<his words>\"] [--no-resolve] < issue-body.md"
        does: >-
          at approval: file the Issue with the Issue form's body, `challenge`
          alone for the reviewer to read unless the solo mandates a level, which
          a run may not hold and which `--mandate` quotes him asking for;
          the words refused without a level to stand behind, and every level but
          `human` refused without the words, `human` asking for the solo and so
          asking for no mandate;
          reply with the link, and resolve the thread (solorepo's DR-289), unless --no-resolve is passed
        held_by: [coder, reviewer, solo]
      - name: correct
        usage: "<comment> [--withdraw] < body.md"
        does: >-
          replace the body of a comment this Role's account posted — on the
          conversation or on the diff, named by the URL the verb that posted it
          printed or by that identifier alone — or withdraw it with
          `--withdraw`, which says nothing in its place and so takes no body,
          and which deletes that comment alone, preserving child replies on a
          review thread and removing the thread only when no replies remain; the
          replacement carries the correcting run's own Trailer, and a comment
          another account posted is refused, the account that said it being the
          one that corrects it (solorepo's DR-286)
        held_by: [coder, reviewer]
      - name: landed
        usage: "<pr>"
        does: post what landed for every Challenge the body closes, rendered from the record
        held_by: [coder]
      - name: review
        usage: "<pr> --approve|--request-changes|--comment < body.md"
        does: >-
          the verdict: approve, request changes, or comment; an approval may
          carry no body, and a verdict that withholds approval is
          `--request-changes`, which is the state GitHub reports and every
          reader of it moves on — a comment verdict left over threads owed an
          answer is read as one anyway, so the prose and the state say the same
          thing either way (solorepo's DR-265)
        held_by: [reviewer]

  - name: move
    path: .meta/say/move
    concern: >-
      What changes state on GitHub: an Issue filed, triaged, moved between
      levels, re-pointed at what it waits on, claimed, handed back or
      obviated; a pull request opened, layered, revised, merged, superseded or
      advanced; a review requested; a coder pass dispatched; a Milestone set; a
      Decision's number reserved.
    verbs:
      - name: file
        usage: "--title T [--difficulty D --mandate \"<his words>\"|--roadmap] [--harness H] [--blocked-by <n>[,<n>]] < body.md"
        does: >-
          file a Challenge the form's way: `challenge` alone, for the reviewer to read
          and land a level on; with `--difficulty`, the solo's verdict given in advance,
          which skips the reviewer and which a run may not hold: every level but
          `human` is refused without `--mandate` quoting the words he asked for it
          in, since a level nobody asked for is one the agent inferred, `human`
          asking for the solo and so asking for no mandate; or a roadmap Issue, which
          lands no level, so `--mandate` there — or alone — is refused in turn,
          its words having no level to stand behind; with `--harness`, the solo's
          prerogative alone, attaching a `harness:<name>` label for known harnesses
          (claude, codex, copilot, gemini);
          `--blocked-by` sets the native blockers and the body's `**Waits on.**` line
          is rewritten to describe them; refused where the line names an `#<n>` the
          flag omits, and where its prose reads as part of a citation's sentence,
          which the rendered line would sever from what it explains
        held_by: [solo]
      - name: waits
        usage: "<issue> --on <n>[,<n>]|--off <n>[,<n>]|--clear"
        does: >-
          record or drop blockers on an Issue already filed: GitHub's
          blocked-by relationship and the `**Waits on.**` line together;
          refused on a blocker that is not an open Issue, on an Issue naming
          itself, on a cycle, and on a line whose prose cannot be safely
          rewritten; the reviewer's too, so a blocker its reading finds is
          recorded in the relationship the classifiers read rather than
          described in prose they do not
        held_by: [coder, reviewer, solo]
      - name: triage
        usage: "<issue> <level> < verdict.md"
        does: "the verdict on a Challenge read against the form and the tree, the body naming what was checked: posted on the Issue, then the level landed; refused in a run to every account but the reviewer's, since a run landing a level on the Challenge it raised is the raiser reading its own work, and refused where the body names no check or a level already stands, which `difficulty` moves; also makes a Challenge of an Issue that arrived without the form, or of a roadmap Issue whose blocker has closed"
        held_by: [reviewer, solo]
      - name: difficulty
        usage: "<issue> <level>"
        does: "move a Challenge's level: easy, medium, hard, human; a run lands `human` and no other, the rest being a verdict the reviewer gives; refused where no level stands, which is a Challenge no reviewer has read, `triage` being the act that lands a first one"
        held_by: [solo]
      - name: reread
        usage: "<issue>"
        does: "hand a Challenge back to the reviewer: its level taken off, which is the delivery the reading door fires on; refused to a run, which would undo in two acts a verdict it may not move in one, and on an Issue that is not a Challenge, one with no level to take off, one that is closed, which the door declines, or one a Job's claim stands on"
        held_by: [solo]
      - name: roadmap
        usage: "<issue>"
        does: "move an Issue onto the roadmap: `roadmap` lands, and any `challenge` and difficulty labels are stripped"
        held_by: [solo]
      - name: claim
        usage: "<issue>"
        does: "take an Issue: assign it to this Role's account; refused to a session on a Challenge no reviewer has read, and at `easy` or `medium`, which are the loop's until the Issue is moved to `hard`"
        held_by: [coder]
      - name: stop
        usage: "<issue> < body.md"
        does: "where this Job stopped and why; the claim released, the Issue to the solo as `human`, the pull request left open"
        held_by: [coder, workflow]
      - name: obviate
        usage: "<issue> --by <issue|pr> < body.md"
        does: >-
          close an Issue another answer overtook, as not planned, where each
          part of it went on stdin; the comment on the Issue and the backlink
          on what answered it, and the claim on the Issue left as it stands;
          refused unless `--by` names an open Challenge or a merged pull
          request
        held_by: [coder]
      - name: decompose
        usage: "<issue> < approved-plan.json"
        does: >-
          create the child Challenges in an approved hard Challenge's parent
          Epic from the exact JSON plan immediately preceding the solo's
          `Approve decomposition` comment; child Issues land with `challenge`
          alone for reviewer triage, carry native dependency links and are
          linked as GitHub sub-issues; partial retries recover matching child
          Issues rather than filing duplicates
        held_by: [coder]
      - name: open
        usage: "--title T [--base B|--on <pr>] < body.md"
        does: "open a draft pull request, the form filled, and request review (omitted for easy Challenges, solorepo's DR-291); --on opens a layer on that one and links the stack; the merge manager, advance and the reconciler pass over the draft; move ready takes it out at final reviewer approval (solorepo's DR-287)"
        held_by: [coder]
      - name: ready
        usage: "<pr>"
        does: "take a draft out of draft; refused while its branch changes no file against its base, so a plan-only pull request stays a draft (solorepo's DR-273)"
        held_by: [coder]
      - name: draft
        usage: "<pr>"
        does: "return an undrafted pull request to draft; the work-in-progress semaphore until final reviewer approval (solorepo's DR-287)"
        held_by: [coder]
      - name: layer
        usage: "<pr> --on <pr>"
        does: make an open pull request a layer on another
        held_by: [coder]
      - name: revise
        usage: "<n> [--title T] [< body.md]"
        does: >-
          replace a pull request's or an Issue's body, or its title; it does not
          change what blocks an Issue, which is GitHub's relationship and
          `waits`'s to set, and it refuses a `**Waits on.**` line citing an
          `#<n>` the relationship does not hold; the reviewer's for a Challenge
          whose first line it found wrong at reading
        held_by: [coder, reviewer]
      - name: supersede
        usage: "<pr> --by <pr|DR> < body.md"
        does: >-
          close a pull request another answer to its Challenge overtook, the
          reason on stdin; refused unless what `--by` names has landed — a
          merged pull request, or a Decision the trunk adopted — and the body
          closes a Challenge, and every Challenge it closes is closed already
        held_by: [coder]
      - name: merge
        usage: "<pr> [--stack|--auto]"
        does: "merge; a layer merges everything below it; --auto arms GitHub to merge when green"
        held_by: [coder, reviewer]
      - name: merge-manager
        usage: "[--dry-run]"
        does: "evaluate open pull requests against semaphores, rank eligible candidates by leverage, assert choices and deferrals out loud, and squash-merge the top candidate"
        held_by: [coder, workflow]
      - name: reconcile
        usage: "[--live] [--dry-run]"
        does: >-
          run the merge manager, then read every open Issue and pull request
          through the classifiers and perform what each is owed where no run is
          answering it — a rebase or review pass dispatched, a review requested
          again, a take dispatched, an unread Challenge re-delivered to the
          reviewer, a dead run's claim released; reported and not performed
          without --live
        held_by: [coder, workflow]
      - name: advance
        usage: "[<pr>]"
        does: >-
          rebase every armed pull request that has fallen behind its base back
          onto it, and dispatch the coder for every one this merge left
          conflicting while it waited on a review or on the merge
        held_by: [workflow]
      - name: dispatch
        usage: "<pr> --task review|rebase"
        does: >-
          start a coder pass on a pull request by hand: `review` for a verdict
          standing unanswered, `rebase` for a branch that conflicts or one
          behind its base that `gh pr update-branch --rebase` was refused on
        held_by: [solo]
      - name: delegate
        usage: "<issue|pr> [--level easy|medium]"
        does: >-
          hand a Challenge or pull request to the coder loop: sets an autonomous
          difficulty (`easy` or `medium`), refusing a run the level it lands —
          the default `medium` included — and refusing a `hard` or `human` Challenge
          unless `--level` is passed; dispatches `rebase` if conflicting, dispatches
          `review` for a verdict standing unanswered, refuses a clean pull
          request with no changes requested, or assigns the coder and triggers
          the loop on an unstarted Challenge
        held_by: [solo]
      - name: request-review
        usage: "<pr> [--to R]"
        does: >-
          hand off: request review from Role R's account, the reviewer's by
          default; refused on a branch GitHub reports as conflicting, which no
          review can run on
        held_by: [coder]
      - name: milestone
        usage: "<issue> --set T|--clear"
        does: put an Issue in a Milestone, creating it if new
        held_by: [solo]
      - name: mint
        usage: "[--concept <ident>]"
        does: >-
          issue the next Decision number and reserve it on GitHub, so two
          branches cannot take the same one; `--concept` reserves a Concept of
          the Ubiquitous Language instead, named by the identifier its row will
          carry, the reservation a new vocabulary row stands on; refused to a run
          unless the Challenge its branch names asks for the word by that
          identifier (solorepo's DR-276, solorepo's DR-282)
        held_by: [coder]

  - name: commit
    path: .meta/say/commit
    concern: "Git's: a commit as this Actor, the Trailers composed by the channel."
    verbs:
      - name: commit
        usage: "-m <subject> [--allow-empty] [< body]"
        does: "commit as this Actor; never `git commit`, which signs nothing"
        held_by: [coder]

  - name: whoami
    path: .meta/say/whoami
    concern: Which login the channel speaks as, and what it can reach.
    verbs:
      - name: whoami
        usage: ""
        does: which login this channel speaks as
        held_by: [coder, reviewer, workflow]

  - name: "on"
    path: .meta/say/on
    concern: >-
      The reviewer workflow's door, as the trunk-pinned program of the channel
      (solorepo's DR-264, solorepo's DR-284): what the reviewer's run reads and
      decides before its harness session, written where the workflow reads it,
      and what it reads back after.
    verbs:
      - name: reviewer
        usage: "before|between|after <n> [--verdicts N --agents N --ran H --transcript P]"
        does: >-
          the reviewer's door for what the number names. A Challenge is the
          reading door: before the session, whether the delivery is still the
          reviewer's, which harness reads, and what it reads written under
          .review/; after it, whether it was read. A pull request is the
          review door: before, which harness reviews, how deep, the diff, the
          head's trunk paths and the constraints written under .review/, and
          the verdicts already given, and the chain of rungs with the first
          rung's prompt; between two rungs, whether the next runs; after,
          with what only the workflow knows as flags, whether a verdict
          landed, the hook fired, and the fan-out ceiling was kept
        held_by: [workflow]
