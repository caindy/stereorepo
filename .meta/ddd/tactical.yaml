id: https://w3id.org/stereorepo/ddd/tactical
name: ddd-tactical
title: Domain-Driven Design — Tactical design
description: >-
  The building blocks of a model inside one Bounded Context.

  Entities are defined by identity and continuity; Value Objects by their
  attributes and nothing else. An Aggregate draws a consistency boundary and is
  reached only through its root. Repositories, Factories, Services,
  Specifications and Modules are how the model stays expressible in code without
  being reshaped by storage or by assembly.

  These are the patterns a *portfolio* reaches for when modelling its own domain.
  stereorepo mostly uses the strategic module.

  Republished per stereorepo's DR-016. These are Eric Evans' patterns, not
  stereorepo's: where this schema and the book disagree, the book wins and this
  schema is wrong.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ddd: https://w3id.org/stereorepo/ddd/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
default_prefix: ddd
default_range: string

imports:
  - linkml:types
  - core
  - strategic

slots:

  identified_by:
    description: How the Entity's identity is established and kept stable over time.

  invariants:
    description: What must hold true, stated so it can be checked.
    multivalued: true

  root:
    description: The Entity through which the Aggregate is reached.
    range: Entity

  members:
    description: The elements enclosed by the Aggregate boundary.
    range: DddElement
    multivalued: true

  aggregate:
    description: The Aggregate this element provides access to or creates.
    range: Aggregate

  creates:
    description: What the Factory produces.
    range: DddElement

  contains:
    description: The elements gathered under the Module.
    range: DddElement
    multivalued: true

  predicate:
    description: The condition the Specification states.

  # Container

classes:

  Entity:
    is_a: DddElement
    description: >-
      An object defined by identity and continuity rather than by its
      attributes. Two Entities with identical attributes are still two things.
      Evans, *Domain-Driven Design*, "Entities".
    slots:
      - identified_by
      - invariants
      - bounded_context

  ValueObject:
    is_a: DddElement
    description: >-
      An object that describes a characteristic and has no conceptual identity.
      Interchangeable when equal, and best kept immutable.
      Evans, *Domain-Driven Design*, "Value Objects".
    slots:
      - invariants
      - bounded_context

  Aggregate:
    is_a: DddElement
    description: >-
      A cluster of associated objects treated as one unit for data changes,
      reached only through its root, and forming a consistency boundary.
      Evans, *Domain-Driven Design*, "Aggregates".
    slots:
      - root
      - members
      - invariants
      - bounded_context
    slot_usage:
      root:
        required: true

  DomainEvent:
    is_a: DddElement
    description: >-
      Something that happened in the domain that domain experts care about,
      stated in the past tense.
    comments:
      - >-
        Postdates *Domain-Driven Design*; Evans added it in the later DDD
        Reference, and the community developed it. Marked because a reader
        looking for it in the original book will not find it.
    slots:
      - bounded_context

  DomainService:
    is_a: DddElement
    description: >-
      An operation that belongs to the domain but not naturally to any one
      Entity or Value Object. Stateless, and named for what it does.
      Evans, *Domain-Driven Design*, "Services".
    slots:
      - bounded_context

  Repository:
    is_a: DddElement
    description: >-
      Collection-like access to Aggregates, hiding how they are stored so that
      the model is not shaped by the database.
      Evans, *Domain-Driven Design*, "Repositories".
    slots:
      - aggregate
      - bounded_context

  Factory:
    is_a: DddElement
    description: >-
      Encapsulates the creation of a complex object or Aggregate, so that
      assembling one does not leak its internals to the caller.
      Evans, *Domain-Driven Design*, "Factories".
    slots:
      - creates
      - bounded_context

  Specification:
    is_a: DddElement
    description: >-
      A predicate as an object: states a constraint that can be used to select,
      to validate, or to build something satisfying it.
      Evans, *Domain-Driven Design*, "Specification".
    slots:
      - predicate
      - bounded_context

  Module:
    is_a: DddElement
    description: >-
      A named partition of the model that carries meaning, chosen so the names
      themselves tell you how the domain is divided.
      Evans, *Domain-Driven Design*, "Modules".
    slots:
      - contains
      - bounded_context
