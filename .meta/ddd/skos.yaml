id: https://w3id.org/stereorepo/ddd/skos
name: ddd-skos
title: Domain-Driven Design — Concepts
description: >-
  A vocabulary that can be talked about rather than only used.

  **Adopted from SKOS, not from DDD.** It has its own module so the departure is
  marked by structure instead of by a comment someone has to notice.

  A Ubiquitous Language is a set of Concepts, not a set of Terms (stereorepo's DR-018). A
  Concept is a unit of meaning identified by URI and decoupled from any label
  that denotes it. That decoupling is the whole point: a label collision is two
  Concepts sharing a label, which cannot be stated at all if the unit of the
  model is the word. It is also why this cannot be folded into the classes of a
  schema — in a TBox the classes *are* the meanings, so there is nowhere for a
  collision to live. SKOS is deliberately assertional for exactly this reason.

  Republished per stereorepo's DR-016. These are Eric Evans' patterns, not
  stereorepo's: where this schema and the book disagree, the book wins and this
  schema is wrong.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ddd: https://w3id.org/stereorepo/ddd/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
default_prefix: ddd
default_range: string

imports:
  - linkml:types
  - core

slots:

  pref_label:
    description: >-
      The one label to use for this Concept. Where a label collides across
      schemes, qualify it here — "Skill (APM primitive)" — so the preferred
      label is unambiguous on its own.
    exact_mappings:
      - skos:prefLabel

  alt_labels:
    description: >-
      Other labels denoting this same Concept — synonyms, acronyms, older names.
    multivalued: true
    exact_mappings:
      - skos:altLabel

  definition:
    description: What the Concept means inside its scheme.
    exact_mappings:
      - skos:definition

  scope_note:
    description: >-
      Where the Concept's boundary runs: what it covers, what it does not, and
      what it is likely to be mistaken for.
    exact_mappings:
      - skos:scopeNote

  in_scheme:
    description: The controlled vocabulary this Concept belongs to.
    range: ConceptScheme
    exact_mappings:
      - skos:inScheme

  broader:
    description: A Concept more general than this one.
    range: Concept
    exact_mappings:
      - skos:broader

  narrower:
    description: A Concept more specific than this one. The inverse of broader.
    range: Concept
    multivalued: true
    inverse: broader
    exact_mappings:
      - skos:narrower

  related:
    description: An associatively linked Concept, neither broader nor narrower.
    range: Concept
    exact_mappings:
      - skos:related

  confusable_with:
    description: >-
      A different Concept that shares or nearly shares a label with this one.
      Not a synonym: the two mean different things and the collision is the
      hazard being recorded.
    range: Concept
    multivalued: true
    close_mappings:
      - skos:related

  avoid:
    description: >-
      Labels not to use for this Concept: words that fragment the language by
      denoting it loosely. Distinct from confusable_with, which records a
      collision between two real Concepts rather than a word to stop using.
    multivalued: true
    close_mappings:
      - skos:hiddenLabel

  authority:
    description: Who owns the scheme and settles what its Concepts mean.

  namespace:
    description: URI prefix under which the scheme's Concepts are identified.
    range: uriorcurie

classes:

  ConceptScheme:
    description: >-
      A controlled vocabulary that Concepts belong to, with someone who owns it
      and settles what its Concepts mean. The three strata of stereorepo's DR-016 are three
      schemes; an outside vocabulary such as APM's primitives is a fourth.
    comments:
      - Adopted from SKOS, not DDD. Marked as a departure per stereorepo's DR-016.
    slots:
      - id
      - name
      - description
      - authority
      - namespace
    slot_usage:
      name:
        required: true
    exact_mappings:
      - skos:ConceptScheme

  Concept:
    description: >-
      A unit of meaning, identified by URI and decoupled from any label that
      denotes it. This decoupling is the point: a Ubiquitous Language is a set
      of Concepts, and a label collision is two Concepts sharing a label, which
      cannot even be stated if the unit of the model is the word.
    comments:
      - Adopted from SKOS, not DDD. Marked as a departure per stereorepo's DR-016.
      - >-
        Provenance is not a field here. It is read off in_scheme, so it cannot
        drift from the scheme the Concept actually belongs to.
      - >-
        Labels are untagged. SKOS tags each label with a language, which a
        multilingual thesaurus needs and a one-person portfolio does not; add
        tagging when a second language actually appears rather than before.
      - >-
        LinkML also anchors enum values to concept URIs via `meaning`. It is not
        used here because there is no authoritative URI set for DDD's patterns to
        anchor to, and minting URIs that only look canonical would be worse than
        leaving the values unanchored.
    slots:
      - id
      - pref_label
      - alt_labels
      - definition
      - scope_note
      - in_scheme
      - broader
      - narrower
      - related
      - confusable_with
      - avoid
    slot_usage:
      pref_label:
        required: true
      definition:
        required: true
      in_scheme:
        required: true
    exact_mappings:
      - skos:Concept
