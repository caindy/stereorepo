id: https://w3id.org/stereorepo/ddd/core
name: ddd-core
title: Domain-Driven Design — Core
description: >-
  The identified base every DDD element shares, and nothing else.

  Republished per stereorepo's DR-016. These are Eric Evans' patterns, not
  stereorepo's: where this schema and the book disagree, the book wins and this
  schema is wrong.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ddd: https://w3id.org/stereorepo/ddd/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
default_prefix: ddd
default_range: string

imports:
  - linkml:types

slots:

  id:
    description: Stable identifier for the element.
    identifier: true
    range: uriorcurie

  name:
    description: Short human-readable label.

  description:
    description: Free-text account of the element.

  # Strategic design

classes:

  DddElement:
    abstract: true
    description: Base for every identified element in the pattern language.
    slots:
      - id
      - name
      - description

  #--- Strategic design ---------------------------------------------------------
