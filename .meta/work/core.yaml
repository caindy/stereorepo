id: https://w3id.org/solorepo/work/core
name: work-core
title: Ontology of Work — Core
description: >-
  The base every other module builds on, and nothing else.

  One abstract class and three slots earn their place here for a single reason:
  composition in this ontology is **by reference, not by nesting**. A Capability
  appears in many Roles without being copied, and an Actor's Memory is the same
  Memory a Bill of Materials pins. That only works if everything is identified,
  so WorkEntity gives everything an id.

  `Prose` is the one thing here that is not referred to and not identified. A
  block of authored prose is the text itself rather than an entity anything
  points at, so it nests in whatever it frames; it is here because more than one
  module's class carries one, and a module importing another for a single slot
  would be a worse answer than the exception (solorepo's DR-152).
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types

slots:

  id:
    description: >-
      Stable identifier for the entity, in one of two forms, chosen by what the
      entity is (solorepo's DR-125). A **slug** where the entity is its meaning — a
      Concept, a Discipline, an Artifact — since two with the same meaning are
      one, and renaming the label leaves the identity alone. A **number** where
      the entity is an occurrence — a Decision, an Article, a Challenge — since
      two with the same words are two, the order is when, and a deleted one
      leaves a hole the gate can see. Neither form is edited once minted, and a
      number is never reused. A Decision's is minted by `.meta/say/move mint`,
      which reserves it on GitHub before it is cited anywhere, so that two
      branches cannot take the same one (solorepo's DR-128).
    identifier: true
    range: uriorcurie

  name:
    description: Short human-readable label.

  falsifier:
    description: >-
      The observation that would make this wrong. Observed Failure, applied to a
      claim rather than to a test.

      On a Decision it is optional: one with none is a preference, which is
      allowed as long as it says so rather than borrowing the authority of a
      finding. On an Article it is required, because an Article binds until
      somebody notices it should not, and nothing re-reads a rule against a world
      that has moved underneath it. A13 was retired for a premise the repository
      had abandoned across five decisions, none of which looked at the Charter.

  description:
    description: Free-text account of the entity.

  # Persona

  statement:
    description: What must be true, stated so that it can be checked.

  # Authored prose a generator writes between what it derives

  text:
    description: The prose itself, as Markdown.

  woven:
    description: >-
      The authored prose a generator writes **between** the content it derives,
      as named blocks. `preamble` and `postamble` need no name because their
      position identifies them; a block in the middle has no position to be
      named by, so it carries one and the generator asks for it by that name
      (solorepo's DR-152).

      A block hangs off what it frames. The page, where the block belongs to one
      Artifact; the Discipline, where every reading compiled from it carries the
      same block and one per page would be the second copy.

      A block may leave a **named hole** — `{role}` — which the generator fills,
      and that is the whole of what a generator may add to prose it is handed.
      Interpolating a value is not authoring; writing a sentence is.
    range: Prose
    multivalued: true
    inlined_as_list: true

classes:

  Prose:
    description: >-
      One named block of authored prose, nested in whatever it frames. It has no
      identifier because nothing refers to a paragraph: the name is unique within
      its host, which is as far as a generator asking for one needs to reach.
    slots:
      - name
      - text
    slot_usage:
      name:
        required: true
      text:
        required: true

  WorkEntity:
    abstract: true
    description: Base for every identified entity in the ontology.
    slots:
      - id
      - name
      - description
