id: https://w3id.org/solorepo/work/core
name: work-core
title: Ontology of Work — Core
description: >-
  The base every other module builds on, and nothing else.

  One abstract class and three slots earn their place here for a single reason:
  composition in this ontology is **by reference, not by nesting**. A Capability
  appears in many Roles without being copied, and an Actor's Memory is the same
  Memory a Bill of Materials pins. That only works if everything is identified,
  so WorkEntity gives everything an id.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types

slots:

  id:
    description: >-
      Stable identifier for the entity, in one of two forms, chosen by what the
      entity is (solorepo's DR-125). A **slug** where the entity is its meaning — a
      Concept, a Discipline, an Artifact — since two with the same meaning are
      one, and renaming the label leaves the identity alone. A **number** where
      the entity is an occurrence — a Decision, an Article, a Challenge — since
      two with the same words are two, the order is when, and a deleted one
      leaves a hole the gate can see. Neither form is edited once minted, and a
      number is never reused.
    identifier: true
    range: uriorcurie

  name:
    description: Short human-readable label.

  falsifier:
    description: >-
      The observation that would make this wrong. Observed Failure, applied to a
      claim rather than to a test.

      On a Decision it is optional: one with none is a preference, which is
      allowed as long as it says so rather than borrowing the authority of a
      finding. On an Article it is required, because an Article binds until
      somebody notices it should not, and nothing re-reads a rule against a world
      that has moved underneath it. A13 was retired for a premise the repository
      had abandoned across five decisions, none of which looked at the Charter.

  description:
    description: Free-text account of the entity.

  # Persona

  statement:
    description: What must be true, stated so that it can be checked.

classes:

  WorkEntity:
    abstract: true
    description: Base for every identified entity in the ontology.
    slots:
      - id
      - name
      - description
