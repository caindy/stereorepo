id: https://w3id.org/stereorepo/work/structure
name: work-structure
title: Ontology of Work — Structure
description: >-
  How a stereorepo is divided, and along which two axes.

  A **Portfolio** is everything one developer builds inside one Bounded Context:
  exactly one Ubiquitous Language, one set of stakeholders, one per repo. It is
  what a clone becomes under Specialization. A stereorepo is a monorepo by design,
  and this is the reason — the language is what holds it together, so the repo
  boundary and the language boundary are the same boundary.

  Within it, **Products** and **Projects** are not a hierarchy (stereorepo's DR-027). They are
  orthogonal groupings of the same content:

  A **Product** groups by *who it is for*. It is delivered to users, has its own
  interface, and therefore its own primary Persona. Cooper supplies the test:
  a primary persona's goals cannot be met by an interface aimed at another
  without unacceptable compromise, which is exactly the line between one Product
  and two.

  A **Project** groups by *how it is built*. One toolchain, one language, its own
  tests and its own gate. Products are composed from Projects, and the relation
  is many-to-many: a shared library is one Project serving two Products, while a
  Product with a web app and an API is one Product spanning two Projects.

  "Polyglot" is therefore a property of the Portfolio rather than of anything
  inside it. Projects differ in language; the Products they serve do not care.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/stereorepo/work-ontology/
  linkml: https://w3id.org/linkml/
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core
  - personas
  - disciplines
  - ../ddd/strategic

enums:

  DisciplineStatus:
    description: >-
      Whether a Discipline is implemented by a Bootstrap, exempt with rationale,
      or scoped to the Portfolio as a whole.
    permissible_values:
      implemented:
        description: >-
          The Discipline is satisfied by this Bootstrap and verified by gate steps.
      exempt:
        description: >-
          The Discipline applies to projects, but this Bootstrap holds a specific
          exemption or is verified by portfolio machinery.
      portfolio_scoped:
        description: >-
          The Discipline binds the Portfolio as a whole rather than an individual
          Project seed.

slots:

  bounded_context_ref:
    description: >-
      The Bounded Context this Portfolio is. Exactly one, which is the constraint
      that makes a single Ubiquitous Language enforceable across everything in
      the repo. A CURIE into `ddd_ontology.yaml` rather than a typed reference,
      so the two schemas stay independently loadable.
    range: uriorcurie

  primary_persona:
    description: >-
      The Persona whose interface this Product is. What makes it one Product
      rather than two.
    range: Persona

  built_from:
    description: >-
      The Projects a Product is composed from. Many-to-many: a Project may serve
      several Products.
    range: Project
    multivalued: true

  path:
    description: >-
      Where the Artifact is, relative to the repository root. The one copy of the
      location: an identifier is opaque here, as everywhere else in the ontology,
      so nothing has to parse an id to reach a file.
    required: true

  preamble:
    description: >-
      The authored prose that opens a generated Artifact: what the page is, and
      what a reader is to do with it. Held here because the renderer that writes
      the page must not also author it — a generator with prose of its own is a
      second author, which is the single-copy rule broken by the machinery built
      to keep it (stereorepo's DR-144). Markdown, and only where a generator asks for it.

  postamble:
    description: >-
      The authored prose that closes a generated Artifact, where the page ends
      in something addressed to the reader rather than in the last rendered row.
      A slot of its own rather than a placeholder inside `preamble`, so that
      neither block has to know where the generated part goes.

  # Prose *between* what a generator derives is `woven`, in `core`: a Discipline
  # carries such blocks too, and a slot two modules use is the base module's.

  language:
    description: The language a Project is written in. Portfolios are polyglot; Projects are not.

  gate:
    description: >-
      The command that must pass before work on this Project is claimed done.
      One per Project, and green before anything is called finished.

  gate_keys:
    description: >-
      The names of the variables in the Portfolio's root `.env` that the pair
      loop starts its landing gate with. Names only, never values, so the list
      is auditable in git. The loop reads the list from `main`, so a branch
      cannot widen it, and no seat is ever given the values
      (stereorepo's DR-357).
    range: string
    multivalued: true

  excluded_paths:
    description: >-
      File paths or glob patterns excluded from artifact completeness checks.
    multivalued: true

  schemas:
    description: >-
      The repository-relative paths of the LinkML schemas a Project owns: a
      Product's own model, beside the ontologies stereorepo brings. Read only
      by the step that resolves slots cited in prose, so that documentation
      citing the product's slots is checked against the product's schemas
      (stereorepo's DR-304).
    range: string
    multivalued: true

  discipline_implementations:
    description: >-
      How this Bootstrap satisfies or exempts Disciplines.
    range: DisciplineImplementation
    multivalued: true
    inlined_as_list: true

  discipline:
    description: >-
      The Discipline being implemented or exempted.
    range: Discipline

  status:
    description: >-
      Whether the Discipline is implemented by this Bootstrap, exempt with
      rationale, or scoped to the Portfolio as a whole.
    range: DisciplineStatus

  exposition:
    description: >-
      The relative file path to the Markdown documentation explaining how this
      Bootstrap satisfies the Discipline (e.g. literate-programming.md).
    range: string

  held_by:
    description: >-
      The gate steps or checks that hold this Discipline.
    range: string
    multivalued: true

  exemption_reason:
    description: >-
      The rationale for why this Discipline is exempt or portfolio-scoped for
      this Bootstrap.
    range: string


classes:

  Portfolio:
    is_a: WorkEntity
    description: >-
      Everything one developer builds inside one Bounded Context. One per repo, and
      the unit that Specialization produces.
    slots:
      - bounded_context
      - gate_keys
    slot_usage:
      name:
        required: true
      bounded_context:
        required: true
        description: >-
          The Bounded Context this Portfolio is. Exactly one, which is the
          constraint that makes a single Ubiquitous Language enforceable across
          everything in the repo, and so the reason a stereorepo is a monorepo.

  Product:
    is_a: WorkEntity
    description: >-
      Something delivered to users, with its own interface and therefore its own
      primary Persona. The unit of value: it carries Personas, Jobs to be Done
      and Goals, and it is what gets released.
    slots:
      - primary_persona
      - built_from
    slot_usage:
      name:
        required: true
      primary_persona:
        required: true

  Bootstrap:
    is_a: Product
    description: >-
      A language standard and seed workspace delivered as a Product of
      stereorepo. Specializes Product with discipline conformance declarations.
    slots:
      - discipline_implementations
    slot_usage:
      name:
        required: true
      primary_persona:
        required: true

  DisciplineImplementation:
    description: >-
      How a Bootstrap satisfies or exempts a Discipline: the exposition
      document, the gate steps that enforce it, and its conformance status.
    slots:
      - discipline
      - status
      - exposition
      - held_by
      - exemption_reason
    slot_usage:
      discipline:
        required: true
      status:
        required: true

  Artifact:
    is_a: WorkEntity
    description: >-
      A file something is answerable for: the artifacts a Decision names as
      carrying its rule, and that A20 requires to cite it back.

      Identified rather than named by path so that a reference to one is a
      reference (stereorepo's DR-079) — resolved against the schema by the same machinery
      every other reference uses, rather than by a checker matching strings. Renaming a file
      then moves one `path`, and the citations that pointed at it keep pointing.

      The inventory is deliberately partial. An Artifact exists here because
      something asserts a relationship to it, not so that the repository can hold
      a list of its own files, which is what `ls` is for.
    slots:
      - path
      - preamble
      - postamble
      - woven
    slot_usage:
      name:
        required: true

  Project:
    is_a: WorkEntity
    description: >-
      A unit of build: one toolchain, one language, its own tests and its own
      gate. The unit of construction.
    comments:
      - >-
        Not a piece of work — that is an Issue. And not a whole repository,
        which is what `python_bootstrap` means by the word. Both senses are live
        enough to be worth naming as collisions.
    slots:
      - language
      - gate
      - excluded_paths
      - schemas
    slot_usage:
      name:
        required: true
