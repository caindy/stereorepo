prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core
  - authority

slots:

  steps:
    description: >-
      What following the Discipline consists of, in order. Prose steps, not
      instructions to a machine — if they could be executed this would not be a
      Discipline.
    range: DisciplineStep
    multivalued: true
    inlined_as_list: true

  judgement:
    description: >-
      What in this Discipline requires judgement, and so cannot be compiled away.
      The reason adherence is needed rather than execution, and the test for
      whether a Discipline is warranted at all.

  produces:
    description: What following the Discipline yields.
    multivalued: true

  applies_to:
    description: >-
      Where the Discipline holds, when it does not hold everywhere. The scope of
      an APM `instructions` primitive — its `applyTo` glob — is this Securable.
    range: Securable

  enforces:
    description: >-
      The Discipline this Article makes checkable. Optional: an Article may stand
      alone, and one that needs no Discipline behind it is not diminished by the
      absence.
    range: Discipline

  checked_by:
    description: >-
      What holds artifacts against this Article — a gate step, a test, a review.
      An Article with nothing checking it is an aspiration, and should say so
      rather than imply enforcement it does not have.

classes:

  Discipline:
    is_a: WorkEntity
    description: >-
      A structured way of working that must be adhered to because it is not an
      imperative program.
    comments:
      - >-
        Cooper's persona modelling is the pattern to keep in mind: the Discipline
        is the method, and the Persona is an artifact the method produces. A
        Discipline is not an attribute of the thing it produces.
      - >-
        `judgement` being empty is a smell. Something with no judgement in it is
        a program that has not been written yet.
    slots:
      - steps
      - judgement
      - produces
      - applies_to
      - woven
    slot_usage:
      name:
        required: true
      steps:
        required: true
      judgement:
        recommended: true

  DisciplineStep:
    is_a: WorkEntity
    description: >-
      One step of a Discipline: a prescribed rule or practice that requires judgement
      (solorepo's DR-270). Identified by a semantic slug CURIE under
      `work:discipline-step/<discipline-slug>/<step-slug>`.
    slots:
      - statement
    slot_usage:
      name:
        required: true
        description: The short human name of the step (e.g. Request review), used when citing the step in prose.
      statement:
        required: true
        description: What following the step consists of. Prose, not instructions to a machine.

  Article:
    is_a: WorkEntity
    description: >-
      One clause of the Charter: a claim that can be held against a specific
      artifact and found false.

      Where a Discipline is followed, an Article is checked. It requires no
      judgement — that is the point, and it is why an Article is not a Discipline
      with fewer words. "No gate step may rewrite the tree" is settled once and
      mechanically verifiable; nothing about applying it is a matter of judgement.

      Binding, and it carries **no account of itself**. Why a rule exists is a
      Decision's, and a Decision that produced an Article names it under
      `applies` — so the relation reads forward, from the choice to the rule, and
      a reader who wants the argument searches the record for the number.

      What an Article does carry is how to apply it. A rule stated once and
      illustrated never is an aphorism, and an aphorism is applied by whoever
      already agreed with it.
    comments:
      - >-
        Numbered as a **stable identifier**, cited as A1, A2 and so on. A retired
        Article leaves a **hole** and is never renumbered: a citation that
        silently comes to mean something else is worse than a dangling one.
      - >-
        `example` says what following it looks like, `falsifier` what would end
        it. Between them an Article can be applied and argued with, which is the
        whole of what it is for.
    slots:
      - statement
      - enforces
      - checked_by
      - example
      - falsifier
    slot_usage:
      name:
        required: true
      statement:
        required: true
        description: The claim, in one line, phrased so that a violation is recognisable.
      example:
        required: true
        description: >-
          One concrete instance of the rule met — what doing it looks like here,
          and where it helps, the near-miss it is distinguished from. Not why the
          rule exists, and not an anecdote about the time it was broken.
      falsifier:
        description: >-
          What would retire this Article: **one observation, stated plainly, and
          nothing else.** Not a capability that might arrive — nothing notices a
          forecast coming true — and not the argument for why the observation
          would matter, which is what makes it unreadable at the moment somebody
          is skimming for it.

          **Optional, because some Articles are axiomatic.** A guardrail never
          observed to fail is not evidence of anything whatever the world does;
          nothing retires that, and inventing a condition for it is the same
          failure as inventing a rejected option. An Article with no falsifier is
          claiming to hold unconditionally, which is a strong claim and should be
          rare.

          **And if the observation is something you could bring about, it is a
          Challenge.** An Article retired by work somebody could do needs an Issue
          tracking that work, or the Charter is holding a plan nobody scheduled.
