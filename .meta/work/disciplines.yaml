id: https://w3id.org/solorepo/work/disciplines
name: work-disciplines
title: Ontology of Work — Disciplines
description: >-
  How work must proceed, invariably.

  A **Discipline** is a structured way of working that must be adhered to because
  it is not an imperative program (solorepo's DR-025). It has steps and an order, it is *followed*
  rather than executed, and following it produces artifacts.

  The clause doing the work is "not an imperative program". Adherence is what you
  need precisely because execution is unavailable: if a Discipline could be
  compiled, you would run it and no one would need to adhere to anything. So the
  test for whether something belongs here is not whether it is important, but
  whether the judgement it requires resists automation. Record that judgement —
  it is what stops a Discipline being written when a script would do.

  A Discipline is none of the three things it is most easily mistaken for. Not a
  Capability, which is what can be done. Not a Permission, which is what may be
  done and to what. Not a characterisation such as a communication style, which
  describes rather than prescribes and has no steps to depart from.

  Disciplines are also the reason this class exists rather than the prose that
  preceded it: an APM `instructions` primitive is a Discipline compiled for a
  harness, and prose in a document has nothing for that transformation to read.

  An **Article** is the other thing entirely: a one-line claim that can be held
  against a specific artifact and found false. Where a Discipline is followed, an
  Article is *checked*. The two are easy to conflate and the cost of conflating
  them is bluntness — wrapping a checkable claim in steps and judgement buries
  the claim, and a rule you cannot cite in one line is a rule nobody cites.

  Articles together are the **Charter**: a working agreement, binding on whoever
  works here. The word is borrowed rather than metaphorical. What it must not
  lose is that these are not drafted opinions — every Article carries the failure
  it came from, so it is empirical before it is binding.
