id: https://w3id.org/stereorepo/work/personas
name: work-personas
title: Ontology of Work — Personas
description: >-
  Who the work is *for*.

  A **Persona** is Alan Cooper's: a specific, detailed, named user archetype the
  product is designed for, first-class here rather than a borrowed metaphor.
  In collaborative product and feature design, an agent compiled from the Persona
  assumes its context, goal hierarchy, behaviors, and frustrations, evaluating
  design proposals strictly against the archetype's rejection boundaries
  (stereorepo's DR-200).

  **The detail is the discipline.** A sketch answers questions differently from a
  rigorously modelled figure, which is why Cooper insists on research over
  invention, and why a thin Persona cannot usefully be interrogated.

  Goals are tiered. An END goal is specific and has a plain test for being
  reached, and is standing rather than a bounded commitment. EXPERIENCE and LIFE
  goals are not testable that way at all. Business and technical goals are deliberately absent: About
  Face keeps them outside the persona so they cannot pollute the user model.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/stereorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core

enums:

  PersonaKind:
    description: >-
      Cooper's classification of personas by the role they play in a design.
    comments:
      - >-
        *The Inmates Are Running the Asylum* introduced personas and the
        primary/secondary distinction; the six-type taxonomy was codified later
        in *About Face* with Reimann, Cronin and Noessel. Verified against that,
        which added CUSTOMER and SERVED to an earlier four-value sketch here.
    permissible_values:
      PRIMARY:
        description: >-
          The main target of the design. A primary persona's goals cannot be met
          by an interface aimed at another without unacceptable compromise, so
          there is typically one per interface.
      SECONDARY:
        description: >-
          Largely satisfied by the primary's interface, with a few specific
          additional needs to accommodate without compromising the primary.
      SUPPLEMENTAL:
        description: >-
          Fully satisfied by the primary and secondary interfaces. Modelled for
          organisational reasons, so a stakeholder sees their user represented.
      CUSTOMER:
        description: >-
          The buyer rather than the daily user. Dictates purchasing,
          administration and compliance constraints, common in enterprise sales.
      SERVED:
        description: >-
          Directly affected by the product without ever touching it — the
          patient whose vitals a nurse records.
      NEGATIVE:
        description: >-
          Explicitly not designed for, named so that the exclusion is a decision
          rather than an oversight.

  PersonaGoalType:
    description: >-
      Cooper's three tiers of user goal, mapped in *About Face* against Don
      Norman's visceral, behavioural and reflective levels of processing.
    permissible_values:
      EXPERIENCE:
        description: >-
          Visceral. How the user wants to feel while using the product — "stay
          in control", "not feel stupid". Drives tone and microinteraction.
      END:
        description: >-
          Behavioural. What the user wants to accomplish — "process an invoice
          without manual reconciliation". Drives architecture and workflow, and
          is the tier a Job to be Done serves.
      LIFE:
        description: >-
          Reflective. Who the user wants to be — "be recognised as an expert".
          Rarely decides a button, but underpins positioning.

slots:

  persona_kind:
    description: The role this Persona plays in a design.
    range: PersonaKind

  persona_goals:
    description: >-
      What the Persona is trying to achieve. Cooper's personas are defined by
      goals rather than by tasks or demographics.
    range: PersonaGoal
    multivalued: true
    inlined_as_list: true
    comments:
      - >-
        User goals only. *About Face* keeps business goals and technical goals
        deliberately outside the persona so they cannot pollute the user model,
        which is why this enum has three values and not five.

  goal_type:
    description: Which tier of Cooper's goal taxonomy this is.
    range: PersonaGoalType

  context:
    description: The circumstances the Persona acts in — setting, constraints, what surrounds the work.

  behaviors:
    description: What the Persona characteristically does, observed rather than assumed.
    multivalued: true

  frustrations:
    description: What currently gets in the Persona's way.
    multivalued: true

  proficiencies:
    description: What the Persona is fluent in, and what it is not.
    multivalued: true

  # Capability

  persona:
    description: The Persona whose job this is — the user the work is for.
    range: Persona

classes:

  PersonaGoal:
    description: >-
      One goal held by a Persona, at one of Cooper's three tiers.
    comments:
      - >-
        Identified, so that a Job to be Done can name the goal it serves rather
        than only the Persona that holds it. Naming the Persona narrows the need
        to a set of goals; it does not resolve it to one, and SMART's relevance
        is unfalsifiable while it stays unresolved.
      - >-
        An END goal is specific, with a plain test for having been reached, and
        standing rather than a bounded commitment. EXPERIENCE and LIFE goals have
        no such test.
    slots:
      - id
      - goal_type
      - statement
    slot_usage:
      goal_type:
        required: true
      statement:
        required: true
        description: The goal in the Persona's own terms.

  Persona:
    is_a: WorkEntity
    description: >-
      A user archetype the product is designed *for*, in Alan Cooper's sense
      from *The Inmates Are Running the Asylum*: a specific, detailed, named
      figure standing in for a class of real people.
    comments:
      - >-
        The detail is the discipline. A sketch answers questions differently
        from a rigorously modelled figure, which is why Cooper insists on
        research over invention. A thin Persona cannot be usefully interrogated.
      - >-
        Interrogation needs no new machinery: the Persona compiles to an agent
        that answers as it. In collaborative feature design, that agent
        evaluates proposals against the Persona's 3-tier goal hierarchy and
        rejection boundaries (stereorepo's DR-200).
      - >-
        A JobToBeDone names the Persona whose need it is (stereorepo's DR-021). Interrogating
        a Persona to surface one is the intended path from user research into
        the work.
    slots:
      - persona_kind
      - persona_goals
      - context
      - behaviors
      - frustrations
      - proficiencies
      - personality
    slot_usage:
      name:
        required: true
      persona_kind:
        required: true
