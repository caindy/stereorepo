id: https://w3id.org/solorepo/work/actors
name: work-actors
title: Ontology of Work — Actors
description: >-
  Who does the work, and what they carry between Jobs.

  An **Actor** is a **Personality** with an **Identity** and a **Memory**. The
  Personality is the character presented — a SOUL.md and a communication style.
  It is what the original sketch called a Persona, renamed once Cooper's Persona
  was taken up as its own concept (solorepo's DR-019).

  **Identity is abstract on purpose.** Every identity is either held durably by a
  principal or attested for a running workload, and an audit trail that conflates
  the two cannot say who did anything. In a team of one that failure is total:
  without the delegation link every action an agent takes resolves to the single
  human who launched it.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core

enums:

  MemoryKind:
    description: The kind of retained state an Actor carries between Jobs.
    permissible_values:
      EPISODIC:
        description: What happened, and when.
      SEMANTIC:
        description: Facts held to be true.
      PROCEDURAL:
        description: How to carry out a method.
      WORKING:
        description: State held only for the current Job.

  AttestationMethod:
    description: >-
      How a WorkloadIdentity is proved. Attestation establishes what a workload
      is; it does not rely on the workload holding a secret.
    permissible_values:
      PLATFORM:
        description: The runtime platform vouches for the workload, e.g. a node agent attesting a process, container or pod.
      HARDWARE:
        description: A hardware root of trust vouches for the workload, e.g. a TPM or a secure enclave.
      OIDC_FEDERATION:
        description: A trusted OIDC issuer vouches for the workload and its claims are federated into the trust domain.
      SIGNED_ARTIFACT:
        description: A signature over the workload artifact or its manifest establishes the identity.
      STATIC_CREDENTIAL:
        description: >-
          A long-lived secret stands in for attestation. Recorded so that it can
          be found and removed, not endorsed.

slots:

  soul:
    description: Pointer to the SOUL.md that gives the Persona its character.
    range: uriorcurie

  communication_style:
    description: >-
      How the Persona expresses itself, e.g. tone, register, verbosity, channel
      conventions. The source ontology marks this element as provisional.

  # Persona

  personality:
    description: >-
      The character presented — by an Actor doing work, or by a Persona when an
      Actor adopts one to be interrogated.
    range: Personality

  identity:
    description: The Identity the Actor authenticates as.
    range: Identity

  memories:
    description: The Memory the Actor carries between Jobs.
    range: Memory
    multivalued: true

  subject:
    description: The principal the Identity denotes, e.g. an account name.

  issuer:
    description: The authority that vouches for the Identity.

  memory_kind:
    description: The kind of retained state.
    range: MemoryKind

  store:
    description: Where the Memory is held, e.g. a directory or index URI.
    range: uriorcurie

  # Job and Collaboration

  attestation_method:
    description: How the WorkloadIdentity is proved.
    range: AttestationMethod

  attestation_evidence:
    description: >-
      Pointer to the evidence behind the attestation, e.g. a signed document or
      an entry in a verification log.
    range: uriorcurie

  not_before:
    description: Instant from which the Identity is valid.
    range: datetime

  not_after:
    description: >-
      Instant after which the Identity is no longer valid. A workload identity
      should be short-lived enough that revocation is rarely needed.
    range: datetime

  acts_on_behalf_of:
    description: >-
      The Identity whose authority this one exercises. The delegation link that
      keeps an agent's actions distinct from the principal's while still
      resolving to it.
    range: Identity
    close_mappings:
      - prov:actedOnBehalfOf

  # Execution

classes:

  Personality:
    is_a: WorkEntity
    description: >-
      The character an Actor presents: its SOUL.md together with its
      communication style. What the original sketch called a Persona; renamed
      once Cooper's Persona was taken up as its own concept (solorepo's DR-019).
    slots:
      - soul
      - communication_style

  Identity:
    is_a: WorkEntity
    abstract: true
    description: >-
      The principal an Actor authenticates as. Abstract, because every Identity
      is either held durably by a principal or attested for a running workload,
      and an audit trail that conflates the two cannot say who did anything.
    slots:
      - subject
      - issuer
    slot_usage:
      subject:
        required: true

  PrincipalIdentity:
    is_a: Identity
    description: >-
      A durable Identity held by a human or a long-lived service account, proved
      by a credential the holder keeps.

  WorkloadIdentity:
    is_a: Identity
    description: >-
      An Identity attested for a running workload rather than presented by it:
      the platform vouches for what the workload is, and the Identity is issued
      per run and short-lived. A SPIFFE ID goes in `subject`, e.g.
      "spiffe://solorepo/agent/architect".
    slots:
      - attestation_method
      - attestation_evidence
      - not_before
      - not_after
      - acts_on_behalf_of
    slot_usage:
      attestation_method:
        required: true
      acts_on_behalf_of:
        recommended: true
    comments:
      - >-
        Without acts_on_behalf_of, every action an agent takes resolves to the
        principal that launched it, and in a team of one the audit trail
        collapses into a single name.

  Memory:
    is_a: WorkEntity
    description: State an Actor retains across Jobs.
    slots:
      - memory_kind
      - store

  Actor:
    is_a: WorkEntity
    description: A Personality with an Identity and a Memory.
    slots:
      - personality
      - identity
      - memories
    slot_usage:
      personality:
        required: true
      identity:
        required: true
    close_mappings:
      - prov:Agent
