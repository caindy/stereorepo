id: https://w3id.org/stereorepo/work/authority
name: work-authority
title: Ontology of Work — Authority
description: >-
  What can be done, and the Roles an agent is given.

  A **Capability** is a kind of thing that can be done or used, and it never
  names an object: tools are atomic, skills compose tools, and a rule enforces
  it. A **Role** is a named set of Capabilities with the register it speaks in,
  and it compiles to an agent definition.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/stereorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core

enums:

  CapabilityKind:
    description: The kind of thing a Capability is.
    permissible_values:
      SKILL:
        description: Something an agent can do, e.g. a SKILL definition.
      TOOL:
        description: Something an agent can use, e.g. an MCP tool or a CLI.
      OTHER:
        description: A capability that is neither a skill nor a tool.

slots:

  capability_kind:
    description: Whether the Capability is a skill, a tool, or something else.
    range: CapabilityKind

  composed_of:
    description: >-
      The Capabilities this one is built from. A skill composes tools and may
      compose other skills; a tool is atomic. Tool atomicity is enforced by a rule on Capability; the absence of cycles
      is not, and has to be checked by whatever tooling reads these files.
    range: Capability
    multivalued: true

  # Role

  capabilities:
    description: The Capabilities gathered under the Role.
    range: Capability
    multivalued: true

  communication_style:
    description: >-
      The Role's conversational register in dialogue. The structure and
      register of durable files are the Disciplines', not this.

classes:

  Capability:
    is_a: WorkEntity
    description: >-
      A kind of thing that can be done or used, e.g. a SKILL or a Tool.
    slots:
      - capability_kind
      - composed_of
    slot_usage:
      name:
        required: true
      capability_kind:
        required: true
    rules:
      - description: >-
          A tool is atomic. Only a skill composes other Capabilities, so a
          Capability of kind TOOL carries no composed_of.
        preconditions:
          slot_conditions:
            capability_kind:
              equals_string: TOOL
        postconditions:
          slot_conditions:
            composed_of:
              value_presence: ABSENT

  Role:
    is_a: WorkEntity
    description: A named set of Capabilities, and the register it speaks in.
    slots:
      - capabilities
      - communication_style
    slot_usage:
      name:
        required: true
    close_mappings:
      - prov:Role
