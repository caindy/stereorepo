id: https://w3id.org/stereorepo/work/purpose
name: work-purpose
title: Ontology of Work — Purpose
description: >-
  What the work is, and what it is for.

  An **Issue** is one unit of work: one Markdown file on the board, whose
  filename slug is its identifier and whose directory is its stage. Its front
  matter holds only what cannot be observed or derived, and this class is the
  shape of that front matter. An Issue with children is a Flight; there is
  no separate type for one.

  A **Job to be Done** states the *user's* job and names a Persona.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/stereorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core
  - personas

enums:

  Difficulty:
    description: >-
      How an Issue is carried to `main`. Set when the Issue is groomed, by the
      seats or by the developer; never a verdict on the work.
    permissible_values:
      easy:
        description: Done in one piece, with few turns.
      medium:
        description: Done in one piece, with more room to converge.
      hard:
        description: >-
          Too big for one piece. The seats split it into child Issues in the
          backlog, each naming this one as its parent, and it lands as done
          once the children are written.
      developer:
        description: >-
          Its result needs the developer's desk check before it lands on `main`.

slots:

  difficulty:
    description: How the Issue is carried to `main`.
    range: Difficulty

  waits_on:
    description: >-
      Issues that must be done before this one is ripe, by slug. A slug in
      another repository is written `<repository>:<slug>`; the loop cannot
      see that board, so such an entry holds the Issue until the developer
      removes it (stereorepo's DR-301).
    multivalued: true

  parent:
    description: The Issue this one was split from, by slug.

  # Job to be done

  situation:
    description: The circumstance that triggers the need ("When ...").

  motivation:
    description: What the Persona wants to do in that situation ("I want to ...").

  expected_outcome:
    description: The outcome that makes the need satisfied ("so that ...").

  serves:
    description: >-
      The Persona's END goals this need advances. Multivalued, because one need
      may serve several. Restricted to the END tier, and to goals held by this
      Job to be Done's own Persona — neither is expressible here, so the gate
      checks both.
    range: PersonaGoal
    multivalued: true

classes:

  Issue:
    description: >-
      One unit of work, as one Markdown file on the board. It has no number:
      its slug is its id. It has no status, labels or assignee: its stage is the
      directory it sits in. It has no comment thread: the seats' notes and the
      developer's desk-check notes are written in the file.
    slots:
      - difficulty
      - waits_on
      - parent

  JobToBeDone:
    is_a: WorkEntity
    description: >-
      The need the work serves, stated from the point of view of the Persona
      that has it. It is the element that names the Persona.
    comments:
      - >-
        It states the *user's* job, not the worker's (stereorepo's DR-021), so it
        names a Persona.
      - >-
        `serves` names the END goals this need advances, and is **required**. A
        need that advances none of a Persona's goals is a need nobody has
        (stereorepo's DR-039). An END goal with no Job to be Done is a user need
        nobody is working on.
    slots:
      - situation
      - motivation
      - expected_outcome
      - persona
      - serves
    slot_usage:
      motivation:
        required: true
      persona:
        required: true
      serves:
        required: true
