id: https://w3id.org/solorepo/work/purpose
name: work-purpose
title: Ontology of Work — Purpose
description: >-
  What the work is for, and what may be done in pursuit of it.

  A **Goal** is SMART by construction: Specific by its Challenge, Measurable by
  its Definition of Done, Achievable and Relevant by its Job to be Done,
  Time-bound by its Deadline. All four are required, so a Goal missing one fails
  validation rather than quietly being less than it claims.

  A **Job to be Done** states the *user's* job and names a Persona. The original
  sketch had it specify a Role, which made the need the worker's; that was wrong,
  and correcting it means an Agency's Role is no longer implied by its Goal.

  A **Remit** adds Permissions to a Goal: what may be done, and what it is to be
  done for.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - core
  - authority
  - personas

enums:

  GoalBasis:
    description: >-
      What justifies a Goal. Every Goal has exactly one, so that work with no
      justification cannot be written down without the omission showing.
    permissible_values:
      USER:
        description: >-
          It serves a Persona's END goal, through a Job to be Done. The default,
          and the only basis that traces to someone outside the building.
      BUSINESS:
        description: >-
          An organisational objective — conversion, support cost, retained
          revenue. *About Face* names these and keeps them out of the Persona so
          they cannot pollute the user model; they belong here instead.
      TECHNICAL:
        description: >-
          An architectural constraint — latency, offline-first sync, data
          residency. Also from *About Face*, and also kept out of the Persona.

  ChallengeType:
    description: >-
      The shape of a Challenge. The source ontology gives an open list
      ("defects, epics, features, tasks, etc."), so this enum is illustrative
      rather than closed; extend it as new challenge shapes are adopted.
    permissible_values:
      DEFECT:
        description: Observed behaviour differs from intended behaviour.
      EPIC:
        description: A large body of work decomposed into features.
      FEATURE:
        description: A unit of delivered capability, decomposed into tasks.
      TASK:
        description: A single unit of executable work.
      SPIKE:
        description: A time-boxed investigation that resolves uncertainty.
      CHORE:
        description: Upkeep work that changes no external behaviour.

slots:

  challenge_type:
    description: The shape of the Challenge.
    range: ChallengeType

  parent_challenge:
    description: The Challenge this one decomposes, e.g. the epic of a feature.
    range: Challenge

  # Definition of Done

  shown_by:
    description: >-
      What demonstrates this criterion met — a command, a check, a count that
      can be taken. The same job `checked_by` does for an Article.

  criteria:
    description: The criteria that, all being met, make the Goal done.
    range: AcceptanceCriterion
    multivalued: true
    inlined_as_list: true

  metric:
    description: The quantity observed to check the criterion.

  target_value:
    description: The value the metric must reach, held as text to allow bounds.

  unit:
    description: Unit the metric is measured in.

  # Job to be done

  situation:
    description: The circumstance that triggers the need ("When ...").

  motivation:
    description: What the Role wants to do in that situation ("I want to ...").

  expected_outcome:
    description: The outcome that makes the need satisfied ("so that ...").

  serves:
    description: >-
      The Persona's END goals this need advances. Multivalued, because one need
      may serve several. Restricted to the END tier, and to goals held by this
      Job to be Done's own Persona — neither is expressible here, so the gate
      checks both.
    range: PersonaGoal
    multivalued: true

  challenge:
    description: >-
      The Challenge this addresses. A Goal commits to one; a Decision was taken
      under one, which is how the entries that served a Challenge are gathered
      without anyone keeping a list.
    range: Challenge

  definition_of_done:
    description: The measurable completion test for the Goal.
    range: DefinitionOfDone

  jtbd:
    description: The Job to be Done the Goal serves.
    range: JobToBeDone

  deadline:
    description: The instant by which the Goal must be met.
    range: datetime

  goal_basis:
    description: What justifies this Goal.
    range: GoalBasis

  # Remit

  permissions:
    description: The Permissions granted.
    range: Permission
    multivalued: true

  goal:
    description: The Goal the Permissions are granted for.
    range: Goal

  # Agency

classes:

  Challenge:
    is_a: WorkEntity
    description: >-
      A problem to be addressed, e.g. a defect, epic, feature or task. A
      Challenge supplies the specificity of a SMART Goal.
    slots:
      - challenge_type
      - parent_challenge
    slot_usage:
      challenge_type:
        required: true

  AcceptanceCriterion:
    description: >-
      One checkable condition in a Definition of Done. State the metric and
      target where the criterion is quantitative.

      `shown_by` is what makes it a criterion rather than a hope: a box ticked
      because somebody remembers is the convention-by-restraint that solorepo's DR-050 rules
      out, and a criterion nothing can demonstrate cannot be met, only asserted.
    slots:
      - statement
      - metric
      - target_value
      - unit
      - shown_by
    slot_usage:
      statement:
        required: true

  DefinitionOfDone:
    is_a: WorkEntity
    description: >-
      The test that decides whether a Goal has been met. It supplies the
      measurability of a SMART Goal.
    slots:
      - criteria
    slot_usage:
      criteria:
        required: true

  JobToBeDone:
    is_a: WorkEntity
    description: >-
      The need the work serves, stated from the point of view of the Persona
      that has it. It supplies the achievability and relevance of a SMART Goal,
      and it is the element that names the Persona. Distinct from Job, which is
      an assignment.
    comments:
      - >-
        The original sketch had this specify a Role, which made the need the
        worker's. It states the *user's* job (solorepo's DR-021), so it names a Persona.
        One consequence: an Agency's Role is no longer implied by its Goal, and
        choosing it becomes an explicit act rather than a derivation.
      - >-
        `serves` names the END goals this need advances, and is **required**. A
        need that advances none of a Persona's goals is a need nobody has, and
        making it required is what lets the schema guarantee the whole chain: a
        USER Goal must have a Job to be Done, and a Job to be Done must reach an
        END goal, so no Goal can dead-end at a Persona (solorepo's DR-039).
      - >-
        Subtracting the two sides gives the product equivalent of the
        Permission/AuditRecord diff: an END goal with no Job to be Done is a user
        need nobody is working on.
    slots:
      - situation
      - motivation
      - expected_outcome
      - persona
      - serves
    slot_usage:
      motivation:
        required: true
      persona:
        required: true
      serves:
        required: true

  Goal:
    is_a: WorkEntity
    description: >-
      A SMART goal. Specific by its Challenge, Measurable by its Definition of
      Done, Time-bound by its Deadline, and Achievable and Relevant by whatever
      justifies it — a Job to be Done for a user, or a stated business or
      technical objective.

      Every Goal must serve a Persona's END goal, or be a business or a
      technical goal (solorepo's DR-038). There is no fourth option, and that is the point:
      work that answers to nobody cannot be written down without the omission
      being visible.
    comments:
      - >-
        A Goal that genuinely serves a user *and* the business picks its primary
        basis. Keeping the basis single-valued is what keeps the arithmetic of
        solorepo's DR-031 clean — subtract served END goals from held ones and the
        remainder means something.
    slots:
      - challenge
      - definition_of_done
      - jtbd
      - deadline
      - goal_basis
      - statement
    slot_usage:
      challenge:
        required: true
      definition_of_done:
        required: true
      deadline:
        required: true
      goal_basis:
        required: true
      statement:
        description: >-
          The business or technical objective this Goal answers to, when it is
          not a user's.
    rules:
      - description: A Goal justified by a user reaches that user through a Job to be Done.
        preconditions:
          slot_conditions:
            goal_basis:
              equals_string: USER
        postconditions:
          slot_conditions:
            jtbd:
              required: true
      - description: >-
          A business or technical Goal has no user to reach, so it states its
          objective instead.
        preconditions:
          slot_conditions:
            goal_basis:
              any_of:
                - equals_string: BUSINESS
                - equals_string: TECHNICAL
        postconditions:
          slot_conditions:
            statement:
              required: true
            jtbd:
              value_presence: ABSENT

  Remit:
    is_a: WorkEntity
    description: >-
      A Goal together with the Permissions granted to pursue it: what may be
      done, and what it is to be done for.
    slots:
      - permissions
      - goal
    slot_usage:
      permissions:
        required: true
      goal:
        required: true
