id: https://w3id.org/solorepo/ddd
name: ddd-ontology
title: Domain-Driven Design — the umbrella
description: >-
  The DDD pattern language, republished by solorepo alongside its work ontology.

  This file imports the modules and holds the container. It is small on purpose:
  read the module that covers what you are touching.

    strategic  — where a model applies, and how models meet   ddd/strategic.yaml
    concepts   — a vocabulary that can be talked about        ddd/skos.yaml
    tactical   — the building blocks inside one context       ddd/tactical.yaml
    core       — the base every element shares                ddd/core.yaml

  The container lives here and nowhere else. A `tree_root` in a module would be
  inherited by anything importing it, and would silently replace the importer's
  own root — see DR-027.

  Republished by solorepo per DR-016. These are Eric Evans' patterns, not
  solorepo's: where this schema and the book disagree, the book wins and this
  schema is wrong.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  ddd: https://w3id.org/solorepo/ddd/
  linkml: https://w3id.org/linkml/
  skos: http://www.w3.org/2004/02/skos/core#
default_prefix: ddd
default_range: string

imports:
  - linkml:types
  - ddd/core
  - ddd/skos
  - ddd/strategic
  - ddd/tactical

slots:

  bounded_contexts:
    description: The Bounded Contexts in the collection.
    range: BoundedContext
    multivalued: true
    inlined_as_list: true

  subdomains:
    description: The Subdomains in the collection.
    range: Subdomain
    multivalued: true
    inlined_as_list: true

  languages:
    description: The Ubiquitous Languages in the collection.
    range: UbiquitousLanguage
    multivalued: true
    inlined_as_list: true

  concept_schemes:
    description: The Concept Schemes in the collection.
    range: ConceptScheme
    multivalued: true
    inlined_as_list: true

  concept_set:
    description: The Concepts in the collection.
    range: Concept
    multivalued: true
    inlined_as_list: true

  context_maps:
    description: The Context Maps in the collection.
    range: ContextMap
    multivalued: true
    inlined_as_list: true

  entities:
    description: The Entities in the collection.
    range: Entity
    multivalued: true
    inlined_as_list: true

  value_objects:
    description: The Value Objects in the collection.
    range: ValueObject
    multivalued: true
    inlined_as_list: true

  aggregates:
    description: The Aggregates in the collection.
    range: Aggregate
    multivalued: true
    inlined_as_list: true

  domain_events:
    description: The Domain Events in the collection.
    range: DomainEvent
    multivalued: true
    inlined_as_list: true

  domain_services:
    description: The Domain Services in the collection.
    range: DomainService
    multivalued: true
    inlined_as_list: true

  repositories:
    description: The Repositories in the collection.
    range: Repository
    multivalued: true
    inlined_as_list: true

  factories:
    description: The Factories in the collection.
    range: Factory
    multivalued: true
    inlined_as_list: true

  specifications:
    description: The Specifications in the collection.
    range: Specification
    multivalued: true
    inlined_as_list: true

  modules:
    description: The Modules in the collection.
    range: Module
    multivalued: true
    inlined_as_list: true

#-------------------------------------------------------------------------------
# Classes
#-------------------------------------------------------------------------------

classes:

  DddModel:
    tree_root: true
    description: Container for a set of DDD instances.
    slots:
      - bounded_contexts
      - subdomains
      - languages
      - concept_schemes
      - concept_set
      - context_maps
      - entities
      - value_objects
      - aggregates
      - domain_events
      - domain_services
      - repositories
      - factories
      - specifications
      - modules
