# The ratchet baseline for the `meta file sizes` step of `.meta/check.py`.
#
# One entry per file, holding the lines past its ceiling it may still run. The
# ceilings themselves are `MODULE_CEILING` and `ENTRY_CEILING` in
# `.meta/checks/files/python.py`, five hundred lines for a module and three
# hundred and fifty for a file on the invocation surface, which is where
# solorepo's DR-217 puts the line between a script and the package holding its
# body.
#
# The Ratchet Discipline is what a checker that cannot be clean at once does: a
# baseline that may fall and may not rise. A file absent from this map may run
# past no ceiling, and the step fails a file on either side of its number —
# over, because the debt grew; under, because a baseline nobody lowers has
# stopped being one.
#
# Written by `python.py`, which names the file and the number in the failure.
# Recorded as the ceilings were adopted, in caindy/solorepo#883, and it falls as
# scripts are decomposed into `.meta/lib/<script>/`.

