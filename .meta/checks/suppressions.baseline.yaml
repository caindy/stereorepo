# The ratchet baseline for both the `suppression causes` and `repeated suppressions`
# steps of `.meta/check.py`.
#
# One entry per file (for suppression causes) or per group (for repeated suppressions),
# holding the allowed counts of safety-bypassing suppressions.
#
# The Ratchet Discipline is what a checker that cannot be clean at once does: a
# baseline that may fall and may not rise. A group absent from this map may hold
# no more than two sites, and the step fails a group on either side of its
# number — over, because the cause was written once more; under, because a
# baseline nobody lowers has stopped being one. A group down to two sites or
# fewer fails until its entry is deleted.
#
# Written by `comments.py`, which names the group and the number in the failure.
# Both entries are one cause: `.meta/check.py` imports the step modules for
# their registration side effect, after inserting `.meta/` on `sys.path`, so
# every package under `.meta/checks/` repeats the pair. The sweep that drained
# the 22 untyped-decorator suppressions of caindy/solorepo#541 is
# caindy/solorepo#561.
.meta/checks/files/prose.py: 1
"noqa:F401 — registers check steps": 12
"noqa:I001 — registration order is deliberate": 7
