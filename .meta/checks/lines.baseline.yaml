# The ratchet baseline for the `meta lines` step of `.meta/check.py`.
#
# One entry per file, holding the lines over the limit it may still carry. The
# limit itself is `line-length` in `.meta/ruff.toml`, and `meta ruff` passes
# over the rule that reads it so that this step can.
#
# The Ratchet Discipline is what a checker that cannot be clean at once does: a
# baseline that may fall and may not rise. A file absent from this map may hold
# none, and the step fails a file on either side of its number — over, because
# the debt grew; under, because a baseline nobody lowers has stopped being one.
#
# Written by `python.py`, which names the file and the number in the failure.
# Recorded as the limit was adopted, in caindy/solorepo#751, and it falls as
# files are touched.

