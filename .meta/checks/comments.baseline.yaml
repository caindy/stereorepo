# The ratchet baseline for the `inline commentary` step of `.meta/check.py`.
#
# One entry per file, holding the body comment blocks it may still carry. The
# Ratchet Discipline is what a checker that cannot be clean at once does: a
# baseline that may fall and may not rise. A file absent from this map may hold
# none, and the step fails a file on either side of its number — over, because
# the debt grew; under, because a baseline nobody lowers has stopped being one.
#
# Written by `comments.py`, which names the file and the number in the failure.
# The sweep that empties it is caindy/solorepo#412.
