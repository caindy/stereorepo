# The ratchet baseline for the `meta types` step of `.meta/check.py`.
#
# One entry per file, holding the floor of `mypy --strict --ignore-missing-imports`
# errors it may still carry. Gate-internal imports resolve to `Any` when flat sibling
# imports do not resolve, so each number is a floor rather than the resolving debt
# (solorepo's DR-210, caindy/solorepo#435). The Ratchet Discipline is what a checker
# that cannot be clean at once does: a baseline that may fall and may not rise. A file
# absent from this map may hold none, and the step fails a file on either side of its
# number — over, because the debt grew; under, because a baseline nobody lowers has
# stopped being one.
#
# Written by `files.py`, which names the file and the number in the failure.
# Over nine tenths of what is recorded here is a missing annotation rather than
# a defect, so a module is annotated and its number lowered in the same change,
# one module at a time (solorepo's DR-210).
# The sweep that empties it is caindy/solorepo#438.
