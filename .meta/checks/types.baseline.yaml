# The ratchet baseline for the `meta types` step of `.meta/check.py`.
#
# One entry per file, holding the debt of `mypy --strict --ignore-missing-imports`
# errors it may still carry. The numbers used to be a floor rather than the resolving
# debt: the modules under `.meta/checks/` imported each other flat, mypy's search root
# is `.meta/`, and what does not resolve is `Any` (solorepo's DR-210,
# caindy/solorepo#435). caindy/solorepo#557 left one import spelling, so mypy now reads
# across the package and the numbers are the debt. Twenty-eight of them rose that day,
# and none of what they count is new code.
#
# The Ratchet Discipline is what a checker that cannot be clean at once does: a
# baseline that may fall and may not rise. A file absent from this map may hold none,
# and the step fails a file on either side of its number — over, because the debt grew;
# under, because a baseline nobody lowers has stopped being one.
#
# Written by `files.py`, which names the file and the number in the failure.
# Over nine tenths of what is recorded here is a missing annotation rather than
# a defect, so a module is annotated and its number lowered in the same change,
# one module at a time (solorepo's DR-210).
# The sweep that empties it is caindy/solorepo#438.
