# `gh` on the runner, wherever the job happens to be running (solorepo's DR-140).
#
# `.meta/check_pr.py`, `.meta/next.py` and `.meta/say/channel.py` all shell out
# to `gh` for every read and write, so every job that runs one of them needs it.
# `ubuntu-latest` ships it and the self-hosted scale set's image
# (solorepo's DR-137) does not, and since solorepo's DR-140 the same job may run
# on either — a portfolio's gate is hosted, this repository's is not. So the
# gap is closed once, here, rather than by a `runs-on:` a reader has to check
# before trusting a step.
#
# Guarded, not unconditional: on a runner that already has `gh` this is a
# `type -p` and nothing else, which is what makes it safe to put in the shared
# half of the two gate workflows (solorepo's DR-119) instead of in one of them.
name: gh
description: Ensure the GitHub CLI is on the runner, installing it only where it is missing.
runs:
  using: composite
  steps:
    # `set -euo pipefail` explicitly: the default `bash -e {0}` leaves a failed
    # `curl` piping nothing into `dd`, which succeeds, and the run goes green
    # with no `gh` and a keyring file full of nothing.
    - run: |
        set -euo pipefail
        type -p gh >/dev/null || (
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            | sudo tee /etc/apt/sources.list.d/github-cli.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y gh
        )
        gh --version
      shell: bash
