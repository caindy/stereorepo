# Google Labs Jules execution in repoless mode (solorepo's DR-246, solorepo's #681).
#
# Runs repoless Jules REST API sessions against the repository workspace, pulling
# review findings back to the local runner for gate verification and attested
# review posting (.meta/say/).
name: jules
description: Run Google Labs Jules REST API sessions within the repository workspace.
inputs:
  role:
    description: Role being executed (reviewer).
    required: false
    default: "reviewer"
  pr:
    description: Pull request number to review.
    required: false
    default: ""
  prompt:
    description: Prompt instructions for the session.
    required: false
    default: ""
  timeout-minutes:
    description: Timeout in minutes for the session.
    required: false
    default: "15"
runs:
  using: composite
  steps:
    - name: run jules
      shell: bash
      env:
        ROLE: ${{ inputs.role }}
        PR: ${{ inputs.pr }}
        PROMPT: ${{ inputs.prompt }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
      run: |
        python3 .meta/jules/client.py dispatch \
          --role "$ROLE" \
          ${PR:+--pr "$PR"} \
          ${TIMEOUT_MINUTES:+--timeout-minutes "$TIMEOUT_MINUTES"} \
          ${PROMPT:+--prompt "$PROMPT"}
