# The sweep as one step (solorepo's DR-120): the same check as the pull request gate, on
# the clock, for every open pull request, with each result published under the
# job name `pull request` so the ruleset reads the sweep's verdict as it read
# the push's (solorepo's DR-105). Typed once here for both gate workflows, as the pull
# request gate is.
#
# The same step also says who takes each open pull request next, per solorepo's DR-129.
# A handoff is a review request, which GitHub holds and reports; a pull
# request with no request on it is a state GitHub reports nothing about, so
# red here is a hand-off a run owed and did not make, like the untriaged
# Challenge below and unlike a broken build.
name: sweep
description: Re-run the pull request gate on every open pull request and publish each result, name every one nobody can take up, then refuse an untriaged Challenge.
inputs:
  token:
    description: a token that reads pull requests and Issues and writes checks; github.token is enough
    required: true
runs:
  using: composite
  steps:
    - run: python3 .meta/check_pr.py --all --publish
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
    # And the queue: a Challenge with no difficulty is one the coder cannot
    # see, and nothing else tells an empty queue from an untriaged one
    # (solorepo's DR-114). Red here is a label the solo owes, not a broken build.
    - run: python3 .meta/next.py --check
      if: ${{ always() }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
