name: copilot
description: Run GitHub Copilot CLI within the repository workspace.
inputs:
  prompt:
    description: The prompt instructions to execute.
    required: true
  model:
    description: The model to target.
    required: false
    default: ""
  agent:
    description: The Agent this rung signs by, which the door emitted beside the harness.
    required: true
outputs:
  executed:
    description: Whether Copilot CLI was executed.
    value: ${{ steps.run_copilot.outputs.executed || 'false' }}
runs:
  using: composite
  steps:
    - name: configure signed channel
      shell: bash
      run: python3 .meta/configure_copilot.py

    - name: run Copilot CLI
      id: run_copilot
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        COPILOT_AUTO_UPDATE: "false"
        ACTOR_AGENT: ${{ inputs.agent }}
        AI_AGENT: ${{ inputs.agent }}
      run: |
        python3 .meta/run_copilot.py
        echo "executed=true" >> "$GITHUB_OUTPUT"
