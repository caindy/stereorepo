# Antigravity CLI (agy) execution in the repository workspace (solorepo's #669).
#
# Runs `agy` against the checked-out workspace with subscription credentials
# mounted in the ARC runner pod, avoiding metered API consumption. Whether
# this rung runs is not this action's to decide: the door's `between` phase
# says so, and the workflow's attempt step calls the harness runner with this
# harness only where it does (solorepo's DR-281).
name: agy
description: Run the Antigravity CLI (agy) within the repository workspace.
inputs:
  prompt:
    description: The prompt instructions to execute.
    required: true
  model:
    description: The model to target.
    required: false
    default: ""
  effort:
    description: Thinking effort level.
    required: false
    default: ""
  mode:
    description: Execution mode for agy (e.g. accept-edits or plan).
    required: false
    default: ""
  timeout-minutes:
    description: Print timeout minutes for the CLI session.
    required: false
    default: ""
  role:
    description: Role executing the session (coder or reviewer).
    required: false
    default: "coder"
  agent:
    description: The Agent this rung signs by, which the door emitted beside the harness.
    required: true
outputs:
  executed:
    description: Whether agy was executed.
    value: ${{ steps.run_agy.outputs.executed || 'false' }}
runs:
  using: composite
  steps:
    - name: configure reviewer confinement
      if: inputs.role == 'reviewer'
      shell: bash
      env:
        GEMINI_PROJECT_DIR: ${{ env.GEMINI_PROJECT_DIR || github.workspace }}
      run: |
        python3 .meta/detect_fallback.py --configure-reviewer

    - name: configure coder confinement
      if: inputs.role == 'coder'
      shell: bash
      env:
        GEMINI_PROJECT_DIR: ${{ env.GEMINI_PROJECT_DIR || github.workspace }}
      run: |
        python3 .meta/detect_fallback.py --configure-coder

    - name: run agy
      id: run_agy
      shell: bash
      env:
        PROMPT: ${{ inputs.prompt }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        MODE: ${{ inputs.mode }}
        TIMEOUT_MINUTES: ${{ inputs.timeout-minutes }}
        GEMINI_PROJECT_DIR: ${{ env.GEMINI_PROJECT_DIR || github.workspace }}
        # Whose session this is, scoped to this step alone: the Agent the
        # door emitted for this rung, which the attempt step already carries
        # in the job environment and which is named here so that the step's
        # own `env:` never resolves to the empty string (solorepo's #836).
        ACTOR_AGENT: ${{ inputs.agent }}
        AI_AGENT: ${{ inputs.agent }}
      run: |
        python3 .meta/run_agy.py
        echo "executed=true" >> "$GITHUB_OUTPUT"
