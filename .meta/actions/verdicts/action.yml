# How many verdicts one login has given on a pull request (solorepo's DR-122).
# The review workflow reads it twice, before the reviewer's session and after,
# and the difference is whether the session reviewed: the action reports
# success when the model's turn ends, and a turn ends holding for a subagent
# as readily as on a verdict. What counts as a verdict is what
# `check_pr.py --threads` lists — a review that is not the empty `COMMENTED`
# a `raise` or a reply posts under — so the two agree on what a review is.
name: verdicts
description: Count the verdicts one login has submitted on a pull request.
inputs:
  number:
    description: the pull request
    required: true
  login:
    description: the login whose verdicts are counted
    required: true
  token:
    description: a token that reads the pull request; github.token is enough
    required: true
outputs:
  count:
    description: how many verdicts that login has submitted, on any head
    value: ${{ steps.count.outputs.count }}
runs:
  using: composite
  steps:
    # One number per page, summed: a long argument has a review per raise
    # and per reply, and the empty ones are dropped before counting.
    - id: count
      run: |
        n=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" --paginate \
              --jq "[.[] | select(.user.login == \"$LOGIN\")
                         | select(.state != \"COMMENTED\" or (.body // \"\") != \"\")] | length" \
            | awk '{ s += $1 } END { print s + 0 }')
        printf 'count=%s\n' "$n" >> "$GITHUB_OUTPUT"
        echo "$LOGIN has given $n verdict(s) on #$PR"
      shell: bash
      env:
        PR: ${{ inputs.number }}
        LOGIN: ${{ inputs.login }}
        GH_TOKEN: ${{ inputs.token }}
