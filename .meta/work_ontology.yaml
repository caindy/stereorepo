id: https://w3id.org/stereorepo/work-ontology
name: work-ontology
title: Ontology of Work
description: >-
  The ontology names what a repository is made of and how its work is carried:
  the Portfolio and its Products and Projects, the Disciplines and the Charter,
  the Decisions, the Personas the work is for, the Roles an agent is given, and
  the Issue, which is one unit of work on the board.

  This file is the umbrella. It imports the modules, holds the container, and
  otherwise stays small — read the module that covers what you are touching.
license: https://creativecommons.org/licenses/by/4.0/

#-------------------------------------------------------------------------------
# The load map
#
#   Touching...                                    Read first
#   ------------------------------------------     -------------------------
#   what can be done, and the Roles agents are given  work/authority.yaml
#   who the work is for                             work/personas.yaml
#   what the work is, and what it is for            work/purpose.yaml
#   how work must proceed, and what is checkable     work/disciplines.yaml
#   what was foreclosed, and why                    work/decisions.yaml
#   how the repo is divided into Products/Projects  work/structure.yaml
#   the base every module shares                    work/core.yaml
#
# A module's `description` carries its reasoning, not only its contents. The
# summary above tells you a module exists and what it covers; it is deliberately
# insufficient to work from. Only the module itself is sufficient.
#-------------------------------------------------------------------------------

prefixes:
  work: https://w3id.org/stereorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - work/core
  - work/authority
  - work/personas
  - work/purpose
  - work/disciplines
  - work/decisions
  - work/structure

slots:

  personas:
    description: The Personas in the collection.
    range: Persona
    multivalued: true
    inlined_as_list: true

  capability_set:
    description: The Capabilities in the collection.
    range: Capability
    multivalued: true
    inlined_as_list: true

  roles:
    description: The Roles in the collection.
    range: Role
    multivalued: true
    inlined_as_list: true

  jobs_to_be_done:
    description: The Jobs to be Done in the collection.
    range: JobToBeDone
    multivalued: true
    inlined_as_list: true

  disciplines:
    description: The Disciplines in the collection.
    range: Discipline
    multivalued: true
    inlined_as_list: true
  decisions:
    description: The Decisions in the collection.
    range: Decision
    multivalued: true
    inlined_as_list: true
  articles:
    description: The Articles of the Charter, in the collection.
    range: Article
    multivalued: true
    inlined_as_list: true
  retired_articles:
    description: Article numbers issued and since retired, reserved forever.
    range: RetiredArticle
    multivalued: true
    inlined_as_list: true
  portfolio:
    description: The Portfolio. There is exactly one per repo.
    range: Portfolio
    inlined: true
  products:
    description: The Products in the collection.
    range: Product
    multivalued: true
    inlined_as_list: true
  bootstraps:
    description: The language Bootstraps in the collection.
    range: Bootstrap
    multivalued: true
    inlined_as_list: true
  projects:
    description: The Projects in the collection.
    range: Project
    multivalued: true
    inlined_as_list: true
  artifacts:
    description: The Artifacts in the collection.
    range: Artifact
    multivalued: true
    inlined_as_list: true
  excluded_paths:
    description: File paths or glob patterns excluded from artifact completeness checks.
    range: string
    multivalued: true
    inlined_as_list: true


classes:

  WorkOntology:
    tree_root: true
    description: >-
      Container for a set of work-ontology instances. Collections only; every
      class it gathers is defined in a module.
    slots:
      - personas
      - capability_set
      - roles
      - jobs_to_be_done
      - disciplines
      - articles
      - retired_articles
      - decisions
      - portfolio
      - products
      - bootstraps
      - projects
      - artifacts
      - excluded_paths
