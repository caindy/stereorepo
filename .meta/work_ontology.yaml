    tree_root: true
    description: >-
      Container for a set of work-ontology instances. Collections only; every
      class it gathers is defined in a module.
    slots:
      - personalities
      - personas
      - capability_set
      - securables
      - permission_set
      - roles
      - challenges
      - definitions_of_done
      - jobs_to_be_done
      - goals
      - remits
      - agencies
      - principal_identities
      - workload_identities
      - memory_set
      - actors
      - job_set
      - collaborations
      - disciplines
      - portfolio
      - products
      - projects
      # provenance
