id: https://w3id.org/solorepo/work-ontology
name: work-ontology
title: Ontology of Work
description: >-
  The ontology composes a small number of primitives into the unit of assigned
  work and the unit of shared work:

  Permission = Capability on a Securable. Role = a named set of Capabilities.
  Goal = Challenge + Definition of Done + Job to be Done + Deadline.
  Remit = Permissions + Goal. Agency = Role + Remit.
  Actor = Personality + Identity + Memory. Job = Actor + Agency.
  Collaboration = the Jobs that meet on one Challenge.

  This file is the umbrella. It imports the modules, holds the container, and
  otherwise stays small — read the module that covers what you are touching.
license: https://creativecommons.org/licenses/by/4.0/

#-------------------------------------------------------------------------------
# The load map
#
#   Touching...                                    Read first
#   ------------------------------------------     -------------------------
#   what can be done, to what, by whose authority   work/authority.yaml
#   who does the work, and their identity           work/actors.yaml
#   who the work is for                             work/personas.yaml
#   what the work is for, and its permissions       work/purpose.yaml
#   who is assigned what, and where work meets      work/assignment.yaml
#   how work must proceed, invariably               work/disciplines.yaml
#   what was actually done, and by whom             work/provenance.yaml
#   how the repo is divided into Products/Projects  work/structure.yaml
#   the base every module shares                    work/core.yaml
#
# A module's `description` carries its reasoning, not only its contents. The
# summary above tells you a module exists and what it covers; it is deliberately
# insufficient to work from. Only the module itself is sufficient.
#-------------------------------------------------------------------------------

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types
  - work/core
  - work/authority
  - work/actors
  - work/personas
  - work/purpose
  - work/assignment
  - work/disciplines
  - work/structure
  - work/provenance

