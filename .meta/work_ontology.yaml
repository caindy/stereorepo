id: https://w3id.org/solorepo/work-ontology
name: work-ontology
title: Ontology of Work
description: >-
  A LinkML rendering of the Ontology of Work described in .meta/work_ontology.md.
  The ontology composes a small number of primitives into the unit of assigned
  work (a Job) and the unit of shared work (a Collaboration):
  Permission = Capability on a Securable; Role = named set of Capabilities;
  Goal = Challenge + Definition of Done + Job to be Done + Deadline;
  Remit = Permissions + Goal; Agency = Role + Remit;
  Actor = Persona + Identity + Memory; Job = Actor + Agency.
license: https://creativecommons.org/licenses/by/4.0/

prefixes:
  work: https://w3id.org/solorepo/work-ontology/
  linkml: https://w3id.org/linkml/
  prov: http://www.w3.org/ns/prov#
default_prefix: work
default_range: string

imports:
  - linkml:types

#-------------------------------------------------------------------------------
# Enumerations
#-------------------------------------------------------------------------------

enums:

  CapabilityKind:
    description: The kind of thing a Capability is.
    permissible_values:
      SKILL:
        description: Something an Actor can do, e.g. a SKILL definition.
      TOOL:
        description: Something an Actor can use, e.g. an MCP tool or a CLI.
      OTHER:
        description: A capability that is neither a skill nor a tool.

  PersonaKind:
    description: >-
      Cooper's classification of personas by the role they play in a design.
    comments:
      - >-
        *The Inmates Are Running the Asylum* introduced personas and the
        primary/secondary distinction; the six-type taxonomy was codified later
        in *About Face* with Reimann, Cronin and Noessel. Verified against that,
        which added CUSTOMER and SERVED to an earlier four-value sketch here.
    permissible_values:
      PRIMARY:
        description: >-
          The main target of the design. A primary persona's goals cannot be met
          by an interface aimed at another without unacceptable compromise, so
          there is typically one per interface.
      SECONDARY:
        description: >-
          Largely satisfied by the primary's interface, with a few specific
          additional needs to accommodate without compromising the primary.
      SUPPLEMENTAL:
        description: >-
          Fully satisfied by the primary and secondary interfaces. Modelled for
          organisational reasons, so a stakeholder sees their user represented.
      CUSTOMER:
        description: >-
          The buyer rather than the daily user. Dictates purchasing,
          administration and compliance constraints, common in enterprise sales.
      SERVED:
        description: >-
          Directly affected by the product without ever touching it — the
          patient whose vitals a nurse records.
      NEGATIVE:
        description: >-
          Explicitly not designed for, named so that the exclusion is a decision
          rather than an oversight.

  PersonaGoalType:
    description: >-
      Cooper's three tiers of user goal, mapped in *About Face* against Don
      Norman's visceral, behavioural and reflective levels of processing.
    permissible_values:
      EXPERIENCE:
        description: >-
          Visceral. How the user wants to feel while using the product — "stay
          in control", "not feel stupid". Drives tone and microinteraction.
      END:
        description: >-
          Behavioural. What the user wants to accomplish — "process an invoice
          without manual reconciliation". Drives architecture and workflow, and
          is the tier that is Goal-shaped.
      LIFE:
        description: >-
          Reflective. Who the user wants to be — "be recognised as an expert".
          Rarely decides a button, but underpins positioning.

  ChallengeType:
    description: >-
      The shape of a Challenge. The source ontology gives an open list
      ("defects, epics, features, tasks, etc."), so this enum is illustrative
      rather than closed; extend it as new challenge shapes are adopted.
    permissible_values:
      DEFECT:
        description: Observed behaviour differs from intended behaviour.
      EPIC:
        description: A large body of work decomposed into features.
      FEATURE:
        description: A unit of delivered capability, decomposed into tasks.
      TASK:
        description: A single unit of executable work.
      SPIKE:
        description: A time-boxed investigation that resolves uncertainty.
      CHORE:
        description: Upkeep work that changes no external behaviour.

  MemoryKind:
    description: The kind of retained state an Actor carries between Jobs.
    permissible_values:
      EPISODIC:
        description: What happened, and when.
      SEMANTIC:
        description: Facts held to be true.
      PROCEDURAL:
        description: How to carry out a method.
      WORKING:
        description: State held only for the current Job.


  AttestationMethod:
    description: >-
      How a WorkloadIdentity is proved. Attestation establishes what a workload
      is; it does not rely on the workload holding a secret.
    permissible_values:
      PLATFORM:
        description: The runtime platform vouches for the workload, e.g. a node agent attesting a process, container or pod.
      HARDWARE:
        description: A hardware root of trust vouches for the workload, e.g. a TPM or a secure enclave.
      OIDC_FEDERATION:
        description: A trusted OIDC issuer vouches for the workload and its claims are federated into the trust domain.
      SIGNED_ARTIFACT:
        description: A signature over the workload artifact or its manifest establishes the identity.
      STATIC_CREDENTIAL:
        description: >-
          A long-lived secret stands in for attestation. Recorded so that it can
          be found and removed, not endorsed.

  ExecutionOutcome:
    description: How an Execution ended.
    permissible_values:
      IN_PROGRESS:
        description: Still running, so there is no end time yet.
      SUCCEEDED:
        description: Ended with the Definition of Done met.
      FAILED:
        description: Ended without the Definition of Done met.
      ABANDONED:
        description: Stopped before reaching an end state, e.g. cancelled or timed out.
      BLOCKED:
        description: Stopped because something outside the Remit was needed.

  AuditOutcome:
    description: What happened when a Capability was employed on a Securable.
    permissible_values:
      ALLOWED:
        description: The action was carried out.
      DENIED:
        description: The action was refused by policy before it took effect.
      ERROR:
        description: The action was attempted and failed for a reason other than policy.

  ComponentType:
    description: >-
      The kind of part listed in an AgentBillOfMaterials. Kept close to the
      component taxonomies of CycloneDX ML-BOM and the SPDX 3.0 AI profile so
      that a BOM here can be exported to either.
    permissible_values:
      MODEL:
        description: The inference model, at a named version.
      PERSONA:
        description: Character-defining prose, e.g. a SOUL.md, pinned by content digest.
      PROMPT:
        description: A system or task prompt supplied at run time.
      SKILL:
        description: A SKILL definition available to the Actor.
      TOOL:
        description: A tool the Actor could call.
      MCP_SERVER:
        description: A server providing tools or resources over MCP.
      DATASET:
        description: Data the Actor was trained, tuned or grounded on.
      MEMORY_STORE:
        description: A Memory made readable or writable during the Execution.
      LIBRARY:
        description: A conventional software dependency, as an SBOM would list it.

#-------------------------------------------------------------------------------
# Slots
#-------------------------------------------------------------------------------

slots:

  id:
    description: Stable identifier for the entity.
    identifier: true
    range: uriorcurie

  name:
    description: Short human-readable label.

  description:
    description: Free-text account of the entity.

  # Persona
  soul:
    description: Pointer to the SOUL.md that gives the Persona its character.
    range: uriorcurie

  communication_style:
    description: >-
      How the Persona expresses itself, e.g. tone, register, verbosity, channel
      conventions. The source ontology marks this element as provisional.

  # Persona
  persona_kind:
    description: The role this Persona plays in a design.
    range: PersonaKind

  persona_goals:
    description: >-
      What the Persona is trying to achieve. Cooper's personas are defined by
      goals rather than by tasks or demographics.
    range: PersonaGoal
    multivalued: true
    inlined_as_list: true
    comments:
      - >-
        User goals only. *About Face* keeps business goals and technical goals
        deliberately outside the persona so they cannot pollute the user model,
        which is why this enum has three values and not five.

  goal_type:
    description: Which tier of Cooper's goal taxonomy this is.
    range: PersonaGoalType

  context:
    description: The circumstances the Persona acts in — setting, constraints, what surrounds the work.

  behaviors:
    description: What the Persona characteristically does, observed rather than assumed.
    multivalued: true

  frustrations:
    description: What currently gets in the Persona's way.
    multivalued: true

  proficiencies:
    description: What the Persona is fluent in, and what it is not.
    multivalued: true

  # Capability
  capability_kind:
    description: Whether the Capability is a skill, a tool, or something else.
    range: CapabilityKind

  composed_of:
    description: >-
      The Capabilities this one is built from. A skill composes tools and may
      compose other skills; a tool is atomic. Bill-of-materials and audit
      resolution follow this relation down to the tools that actually run.
      Tool atomicity is enforced by a rule on Capability; the absence of cycles
      is not, and has to be checked by whatever tooling reads these files.
    range: Capability
    multivalued: true

  # Securable
  members:
    description: The objects that make up the Securable set, named individually.
    range: uriorcurie
    multivalued: true

  selector:
    description: >-
      Rule that determines membership of the Securable set, for sets too large
      or too dynamic to enumerate, e.g. a path glob or a label query.

  # Permission
  capability:
    description: The Capability that may be employed.
    range: Capability

  securable:
    description: The Securable the Capability may be employed on.
    range: Securable

  condition:
    description: Constraint that limits when the authority holds, e.g. a time window.

  # Role
  capabilities:
    description: The Capabilities gathered under the Role.
    range: Capability
    multivalued: true

  # Challenge
  challenge_type:
    description: The shape of the Challenge.
    range: ChallengeType

  parent_challenge:
    description: The Challenge this one decomposes, e.g. the epic of a feature.
    range: Challenge

  # Definition of Done
  criteria:
    description: The criteria that, all being met, make the Goal done.
    range: AcceptanceCriterion
    multivalued: true
    inlined_as_list: true

  statement:
    description: What must be true, stated so that it can be checked.

  metric:
    description: The quantity observed to check the criterion.

  target_value:
    description: The value the metric must reach, held as text to allow bounds.

  unit:
    description: Unit the metric is measured in.

  # Job to be done
  situation:
    description: The circumstance that triggers the need ("When ...").

  motivation:
    description: What the Role wants to do in that situation ("I want to ...").

  expected_outcome:
    description: The outcome that makes the need satisfied ("so that ...").

  role:
    description: The Role the work is done as.
    range: Role

  persona:
    description: The Persona whose job this is — the user the work is for.
    range: Persona

  # Goal
  challenge:
    description: The Challenge the Goal addresses.
    range: Challenge

  definition_of_done:
    description: The measurable completion test for the Goal.
    range: DefinitionOfDone

  jtbd:
    description: The Job to be Done the Goal serves.
    range: JobToBeDone

  deadline:
    description: The instant by which the Goal must be met.
    range: datetime

  # Remit
  permissions:
    description: The Permissions granted.
    range: Permission
    multivalued: true

  goal:
    description: The Goal the Permissions are granted for.
    range: Goal

  # Agency
  remit:
    description: The Remit exercised.
    range: Remit

  # Actor
  personality:
    description: >-
      The character presented — by an Actor doing work, or by a Persona when an
      Actor adopts one to be interrogated.
    range: Personality

  identity:
    description: The Identity the Actor authenticates as.
    range: Identity

  memories:
    description: The Memory the Actor carries between Jobs.
    range: Memory
    multivalued: true

  subject:
    description: The principal the Identity denotes, e.g. an account name.

  issuer:
    description: The authority that vouches for the Identity.

  memory_kind:
    description: The kind of retained state.
    range: MemoryKind

  store:
    description: Where the Memory is held, e.g. a directory or index URI.
    range: uriorcurie

  # Job and Collaboration
  actor:
    description: The Actor that holds the Job.
    range: Actor

  agency:
    description: The Agency the Actor is given.
    range: Agency

  jobs:
    description: The Jobs that meet on the shared Challenge.
    range: Job
    multivalued: true

  # Container
  personalities:
    description: The Personalities in the collection.
    range: Personality
    multivalued: true
    inlined_as_list: true
  personas:
    description: The Personas in the collection.
    range: Persona
    multivalued: true
    inlined_as_list: true
  capability_set:
    description: The Capabilities in the collection.
    range: Capability
    multivalued: true
    inlined_as_list: true
  securables:
    description: The Securables in the collection.
    range: Securable
    multivalued: true
    inlined_as_list: true
  permission_set:
    description: The Permissions in the collection.
    range: Permission
    multivalued: true
    inlined_as_list: true
  roles:
    description: The Roles in the collection.
    range: Role
    multivalued: true
    inlined_as_list: true
  challenges:
    description: The Challenges in the collection.
    range: Challenge
    multivalued: true
    inlined_as_list: true
  definitions_of_done:
    description: The Definitions of Done in the collection.
    range: DefinitionOfDone
    multivalued: true
    inlined_as_list: true
  jobs_to_be_done:
    description: The Jobs to be Done in the collection.
    range: JobToBeDone
    multivalued: true
    inlined_as_list: true
  goals:
    description: The Goals in the collection.
    range: Goal
    multivalued: true
    inlined_as_list: true
  remits:
    description: The Remits in the collection.
    range: Remit
    multivalued: true
    inlined_as_list: true
  agencies:
    description: The Agencies in the collection.
    range: Agency
    multivalued: true
    inlined_as_list: true
  principal_identities:
    description: The durable Identities in the collection.
    range: PrincipalIdentity
    multivalued: true
    inlined_as_list: true
  workload_identities:
    description: The attested workload Identities in the collection.
    range: WorkloadIdentity
    multivalued: true
    inlined_as_list: true
  executions:
    description: The Executions in the collection.
    range: Execution
    multivalued: true
    inlined_as_list: true
  boms:
    description: The Agent Bills of Materials in the collection.
    range: AgentBillOfMaterials
    multivalued: true
    inlined_as_list: true
  audit_records:
    description: The Audit Records in the collection.
    range: AuditRecord
    multivalued: true
    inlined_as_list: true
  memory_set:
    description: The Memories in the collection.
    range: Memory
    multivalued: true
    inlined_as_list: true
  actors:
    description: The Actors in the collection.
    range: Actor
    multivalued: true
    inlined_as_list: true
  job_set:
    description: The Jobs in the collection.
    range: Job
    multivalued: true
    inlined_as_list: true
  collaborations:
    description: The Collaborations in the collection.
    range: Collaboration
    multivalued: true
    inlined_as_list: true


  # Identity
  attestation_method:
    description: How the WorkloadIdentity is proved.
    range: AttestationMethod

  attestation_evidence:
    description: >-
      Pointer to the evidence behind the attestation, e.g. a signed document or
      an entry in a verification log.
    range: uriorcurie

  not_before:
    description: Instant from which the Identity is valid.
    range: datetime

  not_after:
    description: >-
      Instant after which the Identity is no longer valid. A workload identity
      should be short-lived enough that revocation is rarely needed.
    range: datetime

  acts_on_behalf_of:
    description: >-
      The Identity whose authority this one exercises. The delegation link that
      keeps an agent's actions distinct from the principal's while still
      resolving to it.
    range: Identity
    close_mappings:
      - prov:actedOnBehalfOf

  # Execution
  job:
    description: The Job this Execution carries out.
    range: Job

  workload_identity:
    description: The attested Identity the Execution ran as.
    range: WorkloadIdentity
    close_mappings:
      - prov:wasAssociatedWith

  bom:
    description: What the Actor was composed of at the start of this Execution.
    range: AgentBillOfMaterials

  started_at:
    description: When the Execution began.
    range: datetime

  ended_at:
    description: When the Execution ended.
    range: datetime

  visible_securables:
    description: >-
      The Securables actually placed in the Actor's context during the
      Execution, as distinct from those merely reachable under its Permissions.
      Visibility is the tighter constraint, and it is the one that governs
      leakage.
    range: Securable
    multivalued: true

  outcome:
    description: How something ended. The using class fixes the range.

  # Bill of materials
  subject_actor:
    description: The Actor whose composition is recorded.
    range: Actor

  generated_at:
    description: When the bill of materials was captured.
    range: datetime

  bom_format:
    description: >-
      The external format this bill of materials is expressible in, e.g.
      "CycloneDX 1.6" or "SPDX 3.0 AI profile".

  components:
    description: The parts the Actor was composed of, each pinned to an immutable reference.
    range: Component
    multivalued: true
    inlined_as_list: true

  component_type:
    description: The kind of part.
    range: ComponentType

  version:
    description: Version of the component, as its supplier names it.

  digest:
    description: >-
      Content hash pinning the component, e.g. "sha256:...". Prose that steers
      behaviour, such as a SOUL.md, is an unpinned dependency without one.

  supplier:
    description: Who or what provides the component.

  source:
    description: Where the component was obtained from.
    range: uriorcurie

  entity_ref:
    description: >-
      The ontology entity this component pins, e.g. the Capability, Persona or
      Memory that it is the immutable form of.
    range: uriorcurie

  # Audit
  execution:
    description: The Execution the record belongs to.
    range: Execution

  under_permission:
    description: >-
      The Permission that authorized the action. Empty means no grant covered
      it, which with an ALLOWED outcome is a violation.
    range: Permission

  target:
    description: The specific object acted on, which should be a member of the Securable.
    range: uriorcurie

  occurred_at:
    description: When the action took place.
    range: datetime

  detail:
    description: Anything else needed to make the record intelligible on its own.

#-------------------------------------------------------------------------------
# Classes
#-------------------------------------------------------------------------------

classes:

  WorkEntity:
    abstract: true
    description: Base for every identified entity in the ontology.
    slots:
      - id
      - name
      - description

  Personality:
    is_a: WorkEntity
    description: >-
      The character an Actor presents: its SOUL.md together with its
      communication style. What the original sketch called a Persona; renamed
      once Cooper's Persona was taken up as its own concept (DR-019).
    slots:
      - soul
      - communication_style

  Persona:
    is_a: WorkEntity
    description: >-
      A user archetype the product is designed *for*, in Alan Cooper's sense
      from *The Inmates Are Running the Asylum*: a specific, detailed, named
      figure standing in for a class of real people. Distinct from Personality,
      which is the character an Actor presents while working.
    comments:
      - >-
        The detail is the discipline. A sketch answers questions differently
        from a rigorously modelled figure, which is why Cooper insists on
        research over invention. A thin Persona cannot be usefully interrogated.
      - >-
        Interrogation needs no new machinery: an Actor adopts the Persona's
        Personality and holds a Job to be questioned. The Persona is worn, never
        authenticated, so an AuditRecord still attributes to the workload
        identity rather than to a fictional person.
      - >-
        A JobToBeDone names the Persona whose need it is (DR-021). Interrogating
        a Persona to surface one is the intended path from user research into
        the work.
    slots:
      - persona_kind
      - persona_goals
      - context
      - behaviors
      - frustrations
      - proficiencies
      - personality
    slot_usage:
      name:
        required: true
      persona_kind:
        required: true

  PersonaGoal:
    description: >-
      One goal held by a Persona, at one of Cooper's three tiers.
    comments:
      - >-
        An END goal is Goal-shaped: specific, and with a plain test for having
        been reached. What it lacks is a Deadline — it is standing and recurring
        rather than a bounded commitment — so it is not yet an instance of Goal,
        whose deadline is required to keep a Goal SMART (DR-003). Whether to
        share an abstraction between them is open; see DR-020.
      - >-
        EXPERIENCE and LIFE goals are not Goal-shaped at all and are not
        candidates for it.
    slots:
      - goal_type
      - statement
    slot_usage:
      goal_type:
        required: true
      statement:
        required: true
        description: The goal in the Persona's own terms.

  Capability:
    is_a: WorkEntity
    description: >-
      A kind of thing that can be done or used, e.g. a SKILL or a Tool.
      A Capability is not authority; authority is a Permission.
    slots:
      - capability_kind
      - composed_of
    slot_usage:
      name:
        required: true
      capability_kind:
        required: true
    rules:
      - description: >-
          A tool is atomic. Only a skill composes other Capabilities, so a
          Capability of kind TOOL carries no composed_of.
        preconditions:
          slot_conditions:
            capability_kind:
              equals_string: TOOL
        postconditions:
          slot_conditions:
            composed_of:
              value_presence: ABSENT

  Securable:
    is_a: WorkEntity
    description: >-
      A set of objects that Permissions can be granted over. Membership is
      given by enumeration, by a selector rule, or by both.
    slots:
      - members
      - selector

  Permission:
    is_a: WorkEntity
    description: The authority to employ a Capability on a Securable.
    slots:
      - capability
      - securable
      - condition
    slot_usage:
      capability:
        required: true
      securable:
        required: true

  Role:
    is_a: WorkEntity
    description: A named set of Capabilities.
    slots:
      - capabilities
    slot_usage:
      name:
        required: true
      capabilities:
        required: true
    close_mappings:
      - prov:Role

  Challenge:
    is_a: WorkEntity
    description: >-
      A problem to be addressed, e.g. a defect, epic, feature or task. A
      Challenge supplies the specificity of a SMART Goal.
    slots:
      - challenge_type
      - parent_challenge
    slot_usage:
      challenge_type:
        required: true

  AcceptanceCriterion:
    description: >-
      One checkable condition in a Definition of Done. State the metric and
      target where the criterion is quantitative.
    slots:
      - statement
      - metric
      - target_value
      - unit
    slot_usage:
      statement:
        required: true

  DefinitionOfDone:
    is_a: WorkEntity
    description: >-
      The test that decides whether a Goal has been met. It supplies the
      measurability of a SMART Goal.
    slots:
      - criteria
    slot_usage:
      criteria:
        required: true

  JobToBeDone:
    is_a: WorkEntity
    description: >-
      The need the work serves, stated from the point of view of the Persona
      that has it. It supplies the achievability and relevance of a SMART Goal,
      and it is the element that names the Persona. Distinct from Job, which is
      an assignment.
    comments:
      - >-
        The original sketch had this specify a Role, which made the need the
        worker's. It states the *user's* job (DR-021), so it names a Persona.
        One consequence: an Agency's Role is no longer implied by its Goal, and
        choosing it becomes an explicit act rather than a derivation.
      - >-
        Which of the Persona's END goals a given need serves is reachable
        through the Persona but not stated directly. Whether that edge is worth
        drawing is open.
    slots:
      - situation
      - motivation
      - expected_outcome
      - persona
    slot_usage:
      motivation:
        required: true
      persona:
        required: true

  Goal:
    is_a: WorkEntity
    description: >-
      A SMART goal. Specific by its Challenge, Measurable by its Definition of
      Done, Achievable and Relevant by its Job to be Done, Time-bound by its
      Deadline. All four parts are required; a Goal missing one is not SMART.
    slots:
      - challenge
      - definition_of_done
      - jtbd
      - deadline
    slot_usage:
      challenge:
        required: true
      definition_of_done:
        required: true
      jtbd:
        required: true
      deadline:
        required: true

  Remit:
    is_a: WorkEntity
    description: >-
      A Goal together with the Permissions granted to pursue it: what may be
      done, and what it is to be done for.
    slots:
      - permissions
      - goal
    slot_usage:
      permissions:
        required: true
      goal:
        required: true

  Agency:
    is_a: WorkEntity
    description: >-
      A Role together with a Remit: the standing set of Capabilities, and the
      Permissions and Goal that direct their use.
    slots:
      - role
      - remit
    slot_usage:
      role:
        required: true
      remit:
        required: true

  Identity:
    is_a: WorkEntity
    abstract: true
    description: >-
      The principal an Actor authenticates as. Abstract, because every Identity
      is either held durably by a principal or attested for a running workload,
      and an audit trail that conflates the two cannot say who did anything.
    slots:
      - subject
      - issuer
    slot_usage:
      subject:
        required: true

  PrincipalIdentity:
    is_a: Identity
    description: >-
      A durable Identity held by a human or a long-lived service account, proved
      by a credential the holder keeps.

  WorkloadIdentity:
    is_a: Identity
    description: >-
      An Identity attested for a running workload rather than presented by it:
      the platform vouches for what the workload is, and the Identity is issued
      per run and short-lived. A SPIFFE ID goes in `subject`, e.g.
      "spiffe://solorepo/agent/architect".
    slots:
      - attestation_method
      - attestation_evidence
      - not_before
      - not_after
      - acts_on_behalf_of
    slot_usage:
      attestation_method:
        required: true
      acts_on_behalf_of:
        recommended: true
    comments:
      - >-
        Without acts_on_behalf_of, every action an agent takes resolves to the
        principal that launched it, and in a team of one the audit trail
        collapses into a single name.

  Memory:
    is_a: WorkEntity
    description: State an Actor retains across Jobs.
    slots:
      - memory_kind
      - store

  Actor:
    is_a: WorkEntity
    description: A Personality with an Identity and a Memory.
    slots:
      - personality
      - identity
      - memories
    slot_usage:
      personality:
        required: true
      identity:
        required: true
    close_mappings:
      - prov:Agent

  Job:
    is_a: WorkEntity
    description: An Actor given an Agency.
    slots:
      - actor
      - agency
    slot_usage:
      actor:
        required: true
      agency:
        required: true

  Collaboration:
    is_a: WorkEntity
    description: >-
      For a Challenge C, the Jobs that meet on it: every Job whose
      agency.remit.goal.challenge is C. Two Jobs are the minimum that can meet.
    comments:
      - >-
        Membership invariant, which LinkML cannot state over a path of this
        depth: for every job in jobs,
        job.agency.remit.goal.challenge == collaboration.challenge.
        Derive the member list from the Jobs rather than maintaining it by hand.
    slots:
      - challenge
      - jobs
    slot_usage:
      challenge:
        required: true
      jobs:
        required: true
        minimum_cardinality: 2

  Execution:
    is_a: WorkEntity
    description: >-
      One carrying-out of a Job, and the runtime counterpart of the assignment.
      The design-time classes say what may be done; an Execution is where it
      was done, by whom, out of what parts.
    slots:
      - job
      - workload_identity
      - bom
      - visible_securables
      - started_at
      - ended_at
      - outcome
    slot_usage:
      job:
        required: true
      workload_identity:
        required: true
      started_at:
        required: true
      bom:
        recommended: true
      outcome:
        range: ExecutionOutcome
        required: true
    rules:
      - description: An Execution that has stopped records when it ended.
        preconditions:
          slot_conditions:
            outcome:
              any_of:
                - equals_string: SUCCEEDED
                - equals_string: FAILED
                - equals_string: ABANDONED
                - equals_string: BLOCKED
        postconditions:
          slot_conditions:
            ended_at:
              required: true
    comments:
      - >-
        AuditRecords point at the Execution instead of being listed inside it,
        so that a long log can be written and shipped while the run continues.
    close_mappings:
      - prov:Activity

  Component:
    description: >-
      One pinned part of an Actor's composition. A Component is an immutable
      reference; the ontology entity it stands for is named by entity_ref.
    slots:
      - name
      - description
      - component_type
      - version
      - digest
      - supplier
      - source
      - entity_ref
    slot_usage:
      name:
        required: true
      component_type:
        required: true
      digest:
        recommended: true

  AgentBillOfMaterials:
    is_a: WorkEntity
    description: >-
      What an Actor was made of at a moment: the Actor and Agency graph resolved
      to immutable references. An AIBOM adds no new taxonomy of parts. It pins
      the parts this ontology already names, Persona, Capabilities and Memory,
      and adds the model and its supply chain.
    slots:
      - subject_actor
      - generated_at
      - bom_format
      - components
    slot_usage:
      subject_actor:
        required: true
      generated_at:
        required: true
      components:
        required: true

  AuditRecord:
    is_a: WorkEntity
    description: >-
      One employment of a Capability on a Securable during an Execution. An
      AuditRecord is a Permission in the past tense: the same triple of
      Capability, Securable and Actor, stated as fact rather than as authority.
    slots:
      - execution
      - capability
      - securable
      - target
      - under_permission
      - occurred_at
      - outcome
      - detail
    slot_usage:
      execution:
        required: true
      capability:
        required: true
      securable:
        required: true
      occurred_at:
        required: true
      outcome:
        range: AuditOutcome
        required: true
    comments:
      - >-
        Diffing records against grants makes least privilege a report: an
        ALLOWED record with no under_permission is a violation, and a Permission
        in a Remit with no matching record across Executions is an over-grant.
      - >-
        under_permission is deliberately optional. A log that could not hold an
        unauthorized action would be useless, so a violation has to be a valid
        AuditRecord.
      - >-
        Two invariants LinkML cannot state over paths of this depth: the
        authorizing Permission should be one of
        execution.job.agency.remit.permissions, and target should be a member of
        securable.
      - >-
        A serialized log will usually copy the workload identity onto every
        record. Here it is reached through the Execution.
    close_mappings:
      - prov:Usage

  WorkOntology:
    tree_root: true
    description: Container for a set of work-ontology instances.
    slots:
      - personalities
      - personas
      - capability_set
      - securables
      - permission_set
      - roles
      - challenges
      - definitions_of_done
      - jobs_to_be_done
      - goals
      - remits
      - agencies
      - principal_identities
      - workload_identities
      - memory_set
      - actors
      - job_set
      - collaborations
      # runtime
      - executions
      - boms
      - audit_records
