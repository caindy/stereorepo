target-version = "py313"

[lint]
select = [
    "E4",
    "E7",
    "E9",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "C4",
    "C90",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "SIM",
    "RUF",
    "PTH",
]
ignore = []

[lint.mccabe]
max-complexity = 12

[lint.pylint]
max-args = 5
max-branches = 12
max-statements = 50

[lint.isort]
known-first-party = ["citations", "graph", "probes", "collect", "files", "check_pr", "channel", "lib", "depth"]
