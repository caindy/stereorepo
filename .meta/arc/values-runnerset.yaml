# Helm values for gha-runner-scale-set: the runners themselves, scoped to
# this repository only (not the org) — caindy/solorepo's own decision, not a
# general default (solorepo's DR-137).
githubConfigUrl: https://github.com/caindy/solorepo

# The name a workflow's `runs-on:` targets. `deploy` also installs this
# release under this name, so the two stay the same word by construction.
runnerScaleSetName: arc-runner-set

# `deploy` creates this Secret from whatever token it is holding — never
# written here, never committed.
githubConfigSecret: arc-github-token

# Scale to zero when idle: this cluster is somebody's machine, not a fleet,
# and should not hold a pod open for nothing.
#
# DR-141 sized maxRunners to eight (one gate run, advance, three loop sessions)
# with unbounded pod resources. DR-147 bounds runner pods with explicit CPU
# and memory requests/limits tracking observed peak session usage, and expands
# maxRunners to twelve (solorepo's DR-147).
#
# Pod resources:
# - requests.memory: 2Gi (tracks the ~1.9-2.0 GiB peak observed for Claude Code
#   sessions, so the scheduler guarantees node memory is never oversubscribed;
#   12 pods request 24 GiB of 31.2 GiB allocatable, leaving 7.2 GiB headroom).
# - limits.memory: 4Gi (caps rogue builds or memory leaks at 2x above the
#   heaviest observed workload of ~1.9 GiB peak for Claude Code / ~1.5 GiB for
#   Python seed).
# - requests.cpu: "1" (guarantees scheduling floor and fair CPU shares under
#   contention across 24 cores).
# - limits.cpu: omitted (avoids CFS quota throttling so jobs burst freely across
#   idle cores).
#
# Twelve accommodates two full gate runs (8 jobs), advance (1 job), and three
# loop sessions (3 jobs) simultaneously.
minRunners: 0
maxRunners: 12

template:
  spec:
    initContainers:
      - name: setup-codex-auth
        image: ghcr.io/caindy/solorepo-runner:2.337.0-5
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            if [ -f /codex-src/auth.json ]; then
              mkdir -p /codex-dest
              cp /codex-src/auth.json /codex-dest/auth.json
              chmod 600 /codex-dest/auth.json
            fi
        volumeMounts:
          - name: codex-creds-secret
            mountPath: /codex-src
            readOnly: true
          - name: codex-home
            mountPath: /codex-dest
      - name: setup-gemini-creds
        image: ghcr.io/caindy/solorepo-runner:2.337.0-5
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
          - |
            mkdir -p /gemini-dest/antigravity-cli
            for f in oauth_creds.json jetski-standalone-oauth-token google_accounts.json; do
              if [ -f "/gemini-src/$f" ]; then
                cp "/gemini-src/$f" /gemini-dest/
                chmod 600 "/gemini-dest/$f"
              fi
            done
            for f in antigravity-oauth-token settings.json; do
              if [ -f "/gemini-src/$f" ]; then
                cp "/gemini-src/$f" /gemini-dest/antigravity-cli/
                chmod 600 "/gemini-dest/antigravity-cli/$f"
              fi
            done
        volumeMounts:
          - name: gemini-creds-secret
            mountPath: /gemini-src
            readOnly: true
          - name: gemini-home
            mountPath: /gemini-dest
    containers:
      - name: runner
        # Single-source runner image on GHCR (solorepo's DR-156, solorepo's DR-160)
        image: ghcr.io/caindy/solorepo-runner:2.337.0-5
        imagePullPolicy: IfNotPresent
        command: ["/home/runner/run.sh"]
        volumeMounts:
          - name: gemini-home
            mountPath: /home/runner/.gemini
          - name: codex-home
            mountPath: /home/runner/.codex
        env:
          - name: COPILOT_GITHUB_TOKEN
            valueFrom:
              secretKeyRef:
                name: arc-copilot-credentials
                key: COPILOT_GITHUB_TOKEN
                optional: true
        resources:
          requests:
            cpu: "1"
            memory: 2Gi
          limits:
            memory: 4Gi
    volumes:
      - name: codex-creds-secret
        secret:
          secretName: arc-codex-credentials
          optional: true
      - name: codex-home
        emptyDir: {}
      - name: gemini-creds-secret
        secret:
          secretName: arc-gemini-credentials
          optional: true
      - name: gemini-home
        emptyDir: {}
