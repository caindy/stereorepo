# Helm values for gha-runner-scale-set: the runners themselves, scoped to
# this repository only (not the org) — caindy/solorepo's own decision, not a
# general default (solorepo's DR-137).
githubConfigUrl: https://github.com/caindy/solorepo

# The name a workflow's `runs-on:` targets. `deploy` also installs this
# release under this name, so the two stay the same word by construction.
runnerScaleSetName: arc-runner-set

# `deploy` creates this Secret from whatever token it is holding — never
# written here, never committed.
githubConfigSecret: arc-github-token

# Scale to zero when idle: this cluster is somebody's machine, not a fleet,
# and should not hold a pod open for nothing.
#
# maxRunners is what one gate run needs at once plus the loops it has to run
# beside, measured on the machine that runs it (solorepo's DR-141). Since
# DR-140 every job of every workflow lands here: a pull request's gate is
# four jobs — `files`, `rust seed`, `python seed` and `pull request` — that
# become eligible together, three of them required checks in `main`'s ruleset
# (`python seed` is not one yet), `advance` is a fifth pod on every push to
# `main`, and `coder.yml` and `review.yml` hold one each for up to 75 and 50
# minutes. Two slots made those four run one or two at a time behind whatever
# session was already there.
#
# Eight is four plus `advance` plus three loop sessions, and it fits: the
# heaviest pod measured on this node peaks near 2 GiB (a Claude Code
# session; `python seed` 1.5 GiB, `rust seed` 0.7 GiB), so eight is about
# 16 GiB of 31, and a whole gate spends ~155 CPU-seconds over ~45 seconds of
# wall clock — under four of 24 cores. Those 45 seconds are the work, with the
# toolchains already there; a `rust seed` *job* is 85 to 107 seconds because it
# installs its own first — `apt-get install build-essential` measures 25 to 27
# of them. The CPU-seconds size the node, the job durations are the latency
# floor. A ninth queued job means the fleet is eight, not that something failed
# to serialize.
minRunners: 0
maxRunners: 8
