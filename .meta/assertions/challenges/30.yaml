challenges:
  - id: work:challenge/30
    name: "What is open on the machine users: the reviewer's account, and where the tokens live"
    challenge_type: SPIKE
    description: >-
      DR-066 chose two machine users and left two questions open, the second of
      which decides whether any of it is real: whether the reviewing agent gets
      an account or stays Copilot, which settles whether Roles are a general
      mechanism here or only the seam between the solo and one agent; and where
      the tokens live, since two tokens in one `~/.config/gh` is a single Remit
      wearing two names.
