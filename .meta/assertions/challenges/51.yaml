challenges:
  - id: work:challenge/51
    name: The Rust standard is designed and not built
    challenge_type: FEATURE
    description: >-
      `bootstraps/rust/` held a design for one Discipline and a table of six
      not started, with no Rust in the repository and no Project to assert,
      because a Project whose gate does not run cannot be. A portfolio that
      chose Rust at Specialization would have copied in a document. Finished
      means a seed whose gate runs and can fail, a page per Discipline saying
      how it is held in Rust, and the seed rendered and gated in the workflow.
