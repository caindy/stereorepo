challenges:
  - id: work:challenge/577
    name: receipt arrived by use, carries two senses, and the Charter uses the one solorepo's DR-171 rejected
    challenge_type: DEFECT
    description: >-
      `receipt` reached `.meta/assertions/imported/charter.yaml`,
      seven Decisions — solorepo's DR-087, solorepo's DR-091, solorepo's DR-101,
      solorepo's DR-171, solorepo's DR-207, solorepo's DR-209 and
      solorepo's DR-218 — the Nothing Unconsumed Discipline,
      `.meta/checks/files/history.py`, every history log under `.meta/` and both
      Bootstraps, so every portfolio inherits it. It is in neither
      `vocabulary.yaml` nor `work_ontology.yaml` and has no page under `wiki/`,
      so under solorepo's Article 17 it has not been agreed.

      It also carries two senses. Where the word binds it means a named,
      resolvable symbol that would fail if the change were undone:
      `receipt_symbols()` parses a module and resolves the name. Where it
      appears in commentary it means a provenance citation — the Charter's
      "`origin` is the receipt", the Disciplines' "its ADRs carry the receipts"
      — and a provenance citation is the thing solorepo's DR-171 turned down. Its
      rejected alternative was "Commit hashes or pull request citations as
      receipts", refused as not mechanically falsifiable: the hash is unchanged
      when the change is undone, so the gate cannot detect staleness. So the
      Charter used the word for the kind of thing a Decision had already refused
      to let it name.

      The mechanical half of solorepo's Article 17 could not have caught it:
      `ubiquitous language wiki parity` compares minted concepts against wiki
      pages, so a word in neither set satisfies it trivially, and
      solorepo's DR-190 rejected word-frequency heuristics for the reviewer half,
      recording that counting word repetition across a diff produced noise and
      triage fatigue when it was attempted.
