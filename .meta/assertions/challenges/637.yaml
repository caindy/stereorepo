challenges:
  - id: work:challenge/637
    name: Give the Gemini CLI reviewer a working path to /pr-first-reviewer (or its DR-107 equivalent)
    challenge_type: FEATURE
    description: >-
      The Gemini CLI reviewer prompt in .github/workflows/review.yml instructs the session
      to read /pr-first-reviewer, which Claude Code satisfies via its native Skill tool.
      Under Antigravity CLI (solorepo's DR-245), skills exist as markdown files under
      .agents/skills/. Deliver a concrete working path to .agents/skills/pr-first-reviewer/SKILL.md,
      adapt reviewer evaluation to a single-session turn without subagents, and mechanically
      confine subagents via permissions deny to prevent premature headless batch turn exits.
