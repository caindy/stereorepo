challenges:
  - id: work:challenge/527
    name: Split .meta/wikisplain.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/wikisplain.py` was 519 lines: the lead-sentence rules, the
      duplicate search, the wikilink embedding, the page scaffold and its
      verification, and the command line in one script, three of its
      functions over the seed's complexity ceiling. The ceiling and the pylint
      size rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into
      `.meta/lib/wikisplain/` under the convention solorepo's DR-217 sets for
      a script, then refactor one module at a time.
