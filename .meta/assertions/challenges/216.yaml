challenges:
  - id: work:challenge/216
    name: A by-hand dispatch of the coder's pass has no verb, so the act the Discipline names is performed outside the channel
    challenge_type: FEATURE
    description: >-
      `coder.yml` takes `workflow_dispatch` with `pull_request` and `task`
      (`review` or `rebase`), and two places name that dispatch as a person's
      act: PR First's *Raise a Challenge with the form* step, where a verdict a session leaves behind is
      the solo's to dispatch, and DR-142, which leaves the review dispatch
      unguarded because the solo dispatching is the solo deciding. The only way
      to make it was `gh workflow run coder.yml -f pull_request=<n> -f
      task=<t>`, typed with whatever credential `gh` holds and named by neither
      `GH_WRITES` nor the permission list, so nothing refused it either. The
      machine's dispatch was the channel's — `advance` makes it through
      `channel.gh` as the coder — and a person's was not. The trigger is every
      standing verdict, and every branch conflicting after a merge, that needs
      a Job started by hand: #201 was in that state on the evening #213 was
      raised.
