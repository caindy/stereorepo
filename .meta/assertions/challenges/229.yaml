challenges:
  - id: work:challenge/229
    name: The half-hourly sweep dies on a permission the gate never grants
    challenge_type: DEFECT
    description: >-
      From #156, which put `statusCheckRollup` into the sweep's one fetch of
      every open pull request, every scheduled `gate` run died before
      publishing a verdict: `gh`'s own GraphQL for that JSON field traverses
      `checkSuite.workflowRun`, an Actions resource the gate's token does not
      hold. Seven consecutive scheduled failures, invisible because the pull
      request gate takes a path that never calls `gh pr list`. With the sweep
      dead, a pull request that went red once keeps that verdict until somebody
      pushes to it, which is the merge gate reporting a fact about the past.
      `template/.github/workflows/gate.yml` carries the same permissions block,
      so every portfolio cloned since #156 inherits a sweep that dies on its
      first scheduled run.
