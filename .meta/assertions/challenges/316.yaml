challenges:
  - id: work:challenge/316
    name: Harden control plane, coder handoffs, and check rollup deduplication against stalls
    challenge_type: DEFECT
    description: >-
      Five control plane loopholes cause pull requests to stall silently without autonomous resolution:
      historical check run failures persist in GitHub rollup API responses without deduplication on reruns;
      approved conflicting pull requests are skipped by dispatch on trunk merges;
      transient runner setup crashes drop changes_requested review events without retry;
      coder turn exhaustions demote to human while checks finish green unreviewed;
      and coder stands down silently on hard Challenge reviews without notifying the solo.
