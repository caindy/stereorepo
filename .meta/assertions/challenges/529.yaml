challenges:
  - id: work:challenge/529
    name: Split .meta/search.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/search.py` was 509 lines: the BM25 index and its tokens, the
      build over the assertions and the wiki, the benchmark, and the command
      line in one script. The seed's complexity ceiling and the pylint size
      rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into `.meta/lib/search/`
      under the convention solorepo's DR-217 sets for a script, then refactor
      one module at a time.
