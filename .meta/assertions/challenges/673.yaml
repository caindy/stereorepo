challenges:
  - id: work:challenge/673
    name: Excise Gemini CLI integration and fallback toggle from coder and reviewer workflows
    challenge_type: TASK
    description: >-
      Autonomous loop fallback to Gemini CLI introduced secondary execution paths in review.yml
      and coder.yml, an opt-in toggle (vars.GEMINI_FALLBACK), and fallback detection logic. Because
      Gemini CLI requires a metered Google Cloud API key that is prone to rate-limiting and utility
      billing, maintaining an opt-in integration is not viable. Excising Gemini CLI execution steps,
      fallback detection logic, and toggles simplifies workflows to run exclusively on subscription-backed
      Claude Code.
