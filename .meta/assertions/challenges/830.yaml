challenges:
  - id: work:challenge/830
    name: review.yml's tool grant and the .meta/ composite actions still bypass the operator boundary
    challenge_type: ARCHITECTURE
    description: >-
      Solorepo's DR-252 partitioned repository operations across three planes and
      settled that an agent harness invoking an internal script under `.meta/`
      directly is the mischief it corrects. Solorepo's #827 aligned
      `.github/workflows/coder.yml`'s prompts and solorepo's #834 the reviewer's,
      but two classes of invocation survived. `.github/workflows/review.yml`'s
      `--allowedTools` still granted `Bash(python3 .meta/check_pr.py:*)` beside
      `Bash(just pr:*)`, so the prompt taught `just pr` while the grant kept the
      bypass reachable. And the `run:` steps of `.meta/actions/sweep/action.yml`
      (`python3 .meta/check_pr.py --all --publish`, `python3 .meta/next.py
      --check`) and `.meta/actions/pull-request/action.yml` (`python3
      .meta/check_pr.py "$PR"`) called the scripts directly. The second class
      raised a question solorepo's DR-252's adopted text did not answer: whether
      a boundary framed around what a session should type reaches a composite
      action's own `run:` step, which no agent chooses at invocation. Settled as
      solorepo's DR-275.
