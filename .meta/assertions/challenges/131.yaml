challenges:
  - id: work:challenge/131
    name: The reviewer Job ended its turn with four subagents in flight, posted nothing, and the check reported success
    challenge_type: DEFECT
    description: >-
      A reviewer run spawned its review agents in the background, ended its
      turn to wait for them, and the action took the ended turn as the end of
      the run: no verdict, no thread, the request standing, and a green check
      that nothing distinguishes from a review that answered. Seen on #130,
      then #138 and #140. A run that ends with the request still pending has
      not reviewed and must say so, and a subagent in flight is not a review.
