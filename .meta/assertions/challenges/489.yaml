challenges:
  - id: work:challenge/489
    name: Split .meta/check_pr.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/check_pr.py` was 1709 lines: body-form checking, GitHub queries,
      thread accounting, branch state, the watch loop, the gate and the loop
      sweep in one module, the largest Python file in the repository. The
      seed's complexity ceiling and the pylint size rules are to be applied
      to `.meta/`, whose ruleset under solorepo's DR-177 selects neither, and
      applied to a module this shape every finding lands in one file and the refactor cannot be
      reviewed piecewise. Splitting first, as moves, makes the later refactor
      one reviewable change per package.
