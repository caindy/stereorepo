challenges:
  - id: work:challenge/538
    name: Apply the seed's complexity ceiling and pylint size rules to .meta/
    challenge_type: REFACTOR
    description: >-
      Solorepo's DR-177 gave `.meta/` a narrower ruleset than the seed it
      hands a product: no complexity ceiling and no size rules. Measured on
      the tree after every script over five hundred lines was split into a
      package, the seed's `C90` at `max-complexity = 12` and pylint's
      `PLR0912`, `PLR0913` and `PLR0915` at twelve branches, five arguments
      and fifty statements report 74 findings across 35 functions, the largest
      a probe of 228 statements. Select the rules in `.meta/ruff.toml` with
      `ignore = []` kept empty and no per-file ignore, and refactor every
      finding until ruff is clean with no suppression added.
