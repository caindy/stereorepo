challenges:
  - id: work:challenge/275
    name: Enforce pull request form at the door in move, and route failing check runs through reviewer change requests
    challenge_type: DEFECT
    description: >-
      Pull requests routinely fail CI on PR body validation (e.g. #270 and #271 failing
      because What it closes was authored as prose instead of bulleted keywords) because
      .meta/say/move open and revise perform zero client-side validation before pushing bodies
      to GitHub. Furthermore, when check runs fail on a pull request head, coder.yml has no
      trigger to wake up unless the reviewer requests changes, but review.yml does not require
      the reviewer to verify check run completion before approval, leaving PRs in a stalled
      state (approved but failing checks, unmergable by merge-manager, and ignored by the
      sleeping coder).
