challenges:
  - id: work:challenge/160
    name: The files a portfolio inherits cite Issues bare, and nothing said whether a check was ever to resolve one
    challenge_type: DEFECT
    description: >-
      DR-121 had every file a portfolio copies cite solorepo's record as
      solorepo's and DR-124 held the copied Python to it. An Issue number is
      the same citation one sequence over and neither touched it: a hundred and
      twenty-three bare ones sat across twelve files of the copy list —
      ninety-six in the two gates, the channel's programs and the hooks,
      twenty-four in the three workflows, three in `.meta/.apm/README.md` and
      `stakeholders/README.md`. Each reads in a portfolio as that portfolio's Issue on
      the day its own sequence reaches the number, which is #114's failure with
      the numbers changed. Raised by the reviewer on #150, parked, and promoted
      at merge.
