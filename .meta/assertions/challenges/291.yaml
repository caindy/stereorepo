challenges:
  - id: work:challenge/291
    name: "dereference reads what a branch wrote, so a citation wrong since the day it was typed waits for somebody to move the file"
    challenge_type: DEFECT
    description: >-
      dereference scopes to the sentences a branch wrote over its merge base,
      and --all is the only other door: uncapped, about fifteen hundred
      questions, and nobody's habit. So a citation is read once, on the branch
      that wrote it, and never again. A sentence that was wrong on the day it
      was typed stays wrong until somebody edits the file it lives in for an
      unrelated reason. Furthermore, when an entry is superseded or amended, the
      ground moves under all prose citing it without triggering a re-reading.
