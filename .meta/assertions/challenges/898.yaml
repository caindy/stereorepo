challenges:
  - id: work:challenge/898
    name: "The term corpus admits markdown whole, so shell invocations dominate the phrase report"
    challenge_type: DEFECT
    description: >-
      Solorepo's DR-271 extended the unminted-term audit from words to phrases.
      Read over solorepo's #884, the report that extension produces was dominated
      by tooling rather than prose.
      `.meta/terms.py` loaded a markdown file whole, fences included, and a shell
      invocation is a run of tokens on one line, which is exactly the shape phrase
      segmentation admits.

      The cost landed on the first reading: eight of the top ten multiword
      candidates over solorepo's #884 were command lines — `uv run`, `uv run
      gate`, `gh pr`, `ruff check`, `gate meta`, `git commit` among them — so a
      reader had to read past eight lines of tooling to reach two of prose. The
      unigram report carried the same noise below its real candidates rather than
      above them, which is why it went unremarked until the phrase report inverted
      the ratio.
