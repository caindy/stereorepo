challenges:
  - id: work:challenge/254
    name: A merge manager agent lands what is green in order of leverage, instead of arming whatever goes green first
    challenge_type: FEATURE
    description: >-
      Today pull requests merge in the order their checks turn green, which is
      first-come rather than order of leverage. A 3,000-line change to the most-edited
      file drifts into conflict while smaller work lands ahead of it, and GitHub
      refuses auto-merge on stacked pull requests entirely. A standing merge manager
      lands eligible green pull requests in order of leverage (unblocking other work,
      stack base before layers, and drift risk), asserts its choices and deferrals out
      loud to maintain affirmative liveness, and supersedes individual auto-merge arming.
