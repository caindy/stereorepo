challenges:
  - id: work:challenge/191
    name: "The prose under .meta/ is addressed to a reviewer, not a reader"
    challenge_type: GAP
    description: >-
      The prose under `.meta/` is addressed to a reviewer who might object, not
      to a reader who wants to use the thing. Docstrings litigate: they
      anticipate the challenge, cite the entry that settles it, and name the run
      where the alternative failed, rather than simply stating what to do and
      why.
