challenges:
  - id: work:challenge/245
    name: advance reads a rebase back before GitHub has performed it, and fails the run on the stale answer
    challenge_type: DEFECT
    description: >-
      `gh pr update-branch --rebase` returns when GitHub has taken the rebase,
      not when it has performed it, and `advance` asked its two read-back
      questions immediately afterwards. Both are questions about a pull request
      GitHub has finished moving, and asked of one it has not they answer about
      the head the branch is being moved off: how far behind that head was, and
      the arming that head still carries. Measured on runs 34593386083 and
      34594139086, where the heads were rewritten one to two seconds after the
      call and a `pr view` half a second later still named the commit they had
      before. Every `advance` on 2026-09-11 concluded failure — eight of eight
      — while rebasing correctly each time, so the workflow that exists to keep
      armed branches current could not report the case it was built for, #93, a
      pull request left rebased and unarmed; and the arming read, taken off the
      same stale view, would walk past that repair rather than make it.
