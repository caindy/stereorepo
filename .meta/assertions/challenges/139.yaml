challenges:
  - id: work:challenge/139
    name: The sole-author refusal refuses the coder's own notice, so a promoted notice waits on the solo for a resolve PR First's eighth step gave the coder
    challenge_type: DEFECT
    description: >-
      A notice is the coder's own observation on the coder's own diff, so the
      coder is always its sole author, and `.meta/say/post answer` refuses a
      thread this Actor wrote every word of. PR First's eighth step gives
      promotion to the coder — what survives the argument earns an Issue and
      the thread is resolved with a link to it — so the verb refused exactly
      the act the step assigns, and every promoted notice waited on the solo
      for a resolve that is clerical. Found on #130, where both notices were
      promoted, to #132 and #134, and both threads sat unresolved holding an
      armed merge.
