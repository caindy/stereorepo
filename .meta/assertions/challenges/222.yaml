challenges:
  - id: work:challenge/222
    name: check.py holds four subjects and a test suite in one file
    challenge_type: TASK
    description: >-
      `check.py` declares itself the gate over assertions and then spends about
      830 of its lines on probes that load `.meta/hooks/` and `.meta/say/` and
      run them — which is why `import argparse` stands at the top of the gate
      for one line inside one probe. Beneath the probes are three further
      subjects sharing nothing but a file: invariants over the assertion graph,
      invariants over the tree, and a citation grammar for prose carrying about
      80 lines of commentary on leftmost-match and laziness, sitting between two
      unrelated steps. DR-124 makes the docstrings the prose a reader reaches
      first, and that works only while a reader can find the one they came for.
