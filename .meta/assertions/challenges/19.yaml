challenges:
  - id: work:challenge/19
    name: Semantic CURIEs instead of ordinal numbering, and what A12 would be left doing
    challenge_type: SPIKE
    description: >-
      A citation of a Decision or an Article is opaque — DR-085 names nothing
      until it is dereferenced — and A12 exists to mitigate that, which is a
      rule the identifier scheme made necessary. Whether an identifier can be
      semantic and stable, what the gate's numbering conventions would become,
      and whether A12 could then be retired.
