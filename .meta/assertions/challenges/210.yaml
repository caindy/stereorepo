challenges:
  - id: work:challenge/210
    name: A session claiming an easy or medium Issue is racing the loop, and move claim does not say so
    challenge_type: DEFECT
    description: >-
      `.meta/say/move claim` assigns an Issue to the coder's account whatever
      its difficulty. An Issue labelled `easy` or `medium` is the loop's from
      the moment the label lands (DR-112), so a session that claims one is
      standing beside a run that was started for it, which is the collision
      #115 recorded on #110: six threads answered twice within minutes, and a
      push from one Job dismissing an approval of the other. Nothing at the
      claim says so, and `just next` lists the ripe Issues without saying whose
      they are, so a session that claims by habit has a Job's worth of work
      done before the next verdict shows two coders on one branch. Raised as a
      conversation on #192, whose change makes the level the fact both of the
      coder loop's doors read.
