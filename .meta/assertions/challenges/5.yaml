challenges:
  - id: work:challenge/5
    name: A16 is unchecked between the last push and the merge
    challenge_type: DEFECT
    description: >-
      Resolving a review thread fires no Actions event, so the A16 check runs
      on the last push and nothing runs between then and the merge. A thread
      resolved without an answer after the last push satisfies the ruleset,
      which asks only for resolution, and the gate on the gate has a gap
      exactly where the shortcut is.
