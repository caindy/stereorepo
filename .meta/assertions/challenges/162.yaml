challenges:
  - id: work:challenge/162
    name: A merge on main leaves a pull request waiting on review conflicting, and nothing acts on the request nobody can answer
    challenge_type: DEFECT
    description: >-
      A review request that was valid when it was made stops being answerable
      the next time `main` merges. GitHub builds no merge ref for a branch it
      reports as `CONFLICTING`, `review.yml` runs on `pull_request`, so no run
      is created and the request stands with nothing behind it. On 2026-09-10
      #159 and #161 each requested review while mergeable; #150 rewrote
      `check.py`, #156 changed the imported assertions, and both went
      conflicting with the request outstanding and not one review run between
      them. #129 closed the halves that act at hand-off and on the clock —
      the hand-back reads `mergeable` before it hands over, and the sweep
      names a pull request nobody can take up — and nothing acts when `main`
      moves after the hand-off. `advance` runs on that push and looks only at
      what is armed, and a pull request awaiting its first review cannot be
      armed.
