challenges:
  - id: work:challenge/233
    name: The coder's hand-back dies on the rollup, so the handoff dies with it
    challenge_type: DEFECT
    description: >-
      The *hand back what the run did not finish* step in
      `.github/workflows/coder.yml` asked `gh pr list` for `statusCheckRollup`
      under `github.token` and a `permissions:` block holding neither `actions`
      nor `checks` — strictly narrower than the gate's token, which had already
      died on the same call with `checks: write` in hand (#229). By solorepo's
      DR-153's own diagnosis the call could not succeed, and the step runs on
      `bash -e`, so the failed assignment took the whole step: no account
      posted, no `move request-review`, no `move stop`. The Challenge was then
      left at `easy` or `medium` with nobody holding its pull request, which is
      the silence #229 is about, on the one path built to break it. Its failure
      mode was precisely the one it was written to prevent, and it left no trace
      saying so.
