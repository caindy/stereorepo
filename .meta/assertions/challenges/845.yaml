challenges:
  - id: work:challenge/845
    name: "A run cut by its turn cap is reviewed as one that stopped"
    challenge_type: DEFECT
    description: >-
      A coder take pass that exhausts its turn cap ends with
      `claude-code-action` reporting the step as `success`, because the process
      exits in an orderly way when the model's turn ends at the cap. The coder's
      door reads the step conclusion alone, so its hand-back branch is one a
      capped pass never enters: the run ends saying nothing was owed, and the
      green pull request it left waits for the half-hourly sweep of
      solorepo's DR-129 to name it and for the operator to request review by
      hand. Run 35779933358 on solorepo's #826 is the observed case. The
      reviewer, when it does arrive, is not told it is reading a branch a cap
      cut, so it litigates what is there rather than saying what is not.
