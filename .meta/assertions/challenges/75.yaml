challenges:
  - id: work:challenge/75
    name: A portfolio inherits the scaffold's gate workflow, whose seed jobs it cannot run
    challenge_type: DEFECT
    description: >-
      Specialization copied `.github/workflows/` whole, and two of the gate
      workflow's jobs run `bootstraps/rust/render` and `bootstraps/python/render`
      — paths that stay with the scaffold. A portfolio's first CI run is red on
      two jobs it cannot satisfy, and its `files` job runs `check.py` alone
      rather than the gates of the Projects it actually has. The workflow was
      the scaffold's, hand-listing the scaffold's three gates, and nothing
      derived a portfolio's from its assertions. Found in #71, whose
      `scaffold-only paths` check read `.md` and `.yaml` and so never looked at
      a `.yml` workflow.
