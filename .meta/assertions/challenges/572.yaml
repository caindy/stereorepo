challenges:
  - id: work:challenge/572
    name: Anchor a review thread to the head the run read, or refuse to raise it
    challenge_type: DEFECT
    description: >-
      `.meta/say/post raise` reads the pull request's head from GitHub at post
      time and anchors the thread to it, so a run that reads one commit and posts
      across a push files its finding on a line of a commit it never read. The line
      numbers belong to a diff the run did not see, and a review thread reads as a
      point about the code under it.
