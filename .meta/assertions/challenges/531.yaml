challenges:
  - id: work:challenge/531
    name: Split .meta/checks/probes/git.py into a package in place
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/probes/git.py` was 618 lines, grown past the mark since
      the split began: the two hooks' verdict tables, the events each is fed,
      the offers a refusal makes, and the one step that runs them all, in one
      module. The seed's complexity ceiling and the pylint size rules are to
      be applied to `.meta/`, whose ruleset under solorepo's DR-177 selects
      neither. Split first as moves into a package in place under the
      convention solorepo's DR-218 sets for an imported module, one module per
      table, then refactor one module at a time.
