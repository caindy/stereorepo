challenges:
  - id: work:challenge/193
    name: Two branches recording decisions conflict in the generated index, though their entries do not
    challenge_type: DEFECT
    description: >-
      `.meta/decisions.md` is rendered from one file per entry and committed.
      Two branches that each record a decision both append a row after the last
      one in the entry table, and both extend rows in the `enacted_in`
      back-pointer table, so git has two additions at one insertion point and
      refuses them. It was live between `main` and `claude/issue-169` on #192:
      `git merge-tree --write-tree` reported exactly one conflicted path,
      `.meta/decisions.md`, while `DR-141.yaml` and `DR-142.yaml` did not
      conflict at all, being separate files. DR-128 is not implicated — minting
      reserved two distinct numbers and each branch took the one it was given.
      The collision is downstream of the record, in the page rendered from it,
      and it lands on every pair of concurrent pull requests that each record a
      decision, which is the ordinary case here rather than the unlucky one.
