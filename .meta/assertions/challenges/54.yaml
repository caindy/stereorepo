challenges:
  - id: work:challenge/54
    name: Every gate prints one report shape by imitation, not by rule
    challenge_type: DEFECT
    description: >-
      `check.py` and the Rust xtask print the same three lines per step because
      one copied the other, and its documentation said so. A6 names the three
      outcomes and A7 the scope a mark claims; neither says what a gate prints,
      so a third language's gate could satisfy both and be unreadable beside
      the first two.
