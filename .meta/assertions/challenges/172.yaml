challenges:
  - id: work:challenge/172
    name: "A claim written once is read twice where one file is generated from another"
    challenge_type: DEFECT
    description: >-
      `.meta/dereference.py` reads the durable set, and that set holds both a generated file
      and the file it is generated from. The same claim is therefore asked twice, and billed twice:
      A12's sentence as a scalar in `.meta/assertions/imported/charter.yaml` and again as a
      paragraph in `.meta/charter.md`; the `# the pull request gate: A15, A16, A18, A19` comment in
      `justfile` and again as the `READING` list literal in `.meta/render.py`.

      Worse than the cost, the two readings can disagree, because the rendered copy arrives in a
      different shape. On solorepo's #168 the `justfile` comment read cleanly where it is a comment
      and came back `x` where it is a Python literal, the model having been handed source rather than prose.
      This is a false positive of the kind DR-134's falsifier names — a coder acting on it would rewrite
      true prose to satisfy the scope.
