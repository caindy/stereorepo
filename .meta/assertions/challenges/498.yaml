challenges:
  - id: work:challenge/498
    name: Split .meta/render.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/render.py` was 1175 lines and forty functions: the assertion
      loaders, every page renderer, the justfile and skill writers, the
      render's own `--check` and the command line in one script, two of its
      functions over the seed's complexity ceiling. The ceiling and the pylint
      size rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into `.meta/lib/render/`
      under the convention solorepo's DR-217 sets for a script, then refactor
      one module at a time.
