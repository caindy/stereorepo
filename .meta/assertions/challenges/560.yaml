challenges:
  - id: work:challenge/560
    name: A sole-authored notice is resolved by the same call that promotes it, so the merge goes through with no second party on the thread
    challenge_type: DEFECT
    description: >-
      `refuse_if_sole_author` would refuse `post promote` on a thread carrying
      only the caller's Trailer, and stands aside for a promotion by design
      (DR-127), so the coder can promote its own notice. That exemption also
      reaches the `resolve` at the end of `promote`, so one Actor can raise a
      notice, promote it, resolve it and clear the merge block it created, with
      no second party anywhere in the sequence. On #541, "Annotate `.meta/`
      tooling and drain 24 files from the type baseline", the coder posted a
      notice about 22 type-soundness suppressions, promoted it to #557 — the
      Issue for those suppressions — resolved the thread and merged, converting
      "somebody must look at this" into "there is a backlog item" without
      anybody looking.
