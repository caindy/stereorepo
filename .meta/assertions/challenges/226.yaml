challenges:
  - id: work:challenge/226
    name: "render.py authors prose woven through generated content, in the decision form and in skill()"
    challenge_type: FEATURE
    parent_challenge: work:challenge/11
    description: >-
      solorepo's DR-144 gave framing prose a home on the Artifact a page is
      written to, and reached only what sits before or after generated content.
      Two blocks of prose woven *through* it stayed in `render.py`:
      `decision_form()`'s placeholders, interleaved with guidance read from the
      model's own slot descriptions, and the fixed paragraphs `skill()` writes
      between a Discipline's steps, its judgement and its Articles. Nothing
      consumes either and nothing checks either, which is A8's question answered
      badly by the tool built to answer it well, and editing what the decision
      form asks for means editing the generator.
