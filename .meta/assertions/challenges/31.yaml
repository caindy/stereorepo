challenges:
  - id: work:challenge/31
    name: Issues carry a difficulty label, and loops pick them up by it
    challenge_type: FEATURE
    description: >-
      Issues carry a difficulty label beside `challenge`: `easy`, `medium`,
      `hard` or `human`, assigned by whoever raises one. A loop per level
      watches for Issues at its level and works each until it is a pull
      request that can be merged; `human` marks what needs the solo and is
      where a loop hands an Issue when it cannot. The solo does not want to
      approve and merge everything: for an easy target the pull request is a
      gating and auditing device and green is the review.
