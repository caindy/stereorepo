challenges:
  - id: work:challenge/261
    name: A pull request overtaken by another answer to the same Challenge has no exit
    challenge_type: DEFECT
    description: >-
      PR First's *Merged, never abandoned* step is *merged, never abandoned*, and the channel holds it by
      construction: `.meta/say/verbs.yaml` has no `close` verb, so `merge` is the only
      way a pull request ends. A change another answer overtook cannot take that exit —
      the tree already holds a different answer to the same Challenge, so the diff would
      install a second mechanism over a working one — and no verb offers any other, so
      the act is taken on GitHub directly and unsigned, which is what DR-069 and the
      signing hook exist to prevent. #206 is the instance: it answered #202, and two
      other changes landed prose mechanisms answering the same question first — DR-144
      (#199), taken for #202 itself, and DR-152 (#227), taken for #226 and landing over
      the same ground. #206 then sat conflicting and unmergeable with a correct review
      finding against a mechanism that was not landing. It also minted a Decision number no entry will ever redeem, which leaves
      the question of whether a number a change never used is released or left as a hole
      — and the number cannot be written here, because a citation the record cannot
      resolve is what the gate refuses and what WITHDRAWN exists to prevent.
