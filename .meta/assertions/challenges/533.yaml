challenges:
  - id: work:challenge/533
    name: Split .meta/checks/probes/channel.py into a package in place, one module per probe
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/probes/channel.py` was 599 lines, grown past the mark
      since the split began: the probes over the channel's parser, its status
      and table readers, the claim, actor, signing-key, reservation and layer
      verbs, in one module. The seed's complexity ceiling and the pylint size
      rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into a package in place
      under the convention solorepo's DR-218 sets for an imported module, one
      module per probe, then refactor one at a time.
