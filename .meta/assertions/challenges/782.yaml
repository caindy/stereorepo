challenges:
  - id: work:challenge/782
    name: gate.yml's edited-event skip overwrites passing file and seed check runs
    challenge_type: DEFECT
    description: >-
      A `move revise` fires GitHub's `edited` pull request event, which the `files`,
      `rust seed` and `python seed` jobs declined by an `if:` guard. A declined job
      still writes a check run, and GitHub reports only the latest run per job name,
      so the `skipping` conclusion hid the `success` an earlier `synchronize` had
      recorded for the same head. A reviewer reading the check screen after any
      revise could not tell whether the gate had run on the tree in front of it.
