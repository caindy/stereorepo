challenges:
  - id: work:challenge/635
    name: advance is red on most pushes for other pull requests' weather, so its colour says nothing
    challenge_type: DEFECT
    description: >-
      `advance` exits 1 when any pull request in its sweep reports a failure,
      and the failures it collects are mostly other pull requests' weather: a
      `gh` call that hit `net/http: TLS handshake timeout`, or a branch GitHub
      refuses to rebase because it conflicts with its base. On 2026-09-18 the
      workflow was red on eleven consecutive pushes to `main`, from 16:52Z to
      18:58Z, naming solorepo's #580 and solorepo's #565 each time, and on nine
      of the fourteen pushes before that. The dispatch still runs — the
      failures accumulate into a list and the exit is at the end — so a red
      `advance` stalls nothing by itself, which is what makes it worth fixing
      rather than urgent: the run is red so routinely that its colour carries
      no information, and a run that failed for a reason worth reading looks
      exactly like the ten before it. The cost landed on solorepo's #568, whose
      stall was signalled by nothing but a red `advance` that was red anyway.
