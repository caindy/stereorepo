challenges:
  - id: work:challenge/513
    name: Split .meta/checks/citations.py into a package in place
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/citations.py` was 529 lines: every check over what prose
      cites, from Decisions and Articles to quoted claims, stated relations,
      path-and-line claims and the citations inherited material carries,
      registered from one module. The seed's complexity ceiling and the pylint
      size rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into a package in place
      under the convention solorepo's DR-218 sets for an imported module, its
      initialiser re-exporting every name, then refactor one module at a time.
