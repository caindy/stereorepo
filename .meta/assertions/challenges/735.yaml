challenges:
  - id: work:challenge/735
    name: a gate step that could not run exits zero under CI, so a required check reports green on a step that never ran
    challenge_type: DEFECT
    description: >-
      Article A6 fixed the exit code of an unrunnable gate step at zero, and
      `.meta/check.py`'s `report()` implements it: a step returning `CouldNotRun`
      prints `?` and does not set `failed`. That is right where a person runs the
      gate and a missing tool is a fact about the environment. Under CI it is
      wrong, because the workflow installs its own toolchain and so an unrunnable
      step means the provisioning broke or the tree did.

      The instance is live rather than hypothetical. `apm package` in
      `.meta/checks/files/rendered.py` returns `CouldNotRun` when `apm` is absent
      from `PATH`, and the `files` job of `.github/workflows/gate.yml` installs
      `linkml`, `pyyaml`, `ruff`, `mypy` and `types-pyyaml` and no `apm`. Nothing
      outside the release job installs it. So a required status check on `main`
      has reported green on a step that has never executed.

      `.meta/check.py` also holds two answers to the same question: `skipped`
      schema containers fail the run while a typed `CouldNotRun` passes it.
