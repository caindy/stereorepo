challenges:
  - id: work:challenge/213
    name: An armed pull request that conflicts with main is refused on every push and nothing dispatches a rebase for it
    challenge_type: DEFECT
    description: >-
      `.meta/say/move advance` does two things to an open pull request on a
      push to `main`, and an armed one whose branch conflicts gets neither.
      The rebase is refused — GitHub will not update a branch it reports as
      `CONFLICTING` — and `advance` collects the refusal and exits non-zero;
      the dispatch of `coder.yml`'s rebase pass (DR-133) filters on a review
      request outstanding, which an armed pull request has already had
      answered. On 2026-09-11 #201, approved and armed, conflicted when #194
      merged at 01:24; `advance` runs 43 and 44 each ended `#201: gh: X Cannot
      update PR branch due to conflicts`, and every later push to `main` would
      have ended the same way until a person rebased the branch or closed the
      pull request. Nothing names the state either: the sweep of DR-129 names
      a request nobody can answer, which this pull request no longer has, and
      a green one nobody holds, which it is not — its second reader skips
      anything armed by name. The trigger is any two pull requests changing
      one file, the second to merge conflicting the first, which on an evening
      with several open is the ordinary case. The cost is a pull request the
      reviewer has already approved sitting until the solo happens to look at
      it, and `advance.yml` red on every merge meanwhile, which hides the next
      refusal that matters and is the only sign there is.
