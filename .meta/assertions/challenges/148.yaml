challenges:
  - id: work:challenge/148
    name: The citation failures a string search cannot reach are readings, and a reviewer round is what they cost
    challenge_type: FEATURE
    description: >-
      Of the six citation failures on #138, #140 and #142, DR-130's four shapes
      catch two. The others are paraphrases — a sentence attributed to an entry
      that does not support it, a count of eighteen that was fifteen, a
      derivation stated of two numbers that held for one — and each was found by
      a reviewer opening the target and reading it, at an Opus round per pull
      request. The reading is worth doing per citation and cheaply, before the
      hand-off; whether it may also stop a merge is a question about what a gate
      is, and DR-134 answers it.
