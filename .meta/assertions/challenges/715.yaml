challenges:
  - id: work:challenge/715
    name: Harden autonomous coder fallback against premature batch exit and parameter leak
    challenge_type: BUG
    description: >-
      Hardens autonomous coder fallback against premature batch exit and parameter leak.
      Drives headless Antigravity CLI sessions via streaming NDJSON to prevent 5-second
      idle exit timeouts when commands detach to background tasks, mechanically denies
      subagent delegation, steers fallback prompts against entrance gate checks on evergreen main,
      and aligns workflow hand-back condition and OUTCOME parameter evaluation in CI.
