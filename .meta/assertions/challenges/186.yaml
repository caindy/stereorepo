challenges:
  - id: work:challenge/186
    name: The scale set's ceiling was sized for two workflows, and a pull request's four gate jobs queue behind a session that holds a pod for an hour
    challenge_type: DEFECT
    description: >-
      `maxRunners: 2` was written when `arc-runner-set` served `coder.yml` and
      `review.yml` only, and its comment argued for itself in those terms: "a
      third queued job means the fleet is two". DR-140 then put every job of
      every workflow on the same scale set. A pull request's gate is four jobs
      that become eligible at the same instant — `files`, `rust seed`, `python
      seed` and `pull request`, three of them required status checks in `main`'s
      ruleset — `advance` is a fifth pod on every push to `main`, and a loop
      session holds a pod for up to 75 minutes while it waits on a model. Two
      slots is narrower than one gate run, so the four start twenty to thirty
      seconds apart, each waiting on the one before: gate runs of 2m36s to 7m33s
      wall for about 2m15s of work whose longest job is 85 to 107 seconds. On
      2026-09-10 the `advance` run for #182's merge sat queued past six minutes
      with both slots held by loops, which is the armed merge nobody is left to
      notice that `advance.yml` exists to prevent.
