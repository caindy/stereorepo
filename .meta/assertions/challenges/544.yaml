challenges:
  - id: work:challenge/544
    name: post promote files a second Issue when its reply or resolve fails, because file_issue is not idempotent
    challenge_type: DEFECT
    description: >-
      `post promote` is `file`, `reply`, `resolve`, in that order, and
      `move.file_issue` created unconditionally, so a promotion whose reply or
      resolve failed left the Issue filed and the retry filed a second one.
      Four pairs of open Challenges were one Challenge filed twice — the
      Challenges #434/#435, #440/#441, #443/#444 and #454/#455 — each pair
      identical but for its `**Waits on.**` paragraph and each carrying one
      `Actor:` trailer. A fifth pair, the now-closed Challenges #436 and #437,
      was doubled the same way and both halves were worked, so their pull
      requests #439 and #442 both merged and landed the same change on
      `meta types` twice.
