challenges:
  - id: work:challenge/491
    name: Split .meta/checks/probes/loops.py into a package in place, one module per probe
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/probes/loops.py` was 1320 lines and held the most
      functions the seed's complexity ceiling would flag in `.meta/`: seven
      over the limit of twelve, one per loop verb it probes. The ceiling and
      the pylint size rules are to be applied to `.meta/`, whose ruleset under
      solorepo's DR-177 selects neither, and the refactor that answers seven
      findings in one module cannot be reviewed piecewise. Split first as
      moves, one module per probe, then refactor one at a time. The answer
      settled on a package in place, `probes/loops/`, with no thin module in
      front of it (solorepo's DR-218).
