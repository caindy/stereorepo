challenges:
  - id: work:challenge/508
    name: Split .meta/checks/graph.py into a package in place
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/graph.py` was 541 lines: the checks over the assertion
      graph, from unresolved references and the record's holes to the
      Charter's citations and what an Artifact owes the record, registered
      from one module. The seed's complexity ceiling and the pylint size rules
      are to be applied to `.meta/`, whose ruleset under solorepo's DR-177
      selects neither. Split first as moves into a package in place under the
      convention solorepo's DR-218 sets for an imported module, then refactor
      one module at a time.
