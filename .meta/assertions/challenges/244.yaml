challenges:
  - id: work:challenge/244
    name: Pre-install toolchains and CLI utilities into a custom ARC runner image
    challenge_type: TASK
    description: >-
      Every ephemeral ARC runner pod starts from the bare upstream image
      `ghcr.io/actions/actions-runner:2.337.0`. Every job repeatedly installs
      build-essential, rustup, gh, jq, just, and uv, adding 45-120 seconds of
      startup latency per job and exposing CI to intermittent download flakes and
      mirror rate limits. Pre-baking these tools into a custom image eliminates
      ephemeral pod bootstrap latency and network variance.
