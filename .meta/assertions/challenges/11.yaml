challenges:
  - id: work:challenge/11
    name: "Dedupe the repository: one statement, one home"
    challenge_type: EPIC
    description: >-
      Changing one rule meant editing it in five places by hand, and nothing
      would have failed if one had been missed. The measure of done is not that
      copies are removed: it is that an edit to one statement cannot leave
      another behind — either the second copy derives, or the gate names it.
