challenges:
  - id: work:challenge/255
    name: A subagent pre-review reading pass has a prompt half and no falsifier
    challenge_type: DEFECT
    description: >-
      The coder's pre-review reading pass — one subagent on the smaller model,
      told to read the branch's diff before the review is requested — is
      prompt-only and silent by design, so no fact GitHub holds tells a run that
      spawned the reader from one that read the sentence and went straight to
      the hand-off. Whether the pass executed is checkable from the run's own
      model breakdown, where a subagent's tokens land under the model it ran on,
      and checking it there adds no comment, label or trailer.
