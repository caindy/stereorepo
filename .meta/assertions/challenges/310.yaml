challenges:
  - id: work:challenge/310
    name: Rectify sample mismatch and track workflow performance by model and difficulty in timing.py
    challenge_type: FEATURE
    description: >-
      In .meta/timing.py, total runtime was computed over all completed runs while
      wait and run were computed over the first 5 runs, skewing percentiles on bimodal
      workflows like review.yml. Aligning total with the opened runs restores the
      additive property across rows, while --by-model and --by-difficulty allow
      monitoring workflow performance across model tiers and challenge difficulties.
