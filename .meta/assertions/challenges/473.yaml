challenges:
  - id: work:challenge/473
    name: "Make GitHub's blocked-by relationship the only source of a blocker, and give the channel a verb to change it"
    challenge_type: DEFECT
    description: >-
      An Issue's blocker was carried by two records that could disagree, and
      only one of them was reachable through the channel. `move file` derived
      blockers by scanning the first line of the body, while `issue_blockers()`
      read GitHub's native relationship first and fell back to the same prose
      when it was empty, so the same body edit took effect on one Issue and not
      on another. No verb changed a blocker after filing, which left the only
      routes outside the channel.
