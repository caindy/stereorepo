challenges:
  - id: work:challenge/535
    name: Split .meta/hooks/signed_channel.py into a package behind a thin hook
    challenge_type: REFACTOR
    description: >-
      `.meta/hooks/signed_channel.py` was 581 lines: the tables the hook
      knows by name, the shell reading that takes a command line apart, the
      judgement of whether a segment reaches GitHub, and the entry that reads
      the event, in one file. The seed's complexity ceiling and the pylint
      size rules are to be applied to `.meta/`, whose ruleset under solorepo's
      DR-177 selects neither. Split first as moves into `.meta/lib/signed_channel/`
      behind the hook's path under the convention solorepo's DR-217 sets for
      a script, then refactor one function at a time. The package is the body
      of a control-plane hook, so it joins `depth.CONTROL_PLANE` and the
      review workflow's restore under solorepo's DR-219.
