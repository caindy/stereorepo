challenges:
  - id: work:challenge/478
    name: A session picks its branch name by deriving it from a workflow condition
    challenge_type: TASK
    description: >-
      `<harness>/issue-<n>` is the loop's branch shape, and nothing states what a
      session should call its branch instead. The answer is derivable from
      `.github/workflows/coder.yml`'s job condition and was derived there while
      opening #477, correctly and for partly the wrong reason: the verdict door
      admits any branch of the loop's shape, and it is the `is it taken already`
      step, not the door, that stands the loop down at `held`, `stale` or
      `unnamed`. A branch that takes the loop's shape by accident therefore wakes
      it, is declined, and collects a stand-down notice on a pull request its
      session then owns. Session branches had meanwhile settled on
      `<harness>/<slug>` by use rather than by agreement, which is what A17 names.
