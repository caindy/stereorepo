challenges:
  - id: work:challenge/303
    name: An initial review's subagent pass is unscoped, and DR-122 makes its fan-out wall clock
    challenge_type: DEFECT
    description: >-
      `review.yml` hands the code-review skill an effort and a target and says
      nothing about how wide the pass may go. The skill fans out one agent per
      dimension it decides to cover, and solorepo's DR-122 requires every one
      of them in the foreground. Step timing on the deep path —
      `python3 .meta/timing.py review.yml --steps` — puts an initial review at
      11 to 15 minutes in the action's step, which is the pass costing the sum
      of its agents rather than the longest of them, most of them reading the
      same diff for a dimension the change does not have. The reviewer is the
      first feedback a pull request gets, so this is the latency the coder loop
      waits on.
