challenges:
  - id: work:challenge/692
    name: Steer agent harnesses to the just operator surface over direct script execution
    challenge_type: REFACTOR
    description: >-
      Steer agent harnesses to invoke recipes on the repository operator surface (just)
      rather than reaching directly into internal scripts under .meta/. Codify the
      tripartite operational boundary across local verification and polling (just),
      attested GitHub mutations (.meta/say/), and read-only inspection queries (gh),
      and mandate that agent harnesses read the PR First skill before enacting changes.
