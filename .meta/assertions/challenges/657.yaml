challenges:
  - id: work:challenge/657
    name: An automated end-to-end Specialization dogfooding harness with pre-judged portfolio fixtures
    challenge_type: FEATURE
    description: >-
      Specialization (SPECIALIZE.md) is solorepo's foundational procedure for
      turning the scaffold into an independent product portfolio. While
      .meta/gate verifies static prerequisites (surviving placeholders,
      scaffold-only paths, template parses, gate workflows agree), the
      complete 8-step specialization discipline has only ever been executed
      manually during milestone dogfooding audits (DR-035, DR-036, DR-204). There
      is no automated harness to instantiate a clean temporary repository, apply a
      valid pre-judged domain model, compile APM primitives, run .meta/render.py,
      and assert that the target portfolio's gate passes cleanly under Article 21.

      This Challenge coordinates an automated, repeatable dogfooding harness to
      demonstrate and verify end-to-end Specialization on demand and in periodic CI,
      without burdening everyday PR gates with toolchain latency.
