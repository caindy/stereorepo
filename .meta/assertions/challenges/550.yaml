challenges:
  - id: work:challenge/550
    name: DR-221's cost claim is false, and one of its alternatives records a review finding as deliberation
    challenge_type: DEFECT
    description: >-
      Two defects in solorepo's DR-221, which is `ADOPTED` on the trunk. Its
      `context` says that the pull requests #439 and #442 "both merged and
      landed the same change on `meta types` twice", which is false: `#439`
      carried the mechanism, and `#442`'s whole landed diff to
      `.meta/checks/files.py` is docstring rewording with no logic, beside a
      new history entry. The doubled Challenge cost two coder runs, two reviews
      and two pull requests, which is what the Decision needed and all it
      needed. Its fourth alternative, keying `promote` on the gate's own
      `PROMOTED` pattern, reads as an option weighed and rejected when the
      decision was made; it was implemented, shipped and found by the reviewer,
      which is the reading Written Decisions' first step warns about: an option
      nobody weighed is not an option, and a record that manufactures one is
      arguing with itself to look thorough.
