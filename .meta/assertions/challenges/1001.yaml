challenges:
  - id: work:challenge/1001
    name: "A verb that corrects a comment, so a malformed Trailer can be withdrawn rather than standing red forever"
    challenge_type: DEFECT
    description: >-
      The form gate audits every comment a Role account posts on a pull request
      and reds a Trailer that is doubled, missing or not last, and no verb of
      the channel could reach one to fix it. Give the channel a verb that
      corrects or withdraws a comment the speaking account posted, and refuse
      the body that produced the malformed comment in the first place.
