challenges:
  - id: work:challenge/116
    name: The signing channel has grown the surface of gh; the operations the Disciplines name are what it should offer
    challenge_type: DEFECT
    description: >-
      `.meta/say` reached twenty-one verbs and nine hundred lines, and most
      verbs were `gh`'s nouns — `pr-body`, `issue-body`, `label`,
      `issue-comment` — rather than the operations the Disciplines name. A
      caller composed the operations by hand and could compose them wrongly:
      #113 was filed with its difficulty before `challenge`, so the coder
      loop's event found no Challenge and a medium Issue sat untaken. That is
      DR-069's sentence, what a caller can pass a caller can pass wrongly,
      reappearing one level up, with the operation in place of the identity.
