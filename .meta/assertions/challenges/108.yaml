challenges:
  - id: work:challenge/108
    name: What to work on next is read from eleven Issue bodies, because nothing lists what waits on what, what is queued, or what the milestone is
    challenge_type: FEATURE
    description: >-
      Asking what to work on next cost a session 72k tokens and three minutes
      on 2026-09-08, because the four facts the answer needs live nowhere a
      listing can reach: what each Issue waits on is a prose paragraph, the
      loops' state is spread over four run lists, the milestone is inferred
      from which bodies cite it, and no open Issue carries a difficulty. The
      question recurs per session, so its cost is paid per session.
