challenges:
  - id: work:challenge/510
    name: Split .meta/checks/probes/tools.py into a package in place, one module per probe
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/probes/tools.py` was 538 lines: the probes over the
      repository's own tools, from timing and depth to agents, dereference,
      search, the APM compiler and the comment detectors, registered from one
      module. The seed's complexity ceiling and the pylint size rules are to
      be applied to `.meta/`, whose ruleset under solorepo's DR-177 selects
      neither. Split first as moves into a package in place under the
      convention solorepo's DR-218 sets for an imported module, one module per
      probe, then refactor one at a time.
