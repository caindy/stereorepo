challenges:
  - id: work:challenge/264
    name: coder.yml crashes on startup attempting to install just when pre-installed in runner image
    challenge_type: DEFECT
    description: >-
      Every run of `coder.yml` on `arc-runner-set` fails at step 6 (`install just`)
      in 9 seconds because the custom ARC runner image deployed under DR-156
      already bakes `just` into `/usr/local/bin/just`, and the step unconditionally
      curled `install.sh` which refuses to overwrite an existing installation.
      Because the container image is the single source of truth for runtime
      dependencies, workflow files should not dynamically provision OS tools.
