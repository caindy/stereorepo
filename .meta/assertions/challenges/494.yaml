challenges:
  - id: work:challenge/494
    name: Split .meta/checks/files.py into a package behind a thin check module
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/files.py` was 1295 lines and forty functions: the source
      filter, the template, markdown and wiki checks, the workflow agreements,
      the render's prose, the history logs, the Python linters and the render
      itself, all registered from one module, four of its functions over the
      seed's complexity ceiling. The ceiling and the pylint size rules are to
      be applied to `.meta/`, whose ruleset under solorepo's DR-177 selects
      neither. Split first as moves, one module per family of steps under the
      convention solorepo's DR-218 sets for an imported module, then refactor
      one module at a time.
