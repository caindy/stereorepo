challenges:
  - id: work:challenge/783
    name: "Restructure the autonomous loops around one state model, one settling channel layer, and a scheduled reconciler"
    challenge_type: EPIC
    description: >-
      The state machine that runs the coder, reviewer, triage, advance, and merge
      loops has no single home. `.meta/say/move` holds forty verbs beside the merge
      manager; the question "has GitHub shown what I asked for" is answered four
      ways; the same facts about a pull request are read by three readers; and the
      workflows are programs written in YAML. Every incident lands as one more patch
      to one of those places, and the merge queue freeze of 2026-09-21 produced four
      Challenges that way. DR-264 states the target structure and the order the
      seams move in; this Challenge is the stack of layered pull requests that
      enacts it.
