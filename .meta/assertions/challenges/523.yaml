challenges:
  - id: work:challenge/523
    name: Split .meta/timing.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/timing.py` was 522 lines: the reading of the loops' timing off
      GitHub, the percentiles and their degrade, the critical path a change
      routes to, and the command line in one script. The seed's complexity
      ceiling and the pylint size rules are to be applied to `.meta/`, whose
      ruleset under solorepo's DR-177 selects neither. Split first as moves
      into `.meta/lib/timing/` under the convention solorepo's DR-217 sets for
      a script, then refactor one module at a time.
