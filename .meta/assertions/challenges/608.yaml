challenges:
  - id: work:challenge/608
    name: A run lands its own difficulty, so the reviewer never reads what a promotion filed
    challenge_type: DEFECT
    description: >-
      A coder run lands `hard` on the Challenges it promotes after a review, so
      the reviewer's reading door never fires and the work queues behind the
      solo: on 2026-09-18 the ripe list held thirty Challenges and every one was
      `hard`, none of them read. The behaviour is written down — solorepo's
      DR-159 says surviving notices are promoted with difficulty hard, against
      the autonomous follow-up run that solorepo's DR-230 has since put a reader
      in front of — and nothing refuses a level from a caller that holds no
      mandate. The door solorepo's DR-230 built has the same shape of gap: it
      runs the reader where a level is taken off a Challenge, and no verb of the
      channel can take one off.
