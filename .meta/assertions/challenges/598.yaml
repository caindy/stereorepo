challenges:
  - id: work:challenge/598
    name: The BM25 title index takes every list item in a wiki page's frontmatter, not its synonyms
    challenge_type: DEFECT
    description: >-
      The wiki half of `.meta/lib/search/build.py` scraped every `- ` item out
      of a page's frontmatter block with a regular expression and folded the lot
      into the title field, which is the highest weight the index carries. The
      variable was named `synonyms_text` and the key `synonyms` was never read;
      the name and the behaviour agreed only because `synonyms` is the one
      list-valued key any page declares today. The next key anybody added would
      have been indexed at title weight without being chosen, and the gate step
      that holds a page's `synonyms` disjoint from its concept's `avoid` list
      reads that key by name, so a forbidden word arriving under another key
      would have been indexed with the step blind to it.
