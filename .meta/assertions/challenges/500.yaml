challenges:
  - id: work:challenge/500
    name: Split .meta/apm_compile.py into a package behind a thin entry point
    challenge_type: REFACTOR
    description: >-
      `.meta/apm_compile.py` was 718 lines: the APM primitive compiler, the
      multi-harness reconciliation of skills and settings, the root symlink
      check and the command line in one script. The seed's complexity ceiling
      and the pylint size rules are to be applied to `.meta/`, whose ruleset
      under solorepo's DR-177 selects neither. Split first as moves into
      `.meta/lib/apm_compile/` under the convention solorepo's DR-217 sets for
      a script, then refactor one module at a time.
