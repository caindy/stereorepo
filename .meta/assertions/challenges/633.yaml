challenges:
  - id: work:challenge/633
    name: >-
      Nothing dispatches a pass for a conflicting branch with a standing request
      for changes, so the stall is indistinguishable from a coder run still going
    challenge_type: DEFECT
    description: >-
      A loop pull request carrying a request for changes the coder has not
      answered is waiting on the Role that holds it, so it asks nobody for
      anything: GitHub reports no review request, no arming and no approval.
      When a later merge to trunk conflicts the branch, the sweep's reading of
      what a conflict is holding up finds nothing to report, and the one branch
      that does read an unanswered verdict dispatches the review pass and steps
      over a conflicting branch, because that pass runs on a merge ref GitHub
      does not build. Every subsequent push to `main` reads the pull request and
      dispatches no pass at all, and the stall is indistinguishable from a coder
      run still going.
