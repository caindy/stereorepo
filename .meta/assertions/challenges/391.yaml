challenges:
  - id: work:challenge/391
    name: "Elevate Diátaxis Compass to Knowledge Management discipline for prose routing and container subordination"
    challenge_type: FEATURE
    description: >-
      Formalize the Diátaxis Compass within the Knowledge Management discipline,
      establishing an explicit pre-writing decision tree that routes maintainer
      knowledge to its authoritative container (Reference in docstrings,
      Explanation in wiki/DRs, How-To in recipes, Tutorial in walkthroughs),
      subordinating container placement to reader posture, and enforcing the
      Residue Principle (Article 15).
