challenges:
  - id: work:challenge/195
    name: A review requested on a conflicting branch is answered by nobody, and request-review does not say so
    challenge_type: DEFECT
    description: >-
      `.meta/say/move request-review` requests review of a pull request
      whatever its `mergeable` state. `review.yml` runs on `pull_request`, and
      GitHub builds no merge ref for a branch it reports as `CONFLICTING`, so a
      request made on one creates no run and is answered by nobody. `coder.yml`'s
      hand-back step already reads `mergeable` and refuses to request review on
      `CONFLICTING` for exactly this reason (DR-129); the verb a session types
      does not read it, and nor does anything a session watches —
      `check_pr.py --watch` reports threads, reviews and checks, and a request
      that created no run produces none of those, so the silence reads as a
      review in progress. On #192 the branch was cut six minutes after #188
      merged, from a checkout that had not fetched; the pull request opened
      conflicting, review was requested three minutes later, and no reviewer run
      existed until a rebase was pushed twenty minutes on, after the solo
      noticed. DR-133's dispatch did not fire because the merge on `main`
      preceded the request rather than following it.
