challenges:
  - id: work:challenge/308
    name: "Test whether foreground review agents issued together return together, which would remove the fan-out ceiling"
    challenge_type: SPIKE
    description: >-
      DR-166 bounds how many agents a review spawns because the pass costs the sum
      of them, putting an initial review on the deep path at 11 to 15 minutes. Whether
      it has to cost the sum is untested: DR-122 forbade background turns that ended
      before agents returned, not batched foreground dispatch. Testing whether several
      foreground Agent tool calls issued in a single turn execute concurrently and
      return together determines whether a scoped pass can cost its longest agent
      rather than the sum of all agents, potentially removing the fan-out ceiling.
