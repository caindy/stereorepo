challenges:
  - id: work:challenge/590
    name: A reviewer interrogates every Challenge before a coder takes it
    challenge_type: FEATURE
    description: >-
      A Challenge is taken by a coder the moment its raiser labels it `easy`
      or `medium`, and a session claims one at `hard`, and in neither case has
      anyone but the raiser read it. The Challenge form asks the questions that
      would catch a bad one, above all "what would make this worth doing", but
      the raiser answers them alone and nothing checks the answers. The one
      general mitigation the solo has seen work against agents ignoring the
      prose guidance is a second reader with no stake in the work, and today
      that reading happens once, at the end of a pull request, when the
      approach is already built.
