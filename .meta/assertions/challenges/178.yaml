challenges:
  - id: work:challenge/178
    name: The checker's watch runs indefinitely without exiting on actionable events, leaving harnesses that resume on completion asleep
    challenge_type: DEFECT
    description: >-
      `check_pr.py <n> --watch` only exits when `state in ("MERGED", "CLOSED")`.
      When a review lands, or an unaddressed thread comment arrives, or a
      check fails, `watch()` prints the event to stdout and continues sleeping
      60 seconds indefinitely. DR-102 presumed that every harness can keep a
      process alive and be woken by a line it prints, but harnesses that execute
      background commands asynchronously (such as Antigravity) resume the agent
      only when the background command completes. Because `watch` never exits,
      the agent is never woken when a review lands, falsifying DR-102's assumption.
