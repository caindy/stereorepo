challenges:
  - id: work:challenge/503
    name: Restore the packages of control-plane scripts from trunk, not .meta/lib as a directory
    challenge_type: DEFECT
    description: >-
      `.github/workflows/review.yml` restored `.meta/lib` from trunk before
      the reviewer read anything, as solorepo's DR-217 had it. The restore is
      no-overlay, so a package a pull request adds under `.meta/lib/` for a
      script outside the control plane was deleted before the run's own
      `python3 .meta/apm_compile.py --reconcile` step, which failed with
      `ModuleNotFoundError: No module named 'lib.apm_compile'` on #501. Only
      the packages of control-plane scripts belong in the restore set.
