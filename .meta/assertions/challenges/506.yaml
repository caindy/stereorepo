challenges:
  - id: work:challenge/506
    name: Split .meta/checks/probes/harness.py into a package in place
    challenge_type: REFACTOR
    description: >-
      `.meta/checks/probes/harness.py` was 555 lines: the loaders that put the
      channel, the hooks and the scripts under a probe, the stand-in context
      managers, and the two fakes of GitHub in one module, two of its functions
      over the seed's complexity ceiling. The ceiling and the pylint size rules
      are to be applied to `.meta/`, whose ruleset under solorepo's DR-177
      selects neither. Split first as moves into a package in place under the
      convention solorepo's DR-218 sets for an imported module, its
      initialiser re-exporting every name because every probe imports symbols
      from it, then refactor one module at a time.
