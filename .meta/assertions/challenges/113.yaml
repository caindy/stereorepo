challenges:
  - id: work:challenge/113
    name: The two gate workflows share a half that nothing holds together
    challenge_type: DEFECT
    description: >-
      `.github/workflows/gate.yml` and `template/.github/workflows/gate.yml`
      share their triggers, their permissions and their `pull request` and
      `sweep` jobs as the same text twice, and the only thing keeping them
      the same was a comment at the top of the scaffold's copy saying to
      change both — a reminder rather than a control. DR-114 then added a
      step to the scaffold's sweep and a permission for it, and the seeded
      copy stayed a version behind with nobody told. Noticed on #110, parked
      on the diff and promoted at merge.
