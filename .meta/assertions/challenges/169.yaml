challenges:
  - id: work:challenge/169
    name: A coder run took a branch a session was holding, because the review door reads neither the claim nor the level
    challenge_type: DEFECT
    description: >-
      `coder.yml`'s `issues` door reads the Issue's state, its current
      difficulty, the open pull request on its branch and the claim before any
      work, and refuses `hard` by name. Its `pull_request_review` door reads
      that the verdict is a request for changes from the reviewer's account on
      a branch named `claude/issue-<n>`, and nothing about whether the work is
      taken. On #168, a `hard` and claimed Issue's branch, a run took the
      branch under a standing session the moment the reviewer requested
      changes. Both facts that would have refused it were GitHub's. #115 is
      the same collision on a `medium` Issue's pull request, #110, where a
      session and a run answered the same six threads and a push from one
      dismissed an approval of the other.
