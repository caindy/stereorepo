disciplines:
  - id: work:discipline/specialization
    name: Specialization
    description: >-
      Turning this scaffold into a new portfolio repo. Done once, by an agent
      following these steps, and never again in that repo.
    judgement: >-
      Which of the inherited terms this portfolio actually needs, who its
      stakeholders really are, and what its domain calls things. None of it is
      derivable from the scaffold, which is why this is a procedure to follow
      rather than a program to run.
    steps:
      - >-
        Start a new empty repo and copy files into it. Do not clone: a clone
        carries the scaffold's commit history and an `origin` pointing back at
        it, and neither belongs to a portfolio.
      - >-
        Copy what is inherited — `.meta/work/`, `.meta/ddd/`, both umbrellas,
        `render.py`, `check.py`, `.meta/assertions/imported/`, the `.meta/*.md`
        satellites except `decisions.md` and `roadmap.md`, and `stakeholders/`.
      - >-
        Write the portfolio's own assertions: `structure.yaml` for its Portfolio,
        Products and Projects; `personas.yaml`; and `domain_vocabulary.yaml` for
        its Bounded Context and the words its domain experts actually use.
      - >-
        Start a fresh `decisions.md` holding only the portfolio's DR-001, and an
        empty `roadmap.md`. The scaffold's history is not the portfolio's.
      - >-
        Rewrite `AGENTS.md` for the portfolio. Keep its conventions; replace what
        it says the repo is.
      - >-
        Delete `SPECIALIZE.md` and rewrite `README.md`. A portfolio specializes
        nothing, and saying otherwise invites someone to run this twice.
      - >-
        Re-render, then run the gate. Both green before the first commit.
      - Commit.
    produces:
      - A portfolio repo, with its own history and nothing of the scaffold's.
  - id: work:discipline/literate-programming
    name: Literate Programming
    description: >-
      A schema is an exposition addressed to a human reader; the
      machine-readable part is secondary to the account of what it means and why.
    judgement: >-
      What a future reader will not be able to reconstruct. No checker can tell
      you which reasoning is worth recording.
    steps:
      - Give a module a description that carries its reasoning, not an inventory.
      - Record on a class what a reader would otherwise have to reconstruct.
      - Mark departures from a canon in place, where they are made.
    produces:
      - Schemas that explain themselves.
  - id: work:discipline/progressive-disclosure
    name: Progressive Disclosure
    description: >-
      One small thing loads always; everything else loads on demand, routed by a
      load map from what you are touching to what to read first.
    judgement: >-
      Where a paragraph goes — what to do, what happened, or why. Cheap only at
      the moment of writing, and not decidable afterwards by inspection.
    steps:
      - Keep the always-loaded core small enough to stay read.
      - Route each paragraph as you write it, never later.
      - Keep every digest deliberately insufficient to act on.
    produces:
      - A core that routes, and satellites that own what they hold.
  - id: work:discipline/dogfooding
    name: Dogfooding
    description: >-
      Use what is being built, on itself, before anyone else has to. When a
      Discipline is adopted, apply it first to the repo that adopted it; when a
      gap shows up in use, fix the thing rather than working around it.
    judgement: >-
      Telling a difficulty that is the tool's fault from one that is the task's.
      Working around the first hides a defect; redesigning for the second is
      thrashing. No test distinguishes them — only use does.
    steps:
      - Apply each adopted Discipline to this repo before applying it anywhere else.
      - Instantiate a schema before trusting it. Writing an instance is the test.
      - Run a procedure for real rather than reviewing it.
      - When use finds a gap, change the thing, and record what use found.
    produces:
      - Findings that reasoning about the artifact does not reach.
