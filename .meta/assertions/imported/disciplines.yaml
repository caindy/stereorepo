disciplines:
  - id: work:discipline/literate-programming
    name: Literate Programming
    description: >-
      An **artifact** is an exposition addressed to a human reader; the
      machine-readable part is secondary to the account of what it means and why.
      Knuth's argument, applied wherever prose and machine-readable content
      coexist — a schema, a module of code, a configuration.

      The exposition must exist in **one copy, and it must be the copy the
      machine reads**. A LinkML module's description is what the generators
      consume; Rust can carry prose inline or include a markdown file into
      rustdoc, and either satisfies this. Where the exposition is a second copy
      of something, it drifts — and a drifted explanation is worse than none,
      because it is still believed.

      Where the prose *sits* is a language's business and not this Discipline's.
      What is required is the single copy, the machine reading it, and the
      prose sorted by what it tells the reader, so that the language has three
      kinds to place rather than one.
    judgement: >-
      What a future reader will not be able to reconstruct. No checker can tell
      you which reasoning is worth recording, and recording all of it is its own
      failure — an exposition nobody finishes explains nothing.
    steps:
      - >-
        Give each unit — module, class, crate — a description carrying its
        reasoning rather than an inventory of its contents.
      - Record what a reader would otherwise have to reconstruct.
      - Mark departures from a canon in place, where they are made.
      - >-
        Keep the exposition in one copy, and make that copy the one the machine
        reads. Inline in the source, or in a file the source includes — whichever
        the language does well.
      - >-
        Sort the prose in a source file by what it tells the reader — the
        paragraph test Progressive Disclosure applies to the repository, applied
        inside a file. What to **do** stays with the item it documents; **why**
        goes where the documentation tool renders it without crowding the code;
        what **happened**, this once, goes to a log named for what it holds,
        out of the code it annotates and reached from it. The language says
        where each of the three sits; the test is the same in every language.
      - >-
        Where the language allows it, make the examples executable, so the prose
        is checked and not merely asserted.
    produces:
      - Artifacts that explain themselves.
  - id: work:discipline/progressive-disclosure
    name: Progressive Disclosure
    description: >-
      One small thing loads always; everything else loads on demand, routed by a
      load map from what you are touching to what to read first.
    judgement: >-
      Where a paragraph goes — what to do, what happened, or why. Cheap only at
      the moment of writing, and not decidable afterwards by inspection.
    steps:
      - Keep the always-loaded core small enough to stay read.
      - Route each paragraph as you write it, never later.
      - Keep every digest deliberately insufficient to act on.
    produces:
      - A core that routes, and satellites that own what they hold.
  - id: work:discipline/ubiquitous-language
    name: Ubiquitous Language
    description: >-
      One set of words, meaning the same thing in the code, the schemas, the
      prose and the conversation — and a word enters it by decision, never by
      use.

      Evans' practice, with one thing his setting did not have to handle. The
      language is now shared with agents that write fluently, tire of nothing,
      and reach for a fresh word the moment an existing one is slightly awkward.
      A team drifts slowly because writing is expensive and someone eventually
      objects. A fleet drifts quickly and *consistently*, and the drift reads as
      good prose, which is why nobody objects.

      So the rule is not to prefer the agreed word. It is that **minting is a
      decision taken with the solo**, and a word that arrived any other way has
      not been minted however well it is being used.
    judgement: >-
      Whether an idea needs a word at all. Most do not — a phrase, or an existing
      term used precisely, leaves the vocabulary smaller and the reader better
      off, and a vocabulary that grows with every distinction stops being one.

      And whether a word is a term or is ordinary English, which is not decidable
      mechanically. The gate narrows the field; a person routes what it finds.
    steps:
      - >-
        Reach for the vocabulary before reaching for a word, and for a canon
        before minting one.
      - >-
        Borrow rather than invent. A term with a literature behind it arrives
        with its distinctions already argued.
      - >-
        Mint only with the solo, and record the decision. A word in the Charter
        or a Discipline without one is a word nobody agreed to.
      - >-
        Check a candidate against what the repository already means by it,
        including in the schemas. A collision found afterwards is a rename.
      - Mark a confusable in both directions, at the moment the collision is noticed.
      - Bias every output toward the vocabulary — code, prose and conversation alike.
    produces:
      - A language the repository and everyone working in it actually share.
  - id: work:discipline/dogfooding
    name: Dogfooding
    description: >-
      Use what is being built, on itself, before anyone else has to. When a
      Discipline is adopted, apply it first to the repo that adopted it; when a
      gap shows up in use, fix the thing rather than working around it.
    judgement: >-
      Telling a difficulty that is the tool's fault from one that is the task's.
      Working around the first hides a defect; redesigning for the second is
      thrashing. No test distinguishes them — only use does.
    steps:
      - Apply each adopted Discipline to this repo before applying it anywhere else.
      - Instantiate a schema before trusting it. Writing an instance is the test.
      - Run a procedure for real rather than reviewing it.
      - When use finds a gap, change the thing, and record what use found.
    produces:
      - Findings that reasoning about the artifact does not reach.
  - id: work:discipline/modelling-the-solo
    name: Modelling the Solo
    description: >-
      Keep a Persona of the person the agent works with, in the repo, current as
      the work reveals things.

      External memory rather than private memory, and the distinction is the
      whole point: the solo can see how he is being read, and another agent can
      pick the model up. An agent's model of the person it works with exists
      whether or not it is written down. Writing it down is what makes it
      correctable and transferable instead of a private guess that steers the
      work invisibly.
    judgement: >-
      What is a durable trait and what was a one-off. A correction made twice is
      a preference; made once it is a correction. And where inference ends and
      evidence begins — the model has to be correctable by its subject rather
      than defended by its author, which it cannot be unless it says which is
      which.
    steps:
      - >-
        Ground each entry in something observable — a correction made, a decision
        taken, a preference stated in so many words.
      - >-
        Record what would change how the work proceeds. Not character
        assessment, and not flattery.
      - Mark inference as inference, so its subject knows what to push back on.
      - Update it as the work reveals things, not in a pass at the end.
      - Surface it for correction rather than defending it.
    produces:
      - A Persona of the solo that another agent can pick up cold.
      - A visible account of how the agent is framing the work.
  # ---------------------------------------------------------------------------
  # Distilled in `python_bootstrap` and pulled up here. Its own README is clear
  # that they were not invented there either: each came from a failure in a
  # working codebase — booktutor, a 560-commit Rust workspace, published
  # agent-workflow skills — and its ADRs carry the receipts. Nine invariants
  # collapse to six Disciplines, because three pairs say one thing twice once
  # stated as ways of working rather than as rules.
  # ---------------------------------------------------------------------------
  - id: work:discipline/ratchet
    name: Ratchet
    description: >-
      Quality moves one way. Green, then commit; and silencing a checker is the
      ratchet running backwards.

      A targeted suppression carrying a rule and a reason is an exception, and
      exceptions are legible. A configuration-level `ignore` is not an exception,
      it is a rule deleted quietly, and nothing downstream can tell the
      difference between a rule that never existed and one that was switched off.
    judgement: >-
      Whether a suppression is a local exception with a reason, or a loosening
      dressed as one. And when a baseline may move down at all — rarely, and
      never merely to make today green.
    steps:
      - Green before commit. Not after, and not "green apart from".
      - >-
        Suppress at the site, naming the rule and the reason. Never in
        configuration, where the exception becomes invisible.
      - >-
        Where a checker cannot be clean at once, ratchet it — hold a baseline
        that may improve and may not regress.
    produces:
      - A standard that cannot quietly fall.
  - id: work:discipline/observed-failure
    name: Observed Failure
    description: >-
      A guardrail never observed to fail is not evidence of anything.

      Coverage is a **floor, not evidence**: it reports what ran, never what was
      checked. A test that passes against broken code passed for the wrong
      reason, and no coverage number distinguishes the two. The only way to know
      a check works is to have watched it fail.
    judgement: >-
      What a passing check actually covers — which is never what its name
      suggests, and rarely what its author intended.
    steps:
      - >-
        Watch every new guardrail fail before trusting it. Break the thing it
        guards, see red, then put it back.
      - Treat a coverage figure as a floor beneath the tests, never as a claim about them.
      - >-
        Use mutation testing, or its equivalent, as the signal behind the floor —
        it is the mechanised form of watching a check fail.
    produces:
      - Checks whose passing means something.
  - id: work:discipline/nothing-unconsumed
    name: Nothing Unconsumed
    description: >-
      An artifact prevents drift only if something consumes it — and consumption
      is necessary, not sufficient. The question after "what reads this?" is
      always "and what is it checked **against**?"

      A configuration key nothing reads, a document nothing links to, a test
      suite nothing runs — each looks like a control and is none.
    judgement: >-
      Whether a consumer actually checks the artifact or merely loads it.
      Something reading a file and ignoring its contents satisfies the letter of
      this and none of its point.
    steps:
      - For each artifact, name what consumes it, and what that consumer checks it against.
      - Delete what nothing consumes. An unread artifact is not documentation, it is debris.
      - >-
        Hold a history log to its receipts. An entry says what failed and what
        the change established — not what changed, which the diff already says —
        and names its **receipt**: the test that would fail if the change were
        undone. The entry is consumed by a reader; what it is checked against is
        the test suite, so an entry whose test is gone is stale and goes with
        it, and the log prunes itself. Observed Failure's argument, applied to
        prose: an entry naming no test is debris for the same reason a guardrail
        never seen to fail is evidence of nothing.
      - Detect orphans mechanically, since they accumulate faster than anyone notices.
    produces:
      - A repository where everything present is load-bearing.
  - id: work:discipline/seeded-artifacts
    name: Seeded Artifacts
    description: >-
      A seed is **data**, and it must not violate the rules it seeds.

      Linting a template in place proves only that its files are well formed. It
      is gated by rendering it and running the real gates on the **result**,
      which is the only version anyone runs.

      And a defect in a seed is worse than the same defect elsewhere, because it
      propagates once per use. A knob nothing reads, a document nothing reaches,
      a suite nothing runs — each is bad in a repository and multiplied in a
      template.
    judgement: >-
      Which of the rules a seed must already satisfy while it is still a seed,
      given that it is deliberately incomplete. An empty list may be honest or may
      be an omission, and only the reason distinguishes them.
    steps:
      - Treat a template as data. Do not lint it in place and call that proof.
      - Gate it by rendering it and running the real gates on the result.
      - >-
        Hold a seed to the rules it seeds. Where it cannot yet satisfy one, say
        why in the seed itself, where whoever fills it in will read it.
    produces:
      - Seeds that cannot propagate a defect.
  - id: work:discipline/written-decisions
    name: Written Decisions
    description: >-
      A decision that lives only in a transcript has not been made.

      Not recorded-badly — **not made**. Nobody downstream can act on it, argue
      with it, or find out why. A conversation is where a decision is reached and
      never where it lives.
    judgement: >-
      When something said is a decision rather than a thought still being had.
      Recording every thought is its own failure; the test is whether anything
      would be done differently now that it is settled.

      And at which level it belongs — the Portfolio's, a Product's or a
      Project's. The test is who shares the matter: a decision about how one
      build unit is built is not about the repository, and one about what
      every Project of a Product does is about neither, and filing any of them
      a level off loses it to the readers it binds.
    steps:
      - >-
        Never invent a rejection. An option nobody weighed is not an option, and
        a record that manufactures one is arguing with itself to look thorough.
        An entry naming no alternative is telling the truth about what was
        considered.
      - >-
        Cite a rule where it lives — an Article, or a step of a Discipline —
        never the decision that led to it. A decision carries consequences; the
        consequences beget rules, and a rule cited from a decision is one that
        was never routed anywhere. Nothing checks this: the phrasings are too
        many to match, and counting them is the instrument A17 already found
        wanting.
      - >-
        Record a decision when the **question** is settled, not when the answer
        is built. A decision begins with a question that demands an answer, and
        the alternatives close the moment it is answered — waiting for the
        implementation leaves them open to anyone who was not in the
        conversation. Status carries the rest: recommended, or in force.
      - Say what was decided and why, not what changed. The diff already says what changed.
      - >-
        Keep `rationale` to what the slots cannot hold. `alternatives` carries what was
        rejected and why, `consequences` what is now true, `falsifier` what would
        overturn it — a paragraph restating any of those is a second copy inside
        the entry. What is left is the reasoning none of them reaches, and it is
        usually short.
      - >-
        Never narrate the sequence of events. What happened on a change is the
        pull request's, and an entry that recounts an afternoon buries the
        foreclosure it exists to record — the chronology reads as authoritative,
        goes stale first, and nothing checks it.
      - >-
        Keep the reasoning, including what was tried and abandoned, so the next
        reader does not re-derive a rejected option.
      - >-
        Record at the level the decision is about, and name it on the entry.
        The Portfolio's decisions are about the repository, its language and its
        way of working, and name nothing; a Product's are what every Project
        that builds it shares and none owns, and name the Product; a Project's
        are about how one build unit is built, and name the Project. One record
        holds all three, so a Project decision left unmarked reads as everyone's,
        and a Portfolio decision marked as a Project's is hidden from every other
        Project.
      - Use the form in `.meta/templates/decision.md`, so the shape does not have to be re-argued.
    produces:
      - A record that answers "why is it like this" without anyone remembering.
  - id: work:discipline/pr-first
    name: PR First
    description: >-
      The pull request is where work is proposed, argued and recorded — not a
      formality wrapped round a branch that was already finished.

      It stands in for the tracker a team would have. A Portfolio with no Jira has
      nowhere else that is searchable, that a Challenge can arrive in from
      outside, and that is already attached to the change rather than pointing at
      it across a system boundary.

      It is also the only Collaboration point available to a solo. Agents in
      separate sandboxes share no filesystem, no shell and no conversation. What
      they share is the pull request — which is why review and disagreement have
      to land there, and not in a transcript only one of them can see.

      It is also where a **Handoff** happens — the seam where one Job stops and
      another takes the same Challenge up. Collaborations here are sequential,
      one Job at a time, each aware only of its own Agency, and what crosses the
      seam is only what the pull request and the branch hold. A handoff is a
      **semaphore, not a message**: GitHub's review request names a successor and
      is a state GitHub holds and reports, so an arriving Job finds its work
      by asking what has been requested of it rather than by reading anything.
      A review can only be requested of an account, which is what the Role
      accounts are for: `.meta/say/move request-review <n>` names the next Role's,
      and the arriving Job asks GitHub what has been requested of its login.

      It is where **work noticed and not done** goes, as a linked Issue. A long
      run ends with things seen and left alone — out of scope, or a reasonable
      next step — and they are delivered in a closing summary, which is the one
      place with no persistence at all. Collecting them into a file instead fails
      four ways: a file has no open and closed, so a line removed is
      indistinguishable from a line resolved, abandoned or tidied; the item loses
      the work it was noticed during, so nobody can tell later whether it still
      applies; appending a line is free and invisible, so the file only grows; and
      flushing it means one unscoped batch of unrelated items sharing no context,
      which is the worst possible shape to hand an agent and the reason that
      follow-up run is expensive.

      A linked Issue answers each. It has state, it carries a backlink to the work
      that found it, its title is read by someone, and it can be picked up alone.
    judgement: >-
      What constitutes one pull request. Too coarse and an argument has no
      subject; too fine and the record narrates change by change without ever
      saying what the whole was for.

      Which Role to hand to, once there is more than one.

      Whether a review comment is answered. A reviewer's point can be right,
      right about something else, or overtaken by the diff, and only the first
      is a change to make — but all three are owed a reply that says which, per
      A16. Resolving one to clear the gate is the shortcut the gate teaches.

      And which observations earn an Issue. The test is whether you can say what
      would make it worth doing — a trigger, or a cost that will land. "This
      function is long" has neither. "This retry has no backoff, and it will
      matter the first time the endpoint is slow" has both. File everything and
      the tracker becomes the file it replaced, with better tooling.

      Whether a point turns on a fact about a system outside this repository —
      GitHub, a harness, a language, a library. If it does, the answer is a
      quote from that system's own reference or a test run against it, and a
      reading is not an answer whichever way it falls. #117 closed one on
      recall twice, once each way, and the documentation took one fetch.
    steps:
      - >-
        Open it when the work starts, not when it is finished. Written at the
        end it becomes a summary of the diff, which git already holds.
      - >-
        Take Challenges in as pull requests, whatever raised them — the solo, a
        scheduled job, another agent — and name the Challenge in the body with a
        closing keyword, so the merge closes it and nobody has to remember to.
      - >-
        Label an Issue's difficulty when raising it: `easy`, `medium`, `hard`
        or `human`, your guess at what it takes for the coder Role. A loop
        takes `easy` and `medium` the moment the label lands; `hard` waits for
        the solo; `human` is where a loop puts what it cannot finish, saying
        where it stopped. The raiser guesses and the loop corrects, downward
        only.
      - >-
        Argue there. Review, objection and answer belong where the next reader
        will look, not where one participant happens to be.
      - >-
        Answer every thread and then resolve it, including one the diff has
        overtaken. Outdated is not answered: GitHub collapses a thread whose
        anchor moved and leaves it open, and a reader years later cannot tell
        a point that was addressed from one that was dropped.
      - >-
        Title it with the words someone will search for. It is the index, and an
        index is worth exactly its titles.
      - >-
        Raise what was noticed and not done as a **conversation on the diff**,
        at the moment it is noticed — not a bullet in the body, which closes
        with the pull request, and never a closing summary. The last comment
        is the one that counts, so replying without the marker is how an item
        the change has overtaken stops being parked, and an unresolved
        conversation blocks the merge, so nothing is walked past without
        somebody deciding what it is.
      - >-
        Promote at merge, not before. What survives the argument earns an
        Issue and the thread is resolved with a link to it; what the change
        overtook is answered and resolved where it was raised. Filing at
        review time creates a tracker item with no relationship to the
        outcome, which goes stale the moment the approach moves under it.
      - >-
        Post what landed for the Challenge before merging, generated and never
        typed: written by hand it is the copy that flatters, and complete
        whether or not the record was.
      - >-
        Merged, never abandoned. A pull request exists because a Challenge
        does, and a Challenge is a real need; work that turned out to be the
        wrong answer merges as the record of that, which is worth more than a
        closed tab.
      - >-
        Push before stopping, and stop at green. Work that exists only in a
        worktree the next Job will never see has not been handed off, and a red
        gate is not a handoff — it is a mess whose author is gone. The gate is
        the completeness test for the Agency you hold; nothing else is.
      - >-
        Stack what waits on what. A change that can only start once another
        lands is a **layer**: its own branch and pull request, based on the
        layer below and linked into a stack, so the layers merge from the
        bottom and GitHub rebases what remains.
      - >-
        Hand off by requesting review of the next Role's account. The request
        is the handoff's whole signal, and a note beside it pretends to be one.
      - >-
        On arrival, read what GitHub holds — the pull request, the diff, the
        commits, the threads and the check states. There is nothing else, by
        design. Ask what this branch already owns: one branch is one pull
        request, so the checkout is the token and GitHub resolves it.
        Authorship cannot answer this, since every pull request here is the
        solo's.
    produces:
      - A searchable record of why each change was made, attached to the change.
      - A place two agents that share nothing else can meet.
      - A successor that resumes rather than restarts.
      - Work noticed and not done, in a queue rather than a pile.
  - id: work:discipline/journaling
    name: Journaling
    description: >-
      Narrative goes to the artifact that owns it; the pull request holds what is
      left over.

      Most of what wants writing down is already owed somewhere. What a schema
      means belongs in the schema, why a decision was taken belongs in a decision
      record, a rule belongs in the Charter, a word belongs in the vocabulary.
      Journaling is that routing, and then the residue — which divides by tense.
      What is **finished** is the account of this change, the path taken through
      it and the approach that lost; it goes in the pull request body, which
      closes when the work does. What is **unfinished** is work noticed and not
      done; it is a Challenge nobody has taken up, so it goes to an Issue linked
      from the pull request, which stays open after the body is archived.

      Filing the second as the first is how it is lost. A body is read once, at
      review, and never again.

      A commit message is a **label**, not an account. Reasoning left there is
      reasoning hidden: it is reached by walking `git blame`, which is expensive,
      lossy under rebase and squash, and attempted only by a reader the artifacts
      have already failed. Left to itself an agent narrates an entire project
      through commit messages, because that is the one place it is always asked to
      write.
    judgement: >-
      Which artifact owns a paragraph, and whether any of them does. Cheap only at
      the moment of writing, and not recoverable afterwards by inspection.

      And whether the residue is worth writing at all. Where the change explains
      itself and nothing was tried and abandoned, an entry for it is a changelog.
    steps:
      - Route it as you write it. Where an artifact owns the paragraph, it goes there.
      - >-
        Put finished residue in the pull request body — what changed, what the
        ground looked like, and what would make this removable.
      - >-
        Put unfinished residue in a linked Issue. It is a Challenge, not a
        paragraph, and it outlives the body.
      - >-
        Keep commit messages to what changed. A message that has begun explaining
        is holding something that belongs elsewhere.
      - >-
        Route every finding in the same change that records it. A rule goes to the
        Charter; a foreclosing decision goes to a decision record.
      - Supersede by writing again and naming what is replaced. Never rewrite.
    produces:
      - Artifacts that carry their own reasoning, and a pull request holding what none of them owns.
