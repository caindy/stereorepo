# The Charter: a working agreement, binding on whoever works here.
#
# Numbered as stable identifiers, so an Article can be cited in a code comment
# or a commit message. A retired invariant leaves a HOLE and is never renumbered:
# a citation that silently comes to mean something else is worse than a dangling
# one.
#
# Distilled in python_bootstrap, where each came from a failure in a working
# codebase. No Article carries that failure: stereorepo's DR-087 removed the slot
# that held it and made `example` required, and stereorepo's DR-043 is where the
# adoption and the failures behind it are recorded. What an Article's provenance
# is, then, is a citation — and a citation is not the Evidence a history entry
# names, the two having shared one word until stereorepo's DR-228 retired it.

# Numbers that were issued and are not Articles. Never reused: a citation that
# silently comes to mean something else is worse than a dangling one. The account
# of a retirement is the decision that took it, not a paragraph kept here.
retired_articles:
  - number: 13
    retired_by: stereorepo's DR-085
  - number: 15
    retired_by: stereorepo's DR-297
  - number: 16
    retired_by: stereorepo's DR-297
  - number: 18
    retired_by: stereorepo's DR-297
  - number: 19
    retired_by: stereorepo's DR-297

articles:
  - id: work:article/1
    name: Article 1
    statement: Green, then commit. Not after, and not "green apart from".
    enforces: work:discipline/ratchet
    checked_by: >-
      The gate, run before committing.
    example: >-
      `uvx --python 3.13 --with linkml --with pyyaml python .meta/check.py`
      passes, then the commit. Not a commit with `--no-verify` and a note to
      fix it after.
    falsifier: >-
      A commit that is the gate's own act, so a tree that did not pass is not
      one the history can hold and there is no order left for a session to keep.
  - id: work:article/2
    name: Article 2
    statement: >-
      A suppression names its rule and its reason, at the site. Never in
      configuration.
    enforces: work:discipline/ratchet
    checked_by: >-
      A check that the linter's ignore list is empty and stays empty.
    example: >-
      `# noqa: E501 — the URL cannot be split`, on the line itself. Never
      an entry in a config ignore list.
    falsifier: >-
      A rule whose every violation here carries the same reason, so that naming
      it at each site is one sentence copied down the file.
  - id: work:article/3
    name: Article 3
    statement: Coverage is a floor beneath the tests, never a claim about them.
    enforces: work:discipline/observed-failure
    checked_by: >-
      A coverage floor, with mutation testing as the signal behind it.
    example: >-
      A coverage floor that must not fall, reported beside the mutation
      score. Never "we are at 90%, therefore tested".
    falsifier: >-
      A coverage measure a test asserting nothing cannot satisfy, so the number
      is a claim about the tests after all.
  - id: work:article/4
    name: Article 4
    statement: A guardrail never observed to fail is not evidence of anything.
    enforces: work:discipline/observed-failure
    checked_by: >-
      Mutation-probing every new guardrail before trusting it.
    example: >-
      The placeholder scan run against a portfolio with a token
      deliberately left in, before it is believed.
  - id: work:article/5
    name: Article 5
    statement: No gate step rewrites the tree.
    checked_by: >-
      Fixing lives in separate commands, never invoked by the gate.
    example: >-
      `render.py --check` in the gate; `render.py` writes only when a
      person runs it.
    falsifier: >-
      A step whose tool can report only by writing, so that the check is had by
      rewriting the tree and reading what changed.
  - id: work:article/6
    name: Article 6
    statement: >-
      Every gate step has three outcomes — could not run, which is loud and
      unmarked; passed, which is marked; found something, which is non-zero.
      Could not run exits zero where a person runs it, and non-zero under CI,
      which provisions its own toolchain and so has no environment to be short
      of.
    checked_by: >-
      Each step's own reporting, and a review of the report's shape.
    example: >-
      A missing `linkml` prints that it could not run and exits zero on a
      maintainer's machine; under CI, where the gate workflow installs it, the
      same report exits non-zero. A violation exits non-zero anywhere.
    falsifier: >-
      A gate that cannot start without every step's tool, so there is no third
      state to report and a mark says what the exit code already said. Or a CI
      run reporting that a step could not run and exiting zero, so the mark is
      the only record that coverage was lost.
  - id: work:article/7
    name: Article 7
    statement: A check-mark is a claim about scope, so a step says what it checked.
    checked_by: >-
      Each step naming what it covered, beside its result.
    example: >-
      `ok rendered prose` after a step that compared every render target,
      including the templates — so the mark says what it covered.
    falsifier: >-
      A step whose scope is printed from what its run collected, so nothing
      beside the mark is a sentence somebody has to keep true.
  - id: work:article/8
    name: Article 8
    statement: >-
      An artifact prevents drift only if something consumes it — and consumption
      is not sufficient. Ask what it is checked against.
    enforces: work:discipline/nothing-unconsumed
    checked_by: >-
      Orphan detection, which enforces the necessary half only, and the second
      seat inspecting the creation boundary against speculative abstractions
      ahead of a consumer (stereorepo's DR-324).
    example: >-
      `templates/decision.md` is consumed by whoever writes a Decision, and
      checked against the `Decision` class by `check.py`. At the creation
      boundary, capability reification on the schema was reverted, and
      stereorepo's DR-324 keeps it out, because a coordinate system invented
      ahead of its consumer is debris before it is written.
    falsifier: >-
      An artifact whose future requirements and downstream consumers are proven so
      invariant that building speculative coordinate systems ahead of consumption
      demonstrably prevents more rework than it introduces.
  - id: work:article/9
    name: Article 9
    statement: >-
      A seed is data. Linting it in place is not proof; it is gated by rendering
      it and running the real gates on the result.
    enforces: work:discipline/seeded-artifacts
    checked_by: >-
      The template is rendered and the real gates run on the result.
    example: >-
      stereorepo's `template/` is filled with dummy tokens and the result validated.
      Never linted where it sits.
    falsifier: >-
      A seed token whose real value is the thing a gate tests, so the filled
      dummy passes where the portfolio's own fill would not.
  - id: work:article/10
    name: Article 10
    statement: A seeded artifact does not violate the rules it seeds.
    enforces: work:discipline/seeded-artifacts
    checked_by: >-
      `check.py`, which fills every token and validates what comes out.
    example: >-
      The seed's own `DR-001.yaml` names an Artifact under `enacted_in`,
      because A20 requires that of any adopted entry.
    falsifier: >-
      A rule a seed can satisfy only by inventing content, its subject being
      something a portfolio has once it has done work and not before.
  - id: work:article/11
    name: Article 11
    statement: A decision that lives only in a transcript has not been made.
    enforces: work:discipline/written-decisions
    checked_by: >-
      Nothing yet.
    example: >-
      A choice settled in conversation is written as
      `assertions/decisions/DR-0nn.yaml` in the same change that acts on
      it.
    falsifier: >-
      A transcript the artifacts cite by a durable identifier, so a decision
      left in it is dereferenced from the rule it settles rather than known only
      to the session that held it.
  - id: work:article/12
    name: Article 12
    statement: >-
      A citation in a durable artifact is dereferenced — the number, the claim it
      names, and a link where one is possible.
    enforces: work:discipline/literate-programming
    checked_by: >-
      `check.py`, on the four shapes of the claim that are a string search: the
      number resolves to an entry or an Article, a quotation attributed to one
      appears in it, a relation stated in prose is the slot it names, and a
      `path:line` reads the span it is cited beside. Over the pages, the assertions and what a
      portfolio inherits — and in an assertion over what the parser holds, so a
      citation in a YAML comment is resolved for its number alone. A paraphrase
      is a reading, and `.meta/dereference.py` is where it is read: whoever
      wrote the citations runs it over what the branch wrote, one model question
      per citation against the entry it names. That step is not a gate, and its
      finding blocks no landing — a gate's red is a fact a re-run cannot
      overturn, and a reading is not (stereorepo's DR-332).
    example: >-
      "A9 — a seed is data, gated by rendering it", with a link. Not a
      bare "A9".
    falsifier: >-
      A citation whose identifier already carries the claim it names, so that
      dereferencing it writes the same words twice.
  - id: work:article/14
    name: Article 14
    statement: Reasoning that lives only in a commit message is not recorded.
    enforces: work:discipline/journaling
    checked_by: >-
      Nothing yet.
    example: >-
      The commit subject is a label — "An Article is a reference" — and
      the argument for it is in the Issue file.
    falsifier: >-
      A commit message the record indexes where the artifacts are read, so the
      reasoning in it is cited from the line it explains rather than walked back
      to through `git blame`.
  - id: work:article/17
    name: Article 17
    statement: A term that arrived by use has not been agreed.
    enforces: work:discipline/ubiquitous-language
    checked_by: >-
      Review checking that any word doing the work of a term is enclosed in
      closed-world wikilinks or minted with the developer, and
      `check.py`'s `ubiquitous language wiki parity` step ensuring 1:1 parity
      between vocabulary concepts and wiki pages (stereorepo's DR-335).
    example: >-
      `Issue` is used because it is a Concept in the vocabulary. A
      word that is not gets minted with the developer before it is used again.
  - id: work:article/20
    name: Article 20
    statement: A rule that lives only in the decision record is not in force.
    enforces: work:discipline/written-decisions
    checked_by: >-
      `check.py`, which fails an ADOPTED Decision naming no Artifact under
      `enacted_in`.
    example: >-
      The rule about a rationale's length is a step of Written Decisions,
      and stereorepo's DR-080 names `.meta/disciplines.md` under `enacted_in`.
    falsifier: >-
      A rule every session here follows that no artifact but the decision record
      states.
  - id: work:article/21
    name: Article 21
    statement: >-
      A gate reports each step in the one shape every gate here prints — `ok`,
      `x` or `?`, then the step, then what it covered, found, or could not do —
      so a reader of any Project's gate reads every other's.
    checked_by: >-
      `.meta/gate`, which reads each Project's report rather than its exit
      code, and fails a gate that prints no step in the shape (stereorepo's DR-104).
    example: >-
      `ok orphans — 5 markdown files under 2 packages, each included by a
      source file` from `cargo xtask gate`, beside `ok artifact paths` from
      `check.py`, read by the same eye. Not a Rust gate that prints cargo's own
      summary lines and exits.
    falsifier: >-
      A Project whose toolchain reports in a form this shape cannot carry
      without hiding what the tool found.
  - id: work:article/22
    name: Article 22
    statement: >-
      State the next participant cannot observe is state the system does not
      have.
    checked_by: >-
      Its instances, each of which carries its own check: A11, A14, A17 and A20
      say the same thing of a decision, of reasoning, of a term and of a rule. The
      general claim is held by the second seat, by asking what a participant with
      no privilege beyond the record could reconstruct (stereorepo's DR-343).
    example: >-
      Which stage an issue is in is the directory its file sits in, so a seat,
      the supervisor and the developer all read it from the same place, and none of
      them holds a copy the others cannot see.
    falsifier: >-
      A participant that proceeds correctly on state it could not observe, which
      would mean a privilege nobody declared.
  - id: work:article/23
    name: Article 23
    statement: >-
      A Claim made without checking is a guess, however it turns out. A Claim
      reads exactly the same whether its author checked it or not, which is what
      makes an unchecked one dangerous rather than merely weak: no reader,
      seat or gate downstream can tell the two apart, so the check belongs to
      whoever writes the Claim, at the moment of writing, and cannot be delegated
      to anyone reading it later. Where the check is available — and it usually
      is, and usually costs one command — make it before asserting. Where it is
      not, say so on the Claim itself: a guess marked as a guess costs a reader
      nothing, and an unmarked one costs them the whole record's credibility once
      they find it.
    enforces: work:discipline/observed-failure
    checked_by: >-
      `just dereference`, which reads the citations a branch wrote against what
      they name, for a Claim citing an Article, a Decision or a Discipline.
      Nothing resolves a Claim about behaviour or history: that half is held by
      the author before it is written and by the second seat after, by asking
      what was consulted rather than whether it reads well. A22 is its complement
      and not its general case — that Article has the record carry what a
      participant needs,
      this one has the author go and read it.
    example: >-
      A Decision of this repository explained a defect by the shape of the code
      that produced it: three acts that are not one transaction, so a failure
      part-way through was retried and did the first act twice. The run's log
      says otherwise — it concluded successfully and carries no error at all,
      and the verb was simply typed twice, eleven seconds apart, with a
      recomposed body. Nothing had failed. Reading the log took one call and was
      done only when the developer asked why the stated mechanism would produce the
      stated effect, by which point the Claim had survived a review and two
      earlier corrections to the same paragraph.
    falsifier: >-
      A landed Claim about behaviour or history that no party checked and no
      citation resolves, or a Claim hedged as uncertain where the check was
      available and cheap.
