# The vocabulary a portfolio inherits from solorepo: the DDD concepts it
# conforms to, the terms solorepo originates, and APM's, named only so that
# collisions can be stated. Synced forward. Do not edit in a portfolio —
# domain terms go in ../domain_vocabulary.yaml.
#
# The ABox that describes the TBox.
#
# A Concept is a unit of meaning, not a word. Two Concepts may share a label —
# that is what confusable_with records, and why this file cannot be replaced by
# the schemas themselves: in a TBox the classes *are* the meanings, so a label
# collision has nowhere to be stated.
#
# Definitions here are one-line glosses. The full reasoning lives on the class,
# per Literate Programming; these are for recognising a term, not applying it.

concept_schemes:
  - id: work:scheme/ddd
    name: DDD canon
    authority: Eric Evans, and About Face for the persona work
  - id: work:scheme/solorepo
    name: solorepo work vocabulary
    authority: solorepo
    namespace: https://w3id.org/solorepo/work-ontology/
  - id: work:scheme/apm
    name: APM primitives
    authority: Microsoft APM
    namespace: https://microsoft.github.io/apm/concepts/primitives-and-targets/

concept_set:
  # ---- adopted from DDD ----
  - id: ddd:concept/aggregate-invariant
    pref_label: Invariant (of an Aggregate)
    definition: What must hold true of a model element's state, in DDD's sense.
    in_scheme: work:scheme/ddd
    scope_note: >-
      Carried by the `invariants` slot on Entity, ValueObject and Aggregate. DDD
      keeps this word; solorepo's clauses are Articles, which is part of why the
      rename was worth making.
  - id: work:concept/bounded-context
    pref_label: Bounded Context
    definition: An explicit boundary within which a model applies and its terms carry one settled meaning.
    in_scheme: work:scheme/ddd
  - id: work:concept/ubiquitous-language
    pref_label: Ubiquitous Language
    definition: The language everyone inside one Bounded Context uses, in speech, documents and code.
    in_scheme: work:scheme/ddd
    scope_note: >-
      A portfolio's own domain language. solorepo's vocabulary is imported
      alongside it to articulate the discipline, and has no authority over it.

      Adopted here as a Discipline of the same name — DDD names the thing, and
      solorepo names the practice of defining, maintaining and adhering to one.
  - id: work:concept/concept
    pref_label: Concept
    definition: >-
      The atomic unit of domain meaning in a Bounded Context's Ubiquitous Language
      (solorepo's DR-184, solorepo's DR-190, solorepo's DR-195).
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    alt_labels:
      - wiki entry
      - wiki page
      - domain concept
      - topic
    avoid: [wiki article, term, entity]
    scope_note: >-
      The semantic unit of maintainer knowledge. Where a Concept lands in the
      artifact hierarchy — whether as a schema gloss, a section, or a dedicated
      markdown file — is subordinate to the authoring agent's structural
      judgement under the Diátaxis Compass. "Article" is strictly avoided to
      protect the Charter's empirical clauses (solorepo's Article 1, solorepo's Article 15).
  - id: work:concept/published-language
    pref_label: Published Language
    definition: A well-documented shared language that contexts translate into and out of.
    in_scheme: work:scheme/ddd
    scope_note: What solorepo offers a portfolio, and what DDD offers solorepo.
  - id: work:concept/conformist
    pref_label: Conformist
    definition: A downstream context that adopts an upstream model wholesale, without translation.
    in_scheme: work:scheme/ddd
  - id: work:concept/persona
    pref_label: Persona
    definition: A specific, detailed, named user archetype the product is designed for.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: >-
      Cooper's sense. What solorepo's original sketch called a Persona is a
      Personality; the two are not the same thing.
    confusable_with:
      - work:concept/personality
  - id: work:concept/business-goal
    pref_label: Business goal
    definition: An organisational objective — conversion, support cost, retained revenue.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: >-
      Named in *About Face* and deliberately kept out of the Persona so it cannot
      pollute the user model. It justifies a Goal instead.
  - id: work:concept/technical-goal
    pref_label: Technical goal
    definition: An architectural constraint — latency, offline-first sync, data residency.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: Kept out of the Persona for the same reason as a business goal.

  # ---- originated by solorepo ----
  # Groupings, so a reader can find a term without reading all of them. The
  # vocabulary grew past the point where a flat table was scannable, and a term
  # nobody can find is a term nobody uses.
  - id: work:concept/g-doing
    pref_label: Doing the work
    definition: Who does work, what they may do, and what they are given to do it with.
    in_scheme: work:scheme/solorepo
  - id: work:concept/g-for
    pref_label: What the work is for
    definition: Who it serves, what problem it addresses, and how anyone knows it is done.
    in_scheme: work:scheme/solorepo
  - id: work:concept/g-done
    pref_label: What was actually done
    definition: The runtime record — who ran, out of what parts, and what they touched.
    in_scheme: work:scheme/solorepo
  - id: work:concept/g-divided
    pref_label: How the repository is divided
    definition: The units a solorepo is made of.
    in_scheme: work:scheme/solorepo
  - id: work:concept/g-recorded
    pref_label: How work is recorded
    definition: The kinds of thing written down, and which of them is authoritative.
    in_scheme: work:scheme/solorepo
  - id: work:concept/g-disciplines
    pref_label: The Disciplines
    definition: The named ways of working, each adhered to because it is not a program.
    in_scheme: work:scheme/solorepo

  - id: work:concept/personality
    pref_label: Personality
    definition: The character an Actor presents — a SOUL.md plus a communication style.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    scope_note: Called Persona in the original sketch, until Cooper's Persona took the word back.
    avoid: [persona]
    confusable_with:
      - work:concept/persona
  - id: work:concept/capability
    pref_label: Capability
    definition: A kind of thing that can be done or used. Never names an object.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    avoid: [permission, tool access]
  - id: work:concept/securable
    pref_label: Securable
    definition: A set of objects, by enumeration or by a selector rule.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/permission
    pref_label: Permission
    definition: The authority to employ a Capability on a Securable.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/role
    pref_label: Role
    definition: A named set of Capabilities.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/challenge
    pref_label: Challenge
    definition: A problem to be addressed — a defect, epic, feature or task.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-for
    avoid: [ticket, story]
    scope_note: >-
      The work itself, which two artifacts hold in turn: an Issue before it is
      taken up, a Pull Request while it is being done.
    confusable_with:
      - work:concept/project
      - work:concept/issue
  - id: work:concept/portfolio
    pref_label: Portfolio
    definition: Everything one solo builds inside one Bounded Context. One per repo.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-divided
    scope_note: >-
      One repo, one Bounded Context, one Ubiquitous Language. The repo boundary
      and the language boundary are the same boundary, which is why a portfolio
      is a monorepo.
    confusable_with:
      - work:concept/product
  - id: work:concept/product
    pref_label: Product
    definition: >-
      Something delivered to users, with its own interface and therefore its own
      primary Persona. The unit of value.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-divided
    scope_note: >-
      Cooper's rule is the test for one Product against two: a primary persona's
      goals cannot be met by an interface aimed at another without unacceptable
      compromise.
    confusable_with:
      - work:concept/portfolio
      - work:concept/project
  - id: work:concept/project
    pref_label: Project
    definition: >-
      A unit of build — one toolchain, one language, its own tests and gate. The
      unit of construction.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-divided
    scope_note: >-
      Products are composed from Projects, many-to-many. Not a piece of work,
      which is a Challenge; and not a whole repository, which is what
      python_bootstrap means by the word.
    avoid: [workstream]
    confusable_with:
      - work:concept/challenge
      - work:concept/product
  - id: work:concept/definition-of-done
    pref_label: Definition of Done
    definition: The test that decides whether a Goal has been met.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-for
  - id: work:concept/jtbd
    pref_label: Job to be Done
    definition: The need the work serves, stated from the point of view of the Persona that has it.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-for
    alt_labels: [JTBD]
    confusable_with:
      - work:concept/job
  - id: work:concept/goal
    pref_label: Goal
    definition: A SMART goal — Challenge, Definition of Done, Job to be Done and Deadline, all required.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-for
    confusable_with:
      - work:concept/persona-goal
  - id: work:concept/persona-goal
    pref_label: Persona goal
    definition: What a Persona is trying to achieve, at Cooper's experience, end or life tier.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-for
    scope_note: >-
      An END goal is Goal-shaped but has no Deadline: it is standing rather than
      a bounded commitment, so it is not a Goal.
    confusable_with:
      - work:concept/goal
  - id: work:concept/remit
    pref_label: Remit
    definition: Permissions plus a Goal — what may be done, and what it is to be done for.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/agency
    pref_label: Agency
    definition: A Role plus a Remit.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/actor
    pref_label: Actor
    definition: A Personality with an Identity and a Memory.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    avoid: [user, bot]
  - id: work:concept/job
    pref_label: Job
    definition: An Actor given an Agency. An assignment.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    confusable_with:
      - work:concept/jtbd
  - id: work:concept/collaboration
    pref_label: Collaboration
    definition: The Jobs that meet on one Challenge. Two is the minimum.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
  - id: work:concept/execution
    pref_label: Execution
    definition: One carrying-out of a Job. Where design-time becomes fact.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-done
  - id: work:concept/audit-record
    pref_label: Audit Record
    definition: One employment of a Capability on a Securable. A Permission in the past tense.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-done
  - id: work:concept/aibom
    pref_label: Agent Bill of Materials
    definition: What an Actor was made of at a moment, resolved to immutable references.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-done
    alt_labels: [AIBOM]
  - id: work:concept/discipline
    pref_label: Discipline
    definition: A structured way of working that must be adhered to because it is not an imperative program.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: Not a Capability, not a Permission, and not a characterisation such as a communication style.
  - id: work:concept/issue
    pref_label: Issue
    definition: >-
      Where a Challenge lives before it is taken up — including work noticed
      during other work and deliberately not done.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The hosting service's artifact, borrowed for what it has that a file does not: an open
      and a closed, a title someone reads, and a backlink to the work that found
      it. Not a synonym for Challenge — it is one of the two places a Challenge
      can be.
    confusable_with:
      - work:concept/challenge
      - work:concept/pull-request
    avoid: [tech debt, backlog item]
  - id: work:concept/noticed-and-not-done
    pref_label: Noticed and Not Done
    definition: >-
      Work observed but left unexecuted during a change, formally parked as an
      unresolved review thread or a linked Issue to preserve its context
      without blocking delivery.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    alt_labels: [leftover work, remainder, deferred work]
  - id: work:concept/pull-request
    pref_label: Pull Request
    definition: >-
      Where a Challenge is taken in, argued and recorded — the Collaboration
      point, and the searchable account of why each change was made.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    alt_labels: [PR, journal]
    scope_note: >-
      `journal` is the same thing under its older name, kept because it says what
      the pull request is *for*. Not authoritative, which is the trap: it looks
      like a record, so findings that stop here give a repository the appearance
      of having decided things and the substance of having noticed them.
    confusable_with:
      - work:concept/challenge
      - work:concept/issue
    avoid: [changelog, ticket]
  - id: work:concept/review-thread
    pref_label: Review Thread
    definition: >-
      One conversation on a Pull Request, opened against a line or against the
      change as a whole, and closed by being answered and resolved.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      **Outdated is not resolved.** GitHub collapses a thread whose anchor
      moved and leaves it open, and the two states are independent — an
      objection can outlive the line it was written against. A16 turns on that
      distinction.
    confusable_with:
      - work:concept/pull-request
    avoid: [comment, conversation]
  - id: work:concept/noticed-and-not-done
    pref_label: Noticed and Not Done
    definition: >-
      Work or observations encountered during the execution of a change that
      fall outside its remit, parked on the diff as a review thread, and
      promoted to an Issue at merge (solorepo's Article 15, solorepo's DR-064, solorepo's DR-195).
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    alt_labels:
      - leftover work
      - remainder
      - follow-up work
      - deferred work
      - unfinished work
    avoid: [backlog, technical debt, punch list, follow-up ticket]
    scope_note: >-
      Recorded only in an Issue or parked review thread, never buried in a commit
      message or lost in PR summaries (solorepo's Article 15).
  - id: work:concept/decision-record
    pref_label: Decision record
    definition: >-
      The record of decisions at every level — the Portfolio's, a Product's or
      a Project's, told apart by which the entry names. One sequence, numbered
      DR-nnn, newest last.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The level is who shares the matter. A Project decision unmarked reads as
      everyone's; a Portfolio decision marked as a Project's is hidden from every
      other Project. "ADR" named the Project level until solorepo's DR-093, and imported a
      qualifier the record never used.
    avoid: [ADR, architecture decision record]
  - id: work:concept/bootstrap
    pref_label: Bootstrap
    definition: >-
      The standard for one language, together with the gates that hold a project
      to it.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-divided
    scope_note: >-
      Where a Discipline becomes a command that can fail. A Bootstrap says how a
      Discipline is satisfied in one language; it never restates the Discipline,
      because the second copy is the one that drifts.
    avoid: [starter, boilerplate, scaffold]
  - id: work:concept/literate-programming
    pref_label: Literate Programming
    definition: >-
      An artifact is an exposition addressed to a human reader; the
      machine-readable part is secondary.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
  - id: work:concept/progressive-disclosure
    pref_label: Progressive Disclosure
    definition: >-
      One small thing loads always; everything else loads on demand, routed by a
      load map that is deliberately insufficient.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
  - id: work:concept/journaling
    pref_label: Journaling
    definition: >-
      Routing narrative to the artifact that owns it, and the residue to the Pull
      Request — never to a commit message.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      The routing practice, not a place. What it routes goes to the artifact that
      owns it, and the residue to the Pull Request.
    confusable_with:
      - work:concept/pull-request
  - id: work:concept/pr-first
    pref_label: PR First
    definition: >-
      Opening the Pull Request when the work starts, so it is where the work is
      argued rather than a wrapper round a finished branch.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      It stands in for the tracker a team would have, and is the only
      Collaboration point available to agents that share no filesystem.
  - id: work:concept/knowledge-management
    pref_label: Knowledge Management
    definition: >-
      Organizing maintainer-facing exposition into an encyclopedic wiki
      partitioned by Bounded Context.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      Prose addressed to a maintainer who arrives cold and seeks to understand an
      architecture or domain concept. Every concept in a Bounded Context's
      Ubiquitous Language has a corresponding wiki page adhering to MOS:LEAD
      conventions and closed-world wikilinks (solorepo's DR-184, solorepo's DR-185).
  - id: work:concept/trailer
    pref_label: Trailer
    definition: >-
      A `Key: value` line at the end of a commit message or a comment, naming the
      Actor that wrote it.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      Borrowed from git, which already parses these. It carries what no other
      part of the record can: every commit and comment here is made under the
      solo's account, so identity is asserted by the writer or it is absent. A
      Role's machine account would say which Role; the trailer says which Actor
      within it, and the two do not substitute for each other.
  - id: work:concept/handoff
    pref_label: Handoff
    definition: >-
      The seam where one Job stops and another takes the same Challenge up,
      sharing no filesystem, no shell and no conversation.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    scope_note: >-
      A state, not a message: a review request naming the next Role. It is part
      of PR First rather than a Discipline of its own — once the note was
      removed, what remained was a transition with two conditions on it, and a
      way of working with no judgement in it is a program nobody has written.
  - id: work:concept/dogfooding
    pref_label: Dogfooding
    definition: >-
      Using what is being built, on itself, before anyone else has to.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      A Discipline here, not a slogan: each adopted Discipline is applied to this
      repo first, and a schema is instantiated before it is trusted.
  - id: work:concept/modelling-the-solo
    pref_label: Modelling the Solo
    definition: >-
      Keeping a Persona of the person the agent works with, in the repo and
      current, as external memory rather than private.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      Not Cooper's persona research, which models absent users from evidence.
      This models a present person who can read and correct it.
    avoid: [profiling]
  - id: work:concept/ratchet
    pref_label: Ratchet
    definition: Quality moves one way — green before commit, and never by silencing a checker.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      A suppression at the site with a rule and a reason is an exception. One in
      configuration is a rule deleted quietly.
  - id: work:concept/observed-failure
    pref_label: Observed Failure
    definition: A guardrail never observed to fail is not evidence of anything.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    scope_note: Coverage is a floor beneath the tests, never a claim about them.
    avoid: [test coverage]
  - id: work:concept/article
    pref_label: Article
    definition: >-
      One clause of the Charter — a claim that can be held against an artifact
      and found false, numbered so it can be cited as A1, A2 and so on.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      Where a Discipline is followed, an Article is checked. Binding, and
      empirical rather than drafted: each carries the failure it came from.
    avoid: [invariant, rule, constraint]
  - id: work:concept/charter
    pref_label: Charter
    definition: The Articles together — a working agreement, binding on whoever works here.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      Borrowed rather than metaphorical. A charter grants and binds; what this
      one adds is that its clauses are empirical, so it can be argued with on
      evidence rather than only amended.
  - id: work:concept/citation
    pref_label: Citation
    definition: >-
      A formal reference in a durable artifact to an upstream authority — an Article,
      Decision Record, or Challenge — asserting that the target supports or governs
      the statement.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      A citation is composed of an identifier (number), the claim it names, and a link
      where one is possible (Article 12, solorepo's DR-182). Evaluated at three progressive depths:
      target existence, structural correspondence of the claim, and semantic support
      by the target authority.
    avoid: [reference, link, mention]
  - id: work:concept/dereference
    pref_label: Dereference
    definition: >-
      To resolve and evaluate a citation against what the referenced authority asserts.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The verb Article 12 binds to citation. Checked mechanically for target existence
      and structural claims by check.py, and evaluated for semantic support by
      dereference.py before handoff.
    avoid: [resolve, verify link]
  - id: work:concept/nothing-unconsumed
    pref_label: Nothing Unconsumed
    definition: >-
      An artifact prevents drift only if something consumes it and checks it
      against something.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
  - id: work:concept/seeded-artifacts
    pref_label: Seeded Artifacts
    definition: >-
      A seed is data, gated by rendering it and running the real gates on the
      result, and it must not violate the rules it seeds.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
    avoid: [scaffolding]
  - id: work:concept/written-decisions
    pref_label: Written Decisions
    definition: A decision that lives only in a transcript has not been made.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-disciplines
  - id: work:concept/solorepo-skill
    pref_label: Skill (solorepo Capability kind)
    definition: A Capability that composes tools, as against a tool, which is atomic.
    in_scheme: work:scheme/solorepo
    broader: work:concept/g-doing
    confusable_with:
      - work:concept/apm-skill
      - work:concept/apm-prompt
  # ---- APM's, named here only so the collisions can be stated ----
  - id: work:concept/apm-skill
    pref_label: Skill (APM primitive)
    definition: A cross-tool meta-guide in the agent-skills format, at .apm/skills/<name>/SKILL.md.
    in_scheme: work:scheme/apm
    confusable_with:
      - work:concept/solorepo-skill
      - work:concept/apm-prompt
  - id: work:concept/apm-prompt
    pref_label: Prompt (APM primitive)
    definition: An executable, parameterized workflow that also surfaces as a slash-command.
    in_scheme: work:scheme/apm
    alt_labels: [command, slash-command]
    avoid: [skill]
    scope_note: What "/add-ubiquitous-language-term" is. Calling it a skill is the loosest of the three collisions.
    confusable_with:
      - work:concept/solorepo-skill
      - work:concept/apm-skill
