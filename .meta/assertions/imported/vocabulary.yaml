# The vocabulary a portfolio inherits from stereorepo: the DDD concepts it
# conforms to, the terms stereorepo originates, and APM's, named only so that
# collisions can be stated. Synced forward. Do not edit in a portfolio —
# domain terms go in ../domain_vocabulary.yaml.
#
# The ABox that describes the TBox.
#
# A Concept is a unit of meaning, not a word. Two Concepts may share a label —
# that is what confusable_with records, and why this file cannot be replaced by
# the schemas themselves: in a TBox the classes *are* the meanings, so a label
# collision has nowhere to be stated.
#
# Definitions here are one-line glosses. The full reasoning lives on the class,
# per Literate Programming; these are for recognising a term, not applying it.

concept_schemes:
  - id: work:scheme/ddd
    name: DDD canon
    authority: Eric Evans, and About Face for the persona work
  - id: work:scheme/stereorepo
    name: stereorepo work vocabulary
    authority: stereorepo
    namespace: https://w3id.org/stereorepo/work-ontology/
  - id: work:scheme/toulmin
    name: Toulmin's ontology of argument
    authority: >-
      Stephen Toulmin, *The Uses of Argument* (1958), as caindy/fitch-mvp's
      `schema/epistemology.yaml` models it on LinkML
    namespace: https://w3id.org/hellothen/epistemology/
  - id: work:scheme/apm
    name: APM primitives
    authority: Microsoft APM
    namespace: https://microsoft.github.io/apm/concepts/primitives-and-targets/

concept_set:
  # ---- adopted from DDD ----
  - id: ddd:concept/aggregate-invariant
    pref_label: Invariant (of an Aggregate)
    definition: What must hold true of a model element's state, in DDD's sense.
    in_scheme: work:scheme/ddd
    scope_note: >-
      Carried by the `invariants` slot on Entity, ValueObject and Aggregate. DDD
      keeps this word; stereorepo's clauses are Articles, which is part of why the
      rename was worth making.
  - id: work:concept/bounded-context
    pref_label: Bounded Context
    definition: An explicit boundary within which a model applies and its terms carry one settled meaning.
    in_scheme: work:scheme/ddd
  - id: work:concept/ubiquitous-language
    pref_label: Ubiquitous Language
    definition: The language everyone inside one Bounded Context uses, in speech, documents and code.
    in_scheme: work:scheme/ddd
    scope_note: >-
      A portfolio's own domain language. stereorepo's vocabulary is imported
      alongside it to articulate the discipline, and has no authority over it.

      Adopted here as a Discipline of the same name — DDD names the thing, and
      stereorepo names the practice of defining, maintaining and adhering to one.
  - id: work:concept/concept
    pref_label: Concept
    definition: >-
      The atomic unit of domain meaning in a Bounded Context's Ubiquitous Language
      (stereorepo's DR-184, stereorepo's DR-190, stereorepo's DR-195).
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    alt_labels:
      - wiki entry
      - wiki page
      - domain concept
      - topic
    avoid: [wiki article, term, entity]
    scope_note: >-
      The semantic unit of maintainer knowledge. Where a Concept lands in the
      artifact hierarchy — whether as a schema gloss, a section, or a dedicated
      markdown file — is subordinate to the authoring agent's structural
      judgement under the Diátaxis Compass. "Article" is strictly avoided to
      protect the Charter's empirical clauses (stereorepo's Article 1, stereorepo's Article 15).
  - id: work:concept/published-language
    pref_label: Published Language
    definition: A well-documented shared language that contexts translate into and out of.
    in_scheme: work:scheme/ddd
    scope_note: What stereorepo offers a portfolio, and what DDD offers stereorepo.
  - id: work:concept/conformist
    pref_label: Conformist
    definition: A downstream context that adopts an upstream model wholesale, without translation.
    in_scheme: work:scheme/ddd
  - id: work:concept/persona
    pref_label: Persona
    definition: A specific, detailed, named user archetype the product is designed for.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: >-
      Cooper's sense. Compiled to an agent that answers as the Persona during
      collaborative feature design interrogation (stereorepo's DR-200).
  - id: work:concept/business-goal
    pref_label: Business goal
    definition: An organisational objective — conversion, support cost, retained revenue.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: >-
      Named in *About Face* and deliberately kept out of the Persona so it cannot
      pollute the user model. It justifies the work instead.
  - id: work:concept/technical-goal
    pref_label: Technical goal
    definition: An architectural constraint — latency, offline-first sync, data residency.
    in_scheme: work:scheme/ddd
    broader: work:concept/g-for
    scope_note: Kept out of the Persona for the same reason as a business goal.

  # ---- originated by stereorepo ----
  # Groupings, so a reader can find a term without reading all of them. The
  # vocabulary grew past the point where a flat table was scannable, and a term
  # nobody can find is a term nobody uses.
  - id: work:concept/g-doing
    pref_label: Doing the work
    definition: Who does the work, and how it moves from the backlog to main.
    in_scheme: work:scheme/stereorepo
  - id: work:concept/g-for
    pref_label: What the work is for
    definition: Who it serves, what problem it addresses, and how anyone knows it is done.
    in_scheme: work:scheme/stereorepo
  - id: work:concept/g-divided
    pref_label: How the repository is divided
    definition: The units a stereorepo is made of.
    in_scheme: work:scheme/stereorepo
  - id: work:concept/g-recorded
    pref_label: How work is recorded
    definition: The kinds of thing written down, and which of them is authoritative.
    in_scheme: work:scheme/stereorepo
  - id: work:concept/g-disciplines
    pref_label: The Disciplines
    definition: The named ways of working, each adhered to because it is not a program.
    in_scheme: work:scheme/stereorepo

  - id: work:concept/capability
    pref_label: Capability
    definition: A kind of thing that can be done or used. Never names an object.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    avoid: [permission, tool access]
  - id: work:concept/role
    pref_label: Role
    definition: A named set of Capabilities.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
  - id: work:concept/portfolio
    pref_label: Portfolio
    definition: Everything one human builds inside one Bounded Context. One per repo.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-divided
    scope_note: >-
      One repo, one Bounded Context, one Ubiquitous Language. The repo boundary
      and the language boundary are the same boundary, which is why a portfolio
      is a monorepo.
    confusable_with:
      - work:concept/product
      - work:concept/client-repo
  - id: work:concept/client-repo
    pref_label: Client Repo
    definition: >-
      A software repository that specializes stereorepo by adopting its cognitive
      operating layer via the APM package, inheriting its SDLC and verification gates,
      and instantiating language Projects from Bootstraps on demand.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-divided
    alt_labels:
      - Specialization
      - Child Repo
      - Specialized Portfolio
    confusable_with:
      - work:concept/portfolio
      - work:concept/project
    scope_note: >-
      A downstream repository consuming stereorepo's cognitive primitives (`.meta/`)
      via APM. While a Portfolio names the monorepo boundary for one Bounded Context,
      a Client Repo names the physical git repository that specializes the scaffold,
      inheriting its disciplines, verification gate, and language bootstraps.
  - id: work:concept/product
    pref_label: Product
    definition: >-
      Something delivered to users, with its own interface and therefore its own
      primary Persona. The unit of value.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-divided
    scope_note: >-
      Cooper's rule is the test for one Product against two: a primary persona's
      goals cannot be met by an interface aimed at another without unacceptable
      compromise.
    confusable_with:
      - work:concept/portfolio
      - work:concept/project
  - id: work:concept/project
    pref_label: Project
    definition: >-
      A unit of build — one toolchain, one language, its own tests and gate. The
      unit of construction.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-divided
    scope_note: >-
      Products are composed from Projects, many-to-many. Not a piece of work,
      which is an Issue; and not a whole repository, which is what
      python_bootstrap means by the word.
    avoid: [workstream]
    confusable_with:
      - work:concept/issue
      - work:concept/product
  - id: work:concept/jtbd
    pref_label: Job to be Done
    definition: The need the work serves, stated from the point of view of the Persona that has it.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-for
    alt_labels: [JTBD]
  - id: work:concept/persona-goal
    pref_label: Persona goal
    definition: What a Persona is trying to achieve, at Cooper's experience, end or life tier.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-for
    scope_note: >-
      Standing rather than a bounded commitment. What the work in hand is for is
      an Issue's to say, not a Persona goal's.
  - id: work:concept/human
    pref_label: Human
    definition: >-
      The one person a repository serves, who builds it with agents and decides
      what they cannot.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    scope_note: >-
      The common word, as in "human in the loop", narrowed to one person. Never
      a second person: a repository has exactly one human, and a process that
      needs two is a poor fit. Never an agent acting for the human: an agent's
      judgement is not the human's, however it is labelled. The `human`
      difficulty names the Issues that wait for this person's desk check.
    avoid: [solo, user, owner, operator]
    confusable_with:
      - work:concept/seat
  - id: work:concept/issue
    pref_label: Issue
    definition: >-
      One unit of work, as one Markdown file on the board, whose filename slug is
      its identifier.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The common word, narrowed. An Issue has no number: its slug is its id. It
      has no status, labels or assignee: its stage is the directory it sits in.
      It has no comment thread: the seats' notes and the human's desk-check
      notes are written in the file. Its front matter holds only what cannot be
      observed or derived — `difficulty`, and optionally `waits_on` and
      `parent`. An Issue with children is a parent issue; there is no other
      type.
    avoid: [ticket, story, challenge, epic, task]
    confusable_with:
      - work:concept/project
  - id: work:concept/board
    pref_label: Board
    definition: >-
      A repository's set of Issue files, kept in `issues/` at its root, in which
      the directory holding an Issue file is that Issue's stage.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      One per repository, and the board on `main` is authoritative. Not GitHub
      Issues or Projects, not a status field, and not a kanban view: a view of
      the board is a projection of it and holds no state of its own.
    avoid: [kanban, tracker]
  - id: work:concept/stage
    pref_label: Stage
    definition: >-
      Where an Issue is on its way to `main`: `roadmap`, `backlog`, `todo`,
      `in-progress`, `desk-check` or `done`, in that order, each a directory of
      the board.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      A directory, never a field. The human adds Issues to `roadmap` and
      `backlog`; every other move is the supervisor's, and always a `git mv`.
    avoid: [column, status, state]
  - id: work:concept/seat
    pref_label: Seat
    definition: >-
      One of the two long-lived harness sessions that take an Issue from the
      backlog to `main` in turns, in one shared worktree.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    scope_note: >-
      Coined, because pair programming's driver and navigator divide the typing
      and here both seats write code. Within a stage the primary seat takes the
      first turn and the secondary the next; the secondary fixes what it finds
      rather than describing it. A seat is told the Issue file, what the stage
      is for, and what changed since its last turn, and nothing about the
      protocol that moves the Issue.
    avoid: [coder, reviewer, agent]
    confusable_with:
      - work:concept/human
      - work:concept/supervisor
  - id: work:concept/supervisor
    pref_label: Supervisor
    definition: >-
      The deterministic program that runs the seats and moves an Issue between
      stages from what it can observe: where the Issue file is, the working
      tree, and the gate's exit code.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    scope_note: >-
      A program, not a model, and nothing an agent must remember to invoke.
      `pair/` in the scaffold; `just pair` runs it.
    avoid: [orchestrator, captain, lead]
    confusable_with:
      - work:concept/seat
  - id: work:concept/quiet-turn
    pref_label: Quiet turn
    definition: >-
      A seat's turn that changes nothing, by which the seat accepts the state
      the other left.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    scope_note: >-
      Agreement is observed, never declared: when both seats have accepted the
      same state, by making it or by leaving it alone, the stage advances if its
      requirement holds.
    avoid: [approval, verdict, sign-off]
  - id: work:concept/desk-check
    pref_label: Desk check
    definition: >-
      The human's check of a `human` Issue's result, by hand, before it lands on
      `main`.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    scope_note: >-
      The one stage that waits for the human. Accepting lands the Issue;
      leaving notes in the Issue file and resuming sends it back to the pair.
    avoid: [review, approval]
  - id: work:concept/discipline
    pref_label: Discipline
    definition: A structured way of working that must be adhered to because it is not an imperative program.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: Not a Capability, and not a characterisation such as a communication style.
  - id: work:concept/decision-record
    pref_label: Decision record
    definition: >-
      The record of decisions at every level — the Portfolio's, a Product's or
      a Project's, told apart by which the entry names. One sequence, numbered
      DR-nnn, newest last.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The level is who shares the matter. A Project decision unmarked reads as
      everyone's; a Portfolio decision marked as a Project's is hidden from every
      other Project. "ADR" named the Project level until stereorepo's DR-093, and imported a
      qualifier the record never used.
    avoid: [ADR, architecture decision record]
  - id: work:concept/bootstrap
    pref_label: Bootstrap
    definition: >-
      The standard for one language, together with the gates that hold a project
      to it.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-divided
    scope_note: >-
      Where a Discipline becomes a command that can fail. A Bootstrap says how a
      Discipline is satisfied in one language; it never restates the Discipline,
      because the second copy is the one that drifts.
    avoid: [starter, boilerplate, scaffold]
  - id: work:concept/literate-programming
    pref_label: Literate Programming
    definition: >-
      An artifact is an exposition addressed to a human reader; the
      machine-readable part is secondary.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
  - id: work:concept/progressive-disclosure
    pref_label: Progressive Disclosure
    definition: >-
      One small thing loads always; everything else loads on demand, routed by a
      load map that is deliberately insufficient.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
  - id: work:concept/journaling
    pref_label: Journaling
    definition: >-
      Routing narrative to the artifact that owns it, and the residue to the
      issue file — never to a commit message.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      The routing practice, not a place. What it routes goes to the artifact that
      owns it, and the residue to the issue file. Leftover work, noticed and not
      done, is a new Issue in the backlog.
    alt_labels:
      - leftover work
  - id: work:concept/knowledge-management
    pref_label: Knowledge Management
    definition: >-
      Organizing maintainer-facing exposition into an encyclopedic wiki
      partitioned by Bounded Context.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      Prose addressed to a maintainer who arrives cold and seeks to understand an
      architecture or domain concept. Every concept in a Bounded Context's
      Ubiquitous Language has a corresponding wiki page adhering to MOS:LEAD
      conventions and closed-world wikilinks (stereorepo's DR-184, stereorepo's DR-185).
  - id: work:concept/dogfooding
    pref_label: Dogfooding
    definition: >-
      Using what is being built, on itself, before anyone else has to.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      A Discipline here, not a slogan: each adopted Discipline is applied to this
      repo first, and a schema is instantiated before it is trusted.
  - id: work:concept/modelling-the-human
    pref_label: Modelling the Human
    definition: >-
      Keeping a Persona of the person the agent works with, in the repo and
      current, as external memory rather than private.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      Not Cooper's persona research, which models absent users from evidence.
      This models a present person who can read and correct it.
    avoid: [profiling]
  - id: work:concept/ratchet
    pref_label: Ratchet
    definition: Quality moves one way — green before commit, and never by silencing a checker.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: >-
      A suppression at the site with a rule and a reason is an exception. One in
      configuration is a rule deleted quietly.
  - id: work:concept/observed-failure
    pref_label: Observed Failure
    definition: A guardrail never observed to fail is not evidence of anything.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    scope_note: Coverage is a floor beneath the tests, never a claim about them.
    avoid: [test coverage]
  - id: work:concept/article
    pref_label: Article
    definition: >-
      One clause of the Charter — a claim that can be held against an artifact
      and found false, numbered so it can be cited as A1, A2 and so on.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      Where a Discipline is followed, an Article is checked. Binding, and
      empirical rather than drafted: each carries the failure it came from.
    avoid: [invariant, rule, constraint]
  - id: work:concept/charter
    pref_label: Charter
    definition: The Articles together — a working agreement, binding on whoever works here.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      Borrowed rather than metaphorical. A charter grants and binds; what this
      one adds is that its clauses are empirical, so it can be argued with on
      evidence rather than only amended.
  - id: work:concept/claim
    pref_label: Claim
    definition: >-
      Toulmin's Claim: the central hypothesis or predicate assertion being evaluated.
    in_scheme: work:scheme/toulmin
    broader: work:concept/g-recorded
    avoid: [assertion, statement, hypothesis]
    scope_note: >-
      That sentence is the opening of the `Claim` class in
      `schema/epistemology.yaml` in caindy/fitch-mvp, quoted whole and unaltered.
      The schema models Toulmin's ontology of argument on LinkML — the same
      technology this vocabulary uses — and names Stephen Toulmin as the source;
      his published one is *The Uses of Argument* (1958). Quoted rather than
      paraphrased, because four systems are intended to merge and a shared word
      that acquires a second meaning here is the drift caindy/solorepo#488 exists
      to prevent.

      The same class continues: "A claim is its text and its warrants", and its
      Qualifier "is not stored", a claim carrying no probability of its own.
      `Warrant` and `Qualifier` are that schema's terms and are not minted
      here.

      The label collides with the channel verb `claim`, which takes an Issue by
      assigning it to a Role's account, and with "the claim released" in what
      `move stop` does. That is an ownership lock and not an assertion under
      evaluation. `confusable_with` cannot hold it, the verb being no Concept, so
      it is said here: a Claim is argued about, a claim is taken and released.

      What a history entry asserts, what an Article holds against an artifact,
      and what a Citation names in its target are each a Claim. Whether the rest
      of Toulmin's ontology is taken with it is caindy/solorepo#576's judgement,
      not settled here (stereorepo's DR-228).
  - id: work:concept/evidence
    pref_label: Evidence
    definition: >-
      Hard ground truths, telemetry, or verified physical/digital data streams.
    in_scheme: work:scheme/toulmin
    broader: work:concept/g-recorded
    avoid: [receipt, proof]
    confusable_with:
      - work:concept/citation
    scope_note: >-
      That sentence is the opening of the `Evidence` class in
      `schema/epistemology.yaml` in caindy/fitch-mvp, quoted whole and
      unaltered, for the reason Claim's is.

      The same class continues: "Toulmin's Grounds (Data) by default, reached
      from a warrant through `grounds`; also Backing when it lends a credence,
      which is how a data stream earns a track record. The two are positions in
      an argument, not kinds of evidence." `Grounds`, `Backing` and `Warrant`
      are that schema's terms, and the slot the quotation names is its slot, not
      one here; none of them is minted here.

      A Citation can be Evidence and is not the same thing: a citation names an
      upstream authority, and one that cannot go stale is what
      stereorepo's DR-171 refused, which is why the collision is recorded rather
      than the word avoided.

      What is distinctive here is not that a history entry names Evidence but
      that it names Evidence which can fail: stereorepo's DR-171 turned down commit
      hashes and pull request citations as not mechanically falsifiable, because
      a hash is unchanged when the change it records is undone, so nothing
      detects that the entry has gone stale. The `Evidence:` line is held to a symbol a parser resolves,
      which is what lets an entry go stale when the test it names is gone; the
      word itself carries no such requirement (stereorepo's DR-228).
  - id: work:concept/citation
    pref_label: Citation
    definition: >-
      A formal reference in a durable artifact to an upstream authority — an Article,
      Decision Record, or Issue — asserting that the target supports or governs
      the statement.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      A citation is composed of an identifier (number), the claim it names, and a link
      where one is possible (Article 12, stereorepo's DR-182). Evaluated at three progressive depths:
      target existence, structural correspondence of the claim, and semantic support
      by the target authority.
    avoid: [reference, link, mention]
  - id: work:concept/dereference
    pref_label: Dereference
    definition: >-
      To resolve and evaluate a citation against what the referenced authority asserts.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    scope_note: >-
      The verb Article 12 binds to citation. Checked mechanically for target existence
      and structural claims by check.py, and evaluated for semantic support by
      dereference.py.
    avoid: [resolve, verify link]
  - id: work:concept/nothing-unconsumed
    pref_label: Nothing Unconsumed
    definition: >-
      An artifact prevents drift only if something consumes it and checks it
      against something.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
  - id: work:concept/seeded-artifacts
    pref_label: Seeded Artifacts
    definition: >-
      A seed is data, gated by rendering it and running the real gates on the
      result, and it must not violate the rules it seeds.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
    avoid: [scaffolding]
  - id: work:concept/written-decisions
    pref_label: Written Decisions
    definition: A decision that lives only in a transcript has not been made.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-disciplines
  - id: work:concept/stereorepo-skill
    pref_label: Skill (stereorepo Capability kind)
    definition: A Capability that composes tools, as against a tool, which is atomic.
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-doing
    confusable_with:
      - work:concept/apm-skill
      - work:concept/apm-prompt
  - id: work:concept/externalized-memory
    pref_label: Externalized Memory
    definition: >-
      The practice of holding what a session would otherwise remember in artifacts
      the next participant reads, rather than in the agent that learned it
      (stereorepo's DR-216, stereorepo's Article 22).
    in_scheme: work:scheme/stereorepo
    broader: work:concept/g-recorded
    alt_labels:
      - compiled memory
    scope_note: >-
      Not the absence of memory. The harness's own memory surfaces are tracked and
      generated from the assertions, so memory here is compiled rather than
      forbidden. What is given up is the private copy: state the next
      participant cannot observe is state the system does not have.
  # ---- APM's, named here only so the collisions can be stated ----
  - id: work:concept/apm-skill
    pref_label: Skill (APM primitive)
