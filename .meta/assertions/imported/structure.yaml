# The Artifacts that every portfolio renders, and the prose their pages open
# with. Inherited rather than the portfolio's own, because the pages are: the
# Charter, the vocabulary, the decision record, the decision form and both
# skills are written from `assertions/imported/` by a renderer a portfolio also
# inherits (stereorepo's DR-144).
#
# `assertions/structure.yaml` is the portfolio's own and is never synced, so a
# preamble left there would leave every portfolio's renderer asking for prose
# nothing asserts. An Artifact here is the scaffold's statement about a file
# every portfolio has; one there is the portfolio's about its own.

artifacts:
  - id: work:artifact/meta-charter
    name: .meta/charter.md
    path: .meta/charter.md
    preamble: |
      ## The Charter

      _A working agreement. One-line claims that can be held against an artifact_
      _and found false._

      Numbered as **stable identifiers**, cited as A1, A2 and so on. A retired
      Article leaves a **hole** and is never
      renumbered — a citation that silently comes to mean something else is worse than
      a dangling one.

      Where a Discipline is *followed*, an Article is *checked*. Some enforce a
      Discipline; some stand alone, and need nothing behind them.
  - id: work:artifact/meta-decisions
    name: .meta/decisions.md
    path: .meta/decisions.md
    preamble: |
      ## Decision record

      _Every decision taken, with why. Newest last._

      Add an entry when the question is settled, not when the answer is built —
      `status` says how far it has got. A number is a
      **stable identifier** and is never reused: an entry that turned out to record a
      narrative rather than a foreclosure is withdrawn, and its number stays a hole
      at the foot of this page.

      **This page routes and does not restate.** An entry *is* its assertion file,
      named for its number, so a conversation reaches one as
      `@.meta/assertions/decisions/DR-001.yaml`. The line here says an entry exists
      and what question it answered; only the entry is sufficient to apply it.
  - id: work:artifact/meta-disciplines
    name: .meta/disciplines.md
    path: .meta/disciplines.md
    preamble: |
      ## Disciplines

      _Structured ways of working that must be adhered to._
  - id: work:artifact/meta-templates-decision
    name: .meta/templates/decision.md
    path: .meta/templates/decision.md
    preamble: |
      # DR-<nnn> · <one-line title, present tense>

      **Not authoritative.** The Charter and the Disciplines hold the rules and win
      any disagreement. This records why something is built the way it is, at the
      level whose readers share the matter: the Portfolio's, a Product's or a
      Project's. One class and one record, `.meta/assertions/decisions/`, whatever
      the level — the entry names its Product or Project, or neither.
    woven:
      - name: decision
        text: |
          What was decided, in the present tense — "we do X". One paragraph.
      - name: bearing on the charter
        text: |
          Dereference every citation per A12 — "A9 — a seed is data, gated by rendering it"
          rather than a bare "A9". Omit the section if there is none.
  - id: work:artifact/meta-vocabulary
    name: .meta/vocabulary.md
    path: .meta/vocabulary.md
    preamble: |
      ## Vocabulary

      _The words this repo uses, and what they mean._

      A Concept is a unit of meaning, not a word — which is why two entries
      below share a label. Use the preferred label; do not mint a Concept
      without the developer. Check DDD first, then this vocabulary, then ask.
  - id: work:artifact/skill-wikisplain
    name: .claude/skills/wikisplain/SKILL.md
    path: .claude/skills/wikisplain/SKILL.md
    description: >-
      Author or explain an encyclopedic concept page in the wiki
      (wiki/<context>/<concept>.md) following Knowledge Management conventions
      (MOS:LEAD bold lead definition, closed-world wikilinks, semantic duplicate
      prevention, and vocabulary alignment, stereorepo's DR-187).
    preamble: |
      # /wikisplain

      The `/wikisplain` skill creates, explains, and verifies encyclopedic wiki pages in `wiki/<context>/` following the [[knowledge-management|Knowledge Management]] discipline and Wikipedia editorial conventions (stereorepo's DR-187).

      ## When to Use

      - Minting a new concept in the Ubiquitous Language that requires maintainer-facing exposition.
      - Explaining an architectural subsystem, component, or domain concept for new maintainers.
      - Scaffolding a canonical wiki page with compliant MOS:LEAD phrasing, frontmatter, and closed-world wikilinks.
      - Checking for semantic duplicates or collisions against existing vocabulary and wiki pages.

      ## Verbs

      - `python3 .meta/wikisplain.py "<concept>" [--context <context>] [--definition <def>] [--synonyms <s1,s2>]` — scaffold a wiki page and verify compliance
      - `python3 .meta/wikisplain.py "<concept>" --dry-run` — preview page content without writing to disk
      - `python3 .meta/wikisplain.py "<concept>" --check-duplicate` — check if a concept or slug already exists

      ## Instructions

      1. **Check for Duplicates:** Run `python3 .meta/wikisplain.py "<Concept>" --check-duplicate` to verify no collision exists in vocabulary or existing wiki files.
      2. **Scaffold the Page:** Run `python3 .meta/wikisplain.py "<Concept>" --context <context> --definition "<copular definition>"` to generate the canonical structure.
      3. **Write Exposition:** Expand the page with narrative context, invariants, and relationships to other disciplines.
      4. **Wikilink Entities:** Use closed-world wikilinks (`[[concept]]` or scoped `[[context/concept]]`) to link related terms.
      5. **Verify Compliance:** Run `just gate meta` to ensure `wikilinks` and `wiki lead paragraphs` pass cleanly.

      ## Invariants

      - **MOS:LEAD:** The first paragraph must open with `**<Concept>** is ...` matching the `# <Concept>` heading exactly.
      - **Closed-World Links:** Wikilinks `[[concept]]` must resolve to an existing wiki page or minted concept.
      - **Bounded Context:** Pages must reside in `wiki/<context>/` corresponding to their Bounded Context.
  - id: work:artifact/skill-search
    name: .claude/skills/search/SKILL.md
    path: .claude/skills/search/SKILL.md
    description: >-
      Search repository assertions, decisions, and wiki concepts by meaning, with
      the BM25F retrieval of stereorepo's DR-337 and the benchmark of
      stereorepo's DR-103, as a skill rather than a recipe (stereorepo's DR-349).
    preamble: |
      # /search

      The `/search` skill queries repository YAML assertions under `.meta/assertions/` and
      markdown concept pages under `wiki/` using the in-memory Okapi BM25F ranking
      stereorepo's DR-337 built, scored against the eighteen benchmark queries
      stereorepo's DR-103 set, and reached as a skill rather than a `just` recipe
      since stereorepo's DR-349.

      ## When to Use

      - Locating relevant Decision Records, Charter Articles, or ontology concepts when
        researching a change.
      - Dereferencing domain terminology, conventions, and architectural precedents without
        manual grep.
      - Evaluating information retrieval accuracy and ranking performance against benchmark
        queries.

      ## Verbs

      - `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py "<query>"` — search assertions, decisions, and wiki concepts
      - `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py "<query>" --limit <n>` — return top `<n>` results (default 5)
      - `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py "<query>" --detail` — display full contextual snippets
      - `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py "<query>" --json` — output search results in JSON format
      - `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py --benchmark` — run the 18 stereorepo's DR-103 benchmark queries

      When running in an environment where `linkml` and `pyyaml` are installed,
      `python3 .meta/search.py "<query>"` is equivalent.

      ## Instructions

      1. **Run Retrieval:** Run `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py "<query>"` with quotes to preserve multi-word phrasing and punctuation.
      2. **Inspect Context:** Add `--detail` when a brief snippet does not show the
         needed section.
      3. **Structured Ingestion:** Use `--json` when parsing search results in
         automated scripts or pipelines.
      4. **Benchmark Invariants:** Run `uvx --python 3.13 --with linkml --with pyyaml python .meta/search.py --benchmark` to test retrieval quality against stereorepo's DR-103 benchmark suite (hit@5 >= 15/18).

      ## Invariants

      - **Execution Dependencies:** Assertions are indexed via LinkML. If invoked outside an
        environment with `linkml` and `pyyaml` installed, `uvx --with linkml --with pyyaml`
        ensures assertion schemas load and are not silently skipped.
      - **In-Memory Index:** Searches construct an in-memory index over `.meta/assertions/` and
        `wiki/` dynamically on each invocation with zero disk persistence and zero cache drift.
      - **Argument Quoting:** Direct execution preserves caller quotation in
        `sys.argv`, avoiding unquoted shell splitting.
  - id: work:artifact/skill-technical-writing
    name: .claude/skills/technical-writing/SKILL.md
    path: .claude/skills/technical-writing/SKILL.md
    description: >-
      Apply the layered technical writing standard (Diátaxis structure, Google developer style,
      literate programming register, closed-world dereferencing, and Ubiquitous Language alignment),
      with the four permissible comment exceptions, knowledge routing, constraint mechanization,
      and suppression auditing that govern every comment in a source file (stereorepo's DR-207).
      Use when writing or auditing docstrings, inline comments, lint or type suppressions,
      Decision Records, wiki pages, or Issue files.
    preamble: |
      # /technical-writing

      The `/technical-writing` skill operationalizes the character of `work:role/technical-writer` and enacts stereorepo's DR-337, stereorepo's DR-196, and stereorepo's DR-339.

      ## Two Communication and Authoring Regimes (stereorepo's DR-339)

      1. **Conversational Communication Register:** In dialogue and turn responses, speak in the Technical Writer register (`work:role/technical-writer`): *Spelled out and self-contained. Every citation dereferenced. Assume a reader who was not in the conversation, holds none of its shorthand, and arrives by search some years later. Length is not the cost here; ambiguity is.* This breaks the failure mode of abstruse, cryptic shorthand.
      2. **Durable Artifact Authoring Regime:** When authoring or editing durable files in the repository (code docstrings, Decision Records, wiki pages, companion logs), the structure, tone, and density are governed by the **Diátaxis quadrant** being authored. Conversational expansiveness must not be imported into item docstrings: Reference docstrings must remain dry, crisp, and contract-focused, with zero reviewer litigation.

      This standard combines Diátaxis documentation architecture, Google developer style sentences, and stereorepo's Literate Programming (stereorepo's DR-171, stereorepo's DR-334) and Knowledge Management (stereorepo's DR-184, stereorepo's DR-185, stereorepo's DR-187, stereorepo's DR-196) disciplines.

      ## Five Overarching Invariants

      1. **Every citation dereferenced (stereorepo's DR-332, stereorepo's DR-336):** Never leave a bare or unverified claim. A statement attributing a rule or behavior must cite its authority (`stereorepo's DR-nnn`, `Article n`, `[[concept]]`). Check source assertions directly or search via the `/search` skill, which carries the invocation (stereorepo's DR-103).
      2. **Use the Ubiquitous Language (stereorepo's DR-335):** The codebase and LinkML ontologies are the word list. Write `Issue` (not ticket/story), `seat` (not coder/reviewer), `developer` (not user/owner), `Role`, `Persona`.
      3. **The Reader's Test (stereorepo's DR-334):** Can a reader use this item from its docstring alone without reading commit histories or Issue files?
      4. **No Reviewer Litigation in Code (stereorepo's DR-171):** Docstrings state usage contracts, parameters, and invariants. They do not argue against past reviewers. The 'why' and trade-offs belong in Decision Records (`DR-nnn.yaml`) or module docstrings. Incident narratives belong in `<module>.history.md`.
      5. **The Residue Principle (stereorepo's DR-196):** Issue files and commit messages are not documentation containers. What fits into any of the four Diátaxis quadrants belongs in a durable repository artifact. What remains is residue, and only residue belongs in the Issue file.

      ## The Diátaxis Compass

      Select exactly one mode before writing:

      | Mode | Purpose | In Stereorepo | Tone & Rules |
      |---|---|---|---|
      | **Reference** | Facts for lookup (Understanding + Work) | Public function, class, and method docstrings, LinkML schemas | Dry, complete, sure. Describe parameters, invariants, exceptions. No opinions, no tutorials, no past debate. |
      | **Explanation** | Understanding & why (Understanding + Learning) | Decision Records (`DR-nnn.yaml`), module overviews, wiki pages | Anchor on a real 'why' question. Context, constraints, alternatives, trade-offs. |
      | **How-To** | Steps to a goal (Action + Work) | `just` recipes, stereorepo's `SPECIALIZE.md`, workflow guides | Task-oriented, assume competence, action only. No digressions. 'Do X to achieve Y.' |
      | **Tutorial** | Learning by doing (Action + Learning) | Quickstarts, onboarding lessons | Guided, step-by-step, visible results at each step. |

      ## Pre-Writing Routing: Where to Write

      Before typing prose for a change, execute this routing tree to select the container:

      1. **Task, recipe, or repeatable procedure:** `justfile` recipe or stereorepo's `SPECIALIZE.md` (**How-To**).
      2. **Public function, class, schema, or API fact:** item docstring or LinkML schema (**Reference**, stereorepo's DR-171, stereorepo's DR-334).
      3. **Settled architectural choice between alternatives:** Decision Record in `.meta/assertions/decisions/DR-nnn.yaml` (**Explanation**).
      4. **Bug, incident, or regression history:** `<module>.history.md` with Evidence (**Explanation**).
      5. **Enduring domain concept or subsystem overview:** `wiki/<context>/<concept>.md` via `/wikisplain` (`python3 .meta/wikisplain.py`) (**Explanation**, stereorepo's DR-184, stereorepo's DR-335).
      6. **Unrouted residue:** The Issue file holds what changed, the path taken and the approach that lost; work noticed and not done is a new Issue in `issues/backlog/`. Never summarize diffs.

      ## Container Subordination

      The atomic semantic unit of domain knowledge is the Concept (stereorepo's DR-338). Subordinate storage placement to the reader's posture:
      - **Schema Gloss:** `vocabulary.yaml` when machine checks and search aliases suffice.
      - **Section / Subsection:** `##` or `###` within an existing document when tightly bound to an aggregate.
      - **Dedicated Wiki Page:** `wiki/<context>/<concept>.md` when the concept has independent depth, invariants, or broad relevance.
      - **Subdirectory:** A folder grouping related concept pages for complex domain aggregates.

      Strictly avoid 'wiki article' (`avoid: [wiki article]`) to protect Charter Articles (stereorepo's Article 1).

      ## The Four Permissible Comment Exceptions (stereorepo's DR-207)

      These exceptions govern every comment in a source file, at every scope — file header, module level, class body, and function or method body alike. A surprise inside internal code is a defect in the code, not a gap in its narration: rename the symbol, extract the helper, or narrow the type until the implementation reads as its own explanation. Four kinds of comment survive a prune, and no others:

      1. **Legal notices.** Copyright, licensing, and attribution headers a license obliges the file to carry.
      2. **Public API contracts.** Item docstrings written as dry Diátaxis Reference contracts, with no reviewer litigation (stereorepo's DR-334, stereorepo's DR-337). An item is a module, class, function, method, or module-level binding, and a binding's docstring is the string literal directly below its assignment.
      3. **Immutable external boundary constraints.** A rule a foreign platform, third-party library, operating system, or wire protocol forces on the code and that you cannot reshape from inside this repository, cited with a dereferenced issue, RFC, or specification reference (stereorepo's Article 12). A constraint you own is not this exception: mechanize it instead.
      4. **Tool formatting directives.** Markers a formatter or generator reads, such as `# fmt: skip` or `// prettier-ignore`.

      Everything else is knowledge to route, a constraint to mechanize, or a suppression to audit. Each has a section below.

      A comment annotating a module-level constant is not a fifth exception. Say what the binding *is* and it is a Reference contract: move it into the docstring below the assignment, where exception 2 already holds it. Say why the value is what it is and it is Explanation: route it to `wiki/<context>/` or a Decision Record. Narrate the statement beside it — `# Ensure .meta is importable` above the `sys.path` insert that does exactly that — and it has no destination, so it goes.

      ## Pruning Routes Knowledge, It Never Destroys It

      A comment worth deleting is rarely a comment worth losing. Before removing non-trivial commentary, send what it knows down the routing tree in **Pre-Writing Routing: Where to Write** above:

      - **Defect narrative, incident, or regression history:** `<module>.history.md`, each account naming Evidence that can fail — the check or probe symbol under `.meta/checks/probes/` that fails if the defect returns (stereorepo's DR-171, stereorepo's DR-342).
      - **Architectural rationale, or an alternative weighed and rejected:** a Decision Record in `.meta/assertions/decisions/DR-nnn.yaml`, or an enduring concept page under `wiki/<context>/` (stereorepo's DR-184, stereorepo's DR-196).
      - **An operational instruction — how to run, rebuild, or verify something:** a `justfile` recipe, self-documented by its own comment (stereorepo's DR-329).
      - **Nothing a reader needs:** delete it. Narration of self-evident steps and commented-out dead code have no destination, and git holds the corpse.

      Write the destination before you delete the line. A prune that skips this step is the one that loses the knowledge.

      ## Constraint Mechanization Protocol

      `# must run before X`, `# do not reorder`, `# caller must ensure the directory exists`: each states an invariant that nothing checks. Prose cannot fail a gate, so the invariant holds for exactly as long as the next reader's attention.

      Convert the claim into the cheapest mechanism that fails when it is violated, then prune the prose:

      1. **A type or schema invariant,** when the wrong state can be made unrepresentable.
      2. **A runtime precondition** that raises where the assumption is made and names what it expected, so the error message carries what the comment said.
      3. **A regression probe** under `.meta/checks/probes/`, or a check under `.meta/checks/`, when the ordering or precondition spans call sites.

      An invariant that resists all three is a rule something outside this repository forces on the code, so it stays as an immutable external boundary constraint (exception 3 of The Four Permissible Comment Exceptions above) with its citation.

      ## Suppression Audit Protocol

      Treat every lint and type suppression the diff adds or touches — `# noqa`, `# type: ignore`, `#[allow(...)]` — as an open defect until you have read what it silences. Under `.meta/`, the `meta lints` check already refuses one that carries no `# reason:` on the same line (stereorepo's DR-177), and a reason is the floor rather than the justification.

      - **A suppression over a safety, correctness, or type-soundness finding is a defect.** Fix the root cause. The suppression is not the fix; it is the record that nobody looked.
      - **A surviving suppression is narrow:** the specific rule or error code, never bare. It earns its keep only as an immutable external boundary constraint (exception 3 of The Four Permissible Comment Exceptions above) — a rule a foreign platform, library, or checker forces on the code — with a dereferenced upstream issue or specification saying why the checker is wrong here.
      - **A blanket suppression at file or module scope** hides findings nobody has seen yet, including ones the next change adds under it. Narrow it to the line.

      Run this audit before a turn ends, over what the branch changed (stereorepo's DR-339).

      ## Google Developer Style Sentences

      - **Address the reader directly:** Use 'you' in the present tense. Reserve 'will' for things that genuinely occur later.
      - **Active voice:** 'The gate checks', not 'is checked by the gate'.
      - **Cut dead words:** 'To', not 'in order to'. 'Use', not 'utilize'. 'Do', not 'perform'.
      - **Specific over sterile:** Name the exact symbol, file, flag, or command name (`.meta/search.py`, not 'the search script').
      - **Vary rhythm:** Mix sentence lengths on purpose. Short sentences land a point. Longer ones carry a fact with its condition or consequence.

