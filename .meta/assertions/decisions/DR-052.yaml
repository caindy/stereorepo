decisions:
  - id: work:decision/052
    name: "DR-052 · The pull request is the journal, and a commit message is a label"
    status: ADOPTED
    supersedes:
      - work:decision/050
    applies:
      - work:article/13
      - work:article/14
    alternatives:
      - name: "The commit message"
        chosen: false
        reason: "A reader in `git blame` is there because an artifact failed to explain itself, so narrating a commit provisions the failure path — and it is not searchable."
      - name: "A journal file in the repository"
        chosen: false
        reason: "python_bootstrap has no separate product decision log, so its journal is decision-shaped. Copying the form gives two decision records under different names."
      - name: "The pull request"
        chosen: true
        reason: "Searchable, already attached to the change, where an external workflow can land a Challenge, and the one Collaboration point available to agents in separate sandboxes."
    consequences:
      - "Two Disciplines where there was one: PR First is the venue, Journaling is the routing."
      - "The `Journal` Concept is retired, folded into Pull Request as an alt label."
      - "The pull request lives on GitHub and not in the clone, which sharpens A13's edge."
    enacted_in:
      - work:artifact/meta-charter
    rationale: |-
      Two things a team buys with Jira and a solo will not run: search,
      and a venue already attached to the change. The commit message has
      neither, and a reader in `git blame` is there because an artifact
      failed to explain itself — so effort spent narrating a commit
      provisions the failure path.

      What makes the pull request non-negotiable rather than convenient:
      agents in separate sandboxes share no filesystem, no shell and no
      conversation. Claude following Gemini have nowhere else to meet.

      The three headings move with it, re-pointed at Chesterton's Fence —
      *what would make this removable* replaces *what would falsify this*,
      because a reader in front of a fence needs what it was put there to
      hold, not whether a claim is true.
