decisions:
  - id: work:decision/173
    name: "DR-173 · Schemas and executable tooling remain in scaffold inheritance, and APM is reserved for cognitive primitives"
    status: ADOPTED
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-apm-readme
      - work:artifact/meta-disciplines
      - work:artifact/specialize
    context: >-
      solorepo's #28 and #77 questioned whether non-primitive assets—specifically
      LinkML schemas (`.meta/work/`, `.meta/ddd/`) and executable Python tools
      (`.meta/say/`, `.meta/hooks/signed_channel.py`, `.meta/check.py`, `.meta/gate`)—could
      or should ride as supporting resources inside APM skills rather than being copied
      during Specialization step two.
    alternatives:
      - name: Package schemas and scripts as supporting resources inside APM skills
        chosen: false
        reason: >-
          APM skills allow supporting directories (`scripts/`, `references/`), but
          packaging repository infrastructure inside them causes three fatal architectural
          defects: files are duplicated across every active target harness directory
          (`.claude/skills/...`, `.agents/skills/...`), violating single statement, one home (A8);
          non-interactive CI workflows (`coder.yml`, `review.yml`) would be forced to execute
          scripts from harness cache paths; and it creates circularity, since `.meta/gate`
          validates assertions using LinkML schemas before APM compilation has occurred.
      - name: Retain schemas and tooling in scaffold inheritance via Specialization, reserving APM for cognitive primitives
        chosen: true
        reason: >-
          LinkML schemas and executable CLI scripts are repository infrastructure and
          metamodels, not agent cognitive primitives. Keeping them in `.meta/` via
          Specialization step two preserves single-source assertions, ensures `.meta/gate`
          is runnable on fresh clones prior to APM compilation, and keeps GitHub Actions
          workflows decoupled from harness directories.
    consequences:
      - >-
        LinkML schemas (`.meta/work/`, `.meta/ddd/`, umbrellas) and executable tooling
        (`.meta/say/`, `.meta/hooks/`, `check.py`, `.meta/gate`) remain in `.meta/`
        and are inherited via Specialization's step two copy set.
      - >-
        APM primitives generated by solorepo's #342 are strictly reserved for agent
        cognitive primitives: `instructions`, `agents`, `skills`, `prompts`, and `hooks`.
      - >-
        Settles solorepo's #77: the signing channel, its hook and deny list arrive
        in a portfolio via Specialization's copy set, while APM hooks register
        lifecycle callbacks that point to the invariant path `$CLAUDE_PROJECT_DIR/.meta/hooks/signed_channel.py`.
    falsifier: >-
      An APM specification that natively standardizes machine-executable toolchains
      and metamodel schemas without duplicating them across harness directories.
    rationale: |-
      Treating repository infrastructure and LinkML metamodels as agent prompt
      resources is a category error.

      APM's purpose in solorepo is late-binding distribution of agent guidance,
      personas, capabilities, and lifecycle hooks across heterogeneous model
      runtimes. Repository-level enforcement, deterministic CI gates, and
      authoritative schemas belong to the repository itself, which Specialization
      seeds once.
