decisions:
  - id: work:decision/188
    name: "DR-188 · Reviewer depth is a template method pipeline of scaffold security invariants, declarative assertions, and programmatic hooks"
    challenge: work:challenge/372
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/meta-depth
      - work:artifact/meta-work-structure
      - work:artifact/meta-disciplines
    context: >-
      In `review.yml`, `choose the depth` hardcoded thirty lines of inline bash
      evaluating changed files against scaffold boundary paths (`.meta/say`,
      `.meta/hooks`, `.claude`, `.github/workflows`, `check_pr.py`) per
      solorepo's DR-109, DR-126, and DR-166. While correct for the scaffold
      boundary, in a specialized portfolio inheriting the workflow it forced all
      product domain code into the standard path (Sonnet, 1 agent, 15m) without
      any mechanism for a portfolio to declare its own critical domain boundaries
      without forking or editing `review.yml`.
    alternatives:
      - name: Keep inline bash in review.yml and let specialized repos edit it
        chosen: false
        reason: >-
          Leaves workflows diverging across portfolios on every clone. It also
          kept the depth logic untestable offline, uncallable from local CLI,
          and uninspectable by automated test probes or companion metrics.
      - name: Declarative pattern matching in structure.yaml only
        chosen: false
        reason: >-
          Solves file glob matching for projects, but cannot accommodate
          dynamic heuristics such as AST analysis, PR label inspection, or
          semantic diff complexity checks.
      - name: Programmatic script hook only (.meta/hooks/depth.py)
        chosen: false
        reason: >-
          Forces simple portfolios to author Python scripts merely to declare
          file glob boundaries, and risks allowing a flawed hook implementation
          to silently downgrade the scaffold's own security envelope.
      - name: A 4-layer template method pipeline in .meta/depth.py combining invariants, assertions, and hooks
        chosen: true
        reason: >-
          The scaffold security envelope is an invariant baseline that can never
          be bypassed by a portfolio; `critical_paths` in `structure.yaml` provides
          zero-ceremony declarative glob matching for domain projects;
          `.meta/hooks/depth.py` offers an escape hatch for dynamic heuristics;
          and the standard default covers everything else.
    consequences:
      - >-
        `.meta/depth.py` implements the 4-layer template method pipeline,
        handling both pull request diff resolution (incremental vs cumulative)
        and local/CLI evaluation via `--files`.
      - >-
        `choose the depth` in `.github/workflows/review.yml` delegates directly
        to `python3 .meta/depth.py "$PR" >> "$GITHUB_OUTPUT"`.
      - >-
        `Project` in `.meta/work/structure.yaml` gains the `critical_paths` slot,
        allowing projects in `structure.yaml` to declare globs requiring deep review.
      - >-
        Specialization step 2 in `.meta/assertions/disciplines.yaml` copies
        `.meta/depth.py` alongside `.meta/timing.py` and `.meta/gate`.
      - >-
        `.meta/checks/probes.py` gains `depth_probes` verifying all four layers
        of depth evaluation under unit tests.
    falsifier: >-
      A PR touching a scaffold boundary path (.meta/say, .meta/hooks, etc.)
      evaluated as standard depth, or a declared critical path ignored by
      depth evaluation.
    rationale: |-
      The depth step determines whether a pull request warrants deep multi-agent
      auditing or standard review. The criteria for that decision belong to two
      different owners: the scaffold, which must protect its agent control plane
      and security envelope; and the portfolio, which understands which of its
      own domain services and data stores are critical.

      Hardcoding the scaffold's criteria in GitHub Actions bash conflated the
      invariant algorithm with the heuristic criteria. Extracting it into a
      template method in `.meta/depth.py` establishes the scaffold boundary as a
      non-bypassable invariant, while opening clean declarative and scripted
      extension points for specialized product repositories.
