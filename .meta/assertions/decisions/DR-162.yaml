decisions:
  - id: work:decision/162
    name: "DR-162 · Pull request form validation at the door in move, and routing failed checks through reviewer change requests"
    challenge: work:challenge/275
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/16
      - work:article/19
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/github-workflows-review
    context: >-
      Autonomous coder runs frequently fail CI gate on pull request body validation
      checks (such as #270 and #271 failing A15 because What it closes was authored
      as prose instead of bulleted keywords). This failure occurs because .meta/say/move
      open and revise performed zero client-side validation, dispatching arbitrary
      markdown to GitHub. When gate fails, the coder loop has no event to wake it up
      because coder.yml only triggers on issues [labeled] and pull_request_review
      [submitted]. Furthermore, review.yml instructed the reviewer not to wait on
      gh pr checks but gave no direction to check completed runs, permitting approvals
      on heads with failing checks. An approval on a red head creates a deadlock:
      the merge manager will not land pull requests whose checks fail, and the coder
      will not wake up to fix them.
    alternatives:
      - name: Trigger the coder workflow directly on check_run, check_suite, or workflow_run failure
        chosen: false
        reason: >-
          Mechanical failure triggers lack an external governor and risk runaway
          loops on persistent test or infrastructure failures, consuming runner minutes
          and model token budgets without bound. Additionally, triggering on initial
          check failures races the authoring coder, which pushes early under PR First
          before completing its local turn.
      - name: Leave check failures to manual detection and dispatch
        chosen: false
        reason: >-
          Manual intervention defeats unattended autonomous pair-programming and leaves
          pull requests stranded indefinitely when checks turn red after an authoring
          coder concludes.
      - name: Validate the form at the door in move, and require reviewer change requests on failed checks
        chosen: true
        reason: >-
          Catches body validation errors client-side in move open and revise before
          touching GitHub, fixing formatting synchronously during the author's active
          turn. Routes any surviving CI check failures through the reviewer Role: the
          reviewer inspects completed checks and issues CHANGES_REQUESTED instead of
          approving, waking the coder under its existing budgeted answering pass.
    consequences:
      - >-
        .meta/say/move open and revise validate title and body against check_pr.check()
        before sending them to GitHub, refusing invalid bodies locally and surfacing
        actionable feedback within the author's active turn.
      - >-
        .github/workflows/review.yml instructs the reviewer to inspect completed
        check runs and check_pr.py on the head before deciding its verdict; any failed
        check requires --request-changes naming the failure in What was found, waking
        the coder Role without clearing the merge semaphore.
    falsifier: >-
      A pull request that deadlocks because a check fails on a branch where no review
      was requested, or transient external network blips causing repetitive change
      requests that exhaust turn caps.
    rationale: |-
      Preventing errors at the door is always higher leverage than recovering from
      them asynchronously. The majority of gate failures observed in autonomous
      coder sessions were trivial PR body formatting mismatches (e.g. writing
      prose under What it closes or What was noticed and not done instead of
      markdown bullets). Because `.meta/say/move open` and `.meta/say/move revise`
      performed no local validation, these errors were only discovered minutes later
      when the `gate` workflow completed on GitHub Actions. By running
      `check_pr.check(title, body)` directly inside `move open` and `move revise`,
      any formatting flaw is caught synchronously in the agent's tool execution,
      allowing the agent to correct the body immediately before CI ever runs.

      For code or test failures that cannot be caught prior to push, adding an
      unbounded CI trigger (such as `workflow_run` on `gate` failure) to `coder.yml`
      introduces the danger of runaway loops and concurrency collisions with an
      in-flight authoring pass. The reviewer Role is already positioned at the seam
      between code synthesis and merge eligibility. Directing the reviewer to verify
      completed check states (via `gh pr checks` and `python3 .meta/check_pr.py`)
      and submit `CHANGES_REQUESTED` when checks fail cleanly routes failures back
      to the coder's `answer the review` pass. This re-uses the existing, bounded
      review loop without creating unbudgeted automated feedback cycles.
