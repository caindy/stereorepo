decisions:
  - id: work:decision/075
    name: "DR-075 · Merging goes through the channel"
    status: ADOPTED
    applies:
      - work:article/19
    alternatives:
      - name: Let the hook allow `gh pr merge`
        chosen: false
        reason: >-
          A merge posts no text, so the hook's stated rule does not reach it.
          But the rule was the wrong description of what the channel is for:
          GitHub records who merged, and a merge performed with the solo's
          ambient credential says the solo did it.
      - name: "`say merge`, and the hook keeps blocking the raw verb"
        chosen: true
        reason: >-
          An act by a Role should be recorded as that Role's. What it costs is a
          verb in the wrapper for something that is not speech, and a hook whose
          name is now narrower than its job.
    consequences:
      - >-
        `mergedBy` on a pull request is the Role account. The first merge under
        it recorded `caindy-solorepo-coder`.
      - >-
        The hook's comment says why `merge` and `close` are blocked although
        neither posts text: they are acts, and the record should say which Role
        performed them rather than which human owns the credential.
    falsifier: >-
      Wanting to know who merged something and finding the answer is always the
      credential's owner. That would mean the channel is decorating rather than
      attributing.
    enacted_in:
      - work:artifact/meta-say
    rationale: |-
      Found by the hook refusing `gh pr merge` when the solo asked for a merge.
      The refusal was right for a reason the hook did not state: what makes a
      merge the channel's business is not that it posts text — it posts none —
      but that GitHub records an actor for it, and an act performed with ambient
      credentials is recorded as the solo's whoever actually performed it.

      **Recorded late, and the lateness is the finding.** This decision was taken
      inside #12, implemented there, and merged without an entry; the paragraph
      explaining it existed only as a code comment. That is Written Decisions
      failing in the change that made signing structural, which is precisely the
      shape of thing this repository keeps catching in itself: the rule held
      everywhere attention was pointed, and slipped where it was not.
