decisions:
  - id: work:decision/153
    name: "DR-153 · The sweep asks GitHub for the rollup fields it reads, so the gate's token gains no Actions scope"
    challenge: work:challenge/229
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-check-pr
      - work:artifact/meta-lib-check-pr-github
      - work:artifact/meta-lib-check-pr-sweep
      - work:artifact/meta-checks-probes-harness-github
      - work:artifact/meta-lib-timing-github
      - work:artifact/meta-lib-timing-screen
    context: >-
      `check_pr.py` read a pull request's check states through `gh`'s
      `--json statusCheckRollup`, at three call sites: the hand-off reader's
      briefing, the watcher's snapshot, and the sweep's one fetch of every open
      pull request. The `gh` CLI answers that JSON field with GraphQL of its
      own, which traverses `checkSuite.workflowRun` — an Actions resource. The
      gate workflow's `permissions:` block names `contents`, `pull-requests`,
      `issues` and `checks`, and GitHub's workflow-syntax reference says of
      that block: "If you specify the access for any of these permissions, all
      of those that are not specified are set to `none`." So from #156, when
      the sweep's fetch gained the field, every scheduled run died on
      `Resource not accessible by integration` before publishing a verdict, and
      every open pull request kept whatever verdict its last push had left.
      The pull request gate stayed green throughout: `check_pr.py <n>` takes a
      path that never calls `gh pr list`.
    alternatives:
      - name: "Grant `actions: read` in both gate workflows"
        chosen: false
        reason: >-
          One line in each file, and it unblocks the sweep today. But it widens
          what the gate's token may read — permanently, and in the seed every
          portfolio inherits — to satisfy a traversal no code here asks for and
          no reader here uses. A scaffold hands a fresh clone whatever scope
          its gate declares, and a scope granted to please a CLI's query plan
          is one nobody can later argue down from the code, because nothing in
          the code names it.
      - name: Ask GitHub for the rollup fields the readers actually take
        chosen: true
        reason: >-
          Every reader of the rollup takes a name and a state and nothing else:
          `resume` reads `name`/`context` and `conclusion`/`state`, `green`
          reads `conclusion`/`state`/`status`, and `snapshot` adds the run's
          url and its start time. A hand-written GraphQL query selecting those
          fields off `commits(last: 1).commit.statusCheckRollup.contexts`
          reaches no Actions resource, so the permissions block stands as it is
          in both workflows and no portfolio inherits a wider token. It is also
          the smaller dependency: the sweep stops turning on what a CLI decides
          to traverse on its behalf, which is a thing that can change under a
          pinned repository without a line of it changing here. `THREADS` was
          already written this way, so the file gains a second query and not a
          second technique.
    consequences:
      - >-
        `ROLLUP` in `.meta/check_pr.py` is the rollup's field selection, used by
        `rollup_of` for one pull request and `rollups` for every open one; no
        call site *in that file* passes `statusCheckRollup` to `gh --json` any
        more.
      - >-
        Elsewhere in the repository one call site still does, and this decision
        does not move it: the *hand back what the run did not finish* step in
        `.github/workflows/coder.yml` asks `gh pr list` for the same field
        under `github.token` and a `permissions:` block holding neither
        `actions` nor `checks`, so by this decision's own diagnosis it fails —
        and on `bash -e` that takes the step, which is the one place a run
        killed at its budget hands its Challenge back. The remedy is not this
        one repeated: `green()` here is that predicate already, and a second
        copy of `ROLLUP` in a shell heredoc is the duplication the move exists
        to end. Moving the step's `green`/`handed` read onto this file is its
        own change, and the falsifier below does not watch it — it watches a
        scheduled `gate` run, and that one dies inside a `coder` run that has
        already failed.
      - >-
        `permissions:` in `.github/workflows/gate.yml` and
        `template/.github/workflows/gate.yml` is unchanged, and stays equal
        under `gate workflows agree`.
      - >-
        A sweep whose fetch fails says so in its own voice — `x  sweep — could
        not ask GitHub ...` — and still exits 1, so a broken checker reads
        differently from the queue state the job's other findings are. A number
        `gh pr list` returned that the rollup query did not answer for is named
        the same way, rather than read as a head with no checks on it.
    falsifier: >-
      A scheduled `gate` run failing again on `Resource not accessible by
      integration`, which would mean a field in `ROLLUP` reaches a resource the
      gate's token does not hold; or a reader of the rollup wanting a field
      `ROLLUP` does not select, which would mean the selection was cut to the
      readers of one day rather than to what the rollup is for.
    rationale: |-
      The question the Challenge posed was which side of a mismatch to move:
      the token's scope up to the query, or the query down to the readers. The
      second is the better end state for a scaffold and was the more expensive
      change, and the expense is the whole of the argument for the first.

      A scaffold's gate is copied into every portfolio cloned from it, and a
      permission in it is copied with no trace of why. `actions: read` added
      here would read, in a portfolio a year from now, as a scope the gate
      needs — and the gate would not need it, because nothing the gate runs
      reads an Actions resource. The only thing that ever did was a CLI's
      convenience field, three levels below anything this repository wrote.

      Writing the query by hand costs three call sites and gains the property
      that the fetch names its own fields. `check_pr.py` already holds
      `THREADS` for exactly this reason: what GitHub is asked for is visible in
      the file that asks.
