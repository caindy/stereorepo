decisions:
  - id: work:decision/100
    name: "DR-100 · A sequence of dependent changes is a GitHub stack, linked and merged through the channel, never rebased by hand"
    status: ADOPTED
    applies:
      - work:article/18
      - work:article/19
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-hooks-signed-channel
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-probes-tools-search
      - work:artifact/meta-lib-signed-channel-tables
    alternatives:
      - name: Stack by hand, and rebase each layer after the squash beneath it
        chosen: false
        reason: >-
          What #56, #57 and #58 did. A squash is one commit whose patch is not
          any of the branch's, so every layer above conflicts with trunk the
          moment the layer below merges, and the fix is `git rebase --onto`
          with the old base's commit found by hand — once per layer, by whoever
          is present, and a stack of three cost two of them.
      - name: Fast-forward trunk instead of squashing
        chosen: false
        reason: >-
          GitHub has no fast-forward merge; its rebase merge rewrites every
          commit. A true fast-forward is a push to `main`, which the ruleset
          refuses (DR-056), and allowing it means a bypass actor — the pull
          request gate opened on the push path. It would also end the one
          subject per pull request that trunk's index is.
      - name: Rebase merges, so trunk keeps each commit
        chosen: false
        reason: >-
          New commit identities, so the layers above still conflict and still
          need the hand rebase; and the squash title, which is the `(#n)` every
          subject on trunk carries, goes with it.
      - name: GitHub's stacked pull requests, through the channel
        chosen: true
        reason: >-
          Each layer targets the one below, rulesets and checks apply to every
          layer against trunk, squash is supported, and after a layer merges
          GitHub rebases the layers above it. What it costs: the feature is a
          public preview and may change; `gh stack` is an extension installed
          per machine; the stack merge takes no subject, so trunk's label
          rests on the repository's squash-title setting rather than on the
          channel passing one; and `gh stack submit` opens pull requests
          unsigned, so it stays blocked and each layer opens with
          `say pr --base`.
    consequences:
      - >-
        `say stack <pr>...` links layers, bottom first, as the Role.
        `say merge <pr> --stack` merges every layer up to and including one,
        all or nothing, and refuses a plain merge of a layer, which GitHub's
        legacy endpoint cannot take.
      - >-
        The hook and the deny list block the extension's writing verbs; its
        views stay open. Merging remains the channel's act (DR-075).
      - >-
        PR First gains a step: a change that waits on another is a layer, and
        a stack is never built by hand on a squash-only trunk.
    falsifier: >-
      A stack merge landing on trunk under a subject that is not the pull
      request's title, or GitHub's rebase of the remaining layers conflicting
      where a hand rebase would not. Either sends the subject back into the
      channel's hands, or the stack back to `git rebase --onto`.
    rationale: |-
      Christopher: he had hoped for `--ff-only` on `main`, and the answer
      to why not is above. What he wanted from it — a sequence of changes
      that land in order without each merge breaking the next — is what
      GitHub's stacks give without giving up the squash, the ruleset or
      the subject. The `stack` field the channel reads to refuse a plain
      merge of a layer is what the pull request payload documents; the
      first stack merged here is what confirms it, and the falsifier is
      written for that.
