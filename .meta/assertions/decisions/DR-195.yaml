decisions:
  - id: work:decision/195
    name: "DR-195 · Canonize Noticed and Not Done and Concept in Ubiquitous Language with ingress search aliases"
    challenge: work:challenge/388
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/17
    enacted_in:
      - work:artifact/meta-assertions-imported-vocabulary
      - work:artifact/wiki-solorepo-noticed-and-not-done
      - work:artifact/wiki-solorepo-concept
      - work:artifact/meta-search
    context: >-
      While Article 15 of the Charter and solorepo's DR-064 established 'work
      noticed and not done' as the foundational protocol for unexecuted observations,
      the concept lacked formal assertion in imported/vocabulary.yaml and lacked an
      encyclopedic wiki page in wiki/solorepo/, falling short of 1:1 Ubiquitous
      Language parity (solorepo's DR-184, solorepo's DR-190). Concurrently,
      domain knowledge lacked an asserted atomic unit for the semantic concept
      itself, leading to confusion with physical containers ('wiki page', 'wiki entry')
      and hazardous conflation with Charter Articles ('wiki article'). Additionally,
      colloquial ingress queries such as 'leftover work' (Query 16 in the DR-103
      benchmark) missed top retrieval results because .meta/search.py did not index
      SKOS pref_label, alt_labels, and definition from LinkML Concept assertions into
      BM25F title and summary fields.
    alternatives:
      - name: Adopt Residue as the overarching concept for unfinished work and PR prose
        chosen: false
        reason: >-
          Conflates unrouted prose in a pull request body (Article 15 template) with
          unexecuted work parked on diff review threads (solorepo's DR-064), creating
          ambiguity between documentation residue and tracked Challenge residue.
      - name: Retain informal usage without vocabulary assertions or search aliases
        chosen: false
        reason: >-
          Leaves incoming agents and external search queries unable to locate
          authoritative guidance on deferred work, causing lexical retrieval misses on
          natural language software terms.
      - name: Canonize Noticed and Not Done and Concept with SKOS alt_labels and LinkML search indexing
        chosen: true
        reason: >-
          Preserves the precise terminology of Article 15 and solorepo's DR-064 while
          providing SKOS alt_labels ('leftover work', 'remainder', 'follow-up work',
          'deferred work') in imported/vocabulary.yaml; canonizes Concept as the atomic
          unit of domain meaning while subordinating physical container placement to
          Diátaxis and strictly avoiding 'wiki article'; maintains 1:1 wiki parity in
          wiki/solorepo/; and upgrades .meta/search.py to index concept pref_label,
          alt_labels, and definition with full BM25F title and summary field weighting,
          raising benchmark accuracy to 100% (18/18).
    consequences:
      - >-
        work:concept/noticed-and-not-done and work:concept/concept are canonized in
        imported/vocabulary.yaml with alt_labels and avoid terms.
      - >-
        wiki/solorepo/noticed-and-not-done.md and wiki/solorepo/concept.md are created
        adhering to MOS:LEAD, closed-world wikilinks, and container subordination.
      - >-
        .meta/search.py indexes LinkML concepts using pref_label, alt_labels, and definition
        in title and summary fields.
      - >-
        DR-103 benchmark achieves 100% hit@5 (18/18), resolving Challenge 388.
    falsifier: >-
      A search for 'leftover work' or benchmark query 16 scoring outside the top 5
      results on the search index, or an assertion of noticed and not done that uses
      'backlog' or 'technical debt' without an explicit avoidance contrast.
    rationale: |-
      In Domain-Driven Design, the Ubiquitous Language must be applied strictly
      within the bounded context while gracefully accommodating external query
      ingress. 'Work noticed and not done' is load-bearing in solorepo's Charter
      (Article 15) and PR workflow (DR-064). Canonizing it and 'Concept' with
      SKOS alt_labels enables lexical search engines to bridge natural language
      industry phrasing without polluting code contracts, and protects the Charter's
      empirical Articles from dilution.
