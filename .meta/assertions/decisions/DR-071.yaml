decisions:
  - id: work:decision/071
    name: "DR-071 · Actor is who; Agent is what"
    status: ADOPTED
    supersedes:
      - work:decision/069
    applies:
      - work:article/19
    alternatives:
      - name: One trailer carrying build and session
        chosen: false
        reason: >-
          It answers two questions in one string and gets both slightly wrong.
          The build changes at every harness upgrade, so one Actor across an
          update reads as two, while the session — the part that actually
          distinguishes — never moves and is buried behind the churn.
      - name: Two trailers, `Actor` and `Agent`
        chosen: true
        reason: >-
          They are different classes: a session is an identity, a build is a
          Component of a Bill of Materials. Separating them makes the churn
          harmless, because `Agent` is *meant* to change when the build does.
          What it costs is two lines per commit and a record carrying the old
          one-line form as history.
      - name: Configure the model into the trailer
        chosen: false
        reason: >-
          Nothing in this environment attests the model, so it would come from
          static configuration and state a falsehood the first time a session
          switched models. A missing identity is recoverable; a confidently
          wrong one is not — which is the same argument that kept the identity
          out of the caller's hands.
    consequences:
      - >-
        `Actor:` is the session alone, so `parties()` keys on the thread rather
        than on the build, and two Jobs on one harness stay distinguishable.
      - >-
        `Agent:` records `AI_AGENT` verbatim. Its format is undocumented, and
        prettifying it into a name and a version would be inventing structure
        nothing attests.
      - >-
        The model stays absent and the record says why, rather than implying it
        was overlooked.
      - >-
        The record carries two trailer formats: the hand-typed
        `claude-opus-5/<session>` from before the channel existed, the single
        attested line from DR-069, and this. History is not rewritten.
    falsifier: >-
      Wanting to ask "which model wrote this" and finding no answer. That would
      mean the model needed attesting rather than omitting, and the place to fix
      it is the harness, not the trailer.
    enacted_in:
      - work:artifact/meta-vocabulary
    rationale: |-
      Which build ran is a provenance question, and its answer belongs in
      a Bill of Materials where a Component is pinned and is *expected* to
      move. Which thread wrote this is an identity question, and its
      answer must not move at all. Carrying both in one string meant the
      identity churned every time the harness updated, for a reason that
      had nothing to do with identity.

      The model is a third question with no answer here: twenty-four
      `CLAUDE_*` variables and none of them names it. It could be
      configured, and configuration is exactly what it must not be — a
      static value becomes a lie the moment a session changes model,
      stated in the same confident form as the two attested fields beside
      it.
