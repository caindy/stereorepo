decisions:
  - id: work:decision/224
    name: "DR-224 · A promotion leaves a sole-authored thread open, and no verb closes it for the same Actor"
    challenge: work:challenge/560
    status: ADOPTED
    supersedes:
      - work:decision/127
    applies:
      - work:article/15
      - work:article/16
    enacted_in:
      - work:artifact/meta-say-post
      - work:artifact/meta-say-verbs
      - work:artifact/meta-disciplines
      - work:artifact/github-workflows-review
    context: >-
      A16 is checked by a disjunction: "a resolved thread carries a reply from
      a second party, **or** a link to the Issue it became"
      (`charter.yaml:219-221`). DR-127 chose the second limb. It gave `promote`
      the sole-author exemption so the coder could promote its own notice, and
      let the same call resolve the thread once the Issue's link was posted,
      reasoning that the link is what A16 counts as an answer, so resolving was
      "the conservative direction, the item surviving rather than being walked
      past". That is true of the filing. It is not true of the resolve, and
      A16's own falsifier says why: "a review thread only the Actor who raised
      it can resolve, so resolved says the point was met rather than that
      somebody replied" (`charter.yaml:225-227`). A notice is the coder's
      observation on the coder's diff, and `promote` at approval is the same
      Actor's call, so under DR-127's reading of the link limb the raiser's own
      verb carried the resolve. The falsifier is not that nobody else held
      `promote` — the solo holds it too, and a promotion by the solo is a
      second party — but that on the path the Discipline actually walks, the
      Actor that raised the thread is the Actor that closed it, and resolved
      therefore said the point was met when nobody had met it.
      A15's part is narrower and unchanged: it says the item is
      recorded as a link on a line rather than a sentence in a summary, which
      is what makes a notice a thread on the diff at all, and is the object
      this narrowing acts on.
      #541, "Annotate `.meta/` tooling and drain 24 files from the type
      baseline", is the instance: a notice about 22 type-soundness suppressions
      was promoted to #557, the Issue for those suppressions, and resolved by
      the same Actor that raised it, and the suppressions merged with nobody
      besides their author having looked.
      `post resolve <thread-id>` compounds it: `resolve_verb` stands aside
      whenever a thread carries a promotion link, regardless of who is on it,
      so even a `promote --no-resolve` deferral is one more call away from the
      same Actor closing it alone. So is `post answer`: the exemption is asked
      with `promotion=True` before `sole_author` is consulted, and the verb then
      calls the bare `resolve()`, so a body repeating the Issue's URL replies
      and resolves.
    alternatives:
      - name: Leave `promote`'s resolve as DR-127 left it, on the reasoning that a link is the record surviving
        chosen: false
        reason: >-
          #541 is the falsifier DR-127 did not have: the Issue existing is not
          the same claim as somebody having looked. A16's own falsifier is "a
          review thread only the Actor who raised it can resolve, so resolved
          says the point was met rather than that somebody replied"
          (`charter.yaml:225-227`), and under DR-127's reading of the link limb
          a notice is that thread — the coder raises it and the same call
          closes it. A verb that always clears its own hold makes every
          notice's merge-block decorative.
      - name: "DR-064's counter: a solo has one author per thread, so demanding a second manufactures the reply A16 exists to catch"
        chosen: false
        reason: >-
          DR-064's first consequence is the standing argument for the link
          limb, and it is numbered below DR-069 and DR-072, which DR-127 names
          as the entries whose consequence is that "the channel refuses a
          thread this Actor is the sole author of". What it rejects
          is demanding a second *party* — a second human. What is demanded here
          is a second *Job*, and DR-068 is what tells the two apart: it counts
          a thread's parties from "the logins, the Actor Trailers, and the
          resolver", and on a repository where every login is the solo's the
          Trailer is the one of the three that ever differs.
          DR-072 is why the thread is the right place to ask
          — it moved the hold off the merge and onto `say resolve`, "the more
          local place for it anyway" — and the handoff PR First already has is
          what produces the second Job.
          The reply is not manufactured, because the Job that posts it has read
          the thread it is closing; and the coder does not wait on the solo for
          it, which is what DR-127's first rejected alternative costed — "a
          resolve on every notice that earns an Issue", and the act clerical.
      - name: Refuse `promote` outright on a sole-authored thread, filing nothing
        chosen: false
        reason: >-
          The coder is the sole author of every notice it raises on its own
          diff, by construction, and DR-127's rationale for the exemption still
          holds: a rule that counts parties and always finds one refuses PR
          First's eighth step entirely. This resurrects #139 — the sole-author
          refusal refusing the coder's own notice — rather than fixing #560's
          narrower defect, and it loses the Issue as well as the look.
      - name: Leave the reply's wording as `Promoted to <url>.` whether or not the thread is closed
        chosen: false
        reason: >-
          A reply that says only where the Issue went gives no reason the
          thread stayed open, and the next reader — or the same Actor, a
          verb later — has nothing telling them the deferral was deliberate
          rather than a promotion left half done. That is DR-221's reading of
          the same reply: "the remainder is the thread, and a caller who
          cannot see that is a caller who will not finish it"
          (`.meta/assertions/decisions/DR-221.yaml:46-48`).
      - name: Name `post --role reviewer resolve <thread-id>` as the door out of the refusal
        chosen: false
        reason: >-
          It does not open. `--role` selects the GitHub credential a child
          process posts with, from a file outside the working tree
          (`channel.py:222-239`); it reads and writes neither `ACTOR_SESSION`
          nor `AI_AGENT`, which is all `trailers()` is built from
          (`channel.py:186-189`). So `post --role reviewer resolve
          <thread-id>`, typed by the session the refusal stopped, computes the
          same Trailer and is refused again. What differs is the Job, which is
          how the standing refusal already puts it — "leave it for the next
          Job, whose Trailer differs" — and a Role is not one.
      - name: Name the door that exists today — the next Job of any Role to touch the pull request — and leave `review.yml`'s prompts alone
        chosen: false
        reason: >-
          Nothing summons that Job. On a loop branch it would be
          `coder.yml`'s approval pass, which promotes and resolves in one run
          (`coder.yml:1497-1498`) and is told not to request review, so the
          run that leaves a thread open is the run that would have to close
          it, and a relabel re-delivers no review. On a session branch
          `coder.yml`'s `pull_request_review` door is gated on an
          `issue-` prefix (`coder.yml:114-117`), so an approval summons no
          coder Job at all and the next Job to touch the pull request is the
          solo's own next session. That is DR-127's first rejected
          alternative — "Leave the refusal whole, and let the solo resolve a
          promoted notice", costed as a clerical resolve on every notice that
          earns an Issue and, on #130, as "the wait turning into a stall"
          (`DR-127.yaml:16-25`) — and it is the cost this entry's own chosen
          alternative claims not to pay.
      - name: Narrow `resolve_verb` to the thread the carve-out describes, so the prompt's reader needs no judgement
        chosen: false
        reason: >-
          This is the stronger-sounding half of the choice: give the verb the
          test the prompt was claiming — the thread unresolved and its last
          comment matching `PROMOTION`, the narrow pattern `promote` already
          uses — and the discrimination really would be the channel's. It is
          refused because the verb is not the reviewer's alone. `resolve` is
          `held_by: [coder, reviewer, solo]` on the contract that a thread
          "whose answer or promotion link is already posted" resolves, and
          three places hand it out on exactly that contract, none of which can
          promise the last comment is a promotion reply: `sweep` prints "answer
          is already posted with `.meta/say/post resolve`"
          (`.meta/lib/check_pr/sweep.py:361`), `move` prints "`post resolve
          <thread-id>` where the link is already posted" (`.meta/say/move:195`),
          and DR-221's third consequence names the same act as what finishes a
          filing its own guard refused, "`post resolve` where the link is
          already posted"
          (`.meta/assertions/decisions/DR-221.yaml:81-86`). A test admitting
          only that reply refuses the first two outright and leaves the third
          turning on whether anyone has spoken since.
      - name: Close every door — `promote` leaves a sole-authored thread open, `post resolve` refuses the same Actor even where a promotion link is present, and `post answer` replies without resolving — and name the second Job as the way out
        chosen: true
        reason: >-
          Nothing is lost when the deferral is sound: the Issue is filed and
          the link posted exactly as DR-127 has it, and the merge waits for a
          second Job to agree it was. `sole_author`, already
          `refuse_if_sole_author`'s predicate, is what all three verbs ask, so
          the same rule that decides whether a reply would change anything also
          decides whether a resolve would. All three, rather than `promote`
          alone, because the falsifier is "by any sequence of these verbs": one
          door shut and another open is a hold that reads as installed and is
          not. The way out is a resolve run from a second Job, ordinarily the
          reviewer's own run, and what summons one is the handoff PR First's
          fifteenth step already defines — `move request-review`, which
          `review.yml` fires on `review_requested`, arriving with its own
          `ACTOR_SESSION` and holding `resolve`. Holding the verb is not
          enough: that Job's prompt said "Do not resolve any thread", so the
          door is not open until `review.yml` says this one thread is the
          arriving run's to close, which is why the workflow moves with the
          channel here and is named in `enacted_in`. The cost is that
          `--no-resolve`'s deferred self-resolve, as `promote`'s own docstring
          described it, now works only for a thread that already carries a
          second voice; a sole-authored one was never the case that flag meant.
    consequences:
      - >-
        `promote` checks `sole_author(bodies)` after filing and replying. Where
        it holds, `promote` stops there — no `resolve()`, whatever
        `resolve_thread` and so `--no-resolve` asked for — and the reply it
        posts names why: the thread has had one voice, and a resolve from a
        second Job closes it. Where it does not hold, `promote` resolves
        exactly as DR-127 left it.
      - >-
        `resolve_verb`, `post resolve`'s dispatch, refuses where the calling
        Actor is the thread's sole author by the same `sole_author` predicate,
        even where the thread already carries a promotion link. A thread with a
        second party — a reviewer's own comment, or a resolve run under a
        second Job's Trailer — resolves as before.
      - >-
        `answer` replies and then stops where `sole_author` holds on the bodies
        it read before posting, rather than resolving. DR-127's `promotion`
        stand-aside is unchanged and still the reason the reply goes out at
        all: what it stands aside from is the whole refusal, the reply
        included, and what this entry withholds from a sole-authored thread is
        the resolve alone, so the Issue's link still reaches the thread that
        earned it. That reply carries `left_open`'s sentence behind the
        caller's words and in front of the Trailer, the same sentence
        `promote` writes: the consequence below has the arriving reviewer tell
        the thread it must close by a string, so a second door leaving a
        thread open in different words leaves one nobody closes, and a marker
        appended after the Trailer would make the reply read as a second
        party's to `sole_author`.
      - >-
        Every refusal and every reply names the door as a resolve from a second
        Job and not as a Role, and says what summons one: `move
        request-review`, PR First's fifteenth step, whose `review_requested`
        event is what `review.yml` runs on. PR First's ninth step says the same
        thing where it says a promoted thread is resolved with a link.
      - >-
        `review.yml`'s two reviewer prompts carve this one thread out of "Do
        not resolve any thread": an unresolved thread whose last comment
        carries an Issue's URL and the words `Left open:` — `promote`'s
        `Promoted to <url>. Left open: ...`, or `answer`'s reply with the same
        sentence behind the coder's words — is the arriving run's
        to close with `post --role reviewer resolve <thread-id>`, before its
        verdict and naming what it closed. Without the carve-out the door the
        consequence above names summons a Job that holds the verb and is
        forbidden to type it, and the "zero unresolved threads" semaphore the
        merge manager computes never clears. Telling that thread from the rest
        is the reviewer's own judgement, and the prompts say so rather than
        promising a net: `resolve_verb` refuses a thread every comment of which
        carries the caller's Trailer, and one with neither a second party nor a
        promotion link, and permits everything else — so it would not stop a run
        that resolved a live point it had misread as promoted. What the reviewer
        does with every other thread is the prompt's next sentence, which is
        unchanged: answer it or raise a new one, and leave it open.
      - >-
        DR-127's chosen alternative named as its cost that "the coder can now
        close its own thread when it files an Issue for it"
        (`DR-127.yaml:48-51`); that cost narrows here to a thread already
        carrying a second voice. Its third consequence — that DR-072's sentence
        about a parked item is "false where a link is present"
        (`DR-127.yaml:80-82`) — is the guarantee this entry puts back. DR-127's
        filing and reply consequences are unchanged; only the resolve half of
        what it called conservative is superseded.
      - >-
        `.meta/checks/probes/channel/filing.py` covers each shape: a
        sole-authored thread promoted, filed and replied with the thread left
        open; `post resolve` refusing that thread under the same Trailer with
        the promotion link on it, which is the case the old code resolved;
        `post answer` with the Issue's link replying and not resolving; and a
        thread carrying a second voice promoted, answered and resolved, which
        is the shape DR-127 left untouched — "what those entries put on the
        thread is unchanged for every other reply" (`DR-127.yaml:76-78`),
        those entries being DR-069's and DR-072's. Both replies that leave a thread open are read for the
        words `Left open` and for the Trailer coming last, and the answer on a
        second-voice thread for those words' absence, so neither the marker
        the arriving reviewer matches on nor the ordering `sole_author` reads
        can be lost without a probe failing.
    falsifier: >-
      A sole-authored notice — raised, promoted and resolved under one
      Actor's Trailer, by any sequence of these verbs — with no comment or
      resolve from a second party anywhere on the thread.
    rationale: |-
      DR-127 answered "who may promote", and answered it right: the coder
      raises its own notices, so a rule that refuses an act for want of a
      second party can never be satisfied by the Role PR First gives the
      act to, and the fix was to say what an answer is rather than who may
      give one.

      #560 is a different question sitting under the same code: not who may
      promote, but who may clear the hold that promotion's resolve lifts.
      A16 offers two ways to answer a thread, and DR-127 took the link. Read
      as this change reads it, the link says the item survived and the second
      party says somebody looked, and only one of those is what a notice's
      merge-block is for — which is why A16's falsifier names the thread only
      its raiser can resolve. DR-127 let one call satisfy the whole
      disjunction, which was sound wherever the thread already had two voices
      and silent where it had one: every notice, since a notice is the coder's
      own observation on the coder's own diff.

      The fix is narrow because the predicate already existed:
      `refuse_if_sole_author`'s `sole_author` reads the Trailer, and a Trailer
      is exactly what tells "the coder promoted its own notice" from "a later
      Job resolved what the coder raised" apart. DR-068 counts a thread's
      parties from three things — "the logins, the Actor Trailers, and the
      resolver" — and on a repository where every login is the solo's the
      Trailer is the one of the three that ever differs. Asking it once more at
      every point where the hold is actually lifted is what makes the hold
      hold.
