decisions:
  - id: work:decision/158
    name: "DR-158 · A read-back of an act GitHub has taken waits for GitHub to show it, and the head moving is what the rebase's read-back waits for"
    challenge: work:challenge/245
    status: ADOPTED
    applies:
      - work:article/6
    enacted_in:
      - work:artifact/meta-lib-move-advance
      - work:artifact/meta-checks-probes-harness
      - work:artifact/meta-checks-probes-loops
      - work:artifact/meta-checks-probes-loops-advance
      - work:artifact/meta-checks-probes-harness-github
    context: >-
      `advance` reads back what GitHub holds after it rebases a branch, which
      is the property that makes it more than a call: whether the head is
      current now, and whether moving it dropped the arming this run exists to
      keep. Both reads followed `gh pr update-branch --rebase` at once, and
      that call returns when GitHub has *taken* the rebase. Measured on runs
      34593386083 and 34594139086: the heads were rewritten one to two seconds
      after the call, and the `pr view` half a second later still named the
      commit the branch had before. `behind_by` then compared that old commit
      against the base and answered, truthfully, the count it had before the
      rebase — the right answer to the wrong question. Every `advance` on
      2026-09-11 concluded failure this way, eight of eight, while doing its
      work correctly each time. The same stale view carries `autoMergeRequest`,
      so the second read saw the arming the old head still held and skipped the
      re-arming, which is the repair the whole verb is for (#93). The file
      already held the shape of the answer: `mergeability` polls rather than
      reading once, because GitHub computes that value in the background and
      the first read after the act that invalidated it is not an answer.
    alternatives:
      - name: Poll `behind_by` until it answers zero
        chosen: false
        reason: >-
          The nearest reading of the Challenge, and it fixes the false report.
          But it waits on a derived number rather than on the act, so it cannot
          tell a rebase GitHub has not performed from one it performed onto a
          base that moved again — and it pays a `compare` per try to learn
          something a `pr view` already says. It also leaves the arming read
          racing on its own: the arming goes stale with the head, and a wait
          keyed on the count would let the arming read fire the moment the
          count settled for a reason unrelated to it.
      - name: Drop the read-back and let the next sweep catch a branch still behind
        chosen: false
        reason: >-
          Defensible for the "still behind" line alone — `advance.yml` runs on
          every push to trunk and would rebase the branch again. It is not
          defensible for the arming, which is the read that cannot wait: if the
          rebase lands after the run ends and drops the arming, no later sweep
          sees the pull request at all, because the sweep filters on
          `autoMergeRequest` and there is no longer one to filter on. That is
          #93 in the place built to prevent it.
      - name: Wait for the head to move, then ask both questions of what GitHub then holds
        chosen: true
        reason: >-
          The head moving off the commit it was on *is* the rebase landing, so
          it is the act's own completion rather than a proxy for it, and one
          `pr view` answers it. Waited for and not assumed: `settled` reads,
          and re-reads until the predicate holds, bounded by `SETTLES`, so an
          act GitHub has already shown costs one question and no sleep. Both
          read-backs then run against a pull request GitHub has finished
          moving, which is the state each was written to ask about, and the
          arming read needs no wait of its own. A head that has not moved when
          the bound runs out is reported as itself, because it is a different
          fact from a branch that is behind: the rebase may still land, and
          drop the arming as it does.
    consequences:
      - >-
        `SETTLES` and `settled` in `.meta/say/move` are the wait, beside
        `MERGEABILITY` and `mergeability` and distinct from them: that pair
        waits on a value GitHub computes when asked, this one on work GitHub
        queues and performs.
      - >-
        `advance` reports three outcomes where it reported two — advanced; the
        head GitHub has not moved within the wait; the head moved and the
        branch is still behind its base — and the third keeps the wording the
        sweep's readers already know.
      - >-
        The read-back after the re-arming waits the same way. Unlike the
        rebase's it rests on no measurement: `gh pr merge --auto` is a mutation
        and nothing here has caught GitHub lagging it. It is waited on because
        the cost is asymmetric — a wait costs nothing on a branch GitHub shows
        armed, and its whole cost falls on the branch this is about to report
        as broken, while an early read would produce the false report's mirror,
        a pull request GitHub is holding armed called unarmed. `merge`'s own
        read-back after `arm` stops at a single read because it runs in the
        coder's foreground session where checks are known and a failure halts
        the landing, whereas `advance` runs unattended sweeps where an unarmed
        branch is permanently lost to subsequent passes.
      - >-
        `FakeGitHub` in `.meta/checks/probes.py` holds a head commit and moves it
        when a rebase lands, and `slow` is how many reads answer with what the
        pull request was before an act GitHub has taken. Two probes ride on it:
        a rebase GitHub has not shown yet, which must be neither reported nor
        allowed to hide the dropped arming; and a head GitHub never moves,
        which must be reported as itself.
    falsifier: >-
      An `advance` run reporting a branch behind or unarmed that GitHub is
      holding current and armed — which would mean the head moving is not the
      last thing GitHub does when it rebases, and the wait is keyed on the
      wrong fact. Or a sweep held up long enough to matter by branches GitHub
      is slow to move, which would mean the bound belongs on the sweep rather
      than on each pull request in it.
    rationale: |-
      The Challenge asked for a wait and pointed at `mergeability` as its
      shape. The shape transferred; the thing waited on did not. `mergeability`
      waits on a value GitHub computes when it is asked, and the only honest
      signal that the computation is done is the value ceasing to say
      `UNKNOWN`. A rebase is not computed, it is performed, and it has a
      visible completion — the head is on a different commit. Waiting on that
      rather than on the derived count is what lets the two failures stay two
      lines.

      The Challenge also asked whether the arming read-back twenty lines below
      was racy for the same reason. It was, and not for the reason offered:
      the race was never in `gh pr merge --auto`, it was in `after`, which
      carried an arming read off a head GitHub had not moved. Waiting for the
      head repairs it without a second wait. The wait that remains on the
      re-arming read is insurance rather than a fix, and it is recorded as
      such above: nobody here has measured GitHub lagging that mutation, and
      the reference that would settle it was not reachable from the run that
      took this Challenge.
