decisions:
  - id: work:decision/013
    name: "DR-013 · Specialization is an instruction, not a build step"
    status: ADOPTED
    alternatives:
      - name: "A program to invoke"
        chosen: false
        reason: "It needs a toolchain, which is exactly what is unavailable when the repo is picked up in an arbitrary thread."
      - name: "A written procedure an agent follows"
        chosen: true
        reason: "Specializing is judgement about one product, made once. An agent following a written procedure beats a program, and needs nothing installed."
    enacted_in:
      - work:artifact/specialize
    rationale: |-
      Turning a clone into a product repo is judgement about one product, made once, so
      an agent following a written procedure beats a program to invoke — and it needs no
      toolchain, which matters when the repo is picked up in an arbitrary thread. The
      term was already in the repo from DR-001 and was reused rather than replaced;
      its spelling is normalised to **Specialization**.
