decisions:
  - id: work:decision/273
    name: "DR-273 · A plan passes two gates, on a draft that nothing lifts while it changes no file"
    challenge: work:challenge/879
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/22
    enacted_in:
      - work:artifact/agents
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-disciplines
      - work:artifact/meta-say-verbs
      - work:artifact/meta-say-move
      - work:artifact/meta-lib-move-cli
      - work:artifact/meta-lib-move-pull-requests
      - work:artifact/meta-lib-move-manager
      - work:artifact/meta-lib-move-drafts
      - work:artifact/meta-lib-check-pr-github
      - work:artifact/meta-lib-check-pr-polling
      - work:artifact/meta-lib-check-pr-review
      - work:artifact/meta-lib-check-pr-sweep
      - work:artifact/meta-checks-probes-loops-merge-manager
      - work:artifact/meta-checks-probes-loops-drafts
    context: >-
      Solorepo's DR-249 says that on a `hard` or `human` Challenge the plan is
      validated with the solo before code, and solorepo's DR-269 opens the pull
      request that carries the plan on an empty Seed Commit. Neither says what
      the reviewer's check of that plan is, and read alone they make the solo's
      approval sound like the whole gate. The solo's intent is otherwise: the
      solo approves the plan in session and always wants the reviewer's second
      opinion on the pull request before code.


      Three things stood in the way of that second gate, all seen on solorepo's
      #877 and #878. A review thread sits on a line of the diff, and a plan-only
      pull request has none, so the reviewer's objection on #878 was a top-level
      comment; `check_pr` read `reviewThreads` alone, so `just pr 878 --threads`
      printed `nothing unaddressed` beside a request for changes. On #877 the
      reviewer withheld approval of a plan because the approval is what the merge
      manager merges on, and it would have landed the empty commit and closed the
      Challenge with nothing done. And a draft, which the merge manager, `advance`
      and the reconciler all pass over, could not be opened through the channel,
      had no signed way out for a session's branch (solorepo's #852), and was
      taken out of draft by `request-review` and by the merge manager on any
      branch shaped like a loop's, whatever it held.
    alternatives:
      - name: The reviewer approves a plan with a comment verdict rather than an approval
        chosen: false
        reason: >-
          It needs no draft, and it keeps the merge manager from merging on the
          plan's approval. It keeps nothing else off the branch: `advance` and
          the reconciler still act on a pull request that is not a draft, and
          #878 closed with no commits on it while its plan was under review.
          It also rests the gate on every reviewer run choosing the right
          verdict, where the draft rests it on the pull request's state.
      - name: Document that request-review undrafts a loop-shaped branch, and leave the naming convention to prevent it
        chosen: false
        reason: >-
          PR First's *Read what GitHub holds on arrival* step tells a session never to begin a branch slug with
          `issue-`, and nothing enforces it. A gate that one mistyped branch
          name voids silently is not a gate.
      - name: Stop classify_pr answering DRAFT before everything else
        chosen: false
        reason: >-
          It would let `watch` see a verdict on a draft, but `classify_pr` is
          shared, and every caller would change what a draft classifies as to
          fix one reader. Reading a draft as a non-draft inside `watch` alone
          fixes the watcher and changes no other caller.
      - name: Two gates, a draft plan-only pull request, one rule for leaving draft, and reviewer comments read as threads
        chosen: true
        reason: >-
          The two gates are what the solo intends and say so in the Discipline.
          The draft keeps all three loops off the plan, whichever verdict the
          reviewer gives. One check, that the branch changes a file against its
          base, stands before every way out of draft, so the gate rests on the
          pull request's contents and not on its branch name. Reading the
          reviewer's top-level comments as threads puts an objection to a plan
          where the owed-answer machinery already looks, so `--threads` and
          `watch` report it without a second path. `sweep` does not yet:
          solorepo's #914 gives the reconciler that reader.
    consequences:
      - >-
        PR First's *Open it when the work starts* step states the two gates: the solo's approval in session,
        which permits the coder to proceed under PR First and skips no step of
        it, and then the reviewer's approval of the plan on the pull request.
        A plan that changes materially in answer to the review returns to the
        solo before code.
      - >-
        `move open --draft` opens the plan-only pull request as a draft, and
        `move ready` takes a draft out of draft through the channel, which is
        the verb solorepo's #852 asked for.
      - >-
        `holds_changes` in `.meta/lib/move/drafts.py` is the one check
        before every way out of draft: `move ready` refuses, and `request-review`
        and the merge manager's restoration skip, a pull request whose branch
        changes no file against its base, whatever the branch is named.
      - >-
        `check_pr` reads the reviewer's top-level comments on a pull request as
        threads, owed until a later comment from an account other than the
        reviewer's links the one it answers, and PR First's *Answer every thread and resolve it* step says to answer
        one with `post comment` linking it. They are printed as comments to
        answer, not threads to resolve, and `sweep` leaves them out of the
        conversations that stop GitHub merging. `sweep` does not report one as
        owed; solorepo's #914 is that reader.
      - >-
        `watch` classifies a draft as if it were not one, so a verdict, an owed
        comment or a conflict on a plan-only pull request wakes it, on a
        restart as well as mid-watch, and an approved draft is reported as a
        plan approved, not as ready to merge.
      - >-
        Challenges solorepo's #879 and solorepo's #852 are closed as answered.
    falsifier: >-
      A plan-only pull request taken out of draft, or merged, while its branch
      changes no file against its base; or a reviewer's top-level comment on a
      pull request that `just pr <n> --threads` does not report as owed before
      a later comment from an account other than the reviewer's links it.
    rationale: |-
      The plan is the cheapest place to reject an unsound architecture, and the
      reviewer's pass is how that rejection happens without the solo reading
      every plan twice. A gate is only as good as what holds it, so this one is
      held by the pull request's draft state, which every loop already reads,
      and by a check on the branch's contents, which no branch name can get
      round. An objection the watcher cannot see is an objection answered when
      someone happens to look, which is what solorepo's DR-248 exists to prevent.
