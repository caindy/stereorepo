decisions:
  - id: work:decision/249
    name: "DR-249 · Settle the approach before code on hard and human Challenges, with diff review for easy and medium"
    challenge: work:challenge/593
    status: ADOPTED
    applies:
      - work:article/8
      - work:article/22
    enacted_in:
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-disciplines
      - work:artifact/meta-templates-pull-request
    context: >-
      Solorepo's DR-230 put a reviewer reader in front of every Challenge at intake,
      with its verdict landing the difficulty label, but explicitly left open
      whether a reviewer verdict on a pull request's opening body before code was
      worth its own seam (`.meta/assertions/decisions/DR-230.yaml:57-66`). What
      crystallizes once a coder looks at the code is the approach rather than the
      Challenge: the architecture, data structures, and subsystem interactions
      chosen to implement the requested behavior.

      Without settling the approach before code, a coder agent can enact an unsound
      plan into a green diff. When the reviewer Role arrives at a completed diff, its
      interrogation naturally defaults to verifying whether the code compiles, passes
      tests, satisfies lints, and formats docstrings within the author's chosen
      approach, rather than stepping back to evaluate whether the architecture is
      sound. The resulting review raises line-level points on a broken foundation, and
      the coder answers with localized workarounds—leading to hack-upon-hack propping
      up an unviable design and a multi-hour cycle of PR updates and re-reviews.
    alternatives:
      - name: Universal reviewer verdict on every opening pull request body
        chosen: false
        reason: >-
          Imposing an obligatory reviewer verdict on every opening pull request body
          before any code is written introduces prohibitive platform and latency
          penalties across the entire repository. GitHub's REST API for opening pull
          requests (`POST /repos/{owner}/{repo}/pulls`) returns HTTP 422 Unprocessable
          Entity with `"No commits between <base> and <head>"` if base and head are
          identical, and its pull request review API (`POST /repos/{owner}/{repo}/pulls/{pull_number}/reviews`)
          anchors comments to commits and diff coordinates (`commit_id`, `path`, `line`).
          As recorded in the unchosen alternative of solorepo's DR-230, "a verdict
          on a pull request with no diff needs a shape GitHub's review does not have"
          (`.meta/assertions/decisions/DR-230.yaml:57-66`), leaving the seam unresolved. In addition, running a
          reviewer pass in Actions holds a runner for 11 to 15 minutes on initial
          review (solorepo's #303) up to a 50-minute timeout (`.github/workflows/review.yml:61`);
          dispatching a pre-code review pass and a second pass on the completed diff
          would double reviewer workload and serialize every change into a multi-hour
          pipeline. For easy and medium Challenges, problem spaces are bounded and
          mechanical, and diff review of the completed diff provides sufficient
          protection without stalling routine throughput.
      - name: Rely solely on diff review across all difficulty levels
        chosen: false
        reason: >-
          Leaves hard and human Challenges vulnerable during diff review. When an agent
          enacts an unsound plan on an architecturally complex or decision-dependent
          Challenge, the reviewer attempts to repair the implementation through
          incremental review threads rather than rejecting the approach at the root.
          The coder spends successive passes adding patches, consuming hours of
          runner minutes and human attention to prop up a design that should have
          been redirected before the first commit.
      - name: Settle the approach before code on hard and human Challenges, with diff review for easy and medium
        chosen: true
        reason: >-
          Maps approach validation onto who answers the Challenge under solorepo's DR-226.
          Routine, bounded changes (`easy` and `medium`) decline a pre-code review gate;
          the opening body states the intended shape and review on the completed diff
          catches defects without adding latency. For complex, architectural, or
          decision-dependent work (`hard` and `human`), formulating the plan under
          **The plan.** and validating it with the solo before writing code is the bound.
          Because `hard` and `human` Challenges are reserved under DR-226 for the solo
          (either in a paired session beside him or as a direct maintainer decision),
          plan validation occurs directly with the solo and is recorded under **The plan.**
          in the pull request body, providing durable, observable state on GitHub (Article 22)
          and preventing flawed architectures from being enacted into code. In all reviews,
          the reviewer Role interrogates whether the approach is the right one first,
          rejecting unsound architectures at the root rather than litigating line-by-line
          patches on an unviable premise.
    consequences:
      - >-
        PR First's opening step now specifies that while easy and medium pull
        requests document intent in the opening body and rely on diff review, hard
        and human Challenges require formulating the plan under **The plan.** and
        validating it with the solo before code is written (solorepo's DR-249).
      - >-
        PR First's judgement and the reviewer Role's reading instruct the reviewer
        to evaluate whether the approach is the right one first on any pull request.
        If the fundamental architecture is flawed, the reviewer rejects the approach
        at the root rather than litigating line-by-line patches on an unsound
        foundation.
      - >-
        The pull request form in `.meta/templates/pull-request.md` includes **The plan.**
        as a required heading, satisfying Article 8 and Article 22 by creating durable,
        observable state on GitHub that `check_pr.py` enforces.
      - >-
        Autonomous loops taking easy and medium Challenges under coder.yml continue
        to branch, open pull requests, and implement code without pausing for a
        pre-code reviewer gate, avoiding runner double-dispatch latency.
      - >-
        Challenge #593 is closed as answered.
    falsifier: >-
      A hard or human pull request whose opening body omits the validated plan
      under **The plan.**, or an easy or medium pull request blocked waiting on a
      pre-code review pass. Equally, a review on a flawed architecture that litigates
      line-by-line patches rather than rejecting the approach at the root.
    rationale: |-
      Christopher, on settling Issue #593: Not every PR needs a plan nor a
      review thereof, but if it is hard or human, I believe it does. For easy
      and medium, I think the post-facto review is sufficient. What we are
      trying to mitigate is a bad plan being enacted where the reviewer never
      considers if this was the right approach at all, resulting in hack after
      hack in order to prop up a bad architecture and a multi-hour
      PR-update-then-review loop.

      The Decision separates the two cases where the risks differ. Trivial and
      mechanical fixes pay no latency toll at the start; architectural work pays
      a conversation before it pays a diff.
