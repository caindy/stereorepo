decisions:
  - id: work:decision/066
    name: "DR-066 · Two machine users, with distinct Roles, and the handoff is a review request"
    status: ADOPTED
    applies:
      - work:article/16
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-assertions-authority
      - work:artifact/meta-disciplines
    alternatives:
      - name: Keep acting as the solo
        chosen: false
        reason: >-
          Every Permission is then honoured rather than enforced, and every
          comment resolves to one login — so A16 cannot tell an argument from a
          monologue without a Trailer the writer chose to add.
      - name: A GitHub App
        chosen: false
        reason: >-
          Fine-grained permissions, short-lived tokens, no seat consumed. But one
          App is one identity, so several Roles means several Apps, which is
          heavy setup for a repository with one human in it. Machine accounts are
          explicitly sanctioned by GitHub's terms and are ordinary logins
          everywhere they appear.
      - name: A handoff note, as a comment on the pull request
        chosen: false
        reason: >-
          Tried and removed. It returns the seam to natural language where what
          is needed is a discrete signal, and every one of its four headings was
          answerable elsewhere: two restated what GitHub holds, one presumed
          knowledge outside the departing Job's Agency, and one duplicated the
          pull request body's second heading.
      - name: Two machine users, an implementer and a reviewer
        chosen: true
        reason: >-
          Two, because a boundary needs two sides and one account proves nothing.
          Not three: merging is the solo's authorisation moment, not a Role. What
          it costs is credential sprawl — an account, a token and a recovery path
          each — and the boundary is only as real as the separation of the
          tokens.
    consequences:
      - >-
        Permission gains an enforcement point outside this repository. An account
        that cannot push is a Remit GitHub holds rather than one an agent was
        asked to respect, and the token handed to a container is the binding.
      - >-
        A16 becomes structural: two parties in a thread is two logins, not a
        Trailer someone remembered to write.
      - >-
        An AuditRecord's actor becomes what GitHub observed rather than what the
        agent claimed, which gives DR-004's delegation link a real end.
      - >-
        DR-056's loose end should resolve: `require_extra_approval_for_unattributed_changes`
        is inert only while commits carry an address that is not a GitHub account.
      - >-
        The Trailer is not obviated. One Role account serves many Jobs, so the
        account says which Role and the Trailer says which Actor within it.
      - >-
        Creating the accounts is the solo's, not an agent's, which is why this is
        RECOMMENDED and not in force.
      - >-
        **The handoff becomes a review request**, which is what an account makes
        possible. It names a successor, it is a state GitHub holds and reports,
        and an arriving Job finds its work by asking what has been requested of
        it. `.meta/templates/handoff.md` is deleted and DR-063's note is
        superseded.
      - >-
        Until the accounts exist a handoff has no signal at all, and the
        Discipline says so rather than keeping a note that pretends to be one.
        A18 and the green gate still hold in the interim.
    falsifier: >-
      Both tokens living in the same place. The boundary would then exist only in
      the story, and the accounts would be costume rather than Permission.
    rationale: |-
      A Remit's Permissions are asserted in YAML and enforced by nothing:
      an agent holds the solo's full rights and behaves because it was
      told to. That is the gap between `Permission = Capability on a
      Securable` as a model and as a fact, and an account is the first
      enforcement point that is not this repository's own good intentions.

      Two questions remain open, and the second decides whether any of it
      is real. Whether the reviewing agent gets an account or stays
      Copilot, which settles whether Roles are a general mechanism here or
      only the seam between the solo and one agent. And where the tokens
      live — two tokens in one `~/.config/gh` is a single Remit wearing
      two names.

      More Roles when the SDLC lands in earnest. Naming them now would be
      inventing a Role before there is work for it.
