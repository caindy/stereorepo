decisions:
  - id: work:decision/149
    name: "DR-149 · An armed pull request a merge left conflicting is dispatched to the coder like a requested one, and the rebase pass restores the arming its own push drops"
    challenge: work:challenge/213
    status: ADOPTED
    supersedes:
      - work:decision/133
    applies:
      - work:article/18
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/meta-say-verbs
      - work:artifact/meta-check
      - work:artifact/meta-check-pr
      - work:artifact/github-workflows-coder
    context: >-
      DR-133 split what a merge on `main` does to an open pull request into two
      states and gave each its act: behind is mechanical, so `advance` rebases
      the armed; conflicting with a review request outstanding is authoring, so
      the coder is dispatched. Armed *and* conflicting falls between them and
      gets neither. GitHub refuses `update-branch` on a `CONFLICTING` branch, so
      the rebase half is a refusal `advance` collects and exits on, and
      `dispatch()` filters on a review request outstanding, which an armed pull
      request has already had answered. On 2026-09-11 #201, approved and armed,
      conflicted when #194 merged; `advance` runs 43 and 44 both ended `#201:
      gh: X Cannot update PR branch due to conflicts`, and every later push to
      `main` would have ended the same way. Nothing named the state either.
      DR-129's sweep has two readings and #201 answered to neither: it reads a
      review request pending on a conflicting branch, and #201 had no request
      pending, the review having been answered by the arming; and it reads a
      green pull request nobody holds, whose reader skips anything armed by
      name, arming being one of the four ways somebody does hold one. So the
      only sign was a red `advance.yml`, whose red was for the refusal.
    alternatives:
      - name: Leave it to the sweep and the solo
        chosen: false
        reason: >-
          The state the Challenge was raised from, and it is worse than the
          Challenge said: the sweep does not name this one at all, so what is
          being left to the solo is a pull request with no line anywhere. It
          also leaves `advance.yml` red on every merge while the branch
          conflicts, which is worse than slow —
          `advance` reports by exiting non-zero with every refusal it
          collected, so a run that is red for a known conflict is a run whose
          red says nothing, and the next refusal that matters arrives into a
          workflow already the wrong colour.
      - name: Stop `advance` exiting on the refusal, and change nothing else
        chosen: false
        reason: >-
          Half of this, and the half with no value in it. It buys back the
          signal on `advance.yml` — worth having, and kept below — while
          leaving the pull request exactly where it was: armed, conflicting,
          and waiting on a person. Taken alone it is strictly worse than
          leaving it, because the one thing that made the state visible
          without the sweep would be gone.
      - name: Dispatch for every conflicting pull request on a loop's branch
        chosen: false
        reason: >-
          The filter without the "waiting on something" half, and it reaches
          the one branch that must not be touched: the one a Job is still
          standing on. A run that has not yet requested review or armed holds
          its branch, and a dispatched pass force-pushes under it. DR-133 does
          not give that danger as its reason — what it writes down for a
          request only is that "A pull request nobody has asked to review is
          waiting on nothing" — but it keeps the two apart wherever they meet
          the code, its second reading a request only and its rebase pass
          "armed and nothing else". What carries over is not the sentence but
          the reason under it, and a branch nobody is standing on is what an
          arming says as plainly as a request. What is being read is not "is this
          conflicting" but "has this been handed over", and a pull request
          that has been asked for neither a review nor a landing has not.
      - name: Dispatch for the armed too, and have the pass leave the arming dropped
        chosen: false
        reason: >-
          The cheapest change, and it manufactures #93 on the branch it is
          repairing. GitHub drops auto-merge on some pushes to a head branch —
          which is why `advance` reads the arming back after its own rebase —
          and `advance` sweeps armed pull requests only, so one the pass
          disarmed is out of the reach of every later push to `main`. The
          reviewer's verdict would then have to be given again for a change
          nobody disagreed with.
      - name: Dispatch for the armed, and have the pass request review again rather than re-arm
        chosen: false
        reason: >-
          The honest objection to re-arming, stated as an act: the diff that
          merges is not the diff the reviewer approved, because a conflict
          resolution is authoring and this one is a model's. It is refused for
          what it costs against what it buys. The reviewer's verdict is about
          the change the pull request makes, which the pass is bound not to
          alter — what landed under it is not its to undo and its own change is
          not to be dropped — and the gate reads the result before the push.
          Against that, a second review per conflict on an evening with several
          open is this entry's reason and not DR-133's. What DR-133 bounds is
          the coder run — "coder minutes only where there is a conflict to
          resolve" — and where it does count a review it counts one cancelled
          and restarted rather than one given twice: "every review would be
          restarted by the next merge and none would finish". The reviewer
          arming again is the only outcome a second request can reasonably
          reach. The trace is the comment the pass already posts, which says
          the head moved and why.
      - name: The push to trunk dispatches the coder for an armed conflicting pull request too
        chosen: true
        reason: >-
          DR-133's reasoning about the requested case is about the *conflict*
          and not about the request: a conflict is the change made again over
          what landed, which is authoring, so what moves is a Job and not a
          branch. That holds identically for an armed one — more plainly, since
          an armed pull request has had its review and is waiting on nothing
          but the merge. What kept the filter narrow was the three things the
          wider filter of DR-133 would have broken, and each is answered here
          rather than inherited: the ones that merely fell behind are excluded
          by `CONFLICTING`, as they already were; the lower layer of a stack is
          excluded by name, as DR-133's own second reading already excludes it;
          and a Challenge the loop does not hold is excluded by the read DR-142
          added. So the filter becomes "asked for something — a review or a
          landing — and conflicting, on a loop's branch, not a stack's lower
          layer, and a Challenge the loop holds", and the pass restores the
          arming if its push drops it.
    consequences:
      - >-
        `dispatch()` in `.meta/say/move` takes a pull request whose review
        request is outstanding **or** whose merge is armed. Everything else
        about the reading is unchanged, and the line it prints says which of
        the two the pull request was waiting on, because that is what the
        dispatch is repairing.
      - >-
        On the sweep, `advance`'s rebase pass no longer asks GitHub to update a
        branch that conflicts. The refusal was a certainty rather than
        information, and `dispatch` below is now the remedy for exactly that
        state; the branch is named in the log on the way past, as left to the
        dispatch rather than to the coder, because whether there is a coder is
        the dispatch's to decide and it declines for reasons of its own. A
        named `advance <pr>` and `merge --auto`'s call keep the refusal,
        because no dispatch runs behind them — there the refusal is the answer
        to whoever asked.
      - >-
        `mergeability` settles its answer onto the pull request it was asked
        about, so the sweep's two readings of one branch cost one question. It
        is the same object in both: `found` is filtered out of `open_now`, not
        copied.
      - >-
        `coder.yml`'s rebase pass asks GitHub whether it holds the pull request
        armed before its force-push and again after, and arms it again through
        `.meta/say/move merge <n> --auto` where the push dropped it. It never
        arms one that was not armed: the arming is the verdict of whoever holds
        it (DR-112), and a rebase is not a verdict.
      - >-
        The before-reading is instructed before the push in the prompt's own
        order, because a pass that executes the paragraphs as they are given
        has already pushed by the time it reads a paragraph below the push, and
        `autoMergeRequest` carries no history — so the fact would have to be
        guessed, and both guesses are harmful: one leaves the arming dropped,
        which is #93 reached by the pass that exists to prevent it, and the
        other arms a pull request whose review is still outstanding, which is
        the coder giving the reviewer's verdict.
      - >-
        `merge --auto` is not arming-only, so the prompt reads the outcome of
        the re-arming off GitHub rather than off the verb. Where GitHub refuses
        to arm a branch it could merge now — "Pull request is in clean status"
        — the verb falls through to a plain merge, which is the arming being
        honoured and not the coder merging by hand. The answer to guard against
        is neither armed nor merged, which a merge landing on the base in that
        window leaves; the pass says the verb once more, the second call
        advancing the branch before it arms, and hands the Challenge to the
        solo through `stop` if GitHub still shows neither.
      - >-
        What the re-arming does not cover, written here rather than left to be
        found: a pass that ends between its force-push and the re-arming — the
        turn cap, the step timeout, a lost runner, and this pass runs on half
        the budget against a conflict that is by construction the expensive
        kind — leaves the pull request unarmed, unrequested and no longer
        conflicting, and nothing recovers it. `advance` sweeps the armed; a
        second dispatch reads an empty wait and declines; the prompt's own
        early exit would stop one that was fired anyway, the branch being
        current with its base by then; and `check_pr.py`'s reading of a wait
        stuck on a conflict wants a wait. One reading does name it, and it is
        not a recovery: the reader below waits for the new head to be green
        and the pull request idle, and then prescribes a review of a change
        already approved — the cost the "request review rather than re-arm"
        alternative is refused for above, which is why it cannot be the floor
        here either. The window cannot be closed by
        reordering, because anything that restores an arming is necessarily
        after the push that drops it. What is bought instead is a record: the
        pass says on the pull request that it found the arming *before* it
        pushes, so a reader arriving at an unarmed head can tell an arming the
        push dropped from one nobody gave, and restoring it is that reader's
        act. The risk is taken at that price rather than claimed away.
      - >-
        A force-push that dismisses a stale approval does not block the merge
        it re-arms. That is this entry's inference rather than a claim of
        DR-112's: what DR-112 records is that "the ruleset requires no
        approval", which is why the arming and not the approval is what
        carries the verdict. So the arming is the whole of what has to survive
        the move, which is why it is the only thing read back.
      - >-
        The pass's prompt is written for both waits rather than for the review
        alone, and says of each what the push at the end does with it: for a
        request outstanding, the `synchronize` that finally starts the review;
        for an arming, the merge when green.
      - >-
        `check.py`'s probes gain the armed cases against the fake GitHub: an
        armed conflicting pull request is dispatched and not rebased, the sweep
        that leaves it to the dispatch exits zero, and a named `advance <pr>`
        over the same state still refuses.
      - >-
        `check_pr.py`'s sweep reads an arming stuck on a conflict, which it
        turned out not to: the branch is named with the rebase it needs. It is
        the same reading as the request stuck on a conflict rather than one
        beside it, so a pull request that is requested *and* armed is one line
        naming both waits — the collapse `dispatch()` already makes in the same
        words, and what keeps `len(owed)` a count of pull requests, which is
        how the sweep prints it. DR-133 rests on the sweep being the floor
        under the
        dispatch — what it catches there is "the conflict no push to trunk
        caused and the dispatched run that died at its budget" — and for the
        armed case that floor was not there. Widening the dispatch without it
        would move the silent state rather than remove it. What the floor
        holds now is said narrowly on purpose, because two of DR-133's words
        no longer carry: it catches the conflict no push to trunk caused, the
        dispatch that declined — for the solo's branch, for a stack, or for a
        Challenge the loop does not hold — and the budget death only where the
        run died with its force-push still to come. A run that died *after*
        its push is the window above, which no reading here catches, and a
        floor still described as catching the budget death entire would be
        telling the next reader it has them.
    falsifier: >-
      A re-armed pull request merging a conflict resolved the wrong way, where
      green was the only thing between the rebase and trunk. That would say an
      armed pull request's conflict is not a model's to settle unwatched — the
      requested half has a review behind it and the armed half has the gate
      alone — and the answer would be the rejected alternative above: the pass
      requests review rather than re-arming. A pass that re-armed a pull
      request nothing had armed would falsify the mechanism outright.
    rationale: |-
      The Challenge asked two questions and the first one answers itself once
      the second reading is read for what it is about. DR-133 is not a decision
      about review requests; it is a decision about conflicts, and the review
      request is the condition it filtered them by, for a reason it writes
      down: "A pull request nobody has asked to review is waiting on nothing".
      A review request and an arming are the same fact for that purpose — both
      say the Job that did the work has ended and handed the pull request over,
      so neither is a branch somebody is still standing on — and the three
      exclusions the narrow filter was carrying for other reasons are each
      already written down and each still apply.

      What dies of DR-133 is the filter and the sentences written around it.
      Three consequences are narrowed and none replaced whole: the second
      reading's condition, "a review request outstanding, a
      `claude/issue-<n>` branch, and `CONFLICTING`", which gains the armed,
      while the rebase pass above it stops asking GitHub to update a branch
      that conflicts; "A request only, and a loop's branch only", whose reason
      — a pull request nobody has asked to review is waiting on nothing —
      stops being the whole of it once an arming is read as the other way of
      having been asked, the loop's-branch half standing untouched; and the
      pass's "It requests nothing: the review request is still outstanding",
      which is now one of the two waits the pass is written for. What the
      filter was carrying for other reasons is inherited rather than relaxed:
      the poll, the solo's own branch, the lower layer of a stack, the
      Challenge the loop does not hold.

      And "A rebase pass that dies at its budget leaves the branch as it found
      it" is narrowed rather than killed. It holds for every death before the
      pass's force-push, which under DR-133 was every death it could have
      meant, no armed pull request being dispatched then. A death after the
      push now leaves the branch rebased and the arming gone, which is the
      window the consequences name and nothing recovers.

      The second question is the one with a cost in it. Re-arming means a diff
      the reviewer did not read merges on green, and there is no way to want
      that in the abstract. What makes it right here is that the alternative is
      not "the reviewer reads it" but "the reviewer reads it again, on an
      evening when the reason it needs reading is that `main` is merging faster
      than reviews finish". The conflict the pass resolves is bounded by what
      the pull request is for, the gate reads the result, and the comment says
      the head moved. If that turns out to be optimism, the falsifier above is
      what it looks like, and the fix is one clause of the prompt.
