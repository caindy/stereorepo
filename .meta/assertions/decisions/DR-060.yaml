decisions:
  - id: work:decision/060
    name: "DR-060 · PR First compiles to a skill, and ownership is recovered from GitHub"
    status: ADOPTED
    supersedes:
      - work:decision/055
    applies:
      - work:article/16
    alternatives:
      - name: A hand-written SKILL.md
        chosen: false
        reason: >-
          The reasoning it would carry already exists as assertions — the
          Discipline, the Articles it enforces, the form's own fence. A
          hand-written skill is the third copy of each and the only one nothing
          checks, which is the drift this repository has spent its length
          removing.
      - name: A skill rendered from the assertions
        chosen: true
        reason: >-
          One copy, and the generator reads it. What it costs is that the skill
          can only say what the assertions say, so anything the practice needs
          that is not asserted has to be asserted first — which is the point,
          and is why PR First gained two steps in this change rather than the
          skill gaining two paragraphs.
      - name: Wait for the APM compile step
        chosen: false
        reason: >-
          The frontmatter fields for an APM primitive are still unverified
          (DR-040), and writing plausible ones is worse than the gap. Rendering
          one harness's target now is the same shape at smaller scale, and it is
          usable today, which the unbuilt version is not.
    consequences:
      - >-
        `.claude/skills/pr-first/SKILL.md` is a render target. It is the first
        compiled primitive in the repository, and the first test of the claim
        that the package is derived and the assertions are the source.
      - >-
        `.meta/.apm/` stays empty, deliberately and for the reason DR-040 gave.
        What changed is that the claim is now demonstrated rather than only
        stated.
      - >-
        `check_pr.py` gains `--threads` and `--sweep`. The fetch was already
        there for A16 and could only answer pass or fail; the thing that knew
        how to ask GitHub what was said could not be asked to say it.
      - >-
        An accepted Decision numbered DR-060 or higher must state its options.
        Below that line the record was converted from prose and backfilling
        would invent a rejection.
    falsifier: >-
      A restart in which the sweep reports nothing and a pull request with an
      unanswered thread is still open — which would mean ownership is not in
      fact recoverable from GitHub alone.
    enacted_in:
      - work:artifact/meta-render
      - work:artifact/meta-lib-render-skills
    rationale: |-
      DR-055 built the mechanics of PR First and left the trigger to
      whoever remembered. That held while one conversation opened a pull
      request and stayed alive beside it, and stopped the first time a
      review arrived after the conversation had moved on.

      The step is "stay subscribed", not "block rather than poll": how a
      subscription is registered is the harness's business, and naming
      this week's mechanics in a Discipline would bake them into an
      artifact meant to outlive them.

      A background task dies with the session that started it, so a
      restart has to find what it owns from outside. The watch is an
      optimisation on a live conversation; the sweep is what makes the
      practice survive one ending mid-argument. Gemini picking up after
      Claude has no conversation to be triggered at all.
