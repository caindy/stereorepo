decisions:
  - id: work:decision/284
    name: "DR-284 · The coder door runs from the pull request head while the reviewer door remains trunk-pinned"
    challenge: work:challenge/972
    status: ADOPTED
    applies:
      - work:article/19
    enacted_in:
      - work:artifact/meta-coder-door
      - work:artifact/github-workflows-coder
      - work:artifact/meta-say-on
      - work:artifact/meta-depth
      - work:artifact/meta-lib-coder-door
      - work:artifact/meta-lib-coder-door-cli
      - work:artifact/meta-lib-coder-door-lifecycle
      - work:artifact/meta-lib-coder-door-handoff
    context: >-
      The reviewer workflow restores the channel and `.meta/lib/on/` from
      trunk to protect its judgement, but coupling the coder door to the same
      package meant pull requests altering the coder execution contract could
      not run. When a pull request modified `coder.yml` to pass new CLI flags or
      read updated step outputs, trunk's restored door failed to accept the
      flags or emit the outputs, causing false-positive execution door failures
      before the branch could land. Furthermore, `.meta/lib/on/` coupled reviewer
      policy, constraints, and deep review checks with coder execution and handoff
      logic.
    alternatives:
      - name: Move `.meta/lib/on/` to the pull request head
        chosen: false
        reason: >-
          This would let a pull request reduce its own review depth, fan-out,
          constraints, or verdict checks.
      - name: Keep every door trunk-pinned
        chosen: false
        reason: >-
          The coder workflow would continue to execute a trunk door against
          head workflow steps and require compatibility code for each contract
          change.
      - name: Extract only the coder door
        chosen: true
        reason: >-
          A separate `.meta/coder_door.py` entrypoint and `.meta/lib/coder_door/`
          package let `coder.yml` run the head-owned execution path, while
          the reviewer keeps the restored policy and judgement modules.
    consequences:
      - >-
        `coder.yml` invokes `.meta/coder_door.py`; its parser, lifecycle and handoff
        modules live in `.meta/lib/coder_door/`.
      - >-
        The coder door (`.meta/coder_door.py` and `.meta/lib/coder_door/`) is removed
        from `depth.CONTROL_PLANE` so it is head-owned and not restored from trunk
        during execution, but added to `depth.REVIEW_BOUNDARY` so changes to it still
        receive deep review.
      - >-
        The old duplicate files under `.meta/lib/on/` (`coder_door.py`, `handoff.py`)
        are removed; `.meta/say/on` and `.meta/lib/on/cli.py` no longer expose or
        re-export the coder verb or its symbols, and `.meta/say/verbs.yaml` scopes
        `on` as the reviewer's trunk-pinned program.
      - >-
        `coder.yml` includes a transition fallback in its attempt steps
        (`if [ -f .meta/coder_door.py ]; then .meta/coder_door.py ...; else .meta/say/on coder ...; fi`)
        so in-flight branches created before this split continue to execute without exit 127.
      - >-
        The reviewer continues to invoke `.meta/say/on` and restores
        `.meta/lib/on/`; `routing.py`, `common.py`, and `review.py` remain
        within the control plane.
    falsifier: >-
      `.meta/coder_door.py` or `.meta/lib/coder_door/` appearing in `depth.CONTROL_PLANE`;
      `.meta/coder_door.py` or `.meta/lib/coder_door/` absent from `depth.REVIEW_BOUNDARY`;
      `.meta/lib/on/` containing coder door symbols or subparsers;
      `coder.yml` invoking `.meta/say/on coder` without checking for `.meta/coder_door.py`;
      or `review.yml` invoking `.meta/coder_door.py`.
