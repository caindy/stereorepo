decisions:
  - id: work:decision/191
    name: "DR-191 · Spawned review subagents are counted and bounded by the fan-out ceiling, failing closed on breach"
    challenge: work:challenge/307
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/meta-agents
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-probes-tools
      - work:artifact/meta-render
    context: >-
      DR-166 established an agent fan-out ceiling chosen with review depth (3 on the boundary
      path, 1 elsewhere) to bound wall-clock time and turn consumption, but left the ceiling
      unenforced. Allowed tools in `review.yml` granted `Agent` without limit, leaving passes
      that exceeded the ceiling detectable only through manual transcript inspection.
      Following DR-122's principle of verifying execution facts rather than accepting prompt
      claims, the repository requires an automated post-session gate step that counts spawned
      subagents from the execution transcript and enforces the depth ceiling.
    alternatives:
      - name: Rely on prompt guidance alone without verification
        chosen: false
        reason: >-
          Leaves the ceiling as a suggestion. Models under reasoning pressure readily spawn
          unbounded subagents, causing latency spikes and turn exhaustion that can only be
          detected after the fact by manual inspection.
      - name: Emit a loud warning or advisory log on ceiling breach without failing
        chosen: false
        reason: >-
          Allows reviews that violate resource bounds to proceed and land, eroding the
          invariants of the review loop and allowing runaway fan-out to go unpenalized.
      - name: Count spawned subagents in a post-session gate step and fail closed (red run)
        chosen: true
        reason: >-
          Treats the fan-out ceiling as an invariant (Article 6 / A18). Parsing the session
          transcript or execution file to count distinct `Agent` tool invocations ensures that
          passes respecting the resource contract pass green, while runs exceeding the ceiling
          fail closed immediately.
    consequences:
      - >-
        `.meta/agents.py` is introduced to parse execution transcripts and Claude Code output,
        extract distinct `Agent` tool invocations, and assert that the count does not exceed
        the depth ceiling.
      - >-
        Registered as `work:artifact/meta-agents` in `.meta/assertions/structure.yaml` and
        added to the inherited file copy set in `.meta/assertions/disciplines.yaml` so
        specialized portfolios inherit the counting tool.
      - >-
        `.github/workflows/review.yml` adds `the fan-out ceiling was kept` step immediately
        following `the verdict landed`, asserting `--ceiling "${{ steps.depth.outputs.agents }}"`
        against `${{ steps.review_claude.outputs.execution_file }}`.
      - >-
        `justfile` recipe `agents *args` is added to `.meta/render.py` for local and workflow
        invocation.
      - >-
        Probes in `.meta/checks/probes.py` test `agents.py` parsing across single, concurrent,
        deduplicated, and empty execution logs.
    falsifier: >-
      A review run where the number of spawned subagents exceeds `steps.depth.outputs.agents`
      yet the review workflow completes green, or where subagent invocations cannot be
      parsed from the execution transcript.
    rationale: |-
      A ceiling that is not checked is a wish, not a bound. In accordance with DR-122's
      principle of verifying execution facts rather than accepting prompt claims, automated
      counting turns the depth ceiling into an invariant. Failing closed ensures that
      runaway agent proliferation is caught immediately in CI rather than noticed after latency
      has already degraded the loop.
