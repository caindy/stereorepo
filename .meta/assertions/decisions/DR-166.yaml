decisions:
  - id: work:decision/166
    name: "DR-166 · The reviewer's subagent fan-out is a ceiling chosen with the depth, one agent to a dimension the diff actually has"
    challenge: work:challenge/303
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-review
    context: >-
      `review.yml`'s depth step chooses the model, the effort, the turn cap and
      the minutes, and says nothing about how many agents the review may spawn.
      solorepo's DR-122 requires every one of them in the foreground, because a
      turn that ended waiting for a background agent was a run that posted
      nothing, and the pass has been costing the sum of its agents since: step
      timing puts an initial review on the deep path at 11 to 15 minutes,
      nearly all of it inside the action's step. Whether the skill could
      dispatch a foreground pass so that it costs the longest agent rather than
      all of them is a fact about the harness, which DR-122's second rejected
      alternative says is answered by a test and not by a reading; what is
      measured is the sum. So the skill's breadth is wall clock, and its width
      was never chosen — it is whatever the effort makes the skill decide.
      Doing nothing leaves the coder loop's first feedback behind it.
    alternatives:
      - name: Size the pass by the diff, as the turn cap was once sized
        chosen: false
        reason: >-
          This is the shape solorepo's #303 offered for the turn cap, and
          solorepo's DR-126 already answered it with nine runs: what a review
          costs follows the procedure and not the diff, an eight-file change
          needing more turns than a thirteen-file one. The count of dimensions
          a change has is not its line count either — a one-line change to the
          grammar the hook enforces has the dimension a hundred lines of
          decision record does not. A measure that does not predict the thing
          it sets would move the ceiling for the wrong reason.
      - name: Lower the turn cap on the cheap path
        chosen: false
        reason: >-
          `--max-turns` is a ceiling and not a target, so a run does not finish
          sooner for having a lower one: it ends `error_max_turns` with no
          verdict, which solorepo's DR-126 watched happen three times at a cap
          of 25 and is the reason the cap is 120 on both paths. Nothing about
          latency is answered by truncating the run that is slow.
      - name: Take Agent out of the reviewer's allowed tools
        chosen: false
        reason: >-
          It would end the fan-out by construction. solorepo's DR-122 weighed
          it for a different reason — it would have ended the turn that never
          waited — and rejected it, because a review done in one loop is a
          different review from the one the depth was chosen for; it said the
          option stays on the table and that its falsifier says when it is
          taken. That reasoning holds here too, and the deep path's breadth is
          what found the holes in the hook (solorepo's #86, #87). A ceiling
          keeps the choice available; removing the tool takes it away.
      - name: A ceiling on the agents, chosen with the depth, and the prompt spending it a dimension at a time
        chosen: true
        reason: >-
          The depth step is where what a run may cost is already decided, so
          the number belongs beside the minutes it is now part of. Three on the
          boundary path, and the number is a judgement rather than a
          derivation: the minutes would afford three times it, and what
          recommends three is that breadth here is what found the holes in the
          hook (solorepo's #86, #87), while three at the three to four minutes
          an agent takes puts the pass under ten minutes rather than over
          fifteen. One everywhere else: a decision record, a page
          or a script has one dimension, and a second agent on it reads the
          same diff for the same thing. The prompt spends the ceiling rather
          than filling it — the dimensions are named from the diff the session
          has already read, one agent to a dimension, none for a dimension the
          diff does not touch or one the session can settle itself. What it
          costs: the ceiling is a guess at how many dimensions a boundary
          change separates into, made from what a pass has been observed to
          take and not from a count of dimensions anybody measured; and a diff
          that genuinely has four leaves the fourth to the session's own
          reading, which is a worse reader of it than an agent would have been.
    consequences:
      - >-
        `review.yml`'s depth step prints `agents=3` on the boundary path and
        `agents=1` on the other, beside the model, effort, turn cap and minutes
        it already printed. The model, the effort, the cap and the minutes are
        unchanged.
      - >-
        The reviewer's prompt carries a paragraph that scopes the pass before
        it is spawned: the dimensions named from `.review/diff.patch`, one
        agent to a dimension, no more than the step's number, and none for a
        dimension the diff does not have or the session can settle itself. It
        says why — the pass has been costing the sum of its agents, which is
        where an initial review's 11 to 15 minutes go.
      - >-
        `.review/constraints.md`, which binds every agent, says that an agent
        reviews the dimension it was given and no other. An agent that sweeps
        for everything reads the diff again for what the session or another
        agent already holds, and the run waits on it either way.
      - >-
        A review that needed a fifth reader on the deep path now does not get
        one, and the finding it would have made is the session's to find or to
        miss. The falsifier says what that looks like.
      - >-
        A portfolio inherits it: `review.yml` is in the set Specialization's
        *Copy what is inherited* step copies.
    falsifier: >-
      A defect that reaches trunk through a review whose transcript shows the
      pass stopped at the ceiling with a dimension of the diff unread — which
      would mean the number was set from what a pass costs rather than from
      what a change has, and that the deep path's ceiling is too low. Or the
      other way: a transcript showing more agents than the ceiling. Nothing
      counts them, where solorepo's DR-122 counts the verdict rather than
      reading a claim of it, so a pass that walks past the number would say
      the prompt half is worth nothing here either and that taking `Agent` out
      of the allowed tools is the move left on the table.
    rationale: |-
      solorepo's DR-122 answered a run that ended waiting for its agents by
      requiring them in the foreground, and it was right: a verdict is the only
      thing a review run produces, and a turn that ends before the verdict
      produces nothing. What nothing then said was how wide the pass under that
      rule may go. Its width is whatever the skill decides the effort means,
      and what the timing measures is the sum of its agents — on the deep path,
      11 to 15 minutes in one step. That a foreground pass might be dispatched
      to cost the longest agent instead is a claim about the harness, and
      DR-122 is the entry that refused to rest on one: three runs said the
      documented wait did not start. So the width is what this takes hold of,
      and the dispatch is left to a test somebody runs.

      The Challenge offered three levers and one of them is already answered.
      Turn caps do not shorten a run; they end it, which solorepo's DR-126
      established at a cost of three runs that posted nothing, and sizing one
      by the diff is the alternative that entry rejected with the runs to back
      it. What is left is the fan-out itself, and there the two honest moves
      are a ceiling or no agents at all. solorepo's DR-122 put "no agents at
      all" on the table and left it there; this takes the lesser one, because a
      ceiling can be raised by an entry that says why and a removed tool has to
      be argued back.

      The number is a ceiling and not a quota, and the prompt is written so
      that it is spent rather than filled: a diff with one dimension gets one
      agent on either path, and a diff the session has read whole gets none.
      That is the part that matters more than three or one. A persona that
      reads the diff for a dimension the change does not have costs the same
      three minutes as one that finds something, and it is the commonest thing
      in the transcripts the timing was read from.
