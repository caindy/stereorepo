decisions:
  - id: work:decision/137
    name: "DR-137 · The coder and reviewer runs move first to a self-hosted Actions Runner Controller scale set on Kubernetes; the gate stays GitHub-hosted until the cluster has proven itself"
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-arc-readme
      - work:artifact/meta-arc-cluster
      - work:artifact/meta-arc-deploy
      - work:artifact/meta-arc-teardown
      - work:artifact/meta-arc-values-runnerset
      - work:artifact/justfile
      - work:artifact/meta-render
      - work:artifact/github-workflows-coder
      - work:artifact/github-workflows-review
    alternatives:
      - name: Buy more GitHub Actions minutes
        chosen: false
        reason: >-
          Answers this month and not the next one, and solorepo's own loop is
          what spends them: `coder.yml` and `review.yml` each hold a runner
          for up to 75 and 50 minutes per Claude Code session, and the
          scheduled sweep in `gate.yml` runs around the clock. A ceiling paid
          past is still a ceiling.
      - name: An org-scoped runner, so one controller serves every repository
        chosen: false
        reason: >-
          Broader than what exists to serve: one account, one repository,
          today. An org-scoped scale set asks for `admin:org` on the token
          where `repo` would do, and the two-layer design below already makes
          adding a second repository's scale set later a second
          `values-runnerset.yaml`, not a redesign.
      - name: A GitHub App credential instead of a PAT
        chosen: false
        reason: >-
          GitHub's own current recommendation, and not taken here: a PAT is
          one page in GitHub's UI, an App is registering one, installing it,
          and holding a private key instead of a token — more one-time setup
          for a single private repository's scale set. Revisitable once
          rotation on a classic PAT becomes the actual friction.
      - name: One script that also stands up kind, rather than two
        chosen: false
        reason: >-
          What was easiest to write, and what breaks the moment the target
          stops being this laptop. The Windows desktop this is actually for
          starts with nothing, so a bootstrap has to exist — but folding it
          into the deploy step ties every future cluster to `kind`, which is
          the one thing `deploy` must never assume for the "different
          machines, different clusters" goal to hold.
      - name: Move gate.yml's required checks now too
        chosen: false
        reason: >-
          The Windows box is a mostly-always-on machine and not a laptop, so
          this is where the fleet is headed — but it is also a blank slate,
          untested. `gate.yml`'s jobs are required status checks in `main`'s
          ruleset; pointing one at a scale set that turns out to be flaky
          stalls every merge silently, on the one workflow that cannot afford
          to find that out by stalling. Sequenced behind `coder.yml` and
          `review.yml`, which are event-driven and non-blocking, so the same
          discovery costs a wait rather than a wedged repository.
      - name: Leave coder.yml and review.yml hosted; move something cheaper instead
        chosen: false
        reason: >-
          The honest alternative, and there is no cheaper target: `gate.yml`'s
          jobs are the only other real spend, and they are the required
          checks this record already keeps hosted. `coder.yml` and
          `review.yml` are also the two Jobs that hold `CODER_GH_TOKEN`,
          `REVIEWER_GH_TOKEN` and `CLAUDE_CODE_OAUTH_TOKEN`. DR-073's own
          condition — "a container holding only its own token" — an
          ephemeral ARC pod still meets: one Role's credential, nothing
          else, gone when the job ends. What DR-073 never had to weigh is
          who the container's host is. A GitHub-hosted runner's host is
          GitHub's own infrastructure, reachable by nobody this repository's
          threat model already trusts; a self-hosted pod's host is this
          machine, which can read the pod and which the pod can reach on
          this machine's network. Moving these two Jobs here moves the
          token-holding half of PR First onto a host DR-073 was never
          written against. Accepted anyway, for what this repository
          actually is: a private repository whose only workloads are the
          solo's own agents, where the solo already has more direct access
          to everything the token could reach than the pod does. A public
          repository, or one with other collaborators, would need this
          argument made again and might not survive it.
      - name: A repo-scoped PAT, two separable layers, coder and reviewer moved first
        chosen: true
        reason: >-
          `.meta/arc/cluster` is the optional layer — a local `kind` cluster,
          skipped on any machine that already has one. `.meta/arc/deploy` is
          the layer that matters, and it never mentions `kind`: it installs
          the ARC controller and the runner scale set against whatever
          `kubectl config current-context` already names, which is what
          makes the same two commands mean "this Mac" today and "the Windows
          desktop over Tailscale" once WSL2 and Docker are there. The PAT
          needs only `repo` scope for a repository-level scale set, read from
          `$ARC_GITHUB_TOKEN` or `~/.config/solorepo/arc-runner.env` the same
          "outside the tree, per machine, fail loud" shape solorepo's DR-073
          already holds a Role's credential in, without pretending to be
          one — nothing `.meta/arc/deploy` does posts to GitHub as anyone.
          `values-runnerset.yaml` carries the scope itself:
          `githubConfigUrl` naming `caindy/solorepo` and nothing broader,
          `runnerScaleSetName` fixing the word a workflow's `runs-on:`
          targets, and `minRunners`/`maxRunners` sized for a machine rather
          than a fleet.
    consequences:
      - >-
        `.meta/arc/` holds three scripts — `cluster`, `deploy` and
        `teardown` — two Helm values files, and a README with the one-time
        PAT and WSL2 steps no script can do by itself. Nothing under it
        ships to a cloned portfolio — `.meta/` never
        does.
      - >-
        Two `justfile` recipes, `arc-cluster` and `arc`, one line each
        invoking a script under `.meta/`, per solorepo's DR-106.
      - >-
        `runs-on: arc-runner-set` replaces `ubuntu-latest` in `coder.yml`'s
        `coder` job and `review.yml`'s `reviewer` job. `gate.yml` and
        `advance.yml` stay on GitHub-hosted runners. `ubuntu-latest` ships
        `gh` and `jq`; the self-hosted image ships neither, so both files
        gain the steps that close exactly that gap — a gap this move
        created. `uv` and `just` are a different kind of gap, in `coder.yml`
        alone: `ubuntu-latest` never carried either, `gate.yml` already has
        to provision `uv` for itself (`astral-sh/setup-uv@v10.0.1`), and
        `coder.yml`'s prompts have typed `just dereference` since before
        this record, on a runner where the binary was never installed. This
        move did not create that gap; it is the reason it was found and
        closed. What actually changed for `coder.yml`'s tool assumptions:
        `gh`/`jq` were free on `ubuntu-latest` and now cost a step; `uv`/
        `just` were never free and now finally have one.
      - >-
        The credential boundary moves too: `coder.yml` and `review.yml` hold
        `CODER_GH_TOKEN`, `REVIEWER_GH_TOKEN` and `CLAUDE_CODE_OAUTH_TOKEN`
        inside pods this machine's own Kubernetes now schedules and can
        read, and which can reach this machine's own network — where
        solorepo's DR-073 previously had GitHub's own ephemeral infrastructure.
        Accepted for a private, single-operator repository; revisit before
        this pattern reaches one that is not.
      - >-
        Moving `gate.yml`'s required checks to the scale set is deferred, not
        declined: once the Windows box has run `coder.yml`/`review.yml`'s
        traffic reliably for a while, that migration is the next DR rather
        than a reopening of this one.
    falsifier: >-
      `coder.yml` or `review.yml` left waiting on a run that never schedules
      because the scale set silently stopped registering runners — found on
      a real Issue or review, the way this pull request's own review request
      found `gh` missing on the runner image in the first place. What would
      make the deferral of `gate.yml` wrong: the scale set holding required
      checks reliably for a good while with no stalled merge, meaning the
      caution cost hosted minutes the repository did not need to keep
      paying. A merge stalled on a runner that was simply off is not a
      falsifier of that deferral — it is the caution's own reasoning,
      confirmed.
    rationale: |-
      Christopher: out of GitHub Actions minutes on the current plan, and
      `coder.yml`/`review.yml`'s long Claude Code sessions are the actual
      cost, not the lighter `gate.yml` jobs. The real target is a Windows 11
      Home desktop reachable over Tailscale, mostly headless — not this
      laptop, which only proves the tooling before that machine has Docker
      under WSL2 ready for it. Asked for explicitly: two separable layers, an
      optional `kind` bootstrap and a cluster-agnostic Helm deploy, so the
      same repeatable pair of commands works on whichever machine currently
      needs a runner rather than a script written for one. `gate.yml`'s
      required checks are meant to move there too, once the box has earned
      that trust — agreed as the eventual scope, not the first change.
