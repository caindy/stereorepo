decisions:
  - id: work:decision/164
    name: "DR-164 · A pull request another answer overtook is superseded, which is a verb of the channel and the only exit that is not a merge"
    challenge: work:challenge/261
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/meta-say-verbs
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-probes-channel
      - work:artifact/meta-checks-graph
      - work:artifact/skill-pr-first
      - work:artifact/skill-pr-first-reviewer
      - work:artifact/meta-checks-graph-record
    context: >-
      PR First's tenth step is *merged, never abandoned*, and the channel
      enforces it by construction: `.meta/say/verbs.yaml` holds no `close` verb
      for a pull request, so `merge` is the only way one ends. The step is
      written for a change that was tried and did not work — merging records
      the attempt, and the record is worth the diff.

      A change another answer overtook is a different case, and the step's
      premise fails on it. #206 moved framing prose out of `render.py` into
      `.meta/prose.yaml` and closed #202. While it sat, two other changes
      landed prose mechanisms over the same ground: DR-144 (#199), taken for
      #202 itself, made framing prose `preamble` and `postamble` on the
      Artifact, and DR-152 (#227), taken for #226, made prose between derived
      content a named `woven` block. #202 closed COMPLETED. Merging #206 would
      install a third prose mechanism over two working ones, so step ten could
      not be followed; and no verb closed it, so nothing else could be either.
      It sat `CONFLICTING` and `CHANGES_REQUESTED`, with a correct review
      finding against a mechanism that was not landing.

      The trigger is parallelism, which is what the loops are for: #202 had
      three answers in flight and two landed first, and that recurs every time
      two Challenges overlap. The cost is precise: one pull request no Role can
      close through the channel, so the act is taken on GitHub directly and
      unsigned, which is the one thing solorepo's DR-069 and the signing hook
      exist to prevent. A rule with no sanctioned exception is a rule people
      step outside of.
    alternatives:
      - name: Rewrite step ten to say what a superseded pull request does, and leave the act to GitHub
        chosen: false
        reason: >-
          It answers the Discipline and not the defect. The act would still be
          `gh pr close` typed by hand, which the hook refuses and which, if it
          did not, would put an unattributable close on the record — the exact
          failure solorepo's DR-069 names. A step that tells a Job to do
          something the channel has no verb for is a step that teaches stepping
          outside the channel.
      - name: Merge it anyway, behind a revert or with the diff emptied
        chosen: false
        reason: >-
          It keeps the letter of step ten and loses what the step is for. A
          merge whose diff has been emptied records that something was tried and
          nothing of what it was; a merge that lands and is reverted puts a
          mechanism the tree already answers into the trunk for as long as the
          revert takes, and two commits on the index for one change nobody
          wanted. The record wanted is "this was answered elsewhere", and a
          closed pull request with a comment naming where says exactly that.
      - name: A `supersede` verb that closes with a reason and a link, refusing unless the Challenge is answered already
        chosen: true
        reason: >-
          The act stays inside the channel, so it is signed and attributable
          like every other, and the record reads: the closing comment names what
          answered the Challenge and the reason is the caller's, on stdin like
          every other body. What makes it an exception rather than a hole in the
          rule is its refusals — it is refused unless the body closes a
          Challenge and every Challenge it closes is closed already, and
          refused unless what `--by` names has landed, which for a Decision
          means an entry the trunk adopted and not a number the trunk has a
          file for. All of them are asked of GitHub and of the record on the
          trunk, never of the caller. So a change nobody superseded still has
          merge as its only exit, which is step ten unchanged for every case
          step ten was written for.
      - name: Release a minted Decision number the change never used
        chosen: false
        reason: >-
          It would undo the property the number has. The tag is the allocation
          (solorepo's DR-128) — `POST /git/refs` refuses a ref that exists, and
          that refusal is what stops two branches holding one number — so
          deleting it makes the number issuable again while a citation of the
          first minting may already stand in a closed pull request's body or in
          a commit, neither of which is ever rewritten. DR-128 already says what
          closes the hole: the number is written back into the record as
          WITHDRAWN, and the tag stays. What was missing was not a rule but a
          prompt, and `supersede` is a moment when one can be given.
    consequences:
      - >-
        `.meta/say/move supersede <pr> --by <pr|DR> < body.md` is a verb of the
        channel, the coder's: the reason on stdin, the comment posted signed,
        the pull request closed, and the state read back from GitHub afterwards
        rather than taken from what `gh` returned.
      - >-
        It refuses four ways, and each refusal is a read rather than a
        question to the caller. A pull request that is not open. A `--by` that
        has not landed — a pull request GitHub does not report as `MERGED`, or a
        `DR-nnn` whose entry on the trunk is not `ADOPTED` — because two open
        pull requests are two answers in flight and which is the wrong one is
        not settled by closing the other. The entry is read and not the
        listing: a number written back as WITHDRAWN is a file at that path like
        any other, so a listing says the number is taken and not that a
        decision was taken, and a hole is not a replacement. And a body that
        closes no Challenge, or any Challenge it closes that is still open,
        which is the whole of what tells superseded from abandoned: the
        Challenge being closed is the evidence that another answer landed, and
        without it closing the pull request would abandon a need — or, where
        the body names none, would be the general `close` this verb is not,
        since `--by` is satisfied by any merged pull request in the repository
        and says nothing about the one being closed.
      - >-
        The closing comment names the numbers this branch minted and never
        landed, found by matching each reserved tag's message against the head
        branch, and says they are written back as WITHDRAWN rather than
        released. `decision_numbering`'s account of what prompts that closure
        said nothing did; it now says this does, for the one case that has a
        verb, and that a reservation whose branch simply stopped still has no
        prompt.
      - >-
        PR First's tenth step names the exception and its refusal, so the rule
        and its one sanctioned way out are stated together. A20: a rule that
        lives only in the record is not in force, and so does an exception.
    falsifier: >-
      A pull request closed through this verb whose Challenge no other change
      answered — `supersede` accepting a `--by` that never landed, including a
      `DR-nnn` the record holds as a hole rather than as an adopted entry; or a
      body whose Challenge is still open, or that names no Challenge for
      another answer to have overtaken. Any of them would make it the `close`
      verb step ten refuses to have, and the refusals are the whole of the
      difference.
    rationale: |-
      Step ten's reasoning is right and does not reach this case. It assumes
      merging is always available and merely unappealing: the change was tried,
      it did not work, and the record of the attempt is worth the diff. A
      superseded change breaks the assumption rather than the preference. The
      attempt is still worth recording, and the diff is not mergeable at all,
      because the tree already holds a different answer to the same question.

      So the exception is real, and the question was only where it should live.
      Left in prose it is a licence: any pull request its author has tired of
      can be called superseded, and the rule that made abandonment
      unrepresentable becomes a rule about wording. Put in a verb it is a
      claim with evidence, and the evidence is already on GitHub — the
      Challenge is closed, and something merged closed it. The verb reads both
      and refuses when either is missing, which is why this is an exception to
      step ten and not a repeal of it.

      The number is the smaller half of the same shape. A hole in the Decision
      sequence is cheap and a number issued twice is not, because the number is
      fixed the moment it is first cited and citations on GitHub are never
      rewritten (solorepo's DR-125). So the reservation is spent, and what
      closes it is an entry, not a deletion. DR-128 said that already and also
      said that nothing prompts it; closing a pull request is the moment
      somebody knows the number will never be redeemed, so that is where the
      prompt goes.
