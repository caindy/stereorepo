decisions:
  - id: work:decision/143
    name: "DR-143 · The generated pages are merged by union and corrected by the render, because a conflict in a page pinned to its sources is a conflict about nothing"
    status: ADOPTED
    enacted_in:
      - work:artifact/gitattributes
      - work:artifact/meta-render
      - work:artifact/meta-lib-render-targets
    context: >-
      `check.py` byte-compares every page `render.py` writes against a fresh
      render and fails the gate on any difference, so a committed generated
      page carries no information its sources do not. `.meta/decisions.md` is
      one of thirteen such pages, and it is the one that conflicts: entries
      render newest last, so two branches that each record a decision both add
      a row after the same last row. On #192 that was DR-141 on `main` against
      the entry that branch was adding — `git merge-tree --write-tree` naming
      `.meta/decisions.md` as the only conflicted path, while the two entry
      files it renders from did not conflict, being separate files. DR-128
      already stopped two branches taking one number; nothing stopped them
      writing to one line of the page rendered from the numbers. The cost lands
      on every pair of concurrent pull requests that each record a decision,
      and the resolution is always the same act — rebase, `just render`, push —
      because whatever is hand-edited into the file is overwritten by the
      render that the gate then demands.
    alternatives:
      - name: Leave it, and hand-resolve each time
        chosen: false
        reason: >-
          It is the state that made the Issue, and the work it asks for is work
          with no judgement in it: the coder reads a conflict hunk in a file
          whose correct content is computable, picks something, and is then
          required by the gate to throw the pick away and re-render. It also
          reads as a real disagreement from outside — a reviewer seeing
          `CONFLICTING` cannot tell from the label that the branches agree
          about everything.
      - name: Stop committing the generated pages
        chosen: false
        reason: >-
          It removes the conflict everywhere rather than locally, and it is the
          A7 reading — a page nothing consumes but a reader need not be in the
          tree. It is refused because the reader is the point. `.meta/README.md`
          routes to `decisions.md`, `disciplines.md`, `charter.md` and
          `vocabulary.md` as pages to open, and a portfolio's arriving agent is
          pointed at them by path. Un-committing turns every one of those links
          into an instruction to run a renderer first, which is a worse failure
          than a conflict and a much larger change. #11 holds the question of
          what `.meta/` should stop duplicating; this is not the place to
          settle it.
      - name: Render entries in an order where two additions do not share a line
        chosen: false
        reason: >-
          The cheapest to write and the hardest to defend. Newest-last is the
          order a record is read in, and the collision is at whichever end is
          last, so reversing it moves the conflict rather than removing it. Any
          order that actually separated two new rows would be an order chosen
          for git rather than for a reader.
      - name: A custom merge driver, so the merge itself re-renders
        chosen: false
        reason: >-
          The exact fix, and undistributable. A driver named in
          `.gitattributes` runs only if `merge.<name>.driver` is in the
          reader's git config, which a clone does not carry, so every worktree
          and every runner would need a setup step that nothing checks and
          whose absence is silent — the conflict comes back and looks like this
          decision was never taken. `union` is built into git and needs no
          config, which is what makes it the one that survives a clone.
      - name: >-
          `merge=union` on every generated page, with the gate as the
          correctness backstop
        chosen: true
        reason: >-
          It matches what the merge is actually worth. Union takes both sides
          rather than stopping, which on the real case is exactly right: merged
          against the #192 conflict it produced both new entries as adjacent
          rows in numeric order, with no duplicated artifact rows, byte-identical
          to what a fresh render gives. Where it is wrong — both sides extending
          one artifact's row, which leaves both copies — it is wrong in the one
          way this repository already detects, and the fix is the `just render`
          that was owed regardless. The list comes from `TARGETS`, so a page
          added there is covered by the act of adding it rather than by
          remembering this file.
    consequences:
      - >-
        `.gitattributes` at the root, generated, marking all thirteen pages
        `merge=union` — itself among them, since `TARGETS` changing on two
        branches conflicts the same way.
      - >-
        Every pattern is anchored with a leading `/`. A gitattributes pattern
        with no slash in it matches that basename at any depth, so three of the
        thirteen — `justfile`, `SPECIALIZE.md` and `.gitattributes` itself —
        would otherwise have unioned a nested file of the same name that no
        gate byte-compares, which is the falsifier below arriving by the
        generator rather than by union.
      - >-
        A rebase across a concurrent decision no longer stops. The coder rebases,
        runs `just render`, and pushes; where union guessed wrong the gate says
        `rendered prose` before the push and the render has already fixed it.
      - >-
        The pull request still reads `CONFLICTING` on GitHub until the rebase is
        pushed. GitHub does not read a repository's `.gitattributes` when it
        computes or performs a merge, so nothing here changes the label or the
        merge button — this buys the rebase, not the signal in front of it.
      - >-
        Union is now load-bearing for correctness in one direction only: it may
        produce a page that is wrong, never one that is silently wrong. That
        holds exactly as long as `check.py`'s byte-comparison of every rendered
        page does, which is the thing to protect if either is ever touched.
    falsifier: >-
      A union merge that the gate passes and a reader would call wrong — which
      would mean the byte-comparison is narrower than it looks and union is
      resolving something the render does not determine. Or `.gitattributes`
      turning out to be consulted by something here that merges without a
      working tree, where `union` would apply somewhere this reasoning never
      examined. What would not falsify it: a pull request still showing
      `CONFLICTING`, which is stated above as what this does not fix.
    rationale: |-
      The thing worth recording is not the driver but why a conflict in these
      files is not a question. Merge conflicts exist because git cannot know
      which of two intentions to keep. Here it can: the page is a function of
      the assertions, the function is in the repository, and the gate already
      runs it and compares. The conflict is git applying a general rule to a
      file that has escaped the condition the rule is for, and the answer is to
      tell git so rather than to keep answering the question by hand.

      That also fixes where the guard sits. Union is not being trusted to
      produce the right page — it is being trusted to produce *a* page, and the
      byte-comparison that was already there decides whether it was the right
      one. So this adds a way to be wrong that was already caught, and removes a
      stop that was never informative. It is worth being plain that this is the
      whole of the safety argument: if `check.py` ever stops comparing rendered
      output byte for byte, union stops being safe on the same day, and nothing
      would say so.

      What it does not do took a check rather than a recall. GitHub's position,
      given to a user in 2017 and unchanged through the open request for it, is
      that it does not consider a repository's own `.gitattributes` — it merges
      with its own — and the workaround it offers is to merge in a local clone.
      Kubernetes removed a union driver from its `.gitattributes` for this
      reason. So the label on the pull request stays, and a decision that
      claimed to remove it would be claiming something the first concurrent pair
      would disprove. The honest scope is the rebase: the part of the cost that
      is a person reading a hunk about nothing.
