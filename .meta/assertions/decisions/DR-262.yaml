decisions:
  - id: work:decision/262
    name: "DR-262 · Bounding mutation testing worker concurrency to eight across seed gates to reconcile with DR-147 burstable scheduling"
    status: ADOPTED
    supersedes: []
    enacted_in:
      - work:artifact/bootstraps-python-gate
      - work:artifact/bootstraps-rust-xtask
    context: >-
      DR-147 established a burstable resource model for self-hosted ARC runner pods
      on a single 24-vCPU host, permitting up to 12 concurrent pods with memory limits
      (4 GiB) but no CPU limits so compilation and tests burst freely across idle cores.
      In commit c50a9d4, `cargo xtask mutants` in `bootstraps/rust/seed/xtask/src/lib.rs`
      introduced parallelism clamped to `std::thread::available_parallelism().map_or(4, |n| n.get().clamp(1, 8))`
      with a `CARGO_MUTANTS_JOBS` override. A Challenge noticed that Python's `mutmut run` in
      `bootstraps/python/seed/gate/src/gate/__init__.py` passed no `--max-children` flag, and proposed
      raising Rust concurrency to 16 workers, adding `--max-children` to Python, and establishing a static
      16/4/2 core partition across Rust, Python, and .meta gates.

      Investigation revealed two flaws with that proposal: first, `mutmut run` without `--max-children`
      internally defaults to `os.cpu_count() or 4` (24 workers on a 24-core runner), creating severe
      unbounded process tree contention. Second, Kubernetes schedules runner pods independently without
      coordinating core partitions across concurrent gate runs and loop sessions; raising per-job concurrency
      to 16 workers would allow two concurrent gate runs to launch 32 heavy compilation processes,
      triggering the exact CPU cache thrashing and wall-clock inflation warned by DR-147's falsifier.
    alternatives:
      - name: Raise default worker ceiling to 16 in CI and declare a static core partition
        chosen: false
        reason: >-
          Static core budgets across separate pods are fictitious in Kubernetes. Bursting to 16 workers
          in a single pod starves concurrent loop sessions and other gate jobs, causing CPU cache contention
          and risking DR-147's falsifier.
      - name: Run mutation testing strictly sequentially with a single worker
        chosen: false
        reason: >-
          Sequential evaluation wastes idle multi-core hardware capacity on multi-core runners and
          substantially inflates gate wall-clock duration as the mutant corpus grows.
      - name: >-
          Bound default concurrency to eight across both Rust and Python seed gates with symmetric
          environment overrides (CARGO_MUTANTS_JOBS, MUTMUT_MAX_CHILDREN)
        chosen: true
        reason: >-
          Capping default worker concurrency at 8 (1/3 of the 24-core host capacity) strikes the optimal
          balance between intra-pod parallel efficiency and inter-pod multi-tenant stability. Even when
          two gate runs execute mutation testing simultaneously (16 workers total), 8 host cores remain
          unmonopolized for concurrent coder/reviewer loop sessions, advance jobs, and OS daemons.
          Passing `--max-children` clamped to `min(os.cpu_count() or 4, 8)` brings Python into parity with
          Rust's `clamp(1, 8)`, eliminating mutmut's unconstrained 24-process fork bursts, while preserving
          explicit environment variable overrides for dedicated environments.
    consequences:
      - >-
        `bootstraps/python/seed/gate/src/gate/__init__.py` derives worker count from `MUTMUT_MAX_CHILDREN`
        or `min(os.cpu_count() or 4, 8)` and passes `--max-children` to `mutmut run`.
      - >-
        `bootstraps/rust/seed/xtask/src/lib.rs` retains the default `clamp(1, 8)` ceiling and `CARGO_MUTANTS_JOBS`
        environment override.
      - >-
        `.github/workflows/gate.yml` avoids hardcoding static concurrency overrides, relying on the
        in-tree seed defaults to harmonize with DR-147.
    falsifier: >-
      Mutation testing in either seed gate spawning more than 8 workers in the absence of explicit environment
      overrides, or concurrent gate mutation testing ballooning wall-clock execution beyond 120 seconds due to
      core starvation.
    rationale: |-
      Resource allocation in shared single-node runner clusters must balance individual task throughput
      against fleet-wide responsiveness. Unbounded concurrency in any one tool degrades the entire system
      through memory bandwidth saturation and L3 cache thrashing. Standardizing an 8-worker default across
      both seed ecosystems ensures predictable burst behavior while respecting the cluster's multi-pod
      concurrency limits.
