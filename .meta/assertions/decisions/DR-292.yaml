decisions:
  - id: work:decision/292
    name: "DR-292 · Every hard Challenge is decomposed into reviewer-triaged child Challenges before autonomous execution"
    challenge: work:challenge/1067
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/19
    enacted_in:
      - work:artifact/agents
      - work:artifact/meta-lib-move-epics
      - work:artifact/meta-lib-move-cli
      - work:artifact/meta-say-verbs
      - work:artifact/meta-checks-probes-loops-merge-manager
      - work:artifact/meta-checks-probes-loops-epic
      - work:artifact/github-workflows-coder
      - work:artifact/meta-lib-move-manager
      - work:artifact/meta-lib-coder-door-lifecycle
      - work:artifact/meta-coder-door
      - work:artifact/meta-lib-on-routing
      - work:artifact/meta-lib-move-init
      - work:artifact/meta-templates-prompts-coder-decompose
      - work:artifact/meta-templates-readme
      - work:artifact/meta-lib-check-pr-form
      - work:artifact/wiki-solorepo-pr-first
      - work:artifact/meta-assertions-structure
      - work:artifact/meta-next
    mechanics:
      - >-
        When the reviewer labels a Challenge `hard`, the coder proposes a
        decomposition into a parent Epic and medium or easy child Challenges.
        The parent remains open, receives the `epic` label, and owns its children
        through GitHub's native sub-issue relationship. The solo approves the
        proposed decomposition before the coder creates children.
      - >-
        Child Challenges are created without difficulty labels. The reviewer
        triages each child, and each leaf pull request closes only its child
        Challenge. The merge manager closes the parent Epic after every child
        Challenge is closed.
    alternatives:
      - name: Keep hard Challenges as a single human-executed pull request
        chosen: false
        reason: >-
          This keeps the current hand-built workflow and prevents autonomous
          execution of independently reviewable parts of large Challenges.
      - name: Let the coder create children immediately from its own estimate
        chosen: false
        reason: >-
          A decomposition can change the work's boundaries and dependencies.
          Requiring the solo to approve the plan preserves the existing hard
          Challenge planning gate, while leaving difficulty verdicts to the
          reviewer.
      - name: Approve the decomposition before creating reviewer-triaged children
        chosen: true
        reason: >-
          Native GitHub sub-issues express the parent-child structure, native
          blocker relationships express execution order, and the existing
          reviewer triage and merge manager remain the authorities for child
          difficulty and landing. This adds a decomposition handoff and an
          `epic` label that the coder must maintain.
    consequences:
      - >-
        A hard Challenge begins with a decomposition proposal and cannot enter
        child execution until the solo approves it.
      - >-
        Parent Epics outlive leaf pull requests and close only when all child
        Challenges have closed; a failed or abandoned child therefore keeps
        its parent open for recovery.
      - >-
        The approved JSON plan is the source of truth for child creation and
        Epic completion. Retries reuse linked children or recover an unlinked
        child bearing the parent marker rather than creating a duplicate.
      - >-
        Child Challenge difficulty remains a reviewer verdict, so decomposition
        creates more triage work before autonomous coder loops can take it.
    falsifier: >-
      A hard Challenge whose coder creates child Challenges before the solo
      approves its plan; a leaf pull request that closes its parent Epic; or a
      parent Epic closed while any child Challenge remains open.
    rationale: |-
      PR First already requires leaf pull requests to close child Challenges
      rather than parent Epics, but the repository has no workflow that turns a
      hard Challenge into such a parent-child structure. As a result, a hard
      Challenge remains one human-held unit even when its work can be split into
      independent pieces.

      The parent Epic is not itself implementation work, so opening a plan-only
      pull request for it would create a second handoff with no leaf change to
      merge. Instead, the decomposition plan is approved on the parent Issue;
      every child remains subject to the full PR First lifecycle.

      Decomposition makes those pieces eligible for autonomous execution in
      dependency order, while the solo continues to validate the boundaries
      before work starts. Children remain Challenges and receive their own
      reviewer verdicts. Native GitHub sub-issues and blocker relationships
      provide the structure the existing queue and pull-request lifecycle can
      inspect. The parent Epic closes only after the child Challenges close,
      preserving the rule that leaf pull requests do not close composite work.
