decisions:
  - id: work:decision/108
    name: "DR-108 · A merged branch's local residue is named by the sweep and removed by the Job that finds it"
    status: ADOPTED
    applies:
      - work:article/18
    enacted_in:
      - work:artifact/meta-check-pr
      - work:artifact/meta-disciplines
    alternatives:
      - name: The merge verb removes the worktree and the branch
        chosen: false
        reason: >-
          The verb runs inside the worktree it would delete, and the worktree
          a harness created is the harness's to remove at exit. It would also
          reach only the checkout that merged, and the branches pile up in
          every other one.
      - name: The harness's exit prompt alone
        chosen: false
        reason: >-
          It asks one session about one worktree, at the moment the session
          is least attended. The main checkout's branches are never asked
          about, and they are where the pile was found.
      - name: The sweep names the residue and a step removes it
        chosen: true
        reason: >-
          Naming is what a tool can own outright: a branch whose remote is
          gone after a prune, its pull request, and the command that removes
          it. Removing stays with the Job, because the worktree may be the
          one the tool stands in, or another session's. What it costs is that
          a step still has to be followed, which the falsifier watches.
    consequences:
      - >-
        `check_pr.py --sweep` ends with the residue: each local branch whose
        remote is gone, its pull request's state, the worktree on it if any,
        and the commands. A branch never pushed is not named; it is work in
        progress.
      - >-
        PR First gains a step between staying subscribed and arriving: leave
        nothing behind when the pull request closes.
    falsifier: >-
      A branch the sweep has named surviving three sweeps. Naming would then
      not be removing, and the verb would have to act after all.
    rationale: |-
      Christopher, noticing the local branches left dangling behind merged
      pull requests. The remote side was handled once (DR-075's merge deletes
      the branch on GitHub) and the local side was left to whoever noticed.
