decisions:
  - id: work:decision/142
    name: "DR-142 · The coder's second pass is bound to the Challenge's difficulty as its first is: the review door reads the Issue's current level, and a session takes a branch from the loop by moving the Issue to `hard`"
    challenge: work:challenge/169
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/18
    enacted_in:
      - work:artifact/github-workflows-coder
      - work:artifact/meta-disciplines
      - work:artifact/meta-say-move
      - work:artifact/meta-check
    context: >-
      `coder.yml` has two doors. The `issues` door reads four facts before any
      work — the Issue's state, its current difficulty, the open pull request
      on its branch, and the claim — and refuses `hard` by name. The
      `pull_request_review` door reads that the verdict is a request for
      changes from the reviewer's account on a branch whose name starts
      `claude/issue-`, and nothing about whether the work is taken. On #168,
      raised by #148 labelled `hard` and claimed, a run took the branch the
      moment the reviewer requested changes, under a session that had opened
      the pull request and answered its threads. Both facts that would have
      refused it were GitHub's, and the door that opened asked for neither.
      #115 is the same collision from the other side: on #110 a session and a
      run both answered six threads on a `medium` Issue's pull request, and a
      push from one dismissed an approval of the other. Neither leaves a mark
      that a collision happened.
    alternatives:
      - name: A lock on the branch — a label on the pull request, or a marker file
        chosen: false
        reason: >-
          Nothing GitHub holds says who stands on a branch, so the lock would
          have to be set to be true, and a fact that must be set fails open:
          a session that forgets it looks free, which is the state that did
          the harm, with a ceremony added. PR First already says the checkout
          is the token and GitHub resolves it — one branch, one pull request
          — but that resolves which pull request, not which Job.
      - name: A claim that names a Job rather than a Role
        chosen: false
        reason: >-
          The claim is the assignee, and an assignee is an account; a Job has
          none, and a session and a run are the same account by design
          (DR-107). The Trailer names a Job, but on a commit, and a commit
          says who wrote and not who stands — a session's last commit does not
          say the session is still there, and a session that has not committed
          is invisible to it. A claim readable before a run does any work
          would need a fact GitHub does not hold today.
      - name: Read ownership off the branch name, or have a session name its branch otherwise
        chosen: false
        reason: >-
          The name is what failed. `claude/issue-<n>` is a name the session
          chose, chosen because it is the convention, and choosing it was
          enough to look like the loop's. Naming a session's branch otherwise
          loses what the convention buys — `advance` dispatches a rebase only
          for that shape, and the hand-back reads the Issue from it — and
          #188, on `claude/issue-186`, shows the loop skipping on a name for
          reasons that have nothing to do with who holds it.
      - name: The review door reads what the Issue door reads, and the difficulty is the semaphore
        chosen: true
        reason: >-
          The level is the one fact that already says which kind of Job takes
          a Challenge: DR-112 made `hard` the solo's, taken with an agent
          beside him, and `easy` and `medium` the loop's the moment the label
          lands. GitHub holds it, it is on the Issue's own page, and it is
          readable before a run does anything. It is also takeable both ways,
          which the Issue asked for and no other candidate offered: a session
          moves the Issue to `hard` and the loop's next pass stands down; moves
          it back and the loop answers the next verdict. So the guard runs on
          both event doors and reads the same Issue, and `hard` and `human`
          are refused on either. What it costs: a session that takes up a pull
          request the loop holds has one act to perform first, and the loop
          answers no verdict on a `hard` Issue even where the solo would have
          liked it to — the dispatch of a review pass stays for that, being
          the solo's own word, and is the one door the guard does not read
          against. The rebase dispatch is not the solo's: `advance` makes it
          on a push to `main`, filtering on the request, the branch shape,
          the stack and the conflict and on neither the level nor the claim,
          so it is read against like the review event, or the pass it starts
          would force-push under a session and, on a conflict it could not
          settle, `stop` the Issue from `hard` to `human`.
    consequences:
      - >-
        `is it taken already` in `coder.yml` runs on the `issues` event, the
        `pull_request_review` event and the rebase dispatch alike, reading the
        Issue the branch names. Closed, at `hard`, or at a level the loop does
        not take, the pass skips and says which word: `closed`, `held`,
        `stale`. The duplicate reading — claimed with a pull request open — is
        the first door's alone: on the others, the open pull request is the
        event's own and the claim is what a standing run looks like.
      - >-
        On the doors that read the Issue off the branch name, a name that is
        not a number, or an Issue that cannot be read, is the word `unnamed`
        and not a failed step: on the first door a failed read aborts, and
        the Issue is there to be re-delivered; on the others an aborted step
        is a verdict answered by nobody.
      - >-
        `answer the review` and `rebase onto the base` run where the guard
        found the Challenge the loop's, and `answer the review` also on the
        solo's own dispatch of a review pass, which the guard does not read
        against because the solo dispatching is the solo deciding. The depth
        of a second pass is unchanged: the larger model whatever the label,
        because the threads were written by the deeper reviewer.
      - >-
        Where the loop stands down from a verdict and nobody is standing
        there — `closed`, `stale`, `unnamed` — it says so on the pull
        request, so the verdict does not stand with no Job and no sign, which
        is #102's state from the other side. On `held` a session is there by
        construction and nothing is posted. The rebase door posts nothing:
        it is delivered on every push to `main` while the branch conflicts,
        so `dispatch()` in `.meta/say/move` reads the Issue's state and level
        before it dispatches and leaves a Challenge the loop does not hold
        alone, named in `advance`'s log; the guard on that door is the floor
        under the race between a relabel and a push.
      - >-
        The branch prefix stays in the review door's condition as what it is:
        the way the Challenge is named, and not a claim about who holds the
        branch.
      - >-
        PR First's third step says what a session does to take a pull request
        from the loop: have the solo move the Issue to `hard` first. Moved back, the loop
        answers the next verdict and not one already standing: a relabel is
        an `issues` delivery, which fires the first door and re-delivers no
        review, so a verdict the session leaves behind is the session's to
        answer or the solo's to dispatch. Neither is a new verb; the label
        was already the fact the loop reads.
      - >-
        A session on a `medium` Issue's `claude/issue-<n>` branch is not
        protected, by design: that Issue is the loop's from the moment the
        label landed, and a session beside it is the collision #115 recorded.
        The session relabels or stands aside. `move claim` does not yet say so
        to a session claiming `easy` or `medium`.
      - >-
        The first run under this rule is the test of it. GitHub's "Events
        that trigger workflows" table gives `pull_request_review` the same
        row as `pull_request`: `GITHUB_SHA` is "Last merge commit on the
        `GITHUB_REF` branch" and `GITHUB_REF` is "PR merge branch
        `refs/pull/PULL_REQUEST_NUMBER/merge`", so a run on the event reads
        `coder.yml` from the pull request's own merge ref, as `review.yml`'s
        head already records of `pull_request`. #169 is `hard` and this
        change's own pull request is on `claude/issue-169`, so the loop's
        pass on the reviewer's first request for changes runs this head's
        guard and must stand down with `held`.
    falsifier: >-
      A run answering a verdict, or rebasing, on a `hard` Issue's branch on
      any door but the solo's own dispatch of a review pass — the guard read
      the level and the loop ran anyway — would falsify the mechanism. A session needing to hold a `medium` pull request often
      enough that the relabel is the thing forgotten would falsify the choice:
      the ceremony would then be the failure, and the answer would be a claim
      that names a Job, which waits on a fact GitHub does not hold.
    rationale: |-
      The Issue put the constraint precisely: whatever the second pass is bound
      to has to be a fact GitHub holds and reports, readable before a run does
      any work, and takeable by a session as well as by a run. Three candidates
      were in the Issue's own last paragraph, and only one of them exists
      today. A lock is a fact that must be set, and it fails in the direction
      the collision came from. A claim naming a Job wants an identity GitHub
      has no field for. The difficulty label is already there, already read
      by the first door, already the thing DR-112 chose to say whose a
      Challenge is — and the second door simply never looked.

      That the first door read it and the second did not is the whole defect,
      and the fix is the same step run twice rather than a second reading of
      the same rule. The step's four facts are the four facts on both doors;
      what differs is what a standing run looks like, which on the review door
      is the normal case and on the Issue door is a duplicate. One `DOOR`
      test carries that difference, and the rest of the step is unchanged.

      What the label buys beyond the guard is the takeover. A session that
      wants a branch the loop opened has, until now, had no way to say so that
      the loop could read; the solo's own sessions were invisible to it, which
      the Issue named as this failure again with more steps. Moving the Issue
      to `hard` is one act, on the Issue's own page, and it is read by the
      next run before it checks anything out. Moving it back is the hand back.
      No new verb, no new state, and the Discipline's third step gains a
      sentence rather than a rule.

      #115 is closed by the same reading and not by a second mechanism. Its
      case was a `medium` Issue, which is the loop's, with a session beside it
      by choice; the answer it asked for — which Job is answerable, stated
      somewhere GitHub holds — is the level, and a session that wants that
      pull request now has the act that says so.
