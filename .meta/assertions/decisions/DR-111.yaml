decisions:
  - id: work:decision/111
    name: "DR-111 · GitHub holds the intent to merge when green, and the watch keys a check on its run"
    challenge: work:challenge/79
    status: ADOPTED
    applies:
      - work:article/18
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-check-pr
    alternatives:
      - name: The merge verb waits for the checks itself
        chosen: false
        reason: >-
          `gh pr checks --watch` would hold the verb open until green and then
          merge with the read-back intact. But the wait lives in a session,
          and a session ends; on a stack every layer above the bottom re-runs,
          so the wait is paid on each and lost with the session that held it.
      - name: The watch says "still pending" and a person retries
        chosen: false
        reason: >-
          What was in place, minus the line. It makes the watch louder and
          leaves the retry where it was, with whoever is looking.
      - name: GitHub's auto-merge, armed by the verb; the watch keys on the run
        chosen: true
        reason: >-
          `say merge --auto` hands GitHub the squash and its subject now and
          the merge happens when the ruleset is satisfied, watched or not; the
          watch reports the merge because it keys each check on its run as
          well as its verdict, so a re-run is a line and a merge is the last
          one. What it costs: auto-merge is a repository setting the verb can
          only read, not set; a layer of a stack cannot be armed, because its
          base is the layer below; and an already-mergeable pull request
          refuses to be armed, in GitHub's words, so the verb falls through
          to the plain merge.
    consequences:
      - >-
        `say merge <n> --auto` arms the merge, reads back, and prints armed or
        merged. It refuses a layer of a stack and a repository without the
        setting, and says which.
      - >-
        The watch carries each check's run url beside its verdict, and a
        re-run that ends where it started prints as one line saying so.
    falsifier: >-
      An armed pull request found unmerged after its checks passed, or a
      re-run the watch did not print. Either means GitHub is not holding what
      the verb handed it, or the key is still the verdict.
    rationale: |-
      Christopher: the next Issue after the reviewer loop, because the loops
      that follow merge on green and would pay #76's wait on every Issue.
