decisions:
  - id: work:decision/288
    name: "DR-288 · A clean rebase onto trunk preserves a reviewer's APPROVED verdict"
    challenge: work:challenge/948
    status: ADOPTED
    applies:
      - work:article/18
      - work:article/22
    enacted_in:
      - work:artifact/meta-lib-move-manager-ranking
      - work:artifact/meta-checks-probes-loops-merge-manager
    context: >-
      `check_reviewer_approval` in `.meta/lib/move/manager/ranking.py` accepts a
      reviewer's latest `APPROVED` review by state alone without comparing it to
      `pull.get("headRefOid")`. Solorepo's #905 merged on an approval given at
      `56a50a0` after two rebases had moved its head to `7cf0b88`. Solorepo's
      Challenge #948 was filed to settle whether a rebase invalidates a
      reviewer's prior approval, and if not, what does.
    alternatives:
      - name: Automatically invalidate approvals on rebase or head movement
        chosen: false
        reason: >-
          Requiring re-review after every rebase creates excessive review churn
          and merge-queue starvation. In an autonomous merge queue where landed
          pull requests frequently cause clean rebases on remaining queued
          branches, invalidating approvals would repeatedly bounce qualified
          branches back to reviewers without any semantic code conflict.
      - name: Preserve a reviewer's APPROVED verdict across clean rebases onto trunk
        chosen: true
        reason: >-
          A clean rebase onto trunk preserves the reviewer's approval so long as
          the branch remains clean and passes all required status checks. Code
          integrity is verified by the verification gates running on the rebased
          head commit rather than by re-soliciting human or agent review for
          mechanical lineage updates.
    consequences:
      - >-
        `check_reviewer_approval` preserves standing `APPROVED` reviews across
        clean rebases onto trunk without requiring `headRefOid` matching.
      - >-
        A review is invalidated only when explicitly dismissed on GitHub or when
        changes or a re-review are requested.
      - >-
        All required gate status checks must run and pass on the rebased head
        before the pull request is eligible to merge.
    falsifier: >-
      A clean rebase onto trunk that invalidates a reviewer's `APPROVED` verdict
      in the absence of new requested changes or review requests, or a merge of
      a rebased pull request whose status checks failed on the rebased head
      commit.
    rationale: |-
      GitHub reviews represent semantic evaluation of proposed changes against
      repository invariants. When a branch rebases cleanly onto trunk without
      conflicting, the semantic delta of the branch remains intact. Gate checks
      on the rebased head provide the verification of compatibility with trunk.
      Invalidating approval on clean rebases would starve the merge queue and
      force redundant review passes without safety benefit.
