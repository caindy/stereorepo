decisions:
  - id: work:decision/272
    name: "DR-272 · Reserve the root verb surface for operator flags and identifiers by scoping search to skills"
    status: ADOPTED
    supersedes:
      - work:decision/194
    applies:
      - work:article/8
      - work:article/22
      - work:decision/259
    enacted_in:
      - work:artifact/justfile
      - work:artifact/meta-lib-render-writers
      - work:artifact/meta-lib-render-skills
      - work:artifact/meta-lib-search-build
      - work:artifact/skill-search
      - work:artifact/skill-technical-writing
      - work:artifact/agents
      - work:artifact/template-agents
    context: >-
      DR-259 established that the root `justfile` verb surface takes
      only flags, subcommands, and atomic identifiers, and that bare multi-word
      prose positionals are prohibited on the Local Operator Plane (stereorepo's
      DR-252). While DR-259 resolved Challenge #485 by removing `just
      wikisplain`, it left `search *args:` on the root verb surface, forwarding
      `{{args}}` unquoted to `.meta/search.py`. In `search.py`, `nargs="*"` was
      accepted and rejoined into a query string via `" ".join(args.query)`,
      preserving the tolerant-tool workaround pattern DR-259 explicitly
      rejected.

      Challenge #764 identified that this discrepancy created an
      inconsistent argument-passing contract on the operator surface: callers
      typing `just search "foo bar"` had their quotes discarded by `just`'s
      unquoted interpolation and silently reassembled by Python, violating
      Article 22. Furthermore, search is a retrieval workflow taking
      bare prose queries; maintaining a variadic bare-query recipe on `just`
      conflicted with the boundary established in DR-259 reserving the root verb
      surface for verification gates, compilers, and status queries.
    alternatives:
      - name: Retain tolerant-tool argument rejoining in search.py behind just search
        chosen: false
        reason: >-
          Leaving `just search *args:` forwarding unquoted arguments into
          `.meta/search.py`'s `nargs="*"` reassembly preserves an undeclared
          argument-passing contract on the root verb surface, violating
          Article 22. DR-259 counted `search` among the "ten variadic
          recipes that accept flags, subcommands, or atomic identifiers" it left
          behind, having found that "only `wikisplain` took bare prose
          positionals"; Challenge #764 exists because that reading
          was wrong about `search`, which takes a bare multi-word prose query.
      - name: Restrict just search to a single atomic query token
        chosen: false
        reason: >-
          Constraining the `just search` recipe signature to a single mandatory
          argument (`query`) prevents unquoted multi-word splats, but fails when
          callers pass queries containing spaces without quotes or with quotes
          stripped by shell invocations, and artificially restricts searching to
          single-word lookups unless clumsy escaping is used. Search queries are
          inherently natural language prose and belong in dedicated tools rather
          than operator recipes.
      - name: Reserve the root verb surface for operator flags and identifiers by scoping search to skills
        chosen: true
        reason: >-
          Removes `search` from the root `justfile`, so the surface holds what
          DR-259's contract says it holds rather than what DR-259's count
          assumed it already held. Search
          workflows are routed to the dedicated `/search` skill, which carries
          the invocation the recipe held — `uvx --python 3.13 --with linkml
          --with pyyaml python .meta/search.py "<query>"` — where execution
          preserves caller quotation in `sys.argv` without intermediate shell
          interpolation. Partially supersedes DR-194's `just search` recipe
          while preserving `search.py`'s `nargs="*"` rejoining behavior as an
          ergonomic convenience for interactive terminal users.
    consequences:
      - >-
        The `search *args:` recipe is removed from `.meta/lib/render/writers.py`
        and the root `justfile`, leaving nine variadic recipes that strictly
        accept flags, subcommands, or atomic identifiers.
      - >-
        Partially supersedes DR-194's consequence providing the `just search`
        recipe, routing search to the dedicated `/search` skill while preserving
        `search.py`'s `nargs="*"` rejoining behavior for direct terminal
        callers.
      - >-
        The `/search` skill is asserted as the `description` and `preamble` of
        `work:artifact/skill-search` in
        `.meta/assertions/imported/structure.yaml` and rendered through
        `.meta/lib/render/skills.py`'s `authored_skill()`, which wraps the
        `authored(target, slot)` reader DR-144 settled, to
        `.claude/skills/search/SKILL.md` and
        `.meta/.apm/skills/search/SKILL.md`, carrying the dependency-bearing
        invocation the recipe held (`uvx --python 3.13 --with linkml --with
        pyyaml python .meta/search.py "<query>"`) and its options (`--limit`,
        `--detail`, `--json`, `--benchmark`). The recipe's contract included an
        execution environment as well as an argument vector, and the skill is
        now the only place carrying it: `.meta/lib/search/build.py` imports
        `yaml` at module scope and reaches the assertions through
        `checks.collect`, which imports `linkml_runtime`.
      - >-
        `.meta/lib/search/build.py` warns on stderr where `linkml_runtime` is
        absent and the assertions go unindexed, which its docstring already
        promised and only the exception path delivered, so a wiki-only index is
        never presented as a search of the whole corpus.
      - >-
        The `/technical-writing` skill's asserted preamble in
        `.meta/assertions/imported/structure.yaml` is updated to route search
        queries to the `/search` skill rather than to `just search`.
      - >-
        AGENTS.md and template/AGENTS.md are updated to clarify that authoring
        and search workflows with prose arguments belong in dedicated agent
        skills rather than the root operator surface: authoring on stereorepo's
        DR-259's authority, search on this entry's.
    falsifier: >-
      A recipe added to the root `justfile` that accepts bare multi-word prose
      positionals, or a retrieval workflow taking prose queries exposed as a
      `just` recipe rather than mediated through an agent skill or direct tool
      execution.
    rationale: |-
      Option A adopted by solo (@caindy) on Challenge #764: following
      the precedent set by wikisplain in DR-259, removing `just search`
      from the root `justfile` restores plane cohesion to the Local Operator Plane
      under DR-252. Searching belongs in a dedicated `/search` skill or
      directly via `python3 .meta/search.py`, preserving the root `just` operator
      surface strictly for subcommands, flags, and atomic identifiers.
