decisions:
  - id: work:decision/138
    name: "DR-138 · The checker's watch exits on actionable events, so any harness that resumes on command completion is woken"
    challenge: work:challenge/178
    status: ADOPTED
    supersedes:
      - work:decision/102
    applies:
      - work:article/16
      - work:article/18
    enacted_in:
      - work:artifact/meta-check-pr
      - work:artifact/meta-render
    alternatives:
      - name: Keep the infinite polling loop and rely on stdout-streaming monitors
        chosen: false
        reason: >-
          DR-102 chose this, assuming every harness could keep a background
          process alive and be woken by a line it prints. But that assumption
          is false for harnesses (like Antigravity) that execute background
          commands asynchronously and resume the agent only when the command
          completes. A watch that loops forever prints the review and sleeps,
          leaving the agent asleep and defeating PR First's requirement that
          a review be answered when it lands.
      - name: Exit on actionable events and completion
        chosen: true
        reason: >-
          `check_pr.py <n> --watch` polls GitHub and exits 0 as soon as an
          event requiring coder action arrives (a new review from another author,
          a new unaddressed comment or thread, a check failure, or PR
          merge/closure). Exiting with code 0 on an actionable event completes the
          background task, waking any harness that resumes on process exit,
          while also waking stdout-streaming monitors and preventing orphan
          polling processes from accumulating across review rounds.
    consequences:
      - >-
        `check_pr.py --watch` exits 0 on a new review by someone else, a new
        unaddressed comment or thread comment, a failed check, or PR merge/close.
    falsifier: >-
      An actionable review or comment lands on a watched pull request and
      the watch does not exit, or an intermediate non-actionable state change
      (like a single check starting) causes premature exit.
    rationale: |-
      DR-102 established the checker's watch as a command to keep a session
      subscribed without improvising ad-hoc polling loops. However, DR-102's
      falsifier — "A review that landed while the watch was running and a
      conversation that was not woken by it" — was triggered on #176.
      Because background commands in Antigravity only trigger agent invocations
      upon completion, a process that never exits never wakes the conversation.
      Exiting when an actionable event lands ensures that the watch finishes its
      subscription turn and wakes the agent immediately.
