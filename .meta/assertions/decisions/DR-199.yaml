decisions:
  - id: work:decision/199
    name: "DR-199 · Actor prototypes decouple from execution models, reserving Personality for conversational register"
    challenge: work:challenge/342
    status: ADOPTED
    applies:
      - work:article/8
      - work:article/15
    enacted_in:
      - work:artifact/meta-work-actors
      - work:artifact/meta-apm-readme
      - work:artifact/meta-assertions-imported-vocabulary
    context: >-
      While resolving APM agent primitive generation (.apm/agents/<name>.agent.md)
      under solorepo's #342 and #28, tension arose regarding where the inference
      model is specified. In Microsoft APM canon, agent primitives carry an
      explicit `model:` field in frontmatter alongside prompt instructions and tools.
      However, solorepo's design-time Actor ontology (.meta/work/actors.yaml)
      modeled Personality purely as character prose without an execution engine,
      while workflows dynamically manage models, thinking budgets, and quota
      failovers across harnesses (solorepo's DR-188, .meta/depth.py, .github/workflows/coder.yml).
      Hardcoding concrete models on Actor prototypes in assertions would create
      fragile, false bindings that break during dynamic escalation, quota fallback,
      or harness upgrades.
    alternatives:
      - name: Hardcode concrete execution models on Actor prototype assertions
        chosen: false
        reason: >-
          Hardcoding specific models (e.g., `gemini-3.8-flash` or `claude-opus-5`)
          on Actor prototypes in .meta/assertions/imported/actors.yaml creates a
          confident falsehood the moment a task escalates depth, triggers a quota
          failover, or runs across another harness.
      - name: Conflate Persona and Personality to bind models directly to character prompts
        chosen: false
        reason: >-
          Violates Alan Cooper's Goal-Directed Design (solorepo's DR-019, solorepo's DR-041).
          A Persona is who the product is designed for (human user archetype, e.g.,
          "The Solo"), while a Personality is the character an agent presents while
          working. Tying models to Personas corrupts the user model with machine mechanics.
      - name: Decouple Actor prototypes from execution models and ground Personality in conversational voice
        chosen: true
        reason: >-
          Actor prototypes in .meta/assertions/imported/actors.yaml declare division
          of labor (Personality + Identity) without binding concrete model instances.
          Execution models remain dynamically governed by the depth pipeline
          (solorepo's DR-188) and workflow runners. Personality remains substrate-agnostic
          prose whose `communication_style` directs conversational voice (turns, PR
          review threads, issue discussions), while durable artifact authoring is
          governed by repository Disciplines (solorepo's DR-198). APM agent compilation
          targets portable prototypes, allowing model bindings to late-bind per harness.
    consequences:
      - >-
        .meta/work/actors.yaml clarifies that Actor prototypes declare division of labor,
        while execution models and capability tiers bind dynamically at runtime.
      - >-
        .meta/work/actors.yaml and .meta/assertions/imported/actors.yaml clarify that
        Personality.communication_style is explicitly a directive to the Actor on its
        conversational register in dialogue, distinct from durable authoring governed by Disciplines.
      - >-
        .meta/assertions/imported/vocabulary.yaml updates definitions of Actor and Personality
        to reflect prototype semantics and conversational voice.
      - >-
        APM agent compilation generates portable agent definitions that late-bind models
        to the executing harness rather than hardcoding static model endpoints.
    falsifier: >-
      An Actor prototype assertion that hardcodes a specific vendor model string,
      or an agent that confuses its conversational communication style directive with
      license to alter durable Diátaxis code contracts.
    rationale: |-
      An Actor prototype is a design-time division of labor: who speaks, with what
      identity, and in what character. The model engine executing that Actor is an
      operational substrate determined dynamically at runtime by task difficulty,
      critical path depth (solorepo's DR-188), and harness availability.

      Decoupling Actor prototypes from hardcoded models preserves late-binding (solorepo's DR-007).
      Furthermore, affirming that Personality governs conversational voice while
      Disciplines govern durable files cements the two-regime writing standard
      (solorepo's DR-198).
