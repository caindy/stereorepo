decisions:
  - id: work:decision/141
    name: "DR-141 · The runner ceiling is one gate run's width plus the loops beside it, and the machine has room for eight"
    challenge: work:challenge/186
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-arc-values-runnerset
    context: >-
      `maxRunners: 2` was sized under DR-137, when the scale set served
      `coder.yml` and `review.yml` and nothing else, and the comment above it
      argued for itself in exactly those terms: several loop sessions can
      legitimately be eligible at once, so a third queued job means the fleet is
      two. DR-140 then moved every job of every workflow onto the same scale set
      and did not revisit the number. What is eligible at once is no longer a
      handful of hour-long sessions: a pull request's gate is four jobs that
      become eligible at the same instant — `files`, `rust seed`, `python seed`
      and `pull request`, of which `main`'s ruleset waits on three, `gate.yml`
      saying `python seed` is not one yet — `advance` is a fifth pod on every
      push to `main`, and a loop session holds a pod for up to 75 minutes while
      it waits on a model. Doing nothing leaves required checks queueing behind
      work that is not blocking anything, which is measurable and was measured:
      gate runs of 2m36s to 7m33s wall for about 2m15s of work whose longest
      single job is 85 to 107 seconds, the four jobs starting twenty to thirty
      seconds apart because each waits for the one before to free a slot. On
      2026-09-10 the `advance` run for #182's merge sat queued past six minutes
      with both slots held by loops.
    alternatives:
      - name: Leave the ceiling at two
        chosen: false
        reason: >-
          It is the number that made the Issue. Two slots is narrower than one
          gate run, so a pull request's four jobs serialize whatever else the
          cluster is doing, and when a loop session holds a slot they serialize
          into one. The cost is not only the wait: `advance.yml` exists because
          an armed merge left behind is nobody's to notice, and it is now itself
          a pod that queues behind a session with an hour to run.
      - name: Four — one gate run's width, and no more
        chosen: false
        reason: >-
          The arithmetic that the Issue's title suggests and the one that fails
          in the case that matters. Four slots is a whole gate only when the
          loops are idle, which is exactly when the gate was not waiting. A
          `coder.yml` session holding a pod for 75 minutes takes one of the four
          and puts the required checks back to three at a time; two sessions
          make it two, which is where this started.
      - name: A second scale set, so a loop can never hold a required check's slot
        chosen: false
        reason: >-
          The isolation is real and it is the answer if the node ever runs out:
          a ceiling shared between the gate and the loops is a ceiling the loops
          can eat. It is refused now for its surface. It doubles what `deploy`
          installs and what `teardown` removes, adds a second runner name that
          `runs-on:` must get right in four workflows and that Specialization's
          *Copy what is inherited* step must retarget, and splits one node's
          capacity into two
          ceilings that cannot lend to each other — to buy separation that a
          ceiling wide enough for both already gives on a machine with 31 GiB
          and a measured demand under half of it.
      - name: >-
          Raise it far past demand and let Kubernetes decide what the node can
          take
        chosen: false
        reason: >-
          It reads as the cluster-native answer and there is nothing behind it
          here. A runner pod declares no CPU or memory request and no limit, so
          the scheduler has no number to schedule against and will admit every
          pod it is given. The node then finds its own limit the way an
          unbounded node does — memory pressure, an eviction or an OOM kill,
          landing on whichever pod happened to be running, which is as likely to
          be a required check as a loop. An unbounded ceiling is not delegation
          to the scheduler; it is delegation to the kernel.
      - name: Give the runner pod resource requests and limits, then raise the ceiling
        chosen: false
        reason: >-
          The right shape eventually, and a larger change than this one. A
          request is a floor the scheduler enforces, so a pod whose request the
          node cannot meet does not run and does not say so — the silent queue
          this change is trying to shorten, arriving by another door. Setting
          one honestly means a measured floor for each job class rather than the
          single peak that sizes a ceiling, and it changes what a runner is
          allowed to do rather than how many of them there may be. Named in the
          pull request as what makes this number removable.
      - name: >-
          Eight — one gate run's width, plus `advance`, plus three loop
          sessions — checked against the node's measured footprint
        chosen: true
        reason: >-
          It is derived from what becomes eligible at once rather than from what
          a machine is imagined to stand, and the arithmetic is in the file
          beside the number: four jobs of a gate, one `advance`, three sessions.
          The check on it is measurement on the node that runs the cluster — 24
          logical CPUs, 31 GiB — taken on an `arc-runner-set` pod: a Claude Code
          session peaks near 2 GiB and spends 36 CPU-seconds per half hour,
          `python seed` peaks at 1.5 GiB, `rust seed` at 0.7 GiB, `files` at
          0.3 GiB, and a whole gate is about 155 CPU-seconds over 45 seconds of
          wall clock. Eight pods of the heaviest kind is roughly 16 GiB of 31,
          and the gate's own burst is under four of 24 cores. What it costs is
          that the number is now about one node: nothing in the cluster enforces
          it, nothing checks it against the machine it is deployed to, and on a
          smaller machine eight would be discovered by an eviction in the middle
          of a required check.
    consequences:
      - >-
        `maxRunners: 8` in `.meta/arc/values-runnerset.yaml`, with the
        derivation and the measurements in the comment above it. It takes effect
        at the next `just arc` on the machine holding the cluster; nothing in CI
        deploys it, so the change and its effect are separated by a manual step.
      - >-
        A pull request's gate can run at full width beside three loop sessions
        and an `advance`. The floor on gate latency stops being the sum of its
        jobs and becomes its longest one — about 85 to 107 seconds for `rust
        seed`, against the 2m36s to 7m33s measured under a ceiling of two.
      - >-
        The ceiling is now a claim about one node's memory rather than a
        deliberately conservative guess, and it is unenforced in both
        directions. Runner pods still declare no requests and no limits, so this
        line in a values file is the only thing standing between eight pods and
        31 GiB, and a cluster moved to a smaller machine keeps the number and
        loses the reasoning.
      - >-
        A ninth eligible job still queues, and queueing is still not a failure.
        What changed is where the queue starts: at more than one gate run's
        worth of work, rather than inside one.
      - >-
        `minRunners: 0` is untouched. The measured cost of a cold start is
        seconds — one gate job started five seconds after its run was created —
        so what the queue was made of was contention, not pod startup, and
        holding a pod open would have bought none of it.
    supersedes:
      - work:decision/137
    falsifier: >-
      Gate jobs still starting minutes apart with slots to spare, which would
      mean the delay was never contention and the ceiling was never what to
      tune — ARC's listener scaling loop, image pulls or GitHub's own dispatch
      being the real floor. Or the node under memory pressure with eight pods
      up, evicting a runner mid-check: eight measured as fitting and not
      fitting, at which point the answer is requests and limits rather than a
      larger or smaller guess. What would not falsify it: a queue under a burst
      of several pull requests at once, which is a ceiling doing its job.
    rationale: |-
      The number was right and stopped being right without anybody editing it.
      That is the failure worth recording here, more than the value: DR-137
      sized `maxRunners` for the two workflows that were on the scale set, wrote
      the reasoning into the file where it could be read, and DR-140 then
      changed what runs there — all five jobs of `gate.yml`, four of which a
      pull request runs, and an `advance` — while the
      comment went on describing a fleet of loop sessions. A number derived from
      a demand goes stale when the demand moves, and the only defence is that
      the derivation is written down beside it, so the next person to move the
      demand can see what they invalidated.

      So the number here is written as arithmetic rather than as a bound: one
      gate run's four jobs, plus `advance`, plus three loop sessions. Add a
      workflow and the sum is visibly wrong rather than quietly wrong.

      The measurement is what turns the arithmetic into a ceiling this machine
      can carry, and it was taken on the machine, from inside an
      `arc-runner-set` pod, running the gate's own jobs: `uvx ... check.py`,
      `bootstraps/python/render` then `uv run --locked gate`, and
      `bootstraps/rust/render` then `cargo xtask gate` with `cargo-mutants`
      installed the way the workflow installs it. The shape of the answer was
      the surprise. The loops, which hold a pod longest and were the reason the
      ceiling was low, are the cheapest thing running: 36 CPU-seconds per half
      hour, because a session waiting on a model is a process asleep. The gate's
      jobs are the opposite — seconds of wall clock at multiple cores — and they
      are the ones that were queueing. A ceiling that treats a pod as a unit of
      cost charges both the same, which is how two came to be low enough to
      serialize the cheap-to-satisfy half.

      The two wall-clock numbers here measure different things and both are
      right. The 45 seconds is the work, run in a pod that already had the
      toolchains; the 85 to 107 seconds is what a `rust seed` job takes on
      GitHub, because a job installs its toolchain before it can start working.
      Three consecutive unqueued runs put the job at 82 to 87 seconds, of which
      `apt-get install build-essential` is 25 to 27 and `cargo xtask gate`
      itself 49 to 52, the rest being set-up, checkout, rustup and the cache.
      So the CPU-seconds are what size the node and the job durations are what
      the latency floor is made of, and the prediction below is about the
      second. A fourth run, sharing the node with a gate already in flight, took
      150 seconds with `cargo xtask gate` alone at 115 — contention inside a job
      as well as in front of it, and the same thing this change is for.

      What this cannot claim is the after. `maxRunners` takes effect on a `helm
      upgrade` run by hand on the machine, and no run in this repository can
      deploy it or measure what it did. The claim is about capacity — that eight
      pods fit the node, with the footprint to show it — and the latency it is
      expected to buy is stated as a prediction: the gate's floor becomes its
      longest job rather than the sum of them. The falsifier is written so that
      being wrong about that is visible rather than arguable.

      It supersedes one paragraph of DR-137 and no more. That entry sized
      `minRunners` and `maxRunners` "for a machine rather than a fleet", which
      is still exactly right and is what the arithmetic above is an instance of;
      what dies is the sizing itself, made when the scale set carried half of
      what it now carries.
