decisions:
  - id: work:decision/016
    name: "DR-016 · solorepo republishes DDD; portfolios conform transitively"
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-ddd-ontology
    rationale: |-
      An adopted term is defined by the canon and is not ours to redefine,
      so a term has to say which stratum it comes from. Silently
      redefining an established term is worse than minting a new one,
      because the divergence is invisible.

      Minting has a search order. Does DDD already name it? Use it. Does
      solorepo's vocabulary? Use it. Only when neither does is a term
      minted, and that is the explicit decision with the solo.

      Departures must be marked, or transitive conformity breaks silently.
      DR-014 is already one: a single Bounded Context per portfolio, where
      DDD would expect several per system.
