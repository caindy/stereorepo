decisions:
  - id: work:decision/109
    name: "DR-109 · The reviewer Job runs where the review request lands: a workflow on the event, in a container holding one token"
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/19
    enacted_in:
      - work:artifact/github-workflows-review
    alternatives:
      - name: A loop on the solo's machine, polling for requests
        chosen: false
        reason: >-
          Runs only while the laptop does, and beside the coder's token in the
          same directory, which is the falsifier DR-107 kept on the table. It
          would be the reviewer wearing the coder's house.
      - name: A scheduled cloud routine
        chosen: false
        reason: >-
          Runs as the solo's own GitHub account and no other, on an hourly
          floor. Wrong identity for A16, and a wait the event does not have.
      - name: A workflow on `review_requested`, running Claude Code as the Role
        chosen: true
        reason: >-
          The semaphore is the trigger. The run starts when GitHub records the
          request, in a container that holds the reviewer's token and nothing
          of the coder's, which is the boundary DR-073 said this machine cannot
          give and #21 is waiting for. The action posts as the account whose
          token it is given, so what GitHub records is the Role. What it
          costs: a Claude session per request, billed to a subscription token
          or a key kept as a secret; the review prompt living in a workflow
          file until a review Discipline exists to render it from; and the
          action's rule that the requester must hold write access, which the
          coder does.
    consequences:
      - >-
        `review.yml` runs on `review_requested` when the requested login is
        `<owner>-<repo>-reviewer`, per DR-107's convention, computed from the
        repository name rather than written into the file; and on
        `synchronize` while that login's request is still pending, since a
        head that moves after the ask moves the question. A moved head is
        the only thing that cancels a run in progress, whether a push, a
        rebase GitHub performs on a layer, or a retarget moved it. Amended
        on #86, where the trigger gained the second case. The depth of a
        review follows what changed: the boundary gets Opus at high effort,
        everything else Sonnet at medium.
      - >-
        The Trailer holds in the container. `ACTOR_SESSION` is the run id,
        attested by GitHub for one run (DR-086), and `AI_AGENT` is the action
        as pinned. The channel is unchanged: the credential is written where
        `--role reviewer` looks, mode 600, and `whoami` says who before any
        review is written.
      - >-
        Every word the reviewer posts goes through `.meta/say`, so it carries
        the Trailer and the hook stands. The plugin's own `--comment` path,
        which posts through an MCP tool the hook cannot see, is not used.
      - >-
        Two secrets are the solo's to hold: the reviewer's token, with pull
        request write, and a Claude credential. Until they exist the workflow
        runs and fails at `whoami`, which is the honest state.
      - >-
        The arriving side of the semaphore is answered for this Role by the
        event itself; the sweep still does not ask, which #81's parked thread
        records.
    falsifier: >-
      A review posted from the container without the Trailer, or under a login
      that is not the reviewer's. Either means the boundary the container was
      chosen for is not the one the run has.
    rationale: |-
      Christopher: a reviewer loop watching GitHub for review requests and
      using the code-review skill. The request was already the signal PR
      First chose (DR-066); what was missing was the Job that answers it,
      and the place it runs turned out to matter more than the loop.
