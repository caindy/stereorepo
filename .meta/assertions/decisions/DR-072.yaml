decisions:
  - id: work:decision/072
    name: "DR-072 · Agents merge to trunk; the solo cuts release branches"
    status: ADOPTED
    supersedes:
      - work:decision/064
    applies:
      - work:article/16
    alternatives:
      - name: Require an approving review, so the solo merges
        chosen: false
        reason: >-
          It makes every change wait on a human who is not always there, to
          guard a branch that is not what ships. The cost lands on every pull
          request; the risk it guards against lands on none of them, because
          trunk is not production.
      - name: Agents merge to trunk, and a release is a branch the solo cuts
        chosen: true
        reason: >-
          The decision that matters is what ships, and that stays the solo's by
          being a separate act on a separate branch. What it costs is that the
          merge stops being an authorisation moment, so anything that leaned on
          it has to lean on something else.
    consequences:
      - >-
        `required_approving_review_count` stays at zero and the ruleset is
        unchanged.
      - >-
        DR-064's promotion rule loses the authorisation it named. Asking for the
        merge was the solo's assent to promoting a parked conversation; an agent
        that can merge cannot assent on the solo's behalf.
      - >-
        What holds it instead is A16 and `say resolve`, which refuses a thread
        this Actor is the sole author of. A parked item still cannot be walked
        past without the solo — the control moved from the merge to the thread,
        which is the more local place for it anyway.
      - >-
        Release branching is not built. Nothing cuts, names or protects a
        release branch yet.
    falsifier: >-
      Something reaching production that no one chose to release. That would
      mean trunk was production after all, and the merge needed the guard.
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-checks-probes-tools-search
    rationale: |-
      The reason is the release strategy rather than the merge: **branch
      for release**. Trunk is where work lands; what ships is a branch cut
      deliberately. Guarding the merge would put a gate on the step that
      is not the decision.

      It takes something out of DR-064, which made promotion-at-merge work
      by treating the request to merge as the solo's assent. An agent that
      merges on its own cannot receive that authorisation, so the sentence
      stops being true.

      It matters less than it looks, because the control had already
      moved: `say resolve` refuses when this Actor wrote the whole thread,
      so a parked conversation still cannot be cleared without the solo.
      The gate is the thread, and the thread is where the argument is
      anyway.
