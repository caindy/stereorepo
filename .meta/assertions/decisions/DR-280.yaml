decisions:
  - id: work:decision/280
    name: "DR-280 · Centralize execution routing strategy across reviewer and coder harnesses"
    status: WITHDRAWN
    withdrawn_because: "Minted on solorepo's #934 for an ordered execution plan the static step ladders could not run in every order the policy resolved, and reviewed by a door that did not emit its outputs. That pull request was superseded by solorepo's DR-281, which answers the same question with one harness runner and order as a policy table, landed in two layers; this number is held by its reservation tag and issued to nothing."
    rationale: |-
      The question was the right one and the number was spent on the wrong
      answer, which is what the withdrawn entry records: solorepo's #928 counted
      six places routing was written and asked for one, and the first pull
      request to try put the order in step conditions, where GitHub Actions
      cannot reorder anything at run time. What survived of it was read into
      DR-281 on its own review. The reservation outlives the pull request, as
      solorepo's DR-128 says a minted number does, so nothing issues 280 again.
