decisions:
  - id: work:decision/157
    name: "DR-157 · Workflow runtime is read locally by the solo's token, so no portfolio inherits an Actions scope to measure itself"
    challenge: work:challenge/247
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-timing
      - work:artifact/meta-check
      - work:artifact/justfile
      - work:artifact/meta-render
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-probes-tools
      - work:artifact/meta-checks-probes-tools-timing
      - work:artifact/meta-lib-timing
    context: >-
      Nothing reported what a workflow costs in time. `next.py`'s `loops()`
      reads the last run of each of the four workflows and prints its verdict
      and when it started, which answers whether a loop is idle and not what it
      cost, so latency was known as an impression. solorepo's #244 is about to remove a
      bootstrap it estimates at 45 to 120 seconds a job, with nothing in the
      repository that would show it worked or show it regressing afterwards.
      A run's duration is an Actions read, and solorepo's DR-153 had just refused
      `actions: read` in the gate workflows — so the obvious shape, a job that
      measures the workflows, was closed before this was asked.
    alternatives:
      - name: "Grant `actions: read` and report runtime from the gate"
        chosen: false
        reason: >-
          It puts the figure where the change lands, and a regression could
          fail the run that caused it. It also reopens solorepo's DR-153 on precisely the
          ground DR-153 refused it — that a scaffold hands a fresh clone
          whatever scope its gate declares, permanently and with no trace of
          why. The scope would be wider here than there: DR-153 declined a
          scope no reader here used, and this would be a scope one reader
          uses, which is the harder version of the same argument to undo
          later. A measurement is not worth widening the seed's token.
      - name: Each workflow records its own duration into a committed record
        chosen: false
        reason: >-
          It needs no Actions read at all — a job knows its own start — and it
          would outlive GitHub's run retention, which a live read cannot. But
          it makes every run a writer to the repository: concurrent runs
          contend on the push, and the history fills with timing commits that
          no Challenge asked for. A measurement that changes the record it
          measures is the wrong side of the trade for something whose whole
          purpose is to be consulted occasionally.
      - name: A command the solo runs, reading GitHub with the solo's own token
        chosen: true
        reason: >-
          The read that CI may not make is one the solo makes every day. Run
          from a terminal it needs no permissions block, grants no scope in the
          seed, writes nothing, and leaves solorepo's DR-153 standing exactly as written.
          What it gives up is enforcement and history: nothing refuses on a
          regression, and the window is whatever GitHub still holds. Both are
          the right thing to give up now, because a threshold has to be per
          repository — Specialization's second step retargets every `runs-on:`
          from `arc-runner-set` to `ubuntu-latest` — and no number measured
          here would mean anything there.
    consequences:
      - >-
        `.meta/timing.py` is the program and `just timing` its recipe, beside
        `.meta/next.py` and `just next`, which it is the runtime half of. The
        recipe is written in `render.py`'s `justfile()` and not in the file,
        which carries solorepo's DR-106's header saying so: a recipe added by hand
        survives until the next render and then is not there.
      - >-
        It is named in Specialization's second step, so a portfolio inherits
        it. A program that sat in `.meta/` without being named there would not
        travel: the step enumerates what is copied rather than naming a
        directory.
      - >-
        It reports and refuses nothing. No threshold is carried, because the
        figures are a property of this repository's runners and not of the
        work.
      - >-
        Waiting and running are reported apart, read off the job that finished
        last. A run's jobs neither start together nor finish together, so the
        earliest start reports the luckiest job: on run 34561479681 `python
        seed` had a runner in five seconds while `files` and `rust seed`
        waited two minutes forty-nine for a pod, and the run was not over until
        those finished.
      - >-
        `pick` is nearest-rank by `ceil` and not by `round`, and `gh`'s "no
        default" is a sentinel object and not `None`. Both are probed in
        `check.py`'s `timing probes`, because both were written the other way
        and both were wrong in the ordinary case rather than an edge: five runs
        is `--deep`'s default, and a default of `None` is what the caller on
        the tokenless path asks for.
      - >-
        A job GitHub never ran is excluded by having no steps rather than by
        arithmetic. A skipped job carries a `completedAt` before its
        `startedAt` — `sweep` on that run completed at 04:14:46 having started
        at 04:17:30 — which a duration clamped at zero would report as instant.
    falsifier: >-
      A portfolio wanting this to refuse rather than report, which would mean
      the per-repository objection to a threshold was weaker than the cost of
      noticing a regression by hand; or a run whose `total` is not near its
      `wait` plus its `run`, which would mean the job that finished last is not
      the one the run waited on and the decomposition names the wrong job.
    rationale: |-
      The question was where a measurement may read from, given that the read
      it wants is the one solorepo's DR-153 had just refused the gate.

      DR-153's reason is about the seed and not about this repository: a scope
      in a scaffold's gate is copied into every portfolio with no trace of why,
      and a year later reads as a scope the gate needs. That reason does not
      reach a command typed by a person, because nothing about it is inherited
      except the file — a portfolio that never runs `just timing` has granted
      nothing by holding it.

      So the constraint chose the shape rather than fighting it, and the shape
      it chose is the one already here: `next.py` is a local read of the same
      API, degrading when its token cannot list runs, and this is its runtime
      half. The two together are one screen about the loops — whether they are
      moving, and what they cost.

      What the shape gives up is worth saying plainly, because both are things
      somebody will want. There is no enforcement, so a regression is noticed
      when somebody looks. And there is no history, so the window is whatever
      GitHub retains: solorepo's #244's before and after has to be read while its runs
      are still there. Neither is load-bearing, and both can be added by a
      decision that names this one.
