decisions:
  - id: work:decision/055
    name: "DR-055 · PR First gets its mechanics, and the form is the only copy"
    status: ADOPTED
    applies:
      - work:article/15
    alternatives:
      - name: "A checker with its own list of required headings"
        chosen: false
        reason: "It would drift the first time either moved, and the drift presents as a check that had quietly stopped asking for something."
      - name: "Derive the requirements from the form's own fence"
        chosen: true
        reason: "Adding a heading to the form makes it required by that act alone."
    consequences:
      - "Neither generated file carries the generated-by banner: the issue template's front matter must lead the file, and a banner in the pull request form would ride along in every body."
      - "The merge trail is a repository setting, not a check."
      - "Two defects were found by watching it fail: `BULLET` compiled without `re.M`, and a placeholder rule that flagged `Map<K, V>`."
    falsifier: "A well-formed body the checker rejects, or a body missing a heading it accepts."
    enacted_in:
      - work:artifact/meta-templates-pull-request
    rationale: |-
      The Discipline was worth exactly as much as the path was real, and
      the path did not exist.

      The forms are the source: each holds its form in a fenced block,
      `render.py` extracts the fence, and `check_pr.py` derives what it
      requires from the same fence. A checker with its own list would
      drift the first time either moved, and the drift presents as a check
      that had quietly stopped asking for something — the failure this
      repository keeps finding in itself.

      It is a separate command from `check.py` because it has a separate
      lifecycle: files or GitHub, offline or not, always or only on a pull
      request.
