decisions:
  - id: work:decision/254
    name: "DR-254 · Giving the Antigravity CLI reviewer a working path to /pr-first-reviewer and single-session review discipline"
    challenge: work:challenge/637
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/19
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/meta-detect-fallback
      - work:artifact/meta-checks-files-reviewer
    context: >-
      DR-107 established the reviewer as a dedicated Role account answering review requests.
      DR-245 restored Gemini fallback in CI by executing Antigravity CLI (`agy`) inside self-hosted
      ARC runner pods. In `.github/workflows/review.yml`, the fallback review prompt instructed the
      session to "Read /pr-first-reviewer first" and invoke `/code-review:code-review` while delegating
      passes to concurrent foreground subagents. These instructions assumed Claude Code's native `Skill`
      and blocking `Agent` tools.

      Under Antigravity CLI, skills exist as workspace markdown files under `.agents/skills/`, and subagents
      spawned via `invoke_subagent` run asynchronously in the background. In headless batch mode
      (`agy -p "$PROMPT"`), yielding the turn to await background subagent notifications terminates the
      CLI process immediately before a review verdict is posted, failing step 18 ("the verdict landed").
      Challenge #637 demanded settling how the reviewer Role reads its governing discipline and conducts
      reviews under Antigravity CLI.
    alternatives:
      - name: Retain Claude Code prompt and rely on APM compile into .gemini/skills
        chosen: false
        reason: >-
          Inert under Antigravity CLI: agy discovers workspace customizations from `.agents/skills/`, not
          compiled APM directories, and Claude's `/code-review:code-review` plugin does not exist in agy.
          Furthermore, background subagent delegation causes premature batch turn exits.
      - name: Serve disciplines and review passes via external Model Context Protocol (MCP) servers
        chosen: false
        reason: >-
          Introduces substantial deployment and network complexity into ARC runner pods to solve a problem
          already served by local workspace files and standard shell tools.
      - name: Direct skill reading via read_file, single-session evaluation, and mechanical subagent denial
        chosen: true
        reason: >-
          Directs the Antigravity reviewer to read `.agents/skills/pr-first-reviewer/SKILL.md` directly via
          the Read tool (`read_file`). Adapts the prompt to evaluate the diff across all dimensions (including the Technical
          Writer rubric) in a single top-level turn without spawning subagents. Mechanically denies
          `invoke_subagent(*)` in `.meta/detect_fallback.py` to prevent premature asynchronous batch exits,
          and renames the step to "review the pull request (agy)" for clarity.
    consequences:
      - >-
        `.github/workflows/review.yml` updates the fallback review step display name to "review the pull
        request (agy)" and provides the explicit worktree path `.agents/skills/pr-first-reviewer/SKILL.md`
        to read using the Read tool.
      - >-
        `.github/workflows/review.yml` removes Claude-specific plugin syntax (`/code-review:code-review`)
        and instructions for concurrent subagent spawning, requiring direct in-session evaluation across diff
        dimensions before turn completion.
      - >-
        `.meta/detect_fallback.py` appends `invoke_subagent(*)` to `REVIEWER_DENIED_PERMISSIONS`,
        mechanically preventing subagent spawning during reviewer fallback under Antigravity CLI.
      - >-
        `.meta/checks/files/reviewer.py` verifies that `invoke_subagent(*)` is audited and enforced
        in reviewer settings synthesis.
      - >-
        Closes #637.
    falsifier: >-
      A reviewer run under Antigravity CLI attempting to invoke subagents, failing to locate
      `/pr-first-reviewer`, or terminating without posting a verdict due to asynchronous turn yielding.
    rationale: |-
      The reviewer Role's authority derives from solorepo's DR-107 and its governing Disciplines. Under
      Antigravity CLI, providing the concrete worktree path to `.agents/skills/pr-first-reviewer/SKILL.md`
      delivers identical normative guidance as Claude Code's Skill tool without requiring extraneous harness
      shims. Because headless Antigravity CLI exits upon top-level turn completion, single-session evaluation
      paired with mechanical subagent denial ensures deterministic review execution and verdict delivery.
