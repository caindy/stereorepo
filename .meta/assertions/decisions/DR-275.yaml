decisions:
  - id: work:decision/275
    name: "DR-275 · The operator boundary reaches a composite action's run: step, and the runner image carries just"
    challenge: work:challenge/830
    status: ADOPTED
    applies:
      - work:article/8
      - work:article/22
      - work:decision/140
      - work:decision/160
      - work:decision/252
    enacted_in:
      - work:artifact/meta-actions-pull-request
      - work:artifact/meta-actions-sweep
      - work:artifact/justfile
      - work:artifact/meta-lib-render-writers
      - work:artifact/meta-checks-files-justfile
      - work:artifact/meta-checks-files-workflows
      - work:artifact/meta-checks-files-boundary
      - work:artifact/meta-checks-probes-files-boundary
      - work:artifact/github-workflows-gate
      - work:artifact/github-workflows-review
      - work:artifact/template-github-workflows-gate
    context: >-
      Solorepo's DR-252 partitioned repository operations across three planes and
      framed the mischief it corrects around what a session should type: its
      falsifier names "an agent harness invoking an internal script under
      `.meta/` directly". Solorepo's #827 and solorepo's #834 aligned the coder's
      and the reviewer's prompts accordingly. Two invocations survived, and
      Challenge solorepo's #830 raised them together.

      The first is the reviewer's tool grant. `.github/workflows/review.yml`'s
      `--allowedTools` listed `Bash(python3 .meta/check_pr.py:*)` beside
      `Bash(just pr:*)`, so the prompt taught the recipe while the grant kept the
      script reachable — a rule stated in prose and unstated in the one place
      that enforces it.

      The second is infrastructure rather than an agent's choice.
      `.meta/actions/pull-request/action.yml` ran `python3 .meta/check_pr.py
      "$PR"` and `.meta/actions/sweep/action.yml` ran `python3
      .meta/check_pr.py --all --publish` and `python3 .meta/next.py --check`. No
      agent types these; a workflow job does, once, through a `uses:`. Whether
      solorepo's DR-252's boundary reaches them was settled by nothing in the
      tree, and the reviewer's verdict on solorepo's #830 named it as a decision
      owed.

      Extending the boundary there is not a text substitution. `just` was
      provisioned nowhere under `.meta/actions/`, and the sweep's `--all
      --publish` mode had no recipe at all: the `sweep` recipe wraps `--sweep`,
      which is what this branch owns rather than every open pull request. The
      scaffold's own jobs already have `just`, because the scale set's runner
      pods run the single-source runner image (solorepo's DR-160), which bakes
      it; a portfolio's `ubuntu-latest` does not, and the scale set accepts no
      `container:` job, having no container mode configured in
      `.meta/arc/values-runnerset.yaml`.

      The class solorepo's #830 settled was the gate's own invocation: the two
      composite actions' `run:` steps and the reviewer's tool grant. It was not
      every `run:` step in the tree that invokes a `.meta/` script owning a
      recipe, and the falsifier was scoped so that it reported drift from what
      had been decided rather than firing on the day of adoption. The wider
      class stood open beside it. `.github/workflows/review.yml`, `coder.yml`
      and `triage.yml` each ran `python3 .meta/apm_compile.py --reconcile` where
      `just apm --reconcile` exists; `release.yml` ran `.meta/gate`,
      `apm_compile.py validate` and `test_specialization.py`, the last of which
      `test-specialization.yml` ran too; and
      `template/.github/workflows/gate.yml`'s `gate` job ran `.meta/gate`.

      Solorepo's #915 converted those call sites to their recipes, and
      solorepo's #921 raised what that left behind: a converted site with no
      check standing behind it, revertible the next day with CI green, and a
      scoping sentence here naming as exceptions three files that had stopped
      being any. The solo settled the widening on solorepo's #921. The falsifier
      covers every `run:` step under `.github/workflows/` as well as under
      `.meta/actions/`, and a gate step asserts it, the tools it reads coming
      off the root `justfile` rather than a list, so that a recipe added
      tomorrow brings its own call sites under the rule.

      Two exclusions survive the widening, and are named here rather than left
      to reading. `.meta/say/` is the Attested Mutation Plane (solorepo's
      DR-252), which `advance.yml` and `merge.yml` address directly by design,
      so a recipe wrapping one of its verbs — `merge-manager` — is an operator's
      convenience rather than the one statement of how CI runs it. And
      `template/.github/workflows/` holds a portfolio's files rather than files
      that run here: its `gate` job still types `.meta/gate`, and the third
      clause of the falsifier below is what reads that workflow.
    alternatives:
      - name: Read the boundary as reaching only what a session types, and leave the action.yml run steps
        chosen: false
        reason: >-
          The boundary's purpose is that one command line states how a check is
          run, so that the operator surface and CI cannot drift apart. A `run:`
          step calling the script directly is the second statement: the recipe
          may gain a flag, an interpreter pin or a dependency and CI keeps the
          old invocation, and nothing reports the divergence. It also teaches by
          example — the composite actions are among the files an agent reads to
          learn what the gate is, and what they show is the bypass. Leaving them
          keeps the exemption at "infrastructure", which is a category no check
          can read.
      - name: Give the scaffold's own pull request and sweep jobs a container of their own, so every job provisions just alike
        chosen: false
        reason: >-
          The scale set runs no container mode — `.meta/arc/values-runnerset.yaml`
          configures neither `dind` nor the Kubernetes container hook — so a
          container job would not start. The provisioning the scaffold needs is
          already done one level down, the runner pod itself being the image, and
          holding `container:` equal across the two gate workflows would force the
          scaffold to name a mechanism its machine does not have, which is
          solorepo's DR-140's argument about `runs-on:` said of the line beside it.
      - name: Take just in the composite actions' run steps, carry just on the runner image, and drop the reviewer's script grant
        chosen: true
        reason: >-
          States the gate once, as `just pr <n>`, and has CI and a session type
          the same line. The provisioning question has one answer everywhere —
          the single-source runner image (solorepo's DR-160) — reached as the pod
          on the scaffold's scale set and as `container:` on a portfolio's hosted
          runner, so `container:` joins `runs-on:` as a property of the machine
          rather than of the job. And the reviewer's grant is narrowed to what
          the prompt already teaches, which moves the rule from prose into the
          one place that enforces it (solorepo's Article 22).
    consequences:
      - >-
        `.meta/actions/pull-request/action.yml` runs `just pr "$PR"` and
        `.meta/actions/sweep/action.yml` runs `just pr-all` and `just next
        --check`, so both composite actions type the gate as the Local Operator
        Plane types it. Both travel with `.meta/` into a portfolio
        (solorepo's DR-120), which therefore needs `just` on the runner its gate
        workflow names.
      - >-
        `.meta/lib/render/writers.py` renders a `pr-all` recipe carrying the
        sweep's `--all --publish` mode, which had no recipe before, and widens
        `next:` to `next *args:` so that `--check` reaches `.meta/next.py`.
        `.meta/checks/files/justfile.py`'s `CONTRACT` declares both: `pr-all`
        takes nothing and `next` takes a `FLAGS` tail, neither taking prose
        (solorepo's DR-259, solorepo's DR-272).
      - >-
        `template/.github/workflows/gate.yml` gives its `pull request` and
        `sweep` jobs `container: ghcr.io/caindy/solorepo-runner:2.337.0-4`, and
        `.meta/checks/files/workflows.py`'s `NOT_SHARED` gains `container`, so
        the two gate workflows are held equal on everything but where each job
        runs (solorepo's DR-119, solorepo's DR-140). Equality is the wrong
        instrument for that key and no instrument at all once it is excluded, so
        `gate_workflows_agree` asserts the seed side directly instead: every job
        of the seeded workflow names a `container:`, and all of them name one
        image. Deleting or mistyping either line is what a portfolio would feel
        as `just: command not found` on its first pull request, and it now fails
        here.
      - >-
        `.meta/checks/files/boundary.py`'s `operator boundary` step reads the
        root `justfile` for the tool each recipe wraps, then every `run:` step
        under `.github/workflows/` and `.meta/actions/` for a command whose head
        is one of them, and fails on each. It is what a revert of any converted
        call site back to the script meets, which nothing met before
        (solorepo's #921). `.meta/checks/probes/files/boundary.py` drives it
        against the shapes it must find — a bare tool, an interpreted script,
        one run through `uvx`, one behind an environment assignment, one past a
        shell operator, one in a composite action — and the shapes it must not,
        of which an agent workflow's `prompt:` naming a tool in prose is the one
        the tree holds most of.
      - >-
        `.github/workflows/review.yml`'s `--allowedTools` drops
        `Bash(python3 .meta/check_pr.py:*)`, leaving `Bash(just pr:*)`, so a
        reviewer session that reaches for the script is refused by the grant
        rather than only by the prose.
    falsifier: >-
      A `run:` step under `.github/workflows/` or `.meta/actions/`, or an entry
      of an agent workflow's `--allowedTools`, that invokes an internal script
      under `.meta/` for which a `just` recipe exists, the channel's own verbs
      excepted; or a job of `template/.github/workflows/gate.yml` naming no
      `container:`, or naming a different image from its siblings.
    rationale: |-
      Settled by the solo (@caindy) on Challenge solorepo's #830, which the
      reviewer's verdict had labelled `human` for exactly this question: the
      boundary reaches the composite actions' `run:` steps, `.meta/actions/`
      invokes `just`, and the single-source runner container is named by the
      seeded gate workflow's shared jobs so that `just` is present on every
      runner in the scaffold and in a portfolio alike.
