decisions:
  - id: work:decision/058
    name: "DR-058 · Never issued"
    status: WITHDRAWN
    withdrawn_because: >-
      The number was cited in `roadmap.md` for a decision nobody wrote down —
      the A17 word-counting gate, built and removed in the same change. Writing
      the entry afterwards from the roadmap's account was worse than the gap: an
      entry nobody took is a reconstruction wearing a decision's authority. The
      number stays issued and unused so that the citation resolves to what it
      is.
    rationale: |-
      Nothing was decided here. The gate that this number was cited for is
      described in `roadmap.md` under *A gate for A17*, and the failure it came
      from is A17's own `origin` in the Charter. Both are contemporaneous; this
      is not, and a hole says so where a paragraph would not.
