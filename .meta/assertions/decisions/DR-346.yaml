decisions:
  - id: work:decision/346
    name: "DR-346 · Observed Failure covers Claims as well as guardrails, and Article 23 holds the author to checking one"
    status: ADOPTED
    supersedes:
      - work:decision/229
    applies:
      - work:article/23
    enacted_in:
      - work:artifact/meta-charter
      - work:artifact/meta-assertions-imported-disciplines
    context: >-
      DR-229 widened Observed Failure to Claims and added Article 23, arguing
      from five Claims one agent session made about pull requests, the merge
      path and the channel, all of which are gone. The rule stands on what
      remains: a seat asserts what it has not checked, and the assertion reads
      exactly like a checked one. A seat that writes that a Decision supports
      a statement, which `just dereference` would refute, or that a word is
      agreed, which appears in no vocabulary, or that a probe was verified by
      reverting, where the fake raised what the real call never raises, has
      made a Claim that needed one command and no research. Each such Claim
      is recognised the moment someone asks for it to be checked, which places
      the defect between forming a Claim and writing it down rather than in
      what a seat can find out.
    alternatives:
      - name: State the rule as what the second seat may accept as evidence
        chosen: false
        reason: >-
          It makes the second seat the control, and a reader downstream of the
          author is exactly the control observed to fail: it reads a fluent
          Claim as a checked one. It also leaves the first seat writing the
          defect and the second paying for it.
      - name: A gate over the diff, refusing a Claim with no citation
        chosen: false
        reason: >-
          A gate resolves a citation and nothing about behaviour or history.
          DR-335 weighed a purely mechanical regime and a purely instructional
          one and took neither, adopting a check beside a reading, which is the
          shape Article 23's own `checked_by` takes, and the reason its
          mechanical half is not claimed to reach past a citation.
      - name: A new Discipline for the epistemics of a Claim
        chosen: false
        reason: >-
          Observed Failure already holds them, of checks: a test that passes
          against broken code passed for the wrong reason, and no coverage
          number distinguishes the two. DR-101 refused a Discipline for the
          receipt rule on the ground that a Discipline is a name and the idea
          already had two, calling that rule "Observed Failure and Nothing
          Unconsumed applied to prose", which is this widening, already stated
          once.
      - name: An Article under Observed Failure, and the Discipline widened to say so
        chosen: true
        reason: >-
          The epistemics are identical rather than analogous, so the Discipline
          is widened explicitly and the Article states the obligation. Widening
          is written into the Discipline's description rather than implied by an
          `enforces:` slot, because it changes what a Discipline means and every
          portfolio inherits it.
    consequences:
      - >-
        Article 23 has it that a Claim made without checking is a guess, however
        it turns out; that the check belongs to its author at the moment of
        writing and cannot be delegated to a reader; and that a Claim which
        cannot be checked says so on itself. Its `checked_by` is two-part and
        says so: `just dereference` resolves a Claim citing an Article, a
        Decision or a Discipline, and nothing resolves a Claim about behaviour
        or history.
      - >-
        The Article's falsifier names the hedge as a violation in its own right.
        A Claim marked uncertain where the check was available and cheap is the
        rule wearing its own remedy, and without that clause the marking
        carve-out is a way past checking rather than an honest label.
      - >-
        Observed Failure's description says the same holds of a Claim as of a
        check, and it carries two steps for it: *Check claims before asserting* and
        *Watch refusals stand aside*. The second is the guardrail
        instance of the same Article: a refusal probe with only true positives
        has never been watched failing where it costs most.
      - >-
        `Claim` is in the inherited vocabulary as Toulmin's Claim, with a page
        under `wiki/stereorepo/`. Only that term is taken: `Warrant`,
        `Grounds`, `Backing`, `Credence`, `Rebuttal` and `Qualifier` wait for
        a consumer, since a word with no consumer here is what Nothing
        Unconsumed refuses.
      - >-
        A22 is named in the Article as its complement rather than its general
        case: that Article has the record carry what the next participant
        needs, and this one has the author go and read it.
    falsifier: >-
      A landed Claim about behaviour or history that no seat checked and no
      citation resolves, or a refusal probe that asserts only that the refusal
      fires.
    rationale: |-
      What makes an unchecked Claim dangerous is not that it is often wrong but
      that it is shaped exactly like a checked one. Fluency is indistinguishable
      from knowledge at the point of reading, which is why every control that
      sits downstream of the author fails in the same way, and why the obligation
      has to sit with whoever writes the sentence.
      The cost is not carried by the Claim that is caught. It is carried by the
      reader who catches one and can no longer tell which of the rest were
      checked.
