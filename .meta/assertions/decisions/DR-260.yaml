decisions:
  - id: work:decision/260
    name: "DR-260 · Preserve attribution trailer integrity via multi-harness pre-tool confinement and channel refusal of foreign trailers"
    challenge: work:challenge/639
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/19
    enacted_in:
      - work:artifact/meta-hooks-signed-channel
      - work:artifact/meta-lib-signed-channel-verdict
      - work:artifact/meta-say
      - work:artifact/meta-detect-fallback
      - work:artifact/meta-lib-check-pr-review
      - work:artifact/meta-lib-check-pr-verdict
    context: >-
      DR-086 and Article 19 established that while an account answers who acted,
      the `Actor:` and `Agent:` trailers carry the workload identity answering
      which run performed the work. DR-069 established that signing is a property
      of the channel rather than an act performed by the agent, and DR-233 took
      trailer composition out of the agent's hands in workflow runs: `channel.py`
      composes the trailer strictly from attested workflow variables (`GITHUB_RUN_ID`
      and `ACTOR_AGENT`), ensuring that identity cannot be forged by environment manipulation.

      However, during autonomous rebase passes dispatched for solorepo's #568, runs
      35392391237 and 35393567755 posted comments bearing fabricated trailers
      (comment 5736004158 on solorepo's #568 copying a trailer from an earlier run five hours prior,
      and comment 5736214892 on solorepo's #568 inventing an identifier from a runner directory name).
      Because each comment on GitHub carried exactly one trailer block rather than two,
      the runs did not invoke `.meta/say/post` (which would have appended the attested
      trailer underneath a hand-crafted one). Instead, the autonomous agents executed
      raw `gh pr comment` commands directly in the shell.

      The failure occurred because pre-tool-use hook confinement (`signed_channel.py`)
      was registered solely for Claude Code in `.claude/settings.json`. When Antigravity CLI
      was introduced as an autonomous fallback harness (.meta/actions/agy, solorepo's DR-245),
      no pre-tool hook interception was configured for the coder role, and `agy` ran with
      `--dangerously-skip-permissions`. While solorepo's #682 adapted `worktree_only.py`
      for the reviewer role under Antigravity CLI, `signed_channel.py` remained unadapted
      and unattached to Antigravity CLI.
    alternatives:
      - name: Rely on system prompt prohibitions or silent trailer stripping
        chosen: false
        reason: >-
          Prompt prohibitions are informal constraints that LLMs routinely bypass under
          rebase conflict or error recovery pressure, as demonstrated by run 35392391237.
          Silently stripping hand-crafted trailers in `channel.py` masks agent confusion
          and violates solorepo's core invariant to "refuse rather than guess".
      - name: Retrospectively gate comments against GitHub Actions API run logs
        chosen: false
        reason: >-
          GitHub's REST API comment payloads do not record or attest `workflow_run_id`.
          Attempting to infer run provenance by timestamp correlation across asynchronous,
          concurrent workflows is non-deterministic, fragile, and prone to API rate limits.
      - name: Multi-harness pre-tool hook confinement paired with channel refusal and structural PR auditing
        chosen: true
        reason: >-
          Establishes comprehensive defense-in-depth across the execution, channel, and
          verification planes:
          1. PreToolUse hook confinement: Adapt `.meta/hooks/signed_channel.py` to support
             Antigravity CLI's lifecycle protocol (`toolCall` returning JSON decisions on
             stdout with exit 0, adopting the adapter pattern proven in solorepo's #682)
             alongside Claude Code's stderr/exit 2 protocol. Extend `.meta/detect_fallback.py`
             to synthesize this hook across coder and reviewer roles, carried automatically
             by `.meta/actions/agy`'s existing configuration invocations.
          2. Channel ingestion refusal: In `.meta/say/channel.py::signed()`, refuse input
             bodies that terminate in an unmediated `Actor:` or `Agent:` trailer block
             differing from `trailers()`, while accepting identical trailers idempotently.
          3. Verification plane auditing: Enforce structural trailer validity in
             `.meta/lib/check_pr/` to reject duplicate or malformed trailers on pull request
             comments posted by repository accounts.
    consequences:
      - >-
        `.meta/lib/signed_channel/verdict.py` inspects incoming tool execution payloads
        for Antigravity CLI envelopes (`toolCall`), maps `run_command` and `run_shell_command`
        to command inspection via `reach.blocked()`, sniffs raw streams to ensure malformed
        payloads fail closed, and emits `{"decision": "deny", "reason": "..."}` on stdout
        with exit 0 under Antigravity CLI while maintaining exit 2 on stderr for Claude Code.
      - >-
        `.meta/detect_fallback.py` synthesizes `signed-channel` hook registrations into
        `~/.gemini/config/hooks.json` (under `PreToolUse`) and `~/.gemini/antigravity-cli/settings.json`
        (under `hooks.BeforeTool`), carried across coder and reviewer passes by `.meta/actions/agy`'s
        existing configuration invocations.
      - >-
        `.meta/say/channel.py::signed()` refuses bodies ending in mismatched trailer blocks,
        printing an explanatory refusal directing the caller to omit hand-crafted trailers.
      - >-
        `.meta/lib/check_pr/verdict.py` and `.meta/lib/check_pr/review.py` verify that
        comments posted by repository accounts maintain structural trailer integrity.
      - >-
        Closes #639.
    falsifier: >-
      An autonomous harness executing raw `gh` writing verbs without interception by
      `signed_channel.py`, or `channel.signed()` accepting an input body ending in a
      mismatched `Actor:` or `Agent:` trailer, or a pull request comment landing with a
      fabricated trailer.
    rationale: |-
      Operational agency is partitioned across three distinct planes (solorepo's DR-252):
      Local Operator Plane, Attested Mutation Plane, and GitHub Inspection Plane. Raw CLI
      writes bypass the Attested Mutation Plane entirely, breaking the sole mechanism that
      guarantees attribution under shared account credentials.

      Prompt admonitions cannot hold this boundary. PreToolUse hook confinement is the sole
      mechanism that halts unsanctioned tool calls before execution. By adapting `signed_channel.py`
      to Antigravity CLI's decision protocol and wiring it into runner initialization for all
      roles, every harness is held to the same boundary. Pairing hook confinement with channel
      refusal of hand-crafted trailers ensures that both out-of-band writes and in-band forgery
      attempts are decisively blocked.
