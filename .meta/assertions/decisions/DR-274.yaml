decisions:
  - id: work:decision/274
    name: "DR-274 · Drop edited from the gate workflows' pull_request types rather than renaming the jobs that decline it"
    challenge: work:challenge/782
    status: ADOPTED
    applies:
      - work:article/7
      - work:article/22
    enacted_in:
      - work:artifact/github-workflows-gate
      - work:artifact/template-github-workflows-gate
    context: >-
      `.github/workflows/gate.yml` listened for the `edited` pull request action, and its
      `files`, `rust seed` and `python seed` jobs each declined that action by an `if:`
      guard, correctly: GitHub gives `edited` as "The title or body of a pull request was
      edited, or the base branch of a pull request was changed", and none of the three
      changes a byte of the head's tree.
      But GitHub writes a check run per job per event whether the job runs or is skipped,
      and reports only the latest run under each job name. The `skipping` conclusion from
      an `edited` run therefore became the visible state for a head whose files an earlier
      `synchronize` run had already read and passed, recoverable only by `gh run list`
      against the SHA.

      `.meta/say/move revise` fires that event on every body revision, so the cost landed
      routinely and landed on the reviewer. On solorepo's #778 a reviewer read `skipping`
      against `files` as the ratchet never having been exercised on that head at all.
      The base-branch limb fires it where nobody typed a revise: `.meta/say/move layer`
      retargets an open pull request onto the layer below, and GitHub retargets the layer
      above when the one below merges. A retarget moves no commit, so it fires no
      `synchronize` either.
    alternatives:
      - name: Give the edit-skipped path a distinct job name
        chosen: false
        reason: >-
          A job that runs only on `edited`, under a name of its own, would leave the
          passing `synchronize` run as the latest under `files`, `rust seed` and
          `python seed`. But the job names in this workflow are required status checks in
          `main`'s ruleset, which `check_pr.py` reads and compares; introducing new job
          identities means reasoning about each one's ruleset membership, and a required
          check that nothing reports blocks every merge. The scheme also pays a second
          workflow-file's worth of duplication to restore a check run that says nothing
          the earlier one did not.
      - name: Drop `edited` from `on.pull_request.types`
        chosen: true
        reason: >-
          No run fires on a revise, so nothing is written that could displace the passing
          conclusion, and the visible state stays what the tree last earned. The guards on
          the three jobs become redundant and come off with it, leaving one `if:` clause
          where there were two. The `pull request` job, which has no `edited` exclusion
          because `check_pr.py` reads the body a revise changes, loses its immediate
          re-run — accepted because `move revise` runs `check_pr.check()` locally before it
          writes to GitHub, and the 30-minute sweep re-runs the same check over every open
          pull request and publishes it under the same job name, so an edit made outside
          the channel is read later rather than never.
    consequences:
      - >-
        `edited` is removed from `on.pull_request.types` in `.github/workflows/gate.yml`
        and `template/.github/workflows/gate.yml`, which `gate workflows agree` in
        `.meta/checks/files/workflows.py` holds equal.
      - >-
        The `&& github.event.action != 'edited'` clause is removed from the `if:` of
        `files`, `rust seed` and `python seed`, and from the seed's `gate` job.
      - >-
        Body validation on an out-of-band edit is no longer immediate. It is held by
        `move revise`'s local `check_pr.check()` before the write, and by the sweep cron
        after it, at the sweep's interval. A retarget is the case neither the local check
        nor a push covers: the `pull request` check run on that head is up to the sweep's
        30 minutes stale against a base that has moved under it, and what it reads — the
        body and the threads — turns on neither the base nor the merge base, so the
        staleness is in when the check last ran and not in what it would conclude.
      - >-
        Challenge solorepo's #782 is settled and closed.
    falsifier: >-
      An event type listed in a gate workflow's triggers that the jobs reading files
      decline, where the skipped check run each of them writes becomes the latest under a
      required job's name and hides a conclusion earned on the same head.
    rationale: |-
      Option 2 adopted by the solo on Challenge solorepo's #782. A check run that says
      `skipping` where the tree passed is Article 7's falsifier wearing Article 22's
      clothes: the mark no longer says what was checked, and the reviewer cannot observe
      from the record that the gate ran. The two candidate fixes both restore the reading;
      the one that adds no job identity to a ruleset that blocks merges on every name it
      holds is the cheaper, and the reactivity it gives up is already backstopped twice.
