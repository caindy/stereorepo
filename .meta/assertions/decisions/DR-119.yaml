decisions:
  - id: work:decision/119
    name: "DR-119 · The half the two gate workflows share is held equal by check.py, compared as loaded YAML, and the seeded sweep runs next.py"
    challenge: work:challenge/113
    status: ADOPTED
    applies:
      - work:article/8
      - work:article/10
    enacted_in:
      - work:artifact/meta-check
      - work:artifact/github-workflows-gate
      - work:artifact/template-github-workflows-gate
      - work:artifact/specialize
      - work:artifact/meta-disciplines
      - work:artifact/template-meta-readme
      - work:artifact/meta-checks-files-workflows
    alternatives:
      - name: A comment in the scaffold's copy saying to change both
        chosen: false
        reason: >-
          What was in place, and DR-115 named it as the cost when it split
          the two. It is a reminder and not a control — Nothing Unconsumed
          applied to the thing that is supposed to enforce it — and it had
          already failed once by the time this was taken up: DR-114 added a
          step to the scaffold's sweep and a permission for it, and the
          seeded copy stayed a version behind with nobody told, which is the
          exact shape #113 predicted.
      - name: Generate the shared half into both files
        chosen: false
        reason: >-
          It makes the two equal by construction, and it makes the seeded
          workflow a rendered file: a `Generated by` banner in a portfolio's
          `.github/workflows/`, pointing at a renderer that reads the
          scaffold's copy, which the portfolio does not have. Each file also
          carries comments that are its own — the scaffold's says why a
          trigger failed at startup, the seed's says what a Project adds —
          and a generator either drops them or holds a third copy of each.
          A generated file is the right shape when the source is an
          assertion; here the source would be the other workflow.
      - name: A step in `check.py` that compares the shared half as loaded YAML
        chosen: true
        reason: >-
          What "shared" means is stated once, in the step: the triggers, the
          permissions, and two jobs named there, `pull request` and `sweep`,
          each of which must be in both files and equal across them. Named
          and not derived: an intersection of the two job sets is forgiving
          on absence, and cannot tell a job the seed never had from one the
          seed lost. The seed defines exactly those two and its own `gate`
          job, which DR-115 fixed at that name; the scaffold's seed jobs are
          its alone and are not compared. Loaded YAML, so the
          comments stay each file's own and what is compared is what GitHub
          reads. `check.py` already holds `template/` to the root twice, for
          placeholders and for parsing, and this is a third reading of the
          same pair. What it costs: a rule about two files that lives in a
          third, and a portfolio where the step compares nothing, since
          `template/` is not there — which is right, the copy being the
          scaffold's to get right before it happens, and the same silence
          `scaffold-only paths` keeps for the same reason.
    consequences:
      - >-
        `check.py` has a `gate workflows agree` step. It loads both files,
        compares `on`, `permissions` and each job named as shared, and names
        the first path that differs; a shared job missing from either file,
        or a job in the seed that is neither shared nor `gate`, is red. A
        shared job added later is added to the step's tuple, which is one
        more place than a derivation would need and the price of seeing a
        deletion. Where there is no `template/` it returns nothing.
      - >-
        The seeded sweep runs `next.py --check` after `check_pr.py`, as the
        scaffold's does, and its permissions read Issues. That is the drift
        the step found on its first run, corrected rather than declared
        scaffold-only: DR-114 made the queue check the sweep's, and a
        portfolio's sweep is a sweep.
      - >-
        `.meta/next.py` is in the set Specialization's second step copies.
        The seeded sweep types it, and a workflow that types a program the
        portfolio does not have is red on its first scheduled run.
      - >-
        The scaffold's comment no longer says to change both. It says which
        half is shared and what holds it equal.
      - >-
        The seeded load map's row for what is intended or open points at
        `.meta/next.py`, as the scaffold's has since DR-114. Before this the
        divergence was right, since a portfolio had no such program; a
        portfolio has no `justfile`, so the row types the program and not the
        recipe.
    falsifier: >-
      A change to the triggers, the permissions or either shared job that
      lands in one file and not the other with the gate green; or a
      difference GitHub reads that loaded-YAML equality does not see.
    rationale: |-
      #110 parked this on the seeded workflow's diff and promoted it at
      merge, offering two shapes: a comparison in `check.py`, which carries
      its own argument about what shared means, or generation into both.
      The first draft answered that argument by derivation — the shared jobs
      were whichever both files defined — and the comparison found a real
      difference on its first run, which settled whether the check was worth
      having. The review on #125 then showed the derivation was the check's
      own falsifier: an intersection is forgiving on absence, so a shared
      job deleted from the seed would have left it green. What shared means
      is therefore stated and not computed — two jobs named in the step,
      each required in both files, and the seed allowed no job beyond them
      and its own — and that is the decision this entry records.
