decisions:
  - id: work:decision/220
    name: "DR-220 · .meta/ holds the seed's complexity ceiling and pylint's size rules, with no suppression"
    challenge: work:challenge/538
    status: ADOPTED
    applies:
      - work:article/2
    enacted_in:
      - work:artifact/meta-ruff-toml
    context: >-
      Solorepo's DR-177 gave `.meta/` its own `ruff.toml`, selecting the rules
      appropriate to repository tooling and keeping `ignore = []` empty. The
      seed a portfolio is bootstrapped from selects `C90` with
      `max-complexity = 12` besides (`bootstraps/python/seed/pyproject.toml`),
      and `.meta/` did not: the scaffold held product code to a ceiling it did
      not hold itself, and nothing limited a function's size. Once every
      script over five hundred lines had been split into a package under
      solorepo's DR-217 and DR-218, the seed's ceiling and pylint's size rules
      reported 74 findings across 35 functions of `.meta/`, the largest a
      probe of 228 statements, twenty of them probes written as one function
      holding every case.
    alternatives:
      - name: Select the rules and suppress each finding where it stands
        chosen: false
        reason: >-
          Seventy-four `# noqa` lines with reasons is the ruleset being held
          on paper and not in the code, and each is a suppression the audit of
          solorepo's DR-207 treats as an open defect.
      - name: Select the rules at looser thresholds so the tree passes as it is
        chosen: false
        reason: >-
          A ceiling set where the code already is holds nothing; the seed's
          thresholds are the ones a portfolio is held to, and the scaffold
          should not be held to less.
      - name: Select C90 and PLR0912, PLR0913, PLR0915 at the seed's thresholds and refactor every finding
        chosen: true
        reason: >-
          Every finding came under the ceiling by extraction, a probe's cases
          becoming one function each and a long verb's branches becoming one
          helper per shape, with no suppression added and every function's
          behaviour held by the probes and the golden outputs the split
          captured.
    consequences:
      - >-
        `.meta/ruff.toml` selects `C90`, `PLR0912`, `PLR0913` and `PLR0915`
        with `max-complexity = 12`, `max-args = 5`, `max-branches = 12` and
        `max-statements = 50`, and `ignore = []` stays empty with no
        per-file ignore; the `meta ruff` gate step holds the tree to them.
      - >-
        A probe module holds one function per case, each returning its own
        problems, and the registered step concatenates them, `advance_probes`
        giving its dispatch cases to `dispatch_probes` in a module of their own
        so that neither file passes five hundred lines; a fake's
        `__call__` dispatches to one method per verb it answers.
      - >-
        A function with more than five parameters takes a record instead:
        `wikisplain.Page`, `timing.Window`, `collect.Collected`, and
        `FakeGitHub`'s refusals as keywords named by `REFUSALS`.
    falsifier: >-
      A function under `.meta/` over the ceiling that `.meta/check.py` passes,
      or a `# noqa` for one of the four rules under `.meta/`.
    rationale: |-
      The scaffold argues for the seed's guardrails by holding them itself.
      A ceiling on complexity is the one rule that says a function has grown
      past what a reader can hold, and a probe of two hundred statements was
      the clearest case: every reader of a failing case had to find it in
      one function. Extracting each case into a function named for what it
      holds is the refactor the ceiling asked for, and the ceiling now keeps
      the next case from being appended to the last.
