decisions:
  - id: work:decision/248
    name: "DR-248 · Formalize pull request state machine and watch handoff semaphore"
    challenge: work:challenge/689
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-lib-check-pr-state
      - work:artifact/meta-lib-check-pr-polling
      - work:artifact/meta-lib-check-pr-sweep
      - work:artifact/meta-check-pr
      - work:artifact/meta-lib-move-manager
      - work:artifact/wiki-solorepo-pr-first
      - work:artifact/agents
    context: >-
      In the agentic autonomous development loop (solorepo's DR-111, solorepo's DR-112),
      pull requests for easy and medium Challenges converge autonomously in GitHub Actions
      via webhook event deliveries (coder.yml, review.yml, advance.yml, merge.yml).
      For hard and human Challenges driven by local agent harnesses (Antigravity agy,
      Claude Code), inbound webhooks are unavailable; check_pr.py --watch (just watch)
      acts as the client-side subscription and handoff semaphore (solorepo's DR-102,
      solorepo's DR-138).

      However, check_pr.py --watch was built as an ad-hoc delta differ comparing raw
      snapshot strings between polls rather than evaluating an explicit pull request
      state machine. Under polling.py, check completions to SUCCESS are treated as
      non-actionable progress, leaving watch looping indefinitely when an approved head
      reaches all-green mergeability. On startup (poll 0), watch ignores pre-existing
      actionable states, waiting for future deltas that never arrive. Furthermore,
      mergeability changes (CONFLICTING) and parked notices are logged but not exited on.
      These gaps produce circular deadlocks where an autonomous agent sleeps waiting for
      watch to exit, while watch loops waiting for an external merge that never triggers.
    alternatives:
      - name: Add ad-hoc exit flags (--exit-on-ready) and inactivity timeouts
        chosen: false
        reason: >-
          Adding flags or timeouts leaves the underlying lifecycle implicit and piles
          hacks on hacks. It fails to repair existing invocations (just watch) and does
          not align client-side monitoring with the event transitions that drive the
          autonomous GitHub Actions loops.
      - name: Build an isolated state machine duplicating sweep and move logic
        chosen: false
        reason: >-
          A disconnected state machine implemented separately from sweep.py and
          move:evaluate_pr creates duplicate definitions of readiness, conflict, and
          unaddressed review threads, risking logic drift between real-time monitoring
          and periodic sweeps.
      - name: Formalize unified pull request state machine and refactor watch into a handoff semaphore
        chosen: true
        reason: >-
          Extracts and consolidates the boolean predicates across sweep.py, move:evaluate_pr,
          and polling.py into a single source of truth (.meta/lib/check_pr/state.py) exposing
          PullRequestState. Configures check_pr.py --watch to classify state on every poll
          (including poll 0) and exit 0 whenever the pull request transitions into an actionable
          state (GATE_FAILED, CHANGES_REQUESTED, NEEDS_REBASE, AWAITING_PROMOTION,
          READY_TO_MERGE, MERGED, CLOSED). Refactors sweep.py and move:evaluate_pr to share
          state classification and check predicates.
    consequences:
      - >-
        .meta/lib/check_pr/state.py introduces PullRequestState enum and classify_pr()
        as the authoritative state classification engine for pull requests.
      - >-
        .meta/lib/check_pr/polling.py watch() evaluates classify_pr() on every poll,
        exiting 0 immediately when an actionable state is reached, eliminating
        indefinite loops on green approved pull requests and startup deadlocks.
      - >-
        .meta/lib/check_pr/remedies.py delegates check status and reviewer verdict predicates
        to state.py.
      - >-
        .meta/say/move evaluate_pr() consults classify_pr() == PullRequestState.READY_TO_MERGE
        with deduplicated checks before testing decisions in force.
      - >-
        wiki/solorepo/pr-first.md and AGENTS.md document just watch as an active handoff
        semaphore waking the session when coder action is required or status changes.
      - >-
        Closes #689.
    falsifier: >-
      A pull request that reaches reviewer approval and all-green status checks while
      check_pr.py --watch is running, where watch fails to exit within one polling
      interval; or a pull request already in a coder-actionable state on startup where
      watch fails to exit on poll 0.
    rationale: |-
      Choreography over a shared substrate (solorepo's DR-214) requires that autonomous
      GitHub Actions loops and interactive local agent sessions react to the exact same
      state semaphores. Treating pull request monitoring as a state machine transition
      detector replaces fragile string-difference heuristics with deterministic lifecycle
      progress. Reusing and consolidating existing predicates from sweep.py and move:evaluate_pr
      ensures that the repository maintains a single, coherent definition of truth across all
      surfaces.
