decisions:
  - id: work:decision/170
    name: "DR-170 · A blocker that is an Issue is GitHub's own relationship, set from the line that still carries the rest"
    challenge: work:challenge/166
    status: ADOPTED
    supersedes:
      - work:decision/114
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/meta-next
      - work:artifact/meta-templates-issue
      - work:artifact/meta-templates-roadmap
      - work:artifact/meta-checks-probes-loops-merge-manager
    context: >-
      DR-114 rejected using GitHub's native issue dependencies for two reasons:
      "the channel has no verb to set one and the sweep none to read one."
      Both are now resolved. GitHub CLI (`gh`) natively supports `--blocked-by`,
      `--add-blocked-by`, `--remove-blocked-by`, and `--json blockedBy,blocking`
      in GA without experimental flags.
      
      Holding blockers only in prose allows closed blockers to remain cited indefinitely
      (as occurred with #286 citing #276 long after #276 had merged) and leaves the
      blocker relationship invisible in GitHub's UI and API.
    alternatives:
      - name: Leave the line as the only place a blocker is written
        chosen: false
        reason: >-
          What DR-114 shipped. A blocker is invisible on the Issue's own page
          and in every listing but `next.py`'s, a number can be typed that was
          never an Issue, and a closed blocker and a line that still cites it
          never disagree out loud because there is nothing for them to
          disagree with — one typo from wrong, one rewrite from stale, and
          nothing GitHub itself shows.
      - name: GitHub's relationship, replacing the line entirely
        chosen: false
        reason: >-
          DR-114 rejected this shape for one reason that still holds: a
          blocker is often not an Issue — a Decision, an account, a thing
          waiting on the solo — and a relationship cannot name any of those.
          Dropping the line would lose that case outright, which is why it
          stays.
      - name: Both — the line seeds the relationship at filing, and `next.py` reads the relationship first
        chosen: true
        reason: >-
          `gh` carries `issue create --blocked-by`, `issue edit --add-blocked-by`/`--remove-blocked-by`,
          and `issue view`/`issue list --json blockedBy` natively.
          So `move file` parses `#<n>` off the `**Waits on.**` line and passes them
          to `--blocked-by` on `issue create`. `next.py` prefers GitHub's native `blockedBy`
          relationship, falling back to the markdown line only when the relationship is empty
          (for legacy issues filed before this Decision, or blockers that are not Issues).
    consequences:
      - >-
        `move file` reads `#<n>` refs off the `**Waits on.**` line it already
        requires and passes them as `--blocked-by` on `gh issue create`.
      - >-
        `next.py`'s `waits_on` reads the Issue's `blockedBy` field first and
        falls back to regex parsing of `**Waits on.**` only when the native relationship
        is empty.
      - >-
        The issue templates under `.github/ISSUE_TEMPLATE/` and `.meta/templates/`
        explain that `#<n>` issue blockers become native relationships, while the line
        remains the home for non-issue blockers (Decisions, accounts, solo).
    falsifier: >-
      An Issue whose line names an Issue blocker that `move file` set as a relationship,
      where `next.py` reports a closed blocker as live or fails to read the native dependency.
    rationale: |-
      #166 resolved the open question from DR-114: whether `gh` could set and read
      issue dependencies natively via the CLI. It does, in GA.
      
      Using the native relationship where GitHub supports it while retaining the prose
      line for non-issue blockers achieves the best of both worlds: full visibility
      in GitHub's UI and API without losing the ability to wait on external facts.
