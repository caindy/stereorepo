decisions:
  - id: work:decision/296
    name: "DR-296 · Reviewer approval on a draft settles a leaf plan without obligatory solo approval in session"
    challenge: work:challenge/1131
    status: ADOPTED
    supersedes:
      - work:decision/249
      - work:decision/273
    applies:
      - work:article/8
      - work:article/22
    enacted_in:
      - work:artifact/agents
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-templates-pull-request
      - work:artifact/wiki-solorepo-seed-commit
    context: >-
      Solorepo's DR-249 requires the solo to validate a hard or human Challenge's
      plan before code, and solorepo's DR-273 adds reviewer approval of that plan
      on a draft pull request. Requiring both approvals for a leaf plan makes an
      agent wait for an in-session response before the reviewer can perform the
      architectural check that the draft already holds. Solorepo's DR-292 has
      since given reviewer-assigned hard Challenges a different path: the solo
      approves decomposition on the parent Issue, and child Challenges receive
      their own reviewer verdicts. The two-gate language in the earlier Decisions
      therefore describes the historical rule but no longer fits every leaf.
    alternatives:
      - name: Retain solo and reviewer approval for every architectural leaf plan
        chosen: false
        reason: >-
          The second approval repeats the architectural check and makes the
          solo's presence a routine dependency even when the Challenge does not
          need a maintainer decision. The draft and its reviewer pass already
          provide a durable place to reject an unsound plan before code.
      - name: Let reviewer approval on the draft settle a leaf plan
        chosen: true
        reason: >-
          The reviewer Role can interrogate the approach before implementation,
          and the draft remains unmergeable while it changes no file. Removing
          the obligatory in-session solo plan verdict leaves a single observable
          pre-code gate for leaf work. It does not settle a human Challenge's
          separate maintainer question or adopt this Decision on the solo's behalf.
      - name: Remove every solo approval from Challenge planning
        chosen: false
        reason: >-
          Hard Challenge decomposition changes the boundaries and dependencies
          of work, so solorepo's DR-292 still requires the solo to approve that
          proposal before child Challenges are created. Solorepo's DR-222 also
          reserves adoption of a Decision to the solo.
    consequences:
      - >-
        A leaf pull request requiring pre-code architectural validation starts
        with a plan-only Seed Commit and draft pull request. The reviewer Role's
        approval of the plan permits implementation. No routine in-session solo
        approval of that leaf plan is required.
      - >-
        A human Challenge still waits for the solo to settle the question that
        made it human. A reviewer plan approval does not answer that question.
        A reviewer-assigned hard Challenge still follows the DR-292 Epic
        decomposition path, including solo approval of its proposed children.
      - >-
        The solo-approval portions of DR-249 and DR-273 are superseded. Their
        accounts of why a pre-code plan check and draft isolation matter remain
        historical evidence, while PR First states the current workflow.
    falsifier: >-
      A leaf pull request implementing an architectural plan before reviewer
      approval, or a human Challenge whose maintainer question is treated as
      settled solely by the reviewer's plan verdict.
    rationale: |-
      The plan gate exists to catch a bad approach before it becomes a green
      but unsound diff. The reviewer Role is the reader assigned to make that
      technical judgment on the draft pull request. Asking the solo to repeat
      the same plan judgment in session stalls autonomous work without adding
      another distinct question. Where the solo's judgment is genuinely needed,
      the Challenge remains human or the hard Challenge's decomposition still
      awaits approval. The earlier Decisions should remain unchanged so a
      reader can see why the rule moved.
