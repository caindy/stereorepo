decisions:
  - id: work:decision/089
    name: "DR-089 · A Challenge closes by keyword at merge, not by a verb"
    status: ADOPTED
    applies:
      - work:article/15
    enacted_in:
      - work:artifact/meta-templates-pull-request
      - work:artifact/meta-check-pr
      - work:artifact/meta-disciplines
    alternatives:
      - name: A channel verb that closes the Issue
        chosen: false
        reason: >-
          Built as `issue-close` in #48 and removed here. It is a second act
          after the merge, and a second act is one that gets forgotten: #26 sat
          open after both pull requests that fixed it had landed, and the verb
          was written because nothing else could reach GitHub. It also grew the
          channel for something that is not an utterance and not the merge.
      - name: A closing keyword in the pull request body
        chosen: true
        reason: >-
          GitHub closes the Issue when the pull request merges to the default
          branch, so the merge is the act and there is no second one. The body
          the form already requires carries the link, and `check_pr.py` holds
          its shape the way it holds A15's. What it costs is judgement at
          opening time: the keyword goes only on the pull request that finishes
          the Challenge, and one that takes up part of it names the Issue
          without the keyword.
    consequences:
      - >-
        The pull request form gains a heading, *What it closes*, taking one
        `Closes #n` per item or "None." `check_pr.py` fails an item under it
        that carries no closing keyword.
      - >-
        `.meta/say issue-close` is removed, one pull request after it was added.
      - >-
        PR First's second step says the Challenge is named in the body with a
        closing keyword.
    falsifier: >-
      An Issue closed by a merge that did not finish it, because the keyword
      was written on a partial pull request. That would mean the form asks a
      question the author cannot answer when the body is written, and the
      heading would have to move to merge time with the sixth.
    rationale: |-
      Christopher: close the Issue the way GitHub's keywords do.

      The verb was the wrong shape from the start, and the reason is the
      principle that a mechanism for the live session needs a recovery path
      that does not depend on it. A verb runs only if someone runs it. A
      keyword in the body is read by GitHub at merge whether or not anyone
      remembered, and the body is the one artifact PR First already makes the
      author write before the work begins.
