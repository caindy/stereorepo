decisions:
  - id: work:decision/230
    name: "DR-230 · The reviewer reads every Challenge before a coder takes it, and its verdict is the difficulty label"
    challenge: work:challenge/590
    status: ADOPTED
    applies:
      - work:article/8
      - work:article/22
    enacted_in:
      - work:artifact/meta-assertions-disciplines
      - work:artifact/meta-say-verbs
      - work:artifact/meta-say-move
    context: >-
      DR-112 made the difficulty label the raiser's estimate and the event the
      coder loop takes an Issue on, and DR-226 made the level say who answers
      the Issue. Both leave the raiser as the only party to read a Challenge
      before a coder starts on it. A raiser is the one reader with a stake in
      the answer: an agent filing what it noticed at the end of a run, or the
      solo filing in a sentence, and the form's questions are answered by the
      party who already believes the work is worth doing. The pull request has
      the same shape one seam later. PR First has its body written when the
      work starts, and the first reader that body gets is the reviewer at
      green, when the approach it describes is already built.

      The solo's observation is that coder agents keep ignoring clear
      directives in the prose guidance, and that the one general mitigation
      that has worked is a second reader, whether the solo or another agent: a
      separate reviewer finds what the author could not see, in the way that
      explaining a problem aloud does. That reading exists once, at the end of
      a change, and nowhere before a coder self-assigns.
    alternatives:
      - name: Leave intake to the raiser, and rely on the loop correcting the level downward
        chosen: false
        reason: >-
          The loop corrects a level only by failing to finish at it, which is a
          coder pass spent to learn what a reading would have said. It also
          corrects only the level. A Challenge that is really an observation,
          one whose next step is a decision, one the tree already answers, or
          one whose blocker is not on its first line goes to a coder at whatever
          level the raiser guessed, and the form's questions are consumed by
          nobody, which is the drift Article 8 names.
      - name: A second label as the gate, leaving the difficulty as the raiser's
        chosen: false
        reason: >-
          A `ripe` or `triaged` label beside the difficulty is a second state
          every consumer has to learn: the coder workflow's take door, `move
          claim`, `just next` and the form. The take door fires on one
          `labeled` delivery and cannot see a second label landed in the same
          act, which the dev loop's page records as a lost delivery at
          solorepo's #473, so a gate that needs two labels present is a gate
          that races itself. The difficulty already routes the Challenge and
          already fires the door; a second label duplicates it.
      - name: A reviewer verdict on the opening pull request body, before code
        chosen: false
        reason: >-
          The same second reading, one seam later. It reads the approach rather
          than the Challenge, which is what crystallises once a coder has looked
          at the code, so it catches a different class of error. But by then the
          coder has self-assigned and branched, which is the act the solo asked
          to put a reader in front of, and a verdict on a pull request with no
          diff needs a shape GitHub's review does not have. It is a separate
          question and this Decision does not close it.
      - name: The reviewer reads every Challenge, and its verdict is the difficulty label
        chosen: true
        reason: >-
          The raiser proposes a level in the body and lands no label. The
          reviewer Role reads the Challenge against what the form asks and
          against the tree, and lands the level it found, which is the label
          the take door already fires on, the level `move claim` already reads,
          and the state `just next` already lists as ripe. No new state and no
          new consumer: the one change is who lands the label, and the gate
          falls out of a door that exists. A label is state GitHub holds and
          reports, so a Job arriving later finds the verdict by asking rather
          than by reading a transcript, which is what a handoff here has to be.
          The cost is a reviewer pass and its latency on every Challenge that
          arrives without a mandate, and a raiser's guess that was right waits
          for someone to say so. A level landed with the filing is the solo's
          verdict given in advance, and it skips the reviewer on purpose: the
          solo directing a session to file at `hard` has read the Challenge
          already, and a second reading would spend the pass to say so.
          Filing without a level is the reviewed path, and the two are told
          apart by the label alone.
    consequences:
      - >-
        PR First's third step now says a Challenge is raised with the form and
        a proposed level in its body, that the reviewer reads every Challenge
        before any coder takes it, and that the reviewer's verdict is the
        label: `move triage`, which lands the level found. What the reviewer
        asks is what the form asks, plus what only a reading of the tree can
        answer: a trigger or a cost that will land, a blocker on the first
        line, no mechanism already in the tree that answers it, and no decision
        owed, which is `human` whatever the effort.
      - >-
        `move triage` is the reviewer's verb, and it lands a level on a
        Challenge that has none as well as making a Challenge of an Issue that
        arrived without the form. `move difficulty` stays the solo's move of a
        level already standing. A Challenge no reviewer has read is nobody's to
        claim.
      - >-
        The take door is unchanged. `easy` and `medium` fire the coder loop the
        moment the label lands, and the reviewer's act is now what lands it.
      - >-
        A question the raiser cannot answer, because the raiser is a Job that
        has gone, is the reviewer's to answer by revising the body or to hand
        to the solo by landing `human` with the question posted beside it,
        which is PR First's fourth step exercised from the reviewer's seat.
      - >-
        The verdict is to name what it checked, the way `post landed` is
        generated rather than typed, so that a rubber stamp shows as a verdict
        with empty checks rather than as a plausible paragraph. Today the
        label is the whole verdict: `move triage` takes a number and a level
        and posts nothing, so a reading and a stamp look the same until the
        verdict body arrives with the mechanisms below. A second reader is not
        weakened by the naming; its work becomes auditable.
      - >-
        The mechanisms that make the step a check rather than a step followed
        are not built here: `move file` and `post promote` still land a
        difficulty and no verb of the channel files a Challenge without one,
        `move claim` does not yet refuse a Challenge with no level, no reviewer
        Job fires on the `challenge` label, `move triage` posts no verdict body
        naming what it checked, and the form and `just next` do not yet read a
        proposed level from the body. Until they land the gate is not operable:
        the raiser lands the level as before, `triage` refuses a Challenge whose
        level stands, and a reviewer who disagrees with a raiser's level has
        only `difficulty`, which is the solo's. What this change puts in force
        is the rule and the verb's shape, and the step is followed from the
        day `move file` can land `challenge` alone.
      - >-
        Whether a reviewer verdict on a pull request's opening body, before
        code, is worth its own seam is left open.
    falsifier: >-
      A Challenge the reviewer landed at `easy` or `medium` that the coder pass
      then found to be an observation, a decision, or work the tree already
      held, which says the reading did not read. Equally, once the verdict
      body exists, verdicts that name no check, or Challenges filed with a
      level at all so that the reviewed path goes unused, either of which says
      the gate costs more than it catches. Nothing records whether a level was
      the solo's mandate or a Job's habit, so the second count includes the
      mandated filings and the solo reads it knowing how often he mandates.
      Neither is measurable before the mechanisms land, and a reading taken
      earlier reports on their absence.
    rationale: |-
      Christopher, on the prose guidance: try as I might, coder agents keep
      ignoring clear directives, and the only general mitigation I have seen is
      review, by me or by another agent. I thought I had put a review step
      between opening a pull request with its intentions and beginning to
      code. In any event I want the same for Issues: a reviewer picks up every
      Issue and interrogates it before a coder self-assigns. On the worry that
      a reviewer is the same model with a different prompt: not always, not
      necessarily, and regardless a separate reviewer finds what the first
      agent missed, like the rubber duck effect.

      The Decision is small because the repository was already shaped for it.
      The form asks the right questions, the label already routes, and the
      loop already keys on the label. What was missing was a reader between
      the form and the label who is not the party who filled the form in.
