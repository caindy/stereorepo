decisions:
  - id: work:decision/267
    name: "DR-267 · Hold the merge manager's mutual exclusion on a lock it takes, not on a concurrency group it shares"
    challenge: work:challenge/850
    status: ADOPTED
    applies:
      - work:article/22
    enacted_in:
      - work:artifact/github-workflows-merge
      - work:artifact/github-workflows-reconcile
      - work:artifact/meta-lib-move-manager
      - work:artifact/meta-lib-move-reconcile
      - work:artifact/meta-checks-probes-harness-github
      - work:artifact/meta-checks-probes-loops-merge-lock
    context: >-
      `merge.yml` and `reconcile.yml` both run the merge manager, and both
      declared `concurrency: group: merge` with `cancel-in-progress: false`,
      because two merges in quick succession must serialize whichever workflow
      asked for them. GitHub holds at most one pending run per concurrency
      group and cancels the waiting one when a third arrives, so the group
      bought the exclusion by throwing runs away. On 2026-09-22 the reconciler's
      21:38 pass, run 35787817254, was cancelled with no job started while
      solorepo's #828 was landing; `merge.yml` fires on every push to trunk and
      on every `gate` or `review` completion, four times between 21:40 and
      21:43 alone, so any pass scheduled into a burst of merges is the one
      displaced. The loss is silent, a run cancelled before any job starts
      printing nothing. DR-264 made that pass the primary loop, so what the
      cancellation drops is every act the reconciler performs — a rebase
      dispatched, a review requested again, a dead claim released — and not a
      merge, which the next push brings round anyway.
    alternatives:
      - name: Move the merge manager's clock backstop back into merge.yml
        chosen: false
        reason: >-
          It undoes the subsumption DR-264 adopted, returning the merge cron to
          a door of its own beside the reconciler, strands `move reconcile
          --dry-run` with nothing left to mean, and costs more churn in the
          reconciler's probe than the lock costs in the manager's.
      - name: Leave both workflows in one group and accept the cancellations
        chosen: false
        reason: >-
          The cancelled run is the scheduled one, which is the loop DR-264
          makes primary, and the cancellation prints nothing, so the failure is
          both the worst one available and invisible. Accepting it is accepting
          that the anti-entropy pass runs only when merge traffic is quiet,
          which is when it is least needed.
      - name: Give each workflow its own group and take the exclusion on a ref
        chosen: true
        reason: >-
          Creating a ref is a compare-and-set GitHub answers atomically, and it
          is the one this repository already relies on: `move mint` reserves a
          Decision number by creating `refs/tags/DR-nnn` and reading it back.
          The lock is taken in the same namespace, on
          `refs/tags/merge-manager-lock`, so every endpoint it uses is one the
          repository exercises on every minted number. A manager that meets a
          held lock declines rather than waits, so the reconciler's pass goes on
          to its reading and `merge.yml`'s next trigger brings the merge round
          again — the dropped edge DR-264 already prices at one period of the
          clock, rather than a runner held waiting on a queue the holder is
          already evaluating.
    consequences:
      - >-
        `reconcile.yml` and `merge.yml` declare concurrency groups of their own,
        and a change putting them back into one is an objection at review.
      - >-
        `merge_manager` is the way into the manager: it takes the lock and calls
        `_manage`, which is the queue evaluation and takes none. A dry run is the
        exception, reaching `_manage` with no lock because it merges nothing and
        would otherwise hold the queue for the length of a report. A caller
        reaching `_manage` from outside the module merges with the exclusion
        bypassed.
      - >-
        The lock is broken rather than waited on where its holder has stopped: a
        holder naming a workflow run is tested against that run, which GitHub
        reports `completed` for a cancellation or a crash, a holder naming a
        session is tested against `LOCK_STALE_MINUTES`, and a ref standing at no
        tag GitHub will serve, or a holder carrying no date, is broken on sight.
      - >-
        The break is a delete and a create, which is two operations, and GitHub
        offers a precondition on neither: of two managers breaking one dead lock
        the ordinary loser meets the winner's ref and is refused, but one whose
        delete lands after the other's create removes a live ref and takes the
        lock beside it. That residual is named wherever the break is described
        and is not asserted away.
      - >-
        A read of the lock that GitHub refuses is distinguished from a lock
        GitHub says is absent, because the two want opposite acts: `channel.gh`'s
        `default=` answers both alike, so the lock reads through
        `tolerate_fail` and classifies the failure itself.
    falsifier: >-
      Two managers observed holding the lock or merging at once — a dry run
      reaching `_manage` without it is the designed exception and not this — or
      a merge frozen behind a lock nothing broke; either of which says the
      exclusion is worse than the group it replaced. The break's residual would
      show as the first of those with both managers naming the same broken
      holder. A concurrency group that queues rather than cancels, were GitHub
      to offer one, would also retire this: the reconciler could share the merge
      group again with no pass dropped.
    rationale: |-
      A concurrency group is a scheduler, not a lock, and the difference is what
      it does to the run that loses: a lock's loser is told, and a group's loser
      is deleted. That is tolerable where the losing run is redundant, which is
      true of two merges and false of a merge and a reading pass. Once DR-264
      made the reconciler the primary loop rather than a second merge door, the
      two workflows stopped being interchangeable and the shared group stopped
      being a fit.

      The exclusion still has to live somewhere, and A22 rules out one answer:
      state an unprivileged Job cannot observe is state the system does not
      have, so the exclusion cannot be a fact one run holds about itself and
      must sit where any manager can read it, which here is GitHub. A ref
      create is the only atomic operation the substrate
      offers that this repository has already proved against it, which is why
      the lock is taken in the tag namespace `move mint` uses rather than in a
      namespace of its own invention — an unprecedented namespace would make
      the merge manager turn on an unanswered question about GitHub's API, and
      a lock that cannot be read is a repository that cannot merge.

      The failure to design against is the freeze, not the race: a lock nothing
      releases stops every merge after it, which is the class DR-264 exists to
      end. So every path that cannot confirm a holder ends in a break or a
      release rather than in a stand-down with no bound, and the one path that
      stands down without breaking — GitHub refusing the read — is bounded by
      the outage ending rather than by anything this repository holds.

      That ordering is what settles the break. Breaking is a delete and a
      create, GitHub offering a precondition on neither, so two managers
      arriving at one dead lock within a round trip of each other can both come
      away holding it. Closing that needs the break taken under a second lock of
      its own, which needs a staleness bound of its own, which reopens the same
      race one level down where a breaker crashed mid-break — a mechanism whose
      own failure mode is the freeze, bought against a race that needs a stopped
      holder and a one-round-trip collision together. So the residual is stated
      where the break is written, here, and in the account the wiki keeps, and
      the case for revisiting it is two managers observed merging together, not
      an argument about the orderings.
