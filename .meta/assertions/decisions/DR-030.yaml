decisions:
  - id: work:decision/030
    name: "DR-030 · Dogfooding is a Discipline, and the scaffold is a Product"
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-disciplines
    rationale: |-
      Adopted on evidence rather than principle. Testing Specialization
      for real found five gaps that reviewing it had not; instantiating
      the DDD schema found a cardinality error in the hour it was written;
      enumerating the vocabulary found collisions that discussing it had
      missed. Each was reached by use and not by reasoning about the
      artifact.

      Its judgement is telling a difficulty that is the tool's fault from
      one that is the task's: working around the first hides a defect,
      redesigning for the second is thrashing, and only use distinguishes
      them.

      The scaffold becoming a Product was blocked on `primary_persona`,
      which dogfooding dissolves — its first user is the person building
      it. That makes `work:persona/the-human` a marked departure from
      Cooper: the class has one member, he is present, and the record can
      be corrected by its subject rather than defended by its author.
