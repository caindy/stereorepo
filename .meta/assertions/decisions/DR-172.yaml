decisions:
  - id: work:decision/172
    name: "DR-172 · APM packages are nested under .meta/ and compile to the repository root"
    status: ADOPTED
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-apm-readme
      - work:artifact/meta-lib-render-writers
      - work:artifact/meta-lib-apm-compile-apm
      - work:artifact/meta-lib-apm-compile-harness
      - work:artifact/meta-lib-apm-compile-instructions
    context: >-
      Microsoft APM is solorepo's target for packaging agent primitives (DR-007,
      solorepo's #28). While `.meta/.apm/` was designated as the producer staging
      ground for authored primitives, `.meta/.apm/README.md` recorded an open question
      from 2026-09-06: where `apm.yml` must reside. APM canon mandates that `apm.yml`
      sits at the package root beside `.apm/`. Placing `apm.yml` and `.apm/` at the
      repository root would clutter product portfolios with scaffolding, violating
      solorepo's core architectural boundary separating `.meta/` from product material.
    alternatives:
      - name: Root-level APM package (`apm.yml` and `.apm/` at the repository root)
        chosen: false
        reason: >-
          It places agent package management manifest files at the top-level
          root of the repository. Solorepo requires that everything outside
          `.meta/` is product material; leaking scaffold dependency manifests into
          the repository root violates this boundary and crowds the portfolio's landing.
      - name: Nested package root under `.meta/` compiled to repository root via `--root ..`
        chosen: true
        reason: >-
          Research on solorepo's #339 verified APM's canon: nested package roots are
          fully supported wherever `apm.yml` sits, and both `apm compile` and `apm install`
          natively provide the `--root <DIR>` flag. Executing `cd .meta && apm compile --root .. --all`
          resolves primitives from `.meta/.apm/` while deploying generated harness
          directories (`.claude/`, `.gemini/`, `.agents/`) and root instruction files
          into the repository root (`..`).
    consequences:
      - >-
        `apm.yml` sits at `.meta/apm.yml`, alongside `.meta/.apm/`.
      - >-
        Compilation runs from `.meta/` with `--root ..`, directing compiled harness
        rules, agents, skills, commands, and root context files into the repository root.
      - >-
        `.meta/.apm/README.md` is updated to record this settled layout, resolving
        the open layout question from solorepo's #339.
    falsifier: >-
      An APM release that drops `--root` support or fails to compile across target
      harnesses when `apm.yml` is located in a nested subdirectory.
    rationale: |-
      Solorepo's rule is that `.meta/` holds the staging ground and never ships as
      product material.

      APM's native `--root` redirection flag resolves the layout tension cleanly:
      the package definition remains strictly confined within `.meta/`, while its
      late-bound compiled output lands at the repository root where agent harnesses
      expect to find it.
