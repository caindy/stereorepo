decisions:
  - id: work:decision/246
    name: "DR-246 · Incorporating Google Labs Jules API as autonomous reviewer cloud fallback harness"
    challenge: work:challenge/681
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-actions-jules
      - work:artifact/meta-jules-client
      - work:artifact/meta-jules-readme
      - work:artifact/meta-detect-fallback
      - work:artifact/github-workflows-review
      - work:artifact/github-workflows-coder
      - work:artifact/wiki-solorepo-dev-loop
      - work:artifact/meta-assertions-structure
    context: >-
      Following the restoration of Antigravity CLI (`agy`) fallback in self-hosted ARC runner pods
      (solorepo's DR-245), autonomous loops in `review.yml` possessed two execution tiers:
      primary Claude Code Action, and secondary `agy` on self-hosted Kubernetes runners.
      However, when workstation compute or local ARC clusters are unavailable, or when Anthropic
      and ARC runners both encounter limits or outages, autonomous review requests stall.

      Spike Challenge #678 validated that the Google AI Ultra Jules API allotment can be utilized
      programmatically via stateless REST API sessions (`https://jules.googleapis.com/v1alpha/sessions`),
      independent of the Jules GitHub App. By operating in repoless mode, an intermediary
      runner passes pull request diffs and open threads to Jules in the cloud and pulls review analysis
      back to the runner, using workflow-attested identity variables for channel signing and posting
      via `.meta/say/post --role reviewer` (Article 19, solorepo's DR-233).
    alternatives:
      - name: Require Jules GitHub App installation with direct cloud repository mutations
        chosen: false
        reason: >-
          Cloud commits authored by Google's backend lack runner-attested Actor/Agent trailers and
          repository commit signatures, failing check_pr.py and PR First verification (Article 19).
          Furthermore, cloud environments cannot execute just gate meta before opening PRs.
      - name: Enable Jules fallback unconditionally by default
        chosen: false
        reason: >-
          Defaulting to enabled would cause unconfigured fresh clones lacking JULES_API_KEY to fail
          with authentication errors during fallback evaluation. Gating behind JULES_FALLBACK
          (defaulting to false) preserves the fail-safe zero-configuration invariant for fresh clones
          established in DR-240 and DR-245.
      - name: Repoless Jules cloud fallback with opt-in JULES_FALLBACK toggle and local runner attestation
        chosen: true
        reason: >-
          Encapsulates Jules execution in local composite action .meta/actions/jules, drives repoless
          sessions via .meta/jules/client.py under subscription quota, posts reviews through
          .meta/say/post on the runner under workflow-attested identity variables (solorepo's DR-233),
          establishes explicit multi-tier fallback (Claude Code -> agy -> Jules) in review.yml,
          and defaults JULES_FALLBACK to false.
    consequences:
      - >-
        .meta/actions/jules/action.yml encapsulates repoless Jules CLI invocations without inline Python (DR-241).
      - >-
        .meta/jules/client.py provides review-pr automation, parsing line findings and executing review
        verdict posting via local .meta/say/ programs.
      - >-
        .meta/detect_fallback.py is extended to evaluate JULES_FALLBACK (defaulting to False), emitting
        fallback=true and exporting AI_AGENT=google-labs-jules and ACTOR_AGENT=google-labs-jules.
      - >-
        In .github/workflows/review.yml, Jules steps are chained as tertiary reviewer fallback following
        Claude and agy failures, or selectable via harness:jules.
      - >-
        wiki/solorepo/dev-loop.md documents the three-tier autonomous reviewer hierarchy and JULES_FALLBACK toggle.
      - >-
        In .github/workflows/coder.yml, continue-on-error: true is added to secondary-tier Gemini
        steps (rebase_gemini, answer_gemini, promote_gemini) to align step failure handling with
        primary-tier steps.
      - >-
        Closes #681.
    falsifier: >-
      Any direct GitHub write from Jules bypassing .meta/say/; or a Claude and agy failure activating Jules
      fallback when vars.JULES_FALLBACK is unset or false; or .meta/actions/jules containing inline Python;
      or an automated Jules review verdict posted without Agent: google-labs-jules.
    rationale: |-
      Adding a cloud-based reviewer fallback preserves autonomous review progress when workstation
      or self-hosted ARC runners are unavailable. Operating Jules in repoless mode avoids external
      repository write access, allowing repository attestation, confinement, and verification invariants
      to be enforced locally on the runner. Using Google AI Ultra subscription allotment credentials preserves
      the economic boundary against metered API exposure (solorepo's DR-240, solorepo's DR-245), while
      the opt-in toggle ensures safety for fresh clones.
