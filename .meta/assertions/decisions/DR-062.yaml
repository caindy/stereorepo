decisions:
  - id: work:decision/062
    name: "DR-062 · The branch nominates the Job, the trailer nominates the Actor, and the squash carries both"
    status: ADOPTED
    supersedes:
      - work:decision/060
    applies:
      - work:article/14
    alternatives:
      - name: Resolve what a thread owns by authorship
        chosen: false
        reason: >-
          Every pull request in a solorepo is the solo's by construction
          (DR-014), so `--author @me` reconstructs a fact that was never in
          doubt and answers nothing about which agent is answerable for which
          change.
      - name: Resolve by branch, and name the Actor in a commit trailer
        chosen: true
        reason: >-
          One branch is one pull request, so the checkout is already the token
          and no new field is needed anywhere. The trailer carries what the
          branch cannot — which thread took the Job — and costs one line per
          commit. What neither does is say under which Remit, which is the audit
          question and is deliberately left alone.
      - name: A Job identifier in the pull request title
        chosen: false
        reason: >-
          The title becomes the permanent subject on `main` under squash, and
          ownership is transient — it means nothing after the merge. It also
          spends the index on a token nobody searches for, against PR First's
          own step.
    consequences:
      - >-
        `squash_merge_commit_message` moves from `PR_BODY` to `COMMIT_MESSAGES`.
        The body was already durable as the pull request; copying it into the
        commit made every subject on `main` carry an essay, which is A14 read
        backwards.
      - >-
        The Actor trailers now survive the merge, because the squashed body is
        the branch's commit messages. The durable half of "who did this" is held
        by a setting rather than by a heading on the form.
      - >-
        `Co-Authored-By` is retired. It named a co-author who is not a person
        and told a maintainer nothing.
      - >-
        The trail from `main` back to the argument still needs GitHub. `(#n)` in
        the subject is a pointer, and dereferencing it leaves the clone — which
        is A13's sharper edge (DR-052) and not new here.
    falsifier: >-
      A restart in a fresh worktree, where the branch is not checked out and
      nothing resolves. The branch is the token only while the checkout exists.
    enacted_in:
      - work:artifact/meta-say
    rationale: |-
      DR-060 recovered ownership by asking GitHub which pull requests this
      account authored. That is vacuous here: a solorepo is one solo, so
      authorship is constant and the real question — which pull request is
      *this thread* answerable for — was never asked.

      The branch is where the Job already is, and the ontology already
      says so: a Job answers exactly one Challenge, every hop single-
      valued. "One thread, one pull request" is that constraint met rather
      than a new rule. It is one-way on purpose — two agents on one pull
      request stays legal; one thread across two has no meaning, because
      on restart "which do I resume" would have no answer.

      A restart is a new Execution of the same Job (DR-004), so keying on
      the workload identity is exactly wrong: it is the thing that
      changes.
