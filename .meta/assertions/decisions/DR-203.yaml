decisions:
  - id: work:decision/203
    name: "DR-203 · Retire unconsumed provenance metamodel schemas from the active work ontology"
    status: ADOPTED
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-work-ontology
      - work:artifact/meta-work-structure
    context: >-
      DR-008 and Article A8 establish the principle of Nothing Unconsumed: keeping
      unconsumed design-time schemas ahead of concrete consumers is a source of debt.
      `.meta/work/provenance.yaml` defined 337 lines of metamodel schemas for
      `Execution`, `AuditRecord`, and `AgentBillOfMaterials`. However, no active
      downstream consumers, generators, workflows, or gates produce, consume,
      or validate this provenance layer.
    alternatives:
      - name: Retain the provenance metamodel schemas in the active build to avoid losing the design
        chosen: false
        reason: >-
          Violates Article A8 and DR-008. The inactive schemas add unnecessary complexity
          to the active ontology and build process. Roadmapped designs are better preserved
          outside the active path.
      - name: Retire the provenance metamodel schemas and reference their preservation in the roadmap
        chosen: true
        reason: >-
          Retiring the active metamodel schema lines eliminates unconsumed structural definitions.
          The intended provenance and AIBOM design remains documented and preserved in roadmap
          Issue #403 for future reintroduction when runtime execution consumers exist.
    consequences:
      - >-
        `.meta/work/provenance.yaml` is deleted.
      - >-
        `work/provenance` is removed from `imports:` in `.meta/work_ontology.yaml`.
      - >-
        `work:artifact/meta-work-provenance` is removed from `.meta/assertions/structure.yaml`.
    falsifier: >-
      An attempt to validate or compile the work ontology succeeds while the `.meta/work/provenance.yaml`
      file or its references still exist in the active ontology/build path.
    rationale: |-
      Removing inactive schemas avoids cluttering the core ontology and ensures we maintain
      nothing unconsumed. The roadmap preserves the design cleanly until execution environments
      reintroduce concrete consumers.
