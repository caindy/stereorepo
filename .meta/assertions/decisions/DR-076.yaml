decisions:
  - id: work:decision/076
    name: "DR-076 · The pull request body names the decisions taken in the change"
    status: ADOPTED
    supersedes:
      - work:decision/055
    applies:
      - work:article/11
    alternatives:
      - name: Rely on the Discipline
        chosen: false
        reason: >-
          It is what was relied on, and it failed the same day it was restated —
          a decision taken in #12 and recorded only after the merge. Written
          Decisions already said to record it; saying so again is the layer of
          reminders this repository has learned not to add.
      - name: A fifth heading on the pull request form
        chosen: true
        reason: >-
          The form is the one artifact read at the moment the omission happens,
          and `check_pr.py` derives what it requires from the form's own fence —
          so adding the heading makes it required by that act alone. What it
          costs is a heading on every pull request, including the many whose
          honest answer is "None."
      - name: A check that a change touching behaviour also touches the record
        chosen: false
        reason: >-
          Most changes take no decision, so it would fail constantly and be
          triaged by hand — the instrument A17 already found wanting. Whether a
          decision was taken is a judgement, and a judgement cannot be gated.
    consequences:
      - >-
        `check_pr.py` requires the heading with no further change, because the
        fence is what it reads.
      - >-
        The heading takes links to DRs, in the same shape as the fourth heading's
        links to Issues — a pointer, not a restatement.
      - >-
        "None." is a complete answer and will usually be the true one.
    falsifier: >-
      Bodies that answer "None." while decisions keep arriving late. That would
      mean the question was being answered rather than asked, and the form had
      become a place to put a word.
    enacted_in:
      - work:artifact/meta-templates-pull-request
    rationale: |-
      The interesting part is that the Discipline already said so. Written
      Decisions requires an entry when the question is settled, and the
      routing table sends the reasoning to a DR. Both held everywhere I
      was looking and failed where I was not, which makes another
      statement of the rule the wrong response.

      The form is where the question gets asked. It is read at the moment
      the body is written, which is the moment the omission occurs, and it
      already asks four questions of exactly this kind.

      What cannot be built is a check for whether a decision was taken. A
      form asks; only a claim can be checked.
