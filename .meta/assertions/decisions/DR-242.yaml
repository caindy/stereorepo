decisions:
  - id: work:decision/242
    name: "DR-242 · Excising Gemini CLI integration and fallback from autonomous coder and reviewer workflows"
    challenge: work:challenge/673
    status: ADOPTED
    supersedes:
      - work:decision/240
      - work:decision/178
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/github-workflows-coder
      - work:artifact/meta-assertions-disciplines
      - work:artifact/meta-assertions-structure
      - work:artifact/wiki-solorepo-dev-loop
    context: >-
      DR-178 configured `.github/workflows/review.yml` and `.github/workflows/coder.yml` to activate
      Gemini fallback on any Claude harness failure. DR-240 placed that fallback behind an opt-in
      toggle (`GEMINI_FALLBACK`) to eliminate unexpected pay-as-you-go billing via Google Cloud's
      `GEMINI_API_KEY`.

      However, retaining Gemini CLI as an opt-in fallback preserved extensive secondary execution
      steps, duplicate tooling hooks, and implicit branch-name routing (`^gemini/`, #668) that
      triggered unexpected execution and authentication failures. Because Gemini CLI requires a metered
      `GEMINI_API_KEY` that is unsuited for unattended CI loops, maintaining it as an opt-in path
      imposes dead complexity across workflows with no production use case.

      Until Google provides subscription-backed headless machine tokens, re-introducing Gemini as an
      autonomous loop harness is deferred to Challenge #669, where local Actions Runner Controller (ARC)
      runner credential mounting will allow containerized Google Antigravity to run under an unmetered
      personal subscription. In the interim, solorepo excises Gemini CLI entirely from CI workflows.
    alternatives:
      - name: Retain opt-in GEMINI_FALLBACK toggle from DR-240
        chosen: false
        reason: >-
          Leaves dead secondary execution paths, complex step conditions, and unmaintained Gemini CLI
          harness steps in coder and reviewer workflows without an active use case.
      - name: Disable branch prefix routing alone while retaining Gemini CLI steps
        chosen: false
        reason: >-
          Fixes #668's immediate branch routing defect but leaves metered Gemini CLI steps, secrets,
          and fallback logic in the repository.
      - name: Fully excise Gemini CLI integration and fallback from coder and reviewer workflows
        chosen: true
        reason: >-
          Removes all Gemini CLI execution steps, fallback detection logic, `GEMINI_FALLBACK` toggles,
          and branch prefix routing from `review.yml` and `coder.yml`, eliminating Gemini billing risks
          and dead code.
    consequences:
      - >-
        All Gemini CLI execution steps, fallback detection steps, and `GEMINI_FALLBACK` toggles are
        excised from `.github/workflows/review.yml` and `.github/workflows/coder.yml`.
      - >-
        `.meta/detect_fallback.py` is removed from the repository, and Specialization's *Copy what is inherited* step no longer
        inherits it or mentions `vars.GEMINI_FALLBACK`.
      - >-
        Implicit branch-name prefix routing (`^gemini/`, `^codex/`) is removed from both workflows;
        harness selection is driven strictly by explicit labels or manual dispatch inputs. Closes #668.
      - >-
        In `coder.yml`, secondary fallback verification steps are removed; Claude pass failures
        fail directly in CI without requiring fallback inspection.
      - >-
        The opt-in fallback toggle introduced in DR-240 (`vars.GEMINI_FALLBACK`) is retired. DR-178's
        third consequence and third falsifier limb (multi-harness fallback) are superseded in full.
        DR-178's first two mechanisms (`move:dispatch` post-rebase recovery and `check_pr:unheld`
        zero-verdict retry) stand.
    falsifier: >-
      Any reference to `run-gemini-cli`, `GEMINI_FALLBACK`, or `GEMINI_API_KEY` surviving in
      `.github/workflows/review.yml` or `.github/workflows/coder.yml`; or a pull request head branch
      name altering harness selection without an explicit label.
    rationale: |-
      Dead code and unmetered billing risks do not belong in autonomous workflows. While multi-harness
      self-healing is desirable in theory, coupling a flat-rate subscription harness to a utility-metered
      API harness creates an untenable failure mode. Gating it behind an opt-in toggle was a necessary
      first step, but where an integration has no viable path to production execution without incurring
      surprise billing, clean excision is superior to dead toggle maintenance.

      Excising Gemini CLI removes secondary fallback and unmetered billing risks from CI workflows.
      When subscription-backed Antigravity execution is proven via local ARC runner mounting (#669),
      Gemini will return as a first-class, unmetered harness.
