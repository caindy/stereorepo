decisions:
  - id: work:decision/283
    name: "DR-283 · A branch current with its base but reporting CONFLICTING force-pushes an empty commit to clear GitHub's stale cache"
    status: ADOPTED
    supersedes:
      - work:decision/133
    applies:
      - work:article/19
    enacted_in:
      - work:artifact/github-workflows-coder
    context: >-
      A rebase dispatch for a branch already current with its base is generally
      a duplicate dispatch that can be safely ignored. However, GitHub's
      `mergeable` API occasionally caches a `CONFLICTING` state indefinitely,
      even when the branch is perfectly clean against its base. Since the
      reconciler loops on `CONFLICTING`, this causes a deadlock where the pull
      request repeatedly dispatches a rebase that stops because it finds nothing
      to do.
    alternatives:
      - name: Hand the pull request back to the human
        chosen: false
        reason: >-
          This requires human intervention for what is purely a system
          cache failure.
      - name: Force-push an empty commit to clear the cache
        chosen: true
        reason: >-
          A mechanical refresh avoids involving the solo operator.
    consequences:
      - >-
        When the rebase pass finds the branch is already current with its base,
        it reads GitHub's view via `gh pr view <number> --json mergeable`. If
        GitHub reports `CONFLICTING`, the cache is stuck. Partially supersedes
        DR-133, which previously stopped the pass in all cases where the branch
        was current with its base.
      - >-
        The pass clears the cache by authoring an empty commit and force-pushing it.
        This commit is minted as a Mergeability Refresh Commit, and must carry the `Actor:` and
        `Agent:` trailers Article 19 requires via `.meta/say/commit --allow-empty`.
      - >-
        To prevent looping, the pass must distinguish between a stuck cache and
        a cache that hasn't refreshed yet after a recent push. If the branch tip's
        subject matches the refresh commit's message, the push has already happened
        and the pass must stop. This tip check bounds a branch to one refresh for
        its whole life (not one per stranding), and a second stranding on an
        already-refreshed branch is routed to the solo deliberately.
    rationale: |-
      Without a mechanical refresh, a stuck mergeability cache places the 
      loop in an unbound state where it repeatedly rebases, finds nothing to do, 
      and gets scheduled again because GitHub still reports the pull request as 
      CONFLICTING. Authoring a zero-diff commit updates the branch head, forcing 
      GitHub's backend to recalculate mergeability immediately. Partially 
      supersedes DR-133 because the pass must now continue beyond the "current 
      with base" check to inspect the pull request's state.
    falsifier: >-
      A branch carrying two Mergeability Refresh Commits (the loop the tip check
      exists to prevent), or a `CONFLICTING` branch current with its base that
      stops without a refresh commit and without handing off.
    challenge: work:challenge/965
