decisions:
  - id: work:decision/107
    name: "DR-107 · The reviewer is a machine account, and a Role's name is what its login and its credential file both carry"
    challenge: work:challenge/30
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/19
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-assertions-authority
      - work:artifact/meta-assertions-imported-authority
      - work:artifact/meta-disciplines
      - work:artifact/meta-lib-check-pr-github
      - work:artifact/meta-checks-probes-loops-advance
      - work:artifact/meta-checks-probes-harness-fakes
      - work:artifact/meta-checks-probes-harness-github
      - work:artifact/meta-checks-citations-loaders
      - work:artifact/meta-checks-probes-loops-dispatch
    alternatives:
      - name: The reviewer stays Copilot
        chosen: false
        reason: >-
          Copilot's review is a product's fixed reviewer. It holds no Remit of
          this repository's, cannot be handed a Challenge, and cannot resolve a
          thread as a party A16 would count. Roles would then be only the seam
          between the solo and one agent, which is the narrower of the two
          readings #30 asked to settle.
      - name: One account, two tokens
        chosen: false
        reason: >-
          DR-066's falsifier exactly. GitHub records one login for both Roles,
          so A16's second party is back to being a Trailer the writer remembered,
          and a review request names the requester.
      - name: A machine account per Role, named `<owner>-<repo>-<role>`, with its credential at `~/.config/solorepo/<role>.env`
        chosen: true
        reason: >-
          The Role's name is said once. The login, the file and the assertion
          derive from it, so the channel can name the next Role's account
          without reading its token and without a login copied into a script.
          What it costs is a seat and a recovery path per Role, and that on
          this machine the two files sit side by side under one user.
    consequences:
      - >-
        DR-066 moves to ADOPTED. The accounts exist, and the handoff is a review
        request: `.meta/say request-review <n>` names the next Role's login by
        the convention above, and an arriving Job asks GitHub what has been
        requested of its own.
      - >-
        The channel speaks as a Role. `--role <name>` selects
        `~/.config/solorepo/<name>.env`, coder by default, and
        `SOLOREPO_ROLE_ENV` still names a file outright. The reviewer's act is
        `.meta/say --role reviewer review <n>`, approving, requesting changes or
        commenting, signed like every other utterance.
      - >-
        Roles are asserted. `work:role/coder` and `work:role/reviewer` join
        `authority.yaml` with the two PrincipalIdentities GitHub holds, and the
        Permission to speak is held by a Role rather than by whatever Actor is
        working here.
      - >-
        Both accounts hold WRITE, and this is said rather than hidden. GitHub
        counts an approval only from write access and grants no tier that can
        approve without being able to push, so DR-066's "account that cannot
        push" is not what GitHub holds. What it holds is the ruleset on `main`:
        nothing lands there outside a squash-merged pull request with every
        thread resolved. A reviewer not pushing to a branch is a step of the
        Discipline until a ruleset restricts it.
      - >-
        The two token files sit in one directory under one user, which is
        DR-066's falsifier in letter. DR-073 had already conceded that this
        machine is no boundary and that the boundary arrives with a container
        holding one token, which is #21 and #29. The decision stands on what the
        accounts do buy, GitHub telling the Roles apart and a review that can be
        requested, and the falsifier moves to the container.
      - >-
        The sole-author step keeps its rule and changes its reason. A Role's
        login now tells it from the solo and from another Role; within one Role
        the Trailer is all that tells two Jobs apart, and the channel's refusal
        keys on the Trailer, so it still holds.
      - >-
        `require_extra_approval_for_unattributed_changes` (DR-056) now has
        attributed commits to read, since each arrives under a Role account's
        address; with `required_approving_review_count` at zero it still requires
        nothing. Left as found.
    falsifier: >-
      A Role acting under another Role's login from the same session, because
      the file was readable. The accounts would then be costume, and what DR-073
      conceded about the machine would have been built into the verbs.
    rationale: |-
      Christopher created the reviewer account and its credential file himself,
      on the pattern the coder already had, which is the act DR-066 said was the
      solo's and the reason it was RECOMMENDED rather than in force.

      Whether Roles are a general mechanism was the question under the first
      half, and the answer is that a Role here is a name: a third one is a file,
      an account and an assertion, and none of them touch the channel. The
      second half is answered less well than #30 hoped, and the record says so
      instead of claiming the boundary the container will provide.
