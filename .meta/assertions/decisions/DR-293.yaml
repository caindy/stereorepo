decisions:
  - id: work:decision/293
    name: "DR-293 · Escalate an autonomous draft only after two guarded reconciler observations"
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/22
    enacted_in:
      - work:artifact/meta-lib-move-manager
      - work:artifact/meta-lib-move-reconcile
      - work:artifact/meta-checks-probes-loops-escalation
    context: >-
      DR-258 demotes a stalled autonomous pull request to draft so that it no
      longer blocks the merge queue. Draft demotion is deliberately reversible:
      a subsequent commit, review, or successful rebase can restore progress.
      A draft that remains stalled nevertheless consumes reconciliation passes,
      GitHub Actions minutes, and agent turns without presenting its diagnosis
      to the solo. Challenge #315 requires a bounded escalation without
      interrupting a coder that is currently reviewing, rebasing, or running.
    alternatives:
      - name: Stop a Challenge as soon as its pull request is demoted to draft
        chosen: false
        reason: >-
          A review verdict or merge conflict can trigger draft demotion while a
          coder or rebase pass is queued or running. Stopping at that point
          discards progressing autonomous work.
      - name: Keep draft demotion as the only response to every autonomous stall
        chosen: false
        reason: >-
          Leaves irrecoverable drafts in a reversible state indefinitely and
          never makes the solo aware that automation has stopped making progress.
      - name: Record two guarded observations before stopping the Challenge
        chosen: true
        reason: >-
          Preserves DR-258's reversible pause while requiring evidence that the
          same implementation draft remained inactive across reconciliation
          cycles. The durable first observation survives reconciler restarts
          and is invalidated when the pull request head changes.
    consequences:
      - >-
        The first reconciliation that finds an autonomous implementation draft
        inactive for at least the reconciliation bound, with no queued or
        in-progress GitHub Actions run, records a signed observation tagged
        with its head object identifier.
      - >-
        A later reconciliation stops the associated Challenge only when it
        finds the same tagged head with every guard still satisfied, releasing
        the claim and moving the Challenge to `human`.
      - >-
        A merge-conflicting draft also requires a completed coder rebase attempt
        that left GitHub reporting the conflict. Existing coder turn-cap
        handling and non-take workflow caps remain outside this Decision.
      - >-
        Closes #315.
    falsifier: >-
      A Challenge is stopped while its autonomous pull request has a queued or
      in-progress GitHub Actions run, before a second guarded reconciliation
      sees the same draft head, or while a merge conflict has not completed a
      rebase attempt.
    rationale: |-
      A reconciliation sweep observes repository state, but one observation
      cannot distinguish a dead loop from a healthy agent between actions.
      Requiring two observations creates a small, durable circuit breaker:
      progress replaces the head and invalidates the record, while continued
      inactivity becomes visible to the solo through `move stop`.

      The guard reads every GitHub Actions workflow rather than only the three
      loop workflows because a branch can be actively answered by another
      workflow. A conflict needs its separate rebase guard because GitHub can
      report the conflict before the dispatched rebase pass starts. Together,
      the guards retain the reversible queue-management role of draft demotion
      and reserve hard escalation for work that automation has demonstrated it
      cannot advance.
