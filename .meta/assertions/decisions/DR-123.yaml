decisions:
  - id: work:decision/123
    name: "DR-123 · A portfolio inherits the channel's authority — its Capabilities, Permissions and Roles — under imported/, and asserts the accounts its Roles hold as its own"
    challenge: work:challenge/132
    status: ADOPTED
    applies:
      - work:article/6
      - work:article/10
    enacted_in:
      - work:artifact/meta-assertions-imported-authority
      - work:artifact/meta-assertions-authority
      - work:artifact/template-meta-assertions-authority
      - work:artifact/meta-check
    alternatives:
      - name: Move the whole file under `imported/`
        chosen: false
        reason: >-
          One move, and every portfolio then carries solorepo's account names
          in a directory it must not edit. The identities are the one part of
          the file that is not the channel's.
      - name: Seed the whole file under `template/`
        chosen: false
        reason: >-
          The Roles become the portfolio's to edit, and a sync leaves them
          alone while it moves the channel and the three loop workflows that
          assume exactly these two Roles. The description drifts from the
          thing it describes.
      - name: Guard the read, and report `?` where the file is absent
        chosen: false
        reason: >-
          Cheapest, and it leaves a portfolio with the authority half of the
          ontology asserted nowhere and every `held_by` checked against
          nothing. A guard standing where a decision should be.
      - name: Split it along the seam the file already has
        chosen: true
        reason: >-
          The Capabilities, the Securable, the Permissions and the two Roles
          describe `.meta/say/`, which every portfolio copies verbatim, so
          they are the same in every portfolio and travel with it under
          `imported/`. The `principal_identities` name accounts, which are the
          portfolio's own and created by the solo (DR-066), so they stay in
          the portfolio's `authority.yaml` and are seeded under `template/`
          with placeholders the gate refuses until they are filled. The same
          seam DR-041 used for `stakeholders/`: what solorepo defines is
          inherited, what the portfolio has is its own. The loader takes two
          files with different top-level keys already, and references
          resolve across them.
    consequences:
      - >-
        `channel table probes` reads the Roles from `imported/authority.yaml`.
        The scratch portfolio the #114 fix was verified on has a green gate end
        to end, which no specialized portfolio had before.
      - >-
        The seed carries two identities with the owner and repository
        placeholders in their logins, the convention DR-107 fixed, which
        step four fills in. Nothing at run time reads them — the channel
        derives a login from the repository name — so the seed records the
        accounts rather than configuring them.
      - >-
        DR-006, DR-116 and DR-117 name the inherited half under `enacted_in`,
        where the rule each carries now lives; DR-066 and DR-107 name both
        halves. The inherited half cites solorepo's record as solorepo's
        (DR-121), since it is now a copied file.
    falsifier: >-
      A portfolio that needs a Role the channel does not have — a third Role,
      held by an account and holding a verb of its own. Then the Roles are not
      wholly the channel's, the seam moves, and the inherited half has to admit
      an addition it does not sync.
    rationale: |-
      Christopher chose it from the four, on the seam: the file held two
      things with different owners, and every other shape put one of them on
      the wrong side.
