decisions:
  - id: work:decision/197
    name: "DR-197 · Cryptographic SSH git commit signing keys for machine Roles"
    challenge: work:challenge/345
    status: ADOPTED
    applies:
      - work:article/19
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-say-commit
      - work:artifact/meta-say-whoami
      - work:artifact/github-workflows-coder
      - work:artifact/meta-checks-probes-channel-signing-key
    context: >-
      Commits produced by .meta/say/commit injected the coder Role's identity via
      role_identity() and appended Actor: and Agent: trailers (solorepo's DR-062,
      solorepo's DR-074), but were cryptographically unsigned at the git object layer.
      Consequently, commits pushed by automated coder workflows lacked GitHub's
      'Verified' badge, textual attestation lacked non-repudiation, and enabling
      GitHub's native 'Require signed commits' branch protection rule would break
      the automated loop.
    alternatives:
      - name: GPG commit signing keys in the runner keyring
        chosen: false
        reason: >-
          GPG requires stateful keyrings (~/.gnupg), running background gpg-agent
          daemons, and loopback pinentry workarounds in headless CI containers,
          introducing high operational fragility.
      - name: Global git configuration in runner environment
        chosen: false
        reason: >-
          Configuring signing globally via `git config --global user.signingkey`
          breaks clean isolation on developer machines (solorepo's DR-073) and would sign commits
          even when executed outside the channel, violating the principle that
          unmediated git commits remain unsigned (solorepo's DR-074, solorepo's DR-117).
      - name: Ephemeral SSH signing keys bound per-role and per-machine outside the tree
        chosen: true
        reason: >-
          Modern Git and GitHub natively support SSH signing keys. An Ed25519 keypair
          is self-contained, lives outside the tree at ~/.config/solorepo/<role>_signing.key
          with 0600 permissions per solorepo's DR-073, is passed into the runner via CODER_SIGNING_KEY,
          and is passed dynamically via `-c gpg.format=ssh -c user.signingkey=... -c commit.gpgsign=true`
          strictly to child git commit processes in .meta/say/commit.
    consequences:
      - >-
        .meta/say/channel.py provides role_signing_key() discovering and validating
        SSH signing keys from ~/.config/solorepo/<role>_signing.key or GIT_SIGNING_KEY.
      - >-
        .meta/say/commit dynamically injects SSH signing configuration flags into
        git commit when operating under a Role credential.
      - >-
        .meta/say/whoami displays the signing key path alongside role identity.
      - >-
        .github/workflows/coder.yml unpacks CODER_SIGNING_KEY into ~/.config/solorepo/coder_signing.key
        during credential initialization.
    falsifier: >-
      A commit authored under a Role credential that lacks cryptographic verification
      on GitHub or whose private signing key is stored inside the working tree.
    rationale: |-
      Cryptographic signing closes the gap between the channel's textual attestation
      (solorepo's DR-069) and Git's native object integrity. SSH signing eliminates GPG daemon
      complexity while upholding solorepo's DR-073's boundary: secrets remain outside the tree,
      per role and per machine, injected strictly into child processes.
