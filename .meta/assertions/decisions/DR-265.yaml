decisions:
  - id: work:decision/265
    name: "DR-265 · Read a comment verdict with a thread owed an answer as a request for changes"
    challenge: work:challenge/826
    status: ADOPTED
    applies:
      - work:article/22
    enacted_in:
      - work:artifact/meta-lib-check-pr-state
      - work:artifact/meta-lib-move-advance
      - work:artifact/meta-say-verbs
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-probes-loops-reconcile
      - work:artifact/meta-checks-probes-loops-dispatch
      - work:artifact/meta-checks-probes-harness-github
      - work:artifact/skill-pr-first-reviewer
    context: >-
      GitHub records three kinds of review: an approval, a request for changes, and
      a comment. A reviewer run that has decided to withhold approval can say so in
      a comment review's body instead of in GitHub's state for it, and the loops
      then read a pull request nothing is owed on. Solorepo's #805 is the shape: the
      reviewer's second verdict, on head 34be9950, says in its own words
      "withholding approval on the two open threads rather than the substance", and
      it was submitted as a comment review. `classify_pr` in
      `.meta/lib/check_pr/state.py` reads a request for changes with threads owed as
      `CHANGES_REQUESTED` and an approval with threads owed as `CHANGES_REQUESTED`
      too, and reached `AWAITING_REVIEW` here; `owed_by_pull` in
      `.meta/lib/move/reconcile.py` owes the review pass on `CHANGES_REQUESTED` and
      owed nothing; and `move dispatch 805 --task review` refused, saying "the last
      verdict caindy-solorepo-reviewer left on #805 is nothing" and pointing at
      `move request-review`, which asks the same reviewer for the same verdict
      again. Submitting the comment review consumed the review request, so no
      semaphore stood on it either, and the pull request sat for a day with two
      threads its coder was owed to answer.
    alternatives:
      - name: Refuse the verdict at the reviewer's door
        chosen: false
        reason: >-
          The Challenge proposed this as the cheaper end: `on reviewer after` refuses
          a `COMMENTED` verdict that leaves threads of the reviewer's own owed an
          answer, so the record carries the state GitHub reports rather than prose.
          It does not move a pull request. The door's `after` runs once the session
          has ended, so the verdict has already landed and the review request it
          consumed is already gone; the refusal reddens the reviewer check, which
          `classify_pr` then reads as `GATE_FAILED` with no request standing and no
          approval, a state `owed_by_pull` owes nothing on. Solorepo's #805 and every
          recurrence would stall exactly as before, loudly, and each would wait for
          the solo. It also holds the reviewer to a rule the readers do not
          mechanize, which is the state A22 says the system does not have.
      - name: Read any comment verdict as a request for changes
        chosen: false
        reason: >-
          Dropping the thread condition makes one rule of it, and the rule is
          defensible — a comment verdict withholds approval whatever it left behind.
          It also dispatches a coder pass for a verdict with nothing on it to answer,
          which is the reviewer remarking rather than deciding, and it widens the
          blast radius of the arm beyond the shape the Challenge reports for no case
          the record holds.
      - name: Read a comment verdict with a thread owed as a request for changes
        chosen: true
        reason: >-
          One arm in the one classifier, which is the seam solorepo's DR-264 put
          there for this — every reader of pull request state asking the one
          classifier. The readers that do ask it in the tree today are the
          reconciler, the merge manager through `evaluate_pr`, and `just watch`
          through `polling`, so the arm moves solorepo's #805 and every recurrence
          without those readers learning the rule. The sweep and `just next` read
          the verdict themselves and do not, which the consequences record. It keeps
          the reviewer's prose admissible and leaves the coder with something to
          answer in every case it fires, since the threads are what the pass reads.
          A verdict is what `is_verdict` admits — a review that approves, requests
          changes, or comments with a body — so the bodiless comment review GitHub
          records around a reply on a thread is not one, and no request may stand, so
          a thread raised mid-review cannot flip the state under the session that
          raised it.
    consequences:
      - >-
        `classify_pr` reads the reviewer's standing verdict as `CHANGES_REQUESTED`
        where it is a comment verdict, a thread is owed an answer, and no review is
        requested; `standing_verdict` and `is_verdict` in
        `.meta/lib/check_pr/state.py` are the one reading of what a verdict is, and
        `verdicts_given` shares it.
      - >-
        `standing_verdict` reads both of GitHub's review listings, `reviews` before
        `latestReviews`, and the first to yield a verdict answers. `latestReviews` is
        one review per author and holds the newest whatever it is: solorepo's #805
        lists six reviews by the reviewer's account under `reviews` and exactly one
        under `latestReviews`, so a bodiless comment review displaces the verdict
        standing beneath it there and nowhere else — which is the shape a review run
        cancelled by a push leaves, and the shape every reply on a thread leaves.
        Reading `latestReviews` alone would have made `move dispatch --task review`
        refuse a standing request for changes it dispatched before this change.
      - >-
        `latest_verdict` is left as it stands and the arms already reading it keep
        doing so: giving the approval arm the standing verdict instead could turn a
        pull request that reads `AWAITING_REVIEW` today into `READY_TO_MERGE`, which
        the merge manager would land. The new arm asks `standing_verdict` alone, so
        nothing else in the classifier moves.
      - >-
        The doors that read the verdict themselves rather than through `classify_pr`
        keep GitHub's own word for it, and a comment verdict moves none of them:
        `is_changes_requested_pull` in `.meta/lib/check_pr/sweep.py` tests
        `latest_verdict` against the literal `CHANGES_REQUESTED`, which is what the
        sweep's `unanswered_changes` line, `move delegate` and `advance.dispatch`'s
        push-time re-delivery each ask, and `just next` prints GitHub's
        `reviewDecision`. So the solo's screen and the reconciler read solorepo's
        #805 differently until those readers are pointed at the classifier, which is
        the seam solorepo's DR-264 owns and not this arm's to move.
      - >-
        The arm sits below the gate and does not reach a comment verdict on a pull
        request with a failed check: `classify_pr` returns `GATE_FAILED` before any
        verdict is read, and `owed_by_pull`'s `GATE_FAILED` arm owes a review pass on
        an approval alone. A `--request-changes` in that shape is delivered anyway by
        `coder.yml`'s `pull_request_review` door, which fires on the event; a comment
        verdict has neither the event nor an arm, so a red check landing between the
        verdict and the coder's next push leaves solorepo's #805's shape standing.
        Closing it means a reader owing an act on the pair of a withheld approval and
        a failed gate, which is a second reading of the verdict beside the classifier
        and so belongs to solorepo's DR-264's seam rather than here.
      - >-
        The reconciler dispatches the coder's review pass for such a pull request,
        which is what moves it. `coder.yml`'s `pull_request_review` trigger still
        fires on `changes_requested` and `approved` alone, because every reply on a
        thread arrives as a `commented` review and a door on that event would fire
        on each one.
      - >-
        `move dispatch --task review` reads the same standing verdict and accepts a
        comment verdict. It asks for no thread, on the same terms the rebase pass is
        dispatched on: the solo dispatching has decided there is a verdict to answer.
      - >-
        The reviewer's reading of PR First says which verdict withholds approval:
        `--request-changes` is the state GitHub reports and every reader moves on,
        and a comment verdict left over threads owed an answer is read as one anyway.
      - >-
        Solorepo's #826 is settled and closed.
    falsifier: >-
      A pull request whose gate has not failed and whose reviewer has withheld
      approval, in any of GitHub's three review states, that no reader of
      `classify_pr` owes an act on; or a comment verdict that fires the arm where the
      coder has nothing to answer. A failed gate under a comment verdict is the case
      this entry leaves open rather than closes, and the consequences name it.
    rationale: |-
      The Challenge offered two ends and called the reviewer's the cheaper. It is
      cheaper to write and it closes nothing: a door that runs after the session
      cannot recall a verdict already submitted, and what it leaves behind is a red
      check on a pull request the reconciler still owes nothing on. The end that
      moves a pull request is the one the readers share.

      The rule itself is not a tolerance for sloppy reviewing. GitHub's three review
      states are a claim about the pull request, and two of them decide something;
      the third decides nothing on its own and everything when a thread is open
      under it, because an open thread the reviewer wrote is a request for changes
      with an anchor. Reading the pair — the verdict and what is owed — is reading
      what GitHub reports rather than what the body says, which is why it belongs in
      the classifier and not in a parse of the prose.
