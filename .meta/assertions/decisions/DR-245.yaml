decisions:
  - id: work:decision/245
    name: "DR-245 · Restoring autonomous loop Gemini fallback via subscription-backed Antigravity in self-hosted ARC runners"
    challenge: work:challenge/669
    status: ADOPTED
    supersedes:
      - work:decision/242
    enacted_in:
      - work:artifact/meta-actions-agy
      - work:artifact/meta-detect-fallback
      - work:artifact/github-workflows-coder
      - work:artifact/github-workflows-review
      - work:artifact/meta-arc-dockerfile
      - work:artifact/meta-arc-readme
      - work:artifact/meta-arc-deploy
      - work:artifact/meta-arc-values-runnerset
      - work:artifact/meta-assertions-disciplines
      - work:artifact/meta-assertions-structure
      - work:artifact/wiki-solorepo-dev-loop
    context: >-
      DR-178 adopted multi-harness fallback to Gemini CLI to recover from transient Claude Code crashes.
      DR-240 gated that fallback behind an opt-in toggle (`GEMINI_FALLBACK`) to eliminate unexpected
      pay-as-you-go billing from Google Cloud's `GEMINI_API_KEY`. DR-242 temporarily excised Gemini CLI
      from autonomous workflows because metered API keys imposed unbudgeted financial exposure and dead
      complexity in unattended CI loops, explicitly deferring the re-introduction of Gemini to
      Challenge #669 ("until personal subscription credentials can be mounted directly into self-hosted
      Actions Runner Controller (ARC) runner pods to drive the containerized Google Antigravity
      command-line interface without pay-as-you-go API keys").

      Challenge #669 discharged this deferral condition. Host workstation developer subscription credentials
      discovered in `~/.gemini` are packaged into Kubernetes Secret `arc-gemini-credentials`, mounted into
      runner pods via an ephemeral `initContainer` (`setup-gemini-creds`), and copied into an isolated,
      writable `emptyDir` at `/home/runner/.gemini` with restrictive permissions (`chmod 600`). The Antigravity
      CLI (`agy` pinned at 1.2.7) is pre-baked into the custom runner container image
      (`ghcr.io/caindy/solorepo-runner:2.337.0-3`), enabling unmetered headless execution under personal
      subscription quota without Google Cloud billing.
    alternatives:
      - name: Re-introduce Gemini CLI with metered GEMINI_API_KEY billing
        chosen: false
        reason: >-
          Retains dead complexity and exposes unattended CI loops to pay-as-you-go credit card consumption
          on crashes or extended iterations, violating the economic model settled in DR-240 and DR-242.
      - name: Enable fallback unconditionally by default (default=True in detect_fallback.py)
        chosen: false
        reason: >-
          While solorepo's local ARC runner cluster possesses mounted subscription credentials, unconfigured
          fresh clones and external portfolios lack an ARC cluster and credential mounts. Defaulting to
          enabled would cause unconfigured repositories to attempt invoking agy on Claude failure, resulting
          in missing-command or unauthenticated failures. Defaulting to false preserves DR-240's invariant that
          unconfigured repositories run safely without unexpected harness failures.
      - name: Delegate to subscription-backed agy in ARC runners with opt-in GEMINI_FALLBACK toggle
        chosen: true
        reason: >-
          Encapsulates agy invocation within local composite action .meta/actions/agy/action.yml, delegates
          coder and reviewer workflows to containerized agy under personal subscription quota without API keys,
          and retains GEMINI_FALLBACK as an opt-in toggle (defaulting to false, enabled explicitly in solorepo
          via repository variables).
    consequences:
      - >-
        .meta/actions/agy/action.yml encapsulates agy execution with `--add-dir "$GITHUB_WORKSPACE"` and
        `--dangerously-skip-permissions`.
      - >-
        In .github/workflows/coder.yml and .github/workflows/review.yml, Gemini execution steps delegate to
        agy via .meta/actions/agy, supporting explicit `harness:gemini` label selection and fallback.
      - >-
        .meta/detect_fallback.py is restored to inspect Claude execution failures and activate fallback when
        GEMINI_FALLBACK is enabled (defaulting to False), exporting AI_AGENT=antigravity-cli and
        ACTOR_AGENT=antigravity-cli.
      - >-
        In coder.yml, choose the depth exports gemini_model and effort keys alongside Claude depth parameters
        to model all agy passes deterministically.
      - >-
        Specialization Step 2 inherits .meta/detect_fallback.py alongside coder.yml and review.yml, documenting
        vars.GEMINI_FALLBACK as opt-in for portfolios that stand up ARC runners with subscription credentials.
      - >-
        wiki/solorepo/dev-loop.md is updated to reflect subscription-backed Antigravity fallback.
      - >-
        Closes #669.
    falsifier: >-
      Any reference to run-gemini-cli or GEMINI_API_KEY surviving in .github/workflows/review.yml or
      .github/workflows/coder.yml; or coder.yml invoking agy without gemini_model and effort outputs from
      choose the depth; or a Claude failure activating fallback when vars.GEMINI_FALLBACK is unset or false.
    rationale: |-
      Self-healing autonomous loops require multi-vendor resilience to prevent stalled challenges on
      upstream model outages or rate limits (solorepo's DR-178). However, coupling a flat-rate subscription
      harness to a metered pay-as-you-go API key created unacceptable financial exposure (solorepo's DR-240,
      solorepo's DR-242). Mounting developer subscription credentials into ARC runner pods via ephemeral
      initContainers and isolated emptyDir volumes resolves the economic hazard, allowing containerized
      Google Antigravity to run as an unmetered, first-class fallback harness. Retaining the opt-in toggle
      ensures that fresh clones without ARC infrastructure remain fully functional without encountering
      unauthenticated fallback failures.
