decisions:
  - id: work:decision/064
    name: "DR-064 · Work noticed and not done is a conversation first, and an Issue only if it survives"
    status: ADOPTED
    supersedes:
      - work:decision/054
      - work:decision/057
    applies:
      - work:article/15
      - work:article/16
    alternatives:
      - name: File an Issue at the moment of noticing
        chosen: false
        reason: >-
          What A15 asked for until now, and it creates a tracker item with no
          relationship to the outcome of the change that produced it. When the approach moves
          underneath it the Issue goes stale and nothing notices, because an
          Issue has no link back to the argument that would have corrected it.
      - name: Raise it as a conversation, promote at merge
        chosen: true
        reason: >-
          It keeps the context it was noticed in, it blocks the merge until
          somebody rules on it, and what the change overtakes dies where it was
          raised instead of in the tracker. What it costs is that an item is
          invisible to anyone not reading the pull request until it is promoted.
      - name: Keep a list in the body
        chosen: false
        reason: >-
          Still what A15 was written against. A bullet closes when the pull
          request does, and nothing blocks on it.
    consequences:
      - >-
        A16 widens: a resolved thread carries a reply from someone else **or** a
        link to the Issue it became. Without this the practice cannot be
        followed by a solo, since every thread on a change may have one author
        and demanding a second manufactures the reply A16 exists to catch.
      - >-
        The body's fourth heading is filled at merge rather than before review,
        and is legitimately empty until then.
      - >-
        A thread held open on purpose is marked `**Noticed and not done.**`, or
        the tooling wakes someone for it. Found within a minute of the first
        one being raised, by the watch firing on it.
      - >-
        A pull request is merged, never abandoned. It exists because a Challenge
        does, and a Challenge is a real need, so work that turned out to be the
        wrong answer merges as the record of that.
      - >-
        PR First's *Merged, never abandoned* step is restored, having been deleted by accident
        in DR-060's edit and shipped missing.
    falsifier: >-
      A parked conversation that outlives the pull request — promoted to nothing
      and answered by nobody, because the merge went through while it was still
      marked. That would mean the marker bought silence rather than distinction.
    enacted_in:
      - work:artifact/meta-disciplines
    rationale: |-
      Issue #10 was filed at review time on a design that was about to
      change — a tracker item that would have gone stale with nothing to
      notice.

      A conversation survives DR-054's own test, which is what makes this
      a replacement rather than a relaxation. That decision rejected
      `TECH_DEBT.md` for four failures; a thread has state, carries the
      diff it was noticed against, is bounded by one pull request, and
      flushes in scope. The reasoning that sent these to Issues objects to
      prose in a body, not to threads.

      The blocking half was already installed by DR-057, so nothing new
      enforces this. And the merge is the authorisation: asking for it
      with a conversation still open is the ruling that the item earns an
      Issue.
