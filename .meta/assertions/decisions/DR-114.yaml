decisions:
  - id: work:decision/114
    name: "DR-114 · What to work on next is a verb over fields a listing can read: a first line that says what an Issue waits on, a Milestone for the priority, and a sweep that refuses an untriaged Challenge"
    challenge: work:challenge/108
    status: ADOPTED
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-next
      - work:artifact/justfile
      - work:artifact/meta-say
      - work:artifact/meta-templates-issue
      - work:artifact/meta-templates-roadmap
      - work:artifact/github-workflows-gate
      - work:artifact/meta-readme
      - work:artifact/meta-render
    alternatives:
      - name: Read the Issues each time, better
        chosen: false
        reason: >-
          List titles and labels first, open only the candidates. It halves
          the cost and leaves the shape: what an Issue waits on is a
          paragraph, so ripeness is still learned by reading, and every
          session pays again. A discipline of reading less is a rule an
          agent has to remember, against a fact the Issue could simply
          carry.
      - name: A generated status page, written by the sweep
        chosen: false
        reason: >-
          `STATUS.md` or a pinned Issue the scheduled sweep rewrites. It is
          read by the next session at no cost, and it is a file about state
          that nothing consumes between rewrites — DR-052's journal and
          DR-088's roadmap file, again — and it is thirty minutes stale by
          construction, on a question that is asked because something just
          merged.
      - name: GitHub's own Issue dependencies for what waits on what
        chosen: false
        reason: >-
          Native, visible in the Issue's sidebar, and a relationship GitHub
          could one day enforce. But the form is where an Issue is authored
          and read, and a relationship set outside it is a second home for
          one fact, which #11 is about; the channel has no verb to set one
          and the sweep none to read one; and a blocker is often not an
          Issue — a Decision, an account — which a relationship cannot name
          and a line can. Reconsider when a portfolio wants the sidebar.
      - name: A verb over fields the forms and GitHub already hold
        chosen: true
        reason: >-
          `just next` prints one screen: open pull requests with their
          armed state, the last run of each loop, the open Milestones with
          their Issues, and every open Issue by what it waits on, split into
          ripe, waiting, untriaged and roadmap. It reads four fields. What
          an Issue waits on is the first line of both forms, `**Waits
          on.**`, with `#<n>` per blocker or `Nothing`; difficulty is the
          label DR-112 already made the raiser's; priority is a Milestone,
          written once, the lowest-numbered open one next; and the loop's
          and pull requests' states are GitHub's. The sweep runs `next.py
          --check` and fails on a Challenge with no difficulty, so the queue
          the coder reads cannot empty without the red saying so. What it
          costs: one more tool under `.meta/` with its own `gh` calls; a
          first line every raiser must write, on top of the middle heading
          that already filters; a blocker written as prose keeps an Issue
          waiting until somebody turns it into a number; and a Milestone is
          a setting on GitHub rather than a line in the tree, so `say`
          gains a verb to create one and the record of the priority is
          GitHub's.
    consequences:
      - >-
        `.meta/next.py` is the verb, `just next` its recipe, and the load
        map's row for what is intended or open points at it. Asked what to
        work on next, a session runs it and reads the screen; `AGENTS.md`
        says so, since that is the file a session already holds.
      - >-
        Both Issue forms open with `**Waits on.**`. The roadmap form's
        `What it waits on` paragraph becomes that line; `next.py` still
        reads the paragraph on the Issues filed under the old form, so
        nothing has to be rewritten to be listed, and a rewrite turns a
        prose blocker into a number.
      - >-
        The channel gains `milestone`, which creates the Milestone when it
        is new and reads back. A Milestone is the one place priority is
        recorded, and `next.py` lists the open ones lowest number first.
      - >-
        The scheduled sweep fails on a Challenge with no difficulty. Red
        there is a label the solo owes, and the seven open Challenges that
        predated DR-112 were labelled on the same pull request, so the
        first sweep after it is green.
      - >-
        Cost, measured once: the question that took a session about 72k
        tokens and three minutes on 2026-09-08 is one command whose output
        is a screen.
    falsifier: >-
      A session that runs `just next` and still opens Issue bodies to decide
      what is ripe, or a sweep that stays red for more than a day because a
      difficulty is not worth the solo's minute. The first says the fields do
      not carry what the decision needs; the second says the nag is the
      wrong consumer.
    rationale: |-
      Christopher: 72k tokens and three minutes to answer "what should we
      work on next" is far too long; optimise the repository for how fast
      that question is answered. The six ideas offered were taken as one
      change, since each is a field the others read.
