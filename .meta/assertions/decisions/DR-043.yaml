decisions:
  - id: work:decision/043
    name: "DR-043 · Literate Programming generalises; six Disciplines pull up from `python_bootstrap`"
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-disciplines
    rationale: |-
      Literate Programming was too narrow to have a Rust implementation.
      It said a *schema* is an exposition; it now says an **artifact** is,
      wherever prose and machine-readable content coexist. Note the
      direction — the pull-up was needed *before* a language
      implementation could exist, not after.

      Nine of `python_bootstrap`'s eleven invariants turn out to be
      language-neutral, which corrects the sense that they are Python
      disciplines. Nine collapse to six because three pairs say one thing
      twice once stated as ways of working rather than as rules.

      Two were already practised here without being named: Written
      Decisions is DR-012 and the routing rule, Seeded Artifacts is
      DR-034's template-parses check. Naming them makes them inheritable
      and gives a language bootstrap something to implement against.
