decisions:
  - id: work:decision/056
    name: "DR-056 · main is protected, and the hook that stood in for it was removed by its own condition"
    status: ADOPTED
    supersedes:
      - work:decision/055
    alternatives:
      - name: "A pre-push hook"
        chosen: false
        reason: "`--no-verify` walks past it, it lives in the clone rather than the repository, and `core.hooksPath` resolves inside the worktree — so on `main`, the one branch it protected, it was never checked out at all."
      - name: "A ruleset on main"
        chosen: true
        reason: "`bypass_actors: []`, squash-only, required status checks strict. Enforcement rather than friction, and it needed a paid plan."
    consequences:
      - "The hook was deleted by the condition written into the pull request that introduced it."
      - "Every subject on `main` carries `(#n)`, because the repository is squash-only with `squash_merge_commit_title=PR_TITLE`."
      - "GitHub added `require_extra_approval_for_unattributed_changes` on its own; inert at zero required approvals, and filed rather than left in a paragraph."
    enacted_in:
      - work:artifact/github-workflows-gate
    rationale: |-
      A hook cannot protect `main`, and not for the reason it was
      rejected. `core.hooksPath` resolves inside the worktree, so a
      tracked hook is present only on branches carrying the file — on
      `main`, the one branch it existed to protect, it was never checked
      out at all. A control absent exactly where it is needed, which
      reading it would not have revealed. It took pushing an empty commit
      twice to find.

      The fence came down cleanly because the pull request that raised it
      had answered *what would make this removable* with issue #1 landing.
      That heading is what closed the loop, an hour later, without anyone
      having to remember why the hook was there.
