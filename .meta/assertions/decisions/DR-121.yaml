decisions:
  - id: work:decision/121
    name: "DR-121 · What a portfolio inherits cites solorepo's record as solorepo's, and a portfolio's gate passes over a citation of a record it does not carry"
    challenge: work:challenge/114
    status: ADOPTED
    applies:
      - work:article/10
      - work:article/12
    enacted_in:
      - work:artifact/meta-check
      - work:artifact/meta-work-decisions
      - work:artifact/meta-schemas
      - work:artifact/meta-assertions-imported-readme
      - work:artifact/meta-render
      - work:artifact/specialize
      - work:artifact/meta-checks-graph-artifacts
      - work:artifact/meta-checks-citations-record
    alternatives:
      - name: The inherited material stops citing numbers and says the rule instead
        chosen: false
        reason: >-
          Cheapest to check and it loses the trail from a rule to the argument
          that produced it, which is the property the record exists for. It
          was also not needed: the number can stay if it says whose it is.
      - name: A portfolio inherits the entries its imported material cites, read-only beside `imported/`
        chosen: false
        reason: >-
          Keeps the trail and collides on ids. The portfolio's eighty-fifth
          decision is `work:decision/085` too, and the seed's own `DR-001.yaml`
          already says the scaffold's record stays with the scaffold and the
          portfolio's starts at one. An id that names its home would let the
          entries travel, and that is #19's question, not this one's.
      - name: The gate resolves a citation against the imported record as well as the local one
        chosen: false
        reason: >-
          The smallest change as #114 put it, and it resolves against nothing:
          no imported record is carried. It would also make "cited and does not
          exist" mean two things depending on which file the citation is in.
      - name: A citation of solorepo's record says so, and the gate resolves it only where that record is
        chosen: true
        reason: >-
          `solorepo's DR-104`, never a bare `DR-104`, in every file a portfolio
          copies and every line `render.py` writes into a copied page. The
          Charter's own line decided it — a citation that silently comes to
          mean something else is worse than a dangling one — and a bare number
          in a portfolio's Charter does exactly that on the day its record
          reaches it, and passes the gate while doing it. The trail survives as
          words: a reader of a portfolio knows which record to open. What it
          costs is a possessive on sixty-odd lines that read as self-reference
          in the scaffold, and a retired Article's `retired_by` becoming prose
          rather than a typed reference, since the Decision it names is one no
          portfolio has.
    consequences:
      - >-
        `cited decisions` scans what a portfolio copies — the schemas, the
        workflows, the actions, the templates and `template/` — as well as the
        pages and the assertions, with code spans stripped, since a path in
        backticks is not a citation. `justfile` too: it has no suffix and is
        not copied, but `render.py` writes it into every portfolio from its
        own literals, and one of them cited DR-106 bare until review. A bare number in a copied file fails in
        the scaffold, where the copy is made from, so the form holds under
        sync rather than being tidied once. A citation of solorepo's record
        resolves against this one when the Portfolio asserted is solorepo, and
        is passed over otherwise. Under `template/` a bare number is the
        seed's record, which is the portfolio's.
      - >-
        `RetiredArticle.retired_by` is a string carrying the citation, and the
        references check no longer covers it. What that gave up: a wrong number
        still fails `cited decisions` in the scaffold, and a wrong form — the
        reference this was, a two-digit number, prose with no number — passed
        everything until the reviewer said so. The slot carries a `pattern`,
        and `reserved article numbers` holds the form, since a string slot is
        one nothing resolves.
      - >-
        `schemas.md` cites DR-003 without a link into the record, which a
        portfolio has not got. The Specialization copy step names the two
        umbrellas by path, so `inherited()` lists them and the checks that
        read the copied set see them.
      - >-
        A bare number in an inherited `.py` — `check.py`'s own docstrings,
        the channel's, the hooks' — is not scanned and reads the same way in a
        portfolio. Left as it is and noticed on the pull request; a code
        comment is read beside the code that cites it, and the sweep would
        have doubled the diff.
    falsifier: >-
      A portfolio that has to resolve one of these — a step that must read
      solorepo's DR-085 to check something — and finds that a name in prose is
      not a reference. Then either the record travels or the id names its home,
      and the possessive was the interim it is.
    rationale: |-
      Verified the way #114 found it: a scratch tree built by steps one to
      three and six of the Discipline, and its gate run. Red on four steps
      before — the three #114 named and a fourth that arrived since — and on
      one after, which is a different cause and its own notice.
