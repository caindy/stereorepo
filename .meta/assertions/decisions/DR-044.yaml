decisions:
  - id: work:decision/044
    name: "DR-044 · Literate Programming stops prescribing where prose sits"
    status: ADOPTED
    enacted_in:
      - work:artifact/meta-disciplines
      - work:artifact/meta-checks-citations-claims
    rationale: |-
      DR-043's step read "keep the exposition in one copy, **included**
      rather than restated". That was over-prescriptive in a way that
      mattered: it ruled out inline documentation, which a core Discipline
      has no business doing and which would have made a correct Rust
      implementation non-conformant. The requirement is the single copy
      and the machine reading it; where the prose sits is a language's
      business.

      The illustrations stay. An example of how a Discipline has been
      satisfied is not a prescription, and removing them would make it
      harder to apply rather than less prescriptive.

      One candidate for pulling up once a second language confirms it: a
      history entry names the test that would fail if it regressed, which
      makes relevance mechanical — if the test is gone, the entry is
      stale. That is why header changelogs are useless.
