decisions:
  - id: work:decision/214
    name: "DR-214 · Coordination is what GitHub records, not what git history carries"
    status: ADOPTED
    applies:
      - work:article/18
    enacted_in:
      - work:artifact/meta-disciplines
      - work:artifact/github-workflows-coder
      - work:artifact/github-workflows-review
      - work:artifact/github-workflows-advance
      - work:artifact/github-workflows-merge
    context: >-
      A solo runs Jobs that share no filesystem, no shell and no conversation, so
      something has to carry the work between them. Git is the candidate already
      present: an append-only log with a Merkle DAG over it, ordered,
      content-addressed, signable, replicated to every clone, and — the part no
      external service offers — held in the same object store as the code the
      message is about. Branches are topics and commits are messages to the
      future, which is a working design and was this repository's first one.

      Two forces were in tension with it. Dispatch has to reach a worker whose
      machine is not known when the work is filed, and the solo has to be able to
      pick a piece of work up interactively without something else handing it
      over. Doing nothing meant refs stayed the bus and both forces stayed
      unresolved: a Job could only be handed to a clone somebody named, and the
      solo could only reach work through whatever held it.
    alternatives:
      - name: Git history as the message bus — branches as topics, commits as messages to the future
        chosen: false
        reason: >-
          Refs make every participant a peer of every other and none of them a
          rendezvous. Handing work over means naming the clone that will take it,
          or having every clone poll every topic, so the consumer is bound at the
          moment the work is produced. It also leaves the solo outside: a piece of
          work lives in a clone on a machine, so reaching it interactively means
          going through whatever is running there. What rejecting this costs is
          real and is not recovered elsewhere — offline operation, co-location of
          the message with the code, and a DAG that carries genuine happens-before.
      - name: A local supervisor over a filesystem queue
        chosen: false
        reason: >-
          The shape firstmate and SwarmForge both arrived at independently: a
          worktree per worker, a session multiplexer for the process surface,
          directories as inboxes and outboxes, and a daemon that delivers. It
          fixes delivery and fixes nothing else. Workers are still early-bound,
          because the supervisor spawns them and holds the handle, and a
          persistent one has to be registered with a scope before work can route
          to it. Worse for this repository, it makes the solo an audience: the
          queue belongs to the supervisor, so reaching a piece of work means
          asking the thing that owns it, and the supervisor becomes an
          intermediary on every exchange.
      - name: What GitHub records — Issues, labels, review requests, threads and check states
        chosen: true
        reason: >-
          An Issue is a rendezvous rather than an address, so nothing names the
          executing machine when the work is filed and a runner claims it by
          showing up. And the solo reaches the same records the Jobs do, through a
          Role account like any other, so taking work back is a label change and
          not a handover negotiated with an agent. What it costs is everything the
          first alternative had: this does not work offline, the coordination
          record no longer travels in the clone, webhooks can be missed, reordered
          or cancelled where a DAG could not be, and one vendor now holds the work
          queue, the handoff semaphore and the argument at once.
    consequences:
      - >-
        Workers bind late. Nothing names a machine at produce time; the coder pass
        runs where the label lands, and DR-137's move to a self-hosted runner
        changed where that is without changing anything that files work.
      - >-
        The solo is a peer on the substrate rather than an audience for it. The
        difficulty labels are the mechanism: `easy` and `medium` are the loop's,
        and an interactive session takes a pull request the loop holds by moving
        the Issue to `hard` first, after which the loop's next pass stands down.
      - >-
        A Job's whole inheritance is what GitHub holds, which is what lets PR
        First's arrival step say there is nothing else by design, and what lets
        DR-060's sweep recover ownership after the conversation that started the
        work has ended.
      - >-
        Events are lossy where refs were not, so the branch ref carries what must
        survive a webhook boundary: `<harness>/issue-<n>` holds both the harness to
        return to and the Challenge to hand back to, with no external state.
        `coder.yml`'s concurrency key exists for the same reason, so a reply cannot
        cancel a pending verdict.
      - >-
        Offline operation is gone, and the coordination record no longer travels
        with the code. Every clone used to hold the whole conversation; no clone
        now holds any of it.
      - >-
        The dependency is concentrated rather than spread: DR-061's falsifier — a
        portfolio built on something other than GitHub — is the measure of this
        entry too, and it is now larger than a rewrite of the Disciplines' wording.
    falsifier: >-
      A dispatch that has to name the executing machine at the moment work is
      filed, or a solo who can only reach a piece of work through an agent that
      holds it. Either would mean the two forces this closed are open again and
      the substrate bought nothing that refs did not already offer.
    rationale: |-
      The earliest conception of this repository put the message bus in git
      itself. Branches were topics and commits were messages to the future, and
      the attraction was not naivety: git is already the durable ordered log that
      most coordination systems are built to be, and it needs no service, no
      credential and no network. Where that design is right it is very right, and
      the parts of it that still hold are still here.

      It gave way on two things, and both are about who can reach the work.

      **Late binding.** With refs as the bus there is no rendezvous, only
      addresses. Handing work over requires knowing which clone will take it, so
      the consumer is chosen when the work is produced rather than when someone is
      free to do it. A queue inverts that, and an Issue is a queue: the work is
      posted to a place, and whoever shows up claims it. DR-060 and DR-061 each
      recorded a narrower form of this argument for a different axis — which
      session, and which harness — while assuming the substrate that makes both
      possible. This is that assumption, written down.

      **Direct reach.** The second reason is the one that shapes more of the
      repository. A local bus, whether it is refs in a clone or a daemon over a
      queue, puts something between the solo and the work, because the work lives
      where that thing is running. Posting to GitHub removes the intermediary: the
      solo opens the Issue, argues on the thread, and takes the branch, using the
      same records and the same verbs the Jobs use. That is why PR First can say
      authorship cannot answer which Job owns a branch — every pull request here is
      the solo's — and why ownership is carried by a label instead. The human is a
      participant in the protocol rather than its audience, and a system that
      reported to the solo instead of admitting them would be a different
      repository.

      Both rejected alternatives are live systems rather than hypotheses, which is
      worth recording while it is cheap. [firstmate](https://github.com/kunchenguid/firstmate)
      and [SwarmForge](https://github.com/unclebob/swarm-forge) both coordinate
      through a local filesystem and a session multiplexer, and both reached the
      same primitives independently — a worktree per worker, inbox and outbox
      directories, atomic rename to publish, a daemon that only wakes. Both also
      interpose a supervisor between the operator and the work, and firstmate makes
      the consequence explicit: its crewmates may not address the captain at all,
      and its contract carries a table of internal terms that must be translated
      before anything reaches them. That is the coherent end of the local design,
      not a flaw in it, and it is the thing this decision declined.

      What was given up should not be minimised, because none of it comes back.
      This repository cannot coordinate on a plane. Its coordination record is in a
      database beside the code rather than inside it, so a clone is no longer
      sufficient to reconstruct how anything was decided. Webhooks can be missed
      and runs can be cancelled where a DAG could not lose an edge. The residue of
      the older design is where those costs bite hardest: the branch ref still
      carries the harness and the Challenge, precisely because a webhook may not
      arrive and a ref cannot fail to.

      One thing this entry deliberately does not settle. Both reasons above are
      instances of a wider commitment: that what a session would otherwise
      remember is held in artifacts the next participant will read, rather than
      in the agent that learned it. Refs as a bus honoured that commitment and
      still failed these two tests, which is why the substrate moved while the
      commitment did not. Whether that wider claim is a Decision of its own, or
      the premise this one rests on, is open and is not answered here.
