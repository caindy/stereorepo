decisions:
  - id: work:decision/228
    name: "DR-228 · Claim and Evidence are minted from Toulmin in caindy/fitch-mvp's wording, and a history entry's Receipt line becomes Evidence"
    status: ADOPTED
    applies:
      - work:article/17
    enacted_in:
      - work:artifact/meta-assertions-imported-vocabulary
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-assertions-imported-charter
      - work:artifact/meta-checks-files-history
      - work:artifact/meta-checks-probes-knowledge
      - work:artifact/meta-lib-render-skills
      - work:artifact/meta-lib-apm-compile-agents
      - work:artifact/bootstraps-python-gate
      - work:artifact/bootstraps-rust-xtask
    context: >-
      `receipt` arrived by use rather than agreement and reached the Charter,
      seven Decisions, the Nothing Unconsumed Discipline, the gate, every history
      log under `.meta/` and both Bootstraps, so every portfolio inherits it. It settled into two
      senses: the resolvable symbol a history entry names, and a provenance
      citation — and a provenance citation is the kind of thing
      DR-171 turned down, refusing "Commit hashes or pull request
      citations as receipts" as not mechanically falsifiable, since the hash is
      unchanged when the change it records is undone.

      The word cannot be defined in the lead sentence DR-190 requires
      of a wiki page without choosing between the two, which is the question
      minting forces. Under Toulmin, as caindy/fitch-mvp models him on LinkML, a test
      that can be run and observed is Evidence and what a history entry asserts
      is a Claim — Toulmin's terms, modelled on LinkML in caindy/fitch-mvp; what is distinctive here is not that the entry names Evidence
      but that it names Evidence which can fail.
    alternatives:
      - name: Mint `Receipt` and keep the label
        chosen: false
        reason: >-
          It settles Article 17 by agreeing to the word rather than to
          what the word means, and it keeps a term this repository would then own
          alone. The two senses would still have to be separated in the
          definition, and the sense that loses is the one the Charter and the
          Disciplines were using, so the commentary has to be reworded either
          way. Minting buys nothing the rewording does not, and costs a concept
          that no other system shares.
      - name: Rename the label to `Falsifier:`
        chosen: false
        reason: >-
          It says both halves in one word and reuses one this repository already
          has. That is the objection: `falsifier` is already a slot on a Decision
          and on an Article, and #576 owns the reconciliation of
          the four instruments over this subject — `falsifier`, the history
          entry's line, `checked_by`, and `just dereference`. Committing the word
          to a third site from the bounded half would decide that question
          without arguing it.
      - name: Leave the word alone and mint nothing
        chosen: false
        reason: >-
          The gate cannot see the defect, which is why it reached that far. A
          word in neither the vocabulary nor the wiki satisfies
          `ubiquitous language wiki parity` trivially, and DR-190
          rejected word-frequency heuristics for the reviewer half. Left alone,
          the word does not stop spreading; it spreads into portfolios, which is
          the multiplication Seeded Artifacts names.
      - name: Mint `Claim` and `Evidence` from Toulmin, in caindy/fitch-mvp's wording, and rename the label to `Evidence:`
        chosen: true
        reason: >-
          Both senses are statable once the parts have names, and Toulmin's
          ontology of argument is already modelled on LinkML in
          caindy/fitch-mvp's `schema/epistemology.yaml`, which is the same
          technology this repository's ontology uses. Each definition is that
          schema's own opening sentence, quoted rather than rewritten, so a later
          reconciliation can diff the two for equality. The definitions are
          taken verbatim so a word shared with a system this one is intended to
          merge with does not acquire a second meaning here. Two terms are taken
          and no more: `Warrant`, `Grounds`, `Backing`, `Credence`, `Rebuttal`
          and `Qualifier` have no consumer here yet, and minting one is what
          Nothing Unconsumed refuses at the creation boundary.
    consequences:
      - >-
        `Claim` and `Evidence` are concepts of a new `work:scheme/toulmin` in
        `.meta/assertions/imported/vocabulary.yaml`, whose `authority` names
        Stephen Toulmin and caindy/fitch-mvp's `schema/epistemology.yaml`. They
        are not stereorepo's scheme, because `skos.yaml` reads provenance off
        `in_scheme` and this repository is a reader of these two definitions
        rather than the party that settles them — the same instrument
        `work:scheme/ddd` and `work:scheme/apm` already use. Both carry
        `wiki/stereorepo/claim.md` and `wiki/stereorepo/evidence.md` at the 1:1
        parity DR-190 requires. `receipt` is an `avoid` label on Evidence, which is where the
        retired word is recorded. Each definition is the source class's opening
        sentence, quoted whole and unaltered: "Toulmin's Claim: the central
        hypothesis or predicate assertion being evaluated", and "Hard ground
        truths, telemetry, or verified physical/digital data streams". What the
        classes go on to say is quoted in the scope notes, marked as quotation,
        so nothing this repository adds sits inside a sentence it calls the
        source's. `Grounds`, `Backing`, `Warrant` and `Qualifier` appear in those
        quotations and are not minted here. The source is named as
        caindy/fitch-mvp's `schema/epistemology.yaml` rather than as a path under
        a home directory, which resolves for one person on one machine.
      - >-
        A history entry names its Evidence on a line reading `Evidence:` rather
        than `Receipt:`, under `.meta/` and in both Bootstraps. The check is
        `meta history evidence`, the Python Bootstrap's gate step and the Rust
        Bootstrap's xtask step are both `evidence`, and the symbols are
        `evidence_symbols`, `evidence_problem`, `evidence_against` and
        `meta_history_evidence`.
      - >-
        The two commentary uses say provenance instead. The Disciplines' note
        says the ADRs cite the failure each came from. The Charter's preamble
        named the failure an Article came from as its "receipt", against a slot
        DR-087 had already removed; it now says where that provenance
        went — DR-043 — and that a citation is not the Evidence a
        history entry names.
      - >-
        The label `Claim` collides with the channel verb `claim`, which takes an
        Issue. The collision is recorded in the concept's `scope_note` and on its
        wiki page rather than in `confusable_with`, whose range is `Concept` and
        which therefore cannot hold a verb.
      - >-
        A landed Decision's `consequences` and `falsifier` state what is true
        now, so every one of them is corrected to the new names: in
        DR-087, DR-091, DR-101,
        DR-171, DR-209 and DR-218. Its `name`,
        `context`, `alternatives` and `rationale` are the record of what was
        deliberated and are left as written, retired word included:
        DR-171's rejected alternative is named "Commit hashes or pull
        request citations as receipts", and that is what it rejected. The line is
        the field, so a reader can tell which half of an entry a later change may
        touch.
      - >-
        What remains of Toulmin is #576, which holds whether the
        other terms are taken and whose definition wins where they differ.
    falsifier: >-
      A history entry whose Evidence is a citation that cannot go stale — a
      commit hash, a pull request number — passing `meta history evidence`; or a
      use of `Claim` or `Evidence` here that the `Claim` and `Evidence` classes
      of caindy/fitch-mvp's `schema/epistemology.yaml` do not cover, which would
      mean the words were taken and then bent.
    rationale: |-
      Two things had to be true at once. The word had to stop being unminted,
      and the sense the record rejected had to stop being used in the record's
      own commentary. Minting `receipt` does the first and not the second;
      rewording the commentary alone does the second and not the first.

      Taking the words from outside settles a third thing that was not the
      Challenge's. #488 says the vocabulary is the first place a
      merge of four systems would have to decide whose word wins, and a word
      defined here first is a word that has to be reconciled later. The authority
      is Toulmin, and caindy/fitch-mvp already states him on LinkML, so taking
      that wording verbatim makes this repository a reader of the definition
      rather than a second author of it.

      The rename is the expensive half and is mechanical: every history log
      under `.meta/` and both Bootstraps, two gate steps, one check and four
      symbols. It is worth paying now rather than at the next portfolio, because
      a Bootstrap defect propagates once per use. A count of files would have
      been the shape DR-171 rejected commit hashes for: a number
      written down once that nothing re-derives and nothing can fail.
