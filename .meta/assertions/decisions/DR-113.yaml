decisions:
  - id: work:decision/113
    name: "DR-113 · An armed merge is brought current with its base by the channel, rebasing rather than merging, on the push that put it behind"
    challenge: work:challenge/93
    status: ADOPTED
    applies:
      - work:article/18
      - work:article/19
    enacted_in:
      - work:artifact/meta-say
      - work:artifact/meta-hooks-signed-channel
      - work:artifact/github-workflows-advance
    alternatives:
      - name: A merge queue
        chosen: false
        reason: >-
          It would do this for free, and it cannot be had here. A merge queue
          is available on public repositories and on private ones owned by an
          organisation on Team or Enterprise Cloud; this repository is private
          and owned by a person, which is also the shape a fresh clone has, so
          a scaffold that depended on it would ship a hole for most of its
          readers. Nor would it be free where it is available: the queue
          builds its own candidate branches, so `gate.yml` would need to run
          on `merge_group` and the ruleset's required checks would have to be
          reported from there. Worth revisiting the day a portfolio sits in an
          organisation, and the whole of this comes out then.
      - name: Drop the ruleset's requirement that a branch be current
        chosen: false
        reason: >-
          The stall disappears and so does what it is protecting: a green pull
          request is green against the trunk it was branched from, and the
          requirement is what makes it green against the one it lands on. A
          setting that trades a tested merge for a prompt one is the solo's to
          take, and it is not this.
      - name: The solo merges `main` in when he notices
        chosen: false
        reason: >-
          What happened on #92, by hand, after the pull request had been ready
          for some time. Noticing is the part that does not scale: the Job that
          armed the merge has ended, so the only witness left is a person
          reading a list of green pull requests that are not merging.
      - name: A step in the scheduled sweep
        chosen: false
        reason: >-
          The sweep exists because thread resolution fires no event (DR-105).
          This has an event — falling behind is a push to `main` and nothing
          else — so a clock would only add an interval to be stuck inside, and
          run every half hour to find nothing.
      - name: The channel advances it, when it arms and on the push that puts it behind
        chosen: true
        reason: >-
          `.meta/say advance` rebases every open pull request that is armed and
          missing commits from its base back onto it, and `.meta/say merge
          --auto` runs it before arming, because a branch can be behind before
          it is armed as easily as after. The second edge — falling behind
          after arming — is the same step run from a workflow on every push to
          `main`, which is the one event that puts a pull request in that
          state. Through the channel because the act needs a Role's token: a
          push made with a workflow's own token starts no checks, and the
          ruleset would then wait forever on a branch nothing was running
          against. What it costs: a rebase moves the head, so the checks run
          again and, where a review request is outstanding, the reviewer
          answers the head it was asked about (DR-109) — a second review run
          for a change nobody made.
    consequences:
      - >-
        The channel gains `advance`, and `merge --auto` calls it before arming.
        `advance` takes one pull request or, given none, every open one that is
        armed — armed and nothing else, because a pull request nobody has asked
        to land is waiting on nothing, and the rebase would rewrite commits
        under a session that may still hold the branch.
      - >-
        It updates by rebase and never by a merge commit. GitHub authors that
        merge commit itself and it names no Actor, so A19 would turn the
        required check red on the branch being unblocked. A rebase writes no
        new commit: the branch's commits move onto the base with their
        messages, and so with their Trailers, intact.
      - >-
        Behind is asked as a comparison of base with head, not as
        `mergeStateStatus`. That word is computed when it is asked for, so the
        first read after a push to trunk is `UNKNOWN`; and `BLOCKED` outranks
        `BEHIND`, so a pull request waiting on a review reports the review and
        hides that it is also out of date — which is every `medium` pull
        request (DR-112).
      - >-
        `gh pr update-branch` joins the writing verbs the hook refuses, for the
        reason `merge` and `close` are already there and one more: by hand it
        defaults to the unsigned merge commit above.
      - >-
        The workflow that runs `advance` on a push to `main` is
        `.github/workflows/advance.yml`, a file of its own rather than a job in
        `gate.yml`: it holds a credential and the gate holds none, and on a
        `pull_request` event GitHub runs a workflow from the pull request's own
        ref, so a token named in the gate is a token a pull request can rewrite
        the surroundings of. Nothing but a push to `main` runs it, and a push
        to `main` has already merged. It is serialised on a `concurrency` group
        with `cancel-in-progress: false`, because two pushes in quick
        succession are two runs that would rebase the same branches and the
        second has to see what the first did.
      - >-
        It arrived a change later than the rest of this. A Role's credential is
        a fine-grained token, and it carried no `workflow` scope, so the coder
        loop could not write a file under `.github/workflows/` — GitHub
        refuses the push, and refuses the whole of it rather than the file.
        The run that took this decision stopped there and wrote the file into a
        comment for a person to grant the scope or commit it; the scope was
        granted. That is the general shape and not an accident of this Issue:
        a change to a workflow is a change no Role can push until its token is
        given the scope, and the loop returns it to the solo every time.
    falsifier: >-
      An armed pull request found behind `main` with nothing that tried to
      advance it, or a rebase that dropped an arming this could not restore.
      The first says the event is not the whole of the condition and sends
      this to a clock after all; the second says the update has to happen
      before the arming rather than under it, which is a merge queue.
    rationale: |-
      #93 named the shape and asked for the merge queue to be weighed first,
      which is the right order: a repository setting that removes a script
      beats a script. The setting is not available to a person's private
      repository, and the scaffold is cloned into exactly that, so the script
      is what remains. It is small because the condition is exact — a head
      missing commits from its base — and because the event that creates it
      is one push.
