decisions:
  - id: work:decision/174
    name: "DR-174 · Decouple APM hook compilation from tool permissions and channel boundaries"
    status: ADOPTED
    applies:
      - work:article/8
    enacted_in:
      - work:artifact/meta-apm-readme
      - work:artifact/meta-hooks-signed-channel
      - work:artifact/meta-lib-render-writers
      - work:artifact/meta-lib-apm-compile-skills
    context: >-
      solorepo's #341, #77, and #112 examined how tool permissions and channel
      guardrails are maintained when compiling hooks via APM. Currently, `.claude/settings.json`
      registers `.meta/hooks/signed_channel.py` under `hooks` and denies raw `gh`
      writing verbs under `permissions.deny` (DR-069). However, APM only compiles the
      `hooks` slice, leaving permissions unmanaged.
    alternatives:
      - name: Overload APM hooks with permission enforcement and require all harnesses to run Claude settings
        chosen: false
        reason: >-
          APM has no primitive or schema for tool permission allow/deny lists.
          Furthermore, other harnesses such as Gemini CLI and OpenAI Codex do not
          read or execute `.claude/settings.json` (solorepo's #112). Expecting APM
          to enforce channel boundaries creates an illusion of security that fails
          the moment a second harness is introduced.
      - name: Decouple APM hook registration from permission enforcement, enforcing channel boundaries by construction
        chosen: true
        reason: >-
          APM's scope is strictly bounded to lifecycle hook registration (`PreToolUse`,
          `Stop`, `SessionStart`). Tool permissions and channel security are enforced
          by construction (solorepo's #21) by withholding ambient `GH_TOKEN` credentials
          in runner environments so direct API calls fail with 401 across all harnesses,
          and at the PR First gate (`check_pr.py`), which verifies Actor and Agent
          attribution trailers independently of harness configuration.
    consequences:
      - >-
        APM `hooks` primitives compile lifecycle callbacks into target harnesses
        (such as Claude Code's `settings.json`), but are not relied upon as the
        authoritative boundary for tool permissions.
      - >-
        Channel integrity is enforced by construction (solorepo's #21) via credential
        isolation and at the pull request gate (`check_pr.py`).
      - >-
        `.meta/.apm/README.md` and `.meta/hooks/signed_channel.py` record this
        boundary separation, unblocking compiler generation in solorepo's #342.
    falsifier: >-
      A cross-harness APM standard that natively specifies and enforces command-line
      tool permissions and binary deny lists across all supported agent runtimes.
    rationale: |-
      A boundary that depends on harness inspection is a boundary that breaks
      across multiple vendors (solorepo's #112).

      Decoupling APM hook compilation from tool permissions ensures that APM handles
      developer ergonomics and lifecycle callbacks, while channel integrity and
      attribution are guaranteed by construction (the credential) and verification
      (the PR gate).
