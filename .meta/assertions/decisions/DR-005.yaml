decisions:
  - id: work:decision/005
    name: "DR-005 · Capability carries no projected dimensions"
    status: ADOPTED
    alternatives:
      - name: "A read/write dimension on Capability"
        chosen: false
        reason: "What a Capability can change is answered fully by applying it to Securables through Permissions, so encoding it on the Capability is either lossy or a restatement of the whole space."
      - name: "Capability stays securable-free"
        chosen: true
        reason: "Granularity comes from the product of the two axes, and keeping them independent is what makes the product expressive."
    falsifier: "A Capability whose meaning cannot be recovered from any Permission naming it."
    enacted_in:
      - work:artifact/meta-work-authority
    rationale: |-
      Rejected a read/write dimension on `Capability`. What a Capability can change is
      answered fully by its application to Securables via Permissions, so encoding it on
      the Capability is either lossy or a restatement of the whole space. Granularity
      comes from the product of the two axes.
