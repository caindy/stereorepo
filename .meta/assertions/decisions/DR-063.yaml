decisions:
  - id: work:decision/063
    name: "DR-063 · Handoff is a Discipline, and nothing depends on the note being written"
    status: ADOPTED
    applies:
      - work:article/1
      - work:article/18
    alternatives:
      - name: Steps inside PR First
        chosen: false
        reason: >-
          PR First is about the venue — where work is proposed, argued and
          recorded. A Handoff is about a seam between two Jobs, has its own
          judgement about where to stop, and is followed by an arriving agent
          that may never have opened a pull request in its life. Folding it in
          would bury it in a Discipline already carrying nine steps.
      - name: A Discipline of its own, with a form and one Article
        chosen: true
        reason: >-
          It has genuine judgement — where to stop, and what a successor cannot
          reconstruct — which is the test DR-047 set. What it costs is a
          thirteenth Discipline, and a reader has to know that Handoff depends
          on PR First rather than standing beside it.
      - name: A state file in the repository
        chosen: false
        reason: >-
          DR-054's `TECH_DEBT.md` with a different name. No open and closed, no
          context, free to append and so unbounded, and it would land in the
          diff as noise on every change.
    consequences:
      - >-
        The note is a comment on the pull request, appended and never rewritten.
        The body is the account of the change and is written once at the start;
        state of play accumulates.
      - >-
        A18 joins the Charter and is checked by `check_pr.py --handoff`, which
        refuses a dirty worktree or an unpushed branch and prints the form only
        once both are clean. Watched failing on three uncommitted files.
      - >-
        `check_pr.py --resume` reads what GitHub holds for an arriving Job, and
        prints the last note last, saying plainly that its absence is expected.
      - >-
        The asymmetry between a live-session mechanism and its recovery path is
        now a Principle, having been argued twice — once for the watch and the
        sweep, once here.
      - >-
        `Handoff` is minted as a Concept. Christopher named it; it is ordinary
        English doing a specific job here, which is what a scope note is for.
    falsifier: >-
      A successor that reads a note, follows it, and is wrong — because the
      repository had moved and the note had not. That would mean the ordering of
      the steps is wrong, not that the note should go.
    enacted_in:
      - work:artifact/meta-disciplines
    rationale: |-
      Most of what a successor needs is already answerable from GitHub:
      the Challenge is the pull request and its linked Issue, what was
      done is the diff, what is owed is the unresolved threads and check
      states, and who it follows is in the trailers. Two things are not —
      what is left, and what was tried and abandoned. The second is
      unrecoverable by construction, since a diff records what was done
      and nothing records what was ruled out, so a successor without it
      walks the same dead end at full price.

      The note therefore cannot be a precondition. A session dies, a
      context fills, a container is reaped, and none of those get to write
      anything. A practice that only works when its own steps were
      followed is not one you can hand to a stranger.
