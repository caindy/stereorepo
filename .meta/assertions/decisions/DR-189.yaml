decisions:
  - id: work:decision/189
    name: "DR-189 · Foreground review subagents are dispatched concurrently in a single message to execute in parallel"
    challenge: work:challenge/308
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/meta-timing
      - work:artifact/meta-checks-probes-tools-agents
    context: >-
      DR-166 bounds how many agents a review spawns because the pass costs the sum
      of them, putting an initial review on the deep path at 11 to 15 minutes. DR-122
      forbade `run_in_background` because turns that ended before agents finished
      posted nothing, but did not test batched foreground dispatch. When subagents
      are launched sequentially across multiple turns, the total latency scales
      linearly with agent count. Testing whether Claude Code concurrently executes
      multiple `Agent` tool uses dispatched in a single message provides the
      mechanism to run subagents in parallel in the foreground, bounding pass
      duration to the slowest agent rather than the sum of all agents.
    alternatives:
      - name: Continue sequential turn-by-turn foreground dispatch
        chosen: false
        reason: >-
          Incurs cumulative latency of every spawned agent (sum of agent runtimes),
          which on the boundary path consumes 11 to 15 minutes and forces an artificial
          ceiling on review breadth.
      - name: "Return to background execution (`run_in_background: true`)"
        chosen: false
        reason: >-
          Rejected by DR-122. Headless print mode terminates the run when the turn ends,
          orphaning background tasks and posting empty results without verdicts.
      - name: Dispatch multiple foreground `Agent` tool calls in a single turn and export concurrency limit
        chosen: true
        reason: >-
          Claude Code's internal tool dispatcher executes multiple agent invocations
          issued in a single message concurrently in parallel up to
          `CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS`. Exporting
          `CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: ${{ steps.depth.outputs.agents }}`
          and instructing the reviewer prompt to batch multiple agent calls in a single
          message allows foreground subagents to run simultaneously and return together
          within the same turn.
    consequences:
      - >-
        `.github/workflows/review.yml` configures `review_claude` with
        `CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: ${{ steps.depth.outputs.agents }}`,
        aligning the engine concurrency cap with the depth step's agent ceiling (3 on
        boundary path, 1 on cheap path).
      - >-
        The reviewer prompt in `.github/workflows/review.yml` explicitly instructs
        the session to dispatch multiple agents for independent dimensions in a single
        message with multiple tool calls, running them concurrently in parallel in the
        foreground so they return together in the same turn.
      - >-
        `.meta/timing.py` is updated to robustly unpack run step tuples, enabling
        comparative step-level runtime analysis via `python3 .meta/timing.py review.yml --steps`.
    falsifier: >-
      A review run transcript on the boundary path where multiple independent subagents
      are dispatched sequentially across separate turns rather than in a single message,
      or where batched foreground agents fail to execute concurrently.
    rationale: |-
      A fact about the harness is answered by an empirical test. While DR-122 rightly
      eliminated background agents to prevent uncollected verdicts, sequential foreground
      execution was an accidental artifact of prompt phrasing rather than an inherent
      harness limitation. Instructing concurrent tool use batching within a single turn
      and exporting the concurrency ceiling allows scoped multi-dimensional review
      passes to run in parallel, converting pass duration from O(sum) to O(max).
