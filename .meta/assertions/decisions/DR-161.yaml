decisions:
  - id: work:decision/161
    name: "DR-161 · A merge manager agent lands what is green in order of leverage, superseding first-come auto-merge arming"
    challenge: work:challenge/254
    status: ADOPTED
    applies:
      - work:article/15
      - work:article/21
    enacted_in:
      - work:artifact/github-workflows-advance
      - work:artifact/github-workflows-coder
      - work:artifact/github-workflows-review
      - work:artifact/github-workflows-merge
      - work:artifact/meta-say-move
      - work:artifact/meta-say-verbs
      - work:artifact/meta-checks-probes-loops
      - work:artifact/meta-next
      - work:artifact/meta-timing
      - work:artifact/meta-render
      - work:artifact/meta-disciplines
      - work:artifact/justfile
      - work:artifact/specialize
      - work:artifact/meta-checks-probes-loops-merge-manager
    context: >-
      Today pull requests merge via GitHub auto-merge (DR-112), which lands
      whatever reaches green first. This first-come arming causes two structural
      failures: (1) high-drift pull requests (such as #224, 3,000 lines in the
      most-edited file) are repeatedly rebased while small cleanups land ahead
      of them, and critical high-leverage fixes (such as #230, which unblocked
      eleven pull requests) wait behind zero-leverage tidy-ups (#225); and (2)
      GitHub outright refuses auto-merge on stacked pull requests ("Auto-merge
      is not supported for stacked pull requests"), leaving stacks stranded.
      Arming was introduced only because no Job was alive at merge; a standing
      merge manager is that Job. The manager computes objective eligibility
      semaphores (head checks green, mergeable clean and not behind/dirty, zero
      unresolved conversations, and reviewer approved via latestReviews), ranks
      eligible candidates by leverage (stack bases first, dependency graph unblocking,
      and drift risk), asserts its choices and deferrals out loud to preserve
      affirmative liveness, lands the top candidate, and supersedes individual
      auto-merge arming.
    alternatives:
      - name: Retain individual auto-merge arming and adjust priority with numeric labels
        chosen: false
        reason: >-
          A static numeric priority on an Issue does not solve stack refusal on
          GitHub auto-merge, cannot compute the dynamic dependency graph of
          unblocking live branches, and leaves silence load-bearing when a PR is
          stalled.
      - name: Pure mechanical script based only on check completion timestamps
        chosen: false
        reason: >-
          Timestamp-ordered landing is identical to first-come auto-merge and
          re-creates the starvation of large or architectural PRs behind minor
          edits.
      - name: A standing merge manager agent evaluating semaphores and leverage ranking
        chosen: true
        reason: >-
          Separates mechanical semaphore evaluation from leverage judgement.
          Evaluates all open pull requests against semaphores, orders eligible
          candidates by leverage (stack bases, blocker impact, drift risk),
          explicitly asserts chosen and deferred evaluations out loud so silence
          is never load-bearing, and lands the chosen candidate.
    consequences:
      - >-
        coder.yml and review.yml stop arming merge --auto upon completion, approval,
        or rebase; landing becomes the responsibility of the standing merge manager.
      - >-
        .meta/say/move gains merge-manager logic and evaluation, computing
        eligibility semaphores (checks green, mergeable clean and not behind or
        dirty, zero unresolved threads failing closed, candidate base is main,
        reviewer approved via latestReviews), ranking eligible candidates by leverage,
        asserting choices and deferrals out loud, and executing the squash merge.
      - >-
        .meta/say/move advance rebases approved pull requests in addition to armed
        ones, while strictly excluding branches that are bases of other open pull
        requests (answering DR-133), preventing stack layers from conflicting.
      - >-
        .github/workflows/merge.yml runs the standing merge manager on push to main,
        a 15-minute cron schedule, workflow_dispatch, and — added on #269 — the
        completion of a gate or review run whose conclusion was success, strictly
        from the default branch without running unmerged PR merge refs. The
        conclusion filter is load-bearing rather than tidy: GitHub delivers
        workflow_run regardless of the triggering run's conclusion, and review
        concludes skipped or cancelled on most pushes, none of which makes a
        candidate newly eligible.
      - >-
        .meta/next.py reads reviewer approval from latestReviews when reviewDecision
        is null on GitHub, surfacing reviewer status (approved, changes requested, or
        requested), and includes merge.yml in displayed loop workflows.
      - >-
        .meta/timing.py and Specialization in .meta/assertions/disciplines.yaml
        inherit merge.yml as a standing loop workflow.
      - >-
        Liveness is guaranteed: every cycle asserts its state out loud (idle
        with reasons per PR, or chosen winner and deferred candidates with
        reasons), distinguishing an idle manager from a dead or broken one.
    falsifier: >-
      A merge manager cycle where high-leverage PRs perpetually starve small,
      trivial fixes that never land, indicating that age and churn bounds need
      stricter balancing against unblocking counts; or GitHub introducing native
      queue management that directly supports stacked PRs and blocker DAG
      resolution without third-party standing supervisors.
    rationale: |-
      First-come arming (`merge --auto`) was adopted in DR-112 because no Job
      runs at merge time on GitHub Actions. But arming whatever turns green
      first turns arrival order into merge order, which privileges low-churn
      cleanups over high-churn architectural work and leaves high-drift
      changes constantly rebasing. Furthermore, GitHub refuses auto-merge
      on stacked pull requests, leaving them unable to land automatically.

      A standing merge manager resolves both problems by acting as the
      supervisor at merge time. It separates objective semaphores (is the
      head green? is mergeable clean and not behind/dirty? are all review
      conversations resolved? has the reviewer approved?) from leverage
      ordering (stack bases first, dependency graph blocker impact via
      `**Waits on.**`, churn risk, and age).

      Candidate qualification is restricted to pull requests targeting `main`.
      A pull request layered on another branch cannot be squash-merged onto trunk
      directly, and attempting to stack-merge layers atomically would land
      un-evaluated lower layers without checking their semaphores. Restricting
      candidacy to `baseRefName == "main"` ensures stack bottoms land first, after
      which GitHub retargets the layer above to trunk for evaluation on the next
      cycle. Because qualification guarantees the candidate targets `main`, a stacked
      candidate is always the stack bottom; calling `merge` with `stack=stacked(winner)`
      invokes `gh stack merge <bottom> --squash`, which squashes the evaluated bottom
      alone without bundling un-evaluated layers, and triggers GitHub to rebase the
      layers above.

      The unresolved-threads semaphore is implemented to fail closed: any
      GraphQL failure or network error returns a deferral rather than passing
      as 0 unresolved conversations, upholding A15 and A16.

      In `advance`, rebasing is extended to approved pull requests to keep
      them current with trunk, answering DR-133 by explicitly excluding any
      branch that serves as the base of another open pull request. This preserves
      stack commit SHAs while keeping independent approved pull requests fresh.

      Security of the standing manager is maintained by running `.github/workflows/merge.yml`
      only from `main` (on push, schedule, dispatch, and `workflow_run`) rather
      than from PR merge refs (`pull_request_review`), ensuring code that holds
      the coder's token has been reviewed and merged before it executes.

      `workflow_run` was weighed against that boundary on #269 and belongs with
      the safe three rather than with `pull_request_review`. The distinction is
      not which ref the *triggering* workflow ran against — `gate` and `review`
      both run against pull request refs — but which ref the *triggered*
      workflow runs from. GitHub's reference gives `workflow_run`'s `GITHUB_REF`
      as the default branch and its `GITHUB_SHA` as the last commit on it, and
      states the event "will only trigger a workflow run if the workflow file
      exists on the default branch". So the merge manager still executes only
      reviewed, merged code. The job names no ref and reads no ref or SHA from
      the event payload: it reads `workflow_run.conclusion` and nothing else,
      in the job's `if:`, which GitHub computes and which decides only whether
      the job runs. It never touches `workflow_run.head_sha`, so nothing a pull
      request controls reaches the step that writes `CODER_GH_TOKEN`. This is
      the ordinary `workflow_run` hazard — a privileged workflow checking out
      or trusting the untrusted head that triggered it — and it is avoided by
      not doing that, not by the trigger being absent.
