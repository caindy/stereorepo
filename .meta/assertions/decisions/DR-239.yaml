decisions:
  - id: work:decision/239
    name: "DR-239 · An automated end-to-end Specialization dogfooding harness with pre-judged portfolio fixtures"
    status: ADOPTED
    applies:
      - work:article/9
      - work:article/21
    enacted_in:
      - work:artifact/meta-test-specialization
      - work:artifact/justfile
      - work:artifact/meta-fixtures-specialization-readme
      - work:artifact/meta-fixtures-specialization-tokens
      - work:artifact/meta-checks-probes-tools-test-specialization
    context: >-
      Specialization is the core value proposition of stereorepo: turning a clone
      into an independent portfolio via an 8-step discipline (DR-204).
      While individual components were tested separately (such as template
      conventions, surviving placeholder checks, and APM compilation), there was
      no automated harness to verify that a fresh clone cleanly executes all eight
      steps end-to-end, bootstraps a language project, and passes all gates. As a
      result, regressions—including baseline typing debt leakages, fragile section
      ordering assumptions in bootstrap.py, bare decision citations across bootstrap
      skills, and synthetic corpus threshold mismatches in probe tooling—were only
      discovered when a human ran the specialization discipline by hand.
    alternatives:
      - name: Manual specialization verification during release ceremonies
        chosen: false
        reason: >-
          Manual verification is expensive, infrequent, error-prone, and violates the
          solo operator ethos by creating human bottlenecks between releases.
      - name: Static assertion checks over template files in isolation
        chosen: false
        reason: >-
          Static checks inspect template files without executing their lifecycle.
          They cannot verify dynamic behavior such as git initialization, workflow
          runner retargeting, bootstrap project generation, or full portfolio gate
          execution across multiple toolchains.
      - name: Automated end-to-end Specialization test runner with pre-judged fixtures
        chosen: true
        reason: >-
          An automated runner (.meta/dogfood.py) executing into a hermetic temporary
          repository verifies all eight discipline steps end-to-end. Synthetic
          substitution fixtures (.meta/fixtures/specialization/tokens.json) live
          outside .meta/assertions/ (DR-026), an operator recipe (`just dogfood`)
          exposes the runner on the root surface (DR-106), and a scheduled CI
          workflow (.github/workflows/dogfood.yml) guards against regressions continuously.
    consequences:
      - >-
        .meta/fixtures/specialization/tokens.json defines pre-judged substitution tokens for template placeholders.
      - >-
        .meta/fixtures/specialization/README.md documents the synthetic fixture contract under Diátaxis Reference mode.
      - >-
        .meta/test_specialization.py executes all 8 Specialization discipline steps end-to-end into a hermetic temporary repository.
      - >-
        just test-specialization exposes the automated specialization audit on the root operator surface.
      - >-
        .github/workflows/test-specialization.yml audits Specialization weekly and on manual dispatch.
      - >-
        .github/workflows/release.yml runs Specialization verification prior to publishing releases.
      - >-
        .meta/checks/probes/tools/test_specialization.py provides regression probes for fixture loading, retargeting, and substitution.
    falsifier: >-
      A change to the scaffold, template files, bootstrap templates, or inherited tooling
      that breaks any step of the 8-step Specialization discipline or causes the specialized
      portfolio gate to fail while .meta/test_specialization.py or just test-specialization exits cleanly.
    rationale: |-
      Per Article 9, a seed is data and is gated by rendering it and running the real
      gates on the result. Specialization is stereorepo's primary external seed transformation.
      Running the discipline end-to-end in an automated, hermetic environment guarantees
      that every commit to the scaffold produces a fully functional, self-gating portfolio.
