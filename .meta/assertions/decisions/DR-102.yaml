decisions:
  - id: work:decision/102
    name: "DR-102 · The subscription is the checker's watch, named by the Discipline, and keeping it running is the harness's business"
    challenge: work:challenge/66
    status: ADOPTED
    applies:
      - work:article/16
      - work:article/18
    enacted_in:
      - work:artifact/meta-check-pr
      - work:artifact/meta-disciplines
      - work:artifact/meta-render
    alternatives:
      - name: Leave step 14 as it is, and let each session build its own watch
        chosen: false
        reason: >-
          What DR-060 chose, for a good reason — a Discipline that names this
          week's mechanics bakes them into an artifact meant to outlive them.
          But the step became the one in the skill with no command behind it,
          and on #64 the session reported it could not hold a subscription
          without trying, then wrote a poll on `gh api`, which the permission
          list denies by design. A watch improvised per session is one
          forgotten per session, and one written against the deny list is
          refused.
      - name: Name the harness's mechanism in the Discipline
        chosen: false
        reason: >-
          DR-060's objection stands. A background monitor is one harness's
          word for it; a scheduled job or a webhook is another's; and the
          Discipline is inherited by every portfolio whatever it runs on.
      - name: A webhook, or GitHub's review-request event
        chosen: false
        reason: >-
          Needs somewhere to land, which a session in a sandbox does not have,
          and the review request needs the machine accounts DR-066 waits for.
          Either would be the better subscription once it exists, and is what
          would make this one removable.
      - name: A watch in the checker, named by the step; the harness keeps it running
        chosen: true
        reason: >-
          `check_pr.py <n> --watch` prints one line per change and exits when
          the pull request closes. It is a process that prints, which is the
          one shape every harness can keep alive and be woken by, and it runs
          on the commands the repository already allows. The Discipline names
          the command as it names `render.py --landed`; how it is kept running
          stays the harness's, and the rendered skill — which is one harness's
          target — says how that harness does it. What it costs: it polls, at
          a minute, so a review is seen a minute late rather than at once; and
          it dies with the session, so the sweep remains the recovery and this
          remains the optimisation DR-060 said it was.
    consequences:
      - >-
        `check_pr.py` gains `--watch`, with `--every` for the interval. One
        line per new comment, review, thread, resolution or check result,
        skipping what this session wrote itself, read from the Trailer; a
        heading on the first poll and nothing replayed; `pr MERGED` or
        `pr CLOSED` and exit when the subscription ends.
      - >-
        PR First's fourteenth step names the watch as the subscription, and
        asks a harness that cannot keep it running to say so after starting
        it, not instead.
      - >-
        The rendered skill's command block carries the watch, and says how
        this harness keeps it running.
    falsifier: >-
      A review that landed while the watch was running and a conversation
      that was not woken by it. That would mean a line printed does not reach
      the harness, and the subscription is the harness's to register after
      all.
    rationale: |-
      DR-060 kept the mechanics out of the Discipline so that the step
      would outlive them, and was right to; what it did not give the step
      was a command, and every other step in the skill has one. The gap
      between "stay subscribed" and a process to start is where a session
      decides it cannot, and the permission list makes the first thing it
      improvises the wrong thing.

      A repository command is not this week's mechanics. It is the
      repository's own tool, and it prints, which is the interface every
      harness already reads. So the Discipline can name it without naming
      a harness, and the harness's target can say the rest.
