decisions:
  - id: work:decision/232
    name: "DR-232 · An Issue another answer overtook is obviated, which is a verb of the channel and the exit an Issue has that is not a merge"
    challenge: work:challenge/597
    status: ADOPTED
    applies:
      - work:article/19
      - work:article/20
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/meta-say-verbs
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-checks-probes-channel
      - work:artifact/meta-checks-probes-channel-parser
      - work:artifact/meta-checks-probes-channel-obviate
      - work:artifact/meta-checks-probes-harness-fakes
      - work:artifact/skill-pr-first
      - work:artifact/skill-pr-first-reviewer
    context: >-
      A pull request another answer overtook closes by `supersede`
      (solorepo's DR-164), refused unless what `--by` names has landed. An
      Issue had no equivalent. `.meta/say/verbs.yaml` named no verb that closes
      one, and the signing hook refuses `gh issue close`, so an Issue that no
      merge names could only be closed by the solo in the browser — unsigned,
      and unrecorded by the channel, which is the act solorepo's DR-069 and the
      hook exist to prevent.

      Two shapes produce one, and both are ordinary rather than rare. A
      Challenge split into others: solorepo's #571 mixed a finding with a
      proposal, the finding became solorepo's #577 and the proposal
      solorepo's #589, nothing of #571 was left unowned, the solo asked for it
      closed, and no verb could. And a duplicate filed under different words,
      which solorepo's #554 is about detecting and which, once detected, has
      the same missing exit.

      The cost lands on the queue rather than on tidiness. `just next` reads
      open Challenges, so an Issue whose work is owned elsewhere is offered as
      ripe and a run is dispatched to it; the run finds the work done and the
      only remedy is the act the record cannot see.
    alternatives:
      - name: Leave it to the solo in the browser, and say so in PR First
        chosen: false
        reason: >-
          It is what happens today, and writing it down would make a rule of the
          gap. The close would still be unsigned and outside the channel, so
          nothing can say which Actor closed an Issue or why, and the reason —
          which part of the Issue went where — would live in whatever the solo
          typed, if anything. A Discipline that instructs a Job to act outside
          the channel teaches acting outside the channel.
      - name: Have the answering change close it with a keyword
        chosen: false
        reason: >-
          It is the right answer wherever it is available, and it is the exit
          PR First already has: a pull request names the Issue and the merge
          closes it. It does not reach either shape this is for. A split leaves
          the parent answered by Issues rather than by a diff, so there is no
          pull request to carry the keyword; a duplicate is answered by work
          that may already have merged, which no later keyword can reach. Both
          cases are ones where the Issue is answered and no change of its own
          is owed.
      - name: A `close` verb taking a reason and nothing else
        chosen: false
        reason: >-
          It would sign the act and record a sentence, which is most of what is
          missing, and it would be the general close solorepo's DR-164 refused
          one level up. Any Issue anybody had tired of would close with a
          sentence, and the sentence is the caller's — nothing in it is read
          against GitHub, so the record would carry a claim with no evidence
          beside it. What separates an Issue answered elsewhere from an Issue
          abandoned is that somewhere else holds its work, and that is a fact
          GitHub can be asked.
      - name: A `obviate` verb naming what answered it, refused unless that is open and queued or merged
        chosen: true
        reason: >-
          The act stays inside the channel, so it is signed and attributable
          like every other, and the evidence is read rather than asserted:
          `--by` names an Issue GitHub reports as open and labelled `challenge`,
          or a pull request GitHub reports as merged. Everything else is
          refused — a `--by` that is closed, one nothing is queued to answer,
          one still in flight, the Issue itself, a pull request as the target,
          which `supersede` takes. The Issue closes as not planned, which is
          GitHub's own reason for a close that is not a completion, and the
          caller's account of what went where is the comment a later reader
          has.
    consequences:
      - >-
        `.meta/say/move obviate <issue> --by <issue|pr> < body.md` is a verb of
        the channel, the coder's: the account of where the work went on stdin,
        a signed comment on the Issue naming what answered it, the Issue closed
        as not planned, the state read back from GitHub rather than taken from
        what `gh` returned, and only then a signed backlink on what answered
        it. The backlink is last because a close that fails then leaves one
        comment to remove, on an Issue still open, rather than two comments
        contradicting the Issue's state; and a backlink that fails leaves a
        closed Issue whose account is intact.
      - >-
        Every refusal about what `--by` names is a read of GitHub rather than
        a question to the caller; two are read off the arguments alone. Off
        the arguments: a `--by` naming the Issue itself, and one naming
        something that is not a number — a Decision is what `supersede` takes
        and answers no Issue, since a Decision in the record is not work
        somebody holds. Off GitHub: a target that is a pull request, which
        `supersede` takes. A target that is closed already. A `--by` that is
        an Issue GitHub reports closed, which owns nothing now. A `--by` that
        is an Issue carrying no `challenge` label, which no loop will take and
        no `just next` will offer, so closing against it moves the work out of
        the queue rather than across it. And a `--by` that is a pull request
        GitHub does not report as `MERGED`, since a change still in flight may
        close and leave the need with no open record at all.
      - >-
        The link is on both ends, and posted rather than inferred. GitHub's own
        cross-reference is a timeline event whose rendering is not the
        channel's to rely on; a signed comment on each is a record either end
        reads without knowing the other exists.
      - >-
        PR First gains the step, so the rule and the one act that satisfies it
        are stated together where a Job reads them (A20). The Issue-level exit
        now reads as the pull-request-level one does: a merge that names it, or
        the verb that names what answered it, and never by hand.
      - >-
        `obviate` closes the Issue and does nothing to the claim on it, since
        an Issue closed is offered to nobody and the assignee is the record of
        who was holding it when it closed.
    falsifier: >-
      An Issue closed through this verb whose work nothing else owns — a `--by`
      that is closed, unlabelled, or a pull request that never merged — or an
      Issue closed as completed rather than not planned, which would put it
      among the Issues a merge answered and lose the distinction the reason
      carries. Equally, a close through this verb leaving no comment saying
      what part of the Issue went where, which is the whole of what a later
      reader has.
    rationale: |-
      Solorepo's DR-164's reasoning holds one level up and the case is the same
      shape. Merged, never abandoned is a rule about pull requests because a
      pull request is a proposal and the record of a proposal is worth keeping;
      an Issue is a need, and a need that somebody else now holds is met rather
      than abandoned. What both cases share is that the honest exit is not a
      merge and the dishonest ones are a close with no evidence.

      So the question was the same: where does the exception live. Left in
      prose it is a licence, since any Issue can be called answered elsewhere
      and nothing reads the claim. Put in a verb it is a claim with evidence
      that is already on GitHub — an open Challenge somebody can be dispatched
      to, or a merge that landed — and the verb reads it and refuses when it is
      missing. That is what makes this an exit rather than a way of tidying the
      queue.

      The reason GitHub records is not decoration. `not planned` is how GitHub
      distinguishes a close that completed work from one that did not, and
      every reading of the record downstream — a listing, a search, a later
      reader — takes it from there. The spelling is the GitHub CLI's, whose
      reference for `gh issue close` gives the flag as "Reason for closing:
      {completed|not planned|duplicate}"
      (https://cli.github.com/manual/gh_issue_close); `duplicate` is the third,
      and is not this verb's, since a split Issue is answered by several and
      duplicates none of them, while `not planned` covers both shapes. An Issue obviated was not completed here,
      and saying it was would make the two indistinguishable in the one place
      the distinction is cheap to keep.
