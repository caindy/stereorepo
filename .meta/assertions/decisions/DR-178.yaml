decisions:
  - id: work:decision/178
    name: "DR-178 · Autonomous loop recovery: self-healing post-rebase gate failures, resilient reviewer fallback, and zero-verdict retry"
    challenge: work:challenge/351
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/github-workflows-coder
      - work:artifact/meta-say-move
      - work:artifact/meta-check-pr
      - work:artifact/meta-checks-probes-loops
      - work:artifact/meta-lib-check-pr-sweep
      - work:artifact/meta-checks-probes-loops-advance
      - work:artifact/meta-checks-probes-loops-handoff
    context: >-
      Operational analysis of stalled pull requests (#324, #330, #331) revealed three
      structural deadlock patterns that silently halted loop automation across webhook boundaries:
      (1) Approved pull requests rebased cleanly onto trunk frequently fail subsequent gate checks
      (such as `files` or prose checks requiring mechanical updates like `just render`), leaving
      the pull request approved, red, and permanently stranded because no webhook or agent is
      awake to advance it (neither review nor merge manager triggers);
      (2) The reviewer workflow (`review.yml`) crashed on CLI termination or non-quota step failures,
      refusing Gemini fallback, causing the `reviewer` check to fail without posting any verdict
      and stranding review requests indefinitely;
      (3) Conflicting loop branches on `hard` challenges accumulated conflicts without clear
      remediation guidance.
    alternatives:
      - name: Require manual solo intervention whenever approved PRs fail post-rebase checks
        chosen: false
        reason: >-
          Leaving approved-but-red PRs to manual human discovery reintroduces human polling
          and violates autonomous operation for routine mechanical gate failures.
      - name: Limit fallback activation strictly to HTTP 429 quota exhaustion
        chosen: false
        reason: >-
          Harness failures stem from varied API, CLI, or environment aborts; restricting
          fallback to 429 drops reviews on unexpected crashes and leaves requests stranded.
      - name: Three-layer self-healing across coder review dispatch, resilient harness fallback, and zero-verdict review retry
        chosen: true
        reason: >-
          Enabling coder review dispatch on approved PRs with failing checks allows autonomous
          remediation of post-rebase breakages; expanding fallback to all harness failures in review.yml
          and coder.yml prevents verdict crashes; and re-requesting review when reviewer checks fail
          without a verdict guarantees no request remains permanently abandoned.
    consequences:
      - >-
        `move:dispatch` detects approved pull requests on loop branches with failing checks and
        dispatches the coder review pass to remediate the failures; `move:dispatch_pass` permits
        review pass execution for approved PRs with failing checks.
      - >-
        `move:dispatch` and `check_pr:unheld` detect stranded review requests where the reviewer
        check failed without submitting a verdict, automatically re-requesting review and reporting
        the exact remediation.
      - >-
        `.github/workflows/review.yml` and `.github/workflows/coder.yml` activate Gemini fallback
        on any Claude harness failure rather than aborting with exit 1 on non-quota errors.
      - >-
        `check_pr:unheld` provides explicit loop stand-down guidance for conflicting branches on
        `hard` and `human` challenges (solorepo's DR-142).
    falsifier: >-
      An approved PR on an easy or medium challenge with failing checks sitting idle without
      coder dispatch; a reviewer check concluding in failure without submitting a verdict
      failing to be re-requested; or a Claude harness failure in review.yml exiting 1 without
      activating the Gemini fallback.
    rationale: |-
      Autonomous software development requires loops that heal across webhook boundaries.
      When an upstream change breaks a downstream approved PR, or when a reviewer harness
      crashes mid-run, the system must detect the broken state on the next push or sweep and
      re-engage the appropriate agent. Expanding fallback resilience, auto-retrying stranded
      review requests, and dispatching coder passes for approved-but-failing PRs closes the
      automation gap and keeps trunk moving smoothly without manual solo intervention.
