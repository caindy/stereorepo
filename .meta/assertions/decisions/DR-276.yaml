decisions:
  - id: work:decision/276
    name: "DR-276 · A Concept is minted by reservation, and a row in the Ubiquitous Language stands on the solo's say-so in three places"
    challenge: work:challenge/839
    status: ADOPTED
    applies:
      - work:article/17
      - work:article/19
      - work:article/20
    enacted_in:
      - work:artifact/meta-lib-move-concepts
      - work:artifact/meta-lib-move-init
      - work:artifact/meta-lib-move-cli
      - work:artifact/meta-say-move
      - work:artifact/meta-say-verbs
      - work:artifact/meta-checks-files-vocabulary
      - work:artifact/meta-checks-files
      - work:artifact/meta-lib-check-pr-verdict
      - work:artifact/meta-checks-probes-channel
      - work:artifact/meta-checks-probes-files
      - work:artifact/meta-checks-probes-channel-mint
      - work:artifact/meta-checks-probes-files-mints
      - work:artifact/meta-assertions-structure
      - work:artifact/meta-vocabulary
      - work:artifact/meta-readme
      - work:artifact/template-meta-readme
    context: >-
      A17 requires every word doing the work of a domain term to resolve to a
      Concept of the Ubiquitous Language with a wiki page beside it, and the
      vocabulary's own header says "do not mint a term without the solo". Both
      are prose. Every mechanism that reads the vocabulary reads a row or a page
      taken alone — whether the row is well formed, whether its page exists,
      whether the page's lead defines it — so a Job that added the row, the
      concept and the page together produced three well-formed artifacts and a
      word nobody had agreed to.

      Two words arrived that way. "Forge" was minted by a session without
      agreement and spread until the solo withdrew it. "Door" was a figure of
      speech in the Decisions from solorepo's #117 on, became a Concept of the
      Ubiquitous Language in solorepo's #807, and DR-264 then used it as the
      name of a workflow's entry point; the solo learned it was the
      repository's word by reading a sentence that called it one, and ratified
      it after the fact.

      "Door" is the case that says where the line is. It was minted inside a
      session, which is the category DR-235 already treats as carrying the
      solo's mandate, because a session has the solo beside it. He was not
      beside that one. So `channel.in_a_run()` is necessary and is not
      sufficient: the mandate a level carries is a mandate to route work, which
      a session holds by construction, and the mandate to coin a word is not the
      same mandate. Nothing in the record held the difference, and nothing asked.

      The unit throughout is the Concept, which is what solorepo's DR-018
      settled the Ubiquitous Language to be a set of: the row a vocabulary
      carries, the identifier the reservation is named for, and the word each
      layer counts are one thing under one name. Nothing here revives the Term
      as a unit of the language, which is the model DR-018 rejected.
    alternatives:
      - name: Say it louder in the prose
        chosen: false
        reason: >-
          This is the state that produced both words. The rule was already
          written where a session would read it, at the head of the file it
          governs, and A20 says a rule that lives only in the record is not in
          force. Both mints were made by Jobs that had the sentence in front of
          them.
      - name: Refuse the mint to a run and stop there
        chosen: false
        reason: >-
          `move mint --concept` refused to a run is the DR-235 boundary, and
          "Door" crossed it: a session is where that refusal stands aside, and a session
          minted it. The refusal is worth having — it is the cheapest of the
          three and it closes the case where nobody is watching at all — but
          resting the whole mechanism on it would leave the observed failure
          unrefused.
      - name: Carry a Concept's provenance in the assertion
        chosen: false
        reason: >-
          A `minted_by` slot on the Concept would put the fact in the record
          where it is read, which is the right shape and the wrong medium: a Job
          that can write the row can write the slot, so the record would say
          what the Job typed rather than what the solo said. The reservation is a
          fact about GitHub instead, and the approval is a fact about an account
          no Job holds. This is what would make the other two removable, once
          something outside the tree signs the slot.
      - name: A reservation, a gate step and the solo's own approval
        chosen: true
        reason: >-
          Three layers, each refusing what the one before it cannot see.

          `move mint --concept <ident>` reserves `refs/tags/concept/<tail>` on
          GitHub, which is DR-128's mechanism for a Decision number applied to
          a word: the tag is the allocation, it outlives the row, and it is a fact no
          edit to the tree can forge. It is refused inside a run on
          `channel.in_a_run()`, the same line `move claim` and `move difficulty`
          draw (DR-148, DR-235).

          `vocabulary mints` reads the Concepts this branch adds to
          `.meta/assertions/imported/vocabulary.yaml` and
          `.meta/assertions/domain_vocabulary.yaml` against `origin/main`, and
          fails a row with no reservation behind it. It asks the remote nothing
          on a branch that adds none, so the step costs nothing on almost every
          run — the discipline `reserved_decision_numbers` already keeps.

          `unratified_concepts` fails a pull request whose diff adds a Concept
          unless an approving review of its current head stands on it from a
          login no Role holds. That is the layer "Door" needed: the reservation and the run boundary
          are both things a session can type, and an approval from an account
          outside `ROLES` is not. It is identity-based rather than
          location-based for DR-235's own reason — a mandate is admitted by the
          account it speaks as.

          Both the verb and the gate step are handed the identifier and take
          its tail, so `work:concept/seed-commit` is reserved as
          `concept/seed-commit` and the three layers agree on the word without a
          fourth place — a label, a title, a page name — to keep in step.
    consequences:
      - >-
        `.meta/lib/move/concepts.py` holds `mint_concept`, which refuses a run,
        refuses an argument that is not a Concept identifier, and reserves
        `refs/tags/concept/<tail>` as an annotated tag over main's head. A
        Concept already reserved reports the reservation that is there and makes
        no second reservation — by the read before the write where the remote
        answers it, and by the ref write's own "already exists" where it does
        not, which is what two sessions minting one word at once produce. On
        that second branch the tag object posted before the ref is left
        unreferenced, since the ref write needs a `sha` and so the object comes
        first.
      - >-
        `move mint` takes `--concept <ident>`; without the flag the verb issues
        the next Decision number as it did, and the flag given empty is refused
        rather than routed to the Decision mint, since a number issued is never
        issued again. The two are the same act on two records, and
        `verbs.yaml` says so in one entry rather than two.
      - >-
        `vocabulary mints` in `.meta/checks/files/vocabulary.py` is a step of
        the gate. It comes to `CouldNotRun` rather than to a pass where the base
        ref or the remote cannot be read, since a row read against nothing is
        unchecked and not clean, and under CI that is a failure (A6,
        solorepo's DR-261).
      - >-
        `unratified_concepts` joins the pull request gate beside the form, the
        threads and the Trailers. It reads the vocabulary patches rather than
        the files, because the question is what this pull request adds, and it
        reads both of their sides across both files at once: an identifier on
        the removed side is a row moved, reordered or reindented rather than one
        this change mints. It asks for a patch only where the pull request
        touches a vocabulary at all, and the approval it accepts must name the
        head the row sits on, since an approval of an earlier head — the plan
        approved on a draft under solorepo's DR-273, say — was given before the
        row existed. A read it cannot make is reported as this pull request's own
        failure rather than raised, since the sweep runs the gate over every
        open pull request in one loop and an exit would leave every later one
        with no verdict published at all.
      - >-
        `.meta/checks/probes/channel/mint.py` observes the run refusal firing
        with GitHub never reached, the session's mint writing the ref, and a
        second mint of a reserved Concept writing no tag object.
        `.meta/checks/probes/files/mints.py` drives `vocabulary mints` through
        its `added` and `reserved` seams over a reserved row, an unreserved one
        and each read it cannot make, since the step itself runs on almost no
        branch and a guardrail never observed to fail is evidence of nothing
        (A4).
      - >-
        A Concept the solo adds himself passes every layer without ceremony where
        he has typed the mint, and a row a reviewer's thread asked for by name
        still needs the reservation: the thread is not the tag. That is
        deliberate — the ask and the mint are one command apart, and the
        reservation is what a later reader finds.
    falsifier: >-
      The mechanism is falsified by a Concept reaching the Ubiquitous Language
      without the solo having typed the mint or approved the pull request that
      carried it. The choice is falsified by the third layer becoming the only
      one that ever fires, which would say the reservation is a ceremony a Job
      performs on its way past — and the answer then is to drop the tag and keep
      the approval, rather than to keep a step nobody's judgement stands behind.
      It is also falsified by the gate step failing branches that coined no word:
      a Concept identifier moved, a file renamed, or a vocabulary split reads as
      an addition to a diff and is not a mint, and if that is what the step
      spends its failures on then it is reading the wrong thing.
    rationale: |-
      Christopher settled the shape on the Challenge, after the reviewer read it
      as `human` and said what was owed: what counts as his say-so for a mint,
      and how the channel is to admit it. His answer was belt and suspenders —
      the attested mutation plane, the local verification gate, and the pull
      request gate — with the note that an autonomous reviewer account approving
      a vocabulary addition is not his approval.

      The reason to take all three rather than the strongest one is in the two
      cases. "Forge" was the case with nobody watching, which the run refusal
      closes. "Door" was the case with the solo one room away and not asked,
      which only the approval closes. The gate step sits between them and is the
      one that fires in the moment the word is being written, which is the
      moment a Job can still put it back.
