decisions:
  - id: work:decision/068
    name: "DR-068 · Resolving is assent, and counts as an answer"
    status: ADOPTED
    supersedes:
      - work:decision/057
    applies:
      - work:article/16
    alternatives:
      - name: Require a written reply from a second party
        chosen: false
        reason: >-
          It deadlocks. An agent raises a thread, the change overtakes it, and
          there is no Issue to promote it to — so resolving fails A16 and not
          resolving fails the ruleset. The solo's only way out is a sentence of
          theatre per thread, which is how a rule gets routed around rather than
          followed.
      - name: Count whoever resolved the thread as a party
        chosen: true
        reason: >-
          Resolving is an act, not a silence: a solo who reads an answer and
          marks it resolved has assented, which is what A16 asks for. What it
          costs is that it holds only while an agent does not resolve its own
          sole-authored threads, because agent and solo share one login — so it
          rests on a step until the accounts make it structural.
    consequences:
      - >-
        PR First gains a step: never resolve a thread you are the sole author of.
      - >-
        `resolvedBy` joins the thread query, and the party set is the logins, the
        Actor Trailers, and the resolver.
      - >-
        DR-066 makes it structural. With a Role account, `resolvedBy` is a
        different login and nothing rests on the agent's restraint.
    falsifier: >-
      A thread resolved by the agent that wrote every word of it and passing the
      check. That is the shortcut A16 exists to catch, and it is available today
      to anyone who ignores the step.
    enacted_in:
      - work:artifact/meta-say
    rationale: |-
      Found by the practice deadlocking on its own pull request. Two
      threads raised by an agent, both answered by the change that
      overtook them, neither deserving an Issue: resolving them failed A16
      for having one party, and leaving them unresolved failed the
      ruleset. No legal move was available to the agent.

      A second defect surfaced at the same time and is worth recording
      because it *passed* rather than failed. One thread satisfied A16 for
      the wrong reason — an agent comment written without the Trailer
      counted as the human, so the agent had manufactured its own second
      party by forgetting to sign.

      Both are the same shortage: one login, two parties.
