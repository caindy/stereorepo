decisions:
  - id: work:decision/186
    name: "DR-186 · Configure thinking depth across coder harnesses by difficulty level"
    challenge: work:challenge/368
    status: ADOPTED
    enacted_in:
      - work:artifact/github-workflows-coder
    context: >-
      Currently, `coder.yml` configures model selection (`claude-sonnet-5` vs `claude-opus-5`,
      `gemini-3.8-flash`) in `choose the depth`, but does not differentiate thinking or reasoning
      depth across difficulty levels or harnesses. For Gemini CLI, both `easy` and `medium` use
      `gemini-3.8-flash` with identical unconfigured default thinking. For Claude Code, Sonnet
      and Opus do not explicitly specify maximum thinking tokens (`MAX_THINKING_TOKENS`).

      On `easy` challenges, deterministic and localized fixes do not require extensive reasoning
      loops; `gemini-3.8-flash` with low thinking minimizes latency and token consumption while
      the gate verifies correctness. On `medium` and `rebase` challenges, multi-file changes and
      subtle architectural synthesis require extended reasoning; `gemini-3.8-flash` with high
      thinking provides the needed cognitive headroom. For Claude Code, Sonnet and Opus should
      always run high extended thinking to prevent shallow regressions and hallucinations.
    alternatives:
      - name: Leave thinking depth unconfigured or rely solely on model selection
        chosen: false
        reason: >-
          Fails to control token and latency costs on Gemini CLI for easy tasks, and risks
          Claude defaulting to truncated thinking budgets without explicit token maximums.
      - name: Configure thinking depth across coder harnesses by difficulty level and pass
        chosen: true
        reason: >-
          Outputs `gemini_thinking=low` on `easy` challenges and promotion passes, and
          `gemini_thinking=high` on `medium` and `rebase` passes. Configures Gemini CLI
          settings with matching `ThinkingLevel`, and exports `MAX_THINKING_TOKENS: "32000"`
          for Claude Code runs so Sonnet and Opus always think deeply.
    consequences:
      - >-
        `choose the depth` in `.github/workflows/coder.yml` outputs `gemini_thinking=low` on
        `easy` challenges and promotion passes, and `gemini_thinking=high` on `medium` challenges
        and rebase passes.
      - >-
        Gemini CLI steps (`take the Issue (gemini)`, `rebase onto the base (gemini)`,
        `answer the review (gemini)`, `promote on approval (gemini)`) pass `settings:` configuring
        `thinkingLevel: LOW` or `HIGH` with `includeThoughts: true`.
      - >-
        Claude Code steps in `.github/workflows/coder.yml` export `MAX_THINKING_TOKENS: "32000"`,
        ensuring Sonnet and Opus always execute with full extended thinking.
    falsifier: >-
      An `easy` Challenge running under Gemini CLI with `thinkingLevel: HIGH`, or a Claude Code
      step running without `MAX_THINKING_TOKENS: "32000"`.
    rationale: |-
      Aligns cognitive reasoning depth with difficulty rubric across both harnesses: simple,
      deterministic tasks complete faster with lower token overhead, while complex multi-file
      changes receive the deep reasoning necessary to avoid defects.
