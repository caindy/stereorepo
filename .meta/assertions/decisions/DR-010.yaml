decisions:
  - id: work:decision/010
    name: "DR-010 · Placeholder READMEs in empty directories"
    status: ADOPTED
    enacted_in:
      - work:artifact/agents
    rationale: |-
      git does not track directories, so the empty scaffolding folders would not have
      survived a clone — and cloning is how stereorepo is distributed. Each carries a
      README saying its contents are not yet decided.
