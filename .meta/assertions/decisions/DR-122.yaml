decisions:
  - id: work:decision/122
    name: "DR-122 · A reviewer session that added no verdict is a red run, and an agent it spawns runs in the foreground"
    challenge: work:challenge/131
    status: ADOPTED
    applies:
      - work:article/6
    enacted_in:
      - work:artifact/github-workflows-review
      - work:artifact/meta-say-on
    alternatives:
      - name: The prompt says it, louder
        chosen: false
        reason: >-
          The prompt already said "wait for every one of them", written after
          the second time, and three more runs ended the same way. The model
          reads ending its turn as waiting, because in an interactive session
          a notification wakes it when the agent finishes; an instruction that
          leaves that model of the harness in place fails however loudly it
          is put.
      - name: Rely on the harness's documented wait
        chosen: false
        reason: >-
          The headless reference says a print-mode run "stays open until that
          work completes" when Claude starts a background subagent, with a
          ten-minute idle ceiling in `CLAUDE_CODE_PRINT_BG_WAIT_CEILING_MS`.
          The three runs ended within a second of the turn, 148 seconds in
          on #140, and no ceiling was near. Whether the action invokes the
          CLI in the mode the reference describes is not visible from the
          run log, and a fact about the harness is answered by a test: three
          tests say the wait did not start. Turning the ceiling up would be a
          knob on a wait that was not observed.
      - name: Remove Agent from the allowed tools
        chosen: false
        reason: >-
          It would end the failure by construction. It would also change the
          review: #136's first review used four background agents, read them
          with TaskOutput, and posted at 84 turns, and #122 measured the
          agents as the long pole with the main loop re-checking what they
          found. A review done in one loop is a different review from the
          one the depth was chosen for. It stays on the table, and the
          falsifier says when it is taken.
      - name: Count the verdicts before and after, red when none was added; and the prompt names the mechanism
        chosen: true
        reason: >-
          Whether a session reviewed is a fact GitHub holds — a verdict by
          the Role's login that was not there before — and a step that reads
          it does not depend on the model, the action or the reference being
          right about anything. The prompt half says what was missing: the
          run ends with the turn, so an Agent runs in the foreground and its
          result arrives in the same turn, and one already started in the
          background is read with TaskOutput first. What it costs: two reads
          of the reviews API per run; a verdict counted rather than read, so
          one posted against a head that moved during the run still counts,
          which a moved head's cancel makes rare; and, until the review door
          took the count under solorepo's DR-264, the rule about what a
          verdict is stated twice, in `check_pr.py` and in a composite
          action's `jq`, held equal by nothing but the comment that said
          they agreed.
    consequences:
      - >-
        The review door, `.meta/say/on`, counts the verdicts the reviewer's
        login has submitted on a pull request — every review that is not the
        empty `COMMENTED` a raise or a reply posts under, which is what
        `check_pr.py --threads` lists — before the session and after, and
        `after the session` exits non-zero when the count did not rise, with
        the request named as still standing.
      - >-
        A red `reviewer` check means one of two things, and the step log
        says which: no verdict landed, or the session's own step failed or
        timed out. Only the first is answered by `.meta/say/move
        request-review`, which withdraws the pending request and asks again
        so the event fires; a session that posted its verdict and then ran
        out its minutes is red on its own step and passes the door's verdict
        count, the door reading which step ran rather than which ended well,
        and asking again would start a second full review of an answered
        pull request. A green check means a verdict of the Role's
        landed during the run, whatever the transcript says it was waiting
        for.
      - >-
        The prompt's closing paragraph names the mechanism and the parameter:
        the run ends when the turn ends, an Agent runs in the foreground and
        never with `run_in_background`, and one started in the background is
        read with TaskOutput before anything else.
      - >-
        A portfolio inherits both: `.meta/say/` and `review.yml` are in the
        set Specialization's *Copy what is inherited* step copies.
      - >-
        `after the session` runs unless the run was cancelled — `!cancelled()`
        rather than `always()` — so a run that hit the turn cap or the
        timeout still reports whether a verdict landed, and a run a push
        cancelled never reaches it. The comparison fails closed: the pass is
        the branch that has to be reached, so a count that did not arrive,
        an empty step output included, is refused by the door rather than
        read as a green it did not earn.
    falsifier: >-
      A run that ends "waiting for the agents" after the prompt names the
      parameter — the red check will show it, and it would mean the prompt
      half is worth nothing and Agent is the next thing to take out.
    rationale: |-
      #131 noticed one run on #130; by the time it was taken up #138 and #140
      had ended the same way, each at about twenty turns with its agents
      spawned in the background and a result text saying it was waiting for
      them. Each time the check reported success and the request stood, and
      from the coder's side nothing distinguished it from a review not yet
      begun.

      The two halves the Issue asked for are the two here, with the prompt's
      half sharpened from "wait" to the mechanism, since the wait was what
      the model thought it was doing. The check is the half that holds: it
      turns a claim in a transcript into a count GitHub keeps, which is the
      same move DR-118 made for the head a verdict names.
