decisions:
  - id: work:decision/221
    name: "DR-221 · One Challenge is one Issue, kept by the title at `file` and the promotion link at `promote`"
    challenge: work:challenge/544
    status: ADOPTED
    applies:
      - work:article/15
    enacted_in:
      - work:artifact/meta-say-move
      - work:artifact/meta-say-post
    context: >-
      `post promote` is `file`, `reply`, `resolve`, in that order, and the
      three are not one transaction. `move.file_issue` created
      unconditionally, so a `promote` whose `reply` or `resolve` failed left
      the Issue filed and the retry filed a second one. Four pairs of open
      Challenges were one Challenge filed twice — the Challenges #434/#435,
      #440/#441, #443/#444 and #454/#455 — each pair byte-identical but for its
      `**Waits on.**` paragraph and each carrying one `Actor:` trailer, so
      one run filed each twice. Run `gha-34906343384` did it to two at once.
      The cost was not shelf space: a fifth pair, the Challenges #436 and
      #437, was doubled the same way and both halves were worked, so their
      pull requests #439 and #442 both merged and landed the same change on
      `meta types` twice.
    alternatives:
      - name: Key the identity on the promoting thread alone
        chosen: false
        reason: >-
          The thread is the stronger key and `promote` holds it, but `file`
          is also typed with no thread at all, so a thread-only identity
          leaves the direct path uncovered — and the direct path is the one a
          session types.
      - name: Key the identity on the title alone
        chosen: false
        reason: >-
          A recomposed retry keeps the title, so the title catches the
          observed failure; but it is the weaker claim, and it says nothing
          on a thread whose Issue was filed under a title since revised.
      - name: Have `promote` return the existing Issue rather than refuse
        chosen: false
        reason: >-
          A verb that answers a second call as though it were the first hides
          the half-done act it was called over. The remainder is the thread,
          and a caller who cannot see that is a caller who will not finish it.
      - name: Key `promote` on the gate's own `PROMOTED` pattern
        chosen: false
        reason: >-
          The gate reads any Issue URL from any party as evidence that a
          thread's item survives somewhere, which is the right reading for a
          gate. As a veto on filing it is the wrong one: its false positive
          costs the Challenge, not a repeated URL.
      - name: Key each verb on what it holds, and refuse
        chosen: true
        reason: >-
          `file_issue` asks GitHub for an open Issue under exactly this title
          and refuses when there is one; `promote` reads the thread and
          refuses when it already carries a promotion link. Each verb is held
          to the strongest key available where it is typed, and both refusals
          name the verb that finishes the half-done act.
    consequences:
      - >-
        `move.file_issue` refuses a title an open Issue already carries,
        naming that Issue, and files nothing. `move.open_with_title` lists
        rather than searches: `gh issue list` reads the API and answers with
        what was written a moment ago, where `--search` reads the code search
        index, which lags by seconds to minutes — stale over exactly the
        window a retry occupies.
      - >-
        `post.promote` refuses a thread already carrying this channel's own
        promotion, matched by `post.PROMOTION` against the reply `promote`
        writes, and names the Issue it found. It does not use
        `check_pr.PROMOTED`: the gate's pattern matches any Issue URL any
        party wrote, and this repository asks a reviewer to dereference
        citations, so a thread arguing a point beside someone else's Issue URL
        is ordinary. Vetoing on it would refuse to file, then send the caller
        to `post resolve`, which stands aside on the same pattern — a resolved
        thread, a green gate, and noticed work with no Issue.
        `refuse_if_sole_author` returns the bodies it fetched, so the thread is
        read once.
      - >-
        Neither refusal only says no: each names the verb that finishes the
        act — `post answer` with a body linking the Issue, or `post resolve`
        where the link is already posted, which is the case
        `post.answer` was already documented as existing for.
      - >-
        A listing GitHub will not answer for does not stop a filing. The
        guard is a courtesy against a retry, not a gate, and an outage that
        made every filing impossible would be the worse failure. This costs a
        `tolerate_fail=True`: `channel.gh` ends the process on a non-zero exit
        unless the caller asks for the exception, so the same guard written
        without it is a gate wearing a handler that cannot fire.
    falsifier: >-
      Two open Issues under one title, or two Issues filed for one review
      thread, where every call went through the channel. Equally, a `move file`
      or a `post promote` that files nothing because GitHub would not answer a
      listing, or a `post promote` refused over a thread this channel never
      promoted.
    rationale: |-
      The identity of a Challenge is not something GitHub holds, so each verb
      is held to the best key it has rather than to one key imposed on both.
      That is why the answer is two refusals and not one: the thread is
      stronger where it exists, the title is available everywhere, and a
      single rule would have had to choose between covering the direct path
      and being precise.
      Refusing rather than returning the standing Issue follows the shape the
      other transitions already take — a verb refuses its own misuse — and
      the refusal carries the remedy, because the failure it is reached by is
      a caller part-way through an act it could not finish.
