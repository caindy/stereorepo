decisions:
  - id: work:decision/266
    name: "DR-266 · Refuse a Challenge whose semantic queue match is uniquely dominant"
    challenge: work:challenge/554
    status: ADOPTED
    applies:
      - work:article/15
    enacted_in:
      - work:artifact/meta-lib-move-challenges
      - work:artifact/meta-say-post
      - work:artifact/meta-lib-search-bm25
      - work:artifact/meta-checks-probes-channel-filing
    context: >-
      The exact-title guard in `move file` prevents a retry from filing the
      same Challenge twice, but it cannot identify the same work expressed with
      different words. This cost has landed: #552 duplicated #473 after its
      filer read a truncated title, and #436 and #437 each reached merged pull
      requests. The persistent search index cannot answer at filing time because
      it contains landed assertions and wiki pages, not open Challenges.

      The recorded spike ranked each proposed Challenge against the Issues open
      when it was filed. Every known duplicate was the top BM25F result, with a
      leading-to-second-result ratio from 1.79 to 3.02. The measured novel and
      adjacent Challenges reached at most 1.59. The solo selected the 1.79
      cutoff for maximum precision, retaining the reviewer as a later gate.
      Absolute score did not
      discriminate: novel #551 scored above duplicate #552.
    alternatives:
      - name: Warn about the leading match and file the Challenge
        chosen: false
        reason: >-
          A warning leaves the duplicated work in the queue, where a later
          reader must recognise and close it. The evidence identifies a
          discriminating ratio and the solo chose refusal as the first
          enforcement step.
      - name: Compare only exact titles
        chosen: false
        reason: >-
          Exact comparison is necessary for a retry but cannot detect a
          duplicate expressed under different words, which is the failure #554
          records.
      - name: Refuse a uniquely dominant semantic queue match
        chosen: true
        reason: >-
          BM25F already supplies the repository's field-weighted ranking
          mechanism. Applying the measured ratio to a transient index of open
          Issues detects the recorded duplicate shape without treating a high
          absolute score or ordinary adjacent work as evidence on its own.
    consequences:
      - >-
        `file_issue` reads open Issue numbers, titles, URLs, and bodies, then
        passes the queue to `open_with_title` for the exact-title retry guard
        and indexes it in memory with the existing BM25F implementation.
      - >-
        A filing whose leading result scores at least 1.79 times the runner-up
        is refused and names the standing Issue. A single scored document is
        uniquely dominant only when the queue held more than one Issue.
      - >-
        `post promote` inherits the check because it reaches `file_issue`; a
        promotion has no separate filing policy.
      - >-
        A GitHub failure while listing open Issues permits the filing, matching
        the exact-title guard's availability posture. A timeout remains an
        error because it supplies no result.
      - >-
        Filing probes hold duplicate, adjacent, no-match, unavailable-listing,
        and promotion cases. Future calibration changes the ratio only with
        measured queue examples.
    falsifier: >-
      A novel Challenge refused because it has adjacent work in the queue, or a
      duplicate Challenge filed after its leading semantic queue match fell
      short of 1.79.
    rationale: |-
      Filing is the only point where the proposed text and the live queue meet.
      Requiring each filer to search makes duplicate prevention optional, and
      searching the persistent index asks a past-tense corpus about current
      intent. The filing verb already owns an exact-title queue read, so the
      semantic check extends one shared operation rather than creating a second
      route that promotion could bypass.

      The ratio measures whether one standing Challenge explains the proposal
      substantially better than all alternatives. The runner-up is essential:
      a high score alone described both a novel and a duplicate Challenge in
      the spike. Refusal is intentionally backed by probes at the boundary and
      by re-measuring the queue when its vocabulary or size makes the present
      separation no longer credible.
