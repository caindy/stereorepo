decisions:
  - id: work:decision/037
    name: "DR-037 · One Bounded Context per portfolio is checked, not typed"
    status: ADOPTED
    alternatives:
      - name: "Make bounded_contexts single-valued"
        chosen: false
        reason: "DddModel is generic DDD, a Context Map legitimately holds many, and stereorepo's own map has three."
      - name: "Check it in the gate instead"
        chosen: true
        reason: "The constraint is enforced where it is true rather than where it is convenient: one context declared in domain_vocabulary.yaml, and the Portfolio names it."
    enacted_in:
      - work:artifact/meta-check
      - work:artifact/meta-checks-graph-structure
    rationale: |-
      A portfolio is exactly one Bounded Context (DR-014), and the plural
      `bounded_contexts` key invited listing several. The slot stays multivalued
      anyway: `DddModel` is generic DDD, a Context Map legitimately holds many, and
      stereorepo's own map has three. What is singular is a portfolio's **own** context.

      So the constraint is enforced where it is true rather than where it is
      convenient: the gate checks that `domain_vocabulary.yaml` declares one Bounded
      Context and that the Portfolio names that one. Probed with a second context,
      which it rejects.
