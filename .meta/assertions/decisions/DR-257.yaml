decisions:
  - id: work:decision/257
    name: "DR-257 · Synchronizing Antigravity CLI batch execution via streaming NDJSON driver and aligning workflow hand-back"
    challenge: work:challenge/715
    status: ADOPTED
    applies:
      - work:article/18
    enacted_in:
      - work:artifact/meta-say-on
      - work:artifact/meta-run-agy
      - work:artifact/meta-actions-agy
      - work:artifact/meta-detect-fallback
      - work:artifact/github-workflows-coder
      - work:artifact/meta-assertions-disciplines
      - work:artifact/meta-assertions-structure
    context: >-
      DR-245 restored Gemini fallback in CI by delegating to Antigravity CLI (`agy`) inside
      self-hosted ARC runner pods. During autonomous coder execution in workflow run 35550562870
      on Issue #709, Claude quota exhaustion triggered Antigravity fallback. During `take the Issue (gemini)`,
      the agent executed an unprompted baseline gate check. Because repository verification requires 20–40
      seconds and Antigravity's `run_command` tool enforces a 10-second synchronous timeout limit
      (`WaitMsBeforeAsync`), `run_command` automatically detached the process to a background task. Following
      its system instructions, the agent yielded turn execution to await completion.

      In headless print mode (`agy -p "$PROMPT"`), `agy` interprets an idle root agent as completion of the
      single-turn prompt response, waits up to 5 seconds for running background tasks (`root agent idle; waiting
      up to 5s for 1 background task(s)`), terminates remaining tasks (`terminating 1 background task(s) on exit`),
      and exits cleanly with code 0 after 69 seconds before claiming the Issue, branching, or opening a pull request.
      Furthermore, the `OUTCOME` environment binding in the `hand back what the run did not finish` step
      hardcoded `OUTCOME: ${{ steps.take_claude.outcome }}`, poisoning diagnostic logs with false `ended failure`
      accounts whenever Gemini fallback failed after Claude. Challenge #715 demanded synchronizing long-running
      commands during batch fallback and aligning hand-back parameter accounting.
    alternatives:
      - name: Foreground command execution wrapper using artificial heartbeat polling
        chosen: false
        reason: >-
          Wrapping commands to emit artificial periodic stdout heartbeats to defeat `run_command`'s 10-second
          internal timeout is fragile, does not alter Antigravity's internal process timers when commands block,
          and pollutes shell execution across the repository operator surface.
      - name: Prompt-level polling contracts and gate discipline enforcement alone
        chosen: false
        reason: >-
          Instructing agents never to yield while waiting or strictly reinforcing PR First Rule 13 (refusing
          entrance gate checks on evergreen `main`) prevents premature entrance gating, but fails at exit:
          the required exit verification gate before handoff still takes >20 seconds and would be terminated by
          `agy -p`'s 5-second idle exit timeout. Prompt steering is necessary defense-in-depth, but cannot resolve
          the architectural batch exit defect alone.
      - name: Streaming NDJSON execution driver, coder confinement, and workflow hand-back alignment
        chosen: true
        reason: >-
          Antigravity CLI provides `--input-format stream-json --output-format stream-json`, executing an
          interactive event loop over NDJSON on stdin/stdout. In `stream-json` mode, `agy` does not enforce the
          5-second idle exit timeout; when background commands detach, it waits for completion, delivers the
          completion event, and resumes turn execution. A dedicated, typed Python script (`.meta/run_agy.py`)
          drives `agy` within `.meta/actions/agy`, streaming events live to CI logs and propagating exit status.
          Complementarily, `.meta/detect_fallback.py` adds `--configure-coder` to deny `invoke_subagent(*)`
          during coder passes (symmetric with DR-254 for reviewer), the coder fallback prompt reinforces Rule 13
          against entrance gate checks on `main`, and `.github/workflows/coder.yml` aligns the `OUTCOME`
          environment binding with the terminal harness (whichever agent harness executed last in the fallback chain,
          either Claude or Gemini).
    consequences:
      - >-
        `.meta/run_agy.py` is implemented as a first-class, typed execution driver for Antigravity
        CLI, executing `agy` with `--input-format stream-json --output-format stream-json`, forwarding prompts,
        streaming live event progress to console logs, and capturing terminal results.
      - >-
        `.meta/actions/agy/action.yml` invokes `.meta/run_agy.py` instead of bare `agy -p "$PROMPT"`.
      - >-
        `.meta/detect_fallback.py` introduces `--configure-coder` to deny `invoke_subagent(*)` in Antigravity
        settings for coder passes, enforcing single-session evaluation under Antigravity CLI.
      - >-
        `.github/workflows/coder.yml` updates the fallback coder prompt to explicitly prohibit entrance gate
        checks on evergreen `main`, and aligns the `OUTCOME` environment binding in the `hand back what the run
        did not finish` step with the terminal harness outcome.
      - >-
        Specialization's *Copy what is inherited* step inherits `.meta/run_agy.py` alongside `.meta/detect_fallback.py` and `coder.yml`.
      - >-
        Closes #715.
    falsifier: >-
      An autonomous coder pass under Antigravity CLI terminating due to a 5-second background task idle timeout;
      or the coder's door, `.meta/say/on`, reporting Claude's outcome when Gemini fallback failed.
    rationale: |-
      In the agentic AI era, automated failover must not trade model diversity for brittle lifecycle mechanics.
      Headless print mode in Antigravity CLI was optimized for single-turn query-response invocations, causing
      it to mistake asynchronous background task detachment for turn finalization. Driving `agy` through its
      streaming NDJSON protocol preserves full multi-turn conversational semantics, allowing long-running
      verification gates and compilation steps to complete naturally. Pairing streaming execution with mechanical
      subagent denial, prompt-level gate discipline, and accurate parameter propagation prevents premature batch
      exit and misattributed hand-back reporting.
