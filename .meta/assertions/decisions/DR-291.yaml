decisions:
  - id: work:decision/291
    name: "DR-291 · Move open omits automatic review requests on easy Challenges, and the reviewer reviews whenever requested"
    challenge: work:challenge/1062
    status: ADOPTED
    supersedes:
      - work:decision/249
    applies:
      - work:article/15
      - work:article/16
      - work:article/22
    enacted_in:
      - work:artifact/meta-lib-move-pull-requests
      - work:artifact/meta-assertions-imported-disciplines
      - work:artifact/meta-checks-probes-loops-open-pull-request
      - work:artifact/meta-say-verbs
    mechanics:
      - >-
        `.meta/say/move open` inspects declared closing issues via
        `check_pr.closed_issues(body)` and omits calling `handoff.request_review`
        when any closing issue carries the `easy` label. Non-easy and unlinked
        pull requests continue to request review automatically upon creation
        (solorepo's DR-273).
      - >-
        The reviewer Role does not decide whether a review should occur: whenever
        review is requested of the reviewer's account, it must execute its review
        pass, evaluating the plan on a plan-only draft pull request or evaluating
        the diff when code is present. The reviewer is barred from withholding
        review or requesting changes merely because an easy or medium pull request
        is opened at the draft plan stage.
    alternatives:
      - name: Request review automatically on all pull requests and adjust reviewer prompts
        chosen: false
        reason: >-
          Leaves routine easy changes with an unnecessary review handoff before
          implementation diffs exist, consuming runner minutes and stalling loops.
      - name: Omit automatic review requests on easy issues in move open and enforce reviewer review on demand
        chosen: true
        reason: >-
          Eliminates premature review handoffs for routine easy tasks while ensuring
          the reviewer Role always answers when summoned by the review request semaphore.
    consequences:
      - >-
        Pull requests closing `easy` Challenges open as drafts without summoning
        the reviewer Role, allowing the coder loop to author the implementation diff
        before requesting review.
      - >-
        Non-easy Challenges retain automatic review handoff at `move open` to
        complete initial plan validation under solorepo's DR-273.
      - >-
        When review is requested of the reviewer Role, the reviewer reviews what
        was submitted without second-guessing whether review was permitted.
    falsifier: >-
      A pull request closing an easy Challenge that automatically requests reviewer
      review upon creation; or a review request on a draft pull request that the
      reviewer rejects on the grounds that review should not have been requested.
    rationale: |-
      solorepo's DR-249 established that routine changes decline an obligatory
      pre-code review gate in favor of post-facto diff review. However, solorepo's
      DR-273, DR-287, and #1043 established that all pull requests open as drafts
      on a Seed Commit and atomically request review.

      When `move open` automatically requested review for easy Challenges, reviewer
      agents inferred a contradiction with DR-249 and rejected the plan-only Seed
      Commit with `CHANGES_REQUESTED`. Resolving this requires two complementary
      adjustments: `move open` omits automatic review requests when closing an
      `easy` Challenge, and the reviewer Role is bound to review whenever review
      is requested rather than deciding whether a review should occur.
