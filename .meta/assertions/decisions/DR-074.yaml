decisions:
  - id: work:decision/074
    name: "DR-074 · Commits go through the channel, and the hook is deleted"
    status: ADOPTED
    supersedes:
      - work:decision/069
      - work:decision/071
    applies:
      - work:article/19
    alternatives:
      - name: A repository-local git identity
        chosen: false
        reason: >-
          It leaves the global config alone, which was the fear, and it still
          fails: `.git/config` applies to every commit made in the worktree, so
          the solo would start authoring as the Role in his own repository.
      - name: A `prepare-commit-msg` hook reading the environment
        chosen: false
        reason: >-
          What it read was inherited process ancestry, not a design. It
          discriminated correctly only because the solo's shell had never been
          given the harness's variables — luck rather than a boundary. Had it
          gone the other way his commits would have carried an `Actor` naming a
          session he was not part of, and a false attestation is worse than
          none because it is indistinguishable from a true one.
      - name: "`say commit`, setting identity and Trailers explicitly"
        chosen: true
        reason: >-
          The channel asserts only what it resolved: the Role's login and
          noreply address as author and committer, and the two Trailers composed
          from values it already holds. What it costs is that `git commit` by
          hand now produces an unsigned commit — which is honest, and which A19
          catches where the guarantee always lived.
    consequences:
      - >-
        `.githooks/prepare-commit-msg` is deleted and `core.hooksPath` unset.
        Nothing now depends on the harness's variables leaking into the right
        process and not the wrong one.
      - >-
        Author **and** committer are the Role. Author is the field GitHub reads
        for attribution, which is what DR-056's
        `require_extra_approval_for_unattributed_changes` was waiting on.
      - >-
        Identity is asserted only when a Role credential is in use. Without one
        the channel is speaking as the solo, and overriding his configured
        identity to say so would be the channel asserting what it was not given.
      - >-
        `say` no longer blocks on a stdin nobody is writing to. Five minutes of
        a session went to a `read()` on a pipe that was neither a terminal nor
        closed, so it asks whether anything is readable first.
    falsifier: >-
      A commit from the solo carrying an `Actor` Trailer, or one from an agent
      carrying his name. Either would mean the channel is not the only thing
      asserting identity.
    enacted_in:
      - work:artifact/meta-say
    rationale: |-
      Christopher asked how the discrimination worked, and the honest
      answer was that I had not arranged it: the harness sets `AI_AGENT`
      and the session id in the process it spawns, and his shell is a
      different tree. Verified — both empty in his terminal — so the hook
      was not lying. It was right by construction that nobody had chosen.

      Signing must not depend on something happening to be true. The hook
      read what it found; `say commit` states what it resolved. The first
      is correct until an environment changes underneath it, and the
      change would be invisible in exactly the way that matters — a
      trailer that looks identical whether it names the right session or
      the wrong one.
