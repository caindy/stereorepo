# What an agent working here may do, and to what.
#
# The first instances of the authority half of the ontology. It has been TBox
# since DR-003 and asserted nothing, which #11 measured: twelve of forty-nine
# classes populated, and none of Capability, Securable or Permission among them.
#
# What made these writable was needing them. `.meta/say` exists because signing
# had to stop being an act, and the moment it existed there was a real
# Capability to name — one that is not "run a shell" and not "use `gh`", but the
# thing actually being permitted.

capability_set:
  - id: work:capability/gh
    name: gh
    description: >-
      GitHub's command-line client. A TOOL, so it composes nothing: it is
      atomic in the sense DR-006 settled, and everything below is built out of
      it rather than beside it.
    capability_kind: TOOL

  - id: work:capability/speak-on-github
    name: Speak on GitHub as this Actor
    description: >-
      Write a comment, open a thread, reply, resolve, file an Issue or open a
      pull request — with the Actor Trailer appended by the channel rather than
      by the writer.

      A SKILL rather than a TOOL because it composes one, and because the thing
      being permitted is not the binary. "Use `gh`" names an implement and
      permits everything it can reach; this names what may be done, which is
      what a Capability is for.

      Its guarantee is where the identity comes from: the environment, never an
      argument. A caller that can pass an identity can pass the wrong one, and
      the failure this exists to prevent was not a wrong identity but a missing
      one.

      Its operations are the steps of the Disciplines, one verb each, and not
      `gh`'s nouns (DR-116): file a Challenge, hand an Issue back, open a layer,
      answer a thread, promote one at merge, post what landed. They are not
      Capabilities of their own. A Capability earns an instance when one Role
      holds it and another does not, and every Role that may speak may perform
      all of these; splitting them would divide the axis without a Permission
      that could name a piece. The one operation a single Role holds, review,
      is the instance below.
    capability_kind: SKILL
    composed_of:
      - work:capability/gh

  - id: work:capability/review-on-github
    name: Review a pull request on GitHub as this Actor
    description: >-
      Approve, request changes, or comment as a review — with the Actor Trailer
      appended by the channel. A SKILL composed of `gh` for the reason
      `speak-on-github` is: what is permitted is the act, not the binary. It is
      the reviewer's half of a handoff. The coder requests and the reviewer
      answers, and GitHub holds both as state.
    capability_kind: SKILL
    composed_of:
      - work:capability/gh

securables:
  - id: work:securable/github-conversations
    name: This repository's pull requests and Issues
    description: >-
      Everything an agent can write on GitHub for this Portfolio: pull request
      bodies and comments, review threads and their replies, Issues.
    selector: The pull requests and Issues of the repository this worktree points at.

permission_set:
  - id: work:permission/agent-speaks
    name: An agent may speak on this repository's pull requests and Issues
    description: >-
      Held by both Roles, each under its own account (DR-107), so GitHub
      records which Role spoke. That the channel is the only path is still a
      deny list and a hook rather than a credential (#21), which is inspection
      rather than structure.
    capability: work:capability/speak-on-github
    securable: work:securable/github-conversations
    condition: >-
      Through `.meta/say`, which signs. No other path to the same endpoint is
      permitted, and the Permission is the channel rather than the endpoint.

  - id: work:permission/reviewer-reviews
    name: The reviewer may review this repository's pull requests
    description: >-
      Held by the reviewer Role. An approval counts with GitHub only from write
      access, so the account holds WRITE, and not pushing to a branch is the
      Discipline's rule rather than GitHub's (DR-107).
    capability: work:capability/review-on-github
    securable: work:securable/github-conversations
    condition: >-
      Through `.meta/say --role reviewer review`, which signs.

# The Roles, and the accounts GitHub holds for them (DR-066, DR-107). A Role is a
# name: its login is `<owner>-<repo>-<role>` and its credential is
# `~/.config/solorepo/<role>.env` on each machine that holds it, so the three
# derive from one word and none is copied into a script.

roles:
  - id: work:role/coder
    name: coder
    description: >-
      Takes a Challenge to a pull request: commits, speaks, merges, and hands
      off by requesting review of the reviewer's account.
    capabilities:
      - work:capability/speak-on-github

  - id: work:role/reviewer
    name: reviewer
    description: >-
      The Role a pull request is handed to. Reads what GitHub holds, argues in
      the threads, and answers the request with a review.
    capabilities:
      - work:capability/speak-on-github
      - work:capability/review-on-github

principal_identities:
  - id: work:principal-identity/coder
    name: caindy-solorepo-coder
    subject: caindy-solorepo-coder
    issuer: GitHub
    description: >-
      The coder Role's account: held durably, proved by a token kept outside
      the tree per machine (DR-073).

  - id: work:principal-identity/reviewer
    name: caindy-solorepo-reviewer
    subject: caindy-solorepo-reviewer
    issuer: GitHub
    description: >-
      The reviewer Role's account, on the same terms. Created by the solo, which
      is the act DR-066 reserved for him.
