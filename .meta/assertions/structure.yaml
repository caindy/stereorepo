# stereorepo asserting its own structure.
#
# The scaffold is a Product because it has a primary Persona: the solo who uses
# it. Dogfooding is what makes that true rather than a stretch — the scaffold's
# first user is the person building it, and he is present to be asked.

portfolio:
  id: work:portfolio/stereorepo
  name: stereorepo
  description: >-
    The scaffold itself, treated as the Portfolio it produces. One Bounded
    Context, one Ubiquitous Language, one repo.
  bounded_context: ddd:context/stereorepo

projects:
  - id: work:project/meta
    name: .meta
    description: >-
      The staging ground: the ontologies, the assertions, and the tooling that
      renders and checks them.
    language: LinkML YAML, with Python for rendering and the gate
    # Both checkers are pinned exactly. `meta ruff` reads a violation and
    # `meta types` reads a count against a baseline (DR-177, DR-210), and a
    # release that gains or loses a diagnostic would move a count the tree did
    # not move.
    gate: uvx --python 3.13 --with linkml --with pyyaml --with ruff==0.14.0 --with mypy==2.3.1 --with types-pyyaml python .meta/check.py

  # A second Project, in a second language: the monorepo claim as a build unit
  # rather than a word. Its gate is written in Rust (DR-090), and the Project
  # is asserted because that gate runs — a Project whose gate does not run
  # would have nothing to be held to.
  - id: work:project/rust-seed
    name: bootstraps/rust/seed
    description: >-
      The seed workspace a Rust Project in a portfolio starts from: one library
      crate, and the xtask that is its gate. Real and buildable as it sits, so
      that the gate can run on it in place; a portfolio takes a rendered copy.
    language: Rust
    gate: cd bootstraps/rust/seed && cargo xtask gate

  # A third Project, in a third language, pulled in from `python_bootstrap`
  # (DR-094). The same shape as the Rust seed: a workspace whose gate is a
  # member written in the language it gates (DR-090, DR-098).
  - id: work:project/python-seed
    name: bootstraps/python/seed
    description: >-
      The seed workspace a Python Project in a portfolio starts from: one
      package, and the gate that is a workspace member beside it. Real and
      gated as it sits, so that the gate can run on it in place; a portfolio
      takes a rendered copy.
    language: Python
    gate: cd bootstraps/python/seed && uv run gate

products:
  - id: work:product/scaffold
    name: The scaffold
    description: >-
      stereorepo itself, used by the solo who builds it. Its interface is the load
      map, the vocabulary, the gate and the Specialization procedure.
    primary_persona: work:persona/the-solo
    built_from:
      - work:project/meta

  # A second Product, which is what makes the monorepo claim more than a word:
  # the scaffold and the Rust standard are delivered to different readers and
  # released independently, while sharing one language and one repository.
  - id: work:product/rust-standard
    name: The Rust standard
    description: >-
      What a Rust project in a portfolio inherits — the gates, the documentation
      layout, and stereorepo's Disciplines made executable for one language.
    primary_persona: work:persona/the-solo
    built_from:
      - work:project/rust-seed

  # A third Product, and the first with decisions of its own at the Product
  # level (DR-095, DR-096, DR-097): what every Python Project inherits is
  # shared by all of them and owned by none.
  - id: work:product/python-standard
    name: The Python standard
    description: >-
      What a Python project in a portfolio inherits — the gates, the rule
      set, the pins and the documentation layout, and stereorepo's Disciplines
      made executable for one language.
    primary_persona: work:persona/the-solo
    built_from:
      - work:project/python-seed

# The artifacts a Decision names under `enacted_in`, and nothing else. Listed
# here so that naming one is a reference the gate resolves rather than a path
# a checker matches. Partial by design: a file earns an entry by being
# answerable for something, not by existing.
artifacts:
  - id: work:artifact/agents
    name: AGENTS.md
    path: AGENTS.md
  - id: work:artifact/bootstraps-rust-readme
    name: bootstraps/rust/README.md
    path: bootstraps/rust/README.md
    preamble: |
      # The Rust standard

      What a Rust project in a portfolio inherits, and the gates that hold it there.

      The seed is [`seed/`](seed/): a workspace of one library crate and the xtask
      that gates it, a Bootstrap's gate being written in the language it gates
      (DR-090). **`cargo xtask gate` is the gate.** Each Discipline below says
      how it is satisfied in Rust and which step of the gate holds it there.
    postamble: |
      The other Disciplines bind the Portfolio rather than a Project — Progressive
      Disclosure, Ubiquitous Language, Dogfooding, Modelling the Human,
      Journaling — so a Bootstrap has nothing to implement for them.

      Three Articles bind the gate itself rather than being implemented by it: A5 —
      no gate step rewrites the tree; A6 — every step has three outcomes; A7 — a
      check-mark is a claim about scope. [`seed/xtask/README.md`](seed/xtask/README.md)
      says how the xtask keeps each.

      The Disciplines are in `.meta/assertions/imported/disciplines.yaml`. This
      directory only ever says **how** — a Bootstrap that restated a Discipline would
      be a second copy of it, and the second copy is the one that drifts.

      ## Taking it into a portfolio

      Specialization's *Choose languages and bootstrap* step, for Rust:

      ```bash
      bootstraps/rust/render <destination> <crate-name>
      ```

      That copies the seed out and names its crate. What arrives is the workspace,
      its pinned toolchain, and its gate; run `cargo xtask gate` in the destination
      before the first commit, which is also what the workflow does to prove the
      seed is sound.

      The seed is a real workspace named `seed`, not a tree of placeholder tokens,
      so that its own gate can run on it where it sits (DR-091). The one placeholder
      is the crate's name, and `render` is the one copy of how it is substituted.
  - id: work:artifact/bootstraps-rust-literate-programming
    name: bootstraps/rust/literate-programming.md
    path: bootstraps/rust/literate-programming.md
  - id: work:artifact/bootstraps-rust-render
    name: bootstraps/rust/render
    path: bootstraps/rust/render
  - id: work:artifact/bootstraps-rust-xtask
    name: bootstraps/rust/seed/xtask/src/lib.rs
    path: bootstraps/rust/seed/xtask/src/lib.rs
  - id: work:artifact/bootstraps-python-readme
    name: bootstraps/python/README.md
    path: bootstraps/python/README.md
    preamble: |
      # The Python standard

      What a Python project in a portfolio inherits, and the gates that hold it there.

      The seed is [`seed/`](seed/): a uv workspace of one package and the gate that
      holds it. **`uv run gate` is the gate.** Each Discipline below says how it is
      satisfied in Python and which step of the gate holds it there.
    postamble: |
      The other Disciplines bind the Portfolio rather than a Project — Progressive
      Disclosure, Ubiquitous Language, Dogfooding, Modelling the Human,
      Journaling — so a Bootstrap has nothing to implement for them.

      Four Articles bind the gate itself rather than being implemented by it: A5 —
      no gate step rewrites the tree; A6 — every step has three outcomes; A7 — a
      check-mark is a claim about scope; A21 — every gate prints one report shape.
      [`seed/gate/README.md`](seed/gate/README.md) says how the gate keeps each.

      The Disciplines are in `.meta/assertions/imported/disciplines.yaml`. This
      directory only ever says **how** — a Bootstrap that restated a Discipline would
      be a second copy of it, and the second copy is the one that drifts.

      ## Taking it into a portfolio

      Specialization's *Choose languages and bootstrap* step, for Python:

      ```bash
      bootstraps/python/render <destination> <package-name>
      ```

      That copies the seed out and names its package. What arrives is the workspace,
      its pinned tools, its lockfile, and its gate; run `uv run gate` in the
      destination before the first commit, which is also what the workflow does to
      prove the seed is sound.

      The seed is a real workspace named `seed`, not a tree of placeholder tokens,
      so that its own gate can run on it where it sits (DR-091). The one placeholder
      is the package's name, and `render` is the one copy of how it is substituted.

      ## Capabilities and the APM Package

      The Python standard declares sixteen agent skills as Capabilities in
      [`assertions/capabilities.yaml`](assertions/capabilities.yaml) (stereorepo's DR-208, solorepo's #59): eight refactoring
      skills (`py-*`) from `l-mb/python-refactoring-skills` and eight lifecycle skills adapted from `obra/superpowers`.

      Rather than vendoring raw skills into the project seed, they are compiled into
      an APM package at [`apm.yml`](apm.yml) under `.apm/skills/`. When a portfolio
      adopts Python (`just bootstrap python <dest>` or Specialization), the package is
      brought in as an APM dependency and projected into the active agent harnesses,
      keeping the seed workspace minimal and unencumbered. Upstream attribution and
      modifications are preserved in [`PROVENANCE.md`](PROVENANCE.md),
      [`LICENSE-python-refactoring-skills`](LICENSE-python-refactoring-skills), and
      [`LICENSE-superpowers`](LICENSE-superpowers).

      ## Where it came from

      The seed is `python_bootstrap`'s template with its memory architecture taken
      out, because that architecture is the Portfolio's `.meta/` here: its charter
      is `AGENTS.md`, its decision tracks are the record with `product` or
      `project` set, its bets are each entry's falsifier, and its journal is what
      Journaling routes. DR-094 is the account of what came and what stayed, and
      DR-095, DR-096, DR-097, DR-193 and DR-208 are its decisions about the standard, filed at the
      level they bind. The generator stays behind (DR-099): its `new` is [`render`](render),
      and its sync, never built, is kept there as the shape a portfolio's sync
      will take.
