# Cooper's personas are archetypes standing in for a class of real people. Here
# the class has one member and he is present, so this is not a research
# surrogate — it is a record of requirements, drawn from what he has actually
# said and done in building this repo. A departure from the canon, marked per
# DR-016.
#
# Maintained under the Modelling the Human Discipline: kept current as the work
# reveals things, grounded in something observable, and marked where it is
# inference. Everything below should be corrected by its subject rather than
# defended by its author.

personas:
  - id: work:persona/the-human
    name: The Human
    persona_kind: PRIMARY
    description: >-
      Christopher, building software products alone with agents holding the
      other seats. Primary persona for the scaffold itself.
    context: >-
      Works in long agent sessions, and expects to pick the same repo up in a
      fresh thread with none of the prior conversation. Reads primary sources
      before adopting from them.
    persona_goals:
      - id: work:persona-goal/portfolio-without-rebuilding
        goal_type: END
        statement: >-
          Start a new portfolio from this scaffold without rebuilding the
          scaffolding, and without inheriting the scaffold's own history.
      - id: work:persona-goal/fresh-thread-understands
        goal_type: END
        statement: >-
          Hand the repo to an agent in a fresh thread and have it understand the
          enterprise without being re-taught.
      - id: work:persona-goal/one-language-per-portfolio
        goal_type: END
        statement: Keep one language across everything built inside one portfolio.
    behaviors:
      - Corrects imprecise modelling immediately and specifically, rather than letting it stand.
      - Reads the source before adopting a taxonomy from it.
      - Walks back work that overreaches, and keeps the attempt on the record.
      - Commits each decision as it settles rather than batching.
      - >-
        Asks for concision in conversation and expansion in the record, on the
        grounds that unpacking can always be requested and tedium cannot be
        un-read.
      - >-
        Pushes a constraint down to where it is true rather than accepting it
        where it is convenient — asked whether the dead-end check could be
        schema-driven before accepting it in the gate.
      - >-
        Says what is being deprioritised, in so many words, instead of letting
        it decay quietly.
      - >-
        Drops a thing rather than keeping an empty placeholder for it, and moves
        the idea to the roadmap.
    frustrations:
      - Prose that duplicates a source and then drifts from it.
      - Terms invented without an explicit decision.
      - Re-explaining context that a repository could have carried.
      # inferred from the reframing of the persona-research goal, not stated
      - Tooling that punishes an omission where it could have guided instead.
    proficiencies:
      - Fluent in DDD, and in reaching for a canon before minting a term.
      - Comfortable in LinkML, SKOS and the semantic-web framing.
      # inferred from how consistently the ask is "can the model carry this"
      - Reaches for the model to carry a rule before reaching for a process.
