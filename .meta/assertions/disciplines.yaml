# stereorepo's own Disciplines: ones a portfolio does not inherit because it
# cannot perform them. A portfolio specializes nothing.
#
# Everything a portfolio does inherit is in imported/.

disciplines:
  - id: work:discipline/specialization
    name: Specialization
    description: >-
      Turning this scaffold into a new portfolio repo. Done once, by an agent
      following these steps, and never again in that repo.
    judgement: >-
      Which of the inherited terms this portfolio actually needs, who its
      stakeholders really are, and what its domain calls things. None of it is
      derivable from the scaffold, which is why this is a procedure to follow
      rather than a program to run.
    steps:
      - id: work:discipline-step/specialization/start-a-new-empty-repo
        name: Start a new empty repo
        statement: >-
          Copy only what the steps below name — never clone, and never copy the
          whole tree: a clone carries the scaffold's commit history and an `origin` pointing back at it,
          and neither belongs to a portfolio.
      - id: work:discipline-step/specialization/copy-what-is-inherited
        name: Copy what is inherited
        statement: >-
          Copy what is inherited — `.meta/work/`, `.meta/ddd/`, `.meta/work_ontology.yaml`, `.meta/ddd_ontology.yaml`,
          `.meta/render.py`, `.meta/check.py`, `.meta/lib/` (DR-217), `.meta/apm_compile.py`,
          `.meta/dereference.py`, `.meta/gate`, `.meta/search.py` (DR-194), `.meta/wikisplain.py`
          (DR-187), `.meta/terms.py` (DR-234), `.meta/bootstrap.py` (DR-206),
          `.meta/bundle.py`, `.meta/bundle.yaml`, `.meta/ruff.toml`, `.meta/mypy.ini`,
          `.meta/hooks/`, `.meta/checks/`, `.meta/assertions/imported/`, `.meta/.apm/`, `.meta/principles.md`,
          `.meta/schemas.md`, `.meta/templates/`, `wiki/stereorepo/` (DR-184), `stakeholders/README.md`,
          `stakeholders/customers/README.md`, `stakeholders/internal/README.md` and
          `.gitignore`. `.meta/bundle.yaml` is the same list, read by a program. The rest of the
          stakeholders directory is the portfolio's own Personas and Roles, which no sync touches
          (DR-317). Not the generated pages:
          Specialization's *Render and check* step writes those from the assertions. Not the pair loop
          either: it runs a portfolio's issues from outside the portfolio's tree, so the seats working
          there never read the loop's own code. Nor, inside what is copied, the paths that *Confirm
          scaffold-only paths absent* names, which have no subject in a portfolio (DR-305).
      - id: work:discipline-step/specialization/copy-template-replacements-and-link-agents
        name: Copy template replacements and link agents
        statement: >-
          Copy every file under `template/` to its matching path, then link `CLAUDE.md`, `GEMINI.md`,
          and `.github/copilot-instructions.md` to `AGENTS.md`. These are the replacements: the files
          that must carry none of the scaffold's content.
      - id: work:discipline-step/specialization/fill-placeholders-and-write-assertions
        name: Fill placeholders and write assertions
        statement: >-
          Fill in every placeholder, and write the portfolio's own assertions — its Portfolio, Products
          and Projects; its Personas, once there is research to draw them from; its Bounded Context and
          the words its domain experts actually use.
      - id: work:discipline-step/specialization/choose-languages-and-bootstrap
        name: Choose languages and bootstrap
        statement: >-
          Choose the languages the portfolio will use, from those stereorepo's `bootstraps/` supports, and
          bring them to hand: running `just bootstrap <lang> <path>` instantiates a seed project and registers
          it in `assertions/structure.yaml` (DR-206). Language adoption can happen now or be
          deferred to any point in the portfolio lifecycle.
      - id: work:discipline-step/specialization/render-and-check
        name: Render and check
        statement: >-
          Re-render, then run the gate. It fails on any placeholder left behind, so run it before removing
          anything. Both green before going on.
      - id: work:discipline-step/specialization/confirm-scaffold-only-paths-absent
        name: Confirm scaffold-only paths absent
        statement: >-
          Confirm `SPECIALIZE.md`, `ADOPT.md`, `template/`, `bootstraps/` and `pair/` are absent. A portfolio specializes nothing, and leaving
          any of them invites someone to run this twice. Confirm too that `.meta/adapt.py`, `.meta/lib/adapt/`
          and `.meta/checks/probes/tools/test_brownfield.py` are absent: brownfield adoption plans from
          `template/`, which a portfolio does not have (DR-305).
      - id: work:discipline-step/specialization/commit
        name: Commit
        statement: All changes verified, commit the specialized repository under the author's own credential.
    produces:
      - A portfolio repo, with its own history and nothing of the scaffold's.

  - id: work:discipline/adoption
    name: Adoption
    description: >-
      Bringing an existing repository, one that already holds a product, its
      history and its own records, under the conventions a specialized
      portfolio has. Done once per repository, by an agent following these
      steps in that repository with a stereorepo checkout beside it. What
      Specialization does for an empty repository, this does for one that is
      not empty, and it keeps everything the product already has.
    judgement: >-
      Which of the product's own records (a decision log, a roadmap) keep their
      subjects and which give them to Decision Records and the board; which of
      the product's domain terms share a label with an inherited one; how
      `README.md` and `AGENTS.md` carry both the product's content and the
      conventions; and what the product's gate has to run. None of it is
      in the plan a tool writes, which is why this is a procedure to follow
      rather than a program to run.
    steps:
      - id: work:discipline-step/adoption/plan-the-adoption
        name: Plan the adoption
        statement: >-
          From the stereorepo checkout, run `just adapt plan <repository>`. The plan
          lists only the paths the repository tracks, sorted into those it keeps, those it gains,
          those whose content it integrates and those that conflict, and it leaves out every path
          a portfolio does not have (DR-305). Read the plan before changing anything.
      - id: work:discipline-step/adoption/settle-the-products-own-records
        name: Settle the product's own records
        statement: >-
          For each decision log or roadmap the repository already keeps, decide which subjects it
          keeps and which move to Decision Records under `.meta/assertions/decisions/` or to the
          board in `issues/`. Do not assume they replace it: a log may record decisions about the
          domain that no Decision Record would.
      - id: work:discipline-step/adoption/retire-another-version-control-layer
        name: Retire another version-control layer
        statement: >-
          Where the repository uses a version-control layer over git, check that the layer holds
          nothing git lacks, such as unpublished changes or history kept only in its own store,
          before removing it. The pair loop reads only git.
      - id: work:discipline-step/adoption/copy-the-managed-items
        name: Copy the managed items
        statement: >-
          Run `<checkout>/.meta/bundle.py --root <repository> sync <checkout>` from a clean
          working tree. It copies every managed item the checkout tracks and leaves the
          repository's own files alone (DR-315). The repository's own `.gitignore` is merged, not
          replaced: stereorepo's lines go in one marked block at its end, and every line it
          already had stays outside that block, where later syncs leave it (DR-316). The
          repository has no `sync` recipe until this
          first copy brings one, and the checkout's own recipe cannot be pointed at it, because
          `--root` is an option of `bundle.py` and the recipe places its arguments after `sync`.
          Every later sync is `just sync <checkout>`, run in the repository.
      - id: work:discipline-step/adoption/integrate-the-template-items
        name: Integrate the template items
        statement: >-
          Work through the plan's integrate and conflict entries by hand: no tool applies them,
          except the `.gitignore` entry, which the sync has already merged. The sync leaves out the
          template items, each of which comes from the same path under the checkout's
          `template/`: `.meta/README.md`, `.meta/assertions/structure.yaml`,
          `.meta/assertions/domain_vocabulary.yaml`, `.meta/assertions/personas.yaml`,
          `.meta/assertions/decisions/DR-001.yaml`, `issues/README.md`, `README.md` and
          `AGENTS.md`. Where the repository already has its own `README.md` or `AGENTS.md`,
          integrate the template's file into it: keep the product's content beside the template's
          conventions. Copy the rest. Four placeholders wait to be filled, each an upper-case
          name between double underscores: the portfolio's name, its slug, its description, and
          why it exists.
          `structure.yaml` and `domain_vocabulary.yaml` carry the name, slug and description, and
          `README.md` and `AGENTS.md` the name and description. `DR-001.yaml` carries the name
          and why it exists, but is copied only for its shape: "Record the adoption" rewrites it
          and fills both there. Then link
          `CLAUDE.md`, `GEMINI.md` and `.github/copilot-instructions.md` to `AGENTS.md`.
      - id: work:discipline-step/adoption/move-harness-skills
        name: Move harness skills
        statement: >-
          Move each hand-written skill the repository keeps under `.agents/` or another harness
          directory to `.claude/skills/`. The render compiles that directory, with the inherited
          skills, into `.meta/.apm/skills/` and `.agents/`, and `.gitignore` ignores `.agents/` as
          compiled output, so a skill left there is lost.
      - id: work:discipline-step/adoption/record-the-adoption
        name: Record the adoption
        statement: >-
          Write DR-001 as the decision to adopt: it says the repository was adopted rather than
          specialized, and records starting a new repository as the alternative rejected,
          because the product's history is worth keeping.
      - id: work:discipline-step/adoption/write-the-assertions
        name: Write the assertions
        statement: >-
          In `.meta/assertions/structure.yaml`, declare the product as a Project. A product at
          the repository's root is declared with `name: .` (DR-303). Give the Project its `gate`
          and, before the first gate, name its LinkML schemas in `schemas`, so that prose about
          the product's own schema slots is checked against them (DR-304). Declare a Product only
          once it has a primary Persona; until then, declare Projects only. List the product's
          domain terms that share a label with an inherited term, and mark each as confusable in
          both directions in `domain_vocabulary.yaml`.
      - id: work:discipline-step/adoption/write-the-products-gate
        name: Write the product's gate
        statement: >-
          Write the command the Project's `gate` names. It wraps the product's build and tests
          and prints each step as Article 21 shapes it, reporting `?` for a step that cannot run,
          such as one that needs a database or Docker the seat's sandbox lacks. It must run in the
          loop's worktree, which has no `.venv`, so it installs what it needs itself, for example
          with `uv run --with-requirements`. Pin the interpreter with `--python` where a
          requirement does not build on `uv`'s default. The worktree sits at `worktrees/pair`,
          inside the repository's tree, so keep every product tool that walks the tree out of it:
          pytest, for one, needs `testpaths` set, or it collects the worktree's copy of the
          tests.
      - id: work:discipline-step/adoption/render-baseline-and-check
        name: Render, baseline and check
        statement: >-
          Run `just render`, then the gate. Existing code fails the comment, suppression and size
          ratchets on its first gate. Record what it already has in `.meta/baselines/`, which no
          sync touches, and never in the baselines beside the checks, which every sync replaces
          (DR-314). Both green before going on.
      - id: work:discipline-step/adoption/confirm-scaffold-only-paths-absent
        name: Confirm scaffold-only paths absent
        statement: >-
          Confirm that `SPECIALIZE.md`, `ADOPT.md`, `template/`, `bootstraps/`, `pair/`,
          `.meta/adapt.py`, `.meta/lib/adapt/` and `.meta/checks/probes/tools/test_brownfield.py`
          are absent, as for a specialized portfolio (DR-305).
      - id: work:discipline-step/adoption/commit
        name: Commit
        statement: >-
          All changes verified, commit the adoption under the author's own credential. The
          repository's Issues then land through the pair loop, run from the checkout with
          `uv run --script <checkout>/pair/pair.py run`.
    produces:
      - An adopted repository, with its own history and product, holding the bundle and its own assertions.
