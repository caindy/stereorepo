# solorepo's own Disciplines: ones a portfolio does not inherit because it
# cannot perform them. A portfolio specializes nothing.
#
# Everything a portfolio does inherit is in imported/.

disciplines:
  - id: work:discipline/specialization
    name: Specialization
    description: >-
      Turning this scaffold into a new portfolio repo. Done once, by an agent
      following these steps, and never again in that repo.
    judgement: >-
      Which of the inherited terms this portfolio actually needs, who its
      stakeholders really are, and what its domain calls things. None of it is
      derivable from the scaffold, which is why this is a procedure to follow
      rather than a program to run.
    steps:
      - >-
        Start a new empty repo. Copy only what the steps below name — never
        clone, and never copy the whole tree: a clone carries the scaffold's
        commit history and an `origin` pointing back at it, and neither belongs
        to a portfolio.
      - >-
        Copy what is inherited — `.meta/work/`, `.meta/ddd/`, `.meta/work_ontology.yaml`, `.meta/ddd_ontology.yaml`,
        `.meta/render.py`, `.meta/check.py`, `.meta/check_pr.py`, `.meta/lib/` (solorepo's DR-217), `.meta/apm_compile.py`, `.meta/agents.py` (solorepo's DR-191), `.meta/dereference.py`, `.meta/depth.py` (solorepo's DR-188), `.meta/gate`, `.meta/next.py`, `.meta/search.py` (solorepo's DR-194), `.meta/timing.py`, `.meta/wikisplain.py` (solorepo's DR-187), `.meta/terms.py` (solorepo's DR-234), `.meta/bootstrap.py` (solorepo's DR-206), `.meta/ruff.toml`, `.meta/mypy.ini`, `.meta/actions/`, `.meta/say/`,
        `.meta/hooks/`, `.meta/checks/`, `.claude/settings.json`, `.meta/assertions/imported/`,
        `.meta/.apm/`, `.meta/principles.md`, `.meta/schemas.md`,
        `.meta/templates/`, `.meta/arc/Dockerfile`, `.github/workflows/coder.yml`,
        `.github/workflows/review.yml`, `.meta/detect_fallback.py` (solorepo's DR-240), `.github/workflows/triage.yml` (solorepo's DR-230), `.github/workflows/merge.yml`, `.github/workflows/advance.yml`,
        `wiki/solorepo/` (solorepo's DR-184), `stakeholders/` and `.gitignore`. The channel, its hooks and the
        settings that register them travel with the loop workflows rather than
        after them: every instruction those five give is typed as a program of `.meta/say/`,
        most of `check.py`'s {#prechecks} prechecks load the channel or a hook, and
        `.claude/settings.json` is the one place the hook is invoked and the
        unsigned `gh` verbs denied (DR-069) — a hook file that nothing invokes
        is the channel as a rule to remember, which is what it exists not to be.
        The schemas and the channel stay in this copy set rather than riding inside APM
        skills (DR-173). A portfolio without them has a coder that cannot commit, a gate that
        cannot run its own first steps, and a channel nothing enforces. The Gemini fallback
        (`.meta/detect_fallback.py`) travels with `coder.yml` and `review.yml`: it defaults
        to disabled (`'false'`) to prevent unexpected pay-as-you-go billing against
        `GEMINI_API_KEY` (solorepo's DR-240), and setting repository variable `vars.GEMINI_FALLBACK`
        to `'true'` re-enables it when multi-vendor recovery is desired. Not the
        generated pages, and not the
        two Issue forms or the pull request form; step five writes all of those
        from the templates. Not the gate workflow either: solorepo's runs the
        Bootstrap seeds, which a portfolio has not got, and step three writes a
        portfolio's own, whose one gate job runs `.meta/gate` over the Projects
        its assertions declare (DR-115). Then retarget `runs-on:` in every
        workflow this step copies: each of them names `arc-runner-set`, a
        self-hosted scale set that exists on the scaffold's own machine
        (DR-137, DR-140), and none of what stands one up is copied. A job whose
        label no runner offers does not fail — it queues, so the loops never
        start and an armed merge goes behind with nobody left to notice (#93),
        which is quieter than a job that goes red. `runs-on: ubuntu-latest` with
        `container: ghcr.io/caindy/solorepo-runner:2.337.0-2` is the answer
        unless this portfolio stands up a scale set of its own (DR-160).
        The image is public on GHCR so workflows pull without credentials,
        pre-bakes the single-source CLI toolchain alongside the base image's
        `python3` (`Python 3.12.3`), and `.meta/arc/Dockerfile` copied above
        gives the portfolio the recipe to rebuild, customize, or bump the image.
      - >-
        Copy every file under `template/` to its matching path, then link
        `CLAUDE.md` and `GEMINI.md` to `AGENTS.md`. These are the replacements:
        the files that must carry none of the scaffold's content.
      - >-
        Fill in every placeholder, and write the portfolio's own assertions —
        its Portfolio, Products and Projects; its Personas, once there is
        research to draw them from; its Bounded Context and the words its domain
        experts actually use. When asserting Projects in `assertions/structure.yaml`,
        optionally declare `critical_paths` (globs for security boundaries,
        public contracts, or migrations) to route changes on them to deep reviewer
        auditing under the 4-layer template method pipeline (solorepo's DR-188).
        If the portfolio requires dynamic heuristics (such as AST inspections,
        complexity thresholds, or sensitive metadata), provide an executable hook at
        `.meta/hooks/depth.py` implementing `evaluate_depth(pr_meta, files, diff_patch)`
        (an annotated example sits at `.meta/hooks/depth.py.example`).
      - >-
        Choose the languages the portfolio will use, from those solorepo's `bootstraps/`
        supports, and bring them to hand: running `just bootstrap <lang> <path>`
        instantiates a seed project and registers it in `assertions/structure.yaml` (solorepo's DR-206).
        Language adoption can happen now or be deferred to any point in the portfolio lifecycle.
      - >-
        Re-render, then run the gate. It fails on any placeholder left behind, so
        run it before removing anything. Both green before going on.
      - >-
        Confirm `SPECIALIZE.md` and `template/` are absent. A portfolio
        specializes nothing, and leaving either invites someone to run this twice.
      - Commit.
    produces:
      - A portfolio repo, with its own history and nothing of the scaffold's.
