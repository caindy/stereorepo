# An armed merge, kept current with the branch it is waiting to land on
# (solorepo's DR-113).
#
# `main`'s ruleset requires a pull request to be up to date before it merges,
# and an armed merge does not update its own branch. So the first of two green
# pull requests lands and the second goes behind, armed, waiting for a Job that
# ended when it armed — with nobody left to notice (solorepo's #93).
# A push to `main` is the only thing that puts a pull request in that state,
# so it is the event this runs on: no clock, and no interval to be stuck inside.
# It advances approved or armed branches, including linked stacks through GitHub's
# bottom-up stack rebase operation (solorepo's DR-161, solorepo's DR-243).
#
# A file of its own rather than a job in `gate.yml`. This holds a credential
# and the gate holds none; and on a `pull_request` event GitHub runs a workflow
# from the pull request's own ref, so a token named in the gate would be a
# token a pull request could rewrite the surroundings of. Nothing but a push to
# `main` runs this file, and a push to `main` has already merged.
name: advance

# One at a time. Two pushes to `main` in quick succession are two runs that
# would rebase the same branches; queued, the second sees what the first did.
concurrency:
  group: advance
  cancel-in-progress: false

on:
  push:
    branches: [main]

# The workflow's own token reads. The update goes through the coder's
# credential, so what GitHub records is the Role and not the workflow — and a
# push made by the workflow's token would start no checks, which is the whole
# point of moving the branch. pull-requests: write permits managing in-place
# failure notices on branches that cannot advance (solorepo's DR-255).
permissions:
  contents: read
  pull-requests: write

jobs:
  advance:
    name: advance
    # The self-hosted scale set (solorepo's DR-140). Nothing here is a required
    # check, but an armed merge that never advances is the same stall by
    # another route, and the hosted minutes this used to spend are the ones
    # solorepo's DR-140 stopped depending on.
    runs-on: arc-runner-set
    steps:
      # The stack transition fetches and force-with-lease pushes every affected
      # branch. `persist-credentials` stays false so the explicit Role setup
      # below, rather than the checkout action, provides that credential.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `.meta/say/channel.py` shells out to `gh` for every read and write, and
      # the scale set's image does not carry it (solorepo's DR-137); the step
      # is a `type -p` on any image that does.
      - uses: ./.meta/actions/gh

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, solorepo's DR-107): outside the tree, mode 600, one token in the
      # container. Installs the gh-stack extension per machine (solorepo's DR-100) and
      # configures git authentication for stack push operations (solorepo's DR-243).
      - name: hold the coder's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          gh stack --help >/dev/null || gh extension install github/gh-stack
          GH_TOKEN="$CODER_GH_TOKEN" gh auth setup-git
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}

      # Attested session and agent identity so `move advance` can post and reconcile
      # in-place advance finding notices on failing pull requests under solorepo's
      # Article 19, solorepo's DR-233, and solorepo's DR-255.
      - run: .meta/say/move advance
        env:
          ACTOR_SESSION: gha-${{ github.run_id }}
          ACTOR_AGENT: gha/advance
          AI_AGENT: gha/advance
