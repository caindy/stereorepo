# The harness tools, run against the live tree and the whole of its history.
#
# `.meta/dereference.py` and `.meta/terms.py` are the two developer command
# line tools whose full scopes nothing else executes. The gate's `dereference
# probes` and `terms probes` once reached them as a side effect of testing
# report formatting; solorepo's #732 scoped both probes down to synthetic
# fixtures to take ~35s out of every gate run, answering solorepo's #728, and
# with that went the last automated run of `scope()` over the real durable set
# and of `load_corpus()` over a real git tree. The repository-integrity checks
# (`meta/cited decisions`, `meta/enacting citations`, `meta/ubiquitous
# language wiki parity`) cover the same data but implement their own scanning
# and import neither tool, so a regression in either tool's full scope has no
# automated reader at all.
#
# This is that reader, on the clock and off the interactive gate's path, which
# is the shape `test-specialization.yml` already holds: weekly, dispatchable,
# and nothing a pull request waits on.
#
# The dereference runs ask `--pairs`, which is the deterministic half: it
# builds every pair over the whole durable set and prints them without asking
# a model. That is where the uncovered code is. The asking half runs on every
# coder branch already, through `just dereference` at hand-off (solorepo's
# DR-134).
#
# A failure here files a Challenge rather than waiting to be found in a run
# listing. The title is fixed so that `move file`'s own duplicate refusal
# (solorepo's DR-221) bounds a repeatedly failing job to one open Issue, which
# is the spam solorepo's #554 names; the body says which invocation failed and
# links the run. The filing carries no level, because the channel refuses a run
# every level but `human` (solorepo's DR-235), so the reviewer's triage door
# reads it and the verdict lands the label (solorepo's DR-230) — which is also
# what puts it under `ripe` for a coder loop to claim.
name: test-tools

on:
  schedule:
    # An hour after `test-specialization`, so the two weekly jobs do not
    # contend for the scale set.
    - cron: '0 5 * * 1'
  workflow_dispatch:

# The workflow's own token reads. The filing goes through the coder's
# credential, so what GitHub records is the Role and not the workflow.
permissions:
  contents: read
  issues: read

env:
  # How many trees out of the history the terminology run reads. Sampled at an
  # even stride rather than taken from the tip, so the trees it sees differ in
  # shape as widely as the history does, and so the job's cost stays flat as
  # the history grows. A history shorter than this reads every tree it has,
  # which is what the `stride < 2` arm of the sampler is for: `NR % 1` is zero
  # for every line and would otherwise select none.
  TREES: '5'
  # One title for every failure of this job, which is what makes the duplicate
  # refusal bind.
  TITLE: Full-tree harness tool stress test failed

jobs:
  test-tools:
    name: test-tools
    runs-on: arc-runner-set
    steps:
      # The whole history, because the terminology runs below read trees out
      # of it by `git show`, which a shallow checkout has nothing to answer
      # with.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.meta/actions/gh

      - name: Run the tools over the tree and its history
        id: stress
        run: |
          : > "$RUNNER_TEMP/failures.md"
          attempt() {
            printf '\n=== %s\n' "$*"
            "$@" || printf -- '- `%s`\n' "$*" >> "$RUNNER_TEMP/failures.md"
          }
          attempt just dereference --all --pairs
          attempt just dereference --sample 10 --pairs
          attempt just terms
          git rev-list HEAD > "$RUNNER_TEMP/history"
          stride=$(( $(wc -l < "$RUNNER_TEMP/history") / TREES + 1 ))
          awk -v stride="$stride" 'stride < 2 || NR % stride == 1' "$RUNNER_TEMP/history" > "$RUNNER_TEMP/trees"
          while read -r tree; do
            attempt just terms --commit "$tree"
          done < "$RUNNER_TEMP/trees"
          cat "$RUNNER_TEMP/failures.md"
          [ ! -s "$RUNNER_TEMP/failures.md" ]

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, solorepo's DR-107): outside the tree, mode 600, one
      # token in the container.
      - name: Hold the coder's credential
        id: credential
        if: failure() && steps.stress.outcome == 'failure'
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}

      # Conditioned on the credential, because `role_credential()` returns `{}`
      # for a missing `coder.env` and `channel.gh` then speaks with whatever
      # `GH_TOKEN` the environment holds: an unset or rotated secret would file
      # under the workflow's own token, which `permissions:` above grants no
      # write. So the probe below takes that token on its own command line and
      # nowhere else, and a missing secret shows as a skipped step.
      - name: File a Challenge for what failed
        if: failure() && steps.stress.outcome == 'failure' && steps.credential.outcome == 'success'
        run: |
          standing=$(GH_TOKEN="$WORKFLOW_TOKEN" gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg title "$TITLE" '[.[] | select(.title == $title) | .number] | first // empty')
          if [ -n "$standing" ]; then
            echo "#$standing is open under this title already; this run files nothing"
            exit 0
          fi
          {
            printf '%s\n\n' '**Waits on.** Nothing.'
            printf '%s\n' '**What was noticed.**'
            printf '%s\n\n' 'The weekly `test-tools` run of the harness tools over the live tree and its history failed.'
            # An abort outside `attempt` — the history listing, the stride
            # arithmetic, the `awk` redirect — leaves the file at the zero
            # length it was created with. Unguarded, the first such run files a
            # Challenge naming no invocation, and the fixed title then suppresses
            # every informative filing behind it.
            if [ -s "$RUNNER_TEMP/failures.md" ]; then
              printf '%s\n\n' 'These invocations exited non-zero:'
              cat "$RUNNER_TEMP/failures.md"
            else
              printf '%s\n' 'The step aborted before it could record which invocation failed: what failed was outside the `attempt` wrapper, so the run log is the only account of it.'
            fi
            printf '\nThe run and its log: %s\n\n' "$RUN"
            printf '%s\n' '**What would make this worth doing.**'
            printf '%s\n' 'Either `.meta/dereference.py` or `.meta/terms.py` regressed, or trunk drifted into a shape one of them cannot read. Both land on the next coder to run `just dereference` or `just terms`, and neither clears itself.'
            printf '\n'
            printf '%s\n' '**Where it was found.**'
            printf '%s\n' 'The `test-tools` workflow. It was added by #762, the change that put these two tools on a weekly clock, to cover the full scopes that #732 took out of the gate when it scoped the `dereference probes` and `terms probes` down to synthetic fixtures.'
            printf '\n'
            printf '%s\n' '**Difficulty.** `medium`'
          } > "$RUNNER_TEMP/challenge.md"
          .meta/say/move file --title "$TITLE" < "$RUNNER_TEMP/challenge.md"
        env:
          WORKFLOW_TOKEN: ${{ github.token }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
