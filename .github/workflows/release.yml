# Publishes a versioned APM package release on GitHub (solorepo's DR-206).
#
# Triggered when a semantic version tag (`v*`) is pushed, or on manual
# workflow dispatch. Verifies repository integrity and APM package conformance
# before creating the release, giving downstream specialized portfolios an
# explicit, verifiable signal to update their cognitive layer via `apm update`.
name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: release-apm-package
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.meta/actions/gh

      - name: Ensure APM CLI is available
        run: |
          set -euo pipefail
          if ! command -v apm >/dev/null 2>&1; then
            echo "Installing APM CLI..."
            curl -fsSL https://aka.ms/apm-unix | sh
            echo "$HOME/.apm/bin" >> $GITHUB_PATH
          fi

      - name: Run Full Gate Verification
        run: |
          export PATH="$HOME/.apm/bin:$PATH"
          .meta/gate

      - name: Validate APM Package Conformance
        run: |
          export PATH="$HOME/.apm/bin:$PATH"
          python3 .meta/apm_compile.py validate

      - name: Dogfood Specialization End-to-End
        run: |
          python3 .meta/dogfood.py

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-v0.1.0}"
          echo "Publishing GitHub Release for ${TAG}..."
          gh release create "$TAG" \
            --title "solorepo ${TAG}" \
            --generate-notes \
            --verify-tag
