# Automated Specialization end-to-end verification audit (solorepo's DR-239, solorepo's DR-244).
#
# Runs weekly on schedule and on manual workflow dispatch, verifying that
# the 8-step Specialization discipline executes hermetically end-to-end
# against pre-judged portfolio fixtures.
name: test-specialization

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-specialization:
    name: test-specialization
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.meta/actions/gh

      - name: Verify Specialization End-to-End
        run: |
          just test-specialization
