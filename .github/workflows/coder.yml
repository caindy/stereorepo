# The coder Role, taking an Issue by its difficulty label (solorepo's DR-112).
#
# An Issue labelled `easy` or `medium` is a Challenge somebody has guessed a
# loop can take. This is the loop. It runs where the label lands, in a
# container that holds one token — the coder's — claims the Issue, does the
# work under the Disciplines, and leaves a pull request that can be merged:
# gate green, branch pushed, body filled, what landed posted, merge armed,
# and for `medium` a review requested first. What it cannot finish it hands
# to the solo by relabelling `human` and saying why.
#
# Three passes, and the trigger says which: an Issue taken, a request for
# changes answered, and a branch rebased back to where its outstanding review
# can be answered at all (solorepo's DR-133). The last has no event of its own
# and is dispatched by `.meta/say/move advance` on the merge that caused it.
#
# Nothing here restates how to work. `AGENTS.md`, the Disciplines and the two
# forms are the checkout's; this file decides when the coder runs, as whom it
# speaks, and how deep it goes. The coder must write, so its allowance is a
# coder's, and the bound on it is the ruleset, the gate and review rather than
# the reviewer's reading hook.
name: coder

on:
  issues:
    types: [labeled]
  # The reviewer's request for changes is the coder's second run: solorepo's DR-112
  # promised it and solorepo's #102 sat with a verdict and no Job to take it. The
  # dispatch runs that pass by hand, for a verdict the event passed by — and
  # `task` chooses which pass, because the other one has no event of its own:
  # a merge on `main` that leaves a waiting review request unanswerable is
  # dispatched here by `.meta/say/move advance` (solorepo's DR-133), and what it
  # needs done is a rebase and not an answer to threads that do not exist.
  # On this event, as on `pull_request`, GitHub's "Events that trigger
  # workflows" table gives `GITHUB_SHA` as "Last merge commit on the
  # `GITHUB_REF` branch" and `GITHUB_REF` as "PR merge branch
  # `refs/pull/PULL_REQUEST_NUMBER/merge`", so the run reads this file from
  # the pull request's own merge ref, and a change to the door below is in
  # force on the first verdict of the pull request that makes it.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: the pull request the coder is dispatched for
        required: true
      task:
        description: what the coder is dispatched to do
        type: choice
        options: [review, rebase]
        default: review

# One run per Issue or per pull request at a time. A second label on the
# same Issue, or a second verdict on the same pull request, waits rather than
# starting a second branch. The review's state is in the key because every
# reply on a thread is a submitted review too — an empty one, `commented` —
# and GitHub keeps one pending run per group: keyed by number alone, a reply
# arriving while a run is in progress cancels the pending verdict behind it
# and leaves a run that skips, which is how solorepo's #141's verdict would have gone
# the way solorepo's #102's did. Keyed by state, a `commented` event can cancel only
# another `commented`, which was going to skip anyway. A dispatch is the
# by-hand form of a verdict, so it takes the verdict's key and waits behind
# one rather than running beside it.
#
# A rebase dispatch takes a key of its own, and the key is what stands in for
# the read-back `advance` cannot make: GitHub answers a dispatch with no
# content and creates the run afterwards, so the dispatcher cannot ask whether
# one is already going. Here it does not have to. Two merges on `main` in quick
# succession dispatch twice, and this group leaves one run standing and one
# waiting rather than two rebasing the same branch; a third cancels the one
# waiting. What the survivor finds is a branch already current with its base,
# which the pass is told to leave alone.
concurrency:
  group: coder-${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request }}-${{ github.event.review.state || (inputs.task == 'rebase' && 'rebase') || (inputs.pull_request && 'changes_requested') || 'take' }}
  cancel-in-progress: false

# The workflow's own token reads. Every write goes through the coder's
# credential, so what GitHub records is the Role and not the workflow.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  coder:
    name: coder
    # Only a difficulty a loop takes, on a Challenge: `hard` and `human` are
    # not this Job's, and a `roadmap` Issue is deferred by definition. Or the
    # reviewer's account requesting changes on a branch named for a Challenge
    # — the prefix says which Issue, not whose the branch is; `is it taken
    # already` below reads whose it is, on this door as on the first
    # (solorepo's DR-142). Or the solo dispatching that second pass by hand.
    if: >-
      (github.event_name == 'issues'
        && github.event.issue.state == 'open'
        && (github.event.label.name == 'easy' || github.event.label.name == 'medium')
        && contains(github.event.issue.labels.*.name, 'challenge'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.state == 'changes_requested'
        && github.event.review.user.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)
        && startsWith(github.event.pull_request.head.ref, 'claude/issue-'))
      || github.event_name == 'workflow_dispatch'
    # The self-hosted scale set (solorepo's DR-137): this Job is what actually
    # spends GitHub Actions minutes, holding a runner for up to the timeout
    # below on every Issue and review. It moved here first, ahead of
    # `gate.yml`'s required checks, which followed under solorepo's DR-140.
    runs-on: arc-runner-set
    timeout-minutes: 75
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # pinned below, recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
      AI_AGENT: anthropics/claude-code-action@v1
    steps:
      # Full history so the coder can read what was already true, and no
      # token in `.git/config` from the checkout: the action writes the
      # coder's own for the push.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `ubuntu-latest` ships `gh` and `jq`; the self-hosted image (solorepo's DR-137)
      # ships neither, and this file uses both throughout —
      # `.meta/say/channel.py` shells out to `gh` for every read and write,
      # and a dozen steps below pipe its JSON through `jq`. `review.yml`'s own
      # run on this pull request's self-hosted pod is evidence for `gh` alone:
      # its one JSON read is `gh`'s own `--jq` filter, not the standalone tool.
      - uses: ./.meta/actions/gh

      - name: install jq
        run: |
          set -euo pipefail
          type -p jq >/dev/null || sudo apt-get install -y jq
          jq --version

      # `gate.yml` provisions `uv` because `ubuntu-latest` never carries it
      # either (gate.yml:70, :109); this file needs it for the same reason
      # `.meta/gate` and `just dereference` do, both `uvx` underneath.
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: false

      # `just` itself, not only `uv`: the prompts below type `just
      # dereference` literally, and `uvx --from rust-just just` is the
      # justfile's own fallback for a session that has to spell it out, not
      # a substitute for the command actually being on PATH. Pinned like the
      # Helm charts in `.meta/arc/deploy` and for the same reason: `--tag`
      # exists so an upgrade is an edit to this line, not whichever build the
      # network hands back today. A one-line `run:` gets the same default
      # `bash -e {0}` the `gh`/`jq` step guards explicitly — `set -euo
      # pipefail` here too, or a `curl` that fails leaves `sudo bash`
      # reading EOF, doing nothing, and exiting 0: a green step with no
      # `just` on PATH.
      - name: install just
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh \
            | sudo bash -s -- --tag 1.58.0 --to /usr/local/bin
          just --version

      # Which pull request a second pass answers: the event's, or the
      # dispatch's. Its branch is checked out below so the work continues
      # where the first pass left it. The base is read too, and not assumed to
      # be `main`: a layer is based on the layer below (PR First's twelfth
      # step), and a rebase of a layer onto trunk while that layer is open
      # drops the lower layer's commits off the head. So is the Challenge,
      # which is the branch's own name — `claude/issue-<n>` is the only shape
      # `advance` dispatches — because a pass that cannot finish hands that
      # Challenge back and has nothing else to name.
      - name: find the pull request
        id: pr
        if: github.event_name != 'issues'
        run: |
          n="${EVENT_PR:-$INPUT_PR}"
          pull=$(gh pr view "$n" --json headRefName,baseRefName)
          branch=$(jq -r .headRefName <<<"$pull")
          base=$(jq -r .baseRefName <<<"$pull")
          case "$branch" in claude/issue-*) issue=${branch#claude/issue-} ;; *) issue= ;; esac
          if [ "$TASK" = rebase ] && [ -z "$issue" ]; then
            echo "::error::#$n is on $branch, which names no Challenge, so a rebase pass that could not finish would have nothing to hand back. Rebase it by hand."
            exit 1
          fi
          printf 'number=%s\nbranch=%s\nbase=%s\nissue=%s\n' \
            "$n" "$branch" "$base" "$issue" >> "$GITHUB_OUTPUT"
          git checkout --quiet "$branch"
          cat "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pull_request }}
          TASK: ${{ inputs.task }}

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, DR-107): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the coder's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}

      # The model credential, on the same terms and for a harder reason
      # (solorepo's DR-134). `dereference` asks through the `claude` on PATH,
      # and a nested run authenticates from its environment — which the agent's
      # shell does not inherit from this workflow. Run 34484811464 settles it:
      # GitHub's own log for that step lists `CLAUDE_CODE_OAUTH_TOKEN`
      # alongside `ACTOR_SESSION` and `AI_AGENT` in the step's `env:`, and a
      # probe inside the same step printed `token set: no` and `claude`
      # answered `Not logged in`. So the action does not hand the workflow's
      # environment to the shell it gives the agent, and no `env:` block at any
      # level reaches it. A file does, which is why the Role's credential is
      # one and not a variable: the same probe found `coder.env` in the
      # container. Absent this step the reading falls through to ambient auth,
      # says so, and every pair comes back `?` — loud, and deciding nothing.
      - name: hold the model credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/claude.env
          printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$MODEL_TOKEN" > ~/.config/solorepo/claude.env
        env:
          MODEL_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # One run per Challenge. A label supplied at creation fires `labeled`
      # like any other — GitHub's workflow reference: an Issue opened with two
      # labels starts three runs, one `opened` and two `labeled` — so
      # `labeled` alone is the trigger and a Challenge filed in one act is one
      # run. What can still arrive twice is a level moved under a run, and the
      # event's payload is frozen at delivery, so the job's `if` cannot see
      # what happened while the run it waited on was standing. Four facts
      # are read now, each into its own assignment so that a read which fails
      # aborts the step rather than reading as empty, and `by` carries a word
      # for every delivery that must not run, so that it is never empty by
      # accident: whether the Issue is still open, since one closed by its
      # own merge since the delivery is finished work; its *current*
      # difficulty, since a run that handed it back left it `human` and a
      # stale delivery must not take it up again; the open pull request on
      # its branch, which every taken Issue has, opened before the work and
      # left open by `say stop`; and the claim,
      # which only a run still standing holds — `say stop` releases it, and
      # the last step below hands back a run that ended at its budget without
      # saying so, so that this is true of every way a run ends. Claimed with
      # a pull request open is a duplicate, skipped and said so; a pull
      # request with no claim and a level a loop takes is a hand-back the solo
      # has answered, and the run continues under it.
      #
      # The same facts on the second door (solorepo's DR-142). A request for
      # changes names a branch, and a branch's name says which Challenge and
      # nothing about who holds it: on solorepo's #168 a run took up a `hard`
      # Issue's branch under a standing session because this step ran on the
      # first door only. The level is the fact that says whose a Challenge is
      # — `hard` is the solo's with an agent beside him, on either door — and
      # it is the one a session can move: to `hard` to take a branch from the
      # loop, back down to hand it back. The duplicate reading is the first
      # door's alone; on the second the open pull request is the event's own
      # and the claim is what a standing run looks like. A dispatch of a
      # review pass is the solo's own word and is not read against; a rebase
      # dispatch is `advance`'s on a push to `main` (solorepo's DR-133), with
      # no solo in it, and `dispatch()` in `.meta/say/move` filters on the
      # request, the branch shape, the stack and the conflict and on neither
      # the level nor the claim — so it is read against here, or the pass it
      # starts would force-push under a session and, on a conflict it could
      # not settle, `stop` the Issue from `hard` to `human`: the semaphore the
      # session set, overwritten by the run it was set to keep out.
      #
      # On those doors the Issue is read off the branch name by prefix, and
      # the job's condition admits the name by prefix too, so `claude/issue-
      # 169-followup` arrives here as `169-followup`; and an Issue can have
      # been deleted or transferred under its branch. On the first door a
      # read that fails aborts the step, and rightly: the delivery is not
      # taken and the Issue is there to be re-delivered. On the others an
      # aborted step is a red job with the verdict answered by nobody, which
      # is worse than the verdict being answered, as it was before this step
      # read anything here. So on those doors a name that is not a number,
      # or an Issue that cannot be read, is a word — the branch names no
      # Challenge the loop holds — and not a failure.
      - name: is it taken already
        id: taken
        if: github.event_name != 'workflow_dispatch' || inputs.task == 'rebase'
        run: |
          if [ "$DOOR" != issues ]; then
            case "$ISSUE" in
              ''|*[!0-9]*)
                printf 'by=unnamed\nwhy=%s\n' "on a branch that names no Challenge the loop holds" >> "$GITHUB_OUTPUT"
                echo "'$ISSUE' is not an Issue number; the branch is not the loop's shape, and this delivery is not its"
                exit 0 ;;
            esac
          fi
          open=$(gh pr list --state open --head "claude/issue-$ISSUE" --json number --jq '.[].number')
          if ! issue=$(gh issue view "$ISSUE" --json state,assignees,labels); then
            [ "$DOOR" != issues ] || exit 1
            printf 'by=unnamed\nwhy=%s\n' "not an Issue this repository can read" >> "$GITHUB_OUTPUT"
            echo "#$ISSUE cannot be read; the branch names no Challenge the loop holds, and this delivery is not its"
            exit 0
          fi
          state=$(jq -r .state <<<"$issue")
          mine=$(jq -r --arg c "$CODER" '.assignees[].login | select(. == $c)' <<<"$issue")
          level=$(jq -r '[.labels[].name | select(. == "easy" or . == "medium")][0] // ""' <<<"$issue")
          if [ "$state" != OPEN ]; then
            printf 'by=closed\nwhy=closed\n' >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is closed now; this delivery is stale"
          elif [ "$DOOR" = issues ] && [ -n "$open" ] && [ -n "$mine" ]; then
            printf 'by=%s\n' "$open" >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is claimed by $mine and has open pull request #$open; this delivery is a duplicate"
          elif jq -e '.labels[].name | select(. == "hard")' <<<"$issue" >/dev/null; then
            printf 'by=held\n' >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is hard now: the solo's, with a session beside him; this loop stands down"
          elif [ -z "$level" ]; then
            printf 'by=stale\nwhy=%s\n' "labelled $(jq -r '[.labels[].name] | join(", ")' <<<"$issue") now, which no loop takes" >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is labelled '$(jq -r '[.labels[].name] | join(", ")' <<<"$issue")' now; a Challenge at neither easy nor medium is not this loop's, on any door but the solo's own dispatch"
          else
            printf 'by=\nresume=%s\nlevel=%s\n' "$open" "$level" >> "$GITHUB_OUTPUT"
            [ -z "$open" ] || echo "#$ISSUE has open pull request #$open and no claim: a hand-back, taken up again"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          DOOR: ${{ github.event_name }}
          ISSUE: ${{ github.event.issue.number || steps.pr.outputs.issue }}
          CODER: ${{ format('{0}-{1}-coder', github.repository_owner, github.event.repository.name) }}

      # Where the loop stood down and nobody is standing there, say so on the
      # pull request. On `held` a session is, by construction, and a comment
      # under it is noise. On `closed` or `stale` — an Issue closed under an
      # open pull request, or one a run's `stop` left at `human` — the
      # request for changes would otherwise stand with no Job and no sign,
      # which is the state this file's head records solorepo's #102 as,
      # reached from the other side. The solo holds a `human` Issue until they
      # read the account `stop` posted; this is one more line of that account.
      # The verdict's door only: it is delivered once, so the comment is the
      # only trace the verdict gets. The rebase door is delivered on every
      # push to `main` while the branch conflicts, and the facts behind
      # `stale` and `closed` persist, so a sign here would be posted once per
      # merge; `dispatch()` in `.meta/say/move` reads the Issue's state and
      # level before it dispatches and names the branch it leaves alone in
      # `advance`'s own log, where the repetition costs nobody.
      - name: say the verdict has no Job
        if: github.event_name == 'pull_request_review' && (steps.taken.outputs.by == 'closed' || steps.taken.outputs.by == 'stale' || steps.taken.outputs.by == 'unnamed')
        run: |
          .meta/say/post comment "$PR" <<EOF
          No run takes this up: #$ISSUE is $WHY, so what stands on this pull request is the solo's. What decided that is in the run log, $RUN.
          EOF
        env:
          PR: ${{ steps.pr.outputs.number }}
          ISSUE: ${{ steps.pr.outputs.issue }}
          WHY: ${{ steps.taken.outputs.why }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # Depth by the label. `easy` is the smaller model and an hour at most;
      # `medium` is the larger and the whole budget. The guess is the
      # raiser's, and a wrong one costs a run before anyone relabels.
      # A rebase is bounded by what it is: one branch's commits moved onto what
      # landed under them, and whatever of that landing they collided with.
      # The larger model, because a conflict in this repository is prose as
      # often as it is code and taking the wrong side of one is how a change
      # silently loses half of itself; half the budget, because a rebase that
      # is taking an hour is not a rebase and belongs back with the solo.
      - name: choose the depth
        id: depth
        run: |
          printf 'level=%s\n' "$LEVEL" >> "$GITHUB_OUTPUT"
          if [ "$TASK" = rebase ]; then
            printf 'model=claude-opus-5\nturns=60\nminutes=30\n' >> "$GITHUB_OUTPUT"
          elif [ "$LEVEL" = medium ]; then
            printf 'model=claude-opus-5\nturns=120\nminutes=60\n' >> "$GITHUB_OUTPUT"
          else
            printf 'model=claude-sonnet-5\nturns=60\nminutes=30\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
        env:
          TASK: ${{ inputs.task }}
          # The level the guard read from the Issue now, not the one the
          # frozen delivery carried: a level moved while this run waited in
          # the concurrency group is the level the run must take (solorepo's #117). A
          # second pass is the larger model whatever the label was: the
          # threads it answers were written by the deeper reviewer.
          LEVEL: ${{ (github.event_name == 'issues' && steps.taken.outputs.level) || 'medium' }}

      - name: take the Issue
        id: take
        if: github.event_name == 'issues' && steps.taken.outputs.by == ''
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls and the push as the Role too, so
          # nothing in the run is authored by an App or a bot.
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          # The transcript, in the run log: the run is the only record of
          # what the coder did between the Issue and the pull request.
          # `gh run view <id> --log` prints this step cut off at about two
          # minutes; the whole of it is in the archive the CLI caches at
          # `~/.cache/gh/run-log-<id>-*.zip`, where `0_coder.txt` holds the
          # complete transcript and the `result` event with turns and cost
          # (solorepo's #122).
          show_full_output: "true"
          prompt: |
            You are the coder Role (solorepo's DR-107), taking Issue #${{ github.event.issue.number }}
            of ${{ github.repository }}, labelled `${{ steps.depth.outputs.level }}`.
            Read /pr-first: it is the coder's reading of PR First, and lists
            your verbs, what each does and where the judgement is; `AGENTS.md`
            has the conventions. Every act on GitHub goes through the channel,
            `.meta/say/post` to say something and `.meta/say/move` to change
            state; each verb is a step of the Discipline, takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit -m "<subject>"` and
            never `git commit`; only the channel signs.

            Claim it: `.meta/say/move claim ${{ github.event.issue.number }}`.
            Read it: `gh issue view ${{ github.event.issue.number }}`.
            Branch as `claude/issue-${{ github.event.issue.number }}` from
            `origin/main`, push at the first commit, and open the pull request
            at once with `.meta/say/move open`, the form filled and the Issue named
            under "What it closes". ${{ steps.taken.outputs.resume && format('A run before this one stopped and left pull request #{0} open on that branch: check the branch out and continue under it, and do not branch or open again.', steps.taken.outputs.resume) || 'No run has taken this Issue before.' }}
            Below, `<n>` is that pull request's number, never the Issue's;
            `revise` and `comment` take either.

            Do what the Issue asks and no more. Gate green with
            `.meta/gate meta`, commit and push as you go, `.meta/say/move revise <n>`
            when the body no longer says what the head does, and
            `just dereference` and then `.meta/say/post landed <n>` before you
            hand it over. `dereference` reads the citations this branch wrote
            against the entries they name; it is not a gate and blocks nothing,
            so answer its `x` by fixing the sentence, or by leaving it and
            saying why on the pull request (solorepo's DR-134).

            `easy`: `.meta/say/move merge <n> --auto`; green is the review.
            `medium`: `.meta/say/move request-review <n>` and stop; the reviewer
            arms the merge, and a request for changes comes back to you as a
            new run. Do either the moment the branch is pushed and the body is
            final, and do not wait for the checks (solorepo's #102).

            If you cannot finish — a decision only the solo can take, a gate
            that will not go green, work larger than it looked —
            `.meta/say/move stop ${{ github.event.issue.number }}` with why on
            stdin. It hands the Issue to the solo and leaves the pull request
            open for the run that takes it up again.

            Do not answer any thread, do not merge by hand, and do not reach
            GitHub any other way: the hook refuses `gh pr create`, `gh pr
            comment`, `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"

      # A run that ended without finishing — the step's timeout, the turn
      # limit, a crash — and without saying so has left the Issue claimed and
      # its pull request open, which is what a standing run looks like, so
      # every later delivery would read as a duplicate and the Challenge
      # would be unreachable except by hand. The exit status alone cannot say
      # that: a run that finished its work and then sat waiting on the checks
      # (solorepo's #102) ends the same way, and so does one that ran `say stop` itself
      # and then ran out. So this asks what a finished run leaves. Two of the
      # witnesses live on an *open* pull request — a review requested for
      # `medium`, the merge armed for `easy` — and for `easy` the arming is
      # not a resting state but an instruction GitHub carries out: when it is,
      # the pull request closes, the Challenge closes with it, and both
      # witnesses go with them (solorepo's #117). The facts that survive that are the
      # Issue's `state`, which the guard above already reads for the same
      # reason, and the merge on this branch, which says the work landed even
      # where no closing keyword closed the Issue. A run that stopped itself
      # left the level at `human`. On any of those there is nothing to hand
      # back, and an account written from the exit status would be false.
      #
      # Otherwise the hand-back is the act the run would have performed,
      # through the same verb — and which act that is depends on what the run
      # left behind (solorepo's DR-129). A pull request open with every check
      # green is work a reviewer can read, and the run died one step short of
      # asking. Handing only the Issue to the solo hands the pull request to
      # nobody, and nothing picks it up: a Job finds its work by asking what
      # has been requested of its login, and no event fires to ask again. So a
      # green one is requested of the reviewer, whatever the level — the merge
      # is never armed here, because arming says the work is finished and a
      # budget death says the opposite, and `easy`'s "green is the review"
      # reads a green gate on work a run declared done. Green is not enough on
      # its own: GitHub builds no merge ref for a branch it reports as
      # `CONFLICTING`, `review.yml` triggers on `pull_request`, so a request
      # made on one creates no run and is answered by nobody — which is the
      # state this step exists to prevent, reached by the step itself. The
      # branch a run was cut from can conflict by the time it dies, because
      # anything merging into its base while the run lasts can do it. Anything
      # else — no pull request, a red gate, checks that have not answered yet,
      # or a branch that conflicts — goes to the solo through `stop`, because
      # a red gate is not a handoff by PR First's own rule and a branch nobody
      # can review is the solo's for the same reason. `stop` puts the
      # Challenge at `human`, and the sweep skips `human` on purpose, so that
      # is where it rests: the solo holds it until they read the account
      # `stop` posted, and one whose checks go green a minute later is not
      # picked up by anything. The account is posted on the pull request
      # before the request
      # is made, in the order `stop` uses and for the same reason: the request
      # is the handoff and carries no words, so the one thing the reviewer
      # cannot otherwise know — that this branch is where a run stopped, not
      # where it finished — has to be on the pull request, which is all an
      # arriving Job reads.
      - name: hand back what the run did not finish
        if: >-
          always() && github.event_name == 'issues' && steps.taken.outputs.by == ''
          && steps.take.outcome != 'success' && steps.take.outcome != 'skipped'
        run: |
          issue=$(gh issue view "$ISSUE" --json state,labels)
          state=$(jq -r .state <<<"$issue")
          level=$(jq -r '[.labels[].name | select(. == "easy" or . == "medium" or . == "hard" or . == "human")][0] // ""' <<<"$issue")
          open=$(gh pr list --state open --head "claude/issue-$ISSUE" \
                 --json number,baseRefName,reviewRequests,autoMergeRequest,mergeable,statusCheckRollup)
          handed=$(jq -r '.[] | ((.reviewRequests | length) > 0) or (.autoMergeRequest != null)' <<<"$open")
          number=$(jq -r '.[0].number // empty' <<<"$open")
          # A branch GitHub cannot merge is one it builds no merge ref for, so
          # `review.yml`'s `pull_request` trigger has nothing to check out and
          # a request on it is answered by nobody. Only `CONFLICTING` is read:
          # `UNKNOWN` is GitHub still computing, and refusing the handoff on
          # that would refuse it on timing. The rebase named below is onto the
          # pull request's own base, which is not always `main`: a layer is
          # based on the layer below (PR First's twelfth step), its branch is a
          # `claude/issue-<n>` one like any other, and rebasing it onto trunk
          # while that layer is open drops the lower layer's commits off the
          # head.
          conflicting=$(jq -r '.[0].mergeable == "CONFLICTING"' <<<"$open")
          base=$(jq -r '.[0].baseRefName // "main"' <<<"$open")
          # Every check on the head has concluded and none of them failed. A
          # check still running reports its conclusion as the empty string
          # rather than as null, so `//` does not reach past it and the status
          # is read explicitly; pending is not green either way.
          green=$(jq -r '[.[0].statusCheckRollup[]?
                          | if (.conclusion // "") == "" then (.state // .status // "PENDING")
                            else .conclusion end] as $s
                         | ($s | length) > 0
                           and all($s[]; . == "SUCCESS" or . == "NEUTRAL" or . == "SKIPPED")' <<<"$open")
          merged=$(gh pr list --state merged --head "claude/issue-$ISSUE" --json number --jq '.[0].number // empty')
          if [ "$state" != OPEN ]; then
            echo "#$ISSUE is closed; a Challenge GitHub has closed has nothing to hand back"
          elif [ -n "$merged" ]; then
            echo "#$ISSUE's pull request #$merged has merged; the run finished and then ran out"
          elif [ "$level" = human ]; then
            echo "#$ISSUE is already at human; the run handed it back itself"
          elif [ "$handed" = true ]; then
            echo "#$ISSUE's pull request has its review requested or its merge armed; the run finished and then ran out"
          elif [ -n "$number" ] && [ "$green" = true ] && [ "$conflicting" != true ]; then
            .meta/say/post comment "$number" <<EOF
          This run ended at its budget without finishing and without saying where it stopped: its step ended $OUTCOME. What it did is in the run log, $RUN.

          Every check on this head is green, so this is where a run stopped and not where one finished, and review is requested on that basis: what is here is worth reading, and whether it answers #$ISSUE is the review's question. #$ISSUE stays claimed at \`$level\`, and a request for changes comes back to the coder as a new run.
          EOF
            .meta/say/move request-review "$number"
          else
            if [ -z "$number" ]; then
              why="the run opened no pull request"
            elif [ "$conflicting" = true ]; then
              why="#$number's branch conflicts with its base, $base. GitHub builds no merge ref for one that does, review.yml runs on pull_request, and so a review requested on it would create no run and be answered by nobody. Rebase claude/issue-$ISSUE onto $base and the request can be made"
            else
              why="the checks on #$number have not all passed, and a red gate is not a handoff"
            fi
            .meta/say/move stop "$ISSUE" <<EOF
          This run ended at its budget without finishing and without saying where it stopped: its step ended $OUTCOME. What it did is in the run log, $RUN. The pull request it opened, if it opened one, is on \`claude/issue-$ISSUE\` and stays open for the run that takes this up again.

          Not requested of the reviewer: $why.
          EOF
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.take.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      # The pass a merge on `main` dispatches (solorepo's DR-133). Nothing here
      # is a verdict to answer: what the pull request is waiting on is a review
      # nobody can run or a merge GitHub cannot make, and both wait on the same
      # thing — the branch moved onto what landed under it, which is the one
      # thing no workflow can do for it. `gh pr update-branch` is refused on a
      # conflicting branch, and a conflict is the change made again over what
      # landed. A review request outstanding has never been answerable, because
      # GitHub builds no merge ref for a branch that conflicts and `review.yml`
      # runs on `pull_request`; an armed merge is refused for the conflict on
      # every push to trunk (solorepo's DR-149). The push at the end is the
      # whole handoff, and what it hands over is whichever of the two the pull
      # request was waiting on: the `synchronize` that finally starts the
      # review, or the merge when green — which is why the pass reads the
      # arming back across its own force-push and restores what the push
      # dropped, an arming being the one semaphore no later sweep can recover
      # (solorepo's #93).
      - name: rebase onto the base
        if: inputs.task == 'rebase' && steps.taken.outputs.by == ''
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          show_full_output: "true"
          prompt: |
            You are the coder Role (solorepo's DR-107), on pull request
            #${{ steps.pr.outputs.number }} of ${{ github.repository }}, whose
            branch `${{ steps.pr.outputs.branch }}` is checked out here. A
            merge on `${{ steps.pr.outputs.base }}` has left it conflicting
            while it was waiting to land — on a review requested of somebody,
            or on the arming that says it merges when green, or on both — and
            GitHub neither builds a merge ref for a branch that conflicts nor
            will update one, so neither wait can end. Your Job is to put the
            branch back where what it is waiting on can happen, and nothing
            else.

            Where a review is outstanding, no review of this head can run, so
            usually none has run at all. If one was already running when the
            merge landed, your push at the end cancels it — `review.yml`
            cancels a review in progress on a `synchronize` by anyone but the
            reviewer — and the same push starts a fresh one, on a head that
            can merge, which is what was wanted; the request stays outstanding
            throughout. Do not request review: it is already requested, and
            your push is what lets it be answered.
            Read /pr-first for which verbs are yours; `AGENTS.md` has the
            conventions. Every act on GitHub goes through the channel,
            `.meta/say/post` and `.meta/say/move`, each taking its body on
            stdin as a quoted heredoc.

            First ask whether there is anything to do:
            `git fetch origin` and `git log --oneline
            HEAD..origin/${{ steps.pr.outputs.base }}`, which lists what the
            base has and this branch does not and so is empty exactly when
            the branch is already current with its base. That way round and
            not the other: `origin/<base>..HEAD` lists this branch's own
            commits, which every open pull request has, before a rebase and
            after one. A run before this one may have done the work — two
            merges dispatch two runs — and a branch already current with its
            base is one to leave alone: say so and stop, posting nothing and
            pushing nothing.

            Otherwise rebase it: `git rebase origin/${{ steps.pr.outputs.base }}`.
            Never a merge of the base into the branch. GitHub authors that
            merge commit, or you would, and it carries no `Actor` Trailer, so
            A19 turns the required check red on the branch you are unblocking.
            A rebase writes no new commit: the branch's own commits move with
            their messages and so with their Trailers, which is what keeps
            them attributable, so do not squash them, do not reword them and
            do not `git commit` — resolve each conflict and
            `git rebase --continue`.

            Resolve for what this pull request is for, which its body says and
            the Issue it closes says: what landed under you is not yours to
            undo, and your own change is not to be dropped to make the
            conflict go away. Where a file is generated, take neither side —
            re-render it, as `AGENTS.md` says.

            Then `.meta/gate meta` green.

            Now, before you push, ask GitHub whether it holds this pull request
            armed: `gh pr view ${{ steps.pr.outputs.number }} --json
            autoMergeRequest`. Before, because after the push the fact is gone
            — `autoMergeRequest` carries no history — and both guesses are
            harmful. Guessed "was not armed" over one that was, the arming
            stays dropped, and `.meta/say/move advance` sweeps armed pull
            requests only, so one your push disarmed is out of the reach of
            every push to `${{ steps.pr.outputs.base }}` after it
            (solorepo's #93): the state this pass exists to prevent, reached by
            the pass that exists to prevent it.
            Guessed "was armed" over one that was only requested, you arm a
            pull request whose review is still outstanding and it lands on
            green with no verdict, which is the coder giving the reviewer's.

            If it is armed, say so on the pull request before you push —
            `.meta/say/post comment ${{ steps.pr.outputs.number }}`, a line
            saying you found it armed and are about to force-push. Not for
            your own use: for whoever arrives at an unarmed pull request
            afterwards and cannot otherwise tell an arming your push dropped
            from one nobody ever gave. Nothing you do after the push restores
            the arming if your run ends first — your budget is closest to
            spent here — and no sweep restores it either. One does name a pull
            request that is neither armed nor requested nor conflicting, but
            only once the head is green and it has sat idle, and what it
            prescribes is a second review of a change already approved, which
            is the cost solorepo's DR-149 refuses that alternative for. The
            comment outlives the run; the arming does not.

            Then `git push --force-with-lease`, and ask the same question
            again. If it was armed and is not now, arm it again:
            `.meta/say/move merge ${{ steps.pr.outputs.number }} --auto`. If it
            was not armed, leave it so: the arming is the verdict of whoever
            holds it (solorepo's DR-112), and a rebase is not a verdict.

            Read the outcome of that re-arming off GitHub rather than off the
            verb — `gh pr view ${{ steps.pr.outputs.number }} --json
            state,autoMergeRequest` — because `merge --auto` is not
            arming-only. Where GitHub refuses to arm a branch it could merge
            now, the verb merges it, and that is the arming being honoured
            rather than you merging by hand: what the arming says is "when
            green", and GitHub saying it is already green is that condition
            met. What you must not leave behind is the third answer — neither
            armed nor merged, which is what a merge landing on
            `${{ steps.pr.outputs.base }}` in that window leaves, the plain
            merge being refused for a branch no longer current. Say the verb
            once more if GitHub shows that: the second call advances the branch
            before it arms, which is the refusal's own remedy. If it still
            shows neither, stop below and say so. That is not a caveat on the
            stop but the reason for it: an arming nothing holds is
            solorepo's #93, no sweep restores one, and after `stop` no sweep
            names the pull request either — a reader that names a green pull
            request nobody holds wants its Challenge at a level a loop takes, and
            `stop` moves it to `human`. Which is why the stop is the act and
            not the giving up: the Issue in the solo's hands is the whole of
            what carries this afterwards.

            Say what happened on the pull request, once, so a reader arriving
            at a head nobody asked about knows why it moved, and say which
            wait you were repairing and what you did about the arming:
            `.meta/say/post comment ${{ steps.pr.outputs.number }}`. The note
            before the push is not that account — it said only that you found
            the pull request armed, and it was written against a run that did
            not get this far. Do not answer any thread, and revise the body
            only if the rebase changed what the pull request does, which it
            should not have.

            If what is left is not yours to settle —
            the conflict, where the change no longer makes sense over what
            landed or the gate will not go green, or an arming you could not
            restore — `.meta/say/move stop ${{ steps.pr.outputs.issue }}` with
            why on stdin, which hands the Challenge to the solo and leaves the
            pull request open. Both are a pull request waiting on a person, and
            that is what `stop` is for.

            Do not merge by hand and do not reach GitHub any other way. The
            hook refuses `gh pr merge`, which is the one "by hand" is about,
            and also `gh pr create`, `gh pr comment`, `gh pr review`,
            `gh pr update-branch`, `gh issue edit`, `gh issue comment` and
            `gh api`; the list is what this prompt happens to name and not the
            definition, so a command not on it is not thereby allowed.
            Restoring an arming through the channel is not merging by hand,
            even where GitHub answers it by merging.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"

      - name: answer the review
        if: github.event_name != 'issues' && inputs.task != 'rebase' && steps.taken.outputs.by == ''
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          show_full_output: "true"
          prompt: |
            You are the coder Role (solorepo's DR-107), answering the reviewer's request
            for changes on pull request #${{ steps.pr.outputs.number }} of
            ${{ github.repository }}, on the branch
            `${{ steps.pr.outputs.branch }}`, which a run of yours opened and
            is checked out here. Read /pr-first, the coder's reading of PR
            First, for what a reviewer's point is owed and which verbs are
            yours; `AGENTS.md` has the conventions. Every act on GitHub goes
            through the channel, `.meta/say/post` to say something and
            `.meta/say/move` to change state; each verb takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit` only.

            Read the threads: `python3 .meta/check_pr.py ${{ steps.pr.outputs.number }} --threads`,
            and the verdict: `gh pr view ${{ steps.pr.outputs.number }} --comments`.
            A point is right, right about something else, or overtaken by the
            diff, and only the first is a change to make; all three are owed
            a reply that says which. Make the changes, gate green with
            `.meta/gate meta`, commit and push. Then `.meta/say/post answer
            <thread-id>` on every thread, which replies and resolves; a thread
            marked "Noticed and not done" is the solo's and stays open.
            `.meta/say/move revise ${{ steps.pr.outputs.number }}` if the body no
            longer says what the head does, `just dereference`, then
            `.meta/say/post landed ${{ steps.pr.outputs.number }}` and
            `.meta/say/move request-review ${{ steps.pr.outputs.number }}`, and
            stop. Do not arm the merge, and do not wait for the checks.
            `dereference` reads the citations this branch wrote against the
            entries they name, and this is the pass that most needs it: a point
            answered is prose rewritten, and rewriting prose is where a
            paraphrase gets written. It is not a gate and blocks nothing, so
            answer its `x` by fixing the sentence, or by leaving it and saying
            why on the pull request (solorepo's DR-134).

            Do not merge by hand, and do not reach GitHub any other way: the
            hook refuses `gh pr create`, `gh pr comment`, `gh pr review`,
            `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"
