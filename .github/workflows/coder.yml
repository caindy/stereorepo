# The coder Role, taking an Issue by its difficulty label (solorepo's DR-112).
#
# An Issue labelled `easy` or `medium` is a Challenge the reviewer has read
# and landed at a level a loop takes, or one the solo filed at that level on
# his own say-so (solorepo's DR-230). This is the loop. It runs where the label lands, in a
# container that holds one token — the coder's — claims the Issue, does the
# work under the Disciplines, and leaves a pull request ready for review:
# gate green, branch pushed, body filled, what landed posted, and review
# requested (solorepo's DR-161). The reviewer approves when clean, and the
# standing merge manager lands what is green in order of leverage. What it
# cannot finish it hands to the solo by relabelling `human` and saying why.
#
# Four passes, and the trigger says which: an Issue taken, a hard Challenge
# decomposed, a request for changes answered, and a branch rebased back to where
# its outstanding review can be answered at all (solorepo's DR-133, DR-159,
# and solorepo's DR-292). The decomposition pass proposes children on the hard-label event and
# creates them only after the solo's exact approval comment. Rebase has no event
# of its own and is dispatched by `.meta/say/move advance` on the merge that
# caused it.
#
# Nothing here restates how to work. `AGENTS.md`, the Disciplines and the two
# forms are the checkout's; this file decides when the coder runs, as whom it
# speaks, and how deep it goes. The coder must write, so its allowance is a
# coder's, and the bound on it is the ruleset, the gate and review rather than
# the reviewer's reading hook.
name: coder
run-name: coder-issue-#${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request || inputs.issue }}

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]
  # The reviewer's request for changes is the coder's second run: solorepo's DR-112
  # promised it and solorepo's #102 sat with a verdict and no Job to take it. The
  # dispatch runs that pass by hand, for a verdict the event passed by — and
  # `task` chooses which pass, because the other one has no event of its own:
  # a merge on `main` that leaves a waiting review request unanswerable is
  # dispatched here by `.meta/say/move advance` (solorepo's DR-133), and what it
  # needs done is a rebase and not an answer to threads that do not exist.
  # On this event, as on `pull_request`, GitHub's "Events that trigger
  # workflows" table gives `GITHUB_SHA` as "Last merge commit on the
  # `GITHUB_REF` branch" and `GITHUB_REF` as "PR merge branch
  # `refs/pull/PULL_REQUEST_NUMBER/merge`", so the run reads this file from
  # the pull request's own merge ref, and a change to the door below is in
  # force on the first verdict of the pull request that makes it.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: the pull request the coder is dispatched for
        required: false
      # The take pass, dispatched for a Challenge rather than a pull request:
      # what the reconciler sends for a delivery the label's own event never
      # made (solorepo's DR-264). A run may not re-land a level to fire the
      # door (solorepo's DR-235), so the door is opened by name instead. The
      # facts the label's door reads off its event are read here off the
      # Issue by number: the take door reads its state, and the harness step
      # reads its `harness:` label, since the `harness` input is never empty
      # and would otherwise decide for a label it never saw.
      issue:
        description: the Challenge the coder is dispatched to take
        required: false
      task:
        description: what the coder is dispatched to do
        type: choice
        options: [review, rebase, decompose]
        default: review
      harness:
        description: which harness runs
        type: choice
        options: [claude, gemini, copilot]
        default: claude

# One run per Issue or per pull request at a time. A second label on the
# same Issue, or a second verdict on the same pull request, waits rather than
# starting a second branch. The review's state is in the key because every
# reply on a thread is a submitted review too — an empty one, `commented` —
# and GitHub keeps one pending run per group: keyed by number alone, a reply
# arriving while a run is in progress cancels the pending verdict behind it
# and leaves a run that skips, which is how solorepo's #141's verdict would have gone
# the way solorepo's #102's did. Keyed by state, a `commented` event can cancel only
# another `commented`, which was going to skip anyway. A dispatch is the
# by-hand form of a verdict, so it takes the verdict's key and waits behind
# one rather than running beside it.
#
# A rebase dispatch takes a key of its own, and the key is what stands in for
# the read-back `advance` cannot make: GitHub answers a dispatch with no
# content and creates the run afterwards, so the dispatcher cannot ask whether
# one is already going. Here it does not have to. Two merges on `main` in quick
# succession dispatch twice, and this group leaves one run standing and one
# waiting rather than two rebasing the same branch; a third cancels the one
# waiting. What the survivor finds is a branch already current with its base,
# which the pass evaluates for a stranded mergeability cache (solorepo's DR-283).
#
# An Issue delivery is keyed by its difficulty label for taking passes (`easy`
# or `medium` mapped to `take`), and by the label itself for non-taking passes
# (`challenge`, `roadmap`, `harness:*`, `hard`, `human`). A solo approval comment
# uses the `decompose` key. Without this
# separation, a non-taking label arriving while a difficulty run is pending
# cancels the difficulty run and leaves a delivery that skips (solorepo's #472).
concurrency:
  group: coder-${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request || inputs.issue }}-${{ github.event.review.state || (github.event_name == 'issue_comment' && 'decompose') || (inputs.task == 'decompose' && 'decompose') || (inputs.task == 'rebase' && 'rebase') || (inputs.pull_request && 'changes_requested') || ((github.event.label.name == 'easy' || github.event.label.name == 'medium') && 'take') || github.event.label.name || 'take' }}
  cancel-in-progress: false

# The workflow's own token checks the tree out and nothing else. Every read
# and write goes through the coder's credential, which the door's program
# and the session both hold, so what GitHub records is the Role and not the
# workflow; the check runs the hand-back reads are read under it too
# (solorepo's DR-155).
permissions:
  contents: read

jobs:
  coder:
    name: coder
    # Only a difficulty a loop takes, on a Challenge: `hard` opens its
    # decomposition pass, `human` remains the solo's, and a `roadmap` Issue is
    # deferred by definition. An owner approval comment resumes decomposition.
    # Or the
    # reviewer's account requesting changes on a branch named for a Challenge
    # — the prefix says which Issue, not whose the branch is; `before the session`
    # below reads whose it is, on this door as on the first (solorepo's DR-142,
    # solorepo's DR-159). Or the solo dispatching that second pass by hand.
    if: >-
      (github.event_name == 'issues'
        && github.event.issue.state == 'open'
        && (github.event.label.name == 'easy' || github.event.label.name == 'medium')
        && contains(github.event.issue.labels.*.name, 'challenge'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.state == 'changes_requested'
        && github.event.review.user.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)
        && (startsWith(github.event.pull_request.head.ref, 'claude/issue-') || startsWith(github.event.pull_request.head.ref, 'gemini/issue-') || startsWith(github.event.pull_request.head.ref, 'copilot/issue-')))
      || (github.event_name == 'issues'
        && github.event.action == 'labeled'
        && github.event.issue.state == 'open'
        && github.event.label.name == 'hard'
        && contains(github.event.issue.labels.*.name, 'challenge'))
      || (github.event_name == 'issue_comment'
        && github.event.issue.state == 'open'
        && contains(github.event.issue.labels.*.name, 'challenge')
        && contains(github.event.issue.labels.*.name, 'hard')
        && github.event.comment.body == 'Approve decomposition'
        && github.event.comment.author_association == 'OWNER')
      || github.event_name == 'workflow_dispatch'
    # The self-hosted scale set (solorepo's DR-137): this Job is what actually
    # spends GitHub Actions minutes, holding a runner for up to the timeout
    # below on every Issue and review. It moved here first, ahead of
    # `gate.yml`'s required checks, which followed under solorepo's DR-140.
    # The runner image pre-bakes core CLI tools (`just`, `jq`, `uv`, `gh`, `rustup`),
    # removing the tool installations this file previously made (`just`, `jq`, `uv`).
    # `.meta/actions/gh` below retains its `type -p` guard (solorepo's DR-140) because
    # that composite action is shared across workflows and runners where `gh` may not be present (solorepo's DR-160).
    runs-on: arc-runner-set
    timeout-minutes: 75
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
      # Fall back to Antigravity CLI (agy) if enabled by the GEMINI_FALLBACK toggle
      # (solorepo's DR-178, solorepo's DR-245); set vars.GEMINI_FALLBACK to 'true' to enable.
      GEMINI_FALLBACK: ${{ vars.GEMINI_FALLBACK || 'false' }}
      # Fall back to Copilot CLI only when the portfolio enables its subscription token.
      COPILOT_FALLBACK: ${{ vars.COPILOT_FALLBACK || 'false' }}
      # Differentiated thinking depth across harnesses (solorepo's DR-186): Sonnet and Opus
      # always run high extended thinking to prevent regressions and hallucinations.
      MAX_THINKING_TOKENS: "32000"
    steps:
      # Full history so the coder can read what was already true, and no
      # token in `.git/config` from the checkout: the action writes the
      # coder's own for the push.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `gh` on the runner: .meta/say/channel.py shells out to `gh` for every read
      # and write, and the composite action tests `type -p gh` before anything else.
      - uses: ./.meta/actions/gh

      # Materialize single-source APM cognitive assets (.agents/skills, .gemini/, .codex/)
      # so Gemini CLI, Codex, and Antigravity find identical skills as Claude Code (solorepo's DR-172, solorepo's DR-201, solorepo's #430).
      - name: reconcile multi-harness cognitive assets
        run: |
          git config core.hooksPath .meta/hooks
          just apm --reconcile

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, DR-107, DR-197): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the coder's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          if [ -n "$CODER_SIGNING_KEY" ]; then
            install -m 600 /dev/null ~/.config/solorepo/coder_signing.key
            printf '%s\n' "$CODER_SIGNING_KEY" > ~/.config/solorepo/coder_signing.key
          fi
          git config --global credential.helper store
          install -m 600 /dev/null ~/.git-credentials
          printf 'https://x-access-token:%s@github.com\n' "$CODER_GH_TOKEN" > ~/.git-credentials
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}
          CODER_SIGNING_KEY: ${{ secrets.CODER_SIGNING_KEY }}

      # The model credential, on the same terms and for a harder reason
      # (solorepo's DR-134). `dereference` asks through the `claude` on PATH,
      # and a nested run authenticates from its environment — which the agent's
      # shell does not get this one in. Run 34484811464 settles it: GitHub's own
      # log for that step lists `CLAUDE_CODE_OAUTH_TOKEN` alongside
      # `ACTOR_SESSION` and `AI_AGENT` in the step's `env:`, and a probe inside
      # the same step printed `token set: no` and `claude` answered `Not logged
      # in`. So the action hands the agent's shell no
      # `CLAUDE_CODE_OAUTH_TOKEN`, whatever `env:` block holds it. A file does
      # reach, which is why the Role's credential is one and not a variable:
      # the same probe found `coder.env` in the container. Absent this step the
      # reading falls through to ambient auth, says so, and every pair comes
      # back `?` — loud, and deciding nothing.
      #
      # It is the credential that does not cross and not the environment. Run
      # 34554434032 probed the agent's own shell on the review pass below and
      # read `ACTOR_SESSION=gha-34554434032` — the job-level `env:` at line
      # 112, its value matching `GITHUB_RUN_ID` — in the same shell that
      # reported the token unset. So `in_a_run()` answers `True` in here
      # (solorepo's DR-148); what the harness overrides is the names it owns,
      # `AI_AGENT` arriving as its own build string rather than as the value
      # written above.
      - name: hold the model credential
        run: |
          install -d -m 700 ~/.config/solorepo
          if [ -n "$CLAUDE_TOKEN" ]; then
            install -m 600 /dev/null ~/.config/solorepo/claude.env
            printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$CLAUDE_TOKEN" > ~/.config/solorepo/claude.env
          fi
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The coder door runs from the pull request head, `.meta/coder_door.py`
      # (solorepo's DR-264), and what only this file knows reaches it as
      # flags: which pass the event opened, since the event, the review's
      # state and the dispatch's inputs are read here; the event itself; and
      # the harness a dispatch asked for. Before the session the door reads
      # which pull request a second pass answers and checks its branch out;
      # which harness runs, by label and input, named under `ACTOR_AGENT`,
      # which the channel reads in a run, beside the `AI_AGENT` the harness
      # overwrites with its own build string (solorepo's DR-233); whether the
      # delivery is still the loop's, read now off the Issue rather than off
      # the frozen payload, on the verdict's door as on the label's
      # (solorepo's DR-142), with the sign left on a pull request whose
      # verdict no Job takes; and how deep, by the pass and the level the
      # Challenge holds now. The door runs again between every pair of rungs
      # below, on every pass, and on a take reads the branch once more
      # there; the last phase is the last step.
      - name: before the session
        id: before
        run: |
          if [ -f .meta/coder_door.py ]; then
            .meta/coder_door.py coder before "$NUMBER" --pass "$PASS" --event "$EVENT" --harness "$HARNESS"
          else
            .meta/say/on coder before "$NUMBER" --pass "$PASS" --event "$EVENT" --harness "$HARNESS"
          fi
        env:
          NUMBER: ${{ github.event.issue.number || inputs.issue || github.event.pull_request.number || inputs.pull_request }}
          PASS: ${{ ((github.event_name == 'issues' && github.event.label.name == 'hard') || github.event_name == 'issue_comment' || inputs.task == 'decompose') && 'decompose' || (github.event_name == 'issues' || inputs.issue != '') && 'take' || inputs.task == 'rebase' && 'rebase' || 'answer' }}
          EVENT: ${{ github.event_name }}
          HARNESS: ${{ inputs.harness }}

      # The chain the door resolved, which the rungs below read by number
      # (solorepo's DR-281), shown in the run's step list while the run is
      # live: this step's name is rendered from the door's `tier_<n>_harness`
      # outputs the moment it runs, which is before any rung, so
      # `.meta/arc/watch` reads a rung's harness here off the job steps it
      # already fetches; a rung the chain does not reach renders empty. Why
      # the watch reads a step's name and not the log, the annotations or an
      # attempt step's own name, and what showed it, is at `CHAIN` and `RUNG`
      # in `.meta/arc/watch`.
      - name: chain ${{ steps.before.outputs.tier_1_harness }},${{ steps.before.outputs.tier_2_harness }},${{ steps.before.outputs.tier_3_harness }}
        id: chain
        run: ":"

      # One ladder for every pass (solorepo's DR-281). The pass is in the
      # prompt the door rendered under `.review/prompt.md`, and the rung is
      # in the door's `tier_<n>_*` outputs, so the attempt steps are the
      # same whatever the pass and whatever harness each rung names: the
      # runner holds the one guarded step per harness. Rung 1 runs where
      # the delivery is the loop's, on a take, a rebase or an answer; every
      # later rung runs where the door after the preceding rung said it exists.
      # `continue-on-error` keeps a failed rung from ending the job
      # before the next rung and the door's `after`. Which harness a rung ran
      # is the door's `tier_<n>_harness` output in the run log, not the
      # step's name: a name carrying an expression renders only when the step
      # runs, and a skipped rung would show the template forever. The turn cap
      # and the minutes are the rung's; later rungs' minutes fall back to the
      # preceding rung's for expressions where a shorter chain names none.
      - name: attempt 1
        id: attempt_1
        if: steps.before.outputs.by == ''
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.before.outputs.tier_1_minutes) }}
        env:
          # Whose session this rung is, with the primary's name as the default
          # an empty output would otherwise unname the run with (solorepo's #836).
          ACTOR_AGENT: ${{ steps.before.outputs.tier_1_agent || steps.before.outputs.agent }}
          AI_AGENT: ${{ steps.before.outputs.tier_1_agent || steps.before.outputs.agent }}
        uses: ./.meta/actions/harness
        with:
          harness: ${{ steps.before.outputs.tier_1_harness }}
          role: coder
          model: ${{ steps.before.outputs.tier_1_model }}
          effort: ${{ steps.before.outputs.tier_1_effort }}
          turns: ${{ steps.before.outputs.tier_1_turns }}
          minutes: ${{ steps.before.outputs.tier_1_minutes }}
          agent: ${{ steps.before.outputs.tier_1_agent }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls and the push as the Role too, so
          # nothing in the run is authored by an App or a bot.
          github-token: ${{ secrets.CODER_GH_TOKEN }}
          # Coder passes run in accept-edits mode with full tool capabilities
          # (shell, read, edit, write), unlike the reviewer, which is bounded to
          # read-only tools.
          claude-args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"
          agy-mode: accept-edits

      # The door between rungs 1 and 2: told how rung 1 ended, it says
      # whether rung 2 runs and writes that rung's prompt, and on a take
      # reads the branch again for the resume clause (solorepo's DR-281).
      # It runs wherever rung 1 ran, and `continue-on-error` keeps a red
      # reading from ending the job: an `if:` naming no status function
      # carries an implicit `success()`, and `run` left empty skips the
      # next rung rather than guessing.
      - name: between rungs 1 and 2
        id: between_1
        if: steps.attempt_1.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f .meta/coder_door.py ]; then
            .meta/coder_door.py coder between "$NUMBER" --pass "$PASS" --event "$EVENT" --attempt 1 --outcome "$OUTCOME" --execution-file "$EXECUTION"
          else
            .meta/say/on coder between "$NUMBER" --pass "$PASS" --event "$EVENT" --attempt 1 --outcome "$OUTCOME" --execution-file "$EXECUTION"
          fi
        env:
          NUMBER: ${{ steps.before.outputs.pass == 'take' && (github.event.issue.number || inputs.issue) || steps.before.outputs.number }}
          PASS: ${{ steps.before.outputs.pass }}
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.attempt_1.outcome }}
          EXECUTION: ${{ steps.attempt_1.outputs.execution_file }}


      - name: attempt 2
        id: attempt_2
        if: steps.between_1.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.before.outputs.tier_2_minutes || steps.before.outputs.tier_1_minutes) }}
        env:
          # Whose session this rung is, with the primary's name as the default
          # an empty output would otherwise unname the run with (solorepo's #836).
          ACTOR_AGENT: ${{ steps.before.outputs.tier_2_agent || steps.before.outputs.agent }}
          AI_AGENT: ${{ steps.before.outputs.tier_2_agent || steps.before.outputs.agent }}
        uses: ./.meta/actions/harness
        with:
          harness: ${{ steps.before.outputs.tier_2_harness }}
          role: coder
          model: ${{ steps.before.outputs.tier_2_model }}
          effort: ${{ steps.before.outputs.tier_2_effort }}
          turns: ${{ steps.before.outputs.tier_2_turns }}
          minutes: ${{ steps.before.outputs.tier_2_minutes }}
          agent: ${{ steps.before.outputs.tier_2_agent }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls and the push as the Role too, so
          # nothing in the run is authored by an App or a bot.
          github-token: ${{ secrets.CODER_GH_TOKEN }}
          # Coder passes run in accept-edits mode with full tool capabilities
          # (shell, read, edit, write), unlike the reviewer, which is bounded to
          # read-only tools.
          claude-args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"
          agy-mode: accept-edits

      - name: between rungs 2 and 3
        id: between_2
        if: steps.attempt_2.outcome != 'skipped'
        continue-on-error: true
        run: |
          if [ -f .meta/coder_door.py ]; then
            .meta/coder_door.py coder between "$NUMBER" --pass "$PASS" --event "$EVENT" --attempt 2 --outcome "$OUTCOME"
          else
            .meta/say/on coder between "$NUMBER" --pass "$PASS" --event "$EVENT" --attempt 2 --outcome "$OUTCOME"
          fi
        env:
          NUMBER: ${{ steps.before.outputs.pass == 'take' && (github.event.issue.number || inputs.issue) || steps.before.outputs.number }}
          PASS: ${{ steps.before.outputs.pass }}
          EVENT: ${{ github.event_name }}
          OUTCOME: ${{ steps.attempt_2.outcome }}

      - name: attempt 3
        id: attempt_3
        if: steps.between_2.outputs.run == 'true'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.before.outputs.tier_3_minutes || steps.before.outputs.tier_2_minutes || steps.before.outputs.tier_1_minutes) }}
        env:
          ACTOR_AGENT: ${{ steps.before.outputs.tier_3_agent || steps.before.outputs.agent }}
          AI_AGENT: ${{ steps.before.outputs.tier_3_agent || steps.before.outputs.agent }}
        uses: ./.meta/actions/harness
        with:
          harness: ${{ steps.before.outputs.tier_3_harness }}
          role: coder
          model: ${{ steps.before.outputs.tier_3_model }}
          effort: ${{ steps.before.outputs.tier_3_effort }}
          turns: ${{ steps.before.outputs.tier_3_turns }}
          minutes: ${{ steps.before.outputs.tier_3_minutes }}
          agent: ${{ steps.before.outputs.tier_3_agent }}
          claude-oauth-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github-token: ${{ secrets.CODER_GH_TOKEN }}
          claude-args: |
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"
          agy-mode: accept-edits

      # The door's second phase, once the pass's rungs have ended, whatever
      # way they ended: `always()` rather than `!cancelled()`, so that a run
      # cancelled at its budget still hands its Challenge back. How each rung
      # ended is this file's to read and reaches the door as `--outcomes`,
      # one per rung in order, and the door answers with the last rung that
      # ran (solorepo's DR-281). A take that failed or was cancelled is handed
      # back: review requested where the pull request it left is green and
      # clean, the account posted first, and the Challenge given to the solo
      # through `stop` otherwise, with why (solorepo's DR-129 and
      # solorepo's DR-155). A rebase that succeeded redelivers the review pass it
      # cleared (solorepo's #777). A pass one rung failed and none finished
      # ends the run red; a cancelled pass is not a failed one.
      #
      # A take pass the turn cap cut ends with the step reporting `success`,
      # the process having exited in an orderly way, so the conclusions above
      # cannot say it stopped. `--execution-file` hands the door the transcript
      # `claude-code-action` publishes, whose result entry carries the cap and
      # the turns spent, and the door reads it there and hands back on it
      # (solorepo's DR-277): the first rung that published one is the Claude
      # Code rung, whichever number it ran as. Only the take pass does anything
      # about a cap; the answer and rebase passes hand back nothing,
      # so a cap that cuts one of them is still read as a pass that succeeded
      # and is a Challenge of its own. Antigravity and Copilot CLI are bounded
      # by the clock alone.
      # Rescue unpushed work before container teardown: commit uncommitted
      # modifications in the working tree and push unpushed commits directly
      # to the active PR branch (solorepo's #946).
      - name: rescue unpushed work
        if: ${{ always() && steps.before.outcome == 'success' && steps.before.outputs.by == '' && steps.before.outputs.pass != 'decompose' }}
        run: |
          if [ -f .meta/coder_door.py ]; then
            .meta/coder_door.py coder rescue "$NUMBER" --pass "$PASS" --event "$EVENT" \
              --branch-prefix "$PREFIX"
          fi
        env:
          ACTOR_AGENT: gha/coder
          AI_AGENT: gha/coder
          NUMBER: ${{ steps.before.outputs.pass == 'take' && (github.event.issue.number || inputs.issue) || steps.before.outputs.number }}
          PASS: ${{ steps.before.outputs.pass }}
          EVENT: ${{ github.event_name }}
          PREFIX: ${{ steps.before.outputs.branch_prefix }}

      - name: after the session
        if: ${{ always() && steps.before.outcome == 'success' && steps.before.outputs.by == '' }}
        run: |
          if [ -f .meta/coder_door.py ]; then
            .meta/coder_door.py coder after "$NUMBER" --pass "$PASS" --event "$EVENT" \
              --outcomes "$OUTCOMES" --branch-prefix "$PREFIX" \
              --execution-file "$EXECUTION"
          else
            .meta/say/on coder after "$NUMBER" --pass "$PASS" --event "$EVENT" \
              --outcomes "$OUTCOMES" --branch-prefix "$PREFIX" \
              --execution-file "$EXECUTION"
          fi
        env:
          # The door's own acts are the door's, named on the terms `gha/reconcile`
          # already uses, rather than inherited from whatever the last rung
          # wrote to the environment: a fallback that activated and then failed
          # left its build string standing for every step after it, and this
          # door's post signed as a harness that never ran (solorepo's #836).
          ACTOR_AGENT: gha/coder
          AI_AGENT: gha/coder
          NUMBER: ${{ steps.before.outputs.pass == 'take' && (github.event.issue.number || inputs.issue) || steps.before.outputs.number }}
          PASS: ${{ steps.before.outputs.pass }}
          EVENT: ${{ github.event_name }}
          OUTCOMES: ${{ steps.attempt_1.outcome }},${{ steps.attempt_2.outcome }},${{ steps.attempt_3.outcome }}
          PREFIX: ${{ steps.before.outputs.branch_prefix }}
          EXECUTION: ${{ steps.attempt_1.outputs.execution_file || steps.attempt_2.outputs.execution_file || steps.attempt_3.outputs.execution_file }}
