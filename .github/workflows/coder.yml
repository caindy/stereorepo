            Do not answer any thread, do not merge by hand, and do not reach
            GitHub any other way: the hook refuses `gh pr create`, `gh pr
            comment`, `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"

      - name: detect claude quota error (take)
        id: claude_quota_take
        if: github.event_name == 'issues' && steps.taken.outputs.by == '' && steps.harness.outputs.harness == 'claude' && steps.take_claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.take_claude.outputs.execution_file }}
        run: |
          python3 -c '
          import json, os, sys
          file = os.environ.get("EXECUTION_FILE") or os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "claude-execution-output.json")
          fallback = False
          if os.path.exists(file):
              try:
                  with open(file) as f:
                      data = json.load(f)
                  entries = data if isinstance(data, list) else [data]
                  for item in entries:
                      if isinstance(item, dict):
                          if item.get("api_error_status") == 429 or item.get("error") == "rate_limit" or any(k in str(item.get("result", "")).lower() for k in ["limit", "quota", "rate"]):
                              fallback = True
                              break
              except Exception as e:
                  print(f"Error parsing {file}: {e}", file=sys.stderr)
              if not fallback:
                  try:
                      with open(file) as f:
                          raw = f.read().lower()
                      if "429" in raw or "rate_limit" in raw or "weekly limit" in raw or "hit your" in raw:
                          fallback = True
                  except Exception as e:
                      print(f"Error reading {file}: {e}", file=sys.stderr)
          print(f"Claude failure detected (quota={fallback}); activating Gemini fallback.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("fallback=true\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("AI_AGENT=google-github-actions/run-gemini-cli\n")
          '

