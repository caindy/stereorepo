          # answering pass (changes_requested) is the larger model whatever the
          # label was: the threads it answers were written by the deeper reviewer.
          # A promotion pass (approved) takes the smaller model and a quarter of
          # the budget above regardless of LEVEL.
          LEVEL: ${{ (github.event_name == 'issues' && steps.taken.outputs.level) || 'medium' }}

      - name: take the Issue (claude)
