# The coder Role, taking an Issue by its difficulty label (solorepo's DR-112).
#
# An Issue labelled `easy` or `medium` is a Challenge the reviewer has read
# and landed at a level a loop takes, or one the solo filed at that level on
# his own say-so (solorepo's DR-230). This is the loop. It runs where the label lands, in a
# container that holds one token — the coder's — claims the Issue, does the
# work under the Disciplines, and leaves a pull request ready for review:
# gate green, branch pushed, body filled, what landed posted, and review
# requested (solorepo's DR-161). The reviewer approves when clean, and the
# standing merge manager lands what is green in order of leverage. What it
# cannot finish it hands to the solo by relabelling `human` and saying why.
#
# Four passes, and the trigger says which: an Issue taken, a request for
# changes answered, promotion on approval, and a branch rebased back to
# where its outstanding review can be answered at all (solorepo's DR-133,
# solorepo's DR-159). The last has no event of its own and is dispatched by
# `.meta/say/move advance` on the merge that caused it.
#
# Nothing here restates how to work. `AGENTS.md`, the Disciplines and the two
# forms are the checkout's; this file decides when the coder runs, as whom it
# speaks, and how deep it goes. The coder must write, so its allowance is a
# coder's, and the bound on it is the ruleset, the gate and review rather than
# the reviewer's reading hook.
name: coder
run-name: coder-issue-#${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request || inputs.issue }}

on:
  issues:
    types: [labeled]
  # The reviewer's request for changes is the coder's second run: solorepo's DR-112
  # promised it and solorepo's #102 sat with a verdict and no Job to take it. The
  # dispatch runs that pass by hand, for a verdict the event passed by — and
  # `task` chooses which pass, because the other one has no event of its own:
  # a merge on `main` that leaves a waiting review request unanswerable is
  # dispatched here by `.meta/say/move advance` (solorepo's DR-133), and what it
  # needs done is a rebase and not an answer to threads that do not exist.
  # On this event, as on `pull_request`, GitHub's "Events that trigger
  # workflows" table gives `GITHUB_SHA` as "Last merge commit on the
  # `GITHUB_REF` branch" and `GITHUB_REF` as "PR merge branch
  # `refs/pull/PULL_REQUEST_NUMBER/merge`", so the run reads this file from
  # the pull request's own merge ref, and a change to the door below is in
  # force on the first verdict of the pull request that makes it.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: the pull request the coder is dispatched for
        required: false
      # The take pass, dispatched for a Challenge rather than a pull request:
      # what the reconciler sends for a delivery the label's own event never
      # made (solorepo's DR-264). A run may not re-land a level to fire the
      # door (solorepo's DR-235), so the door is opened by name instead. The
      # facts the label's door reads off its event are read here off the
      # Issue by number: the take door reads its state, and the harness step
      # reads its `harness:` label, since the `harness` input is never empty
      # and would otherwise decide for a label it never saw.
      issue:
        description: the Challenge the coder is dispatched to take
        required: false
      task:
        description: what the coder is dispatched to do
        type: choice
        options: [review, rebase]
        default: review
      harness:
        description: which harness runs
        type: choice
        options: [claude, codex, gemini]
        default: claude

# One run per Issue or per pull request at a time. A second label on the
# same Issue, or a second verdict on the same pull request, waits rather than
# starting a second branch. The review's state is in the key because every
# reply on a thread is a submitted review too — an empty one, `commented` —
# and GitHub keeps one pending run per group: keyed by number alone, a reply
# arriving while a run is in progress cancels the pending verdict behind it
# and leaves a run that skips, which is how solorepo's #141's verdict would have gone
# the way solorepo's #102's did. Keyed by state, a `commented` event can cancel only
# another `commented`, which was going to skip anyway. A dispatch is the
# by-hand form of a verdict, so it takes the verdict's key and waits behind
# one rather than running beside it.
#
# A rebase dispatch takes a key of its own, and the key is what stands in for
# the read-back `advance` cannot make: GitHub answers a dispatch with no
# content and creates the run afterwards, so the dispatcher cannot ask whether
# one is already going. Here it does not have to. Two merges on `main` in quick
# succession dispatch twice, and this group leaves one run standing and one
# waiting rather than two rebasing the same branch; a third cancels the one
# waiting. What the survivor finds is a branch already current with its base,
# which the pass is told to leave alone.
#
# An Issue delivery is keyed by its difficulty label for taking passes (`easy`
# or `medium` mapped to `take`), and by the label itself for non-taking passes
# (`challenge`, `roadmap`, `harness:*`, `hard`, `human`). Without this
# separation, a non-taking label arriving while a difficulty run is pending
# cancels the difficulty run and leaves a delivery that skips (solorepo's #472).
concurrency:
  group: coder-${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request || inputs.issue }}-${{ github.event.review.state || (inputs.task == 'rebase' && 'rebase') || (inputs.pull_request && 'changes_requested') || ((github.event.label.name == 'easy' || github.event.label.name == 'medium') && 'take') || github.event.label.name || 'take' }}
  cancel-in-progress: false

# The workflow's own token checks the tree out and nothing else. Every read
# and write goes through the coder's credential, which the door's program
# and the session both hold, so what GitHub records is the Role and not the
# workflow; the check runs the hand-back reads are read under it too
# (solorepo's DR-155).
permissions:
  contents: read

jobs:
  coder:
    name: coder
    # Only a difficulty a loop takes, on a Challenge: `hard` and `human` are
    # not this Job's, and a `roadmap` Issue is deferred by definition. Or the
    # reviewer's account requesting changes or approving on a branch named
    # for a Challenge — the prefix says which Issue, not whose the branch is;
    # `before the session` below reads whose it is, on this door as on the
    # first (solorepo's DR-142, solorepo's DR-159). Or the solo dispatching that second
    # pass by hand.
    if: >-
      (github.event_name == 'issues'
        && github.event.issue.state == 'open'
        && (github.event.label.name == 'easy' || github.event.label.name == 'medium')
        && contains(github.event.issue.labels.*.name, 'challenge'))
      || (github.event_name == 'pull_request_review'
        && (github.event.review.state == 'changes_requested' || github.event.review.state == 'approved')
        && github.event.review.user.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)
        && (startsWith(github.event.pull_request.head.ref, 'claude/issue-') || startsWith(github.event.pull_request.head.ref, 'gemini/issue-') || startsWith(github.event.pull_request.head.ref, 'codex/issue-')))
      || github.event_name == 'workflow_dispatch'
    # The self-hosted scale set (solorepo's DR-137): this Job is what actually
    # spends GitHub Actions minutes, holding a runner for up to the timeout
    # below on every Issue and review. It moved here first, ahead of
    # `gate.yml`'s required checks, which followed under solorepo's DR-140.
    # The runner image pre-bakes core CLI tools (`just`, `jq`, `uv`, `gh`, `rustup`),
    # removing the tool installations this file previously made (`just`, `jq`, `uv`).
    # `.meta/actions/gh` below retains its `type -p` guard (solorepo's DR-140) because
    # that composite action is shared across workflows and runners where `gh` may not be present (solorepo's DR-160).
    runs-on: arc-runner-set
    timeout-minutes: 75
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
      # Fall back to Antigravity CLI (agy) if enabled by the GEMINI_FALLBACK toggle
      # (solorepo's DR-178, solorepo's DR-245); set vars.GEMINI_FALLBACK to 'true' to enable.
      GEMINI_FALLBACK: ${{ vars.GEMINI_FALLBACK || 'false' }}
      # Differentiated thinking depth across harnesses (solorepo's DR-186): Sonnet and Opus
      # always run high extended thinking to prevent regressions and hallucinations.
      MAX_THINKING_TOKENS: "32000"
    steps:
      # Full history so the coder can read what was already true, and no
      # token in `.git/config` from the checkout: the action writes the
      # coder's own for the push.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `gh` on the runner: .meta/say/channel.py shells out to `gh` for every read
      # and write, and the composite action tests `type -p gh` before anything else.
      - uses: ./.meta/actions/gh

      # Materialize single-source APM cognitive assets (.agents/skills, .gemini/, .codex/)
      # so Gemini CLI, Codex, and Antigravity find identical skills as Claude Code (solorepo's DR-172, solorepo's DR-201, solorepo's #430).
      - name: reconcile multi-harness cognitive assets
        run: |
          git config core.hooksPath .meta/hooks
          python3 .meta/apm_compile.py --reconcile

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, DR-107, DR-197): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the coder's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          if [ -n "$CODER_SIGNING_KEY" ]; then
            install -m 600 /dev/null ~/.config/solorepo/coder_signing.key
            printf '%s\n' "$CODER_SIGNING_KEY" > ~/.config/solorepo/coder_signing.key
          fi
          git config --global credential.helper store
          install -m 600 /dev/null ~/.git-credentials
          printf 'https://x-access-token:%s@github.com\n' "$CODER_GH_TOKEN" > ~/.git-credentials
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}
          CODER_SIGNING_KEY: ${{ secrets.CODER_SIGNING_KEY }}

      # The model credential, on the same terms and for a harder reason
      # (solorepo's DR-134). `dereference` asks through the `claude` on PATH,
      # and a nested run authenticates from its environment — which the agent's
      # shell does not get this one in. Run 34484811464 settles it: GitHub's own
      # log for that step lists `CLAUDE_CODE_OAUTH_TOKEN` alongside
      # `ACTOR_SESSION` and `AI_AGENT` in the step's `env:`, and a probe inside
      # the same step printed `token set: no` and `claude` answered `Not logged
      # in`. So the action hands the agent's shell no
      # `CLAUDE_CODE_OAUTH_TOKEN`, whatever `env:` block holds it. A file does
      # reach, which is why the Role's credential is one and not a variable:
      # the same probe found `coder.env` in the container. Absent this step the
      # reading falls through to ambient auth, says so, and every pair comes
      # back `?` — loud, and deciding nothing.
      #
      # It is the credential that does not cross and not the environment. Run
      # 34554434032 probed the agent's own shell on the review pass below and
      # read `ACTOR_SESSION=gha-34554434032` — the job-level `env:` at line
      # 112, its value matching `GITHUB_RUN_ID` — in the same shell that
      # reported the token unset. So `in_a_run()` answers `True` in here
      # (solorepo's DR-148); what the harness overrides is the names it owns,
      # `AI_AGENT` arriving as its own build string rather than as the value
      # written above.
      - name: hold the model credential
        run: |
          install -d -m 700 ~/.config/solorepo
          if [ -n "$CLAUDE_TOKEN" ]; then
            install -m 600 /dev/null ~/.config/solorepo/claude.env
            printf 'CLAUDE_CODE_OAUTH_TOKEN=%s\n' "$CLAUDE_TOKEN" > ~/.config/solorepo/claude.env
          fi
        env:
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The door's first phase is one program of the channel, `.meta/say/on`
      # (solorepo's DR-264), and what only this file knows reaches it as
      # flags: which pass the event opened, since the event, the review's
      # state and the dispatch's inputs are read here; the event itself; and
      # the harness a dispatch asked for. Before the session the door reads
      # which pull request a second pass answers and checks its branch out;
      # which harness runs, by label and input, named under `ACTOR_AGENT`,
      # which the channel reads in a run, beside the `AI_AGENT` the harness
      # overwrites with its own build string (solorepo's DR-233); whether the
      # delivery is still the loop's, read now off the Issue rather than off
      # the frozen payload, on the verdict's door as on the label's
      # (solorepo's DR-142), with the sign left on a pull request whose
      # verdict no Job takes; how deep, by the pass and the level the
      # Challenge holds now; and on approval how many threads are held for
      # promotion (solorepo's DR-159). The second phase is the last step.
      - name: before the session
        id: before
        run: >-
          .meta/say/on coder before "$NUMBER"
          --pass "$PASS" --event "$EVENT" --harness "$HARNESS"
        env:
          NUMBER: ${{ github.event.issue.number || inputs.issue || github.event.pull_request.number || inputs.pull_request }}
          PASS: ${{ (github.event_name == 'issues' || inputs.issue != '') && 'take' || inputs.task == 'rebase' && 'rebase' || github.event.review.state == 'approved' && 'promote' || 'answer' }}
          EVENT: ${{ github.event_name }}
          HARNESS: ${{ inputs.harness }}
      - name: take the Issue (claude)
        id: take_claude
        if: steps.before.outputs.pass == 'take' && steps.before.outputs.by == '' && steps.before.outputs.harness == 'claude'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.before.outputs.minutes) }}
        env:
          MAX_THINKING_TOKENS: "32000"
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls and the push as the Role too, so
          # nothing in the run is authored by an App or a bot.
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          # The transcript, in the run log: the run is the only record of
          # what the coder did between the Issue and the pull request.
          # `gh run view <id> --log` prints this step cut off at about two
          # minutes; the whole of it is in the archive the CLI caches at
          # `~/.cache/gh/run-log-<id>-*.zip`, where `0_coder.txt` holds the
          # complete transcript and the `result` event with turns and cost
          # (solorepo's #122).
          show_full_output: "true"
          # The last paragraph before the hand-off buys a reader who did not
          # write the diff, which between the last commit and the reviewer's
          # first read there is otherwise none of. The small model belongs
          # there and not on the answering pass because of the direction it
          # fails in: handed a diff and no verdict to interpret it fails by
          # missing something, and the reviewer is still there unchanged;
          # handed a deep critique it would fail by misreading a thread and
          # writing something plausible and slightly wrong, which nothing
          # downstream catches. Same money, opposite risk (solorepo's #220).
          # The paragraph binds this step's hand-off and nothing else: whether
          # the rebase and answering passes want the same reader is a separate
          # question. The hand-off and not the difficulty, because a trigger
          # named for one level's last verb is a guardrail on the other levels
          # only by coincidence (solorepo's DR-163): written as "before you
          # request the review" it fired on `medium` alone, since `easy` then
          # armed the merge instead, and an `easy` diff reached `main` with no
          # reader at all (solorepo's #256) until solorepo's DR-161 ended that
          # arming: both levels hand off by requesting review below.
          prompt: |
            Your Personality is work:personality/coder: Concise. Recommendation before survey, decision before rationale. Cite an Article by number and move on. Err toward concision rather than tedium: unpacking can be asked for, and asking is cheaper than reading past what was not wanted. Tedium cannot be un-read.

            You are the coder Role (solorepo's DR-107), taking Issue #${{ github.event.issue.number || inputs.issue }}
            of ${{ github.repository }}, labelled `${{ steps.before.outputs.level }}`.
            Read /pr-first: it is the coder's reading of PR First, and lists
            your verbs, what each does and where the judgement is; `AGENTS.md`
            has the conventions. Every act on GitHub goes through the channel,
            `.meta/say/post` to say something and `.meta/say/move` to change
            state; each verb is a step of the Discipline, takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit -m "<subject>"` and
            never `git commit`; only the channel signs.

            Claim it: `.meta/say/move claim ${{ github.event.issue.number || inputs.issue }}`.
            Read it: `gh issue view ${{ github.event.issue.number || inputs.issue }}`.
            Branch as `${{ steps.before.outputs.branch_prefix }}/issue-${{ github.event.issue.number || inputs.issue }}` from
            `origin/main`, push at the first commit, and open the pull request
            at once with `.meta/say/move open`, the form filled and the Issue named
            under "What it closes". ${{ steps.before.outputs.resume && format('A run before this one stopped and left pull request #{0} open on that branch: check the branch out and continue under it, and do not branch or open again.', steps.before.outputs.resume) || 'No run has taken this Issue before.' }}
            Below, `<n>` is that pull request's number, never the Issue's;
            `revise` and `comment` take either.

            Do what the Issue asks and no more. Gate green with
            `just gate meta`, commit and push as you go, `.meta/say/move revise <n>`
            when the body no longer says what the head does, and
            `just dereference` and then `.meta/say/post landed <n>` before you
            hand it over. `dereference` reads the citations this branch wrote
            against the entries they name; it is not a gate and blocks nothing,
            so answer its `x` by fixing the sentence, or by leaving it and
            saying why on the pull request (solorepo's DR-134).

            When authoring or modifying docstrings, comments, or documentation,
            apply the /technical-writing skill (solorepo's DR-194, solorepo's DR-198,
            solorepo's DR-207): ensure item docstrings are Diátaxis Reference
            contracts without reviewer litigation (solorepo's DR-175), hold source
            comments to the four permissible exceptions (pruning inline narration,
            routing defect narratives to companion <module>.history.md logs naming probe
            Evidence under solorepo's DR-171, and mechanizing informal constraints
            before pruning), audit lint and type suppressions as defects, and
            dereference all citations.

            Before you hand the branch over as finished, reread your diff
            against origin/main to verify quality and consistency.
            What you spot is yours to act on or not; what you decide not to
            do you raise as a notice on the diff with `.meta/say/post notice`.

            `easy` and `medium`: request review: `.meta/say/move request-review <n>`
            and stop. The reviewer approves when clean, and a standing merge manager
            lands what is green in order of leverage (solorepo's DR-161).
            Do not arm the merge and do not merge by hand: the merge manager evaluates and lands
            eligible work. Do so the moment the branch is pushed and the body is
            final, and do not wait for the checks (solorepo's #102). A surviving notice
            is promoted at approval, not now (solorepo's DR-159).

            If you cannot finish — a decision only the solo can take, a gate
            that will not go green, work larger than it looked —
            `.meta/say/move stop ${{ github.event.issue.number || inputs.issue }}` with why on
            stdin. It hands the Issue to the solo and leaves the pull request
            open for the run that takes it up again.

            Do not answer any thread, do not merge by hand, and do not reach
            GitHub any other way: the hook refuses `gh pr create`, `gh pr
            comment`, `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.before.outputs.model }}
            --max-turns ${{ steps.before.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"

      - name: take the Issue (gemini)
        id: take_gemini
        if: steps.before.outputs.pass == 'take' && steps.before.outputs.by == '' && (steps.before.outputs.harness == 'gemini' || steps.take_claude.outcome == 'failure')
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.before.outputs.minutes) }}
        # Coder passes run in accept-edits mode with full tool capabilities
        # (shell, read, edit, write) unlike the reviewer which is bounded
        # to read-only tools.
        uses: ./.meta/actions/agy
        with:
          role: coder
          model: ${{ steps.before.outputs.gemini_model }}
          effort: ${{ steps.before.outputs.effort }}
          mode: accept-edits
          timeout-minutes: ${{ steps.before.outputs.minutes }}
          harness: ${{ steps.before.outputs.harness }}
          claude-outcome: ${{ steps.take_claude.outcome }}
          execution-file: ${{ steps.take_claude.outputs.execution_file }}
          prompt: |
            Your Personality is work:personality/coder: Concise. Recommendation before survey, decision before rationale. Cite an Article by number and move on. Err toward concision rather than tedium: unpacking can be asked for, and asking is cheaper than reading past what was not wanted. Tedium cannot be un-read.

            You are the coder Role (solorepo's DR-107), taking Issue #${{ github.event.issue.number || inputs.issue }}
            of ${{ github.repository }}, labelled `${{ steps.before.outputs.level }}`.
            Read /pr-first: it is the coder's reading of PR First, and lists
            your verbs, what each does and where the judgement is; `AGENTS.md` (and `GEMINI.md`)
            has the conventions. Every act on GitHub goes through the channel,
            `.meta/say/post` to say something and `.meta/say/move` to change
            state; each verb is a step of the Discipline, takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit -m "<subject>"` and
            never `git commit`; only the channel signs.

            Claim it: `.meta/say/move claim ${{ github.event.issue.number || inputs.issue }}`.
            Read it: `gh issue view ${{ github.event.issue.number || inputs.issue }}`.
            Branch as `${{ steps.before.outputs.branch_prefix }}/issue-${{ github.event.issue.number || inputs.issue }}` from
            `origin/main`, push at the first commit, and open the pull request
            at once with `.meta/say/move open`, the form filled and the Issue named
            under "What it closes". ${{ steps.before.outputs.resume && format('A run before this one stopped and left pull request #{0} open on that branch: check the branch out and continue under it, and do not branch or open again.', steps.before.outputs.resume) || 'No run has taken this Issue before.' }}
            Below, `<n>` is that pull request's number, never the Issue's;
            `revise` and `comment` take either.

            Do what the Issue asks and no more. Never run `just gate` or
            `just gate meta` as an entrance check on origin/main (`main` is
            evergreen under PR First). Gate green with
            `just gate meta` only when your changes are complete before handoff.
            Do NOT invoke subagents: evaluate and implement the Challenge
            directly in this session (solorepo's DR-257).
            Commit and push as you go, `.meta/say/move revise <n>`
            when the body no longer says what the head does, and
            `just dereference` and then `.meta/say/post landed <n>` before you
            hand it over. `dereference` reads the citations this branch wrote
            against the entries they name; it is not a gate and blocks nothing,
            so answer its `x` by fixing the sentence, or by leaving it and
            saying why on the pull request (solorepo's DR-134).

            When authoring or modifying docstrings, comments, or documentation,
            apply the /technical-writing skill (solorepo's DR-194, solorepo's DR-198,
            solorepo's DR-207): ensure item docstrings are Diátaxis Reference
            contracts without reviewer litigation (solorepo's DR-175), hold source
            comments to the four permissible exceptions (pruning inline narration,
            routing defect narratives to companion <module>.history.md logs naming probe
            Evidence under solorepo's DR-171, and mechanizing informal constraints
            before pruning), audit lint and type suppressions as defects, and
            dereference all citations.

            Before you hand the branch over as finished, reread your diff
            against origin/main to verify quality and consistency.
            What you spot is yours to act on or not; what you decide not to
            do you raise as a notice on the diff with `.meta/say/post notice`.

            `easy` and `medium`: request review: `.meta/say/move request-review <n>`
            and stop. The reviewer approves when clean, and a standing merge manager
            lands what is green in order of leverage (solorepo's DR-161).
            Do not arm the merge and do not merge by hand: the merge manager evaluates and lands
            eligible work. Do so the moment the branch is pushed and the body is
            final, and do not wait for the checks (solorepo's #102). A surviving notice
            is promoted at approval, not now (solorepo's DR-159).

            If you cannot finish — a decision only the solo can take, a gate
            that will not go green, work larger than it looked —
            `.meta/say/move stop ${{ github.event.issue.number || inputs.issue }}` with why on
            stdin. It hands the Issue to the solo and leaves the pull request
            open for the run that takes it up again.

            Do not answer any thread, do not merge by hand, and do not reach
            GitHub any other way: the hook refuses `gh pr create`, `gh pr
            comment`, `gh issue edit`, `gh issue comment` and `gh api`.

      # The pass a merge on `main` dispatches (solorepo's DR-133). Nothing here
      # is a verdict to answer: what the pull request is waiting on is a review
      # nobody can run or a landing the merge manager cannot make, and both wait
      # on the same thing — the branch moved onto what landed under it, which is
      # the one thing no workflow can do for it. `gh pr update-branch` is refused
      # on a conflicting branch, and a conflict is the change made again over what
