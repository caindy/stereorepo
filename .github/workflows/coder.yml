# The coder Role, taking an Issue by its difficulty label (solorepo's DR-112).
#
# An Issue labelled `easy` or `medium` is a Challenge somebody has guessed a
# loop can take. This is the loop. It runs where the label lands, in a
# container that holds one token — the coder's — claims the Issue, does the
# work under the Disciplines, and leaves a pull request that can be merged:
# gate green, branch pushed, body filled, what landed posted, merge armed,
# and for `medium` a review requested first. What it cannot finish it hands
# to the solo by relabelling `human` and saying why.
#
# Nothing here restates how to work. `AGENTS.md`, the Disciplines and the two
# forms are the checkout's; this file decides when the coder runs, as whom it
# speaks, and how deep it goes. The coder must write, so its allowance is a
# coder's, and the bound on it is the ruleset, the gate and review rather than
# the reviewer's reading hook.
name: coder

on:
  issues:
    types: [labeled]
  # The reviewer's request for changes is the coder's second run: solorepo's DR-112
  # promised it and #102 sat with a verdict and no Job to take it. The
  # dispatch runs that pass by hand, for a verdict the event passed by.
  pull_request_review:
    types: [submitted]
  workflow_dispatch:
    inputs:
      pull_request:
        description: the pull request whose review the coder answers
        required: true

# One run per Issue or per pull request at a time. A second label on the
# same Issue, or a second verdict on the same pull request, waits rather than
# starting a second branch. The review's state is in the key because every
# reply on a thread is a submitted review too — an empty one, `commented` —
# and GitHub keeps one pending run per group: keyed by number alone, a reply
# arriving while a run is in progress cancels the pending verdict behind it
# and leaves a run that skips, which is how #141's verdict would have gone
# the way #102's did. Keyed by state, a `commented` event can cancel only
# another `commented`, which was going to skip anyway. A dispatch is the
# by-hand form of a verdict, so it takes the verdict's key and waits behind
# one rather than running beside it.
concurrency:
  group: coder-${{ github.event.issue.number || github.event.pull_request.number || inputs.pull_request }}-${{ github.event.review.state || (inputs.pull_request && 'changes_requested') || 'take' }}
  cancel-in-progress: false

# The workflow's own token reads. Every write goes through the coder's
# credential, so what GitHub records is the Role and not the workflow.
permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  coder:
    name: coder
    # Only a difficulty a loop takes, on a Challenge: `hard` and `human` are
    # not this Job's, and a `roadmap` Issue is deferred by definition. Or the
    # reviewer's account requesting changes on a branch this loop opened. Or
    # the solo dispatching that second pass by hand.
    if: >-
      (github.event_name == 'issues'
        && github.event.issue.state == 'open'
        && (github.event.label.name == 'easy' || github.event.label.name == 'medium')
        && contains(github.event.issue.labels.*.name, 'challenge'))
      || (github.event_name == 'pull_request_review'
        && github.event.review.state == 'changes_requested'
        && github.event.review.user.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)
        && startsWith(github.event.pull_request.head.ref, 'claude/issue-'))
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # pinned below, recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
      AI_AGENT: anthropics/claude-code-action@v1
    steps:
      # Full history so the coder can read what was already true, and no
      # token in `.git/config` from the checkout: the action writes the
      # coder's own for the push.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Which pull request a second pass answers: the event's, or the
      # dispatch's. Its branch is checked out below so the work continues
      # where the first pass left it.
      - name: find the pull request
        id: pr
        if: github.event_name != 'issues'
        run: |
          n="${EVENT_PR:-$INPUT_PR}"
          branch=$(gh pr view "$n" --json headRefName -q .headRefName)
          printf 'number=%s\nbranch=%s\n' "$n" "$branch" >> "$GITHUB_OUTPUT"
          git checkout --quiet "$branch"
          cat "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pull_request }}

      # The Role's credential, where `.meta/say/` expects it by default
      # (solorepo's DR-073, DR-107): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the coder's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          .meta/say/whoami
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}

      # One run per Challenge. A label supplied at creation fires `labeled`
      # like any other — GitHub's workflow reference: an Issue opened with two
      # labels starts three runs, one `opened` and two `labeled` — so
      # `labeled` alone is the trigger and a Challenge filed in one act is one
      # run. What can still arrive twice is a level moved under a run, and the
      # event's payload is frozen at delivery, so the job's `if` cannot see
      # what happened while the run it waited on was standing. Four facts
      # are read now, each into its own assignment so that a read which fails
      # aborts the step rather than reading as empty, and `by` carries a word
      # for every delivery that must not run, so that it is never empty by
      # accident: whether the Issue is still open, since one closed by its
      # own merge since the delivery is finished work; its *current*
      # difficulty, since a run that handed it back left it `human` and a
      # stale delivery must not take it up again; the open pull request on
      # its branch, which every taken Issue has, opened before the work and
      # left open by `say stop`; and the claim,
      # which only a run still standing holds — `say stop` releases it, and
      # the last step below hands back a run that ended at its budget without
      # saying so, so that this is true of every way a run ends. Claimed with
      # a pull request open is a duplicate, skipped and said so; a pull
      # request with no claim and a level a loop takes is a hand-back the solo
      # has answered, and the run continues under it.
      - name: is it taken already
        id: taken
        if: github.event_name == 'issues'
        run: |
          open=$(gh pr list --state open --head "claude/issue-$ISSUE" --json number --jq '.[].number')
          issue=$(gh issue view "$ISSUE" --json state,assignees,labels)
          state=$(jq -r .state <<<"$issue")
          mine=$(jq -r --arg c "$CODER" '.assignees[].login | select(. == $c)' <<<"$issue")
          level=$(jq -r '[.labels[].name | select(. == "easy" or . == "medium")][0] // ""' <<<"$issue")
          if [ "$state" != OPEN ]; then
            printf 'by=closed\n' >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is closed now; this delivery is stale"
          elif [ -n "$open" ] && [ -n "$mine" ]; then
            printf 'by=%s\n' "$open" >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is claimed by $mine and has open pull request #$open; this delivery is a duplicate"
          elif [ -z "$level" ]; then
            printf 'by=stale\n' >> "$GITHUB_OUTPUT"
            echo "#$ISSUE is labelled '$(jq -r '[.labels[].name] | join(", ")' <<<"$issue")' now; this delivery is stale"
          else
            printf 'by=\nresume=%s\nlevel=%s\n' "$open" "$level" >> "$GITHUB_OUTPUT"
            [ -z "$open" ] || echo "#$ISSUE has open pull request #$open and no claim: a hand-back, taken up again"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          CODER: ${{ format('{0}-{1}-coder', github.repository_owner, github.event.repository.name) }}

      # Depth by the label. `easy` is the smaller model and an hour at most;
      # `medium` is the larger and the whole budget. The guess is the
      # raiser's, and a wrong one costs a run before anyone relabels.
      - name: choose the depth
        id: depth
        run: |
          printf 'level=%s\n' "$LEVEL" >> "$GITHUB_OUTPUT"
          if [ "$LEVEL" = medium ]; then
            printf 'model=claude-opus-5\nturns=120\nminutes=60\n' >> "$GITHUB_OUTPUT"
          else
            printf 'model=claude-sonnet-5\nturns=60\nminutes=30\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
        env:
          # The level the guard read from the Issue now, not the one the
          # frozen delivery carried: a level moved while this run waited in
          # the concurrency group is the level the run must take (#117). A
          # second pass is the larger model whatever the label was: the
          # threads it answers were written by the deeper reviewer.
          LEVEL: ${{ steps.taken.outputs.level || 'medium' }}

      - name: take the Issue
        id: take
        if: github.event_name == 'issues' && steps.taken.outputs.by == ''
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls and the push as the Role too, so
          # nothing in the run is authored by an App or a bot.
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          # The transcript, in the run log: the run is the only record of
          # what the coder did between the Issue and the pull request.
          show_full_output: "true"
          prompt: |
            You are the coder Role (solorepo's DR-107), taking Issue #${{ github.event.issue.number }}
            of ${{ github.repository }}, labelled `${{ steps.depth.outputs.level }}`.
            Read /pr-first: it is the coder's reading of PR First, and lists
            your verbs, what each does and where the judgement is; `AGENTS.md`
            has the conventions. Every act on GitHub goes through the channel,
            `.meta/say/post` to say something and `.meta/say/move` to change
            state; each verb is a step of the Discipline, takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit -m "<subject>"` and
            never `git commit`; only the channel signs.

            Claim it: `.meta/say/move claim ${{ github.event.issue.number }}`.
            Read it: `gh issue view ${{ github.event.issue.number }}`.
            Branch as `claude/issue-${{ github.event.issue.number }}` from
            `origin/main`, push at the first commit, and open the pull request
            at once with `.meta/say/move open`, the form filled and the Issue named
            under "What it closes". ${{ steps.taken.outputs.resume && format('A run before this one stopped and left pull request #{0} open on that branch: check the branch out and continue under it, and do not branch or open again.', steps.taken.outputs.resume) || 'No run has taken this Issue before.' }}
            Below, `<n>` is that pull request's number, never the Issue's;
            `revise` and `comment` take either.

            Do what the Issue asks and no more. Gate green with
            `.meta/gate meta`, commit and push as you go, `.meta/say/move revise <n>`
            when the body no longer says what the head does, and
            `.meta/say/post landed <n>` before you hand it over.

            `easy`: `.meta/say/move merge <n> --auto`; green is the review.
            `medium`: `.meta/say/move request-review <n>` and stop; the reviewer
            arms the merge, and a request for changes comes back to you as a
            new run. Do either the moment the branch is pushed and the body is
            final, and do not wait for the checks (#102).

            If you cannot finish — a decision only the solo can take, a gate
            that will not go green, work larger than it looked —
            `.meta/say/move stop ${{ github.event.issue.number }}` with why on
            stdin. It hands the Issue to the solo and leaves the pull request
            open for the run that takes it up again.

            Do not answer any thread, do not merge by hand, and do not reach
            GitHub any other way: the hook refuses `gh pr create`, `gh pr
            comment`, `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"

      # A run that ended without finishing — the step's timeout, the turn
      # limit, a crash — and without saying so has left the Issue claimed and
      # its pull request open, which is what a standing run looks like, so
      # every later delivery would read as a duplicate and the Challenge
      # would be unreachable except by hand. The exit status alone cannot say
      # that: a run that finished its work and then sat waiting on the checks
      # (#102) ends the same way, and so does one that ran `say stop` itself
      # and then ran out. So this asks what a finished run leaves. Two of the
      # witnesses live on an *open* pull request — a review requested for
      # `medium`, the merge armed for `easy` — and for `easy` the arming is
      # not a resting state but an instruction GitHub carries out: when it is,
      # the pull request closes, the Challenge closes with it, and both
      # witnesses go with them (#117). The facts that survive that are the
      # Issue's `state`, which the guard above already reads for the same
      # reason, and the merge on this branch, which says the work landed even
      # where no closing keyword closed the Issue. A run that stopped itself
      # left the level at `human`. On any of those there is nothing to hand
      # back, and an account written from the exit status would be false.
      # Otherwise the hand-back is the act the run would have performed,
      # through the same verb.
      - name: hand back what the run did not finish
        if: >-
          always() && github.event_name == 'issues' && steps.taken.outputs.by == ''
          && steps.take.outcome != 'success' && steps.take.outcome != 'skipped'
        run: |
          issue=$(gh issue view "$ISSUE" --json state,labels)
          state=$(jq -r .state <<<"$issue")
          level=$(jq -r '[.labels[].name | select(. == "easy" or . == "medium" or . == "hard" or . == "human")][0] // ""' <<<"$issue")
          handed=$(gh pr list --state open --head "claude/issue-$ISSUE" --json reviewRequests,autoMergeRequest \
                   --jq '.[] | ((.reviewRequests | length) > 0) or (.autoMergeRequest != null)')
          merged=$(gh pr list --state merged --head "claude/issue-$ISSUE" --json number --jq '.[0].number // empty')
          if [ "$state" != OPEN ]; then
            echo "#$ISSUE is closed; a Challenge GitHub has closed has nothing to hand back"
          elif [ -n "$merged" ]; then
            echo "#$ISSUE's pull request #$merged has merged; the run finished and then ran out"
          elif [ "$level" = human ]; then
            echo "#$ISSUE is already at human; the run handed it back itself"
          elif [ "$handed" = true ]; then
            echo "#$ISSUE's pull request has its review requested or its merge armed; the run finished and then ran out"
          else
            .meta/say/move stop "$ISSUE" <<EOF
          This run ended at its budget without finishing and without saying where it stopped: its step ended $OUTCOME. What it did is in the run log, $RUN. The pull request it opened, if it opened one, is on \`claude/issue-$ISSUE\` and stays open for the run that takes this up again.
          EOF
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          OUTCOME: ${{ steps.take.outcome }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: answer the review
        if: github.event_name != 'issues'
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CODER_GH_TOKEN }}
          show_full_output: "true"
          prompt: |
            You are the coder Role (solorepo's DR-107), answering the reviewer's request
            for changes on pull request #${{ steps.pr.outputs.number }} of
            ${{ github.repository }}, on the branch
            `${{ steps.pr.outputs.branch }}`, which a run of yours opened and
            is checked out here. Read /pr-first, the coder's reading of PR
            First, for what a reviewer's point is owed and which verbs are
            yours; `AGENTS.md` has the conventions. Every act on GitHub goes
            through the channel, `.meta/say/post` to say something and
            `.meta/say/move` to change state; each verb takes its body on
            stdin as a quoted heredoc, and a refusal names the verb to use
            instead. Commit through `.meta/say/commit` only.

            Read the threads: `python3 .meta/check_pr.py ${{ steps.pr.outputs.number }} --threads`,
            and the verdict: `gh pr view ${{ steps.pr.outputs.number }} --comments`.
            A point is right, right about something else, or overtaken by the
            diff, and only the first is a change to make; all three are owed
            a reply that says which. Make the changes, gate green with
            `.meta/gate meta`, commit and push. Then `.meta/say/post answer
            <thread-id>` on every thread, which replies and resolves; a thread
            marked "Noticed and not done" is the solo's and stays open.
            `.meta/say/move revise ${{ steps.pr.outputs.number }}` if the body no
            longer says what the head does, `.meta/say/post landed ${{ steps.pr.outputs.number }}`,
            then `.meta/say/move request-review ${{ steps.pr.outputs.number }}` and
            stop. Do not arm the merge, and do not wait for the checks.

            Do not merge by hand, and do not reach GitHub any other way: the
            hook refuses `gh pr create`, `gh pr comment`, `gh pr review`,
            `gh issue edit`, `gh issue comment` and `gh api`.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --permission-mode acceptEdits
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,Skill,Agent"
