                        "thinkingConfig": {
                          "thinkingLevel": "${{ steps.depth.outputs.gemini_thinking == 'low' && 'LOW' || 'HIGH' }}",
                          "includeThoughts": true
                        }
                      }
                    }
                  },
                  {
                    "match": {
                      "model": "${{ steps.depth.outputs.gemini_model }}"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "${{ steps.depth.outputs.gemini_thinking == 'low' && 'LOW' || 'HIGH' }}",
