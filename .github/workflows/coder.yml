      # When Claude Code fails on rate limit or weekly token exhaustion (HTTP 429),
      # fall back to Gemini CLI so promotion does not stall.
      - name: detect claude quota error (promote)
        id: claude_quota_promote
        if: >-
          github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
          && steps.taken.outputs.by == '' && steps.pr.outputs.by == ''
          && steps.promote.outputs.count != '0' && steps.harness.outputs.harness == 'claude'
          && steps.promote_claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.promote_claude.outputs.execution_file }}
        run: |
          python3 -c '
          import json, os, sys
          file = os.environ.get("EXECUTION_FILE") or os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "claude-execution-output.json")
          fallback = False
          if os.path.exists(file):
              try:
                  with open(file) as f:
                      data = json.load(f)
                  entries = data if isinstance(data, list) else [data]
                  for item in entries:
                      if isinstance(item, dict):
                          if item.get("api_error_status") == 429 or item.get("error") == "rate_limit" or any(k in str(item.get("result", "")).lower() for k in ["limit", "quota", "rate"]):
                              fallback = True
                              break
              except Exception as e:
                  print(f"Error parsing {file}: {e}", file=sys.stderr)
              if not fallback:
                  try:
                      with open(file) as f:
                          raw = f.read().lower()
                      if "429" in raw or "rate_limit" in raw or "weekly limit" in raw or "hit your" in raw:
                          fallback = True
                  except Exception as e:
                      print(f"Error reading {file}: {e}", file=sys.stderr)
          print(f"Claude failure detected (quota={fallback}); activating Gemini fallback.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("fallback=true\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("AI_AGENT=google-github-actions/run-gemini-cli\n")
          '

      - name: promote on approval (gemini)
        id: promote_gemini
        if: >-
          github.event_name == 'pull_request_review' && github.event.review.state == 'approved'
          && steps.taken.outputs.by == '' && steps.pr.outputs.by == ''
          && steps.promote.outputs.count != '0'
          && (steps.harness.outputs.harness == 'gemini' || steps.claude_quota_promote.outputs.fallback == 'true')
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GH_TOKEN: ${{ secrets.CODER_GH_TOKEN }}
