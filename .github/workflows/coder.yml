            printf 'model=claude-sonnet-5\ngemini_model=gemini-3.8-flash\ngemini_thinking=low\nturns=30\nminutes=15\n' >> "$GITHUB_OUTPUT"
          elif [ "$LEVEL" = medium ]; then
            printf 'model=claude-opus-5\ngemini_model=gemini-3.8-flash\ngemini_thinking=high\nturns=120\nminutes=60\n' >> "$GITHUB_OUTPUT"
