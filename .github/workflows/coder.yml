          --claude "$CLAUDE" --gemini "$GEMINI" --count "$COUNT" --branch-prefix "$PREFIX"
        env:
          NUMBER: ${{ steps.before.outputs.pass == 'take' && (github.event.issue.number || inputs.issue) || steps.before.outputs.number }}
          PASS: ${{ steps.before.outputs.pass }}
          EVENT: ${{ github.event_name }}
          CLAUDE: >-
            ${{ steps.before.outputs.pass == 'take' && steps.take_claude.outcome
                || steps.before.outputs.pass == 'rebase' && steps.rebase_claude.outcome
                || steps.before.outputs.pass == 'answer' && steps.answer_claude.outcome
                || steps.promote_claude.outcome }}
          GEMINI: >-
            ${{ steps.before.outputs.pass == 'take' && steps.take_gemini.outcome
                || steps.before.outputs.pass == 'rebase' && steps.rebase_gemini.outcome
                || steps.before.outputs.pass == 'answer' && steps.answer_gemini.outcome
                || steps.promote_gemini.outcome }}
          COUNT: ${{ steps.before.outputs.count }}
          PREFIX: ${{ steps.before.outputs.branch_prefix }}
