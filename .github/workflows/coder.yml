            dereference all citations.

            Before you hand the branch over as finished, reread your diff
            against origin/main to verify quality and consistency.
            What you spot is yours to act on or not; what you decide not to
            do you raise as a notice on the diff with `.meta/say/post notice`.

            `easy` and `medium`: if you raised any notice on the diff, promote each
            surviving thread with `.meta/say/post promote <thread-id> --title T --difficulty hard < issue-body.md`
            and revise the body with `.meta/say/move revise <n>` to list the promoted
            Issue(s) under `**What was noticed and not done.**`; then request review:
            `.meta/say/move request-review <n>` and stop. The reviewer approves when clean,
            and a standing merge manager lands what is green in order of leverage (solorepo's DR-161).
            Do not arm the merge and do not merge by hand: the merge manager evaluates and lands
            eligible work. Do either the moment the branch is pushed and the body is
            final, and do not wait for the checks (solorepo's #102).

            If you cannot finish — a decision only the solo can take, a gate
            that will not go green, work larger than it looked —
            `.meta/say/move stop ${{ github.event.issue.number }}` with why on
            stdin. It hands the Issue to the solo and leaves the pull request
            open for the run that takes it up again.

