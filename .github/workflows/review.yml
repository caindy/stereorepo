# The reviewer Role, answering a review request (solorepo's DR-109).
#
# PR First's handoff is a review request: the coder names the reviewer's
# account and GitHub holds the request. This is the arriving Job. It runs where
# the event lands, in a container that holds one token — the reviewer's — which
# is the credential boundary solorepo's DR-073 said this machine cannot provide.
#
# Nothing here restates how to review. The pull request Discipline is the
# skill the checkout carries, and the code-review plugin is Claude Code's own;
# this file decides when the reviewer runs, as whom it speaks, and what it may
# read (solorepo's DR-110).
#
# On a `pull_request` event GitHub runs the workflow file from the pull
# request's own merge ref, so this file is the diff's. A change to it is
# reviewed by the reviewer it defines and read by the solo before it merges;
# nothing below can make that otherwise, and nothing below claims to.
name: review

on:
  pull_request:
    # The request, and a new head while the request is still outstanding:
    # a review answers the head it was asked about, and a push after the
    # ask moves the question. A push with no request pending runs nothing.
    types: [review_requested, synchronize]

# One run per pull request, on the head that is current. A head that moves
# after the ask moves the question: both `.meta/say/post review` and
# `.meta/say/post raise` refuse when the head moved under the run (solorepo's #566,
# solorepo's #572, solorepo's DR-253), so a run left going across a move posts
# neither findings nor a verdict against another head. A moved head cancels it — a push,
# a rebase GitHub performs on a layer, a retarget — and nothing else does, because
# concurrency is settled before any job's `if:` and a request naming somebody
# else would otherwise kill the run it then declines to be. A move by
# the reviewer's account is its own doing and cancels nothing.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' && github.actor != format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name) }}

# The workflow's own token reads. Every write goes through the reviewer's
# credential, so what GitHub records is the Role and not the workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  reviewer:
    name: reviewer
    # Only a request of this Role's account, made now or still pending. A
    # request of the solo, or of anyone else, is not this Job's.
    if: >-
      (github.event.action == 'review_requested'
        && github.event.requested_reviewer.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name))
      || (github.event.action == 'synchronize'
        && contains(github.event.pull_request.requested_reviewers.*.login, format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)))
    # The self-hosted scale set (solorepo's DR-137): this Job is what actually
    # spends GitHub Actions minutes, holding a runner for up to the timeout
    # below on every review. It moved here first, ahead of `gate.yml`'s
    # required checks, which followed under solorepo's DR-140.
    runs-on: arc-runner-set
    timeout-minutes: 50
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
      # Fall back to Antigravity CLI (agy) if enabled by the GEMINI_FALLBACK toggle
      # (solorepo's DR-178, solorepo's DR-245); set vars.GEMINI_FALLBACK to 'true' to enable.
      GEMINI_FALLBACK: ${{ vars.GEMINI_FALLBACK || 'false' }}
      # The head this run reads, and the one its verdict must be recorded
      # against (solorepo's #566). Two of the three things the run reads are
      # pinned to it: the head's trunk paths under `.review/head/` and the
      # commit the prompt names. The diff is not — the door's `gh pr diff`
      # takes the pull request's number rather than a sha, so `.review/diff.patch`
      # is whatever head GitHub holds when `before the session` runs. GitHub likewise records
      # a review against whatever the head is when the review lands. A push the
      # cancel above did not reach in time moves those apart, and
      # `.meta/say/post review` reads this to refuse rather than file the
      # reading of one commit against another. Job-level, so it reaches the
      # session's shell the way `ACTOR_SESSION` does.
      SOLOREPO_REVIEW_HEAD: ${{ github.event.pull_request.head.sha }}
      # Where the hook writes Evidence, as the job's default (solorepo's #645):
      # each harness step that runs the hook points this at its own file,
      # `.review/hook-claude.evidence` or `.review/hook-agy.evidence`, and
      # `after the session` reads the one for the harness that ran. Jules
      # leaves the default in place and leaves no Evidence, so nothing reads
      # this path itself.
      # `_registration` in `.meta/checks/probes/git/step.py` verifies the
      # registration, command, matcher, and Evidence format before the session
      # starts, but cannot verify that an action release honors the settings.
      # A release that changes its input schema or stops writing the settings
      # can leave the session with no hook while every precheck passes.
      # Job-level environment reaches hook subprocesses; `github.workspace` is
      # available here while the runner context is not. `.review/` is scratch
      # that `before the session` removes before it writes, preventing reused
      # runners from carrying Evidence of an earlier run.
      SOLOREPO_HOOK_EVIDENCE: ${{ github.workspace }}/.review/hook.evidence
    steps:
      # No token left in `.git/config`: the transcript is in the run log, and
      # a read of that file would put the token there past the masking. Full
      # history, so `git log` can say what was already true of a file, and
      # the head the merge ref was built from is reachable for `git show`.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `ubuntu-latest` ships `gh`; the self-hosted image (solorepo's DR-137) does
      # not, and `.meta/say/channel.py` shells out to it for every read and
      # write here.
      - uses: ./.meta/actions/gh

      # Fourteen paths are trunk's, not the pull request's: the channel, the
      # hooks, the checker, the channel's own body, the packages of the
      # checker and of both hooks, the shared gh runner, and the `.meta/lib/` initialiser
      # they are all imported through — under `.meta/lib/` the initialiser, the
      # shared gh runner, and the packages of the control-plane scripts, the checker,
      # both hooks and the channel, and not the directory, whose remaining packages are the
      # bodies of scripts the pull request may change (solorepo's DR-219, solorepo's #748) —
      # the settings that register them, the
      # instructions the session loads before it reads anything, and the
      # `justfile`, which spells the gate the session runs as `just pr <n>`
      # and is pinned so that no pull request defines its own gate. The gate step `control plane
      # restore` holds this list to `depth.CONTROL_PLANE`, and the door below
      # reads that constant for the head's copies and the constraints.
      # The action
      # restores `.claude/` from `main` on its own and its log says so; the
      # restore is done here too, because a property this file enforces
      # beats one it hopes for from a floating `@v1`. Index and worktree
      # both, so `git status` and `git diff` show nothing for them and the
      # prompt says which they are. `origin/main` is already here from the
      # full checkout; nothing is fetched and no token is assembled. The
      # restore is no-overlay, so a file a pull request adds under these
      # paths is gone before the run reads anything — which is the point,
      # and is also why the hook the action registers below must already
      # be trunk's (solorepo's #87): a hook that is missing does not block, so its
      # absence is tested here and is a red run rather than an open one.
      - name: run trunk's channel
        run: |
          git restore --quiet --source=origin/main --staged --worktree -- \
            .claude .meta/say .meta/hooks .meta/check_pr.py .meta/lib/__init__.py .meta/lib/gh.py .meta/lib/check_pr .meta/lib/move .meta/lib/worktree_only .meta/lib/signed_channel AGENTS.md CLAUDE.md GEMINI.md justfile
          test -x .meta/hooks/worktree_only.py
          test -x .meta/hooks/signed_channel.py

      # Materialize single-source APM cognitive assets (.agents/skills, .gemini/, .codex/)
      # so Gemini CLI and other harnesses find identical skills as Claude Code (solorepo's DR-172, solorepo's DR-201, solorepo's #430).
      - name: reconcile multi-harness cognitive assets
        run: |
          python3 .meta/apm_compile.py --reconcile

      # Verify that no symlink in the checked-out worktree escapes the repository root or enters .git/
      # before provisioning credentials or executing reviewer tools (solorepo's DR-251, solorepo's #458).
      - name: verify worktree symlinks
        run: |
          python3 .meta/hooks/worktree_only.py --audit-symlinks

      # The Role's credential, where `.meta/say/<program> --role reviewer` expects it
      # (solorepo's DR-073, DR-107): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the reviewer's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/reviewer.env
          printf 'GH_TOKEN=%s\n' "$REVIEWER_GH_TOKEN" > ~/.config/solorepo/reviewer.env
          .meta/say/whoami --role reviewer
        env:
          REVIEWER_GH_TOKEN: ${{ secrets.REVIEWER_GH_TOKEN }}

      # The door's two phases are one program of the channel, `.meta/say/on`
      # (solorepo's DR-264), run after the restore above so that what runs is
      # trunk's. Before the session: which harness reviews, by the pull
      # request's own label (solorepo's DR-242), named under `ACTOR_AGENT`,
      # which the channel reads in a run, beside the `AI_AGENT` the harness
      # overwrites with its own build string (solorepo's DR-233); how deep, by
      # `.meta/depth.py` under its four-layer pipeline (solorepo's DR-188),
      # every field a step output; the diff, the head's copies of the trunk
      # paths, and the constraints every agent reads, written under
      # `.review/`, since each exceeds what a shell result carries whole
      # (solorepo's #196); and what this Role has already said on the pull
      # request, counted so that only a verdict the session itself posts
      # satisfies the door after it (solorepo's DR-122).
      #
      # The model and the minutes by what changed; the turn cap by what a
      # review takes. A diff that touches the boundary — the channel, the
      # hooks, the settings, the workflows — gets Opus at the skill's high
      # effort and most of an hour, which is what it took to find the holes
      # in the hook (solorepo's #86, #87). Everything else gets Sonnet at medium and a
      # quarter of an hour: a decision record does not need an audit, and an
      # audit of one is where a month goes. The minutes are the cost bound.
      # The turns are a loop guard and follow the procedure, not the diff:
      # the first reviews that finished took 40 and 84 turns, re-reviews 12
      # to 24, and a cap of 25 was hit three times with nothing posted
      # (solorepo's DR-126). One cap on both paths, a hundred and twenty,
      # above the largest first review seen with room; a run that reaches it
      # is looping — bouncing off the hook, or holding for a subagent — and
      # is read as a red run rather than re-requested deeper.
      #
      # The agents by the same path, and unlike the turns they are wall clock
      # rather than a guard: solorepo's DR-122 requires every agent a review
      # spawns in the foreground, and what the timing measures is the sum of
      # them. That is where an initial review's 11 to 15 minutes go
      # (solorepo's #303), and most of it is a persona reading the same diff
      # for a dimension the change does not have. The
      # boundary path keeps three, which is a judgement and not a derivation:
      # the minutes would afford three times it, and what recommends three is
      # that breadth here is what found the holes in the hook
      # (solorepo's #86, #87), while three at the three to four minutes an
      # agent takes puts the pass under ten minutes rather than over fifteen.
      # Everything else gets one: a
      # decision record, a page, a script has one dimension, and a second
      # agent on it reads the same diff for the same thing. The number is a
      # ceiling on what the session spawns and not a quota to fill, so a
      # diff with one dimension gets one agent under either ceiling.
      - name: before the session
        id: before
        run: .meta/say/on --role reviewer reviewer before "$PR"
        env:
          PR: ${{ github.event.pull_request.number }}

      - name: review the pull request (claude)
        id: review_claude
        if: steps.before.outputs.harness == 'claude'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.before.outputs.minutes) }}
        env:
          CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS: ${{ steps.before.outputs.agents }}
          SOLOREPO_HOOK_EVIDENCE: ${{ github.workspace }}/.review/hook-claude.evidence
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls as the Role too, so nothing in the
          # run is authored by an App or a bot.
          github_token: ${{ secrets.REVIEWER_GH_TOKEN }}
          # The transcript, in the run log. Hidden by default; here the run is
          # the only record of what the reviewer did, and its first run posted
          # nothing while reporting success (solorepo's #85). `gh run view
          # <id> --log` prints this step cut off at about two minutes; the
          # whole of it is in the archive the CLI caches at
          # `~/.cache/gh/run-log-<id>-*.zip`, where `0_reviewer.txt` holds the
          # complete transcript and the `result` event with turns and cost
          # (solorepo's #122).
          show_full_output: "true"
          # The bound on reading, registered here and nowhere else (solorepo's DR-110):
          # a `Read`, `Grep` or `Glob` resolves inside the worktree and
          # outside `.git/`, and a `git` command carries no option that runs
          # a program or writes a file. A hook, because it is the one layer
          # that sees an argument rather than a prefix: `git grep -O` runs a
          # shell and `git log --output=.meta/say` rewrites the channel, and
          # no prefix list excludes an option. The script is one of the trunk
          # paths restored above, so it is trunk's.
          settings: |
            {"hooks": {"PreToolUse": [{"matcher": "Bash|Read|Grep|Glob",
              "hooks": [{"type": "command", "command": "$CLAUDE_PROJECT_DIR/.meta/hooks/worktree_only.py"}]}]}}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Your Personality is work:personality/reviewer: Analytical and thorough. Holds the diff to the Disciplines and the Charter strictly. Clear and precise in identification of issues; concise yet unambiguous in argument.

            You are the reviewer Role (solorepo's DR-107), answering a review request on
            pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. Read /pr-first-reviewer first: it is
            the reviewer's reading of PR First, and says what a pull request
            here must hold, what a reviewer's point owes, and which verbs
            are yours.

            Then read `.review/constraints.md` with the Read tool. It was
            written before this session and says where the diff is, which
            paths in the worktree are trunk's and not this pull request's,
            where the pull request's own version of those is, and what the
            shell here takes. It binds you and every agent you spawn.

            Then read what this Role has already said on it, before saying
            anything: `just pr ${{ github.event.pull_request.number }} --threads`.
            It lists every verdict with the head GitHub recorded it against
            and the login that gave it, then the threads owed an answer, the
            ones held for promotion, and the ones answered and resolved. Your
            login is `${{ github.repository_owner }}-${{ github.event.repository.name }}-reviewer`;
            a verdict by any other login, the solo's approval among them, is
            not this Role's and decides nothing here, and a `DISMISSED` one
            was withdrawn and decides nothing, whatever head it names. A run before this one may have raised
            points and been cancelled by a push before its verdict. A point
            already on the pull request is not raised again; where the new
            head changes it, answer in its thread.

            A long argument makes a long listing, and a shell result past
            about 30 KB arrives as its first 2 KB and the path of a file
            holding the whole; the verdicts print before everything else so
            the preview holds the newest, and the file is read with the Read
            tool before anything is decided from the preview.

            If the listing shows a verdict of this Role and threads it raised
            answered and resolved, this is a re-review, not a review: read
            each answer against the diff between the head the verdict names
            and this one, `git diff <that-head> ${{ github.event.pull_request.head.sha }}`.
            The head GitHub records on a verdict is the head current when it
            was posted, which is newer than the one the run read if a push
            landed during the run; and a rebase of an open branch orphans
            the old head, so where `git diff` cannot resolve that head, read
            the pull request's whole diff at `.review/diff.patch` and each
            answer in its thread instead. Say in the thread where an answer does not hold,
            and post the verdict. Do not run the code-review skill again on
            a head a verdict of this Role already names, nor on a head that
            differs from one only by the answers; its agents cost the turns the verdict
            needs (solorepo's #102), and on solorepo's #117 every pass ran it again because the
            listing hid what had been resolved (solorepo's #122). Do not wait for
            pending checks to finish: `gh pr checks` exits non-zero while a check
            is pending, and the standing merge manager evaluates completed checks
            before landing. However, inspect completed checks on this head with
            `gh pr checks ${{ github.event.pull_request.number }}` and test form
            compliance with `just pr ${{ github.event.pull_request.number }}`.

            Then review with /code-review:code-review ${{ steps.before.outputs.effort }} ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            without --comment. Every agent the review spawns is bound by
            `.review/constraints.md` too, and hand it that line rather than
            the paragraphs: writing them out once per agent is what made the
            fourth agent start nearly a minute after the first (solorepo's #196).

            Scope that pass before you spawn it (solorepo's DR-166). Every
            agent runs in the foreground and the pass has been costing the sum
            of its agents: that is where an initial review's 11 to 15 minutes
            go (solorepo's #303). Name
            the dimensions this diff actually has, from `.review/diff.patch`
            which you have already read, and spawn no more than
            ${{ steps.before.outputs.agents }} of them, one to a dimension. When
            launching multiple agents for independent work, send them in a
            single message with multiple tool uses so they execute concurrently
            in the foreground, returning together in the same turn rather than
            costing the sum of their sequential executions (solorepo's DR-189).
            If the diff
            modifies docstrings, comments, Decision Records, or markdown files, include
            the Technical Writer pass (evaluating against `work:personality/technical-writer`
            and the Literate Programming rubric of solorepo's DR-175, solorepo's DR-176). A
            dimension this diff does not touch is not reviewed by an agent
            that finds nothing in it; one you can settle from the diff
            yourself does not need an agent either; and no two agents get the
            same dimension in different words. That number is a ceiling and
            not a quota, so a diff with one dimension gets one agent whatever
            the path, and a diff you have read whole gets none.

            Post only through the channel, so every word carries the Trailer.
            Every posting command begins with `.meta/say/post` and takes its
            body as a quoted heredoc on stdin; a command that begins with
            anything else, `cat` or `printf` or `echo`, is not permitted to
            run. Each finding goes on a line of the diff:

                .meta/say/post --role reviewer raise <n> <path> <line> <<'BODY'
                ...
                BODY

            and the verdict carries a body saying what was checked and what
            was found:

                .meta/say/post --role reviewer review <n> --approve|--request-changes|--comment <<'BODY'
                ...
                BODY

            Never `gh pr review`, `gh pr comment` or `gh api`: the hook
            refuses them. Resolve no thread but one a promotion left open.
            Where every comment on a thread carries one Trailer, the reply
            that promotes it says `Left open: ...` and the thread stays open —
            `promote` writing `Promoted to <url>. Left open: ...`, and `post
            answer` putting the same sentence behind the coder's own words:
            A16 accepts a second party's reply or a link, and
            solorepo's DR-224 narrows the link limb, so a thread carrying one
            Trailer waits for a second Job even with the link on it. This run
            is that Job, its `ACTOR_SESSION` being this run's. So before the verdict,
            for each unresolved thread whose last comment is one of those:

                .meta/say/post --role reviewer resolve <thread-id>

            and name in the verdict what you closed. Telling that thread
            from the rest is yours: read the last comment, and resolve only
            where it carries the Issue's URL and the words `Left open:`.
            The verb is a backstop and not the test — it
            refuses a thread every comment of which carries your own Trailer,
            and one with neither a second party nor a promotion link, and
            permits everything else, so a live point you misread as promoted
            would resolve without a murmur. Every other thread is owed an
            answer by whoever the point is for: reply to it, or raise a new
            one, and leave it open.

            Your approval clears the review semaphore for the merge manager. If
            any completed check on this head has failed (in `gh pr checks`), or
            if `just pr ${{ github.event.pull_request.number }}`
            exits non-zero, do NOT approve. An approval on a red head leaves the
            pull request stalled indefinitely: the merge manager will not land
            non-green work and the promotion pass performs no checks. On a
            `claude/issue-*` branch, requesting changes is the semaphore that
            wakes the coder Role to fix breakage; on other branches, it informs
            the author. Post `--request-changes` instead, naming the failing
            checks in "What was found". If all completed checks are green (or
            pending) and the diff is clean, post your approval with
            `.meta/say/post --role reviewer review <n> --approve`. A standing
            merge manager lands what is green in order of leverage
            (solorepo's DR-161). Do not arm the merge and do not merge by hand.

            Your turn ends when the verdict is posted, and not before. The
            run ends when your turn ends: nothing here waits for a background
            agent, whatever the harness's own reference says, and a turn that
            ended "waiting for the agents" is a run that posted nothing —
            solorepo's #130, #138 and #140. So an Agent you spawn runs in the foreground,
            never with `run_in_background`, and its result arrives in the
            same turn; one you did start in the background is read with
            TaskOutput before anything else. The step after this session
            counts your verdicts, and a session that added none is a red run.
          # Which programs, by prefix; what they may reach, by the hook above.
          # The run holds a token, its input is a diff nobody here has vetted,
          # and `signed_channel.py` bounds only the paths to GitHub, not a
          # `curl` to anywhere else with the token file as its body. The
          # first two runs (solorepo's #85, #86) posted nothing because `Skill` was
          # missing from the list, not because the list was a list; the
          # reviewer's own runs argued a blanket allowance back out, then
          # found `git grep -O` inside the list. The shell is the channel,
          # the checker and git; reading is the tools, under the hook.
          claude_args: |
            --model ${{ steps.before.outputs.model }}
            --max-turns ${{ steps.before.outputs.turns }}
            --allowedTools "Skill,Agent,Read(./**),Grep,Glob,Bash(.meta/say/post:*),Bash(.meta/say/move:*),Bash(.meta/say/whoami:*),Bash(just pr:*),Bash(python3 .meta/check_pr.py:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git ls-tree:*)"
            --disallowedTools "Read(./.git/**)"

      - name: review the pull request (agy)
        id: review_gemini
        if: steps.before.outputs.harness == 'gemini' || steps.review_claude.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: ${{ fromJSON(steps.before.outputs.minutes) }}
        env:
          GEMINI_PROJECT_DIR: ${{ github.workspace }}
          SOLOREPO_HOOK_EVIDENCE: ${{ github.workspace }}/.review/hook-agy.evidence
        uses: ./.meta/actions/agy
        with:
          role: reviewer
          model: ${{ steps.before.outputs.gemini_model }}
          effort: ${{ steps.before.outputs.effort }}
          timeout-minutes: ${{ steps.before.outputs.minutes }}
          harness: ${{ steps.before.outputs.harness }}
          agent: ${{ steps.before.outputs.agent }}
          claude-outcome: ${{ steps.review_claude.outcome }}
          execution-file: ${{ steps.review_claude.outputs.execution_file }}
          prompt: |
            Your Personality is work:personality/reviewer: Analytical and thorough. Holds the diff to the Disciplines and the Charter strictly. Clear and precise in identification of issues; concise yet unambiguous in argument.

            You are the reviewer Role (solorepo's DR-107, solorepo's DR-254), answering a review request on
            pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. Read `.agents/skills/pr-first-reviewer/SKILL.md` first with
            the Read tool: it is the reviewer's reading of PR First, and says what a pull request
            here must hold, what a reviewer's point owes, and which verbs
            are yours; `AGENTS.md` (and `GEMINI.md`) has the conventions.

            Then read `.review/constraints.md` with the Read tool. It was
            written before this session and says where the diff is, which
            paths in the worktree are trunk's and not this pull request's,
            where the pull request's own version of those is, and what the
            shell here takes. It binds you and every agent you spawn.

            Then read what this Role has already said on it, before saying
            anything: `just pr ${{ github.event.pull_request.number }} --threads`.
            It lists every verdict with the head GitHub recorded it against
            and the login that gave it, then the threads owed an answer, the
            ones held for promotion, and the ones answered and resolved. Your
            login is `${{ github.repository_owner }}-${{ github.event.repository.name }}-reviewer`;
            a verdict by any other login, the solo's approval among them, is
            not this Role's and decides nothing here, and a `DISMISSED` one
            was withdrawn and decides nothing, whatever head it names. A run before this one may have raised
            points and been cancelled by a push before its verdict. A point
            already on the pull request is not raised again; where the new
            head changes it, answer in its thread.

            A long argument makes a long listing, and a shell result past
            about 30 KB arrives as its first 2 KB and the path of a file
            holding the whole; the verdicts print before everything else so
            the preview holds the newest, and the file is read with the Read
            tool before anything is decided from the preview.

            If the listing shows a verdict of this Role and threads it raised
            answered and resolved, this is a re-review, not a review: read
            each answer against the diff between the head the verdict names
            and this one, `git diff <that-head> ${{ github.event.pull_request.head.sha }}`.
            The head GitHub records on a verdict is the head current when it
            was posted, which is newer than the one the run read if a push
            landed during the run; and a rebase of an open branch orphans
            the old head, so where `git diff` cannot resolve that head, read
            the pull request's whole diff at `.review/diff.patch` and each
            answer in its thread instead. Say in the thread where an answer does not hold,
            and post the verdict. Do not run the code-review skill again on
            a head a verdict of this Role already names, nor on a head that
            differs from one only by the answers; its agents cost the turns the verdict
            needs (solorepo's #102), and on solorepo's #117 every pass ran it again because the
            listing hid what had been resolved (solorepo's #122). Do not wait for
            pending checks to finish: `gh pr checks` exits non-zero while a check
            is pending, and the standing merge manager evaluates completed checks
            before landing. However, inspect completed checks on this head with
            `gh pr checks ${{ github.event.pull_request.number }}` and test form
            compliance with `just pr ${{ github.event.pull_request.number }}`.

            Review the pull request diff across the dimensions it touches directly in this
            session (solorepo's DR-254). Read `.review/diff.patch` whole. Do NOT invoke subagents:
            in headless batch execution, delegating to asynchronous subagents yields the turn and
            terminates the run prematurely before any verdict lands (solorepo's #637). Evaluate
            all dimensions yourself in this session. If the diff modifies docstrings, comments,
            Decision Records, or markdown files, apply the Technical Writer pass directly
            (evaluating against `work:personality/technical-writer` and the Literate Programming
            rubric of solorepo's DR-175, solorepo's DR-176).

            Post only through the channel, so every word carries the Trailer.
            Every posting command begins with `.meta/say/post` and takes its
            body as a quoted heredoc on stdin; a command that begins with
            anything else, `cat` or `printf` or `echo`, is not permitted to
            run. Each finding goes on a line of the diff:

                .meta/say/post --role reviewer raise ${{ github.event.pull_request.number }} <path> <line> <<'BODY'
                ...
                BODY

            and the verdict carries a body saying what was checked and what
            was found:

                .meta/say/post --role reviewer review ${{ github.event.pull_request.number }} --approve|--request-changes|--comment <<'BODY'
                ...
                BODY

            Never `gh pr review`, `gh pr comment` or `gh api`: the hook
            refuses them. Resolve no thread but one a promotion left open.
            Where every comment on a thread carries one Trailer, the reply
            that promotes it says `Left open: ...` and the thread stays open —
            `promote` writing `Promoted to <url>. Left open: ...`, and `post
            answer` putting the same sentence behind the coder's own words:
            A16 accepts a second party's reply or a link, and
            solorepo's DR-224 narrows the link limb, so a thread carrying one
            Trailer waits for a second Job even with the link on it. This run
            is that Job, its `ACTOR_SESSION` being this run's. So before the verdict,
            for each unresolved thread whose last comment is one of those:

                .meta/say/post --role reviewer resolve <thread-id>

            and name in the verdict what you closed. Telling that thread
            from the rest is yours: read the last comment, and resolve only
            where it carries the Issue's URL and the words `Left open:`.
            The verb is a backstop and not the test — it
            refuses a thread every comment of which carries your own Trailer,
            and one with neither a second party nor a promotion link, and
            permits everything else, so a live point you misread as promoted
            would resolve without a murmur. Every other thread is owed an
            answer by whoever the point is for: reply to it, or raise a new
            one, and leave it open.

            Your approval clears the review semaphore for the merge manager. If
            any completed check on this head has failed (in `gh pr checks`), or
            if `just pr ${{ github.event.pull_request.number }}`
            exits non-zero, do NOT approve. An approval on a red head leaves the
            pull request stalled indefinitely: the merge manager will not land
            non-green work and the promotion pass performs no checks. On a
            `(claude|gemini)/issue-*` branch, requesting changes is the semaphore that
            wakes the coder Role to fix breakage; on other branches, it informs
            the author. Post `--request-changes` instead, naming the failing
            checks in "What was found". If all completed checks are green (or
            pending) and the diff is clean, post your approval with
            `.meta/say/post --role reviewer review ${{ github.event.pull_request.number }} --approve`. A standing
            merge manager lands what is green in order of leverage
            (solorepo's DR-161). Do not arm the merge and do not merge by hand.

            Your turn ends when the verdict is posted, and not before. The
            run ends when your turn ends: nothing here waits for a background
            agent, whatever the harness's own reference says, and a turn that
            ended "waiting for the agents" is a run that posted nothing —
            solorepo's #130, #138, #140, and #637. Do not call `invoke_subagent` or
            yield the turn; post your review verdict via `.meta/say/post --role reviewer review ...`
            before ending your turn. The step after this session counts your verdicts,
            and a session that added none is a red run.

      # When Claude Code and Antigravity both fail (or when Antigravity fallback is unconfigured
      # in a clone without ARC), evaluate Google Labs Jules API fallback if enabled by the
      # JULES_FALLBACK toggle under Google AI Ultra subscription quota (solorepo's DR-246).
      - name: detect jules fallback
        id: jules_fallback
        if: >-
          steps.before.outputs.harness != 'jules' && (
            steps.review_gemini.outcome == 'failure' ||
            (steps.review_claude.outcome == 'failure' && steps.review_gemini.outputs.fallback != 'true')
          )
        env:
          JULES_FALLBACK: ${{ vars.JULES_FALLBACK }}
        run: python3 .meta/detect_fallback.py --harness jules

      - name: review the pull request (jules)
        id: review_jules
        if: steps.before.outputs.harness == 'jules' || steps.jules_fallback.outputs.fallback == 'true'
        timeout-minutes: ${{ fromJSON(steps.before.outputs.minutes) }}
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          # Whose review this is, scoped to this step alone (solorepo's #836):
          # jules where it was fallen back to, and the harness the pull
          # request's own label chose otherwise, which the door named on both
          # outputs. `jules_fallback` is skipped on a `harness:jules` review and
          # emits nothing, and this step's `env:` beats the job environment the
          # door wrote, so the empty output is caught here rather than left to
          # unname the verdict `.meta/jules/client.py` posts from this step.
          ACTOR_AGENT: ${{ steps.jules_fallback.outputs.agent || steps.before.outputs.agent }}
          AI_AGENT: ${{ steps.jules_fallback.outputs.agent || steps.before.outputs.agent }}
        uses: ./.meta/actions/jules
        with:
          role: reviewer
          pr: ${{ github.event.pull_request.number }}
          timeout-minutes: ${{ steps.before.outputs.minutes }}
          prompt: |
            Review pull request #${{ github.event.pull_request.number }}

      # A session that ended without a verdict has not reviewed, and the door
      # says so. The action reports success when the model's turn ends, and a
      # turn ends holding for a background subagent as readily as on a
      # verdict: solorepo's #130, #138 and #140 each ended "waiting for the agents", the
      # check went green, and the request stood with no Job left to answer it
      # (solorepo's DR-122). The verdict is counted rather than read, because
      # GitHub holds it and the transcript only claims it. The door runs
      # whether the session's step succeeded or not — `!cancelled()` rather
      # than `always()`, so a run a push cancelled still skips it — and a
      # session that posted and then timed out is red on its own step and
      # green here, and the log says which red is in front of the reader.
      # Beside the verdict, the door reads the evidence the reading hook left,
      # where Claude Code or Antigravity CLI ran the session, and holds Claude
      # Code's transcript to the fan-out ceiling (solorepo's DR-191); the
      # Antigravity CLI path is exempt from that last, since it writes no
      # execution transcript, and there the ceiling is the prompt's alone.
      # Which harness ran, and where the transcript is, only this file knows,
      # so they are handed to the door as flags.
      - name: after the session
        if: ${{ !cancelled() }}
        run: >-
          .meta/say/on --role reviewer reviewer after "$PR"
          --verdicts "$VERDICTS" --agents "$AGENTS" --ran "$RAN" --transcript "$TRANSCRIPT"
        env:
          PR: ${{ github.event.pull_request.number }}
          VERDICTS: ${{ steps.before.outputs.verdicts }}
          AGENTS: ${{ steps.before.outputs.agents }}
          # Which step ran the session, not which ended well: a session that
          # posted its verdict and then ran out its minutes is red on its own
          # step and is still the session that ran, so the door reads its
          # evidence and its transcript rather than reporting that none
          # started. The limbs are ordered by which step ran it and not by
          # harness preference. Antigravity CLI ran it where its action says
          # so, which it says only after the session returned. Jules runs
          # only as the chosen harness or as a real fallback, so it never
          # claims another step's run, and a Jules session that ran is the
          # one that posted. After those, the Antigravity CLI step that was
          # the chosen harness and was not skipped is the session that
          # posted and then timed out, which its action does not say; read
          # before Jules, that limb would also claim a step that failed
          # before its session, which is what a Jules fallback fires on.
          # Last, Claude Code, whose failed step is what a fallback fired
          # on, and whose step is skipped whenever it is not the chosen
          # harness, which is what lets its limb read the outcome alone.
          RAN: >-
            ${{ steps.review_gemini.outputs.executed == 'true' && 'gemini'
                || steps.review_jules.outcome != 'skipped' && 'jules'
                || (steps.before.outputs.harness == 'gemini'
                    && steps.review_gemini.outcome != 'skipped') && 'gemini'
                || steps.review_claude.outcome != 'skipped' && 'claude'
                || 'none' }}
          TRANSCRIPT: ${{ steps.review_claude.outputs.execution_file }}
