# The reviewer Role, answering a review request (solorepo's DR-109).
#
# PR First's handoff is a review request: the coder names the reviewer's
# account and GitHub holds the request. This is the arriving Job. It runs where
# the event lands, in a container that holds one token — the reviewer's — which
# is the credential boundary solorepo's DR-073 said this machine cannot provide.
#
# Nothing here restates how to review. The pull request Discipline is the
# skill the checkout carries, and the code-review plugin is Claude Code's own;
# this file decides when the reviewer runs, as whom it speaks, and what it may
# read (solorepo's DR-110).
#
# On a `pull_request` event GitHub runs the workflow file from the pull
# request's own merge ref, so this file is the diff's. A change to it is
# reviewed by the reviewer it defines and read by the solo before it merges;
# nothing below can make that otherwise, and nothing below claims to.
name: review

on:
  pull_request:
    # The request, and a new head while the request is still outstanding:
    # a review answers the head it was asked about, and a push after the
    # ask moves the question. A push with no request pending runs nothing.
    types: [review_requested, synchronize]

# One run per pull request, on the head that is current. A head that moves
# after the ask moves the question, and `.meta/say/post raise` anchors to the head
# it finds at post time, so a run left going across a move reviews one head
# and posts against another. A moved head cancels it — a push, a rebase
# GitHub performs on a layer, a retarget — and nothing else does, because
# concurrency is settled before any job's `if:` and a request naming somebody
# else would otherwise kill the run it then declines to be. A move by
# the reviewer's account is its own doing and cancels nothing. Rarer, not
# gone: a `raise` in the window between the move and the runner acting on
# the cancel still anchors to the head it finds.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action == 'synchronize' && github.actor != format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name) }}

# The workflow's own token reads. Every write goes through the reviewer's
# credential, so what GitHub records is the Role and not the workflow.
permissions:
  contents: read
  pull-requests: read

jobs:
  reviewer:
    name: reviewer
    # Only a request of this Role's account, made now or still pending. A
    # request of the solo, or of anyone else, is not this Job's.
    if: >-
      (github.event.action == 'review_requested'
        && github.event.requested_reviewer.login == format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name))
      || (github.event.action == 'synchronize'
        && contains(github.event.pull_request.requested_reviewers.*.login, format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name)))
    # The self-hosted scale set (solorepo's DR-137): this Job is what actually
    # spends GitHub Actions minutes, holding a runner for up to the timeout
    # below on every review. It moved here first, ahead of `gate.yml`'s
    # required checks, which followed under solorepo's DR-140.
    runs-on: arc-runner-set
    timeout-minutes: 50
    env:
      # The Trailer's two halves (solorepo's DR-086). The run id is a workload identity
      # GitHub attests for this run and no other; the harness is the action,
      # recorded as the environment names it.
      ACTOR_SESSION: gha-${{ github.run_id }}
    steps:
      # No token left in `.git/config`: the transcript is in the run log, and
      # a read of that file would put the token there past the masking. Full
      # history, so `git log` can say what was already true of a file, and
      # the head the merge ref was built from is reachable for `git show`.
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # `ubuntu-latest` ships `gh`; the self-hosted image (solorepo's DR-137) does
      # not, and `.meta/say/channel.py` shells out to it for every read and
      # write here.
      - uses: ./.meta/actions/gh

      # Which harness speaks: Claude Code by default, or Gemini CLI or Codex by label, branch, or fallback
      - name: choose the harness
        id: harness
        run: |
          harness="claude"
          labels=$(gh pr view "$PR" --json labels -q '.labels[].name' 2>/dev/null || true)
          branch="${{ github.event.pull_request.head.ref }}"

          if echo "$labels" | grep -qw "harness:gemini"; then
            harness="gemini"
          elif echo "$labels" | grep -qw "harness:codex"; then
            harness="codex"
          elif echo "$labels" | grep -qw "harness:claude"; then
            harness="claude"
          elif [[ "$branch" =~ ^gemini/ ]]; then
            harness="gemini"
          elif [[ "$branch" =~ ^codex/ ]]; then
            harness="codex"
          fi

          if [ "$harness" = "gemini" ]; then
            agent="google-github-actions/run-gemini-cli"
          else
            agent="anthropics/claude-code-action@v1"
          fi

          echo "harness=$harness" >> "$GITHUB_OUTPUT"
          echo "agent=$agent" >> "$GITHUB_OUTPUT"
          echo "AI_AGENT=$agent" >> "$GITHUB_ENV"
          echo "Harness chosen: $harness (agent: $agent)"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}


      # Seven paths are trunk's, not the pull request's: the channel, the
      # hooks, the checker, the settings that register them, and the
      # instructions the session loads before it reads anything. The action
      # restores `.claude/` from `main` on its own and its log says so; the
      # restore is done here too, because a property this file enforces
      # beats one it hopes for from a floating `@v1`. Index and worktree
      # both, so `git status` and `git diff` show nothing for them and the
      # prompt says which they are. `origin/main` is already here from the
      # full checkout; nothing is fetched and no token is assembled. The
      # restore is no-overlay, so a file a pull request adds under these
      # paths is gone before the run reads anything — which is the point,
      # and is also why the hook the action registers below must already
      # be trunk's (solorepo's #87): a hook that is missing does not block, so its
      # absence is tested here and is a red run rather than an open one.
      - name: run trunk's channel
        run: |
          git restore --quiet --source=origin/main --staged --worktree -- \
            .claude .meta/say .meta/hooks .meta/check_pr.py AGENTS.md CLAUDE.md GEMINI.md
          test -x .meta/hooks/worktree_only.py
          test -x .meta/hooks/signed_channel.py

      # The Role's credential, where `.meta/say/<program> --role reviewer` expects it
      # (solorepo's DR-073, DR-107): outside the tree, mode 600, one token in the
      # container. The same channel and the same rules as on a laptop.
      - name: hold the reviewer's credential
        run: |
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/reviewer.env
          printf 'GH_TOKEN=%s\n' "$REVIEWER_GH_TOKEN" > ~/.config/solorepo/reviewer.env
          .meta/say/whoami --role reviewer
        env:
          REVIEWER_GH_TOKEN: ${{ secrets.REVIEWER_GH_TOKEN }}

      # The model and the minutes by what changed; the turn cap by what a
      # review takes. A diff that touches the boundary — the channel, the
      # hooks, the settings, the workflows — gets Opus at the skill's high
      # effort and most of an hour, which is what it took to find the holes
      # in the hook (solorepo's #86, #87). Everything else gets Sonnet at medium and a
      # quarter of an hour: a decision record does not need an audit, and an
      # audit of one is where a month goes. The minutes are the cost bound.
      # The turns are a loop guard and follow the procedure, not the diff:
      # the first reviews that finished took 40 and 84 turns, re-reviews 12
      # to 24, and a cap of 25 was hit three times with nothing posted
      # (solorepo's DR-126). One cap on both paths, a hundred and twenty,
      # above the largest first review seen with room; a run that reaches it
      # is looping — bouncing off the hook, or holding for a subagent — and
      # is read as a red run rather than re-requested deeper.
      #
      # The agents by the same path, and unlike the turns they are wall clock
      # rather than a guard: solorepo's DR-122 requires every agent a review
      # spawns in the foreground, and what the timing measures is the sum of
      # them. That is where an initial review's 11 to 15 minutes go
      # (solorepo's #303), and most of it is a persona reading the same diff
      # for a dimension the change does not have. The
      # boundary path keeps three, which is a judgement and not a derivation:
      # the minutes would afford three times it, and what recommends three is
      # that breadth here is what found the holes in the hook
      # (solorepo's #86, #87), while three at the three to four minutes an
      # agent takes puts the pass under ten minutes rather than over fifteen.
      # Everything else gets one: a
      # decision record, a page, a script has one dimension, and a second
      # agent on it reads the same diff for the same thing. The number is a
      # ceiling on what the session spawns and not a quota to fill, so a
      # one-dimension diff gets one agent on either path.
      - name: choose the depth
        id: depth
        run: |
          LOGIN="${{ format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name) }}"
          LAST_VERDICT_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews?per_page=100" --paginate \
            --jq "[.[] | select(.user.login == \"$LOGIN\") | select(.state != \"COMMENTED\" or (.body // \"\") != \"\")] | last | .commit_id" 2>/dev/null || true)

          incremental=false
          if [ -n "$LAST_VERDICT_HEAD" ] && [ "$LAST_VERDICT_HEAD" != "null" ]; then
            if git cat-file -e "$LAST_VERDICT_HEAD" 2>/dev/null; then
              incremental=true
            fi
          fi

          if [ "$incremental" = true ]; then
            echo "Checking incremental delta diff since last verdict head: $LAST_VERDICT_HEAD"
            files_to_check=$(git diff --name-only "$LAST_VERDICT_HEAD" HEAD)
          else
            echo "Checking cumulative PR files (no previous verdict found or reachable)"
            files_to_check=$(gh pr view "$PR" --json files -q '.files[].path')
          fi

          if echo "$files_to_check" | grep -qE '^(\.meta/say|\.meta/hooks/|\.meta/check_pr\.py|\.claude/|\.github/workflows/)'; then
            printf 'model=claude-opus-5\ngemini_model=gemini-3.8-flash\neffort=high\nturns=120\nminutes=45\nagents=3\n' >> "$GITHUB_OUTPUT"
          else
            printf 'model=claude-sonnet-5\ngemini_model=gemini-3.8-flash\neffort=medium\nturns=120\nminutes=15\nagents=1\n' >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}

      # What the session reads, written to files before it starts (solorepo's #196).
      # Two reads dominate an agent's turns and both exceed the tool-result
      # cap: the pull request's diff, and the head's version of the six paths
      # the step above replaced with trunk's. Past about 30 KB a shell result
      # arrives as its first 2 KB and the path of a file holding the rest, so
      # an agent that runs `gh pr diff` reads a preview and then pages the
      # spill file, and one that wants the head's channel runs
      # `git show <sha>:<path>` once per file — up to ten times a run on
      # solorepo's #117, where `.meta/say` alone is 60 KB. As files they are paths,
      # and the Read tool takes an offset.
      #
      # `.review/` is scratch and `.gitignore` holds it, so `git status` stays
      # the pull request's. That entry is the pull request's file like any
      # other, so a diff that removes it leaves `.review/` untracked in
      # `git status`, which is this step and not the change.
      #
      # `.gitignore` silences an untracked `.review/`; it does not stop a
      # branch committing one, and the checkout materialises whatever the
      # merge ref tracks there before this step runs. A committed
      # `.review/diff.patch` symlink turns the `>` below into a write onto its
      # target — `.meta/hooks/worktree_only.py`, say, which is this run's only
      # bound on an argument and does not block once it fails to parse — and a
      # committed `.review/head` symlink turns `tar -C` into a chdir that
      # lands the head's own `.meta/say` and `.meta/hooks` on top of trunk's,
      # both after the restore and its `test -x`. Nothing legitimate is ever
      # tracked there, which is what the `.gitignore` entry says, so the run
      # refuses rather than guessing which shape it is looking at. The
      # removal that follows is for a workspace a scale set reused.
      #
      # `git archive` writes the head's tree, not trunk's: the reviewer reads
      # the pull request's own channel and hooks there while what runs is
      # still trunk's, because the grammar in `worktree_only.py` admits a
      # program spelled `.meta/say/<name>` and nothing under `.review/` is
      # spelled that way. A path the pull request deletes is simply absent,
      # and the diff says so; all six gone is this step failing, not a review.
      # A `run:` block is `bash -e` and nothing more, so without the
      # `pipefail` below the pipeline's status is `tar`'s and an archive that
      # died after its first members would leave a partial `.review/head/`
      # behind a green step — which the constraints file would then read to
      # the session as paths the pull request deleted. `-z` for the same
      # reason on the other side: a pathname holding a space, a quote or a
      # byte `core.quotePath` escapes is C-quoted without it, and the words it
      # splits into match nothing in `$HEAD`.
      - name: write the diff and the head's trunk paths
        run: |
          set -o pipefail
          if [ -n "$(git ls-files -- .review)" ]; then
            echo "::error::.review/ is tracked in this tree, and this step writes the reviewer's scratch there"
            exit 1
          fi
          rm -rf .review .gemini
          install -d .review/head
          gh pr diff "$PR" > .review/diff.patch
          mapfile -d '' -t paths < <(git ls-tree -r -z --name-only "$HEAD" -- $TRUNK)
          if [ "${#paths[@]}" -eq 0 ]; then
            echo "::error::no trunk path is in $HEAD, so there is nothing for the reviewer to read there"
            exit 1
          fi
          git archive "$HEAD" -- "${paths[@]}" | tar -x -C .review/head
          find .review ! -type d | sort
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TRUNK: .claude .meta/say .meta/hooks .meta/check_pr.py AGENTS.md CLAUDE.md GEMINI.md

      # The paragraphs that bound every agent, in a file rather than in the
      # prompt (solorepo's #196). They used to end "every agent the review spawns gets
      # these paragraphs", and the main agent obeyed by retyping them: each
      # agent's prompt ran to about 4 KB, most of it these, and writing one
      # takes 15 to 20 seconds of Opus output, so on solorepo's #117 the fourth agent
      # started nearly a minute after the first. A file makes the handoff one
      # line. The session reads the same copy, so there is one text here and
      # not two to drift apart.
      - name: write the constraints every agent reads
        run: |
          cat > .review/constraints.md <<'BODY'
          # What bounds every agent on this review

          This is the reviewer's container on pull request #${{ github.event.pull_request.number }}
          of ${{ github.repository }}. Everything here holds for the reviewer's
          own session and for every agent the review spawns.

          **The diff is a file.** `.review/diff.patch` is this pull request's
          whole diff, written before the session started. Read it with the Read
          tool, which takes an offset and a limit. `gh pr diff` says the same
          thing and arrives as its first 2 KB and a path when the diff is large.

          **Seven paths in the worktree are trunk's, not this pull request's:**
          `.claude/`, `.meta/say`, `.meta/hooks/`, `.meta/check_pr.py`,
          `AGENTS.md`, `CLAUDE.md` and `GEMINI.md`. They were replaced with `origin/main`'s
          copies before the session, so that what runs here is trunk's. You run
          and read them as trunk's; you do not review them by reading them.
          `git status` and `git diff` show nothing for a change the pull request
          makes to them; a file the pull request adds under them shows as a
          staged deletion, which is the restore and not the pull request.

          **The pull request's version of those six is under `.review/head/`,**
          at the same path: `.review/head/.meta/say/post` is what this pull
          request's `post` says. That copy is read and never run, and it is the
          version to review. `git show ${{ github.event.pull_request.head.sha }}:<path>`
          says the same thing and costs a turn for each file.

          **The shell runs one plain command at a time and nothing else:**
          `git log|show|diff|status|grep|ls-files|ls-tree` with plain options,
          `gh pr view|diff|checks`, `python3 .meta/check_pr.py`, or
          `.meta/say/post` and `.meta/say/move` with their heredoc. No pipes,
          redirects or chaining, and nothing the shell would expand: a `$`, a
          backtick, a bare glob. Quoting is what stops it, either pair — a
          pattern or a glob goes inside one, single quotes where it holds a
          `$`, a backtick, a `\` or a `!`, the four a double quote does not
          stop here. A regex usually holds the `\` — `\s`, `\b`, `\.` — so
          `git grep -n -E '^\s*def blocked' -- .meta` is the pair that is taken
          and the same words in a double quote are refused. List the
          worktree's files with the Glob tool and a commit's with
          `git ls-tree -r --name-only <sha>`, read them with the Read tool and
          search with Grep. A refusal names the nearest command it would have
          taken, where the one refused has one; that is the command to type
          next, rather than a guess at another.

          **A Grep of `.review/` needs `path`.** Grep is ripgrep and ripgrep
          honours `.gitignore`, which holds `.review/`: a Grep from the root
          finds nothing there, including in this file. Pass `.review` or
          `.review/head` as Grep's `path` to search the diff or the head's
          copies, and read a hit in the worktree as trunk's until you have
          checked `.review/head/` for the same path.

          **Only the session the review was requested of posts.** An agent hands
          its findings back to the session that spawned it; it does not run
          `.meta/say/post`, and it resolves no thread.

          **An agent reviews the dimension it was given and no other.** The
          pass is scoped before it is spawned (solorepo's DR-166): the session
          has read the diff itself and named the dimensions it holds, and each
          agent has one of them. A sweep for everything, done by an agent asked
          for one thing, is the same diff read again for what the session or
          another agent already holds — and every agent here runs in the
          foreground, so the run waits on it while it does.

          **The Technical Writer pass holds prose to the Literate Programming register.**
          When the diff touches documentation, docstrings, Decision Records, or markdown artifacts, evaluate
          them under `work:personality/technical-writer` and the Literate Programming rubric (solorepo's DR-175, solorepo's DR-176):
          - Spelled out, for an audience it names. Every citation dereferenced.
          - Assume a reader who was not in the conversation and arrives by search years later.
          - Apply the reader's test: could someone use this item from its docstring alone without reading the argument for it?
          - Verify that item docstrings state what to do and invariants without litigating against a reviewer; why belongs in module docstrings or Decision Records, and past incident narratives belong in `<module>.history.md` (solorepo's DR-171).
          BODY
          cat .review/constraints.md

      # What this Role has already said on the pull request, counted before
      # the session so that only a verdict the session itself posts satisfies
      # the step after it.
      - name: count the verdicts before
        id: before
        uses: ./.meta/actions/verdicts
        with:
          number: ${{ github.event.pull_request.number }}
          login: ${{ format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name) }}
          token: ${{ github.token }}

      - name: review the pull request (claude)
        id: review_claude
        if: steps.harness.outputs.harness == 'claude'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The action's own GitHub calls as the Role too, so nothing in the
          # run is authored by an App or a bot.
          github_token: ${{ secrets.REVIEWER_GH_TOKEN }}
          # The transcript, in the run log. Hidden by default; here the run is
          # the only record of what the reviewer did, and its first run posted
          # nothing while reporting success (solorepo's #85). `gh run view
          # <id> --log` prints this step cut off at about two minutes; the
          # whole of it is in the archive the CLI caches at
          # `~/.cache/gh/run-log-<id>-*.zip`, where `0_reviewer.txt` holds the
          # complete transcript and the `result` event with turns and cost
          # (solorepo's #122).
          show_full_output: "true"
          # The bound on reading, registered here and nowhere else (solorepo's DR-110):
          # a `Read`, `Grep` or `Glob` resolves inside the worktree and
          # outside `.git/`, and a `git` command carries no option that runs
          # a program or writes a file. A hook, because it is the one layer
          # that sees an argument rather than a prefix: `git grep -O` runs a
          # shell and `git log --output=.meta/say` rewrites the channel, and
          # no prefix list excludes an option. The script is one of the six
          # paths restored above, so it is trunk's.
          settings: |
            {"hooks": {"PreToolUse": [{"matcher": "Bash|Read|Grep|Glob",
              "hooks": [{"type": "command", "command": "$CLAUDE_PROJECT_DIR/.meta/hooks/worktree_only.py"}]}]}}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            Your Personality is work:personality/reviewer: Analytical and thorough. Holds the diff to the Disciplines and the Charter strictly. Clear and precise in identification of issues; concise yet unambiguous in argument.

            You are the reviewer Role (solorepo's DR-107), answering a review request on
            pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. Read /pr-first-reviewer first: it is
            the reviewer's reading of PR First, and says what a pull request
            here must hold, what a reviewer's point owes, and which verbs
            are yours.

            Then read `.review/constraints.md` with the Read tool. It was
            written before this session and says where the diff is, which
            paths in the worktree are trunk's and not this pull request's,
            where the pull request's own version of those is, and what the
            shell here takes. It binds you and every agent you spawn.

            Then read what this Role has already said on it, before saying
            anything: `python3 .meta/check_pr.py ${{ github.event.pull_request.number }} --threads`.
            It lists every verdict with the head GitHub recorded it against
            and the login that gave it, then the threads owed an answer, the
            ones held for promotion, and the ones answered and resolved. Your
            login is `${{ github.repository_owner }}-${{ github.event.repository.name }}-reviewer`;
            a verdict by any other login, the solo's approval among them, is
            not this Role's and decides nothing here, and a `DISMISSED` one
            was withdrawn and decides nothing, whatever head it names. A run before this one may have raised
            points and been cancelled by a push before its verdict. A point
            already on the pull request is not raised again; where the new
            head changes it, answer in its thread.

            A long argument makes a long listing, and a shell result past
            about 30 KB arrives as its first 2 KB and the path of a file
            holding the whole; the verdicts print before everything else so
            the preview holds the newest, and the file is read with the Read
            tool before anything is decided from the preview.

            If the listing shows a verdict of this Role and threads it raised
            answered and resolved, this is a re-review, not a review: read
            each answer against the diff between the head the verdict names
            and this one, `git diff <that-head> ${{ github.event.pull_request.head.sha }}`.
            The head GitHub records on a verdict is the head current when it
            was posted, which is newer than the one the run read if a push
            landed during the run; and a rebase of an open branch orphans
            the old head, so where `git diff` cannot resolve that head, read
            the pull request's whole diff at `.review/diff.patch` and each
            answer in its thread instead. Say in the thread where an answer does not hold,
            and post the verdict. Do not run the code-review skill again on
            a head a verdict of this Role already names, nor on a head that
            differs from one only by the answers; its agents cost the turns the verdict
            needs (solorepo's #102), and on solorepo's #117 every pass ran it again because the
            listing hid what had been resolved (solorepo's #122). Do not wait for
            pending checks to finish: `gh pr checks` exits non-zero while a check
            is pending, and the standing merge manager evaluates completed checks
            before landing. However, inspect completed checks on this head with
            `gh pr checks ${{ github.event.pull_request.number }}` and test form
            compliance with `python3 .meta/check_pr.py ${{ github.event.pull_request.number }}`.

            Then review with /code-review:code-review ${{ steps.depth.outputs.effort }} ${{ github.repository }}/pull/${{ github.event.pull_request.number }}
            without --comment. Every agent the review spawns is bound by
            `.review/constraints.md` too, and hand it that line rather than
            the paragraphs: writing them out once per agent is what made the
            fourth agent start nearly a minute after the first (solorepo's #196).

            Scope that pass before you spawn it (solorepo's DR-166). Every
            agent runs in the foreground and the pass has been costing the sum
            of its agents: that is where an initial review's 11 to 15 minutes
            go (solorepo's #303). Name
            the dimensions this diff actually has, from `.review/diff.patch`
            which you have already read, and spawn no more than
            ${{ steps.depth.outputs.agents }} of them, one to a dimension. If the diff
            modifies docstrings, comments, Decision Records, or markdown files, include
            the Technical Writer pass (evaluating against `work:personality/technical-writer`
            and the Literate Programming rubric of solorepo's DR-175, solorepo's DR-176). A
            dimension this diff does not touch is not reviewed by an agent
            that finds nothing in it; one you can settle from the diff
            yourself does not need an agent either; and no two agents get the
            same dimension in different words. That number is a ceiling and
            not a quota, so a diff with one dimension gets one agent whatever
            the path, and a diff you have read whole gets none.

            Post only through the channel, so every word carries the Trailer.
            Every posting command begins with `.meta/say/post` and takes its
            body as a quoted heredoc on stdin; a command that begins with
            anything else, `cat` or `printf` or `echo`, is not permitted to
            run. Each finding goes on a line of the diff:

                .meta/say/post --role reviewer raise <n> <path> <line> <<'BODY'
                ...
                BODY

            and the verdict carries a body saying what was checked and what
            was found:

                .meta/say/post --role reviewer review <n> --approve|--request-changes|--comment <<'BODY'
                ...
                BODY

            Never `gh pr review`, `gh pr comment` or `gh api`: the hook
            refuses them. Do not resolve any thread.

            Your approval clears the review semaphore for the merge manager. If
            any completed check on this head has failed (in `gh pr checks`), or
            if `python3 .meta/check_pr.py ${{ github.event.pull_request.number }}`
            exits non-zero, do NOT approve. An approval on a red head leaves the
            pull request stalled indefinitely: the merge manager will not land
            non-green work and the promotion pass performs no checks. On a
            `claude/issue-*` branch, requesting changes is the semaphore that
            wakes the coder Role to fix breakage; on other branches, it informs
            the author. Post `--request-changes` instead, naming the failing
            checks in "What was found". If all completed checks are green (or
            pending) and the diff is clean, post your approval with
            `.meta/say/post --role reviewer review <n> --approve`. A standing
            merge manager lands what is green in order of leverage
            (solorepo's DR-161). Do not arm the merge and do not merge by hand.

            Your turn ends when the verdict is posted, and not before. The
            run ends when your turn ends: nothing here waits for a background
            agent, whatever the harness's own reference says, and a turn that
            ended "waiting for the agents" is a run that posted nothing —
            solorepo's #130, #138 and #140. So an Agent you spawn runs in the foreground,
            never with `run_in_background`, and its result arrives in the
            same turn; one you did start in the background is read with
            TaskOutput before anything else. The step after this session
            counts your verdicts, and a session that added none is a red run.
          # Which programs, by prefix; what they may reach, by the hook above.
          # The run holds a token, its input is a diff nobody here has vetted,
          # and `signed_channel.py` bounds only the paths to GitHub, not a
          # `curl` to anywhere else with the token file as its body. The
          # first two runs (solorepo's #85, #86) posted nothing because `Skill` was
          # missing from the list, not because the list was a list; the
          # reviewer's own runs argued a blanket allowance back out, then
          # found `git grep -O` inside the list. The shell is the channel,
          # the checker and git; reading is the tools, under the hook.
          claude_args: |
            --model ${{ steps.depth.outputs.model }}
            --max-turns ${{ steps.depth.outputs.turns }}
            --allowedTools "Skill,Agent,Read(./**),Grep,Glob,Bash(.meta/say/post:*),Bash(.meta/say/move:*),Bash(.meta/say/whoami:*),Bash(python3 .meta/check_pr.py:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git grep:*),Bash(git ls-files:*),Bash(git ls-tree:*)"
            --disallowedTools "Read(./.git/**)"

      # When Claude Code fails on rate limit or weekly token exhaustion (HTTP 429),
      # fall back to Gemini CLI so the review request does not stall.
      - name: detect claude quota error
        id: claude_quota
        if: steps.harness.outputs.harness == 'claude' && steps.review_claude.outcome == 'failure'
        env:
          EXECUTION_FILE: ${{ steps.review_claude.outputs.execution_file }}
        run: |
          python3 -c '
          import json, os, sys
          file = os.environ.get("EXECUTION_FILE") or os.path.join(os.environ.get("RUNNER_TEMP", "/tmp"), "claude-execution-output.json")
          fallback = False
          if os.path.exists(file):
              try:
                  with open(file) as f:
                      data = json.load(f)
                  entries = data if isinstance(data, list) else [data]
                  for item in entries:
                      if isinstance(item, dict):
                          if item.get("api_error_status") == 429 or item.get("error") == "rate_limit" or any(k in str(item.get("result", "")).lower() for k in ["limit", "quota", "rate"]):
                              fallback = True
                              break
              except Exception as e:
                  print(f"Error parsing {file}: {e}", file=sys.stderr)
              if not fallback:
                  try:
                      with open(file) as f:
                          raw = f.read().lower()
                      if "429" in raw or "rate_limit" in raw or "weekly limit" in raw or "hit your" in raw:
                          fallback = True
                  except Exception as e:
                      print(f"Error reading {file}: {e}", file=sys.stderr)
          print(f"Claude failure detected (quota={fallback}); activating Gemini fallback.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("fallback=true\n")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("AI_AGENT=google-github-actions/run-gemini-cli\n")
          '

      - name: review the pull request (gemini)
        id: review_gemini
        if: steps.harness.outputs.harness == 'gemini' || steps.claude_quota.outputs.fallback == 'true'
        uses: google-github-actions/run-gemini-cli@v0
        timeout-minutes: ${{ fromJSON(steps.depth.outputs.minutes) }}
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
          GH_TOKEN: ${{ secrets.REVIEWER_GH_TOKEN }}
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: ${{ steps.depth.outputs.gemini_model }}
          settings: |
            {
              "modelConfigs": {
                "customAliases": {
                  "${{ steps.depth.outputs.gemini_model }}": {
                    "extends": "chat-base-3",
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "HIGH",
                          "includeThoughts": true
                        }
                      }
                    }
                  }
                },
                "overrides": [
                  {
                    "match": {
                      "overrideScope": "core"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "HIGH",
                          "includeThoughts": true
                        }
                      }
                    }
                  },
                  {
                    "match": {
                      "model": "${{ steps.depth.outputs.gemini_model }}"
                    },
                    "modelConfig": {
                      "generateContentConfig": {
                        "thinkingConfig": {
                          "thinkingLevel": "HIGH",
                          "includeThoughts": true
                        }
                      }
                    }
                  }
                ]
              }
            }
          prompt: |
            Your Personality is work:personality/reviewer: Analytical and thorough. Holds the diff to the Disciplines and the Charter strictly. Clear and precise in identification of issues; concise yet unambiguous in argument.

            You are the reviewer Role (solorepo's DR-107), answering a review request on
            pull request #${{ github.event.pull_request.number }} of
            ${{ github.repository }}. Read /pr-first-reviewer first: it is
            the reviewer's reading of PR First, and says what a pull request
            here must hold, what a reviewer's point owes, and which verbs
            are yours; `AGENTS.md` (and `GEMINI.md`) has the conventions.

            Then read `.review/constraints.md`. It was
            written before this session and says where the diff is, which
            paths in the worktree are trunk's and not this pull request's,
            where the pull request's own version of those is, and what the
            shell here takes. It binds you.

            Then read what this Role has already said on it, before saying
            anything: `python3 .meta/check_pr.py ${{ github.event.pull_request.number }} --threads`.
            It lists every verdict with the head GitHub recorded it against
            and the login that gave it, then the threads owed an answer, the
            ones held for promotion, and the ones answered and resolved. Your
            login is `${{ github.repository_owner }}-${{ github.event.repository.name }}-reviewer`;
            a verdict by any other login, the solo's approval among them, is
            not this Role's and decides nothing here, and a `DISMISSED` one
            was withdrawn and decides nothing, whatever head it names. A run before this one may have raised
            points and been cancelled by a push before its verdict. A point
            already on the pull request is not raised again; where the new
            head changes it, answer in its thread.

            If the listing shows a verdict of this Role and threads it raised
            answered and resolved, this is a re-review, not a review: read
            each answer against the diff between the head the verdict names
            and this one, `git diff <that-head> ${{ github.event.pull_request.head.sha }}`.
            The head GitHub records on a verdict is the head current when it
            was posted, which is newer than the one the run read if a push
            landed during the run; and a rebase of an open branch orphans
            the old head, so where `git diff` cannot resolve that head, read
            the pull request's whole diff at `.review/diff.patch` and each
            answer in its thread instead. Say in the thread where an answer does not hold,
            and post the verdict. Do not wait for
            pending checks to finish: `gh pr checks` exits non-zero while a check
            is pending, and the standing merge manager evaluates completed checks
            before landing. However, inspect completed checks on this head with
            `gh pr checks ${{ github.event.pull_request.number }}` and test form
            compliance with `python3 .meta/check_pr.py ${{ github.event.pull_request.number }}`.

            Read the diff at `.review/diff.patch` and evaluate the change against repo conventions and assertions.
            If the diff touches docstrings, comments, Decision Records, or markdown files, execute
            the Technical Writer pass: hold prose to `work:personality/technical-writer` and the Literate
            Programming rubric (solorepo's DR-175, solorepo's DR-176). Raise findings on litigious docstrings,
            missing usage contracts, or undereferenced citations before approving.

            Post only through the channel, so every word carries the Trailer.
            Every posting command begins with `.meta/say/post` and takes its
            body as a quoted heredoc on stdin; a command that begins with
            anything else, `cat` or `printf` or `echo`, is not permitted to
            run. Each finding goes on a line of the diff:

                .meta/say/post --role reviewer raise ${{ github.event.pull_request.number }} <path> <line> <<'BODY'
                ...
                BODY

            and the verdict carries a body saying what was checked and what
            was found:

                .meta/say/post --role reviewer review ${{ github.event.pull_request.number }} --approve|--request-changes|--comment <<'BODY'
                ...
                BODY

            Never `gh pr review`, `gh pr comment` or `gh api`: the hook
            refuses them. Do not resolve any thread.

            Your approval clears the review semaphore for the merge manager. If
            any completed check on this head has failed (in `gh pr checks`), or
            if `python3 .meta/check_pr.py ${{ github.event.pull_request.number }}`
            exits non-zero, do NOT approve. An approval on a red head leaves the
            pull request stalled indefinitely: the merge manager will not land
            non-green work and the promotion pass performs no checks. On a
            `(claude|gemini|codex)/issue-*` branch, requesting changes is the semaphore that
            wakes the coder Role to fix breakage; on other branches, it informs
            the author. Post `--request-changes` instead, naming the failing
            checks in "What was found". If all completed checks are green (or
            pending) and the diff is clean, post your approval with
            `.meta/say/post --role reviewer review ${{ github.event.pull_request.number }} --approve`. A standing
            merge manager lands what is green in order of leverage
            (solorepo's DR-161). Do not arm the merge and do not merge by hand.

            Your turn ends when the verdict is posted, and not before.

      # A session that ended without a verdict has not reviewed, and the check
      # says so. The action reports success when the model's turn ends, and a
      # turn ends holding for a background subagent as readily as on a
      # verdict: solorepo's #130, #138 and #140 each ended "waiting for the agents", the
      # check went green, and the request stood with no Job left to answer it
      # (solorepo's DR-122). The verdict is counted rather than read, because
      # GitHub holds it and the transcript only claims it. Both steps run
      # whether the session's step succeeded or not — `!cancelled()` rather
      # than `always()`, so a run a push cancelled still skips them — and a
      # session that posted and then timed out is red on its own step and
      # green here, and the log says which red is in front of the reader.
      - name: count the verdicts after
        id: after
        if: ${{ !cancelled() }}
        uses: ./.meta/actions/verdicts
        with:
          number: ${{ github.event.pull_request.number }}
          login: ${{ format('{0}-{1}-reviewer', github.repository_owner, github.event.repository.name) }}
          token: ${{ github.token }}

      # Fails closed: the pass is the branch that has to be reached, so a
      # count that did not arrive — a renamed output, a skipped step — takes
      # the error branch rather than a green it did not earn.
      - name: the verdict landed
        if: ${{ !cancelled() }}
        run: |
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "a verdict landed on #$PR"
          else
            echo "::error::no verdict landed on #$PR (before=$BEFORE after=$AFTER): the reviewer's turn ended without reviewing, and the request stands"
            exit 1
          fi
        env:
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ steps.before.outputs.count }}
          AFTER: ${{ steps.after.outputs.count }}
