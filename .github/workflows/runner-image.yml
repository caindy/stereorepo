# Automates building, smoke-testing, publishing the solorepo-runner container
# image to GitHub Container Registry (GHCR), and opening a draft promotion pull request (PR) (solorepo's DR-156, solorepo's DR-160).
#
# Runs on GitHub-hosted `ubuntu-latest` with Docker Buildx to decouple image
# manufacturing from self-hosted cluster availability, avoiding circular
# bootstrap dependencies.
name: runner-image

on:
  push:
    branches: [main]
    paths:
      - '.meta/arc/**'
      - '.github/workflows/runner-image.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build and publish (defaults to current tag in values-runnerset.yaml if empty)'
        required: false
        type: string
        default: ''
      publish:
        description: 'Publish image to GitHub Container Registry (GHCR)'
        required: true
        type: boolean
        default: true
      promote:
        description: 'Open draft pull request (PR) to promote image tag if a new tag is published'
        required: true
        type: boolean
        default: true
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  packages: write
  pull-requests: write
  issues: write

jobs:
  build-and-publish:
    name: build-test-publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Determine image tag
        id: tag
        run: |
          set -euo pipefail
          INPUT_TAG="${{ github.event.inputs.tag }}"
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
            IS_EXPLICIT=true
          else
            TAG=$(grep -E 'image:\s*ghcr\.io/caindy/solorepo-runner:' .meta/arc/values-runnerset.yaml | head -n1 | sed -E 's/.*solorepo-runner:([^ ]+).*/\1/')
            IS_EXPLICIT=false
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "is_explicit=${IS_EXPLICIT}" >> "$GITHUB_OUTPUT"
          echo "Determined image tag: ${TAG} (explicit: ${IS_EXPLICIT})"

      - name: Build local container image
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Building solorepo-runner:${TAG}..."
          docker buildx build \
            --load \
            -t "ghcr.io/caindy/solorepo-runner:${TAG}" \
            -t "solorepo-runner:${TAG}" \
            -f .meta/arc/Dockerfile \
            .meta/arc

      - name: Run container smoke tests
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Running smoke tests on solorepo-runner:${TAG}..."
          docker run --rm "solorepo-runner:${TAG}" claude --version
          docker run --rm "solorepo-runner:${TAG}" agy --version
          docker run --rm "solorepo-runner:${TAG}" python3 --version
          docker run --rm "solorepo-runner:${TAG}" uv --version

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Publishing ghcr.io/caindy/solorepo-runner:${TAG}..."
          docker push "ghcr.io/caindy/solorepo-runner:${TAG}"

      - name: Verify image on GHCR
        if: ${{ github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.publish == 'true') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Verifying ghcr.io/caindy/solorepo-runner:${TAG} on GHCR..."
          just arc-image --check-ghcr "${TAG}"

      - name: Open draft promotion pull request
        if: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.promote == 'true' && steps.tag.outputs.is_explicit == 'true') }}
        env:
          CODER_GH_TOKEN: ${{ secrets.CODER_GH_TOKEN || secrets.GITHUB_TOKEN }}
          ACTOR_SESSION: gha-${{ github.run_id }}
          ACTOR_AGENT: gha/runner-image
          AI_AGENT: gha/runner-image
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          CURRENT_TAG=$(grep -E 'image:\s*ghcr\.io/caindy/solorepo-runner:' .meta/arc/values-runnerset.yaml | head -n1 | sed -E 's/.*solorepo-runner:([^ ]+).*/\1/')
          if [ "$TAG" = "$CURRENT_TAG" ]; then
            echo "Current manifest tag is already ${TAG}; skipping promotion pull request (PR)."
            exit 0
          fi

          echo "Configuring coder credentials..."
          install -d -m 700 ~/.config/solorepo
          install -m 600 /dev/null ~/.config/solorepo/coder.env
          printf 'GH_TOKEN=%s\n' "$CODER_GH_TOKEN" > ~/.config/solorepo/coder.env
          GH_TOKEN="$CODER_GH_TOKEN" gh auth setup-git

          BRANCH="promote/runner-image-${TAG}"
          git checkout -b "$BRANCH"

          echo "Updating manifests to tag ${TAG}..."
          sed -i -E "s|(ghcr\.io/caindy/solorepo-runner:)${CURRENT_TAG}|\1${TAG}|g" .meta/arc/values-runnerset.yaml
          sed -i -E "s|(ghcr\.io/caindy/solorepo-runner:)${CURRENT_TAG}|\1${TAG}|g" .meta/arc/README.md
          sed -i -E "s|(solorepo-runner:)${CURRENT_TAG}|\1${TAG}|g" .meta/arc/README.md

          git add .meta/arc/values-runnerset.yaml .meta/arc/README.md
          .meta/say/commit -m "Promote runner container image to ${TAG}"
          git push -u origin "$BRANCH"

          cat << 'EOF' | .meta/say/move open --title "Promote runner container image to ${TAG}"
          ## Promote runner container image to ${TAG}

          **What this changes.** Bumps the runner container image tag in \`.meta/arc/values-runnerset.yaml\` and \`.meta/arc/README.md\` to \`${TAG}\` following successful automated build, verification, and GitHub Container Registry (GHCR) publication.

          **The plan.** Not applicable — \`easy\`/\`medium\`.

          **What the ground looked like.** The runner container image \`ghcr.io/caindy/solorepo-runner:${TAG}\` was built and published by the \`runner-image\` workflow. Deploy preflight guards ensure the image is reachable on GitHub Container Registry (GHCR) before deployment.

          **What would make this removable.** When the runner image tag is superseded by a newer version.

          **What was decided.** None.

          **What it closes.** None.

          **What was noticed and not done.**
          EOF
