# The gate, run where it cannot be skipped.
#
# solorepo's own, and no portfolio's: the two seed jobs below render
# `bootstraps/`, which stays here. A portfolio's gate workflow is seeded at
# `template/.github/workflows/gate.yml`, where one job runs `just gate` over
# the Projects its assertions declare (DR-115, solorepo's DR-275). The triggers, the permissions
# and the `pull request` and `sweep` jobs are the half the two share. What
# those two jobs run is typed once, under `.meta/actions/`, and each job here
# is a checkout and a `uses:` of it (DR-120); the residue — the triggers, the
# permissions and the two stubs — `check.py` holds equal (DR-119).
#
# A check that runs when someone remembers is not a check — Nothing Unconsumed
# applied to the checker itself. Both halves run here: `check.py` reads files
# and this repository's own commits, and asks the remote for one thing only —
# which Decision numbers are reserved, and only when the record has a hole to
# explain (DR-128); `check_pr.py` reads GitHub and has nothing to say except on
# a pull request.
#
# Every job here runs on the self-hosted scale set (solorepo's DR-140), which
# solorepo's DR-137 deferred until the cluster had proven itself and which the
# hosted account's spending limit then forced: a required check that cannot
# start because the minutes are gone stalls a merge exactly as a cluster that
# is off does, and only one of the two is a machine the solo can switch on.
# `runs-on:` and `container:` are the two lines of the shared half `check.py`
# no longer holds equal to the seed's, because where a job runs is a property
# of the machine this repository has and not of what the job does; the seed
# stays `ubuntu-latest`, which is what a fresh clone has, and names the
# single-source runner image (solorepo's DR-160) as each job's `container:`,
# which the scale set's pods here already run (solorepo's DR-275).
#
# Nothing here restates a Discipline. What a pull request body must contain is
# derived from `.meta/templates/pull-request.md` by the checker; this file only
# decides when the checker runs.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    # No `edited`: it changes the title, the body or the base branch, and none
    # of the three changes a byte of the head's tree, so the three jobs that
    # read files declined it — and a job that declines still writes a check run,
    # which becomes the latest under that job's name and hides the `success` an
    # earlier `synchronize` recorded for the same head (DR-274). `pull request`
    # would have run, and gives that up: `move revise` runs `check_pr.py` before
    # it writes, and the sweep below re-runs it on the clock, so an edit made
    # outside the channel — a retarget included, which moves no commit and so
    # fires no `synchronize` either — is read later rather than never.
    types: [opened, reopened, synchronize, ready_for_review]
  # Resolving a thread fires no Actions event at all — `pull_request_review_thread`
  # is a webhook GitHub does not accept as a trigger, and using it here failed the
  # whole workflow at startup rather than being ignored. So A16 is checked on the
  # last push, and again on the clock: the sweep below re-runs the check on every
  # open pull request and publishes the result as the check (DR-105). The gap is
  # the interval. `workflow_dispatch` runs the same sweep on demand.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
  # The sweep asks whether the reviewer's door fired on each unread Challenge,
  # which is a listing of `triage.yml`'s runs (solorepo's DR-230).
  actions: read

env:
  CARGO_MUTANTS: "27.1.0"

# The job names below are required status checks in `main`'s ruleset
# (protected by a ruleset, not a hook — DR-056). Rename one here and every merge
# blocks: the ruleset waits on a check that nothing reports. `check_pr.py` reads
# the ruleset and compares, so the set is checked rather than remembered.
jobs:
  files:
    name: files
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.changed_files != 0)
    runs-on: arc-runner-set
    steps:
      # The whole history, because `decision numbering` asks it whether a hole
      # in the record is an entry a commit deleted (DR-128). A shallow checkout
      # answers "nothing was deleted" to every such question, which is the green
      # that check exists to refuse — so it goes red instead, and the depth is
      # what keeps it able to answer at all.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # `apm package` reports that it could not run when `apm` is absent, which
      # under CI is a failure rather than a note (A6, DR-261). The CLI is not a
      # Python package, so it is installed here rather than named on the `uvx`
      # line below, by the installer `release.yml` uses.
      - name: Ensure APM CLI is available
        run: |
          set -euo pipefail
          if ! command -v apm >/dev/null 2>&1; then
            echo "Installing APM CLI..."
            curl -fsSL https://aka.ms/apm-unix | sh
            echo "$HOME/.apm/bin" >> $GITHUB_PATH
          fi
      - run: uvx --python 3.13 --with linkml --with pyyaml --with ruff==0.14.0 --with mypy==2.3.1 --with types-pyyaml python .meta/check.py

  # The Rust seed is data, and it is gated by rendering it and running its own
  # gate on the result (A9, DR-091). Required by main's ruleset like the two
  # above.
  rust:
    name: rust seed
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.changed_files != 0)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1

      # The scale set's runner image pre-bakes the C toolchain (`build-essential`)
      # and `rustup` (solorepo's DR-156, solorepo's DR-160), so no in-workflow
      # installation steps or guards are required.
      - run: bootstraps/rust/render "$RUNNER_TEMP/acme" acme

      # rustup reads `rust-toolchain.toml` in the rendered tree and installs
      # the pin on first use, so no action is needed for the toolchain.
      # cargo-mutants is the one tool the gate needs that is not a rustup
      # component; the cache is keyed on its version so a bump reinstalls it.
      - uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-mutants
          key: cargo-mutants-${{ env.CARGO_MUTANTS }}
      - run: command -v cargo-mutants || cargo install cargo-mutants --locked --version "$CARGO_MUTANTS"
        working-directory: ${{ runner.temp }}/acme

      - run: cargo xtask gate
        working-directory: ${{ runner.temp }}/acme

  # The Python seed is data, and it is gated the same way (A9, DR-094):
  # rendered as a package called `acme`, then its own gate run on the result.
  # On the support floor rather than the interpreter developed on, so the
  # floor is executed and not asserted (DR-095). Not a required status check
  # yet: adding it to main's ruleset is a setting on GitHub rather than a line
  # here.
  python:
    name: python seed
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && (github.event_name != 'pull_request' || github.event.pull_request.changed_files != 0)
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1
      - run: bootstraps/python/render "$RUNNER_TEMP/acme" acme
      - run: uv run --locked gate
        working-directory: ${{ runner.temp }}/acme
        env:
          UV_PYTHON: "3.13"

  pull-request:
    name: pull request
    if: github.event_name == 'pull_request'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.meta/actions/pull-request
        with:
          number: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}

  # The same check, on the clock, for every open pull request — and its result
  # published under the job name above, so the ruleset reads the sweep's
  # verdict as it read the push's. Not a required check itself: it is the
  # required check, run later.
  sweep:
    name: sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: arc-runner-set
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.meta/actions/sweep
        with:
          token: ${{ github.token }}
