# The gate, run where it cannot be skipped.
#
# One job runs `.meta/gate`, which reads this portfolio's `structure.yaml` and
# runs the gate every Project it declares asserts. So this file lists no
# Project and does not change when one arrives: a Project is added by being
# asserted, and its gate runs here by the same act. What can still need an edit
# is a *tool* — a Project whose gate calls something the runner image does not carry
# can install it in a step below, or the portfolio can build a derived image from
# `.meta/arc/Dockerfile` and repoint `container:` above (solorepo's DR-160).
#
# The triggers, the permissions and the `pull request` and `sweep` jobs are
# the scaffold's. What the two jobs run is typed once, under `.meta/actions/`,
# which this portfolio carries (solorepo's DR-120); the stubs, the triggers and the
# permissions solorepo's `check.py` holds equal to its own (solorepo's DR-119), so a
# portfolio specialized later runs what the scaffold runs and not a version
# behind. All of each stub but `runs-on:` (solorepo's DR-140): the scaffold's
# gate runs on a self-hosted runner that exists on one machine, and a
# portfolio has `ubuntu-latest` until it says otherwise here.
#
# Nothing here restates a Discipline. What a pull request body must contain is
# derived from `.meta/templates/pull-request.md` by the checker; this file only
# decides when the checker runs.
name: gate

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]
  # Resolving a thread fires no Actions event at all — `pull_request_review_thread`
  # is a webhook GitHub does not accept as a trigger. So A16 is checked on the
  # last push, and again on the clock: the sweep below re-runs the check on every
  # open pull request and publishes the result as the check (solorepo's DR-105). The gap is
  # the interval. `workflow_dispatch` runs the same sweep on demand.
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  checks: write
  # The sweep asks whether the reviewer's door fired on each unread Challenge,
  # which is a listing of `triage.yml`'s runs (solorepo's DR-230).
  actions: read

# The job names below are what `main`'s ruleset should require as status checks
# (a ruleset, not a hook — solorepo's DR-056). Rename one here and every merge blocks: the
# ruleset waits on a check that nothing reports. `check_pr.py` reads the ruleset
# and compares, so the set is checked rather than remembered. There are two, and
# there stay two however many Projects this portfolio grows.
jobs:
  gate:
    name: gate
    if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' && github.event.action != 'edited'
    runs-on: ubuntu-latest
    # Public runner image on GHCR, pre-baking the single-source CLI toolchain
    # (solorepo's DR-160) alongside Python 3.13 as default python3 (solorepo's DR-268, solorepo's #775).
    container: ghcr.io/caindy/solorepo-runner:2.337.0-4
    steps:
      # The whole history, because `decision numbering` asks this portfolio's own
      # commits whether a hole in its record is an entry somebody deleted
      # (solorepo's DR-128), and a shallow checkout can only say it cannot tell.
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # `.meta/gate` and `check.py` run through `uvx`, pre-installed in the
      # single-source runner container (solorepo's DR-160).
      - run: .meta/gate

  pull-request:
    name: pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.meta/actions/pull-request
        with:
          number: ${{ github.event.pull_request.number }}
          token: ${{ github.token }}

  # The same check, on the clock, for every open pull request — and its result
  # published under the job name above, so the ruleset reads the sweep's
  # verdict as it read the push's. Not a required check itself: it is the
  # required check, run later.
  sweep:
    name: sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.meta/actions/sweep
        with:
          token: ${{ github.token }}
