# This portfolio's own structure. Never synced.

portfolio:
  id: work:portfolio/__PORTFOLIO_SLUG__
  name: __PORTFOLIO_NAME__
  description: __PORTFOLIO_DESCRIPTION__
  bounded_context: ddd:context/__PORTFOLIO_SLUG__

# A Product needs a primary Persona, so research the Persona first. Asserting a
# Product with an invented Persona satisfies the schema and defeats the point.
products: []

# One Project per toolchain: one language, one test suite, one gate. `.meta` is
# the first, seeded, so that `.meta/gate` has something to run from step three
# and `check.py` runs in CI from the portfolio's first pull request. A gate over
# no Projects is a failure, not a green run.
projects:
  - id: work:project/meta
    name: .meta
    description: >-
      The staging ground: the assertions and the tooling that renders and
      checks them.
    language: LinkML YAML, with Python for rendering and the gate
    gate: uvx --python 3.13 --with linkml --with pyyaml python .meta/check.py

# The artifacts a Decision names under `enacted_in`. A file earns an entry by
# being answerable for something.
artifacts:
  - id: work:artifact/agents
    name: AGENTS.md
    path: AGENTS.md
