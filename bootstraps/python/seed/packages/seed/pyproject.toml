[project]
name = "seed"
version = "0.1.0"
description = "The seed package a Python Project in a portfolio starts from"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# pytest reads the package's own manifest, so that the run the gate makes
# is the run mutmut repeats from inside the package. A hung test is a red
# gate, never a busy one.
[tool.pytest.ini_options]
testpaths = ["tests"]
faulthandler_timeout = 90
faulthandler_exit_on_timeout = true

[tool.hatch.build.targets.wheel]
packages = ["src/seed"]
